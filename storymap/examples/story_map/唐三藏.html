teLines": []}, {"name": "弘福寺", "ancientName": "弘福寺", "modernName": "陕西省西安市，具体遗址位置存疑", "lat": 34.26, "lng": 108.94, "type": "normal", "event": "在唐太宗支持下，组建国立译场，开始大规模翻译佛经，首批译出《菩萨藏经》等。", "time": "645年 - 648年", "duration": "约3年", "significance": "归国后第一个官方译经场所，译经事业的开端。", "works": ["菩萨藏经"], "quoteLines": []}, {"name": "大慈恩寺", "ancientName": "大慈恩寺", "modernName": "陕西省西安市大雁塔所在", "lat": 34.217, "lng": 108.964, "type": "normal", "event": "主持寺务及译经，为保存从印度带回的经像，主持修建大雁塔。译出《瑜伽师地论》等重要经典。", "time": "648年 - 658年", "duration": "约10年", "significance": "译经事业的中心阶段，大雁塔成为其精神与文化遗产的永恒象征。", "works": ["瑜伽师地论"], "quoteLines": []}, {"name": "玉华寺", "ancientName": "玉华寺", "modernName": "陕西省铜川市玉华宫遗址", "lat": 35.317, "lng": 108.883, "type": "death", "event": "在此完成最后一部巨著《大般若经》的翻译后，因跌倒受伤，不久圆寂。", "time": "664年", "duration": "约4年", "significance": "译经事业的终点与生命归宿，象征着为佛法“鞠躬尽瘁，死而后已”的精神。", "works": ["大般若经"], "quoteLines": ["《大般若经》（译）：“色不异空，空不异色，色即是空，空即是色”。"]}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《西游记》**（节选，如《三调芭蕉扇》《大闹天宫》等）；**《大唐西域记》**（节选，作为文言文或历史背景材料）。\n- 核心要点：\n    - **重点**：《西游记》中唐僧形象是**坚韧不拔**、**慈悲为怀**但有时显得迂腐的取经领袖，其原型即玄奘。\n    - **重点**：小说通过**神魔化**的叙事，将历史上的**孤身西行**演义为师徒四人的团队冒险，体现了对**信念**与**毅力**的歌颂。\n    - 《大唐西域记》文风**严谨朴实**，是重要的**地理历史文献**，与小说的浪漫想象形成鲜明对比。\n    - 玄奘在《西游记》中常被塑造为需要徒弟保护的角色，这与历史上他**意志坚定**、**学识渊博**的真实形象有所不同。\n    - **重点**：从历史到文学的演变，体现了中国文化对同一历史人物的**艺术再创造**过程。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**贞观之治**时期，社会相对安定，为玄奘西行提供了可能的物质与文化背景，但其出行本身是“违禁”的私人行为。\n    - 玄奘西行路线大致沿**丝绸之路**，经**河西走廊**、**西域**、**中亚**抵达**印度**。\n    - **重点**：在**那烂陀寺**的学习与在**曲女城**的辩论，是其印度之行的学术顶峰，获得了极高声誉。\n    - 归国后，在唐太宗、高宗支持下，于**弘福寺**、**大慈恩寺**等地主持**译经事业**。\n    - 其口述的**《大唐西域记》**是研究7世纪中亚、印度历史地理的**第一手珍贵资料**。\n- 核心要点：\n    - **重点**：玄奘西行是**个人意志**战胜官方禁令与自然险阻的壮举，体现了**追求真理**的宗教与学术精神。\n    - 他的活动是**唐代中外文化交流**的巅峰事件之一，不仅带回大量佛经，也向印度介绍了中国文化。\n    - **重点**：其译经工作系统、严谨，创立了“**五不翻**”原则，对汉传佛教义理的精确化影响深远。\n    - **重点**：作为历史人物，玄奘是**杰出的佛学家、旅行家、翻译家**；作为文化符号，他通过《西游记》成为**家喻户晓的文学形象**，两者共同构成了其完整的历史影响力。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《西游记》**（节选，如《三调芭蕉扇》《大闹天宫》等）；**《大唐西域记》**（节选，作为文言文或历史背景材料）。\n- 核心要点：\n    - **重点**：《西游记》中唐僧形象是**坚韧不拔**、**慈悲为怀**但有时显得迂腐的取经领袖，其原型即玄奘。\n    - **重点**：小说通过**神魔化**的叙事，将历史上的**孤身西行**演义为师徒四人的团队冒险，体现了对**信念**与**毅力**的歌颂。\n    - 《大唐西域记》文风**严谨朴实**，是重要的**地理历史文献**，与小说的浪漫想象形成鲜明对比。\n    - 玄奘在《西游记》中常被塑造为需要徒弟保护的角色，这与历史上他**意志坚定**、**学识渊博**的真实形象有所不同。\n    - **重点**：从历史到文学的演变，体现了中国文化对同一历史人物的**艺术再创造**过程。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**贞观之治**时期，社会相对安定，为玄奘西行提供了可能的物质与文化背景，但其出行本身是“违禁”的私人行为。\n    - 玄奘西行路线大致沿**丝绸之路**，经**河西走廊**、**西域**、**中亚**抵达**印度**。\n    - **重点**：在**那烂陀寺**的学习与在**曲女城**的辩论，是其印度之行的学术顶峰，获得了极高声誉。\n    - 归国后，在唐太宗、高宗支持下，于**弘福寺**、**大慈恩寺**等地主持**译经事业**。\n    - 其口述的**《大唐西域记》**是研究7世纪中亚、印度历史地理的**第一手珍贵资料**。\n- 核心要点：\n    - **重点**：玄奘西行是**个人意志**战胜官方禁令与自然险阻的壮举，体现了**追求真理**的宗教与学术精神。\n    - 他的活动是**唐代中外文化交流**的巅峰事件之一，不仅带回大量佛经，也向印度介绍了中国文化。\n    - **重点**：其译经工作系统、严谨，创立了“**五不翻**”原则，对汉传佛教义理的精确化影响深远。\n    - **重点**：作为历史人物，玄奘是**杰出的佛学家、旅行家、翻译家**；作为文化符号，他通过《西游记》成为**家喻户晓的文学形象**，两者共同构成了其完整的历史影响力。\n\n---", "markdown": "# 玄奘（唐三藏）\n\n## 人物档案\n\n### 基本信息\n- **姓名**：玄奘（法名，通称三藏法师，俗称唐僧）\n- **时代**：唐代\n- **出生**：约公元602年（存疑，另有600年说），洛州缑氏（今河南省洛阳市偃师区）\n- **去世**：公元664年，长安玉华寺（今陕西省铜川市玉华宫遗址）\n- **享年**：约62岁\n- **主要身份**：僧人、佛学家、翻译家、旅行家\n- **历史地位**：中国汉传佛教史上最伟大的译经师之一，也是杰出的中外文化交流使者。\n- **主要成就**：西行求法十七年，历尽艰辛抵达印度那烂陀寺学习；归国后主持译经事业，翻译佛经75部1335卷（另有带回佛经657部一说）；口述《大唐西域记》，成为研究中古时期中亚、南亚历史地理的珍贵文献。\n\n### 生平概述\n玄奘生于隋末，自幼聪慧，早年出家。为彻底解决佛学疑问，他于唐贞观三年（629年，一说贞观元年即627年）从长安出发，孤身西行，穿越河西走廊、西域诸国，翻越帕米尔高原，历经艰险抵达印度。他在当时印度的最高学府那烂陀寺学习五年，师从戒贤大师，并在全印辩论大会上扬名。贞观十九年（645年），他携带大量佛经、佛像返回长安，受到唐太宗礼遇。此后十九年，他全身心投入译经事业，直至在玉华寺圆寂，为中国佛教的发展做出了不可磨灭的贡献。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从大唐长安出发，西行穿越中亚，抵达印度那烂陀寺求学，最终携带经卷返回长安的万里孤征。\n- ⏱️ **时间跨度**：公元627/629年 - 公元664年，历时约37年（含西行17年与归国译经19年）。\n- 📍 **地理范围**：以长安为中心，西行覆盖今中国陕西、甘肃、新疆，中亚诸国，南亚印度、尼泊尔等地。\n- 🌟 **重要节点数量**：15个核心地点（含凌山）。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：洛州缑氏\n- **时间**：约公元602年\n- **停留时间**：约13年\n- **地点**：洛州缑氏（今河南省洛阳市偃师区）\n- **事件**：出生于陈氏家族，自幼聪颖，随兄长在洛阳净土寺学习佛经。\n- **意义**：佛教信仰的启蒙之地，为其日后出家求法奠定基础。\n\n### 📍 重要地点：长安\n- **时间**：约618年 - 627年；645年 - 664年\n- **停留时间**：前期约9年，后期19年\n- **地点**：长安（今陕西省西安市）\n- **事件**：前期在此精研佛理，深感经义分歧，决心西行；后期携带大量佛经（带回佛经数量一说657部）归来，受到唐太宗、高宗礼遇，主持大慈恩寺等译场。\n- **意义**：西行求法的起点与终点，后期译经事业的核心基地，其成就在此得到官方认可与支持。\n- **名篇名句**：《大唐西域记》：“亲践者一百一十国，传闻者二十八国”；《瑜伽师地论》（译）：“如实知见，离诸分别”。\n\n### 📍 重要地点：凉州\n- **时间**：约627年秋\n- **停留时间**：月余\n- **地点**：凉州（今甘肃省武威市）\n- **事件**：在此讲经，声名远播，但因当时禁止百姓出关，其西行意图被凉州都督李大亮察觉，被迫秘密离开。\n- **意义**：西行途中第一个重要关隘，遭遇官方阻力，凸显其决心。\n\n### 📍 重要地点：瓜州\n- **时间**：约627年冬\n- **停留时间**：月余\n- **地点**：瓜州（今甘肃省酒泉市瓜州县）\n- **事件**：在此得到州吏李昌帮助，偷渡玉门关，并收得胡人石槃陀为向导（《西游记》中孙悟空原型之一）。\n- **意义**：正式脱离唐朝管辖，踏入未知的西域荒漠。\n\n### 📍 重要地点：高昌国\n- **时间**：约628年初\n- **停留时间**：约一月\n- **地点**：高昌国（今新疆吐鲁番市高昌区）\n- **事件**：受到笃信佛教的高昌王麹文泰极高礼遇，结为兄弟，获得大量物资、人力资助及写给沿途国王的介绍信。\n- **意义**：获得了穿越西域的关键支持，是西行路上重要的转折点和助力来源。\n\n### 📍 重要地点：凌山（天山山脉）\n- **时间**：约628年夏\n- **停留时间**：数日\n- **地点**：凌山（今新疆与吉尔吉斯斯坦交界的天山别迭里山口）\n- **事件**：翻越海拔极高、终年积雪的冰达坂，队伍损失惨重，“徒侣之中餧冻死者，十有三四”。\n- **意义**：经历了西行途中最严酷的自然环境考验之一。\n\n### 📍 重要地点：碎叶城\n- **时间**：约628年\n- **停留时间**：短暂\n- **地点**：碎叶城（今吉尔吉斯斯坦托克马克市）\n- **事件**：经过西突厥可汗统叶护的牙帐，获得其保护与通行许可。\n- **意义**：获得了当时中亚霸主西突厥的政治庇护，保障了后续旅程的安全。\n\n### 📍 重要地点：梵衍那国\n- **时间**：约629年\n- **停留时间**：约半月\n- **地点**：梵衍那国（今阿富汗巴米扬省）\n- **事件**：瞻仰了著名的巴米扬大佛（东、西大佛），并学习《出世部》经典。\n- **意义**：见证了中亚辉煌的佛教艺术，丰富了其佛学见闻。\n\n### 📍 重要地点：那烂陀寺\n- **时间**：约631年 - 636年\n- **停留时间**：约5年\n- **地点**：那烂陀寺（今印度比哈尔邦巴特那东南）\n- **事件**：师从戒贤大师，系统学习《瑜伽师地论》等唯识经典，成为寺中通晓五十部经论的十大德之一，备受尊崇。\n- **意义**：西行求法的核心目的地与学术巅峰，在此达到了佛学研究的最高水平。\n\n### 📍 重要地点：曲女城\n- **时间**：约643年\n- **停留时间**：约两月\n- **地点**：曲女城（今印度北方邦卡瑙杰）\n- **事件**：参加戒日王举办的无遮大会，作为论主发表《真唯识量》，十八日无人能破，被大乘尊为“大乘天”，小乘尊为“解脱天”。\n- **意义**：学术声望达到顶峰，名震五印度，是其印度之行的最高荣誉。\n\n### 📍 重要地点：于阗\n- **时间**：约644年\n- **停留时间**：约七八个月\n- **地点**：于阗（今新疆和田地区）\n- **事件**：因渡河时损失部分经本，上表唐太宗请罪并等待回音，同时在当地讲经。\n- **意义**：归国途中在西域的重要停留点，其归来消息传至长安。\n\n### 📍 重要地点：洛阳\n- **时间**：645年\n- **停留时间**：短暂\n- **地点**：洛阳（今河南省洛阳市）\n- **事件**：唐太宗在洛阳宫仪鸾殿召见玄奘，详细询问西域见闻，并劝其还俗辅政，玄奘婉拒，专注译经。\n- **意义**：获得帝国最高统治者的正式接见与支持，为其译经事业扫清障碍。\n\n### 📍 重要地点：弘福寺\n- **时间**：645年 - 648年\n- **停留时间**：约3年\n- **地点**：弘福寺（今陕西省西安市，具体遗址位置存疑）\n- **事件**：在唐太宗支持下，组建国立译场，开始大规模翻译佛经，首批译出《菩萨藏经》等。\n- **意义**：归国后第一个官方译经场所，译经事业的开端。\n\n### 📍 重要地点：大慈恩寺\n- **时间**：648年 - 658年\n- **停留时间**：约10年\n- **地点**：大慈恩寺（今陕西省西安市大雁塔所在）\n- **事件**：主持寺务及译经，为保存从印度带回的经像，主持修建大雁塔。译出《瑜伽师地论》等重要经典。\n- **意义**：译经事业的中心阶段，大雁塔成为其精神与文化遗产的永恒象征。\n\n### 🔴 去世地：玉华寺\n- **时间**：664年\n- **停留时间**：约4年\n- **地点**：玉华寺（今陕西省铜川市玉华宫遗址）\n- **事件**：在此完成最后一部巨著《大般若经》的翻译后，因跌倒受伤，不久圆寂。\n- **意义**：译经事业的终点与生命归宿，象征着为佛法“鞠躬尽瘁，死而后已”的精神。\n- **名篇名句**：《大般若经》（译）：“色不异空，空不异色，色即是空，空即是色”。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 约602年 | 0岁 | 生于洛州缑氏。 |\n| 约612年 | 10岁 | 随兄长在洛阳净土寺出家。 |\n| 618年 | 约16岁 | 隋末战乱，与兄赴长安，后转往成都学习。 |\n| 622年 | 约20岁 | 在成都受具足戒，后游历荆州、赵州等地求学。 |\n| 约625年 | 约23岁 | 返回长安，深感经义分歧，萌生西行求法之志。 |\n| 627/629年 | 约25/27岁 | 违禁出关，孤身西行（一说贞观元年即627年，一说贞观三年即629年）。 |\n| 约628年夏 | 约26/28岁 | 翻越凌山（天山山脉），队伍损失惨重。 |\n| 628年 | 约26/28岁 | 抵达高昌国，获麹文泰鼎力资助。 |\n| 631年 | 约29/31岁 | 抵达印度那烂陀寺，师从戒贤大师。 |\n| 636年 | 约34/36岁 | 离开那烂陀寺，游学印度各地。 |\n| 643年 | 约41/43岁 | 在曲女城辩论大会获最高荣誉。 |\n| 645年 | 约43/45岁 | 携带大量佛经返回长安，受到盛大欢迎。 |\n| 645-664年 | 43-62岁 | 全力投入译经事业，共译经75部1335卷（另有带回佛经657部一说）。 |\n| 664年 | 约62岁 | 于玉华寺圆寂。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《西游记》**（节选，如《三调芭蕉扇》《大闹天宫》等）；**《大唐西域记》**（节选，作为文言文或历史背景材料）。\n- 核心要点：\n    - **重点**：《西游记》中唐僧形象是**坚韧不拔**、**慈悲为怀**但有时显得迂腐的取经领袖，其原型即玄奘。\n    - **重点**：小说通过**神魔化**的叙事，将历史上的**孤身西行**演义为师徒四人的团队冒险，体现了对**信念**与**毅力**的歌颂。\n    - 《大唐西域记》文风**严谨朴实**，是重要的**地理历史文献**，与小说的浪漫想象形成鲜明对比。\n    - 玄奘在《西游记》中常被塑造为需要徒弟保护的角色，这与历史上他**意志坚定**、**学识渊博**的真实形象有所不同。\n    - **重点**：从历史到文学的演变，体现了中国文化对同一历史人物的**艺术再创造**过程。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**贞观之治**时期，社会相对安定，为玄奘西行提供了可能的物质与文化背景，但其出行本身是“违禁”的私人行为。\n    - 玄奘西行路线大致沿**丝绸之路**，经**河西走廊**、**西域**、**中亚**抵达**印度**。\n    - **重点**：在**那烂陀寺**的学习与在**曲女城**的辩论，是其印度之行的学术顶峰，获得了极高声誉。\n    - 归国后，在唐太宗、高宗支持下，于**弘福寺**、**大慈恩寺**等地主持**译经事业**。\n    - 其口述的**《大唐西域记》**是研究7世纪中亚、印度历史地理的**第一手珍贵资料**。\n   const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};

root.render(<App />);
