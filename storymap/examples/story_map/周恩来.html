me": "陕西延安", "ancientName": "延安县", "modernName": "陕西省延安市", "lat": 36.5853, "lng": 109.4898, "type": "normal", "event": "代表中共中央长期驻重庆、南京进行谈判，但延安是其决策中心；参与领导整风运动和大生产运动。", "time": "1937年-1947年（断续）", "duration": "约10年（主要在抗战时期）", "significance": "作为中共对外代表和内部核心领导人，在延安指挥了国统区的统战与地下工作。", "works": [], "quoteLines": []}, {"name": "重庆", "ancientName": "巴县", "modernName": "重庆市", "lat": 29.4316, "lng": 106.9123, "type": "normal", "event": "任中共中央南方局书记，长期驻重庆，主持与国民党谈判，开展统战与文化界工作。", "time": "1938年-1946年（断续）", "duration": "累计约7年", "significance": "在国统区心脏地带坚持斗争，维护了抗日民族统一战线，扩大了中共的政治影响。", "works": [], "quoteLines": []}, {"name": "南京梅园新村", "ancientName": "南京", "modernName": "江苏省南京市", "lat": 32.0603, "lng": 118.7969, "type": "normal", "event": "率中共代表团驻南京，与国民党进行最后阶段的和平谈判，揭露其内战阴谋。", "time": "1946年-1947年", "duration": "约10个月", "significance": "在全面内战爆发前后，进行了艰苦卓绝的外交与政治斗争。", "works": [], "quoteLines": []}, {"name": "北京", "ancientName": "北平/北京", "modernName": "北京市", "lat": 39.9042, "lng": 116.4074, "type": "death", "event": "担任政务院（国务院）总理兼外交部长，主持国家建设与外交工作；在“文革”中苦撑危局；因癌症逝世。", "time": "1949年-1976年", "duration": "27年", "significance": "为新中国的内政外交、国防科技、文化教育等各项事业奠定了基础，其人格魅力成为国家道德的象征。", "works": [], "quoteLines": []}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---", "markdown": "# 周恩来\n\n## 人物档案\n\n### 基本信息\n- **姓名**：周恩来\n- **时代**：中国近现代\n- **出生**：公元1898年3月5日，淮安府山阳县（今江苏省淮安市淮安区）\n- **去世**：公元1976年1月8日，北京市（今北京市）\n- **享年**：78岁\n- **主要身份**：革命家、政治家、军事家、外交家、中国共产党和中华人民共和国主要领导人之一\n- **历史地位**：中华人民共和国开国元勋，以卓越的政治智慧、外交才能和无私奉献精神著称的人民总理。\n- **主要成就**：\n    - 领导上海工人第三次武装起义并取得胜利。\n    - 推动西安事变和平解决，促成抗日民族统一战线形成。\n    - 代表中国共产党在重庆与国民党进行长期谈判与统战工作。\n    - 担任新中国总理兼外交部长，首次完整提出**和平共处五项原则**。\n    - 在极端困难条件下维持国家基本运转，保护了大批干部和知识分子。\n\n### 生平概述\n周恩来，字翔宇，祖籍浙江绍兴，生于江苏淮安。早年求学于沈阳、天津，后赴日本、欧洲留学，期间确立共产主义信仰。归国后，他投身中国革命，历任黄埔军校政治部主任、中共中央军委书记等职，参与领导上海工人武装起义、南昌起义等。在长征、抗日战争和解放战争中，他始终处于领导核心，负责统战、军事与情报工作。新中国成立后，他长期担任国务院总理兼外交部长，在内政外交上殚精竭虑，为国家建设与和平发展作出不可磨灭的贡献，深受人民爱戴。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从苏北淮安出发，求学东北、津门，留学日本与西欧，归国后辗转于广州、上海、武汉、江西、陕北、重庆、南京等地领导革命与建国事业，最终在北京工作直至逝世。\n- ⏱️ **时间跨度**：1898年 - 1976年，共78年。\n- 📍 **地理范围**：覆盖中国东部、中部、西南、西北及欧洲（法国、德国）。\n- 🌟 **重要节点数量**：16个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：淮安\n- **时间**：1898年\n- **停留时间**：约12年（1898-1910）\n- **地点**：淮安府山阳县（今江苏省淮安市淮安区）\n- **事件**：出生于一个由衰败的官宦家庭，在此度过童年，接受私塾启蒙教育。\n- **意义**：故乡的文化底蕴和家庭变故塑造了他早熟、坚毅的性格与“为中华之崛起而读书”的志向。\n\n### 📍 重要地点：沈阳\n- **时间**：1910年-1913年\n- **停留时间**：约3年\n- **地点**：奉天府（今辽宁省沈阳市）\n- **事件**：随伯父在沈阳东关模范学校读书，接触新式教育。\n- **意义**：开阔了眼界，目睹了民族危亡，立下“为中华之崛起而读书”的宏愿。\n\n### 📍 重要地点：天津\n- **时间**：1913年-1917年\n- **停留时间**：约4年\n- **地点**：天津（今天津市）\n- **事件**：入读南开学校，积极参与演说、戏剧等社会活动，组织“敬业乐群会”。\n- **意义**：系统接受现代教育，锻炼了组织与领导才能，思想日趋进步。\n\n### 📍 重要地点：日本东京\n- **时间**：1917年-1919年\n- **停留时间**：约1年半\n- **地点**：东京府（今日本东京都）\n- **事件**：留学日本，考察日本社会，接触马克思主义思潮。\n- **意义**：思想发生重要转变，开始探索救国真理，但对日本军国主义保持清醒认识。\n- **名篇名句**：《大江歌罢掉头东》：“大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。”（作于1917年东渡日本前）\n\n### 📍 重要地点：法国巴黎\n- **时间**：1920年-1924年\n- **停留时间**：约4年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：勤工俭学，与赵世炎等组织旅欧中国少年共产党，后转入中国共产党，担任中共旅欧支部负责人。\n- **意义**：确立共产主义信仰，从爱国青年转变为职业革命家，培养了国际视野和组织能力。\n\n### 📍 重要地点：德国柏林\n- **时间**：1922年-1924年（频繁往返于巴黎）\n- **停留时间**：断续停留\n- **地点**：柏林（今德国柏林）\n- **事件**：在德从事革命活动，发展组织。\n- **意义**：扩展了中共旅欧支部的工作范围，深入研究欧洲工人运动。\n\n### 📍 重要地点：广州\n- **时间**：1924年-1926年\n- **停留时间**：约2年\n- **地点**：广州府（今广东省广州市）\n- **事件**：任黄埔军校政治部主任，国民革命军第一军政治部主任，参与领导两次东征。\n- **意义**：开创了革命军队的政治工作，为中共培养了早期军事政治骨干。\n\n### 📍 重要地点：上海\n- **时间**：1926年-1927年（及此后多次秘密工作）\n- **停留时间**：断续停留\n- **地点**：上海（今上海市）\n- **事件**：领导上海工人第三次武装起义并取得胜利；“四一二”政变后转入地下，主持中央军委、特科工作。\n- **意义**：展示了卓越的组织领导能力；在白色恐怖下建立了党的秘密保卫体系。\n\n### 📍 重要地点：武汉\n- **时间**：1927年\n- **停留时间**：数月\n- **地点**：武昌（今湖北省武汉市）\n- **事件**：出席中共五大，当选中央政治局委员；在汪精卫“分共”前夕部署应变。\n- **意义**：在革命危急关头进入中央核心领导层。\n\n### 📍 重要地点：江西瑞金\n- **时间**：1931年-1934年\n- **停留时间**：约3年\n- **地点**：瑞金县（今江西省瑞金市）\n- **事件**：进入中央苏区，任中共苏区中央局书记、中革军委副主席，参与指挥第四次反“围剿”。\n- **意义**：巩固了中央苏区，但后期在“左”倾路线影响下，未能阻止第五次反“围剿”失败。\n\n### 📍 重要地点：贵州遵义\n- **时间**：1935年\n- **停留时间**：短暂\n- **地点**：遵义县（今贵州省遵义市）\n- **事件**：出席遵义会议，支持毛泽东的正确主张，被确定为党内委托的对于指挥军事上下最后决心的负责者。\n- **意义**：在历史转折关头发挥了关键作用，确立了毛泽东在党和红军中的领导地位。\n\n### 📍 重要地点：陕西延安\n- **时间**：1937年-1947年（断续）\n- **停留时间**：约10年（主要在抗战时期）\n- **地点**：延安县（今陕西省延安市）\n- **事件**：代表中共中央长期驻重庆、南京进行谈判，但延安是其决策中心；参与领导整风运动和大生产运动。\n- **意义**：作为中共对外代表和内部核心领导人，在延安指挥了国统区的统战与地下工作。\n\n### 📍 重要地点：重庆\n- **时间**：1938年-1946年（断续）\n- **停留时间**：累计约7年\n- **地点**：巴县（今重庆市）\n- **事件**：任中共中央南方局书记，长期驻重庆，主持与国民党谈判，开展统战与文化界工作。\n- **意义**：在国统区心脏地带坚持斗争，维护了抗日民族统一战线，扩大了中共的政治影响。\n\n### 📍 重要地点：南京梅园新村\n- **时间**：1946年-1947年\n- **停留时间**：约10个月\n- **地点**：南京（今江苏省南京市）\n- **事件**：率中共代表团驻南京，与国民党进行最后阶段的和平谈判，揭露其内战阴谋。\n- **意义**：在全面内战爆发前后，进行了艰苦卓绝的外交与政治斗争。\n\n### 📍 重要地点：河北西柏坡\n- **时间**：1948年-1949年\n- **停留时间**：约1年\n- **地点**：平山县西柏坡村（今河北省石家庄市平山县）\n- **事件**：协助毛泽东指挥三大战役，参与筹备新中国成立事宜，主持起草《共同纲领》。\n- **意义**：作为中央军委副主席兼代总参谋长，为解放战争胜利和新中国诞生做了大量具体工作。\n\n### 🔴 去世地：北京\n- **时间**：1949年-1976年\n- **停留时间**：27年\n- **地点**：北平/北京（今北京市）\n- **事件**：担任政务院（国务院）总理兼外交部长，主持国家建设与外交工作；在“文革”中苦撑危局；因癌症逝世。\n- **意义**：为新中国的内政外交、国防科技、文化教育等各项事业奠定了基础，其人格魅力成为国家道德的象征。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1898 | 0 | 出生于江苏淮安。 |\n| 1910 | 12 | 随伯父赴沈阳读书。 |\n| 1913 | 15 | 入天津南开学校学习。 |\n| 1917 | 19 | 赴日本留学。 |\n| 1919 | 21 | 回天津，投身五四运动，组织觉悟社。 |\n| 1920 | 22 | 赴法国勤工俭学。 |\n| 1921 | 23 | 加入中国共产党。 |\n| 1924 | 26 | 回国，任黄埔军校政治部主任。 |\n| 1927 | 29 | 领导上海工人第三次武装起义；参加南昌起义。 |\n| 1931 | 33 | 进入中央苏区，任苏区中央局书记。 |\n| 1935 | 37 | 出席遵义会议，支持毛泽东。 |\n| 1936 | 38 | 赴西安和平解决西安事变。 |\n| 1937 | 39 | 代表中共与国民党谈判合作抗日。 |\n| 1945 | 47 | 陪同毛泽东赴重庆谈判。 |\n| 1949 | 51 | 当选政务院总理兼外交部长。 |\n| 1953 | 55 | 首次完整提出和平共处五项原则。 |\n| 1954 | 56 | 率团参加日内瓦会议。 |\n| 1972 | 74 | 推动中美关系正常化，接待尼克松访华。 |\n| 1976 | 78 | 在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 江苏省淮安市淮安区 | 33.5026 | 119.1380 |\n| 辽宁省沈阳市 | 41.8057 | 123.4315 |\n| 天津市 | 39.0842 | 117.2009 |\n| 日本东京都 | 35.6828 | 139.7595 |\n| 法国巴黎 | 48.8566 | 2.3522 |\n| 德国柏林 | 52.5200 | 13.4050 |\n| 广东省广州市 | 23.1291 | 113.2644 |\n| 上海 const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {

  const match = raw.match(/(\d{1,4})\s*年/);

  return y;
};

  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};

root.render(<App />);
