{"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《蒙娜丽莎》**（美术鉴赏）、**《最后的晚餐》**（美术鉴赏）\n- 核心要点：\n    - **重点**：**《蒙娜丽莎》** 的“**渐隐法**”（sfumato）技巧，创造了朦胧、神秘的视觉效果，尤其是嘴角和眼角的处理。\n    - **重点**：**《最后的晚餐》** 在构图上的**戏剧性瞬间**捕捉与**透视法**的完美运用，使画面具有强烈的空间纵深感和叙事张力。\n    - 达·芬奇的绘画体现了文艺复兴的**人文主义**精神，注重表现人物的**内心世界**和**情感**。\n    - 他坚持**直接观察自然**的原则，其画作中的光影、衣褶、背景都源于对现实的细致研究。\n    - **重点**：其艺术与科学紧密结合，例如通过**解剖学**研究来精确描绘人体结构与动态。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是**文艺复兴盛期**的代表人物，与米开朗基罗、拉斐尔并称“**文艺复兴三杰**”。\n    - 其生涯轨迹反映了当时意大利**城邦政治**的特点，艺术家依附于不同的宫廷和赞助人（如美第奇家族、斯福尔扎家族、法国国王）。\n    - **重点**：留下了大量未出版的**手稿**（如《阿伦德尔手稿》、《大西洋古抄本》），内容涵盖解剖、物理、工程、植物学等，体现了**跨学科**的“**通才**”（Uomo Universale）理想。\n- 核心要点：\n    - 达·芬奇的成就标志着**中世纪**向**近代**的思想过渡，其世界观基于**经验观察**和**理性分析**，而非纯粹的宗教教条。\n    - **重点**：他的科学探索（如流体力学、光学、解剖学）具有**前瞻性**，许多设计（如直升机、坦克草图）远超时代，但受限于当时的技术条件未能实现。\n    - **重点**：作为**艺术家**的身份最为公众熟知，但其**科学家**和**工程师**的贡献同样巨大，是**科学革命**的先驱之一。\n    - 他的人生诠释了文艺复兴的核心价值：对**知识**的无限渴求、对**美**的追求以及对**人类潜能**的信念。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《蒙娜丽莎》**（美术鉴赏）、**《最后的晚餐》**（美术鉴赏）\n- 核心要点：\n    - **重点**：**《蒙娜丽莎》** 的“**渐隐法**”（sfumato）技巧，创造了朦胧、神秘的视觉效果，尤其是嘴角和眼角的处理。\n    - **重点**：**《最后的晚餐》** 在构图上的**戏剧性瞬间**捕捉与**透视法**的完美运用，使画面具有强烈的空间纵深感和叙事张力。\n    - 达·芬奇的绘画体现了文艺复兴的**人文主义**精神，注重表现人物的**内心世界**和**情感**。\n    - 他坚持**直接观察自然**的原则，其画作中的光影、衣褶、背景都源于对现实的细致研究。\n    - **重点**：其艺术与科学紧密结合，例如通过**解剖学**研究来精确描绘人体结构与动态。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是**文艺复兴盛期**的代表人物，与米开朗基罗、拉斐尔并称“**文艺复兴三杰**”。\n    - 其生涯轨迹反映了当时意大利**城邦政治**的特点，艺术家依附于不同的宫廷和赞助人（如美第奇家族、斯福尔扎家族、法国国王）。\n    - **重点**：留下了大量未出版的**手稿**（如《阿伦德尔手稿》、《大西洋古抄本》），内容涵盖解剖、物理、工程、植物学等，体现了**跨学科**的“**通才**”（Uomo Universale）理想。\n- 核心要点：\n    - 达·芬奇的成就标志着**中世纪**向**近代**的思想过渡，其世界观基于**经验观察**和**理性分析**，而非纯粹的宗教教条。\n    - **重点**：他的科学探索（如流体力学、光学、解剖学）具有**前瞻性**，许多设计（如直升机、坦克草图）远超时代，但受限于当时的技术条件未能实现。\n    - **重点**：作为**艺术家**的身份最为公众熟知，但其**科学家**和**工程师**的贡献同样巨大，是**科学革命**的先驱之一。\n    - 他的人生诠释了文艺复兴的核心价值：对**知识**的无限渴求、对**美**的追求以及对**人类潜能**的信念。\n\n---", "markdown": "# 达·芬奇\n\n## 人物档案\n\n### 基本信息\n- **姓名**：列奥纳多·达·芬奇\n- **时代**：文艺复兴时期（15-16世纪）\n- **出生**：公元1452年4月15日，佛罗伦萨共和国芬奇镇（今意大利托斯卡纳大区芬奇镇）\n- **去世**：公元1519年5月2日，法兰西王国昂布瓦斯克洛吕斯庄园（今法国中央-卢瓦尔河谷大区昂布瓦斯）\n- **享年**：67岁\n- **主要身份**：画家、科学家、发明家、工程师、解剖学家\n- **历史地位**：欧洲文艺复兴时期最伟大的代表之一，是“文艺复兴艺术三杰”之首，也是人类历史上罕见的全才。\n- **主要成就**：创作了《蒙娜丽莎》、《最后的晚餐》等不朽画作；在解剖学、流体力学、光学、地质学等领域有开创性研究；设计了大量超越时代的机械草图，包括飞行器、军事器械和水利装置。\n\n### 生平概述\n达·芬奇出生于托斯卡纳的芬奇镇，是佛罗伦萨公证人与农家女的私生子。他早年在佛罗伦萨韦罗基奥的工坊当学徒，崭露头角。后服务于米兰的卢多维科·斯福尔扎公爵宫廷，期间创作了《最后的晚餐》并进行了广泛的科学研究。他一生辗转于佛罗伦萨、米兰、罗马、威尼斯等地，晚年受法王弗朗索瓦一世邀请移居法国，直至去世。他的艺术与科学探索体现了文艺复兴时期对人与自然的深刻观察与无限求知精神。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：芬奇镇\n- **时间**：公元1452年\n- **停留时间**：约12年\n- **地点**：今意大利托斯卡纳大区芬奇镇（佛罗伦萨共和国芬奇镇）\n- **事件**：出生并度过童年，对自然现象产生浓厚兴趣。\n- **意义**：乡村环境培养了他对自然观察的最初热情。\n\n### 📍 重要地点：佛罗伦萨\n- **时间**：约公元1466年 - 1482年\n- **停留时间**：约16年\n- **地点**：今意大利托斯卡纳大区佛罗伦萨（佛罗伦萨共和国佛罗伦萨）\n- **事件**：在安德烈·德尔·韦罗基奥的工坊学习绘画与雕塑；加入画家行会；创作《受胎告知》、《吉内薇拉·班琪》等早期作品。\n- **意义**：奠定了其艺术与科学基础，形成了早期的艺术风格。\n- **名篇名句**：《基督受洗》：与老师韦罗基奥合作绘制，其中一位天使被认为出自达·芬奇之手。\n\n### 📍 重要地点：米兰\n- **时间**：公元1482年 - 1499年\n- **停留时间**：约17年\n- **地点**：今意大利伦巴第大区米兰（米兰公国米兰）\n- **事件**：服务于卢多维科·斯福尔扎公爵宫廷；创作《岩间圣母》、《最后的晚餐》；进行大量解剖学、水利工程、军事工程和飞行器研究。\n- **意义**：艺术与科学创作的高峰期，完成了其最著名的壁画之一。\n- **名篇名句**：《最后的晚餐》：“你们中间有一个人要出卖我了。”\n\n### 📍 重要地点：威尼斯\n- **时间**：公元1500年初\n- **停留时间**：短暂访问，数月\n- **地点**：今意大利威尼托大区威尼斯（威尼斯共和国威尼斯）\n- **事件**：可能作为军事工程师，为威尼斯共和国提供抵御土耳其入侵的防御工事建议。\n- **意义**：展示了其工程学知识在实际军事防御中的应用。\n\n### 📍 重要地点：佛罗伦萨（第二次居留）\n- **时间**：公元1500年 - 1506年\n- **停留时间**：约6年\n- **地点**：今意大利托斯卡纳大区佛罗伦萨（佛罗伦萨共和国佛罗伦萨）\n- **事件**：为安农齐塔教堂绘制《圣母子与圣安妮》草图；受委托创作巨型壁画《安吉里之战》（未完成）；进行解剖学和鸟类飞行研究；开始绘制《蒙娜丽莎》。\n- **意义**：与米开朗基罗同场竞技，艺术上进入成熟期，科学探索持续深入。\n- **名篇名句**：《蒙娜丽莎》：“那微笑，被称为‘神秘的微笑’。”\n\n### 📍 重要地点：米兰（第二次居留）\n- **时间**：公元1506年 - 1513年\n- **停留时间**：约7年\n- **地点**：今意大利伦巴第大区米兰（法兰西王国控制的米兰公国米兰）\n- **事件**：受法国总督查尔斯·德·安布瓦斯庇护，继续科学研究；深入研究解剖学、几何学；创作《圣母子与圣安妮》、《施洗者圣约翰》。\n- **意义**：在动荡的政治环境中坚持艺术与科学探索。\n\n### 📍 重要地点：罗马\n- **时间**：公元1513年 - 1516年\n- **停留时间**：约3年\n- **地点**：今意大利拉齐奥大区罗马（教皇国罗马）\n- **事件**：受朱利亚诺·德·美第奇庇护，居住在梵蒂冈的贝尔维德雷宫；主要进行科学研究和解剖学实验，绘画创作较少；与拉斐尔、米开朗基罗同时在罗马。\n- **意义**：晚年专注于科学实验，但艺术创作相对沉寂。\n\n### 📍 重要地点：帕尔马\n- **时间**：公元1514年秋\n- **停留时间**：短暂停留\n- **地点**：今意大利艾米利亚-罗马涅大区帕尔马（帕尔马公国帕尔马）\n- **事件**：在前往罗马或从罗马返回的途中可能在此停留。\n- **意义**：旅途中的一个节点。\n\n### 🔴 去世地：昂布瓦斯克洛吕斯庄园\n- **时间**：公元1516年 - 1519年\n- **停留时间**：约3年\n- **地点**：今法国中央-卢瓦尔河谷大区昂布瓦斯（法兰西王国昂布瓦斯克洛吕斯庄园）\n- **事件**：受法王弗朗索瓦一世邀请，作为“国王首席画家、工程师和建筑师”居住于此；整理手稿；进行最后的科学研究；最终病逝。\n- **意义**：在法国宫廷度过晚年，受到极高礼遇，其大量手稿得以保存。\n- **名篇名句**：无直接作品，但其手稿中写道：“一日充实，可以安睡；一生充实，可以无憾。”\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1452 | 0 | 出生于佛罗伦萨共和国芬奇镇。 |\n| 约1466 | 约14 | 进入佛罗伦萨韦罗基奥工坊学徒。 |\n| 1472 | 20 | 加入佛罗伦萨画家行会。 |\n| 1478 | 26 | 获得独立委托，开始职业生涯。 |\n| 1482 | 30 | 移居米兰，服务于斯福尔扎宫廷。 |\n| 1495-1498 | 43-46 | 创作《最后的晚餐》。 |\n| 1499 | 47 | 离开米兰，开始辗转。 |\n| 1500 | 48 | 短暂访问威尼斯，后返回佛罗伦萨。 |\n| 1503-1506 | 51-54 | 开始创作《蒙娜丽莎》。 |\n| 1506 | 54 | 应法国总督之邀返回米兰。 |\n| 1513 | 61 | 移居罗马，居梵蒂冈。 |\n| 1516 | 64 | 应法王之邀移居法国昂布瓦斯。 |\n| 1519 | 67 | 在法国克洛吕斯庄园去世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《蒙娜丽莎》**（美术鉴赏）、**《最后的晚餐》**（美术鉴赏）\n- 核心要点：\n    - **重点**：**《蒙娜丽莎》** 的“**渐隐法**”（sfumato）技巧，创造了朦胧、神秘的视觉效果，尤其是嘴角和眼角的处理。\n    - **重点**：**《最后的晚餐》** 在构图上的**戏剧性瞬间**捕捉与**透视法**的完美运用，使画面具有强烈的空间纵深感和叙事张力。\n    - 达·芬奇的绘画体现了文艺复兴的**人文主义**精神，注重表现人物的**内心世界**和**情感**。\n    - 他坚持**直接观察自然**的原则，其画作中的光影、衣褶、背景都源于对现实的细致研究。\n    - **重点**：其艺术与科学紧密结合，例如通过**解剖学**研究来精确描绘人体结构与动态。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是**文艺复兴盛期**的代表人物，与米开朗基罗、拉斐尔并称“**文艺复兴三杰**”。\n    - 其生涯轨迹反映了当时意大利**城邦政治**的特点，艺术家依附于不同的宫廷和赞助人（如美第奇家族、斯福尔扎家族、法国国王）。\n    - **重点**：留下了大量未出版的**手稿**（如《阿伦德尔手稿》、《大西洋古抄本》），内容涵盖解剖、物理、工程、植物学等，体现了**跨学科**的“**通才**”（Uomo Universale）理想。\n- 核心要点：\n    - 达·芬奇的成就标志着**中世纪**向**近代**的思想过渡，其世界观基于**经验观察**和**理性分析**，而非纯粹的宗教教条。\n    - **重点**：他的科学探索（如流体力学、光学、解剖学）具有**前瞻性**，许多设计（如直升机、坦克草图）远超时代，但受限于当时的技术条件未能实现。\n    - **重点**：作为**艺术家**的身份最为公众熟知，但其**科学家**和**工程师**的贡献同样巨大，是**科学革命**的先驱之一。\n    - 他的人生诠释了文艺复兴的核心价值：对**知识**的无限渴求、对**美**的追求以及对**人类潜能**的信念。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {

          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</h2>
              <p className="text-[11px] text-gray-500 mt-1">进入足迹内容后，以第一人称与人物对话（依据史实）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="text-[11px] px-3 py-1 rounded bg-[#c0392b] text-white hover:bg-[#a93226]"
              >
                {chatOpen ? '收起' : '开始对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[#c8b496]/40 rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[#c0392b] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = String(m.content || '').trim();
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 bg-white text-gray-700">
                        正在回应…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
    <script>
      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
</body>
