**：**《陋室铭》**（作者存疑）通过描绘简陋居室，表达了作者**高洁傲岸**的节操和**安贫乐道**的隐逸情趣，采用托物言志的手法。\n    - **重点**：**《秋词》** 一反悲秋传统，抒发了诗人**乐观昂扬**、积极进取的豪情，体现了其独特的审美视角。\n    - **重点**：**《酬乐天扬州初逢席上见赠》** 中“沉舟侧畔千帆过，病树前头万木春”一联，以生动意象蕴含了**新陈代谢**、新旧交替的哲理，展现了诗人**豁达乐观**的襟怀。\n    - 诗歌风格**豪健雄奇**，常被称为“诗豪”。\n    - 善于从民歌中汲取营养，创作**《竹枝词》**等作品，语言清新活泼。\n    - 散文简洁精练，**《陋室铭》**是骈文名篇，对仗工整，音韵铿锵。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：中唐“**永贞革新**”的核心成员之一，改革失败导致其长达二十余年的**贬谪生涯**。\n    - 与**柳宗元**交谊深厚，并称“**刘柳**”；晚年与**白居易**唱和极多，并称“**刘白**”。\n    - 历任朗州司马、连州刺史、夔州刺史、和州刺史等地方官职。\n- 核心要点：\n    - **重点**：其人生轨迹是中唐**士人政治命运**与**党争**的典型缩影，革新失败后的长期贬谪深刻影响了他的创作与思想。\n    - **重点**：在哲学上提出“**天与人交相胜**”的观点，具有**唯物主义**倾向，反对天命论，在中国思想史上占有一席之地。\n    - **重点**：文学成就全面，诗歌、散文俱佳，其作品反映了中唐的社会风貌与个人坚韧不屈的精神，是**唐代文学**承前启后的重要人物。\n    - 他的贬谪经历和乐观诗篇，成为后世文人在逆境中汲取精神力量的重要源泉。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《陋室铭》**（作者存疑）、**《秋词》**、**《酬乐天扬州初逢席上见赠》**、《竹枝词》。\n- 核心要点：\n    - **重点**：**《陋室铭》**（作者存疑）通过描绘简陋居室，表达了作者**高洁傲岸**的节操和**安贫乐道**的隐逸情趣，采用托物言志的手法。\n    - **重点**：**《秋词》** 一反悲秋传统，抒发了诗人**乐观昂扬**、积极进取的豪情，体现了其独特的审美视角。\n    - **重点**：**《酬乐天扬州初逢席上见赠》** 中“沉舟侧畔千帆过，病树前头万木春”一联，以生动意象蕴含了**新陈代谢**、新旧交替的哲理，展现了诗人**豁达乐观**的襟怀。\n    - 诗歌风格**豪健雄奇**，常被称为“诗豪”。\n    - 善于从民歌中汲取营养，创作**《竹枝词》**等作品，语言清新活泼。\n    - 散文简洁精练，**《陋室铭》**是骈文名篇，对仗工整，音韵铿锵。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：中唐“**永贞革新**”的核心成员之一，改革失败导致其长达二十余年的**贬谪生涯**。\n    - 与**柳宗元**交谊深厚，并称“**刘柳**”；晚年与**白居易**唱和极多，并称“**刘白**”。\n    - 历任朗州司马、连州刺史、夔州刺史、和州刺史等地方官职。\n- 核心要点：\n    - **重点**：其人生轨迹是中唐**士人政治命运**与**党争**的典型缩影，革新失败后的长期贬谪深刻影响了他的创作与思想。\n    - **重点**：在哲学上提出“**天与人交相胜**”的观点，具有**唯物主义**倾向，反对天命论，在中国思想史上占有一席之地。\n    - **重点**：文学成就全面，诗歌、散文俱佳，其作品反映了中唐的社会风貌与个人坚韧不屈的精神，是**唐代文学**承前启后的重要人物。\n    - 他的贬谪经历和乐观诗篇，成为后世文人在逆境中汲取精神力量的重要源泉。\n\n---", "markdown": "# 刘禹锡\n\n## 人物档案\n\n### 基本信息\n- **姓名**：刘禹锡\n- **时代**：唐代（中唐）\n- **出生**：公元772年，出生地存疑，有浙江省嘉兴市、河南省洛阳市、江苏省徐州市（古称彭城）等多种说法。\n- **去世**：公元842年，古称洛阳（今河南省洛阳市）\n- **享年**：70岁（虚岁71岁，按传统虚岁计龄）\n- **主要身份**：诗人、文学家、哲学家\n- **历史地位**：中唐时期重要的文学家与政治人物，与柳宗元并称“刘柳”，与白居易并称“刘白”。\n- **主要成就**：创作大量政治讽刺诗与民歌体乐府诗；散文成就突出，传世名篇《陋室铭》（作者存疑）；提出“天与人交相胜”的唯物主义哲学观点；参与“永贞革新”。\n\n### 生平概述\n刘禹锡生于中唐，自幼好学，于贞元九年（793年）进士及第，后又登博学宏词科。他积极参与政治，是“永贞革新”的核心成员之一，试图改革弊政。革新失败后，长期被贬谪于朗州、连州、夔州、和州等边远地区长达二十余年。晚年虽被召回洛阳，任太子宾客等闲职，但其政治抱负未能再施展。他的诗歌豪健雄奇，充满昂扬乐观的精神，散文简洁精练，哲学思想具有唯物主义倾向，是唐代文学与思想史上的重要人物。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹北至长安、洛阳，南达连州、夔州，东抵和州（今安徽和县），覆盖了唐代中国中东部的主要政治文化中心与南方贬谪地。\n- ⏱️ **时间跨度**：公元772年 - 公元842年，总跨度约70年。\n- 📍 **地理范围**：大致覆盖今浙江、河南、陕西、湖南、广东、重庆、安徽、江苏等省份。\n- 🌟 **重要节点数量**：核心地点9个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 📍 出生地（存疑）\n- **时间**：公元772年\n- **停留时间**：约17年（772-789年左右）\n- **地点**：存疑，有今浙江省嘉兴市、河南省洛阳市、江苏省徐州市（古称彭城）等多种说法。\n- **事件**：出生于书香门第，自幼在此学习儒家经典，为日后科举打下基础。出生地另有洛阳、彭城（今徐州）等说法，存疑。\n- **意义**：人生起点，对其早期成长有重要影响。\n\n### 📍 重要地点：洛阳\n- **时间**：约公元789年-793年；公元836年-842年\n- **停留时间**：前期约4年（存疑），后期约6年\n- **地点**：古称东都洛阳（今河南省洛阳市）\n- **事件**：前期可能在此游学或居住，接触中原文化中心（此段经历存疑）。后期以太子宾客、秘书监等闲职分司东都，与白居易等友人诗酒唱和，直至去世。\n- **意义**：拓宽视野，为进入政治中心做准备；人生终点，在相对平静的闲居生活中度过最后岁月。\n- **名篇名句**：《酬乐天扬州初逢席上见赠》：“沉舟侧畔千帆过，病树前头万木春。”（此诗作于扬州，但常被用来概括其晚年豁达心境）\n\n### 📍 重要地点：长安\n- **时间**：公元793年及后续多次\n- **停留时间**：断续居住，累计数年\n- **地点**：古称京师长安（今陕西省西安市）\n- **事件**：贞元九年（793年）登进士第，同年登博学宏词科；后任监察御史；参与“永贞革新”；革新失败后被贬离京；晚年短暂回京。\n- **意义**：实现政治抱负的核心舞台，也是其人生重大转折（革新与被贬）的发生地。\n- **名篇名句**：《元和十年自朗州至京戏赠看花诸君子》：“玄都观里桃千树，尽是刘郎去后栽。”\n\n### 📍 重要地点：朗州\n- **时间**：公元805年-815年\n- **停留时间**：约10年\n- **地点**：古称朗州（今湖南省常德市）\n- **事件**：因“永贞革新”失败，初贬为朗州司马。在贬所期间，创作了大量诗文，深入接触当地民歌。\n- **意义**：贬谪生涯的开始，文学创作的第一个高峰期，哲学思想趋于成熟。\n- **名篇名句**：《秋词》：“自古逢秋悲寂寥，我言秋日胜春朝。”\n\n### 📍 重要地点：连州\n- **时间**：公元815年-819年\n- **停留时间**：约4年\n- **地点**：古称连州（今广东省连州市）\n- **事件**：短暂被召回京后，因诗作触怒权贵，再贬为连州刺史。819年因母丧奉柩北归。\n- **意义**：第二次重要贬谪，深入岭南，诗风更趋沉郁，关心地方民生。\n- **名篇名句**：《插田歌》：“冈头花草齐，燕子东西飞。”\n\n### 📍 重要地点：夔州\n- **时间**：公元821年-824年\n- **停留时间**：约3年\n- **地点**：古称夔州（今重庆市奉节县）\n- **事件**：调任夔州刺史。在此地学习并创作了大量仿民歌体的《竹枝词》。\n- **意义**：诗歌创作吸收巴楚民歌营养，形成独特风格，是其乐府诗的重要阶段。\n- **名篇名句**：《竹枝词二首·其一》：“东边日出西边雨，道是无晴却有晴。”\n\n### 📍 重要地点：和州\n- **时间**：公元824年-828年\n- **停留时间**：约4年\n- **地点**：古称和州（今安徽省和县）\n- **事件**：调任和州刺史。在此写下著名的《陋室铭》（创作地点有争议，但多与和州任上相关）。\n- **意义**：贬谪生涯的晚期，心境趋于豁达，文学成就广为 const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

        seen.add(t);
        out.push(t);

      return { doubtful: doubtful || out.length > 0, candidates: out };
    }
    if (!raw || !doubtful) return { doubtful: false, candidates: [] };
    const out = [];
    const seen = new Set();

            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
