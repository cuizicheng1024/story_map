yle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《观舞记》**、**《谈生命》**、**《荷叶·母亲》**、**《纸船》**、**《小桔灯》**\n- 核心要点：\n    - **重点**：作品普遍贯穿“**爱的哲学**”，即歌颂**母爱**、**童真**、**自然**。\n    - **重点**：语言风格**清丽典雅**、**柔美流畅**，被誉为“**冰心体**”。\n    - 善用**比喻**、**象征**等手法，如《谈生命》中将生命比作“一江春水”、“一棵小树”。\n    - **重点**：**《小桔灯》** 是**叙事散文**名篇，通过一个小姑娘的故事，含蓄表达了对**光明未来**的信念。\n    - **《荷叶·母亲》** 是典型的**托物言情**散文，借雨中荷叶护红莲，歌颂**母爱**的无私与伟大。\n    - **《纸船》** 抒发了对**母亲**的深切思念，意象**单纯**而情感**浓烈**。\n    - **重点**：其**儿童文学**作品（如《寄小读者》）视角**平等**、情感**真挚**，开创了现代儿童文学的新风。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是“**五四**”新文化运动中涌现出的第一批重要作家。\n    - **重点**：抗战期间辗转**昆明**、**重庆**，坚持文化抗战。\n    - 新中国成立后，长期担任**中国文联**、**中国作协**领导职务，参与**对外文化交流**。\n- 核心要点：\n    - **重点**：其文学生涯贯穿**中国现代文学史**全过程，是重要的**时代见证者**与**书写者**。\n    - 作品与思想反映了**五四**以来知识分子对**社会**、**人生**的探索。\n    - **重点**：晚年积极参与**文化交流**与**世界和平**事业，具有广泛的社会影响力。\n    - **重点**：其“**爱的哲学**”虽曾被批评为脱离阶级斗争，但作为人类美好情感的普遍表达，具有持久的**文学价值**与**人文价值**。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《观舞记》**、**《谈生命》**、**《荷叶·母亲》**、**《纸船》**、**《小桔灯》**\n- 核心要点：\n    - **重点**：作品普遍贯穿“**爱的哲学**”，即歌颂**母爱**、**童真**、**自然**。\n    - **重点**：语言风格**清丽典雅**、**柔美流畅**，被誉为“**冰心体**”。\n    - 善用**比喻**、**象征**等手法，如《谈生命》中将生命比作“一江春水”、“一棵小树”。\n    - **重点**：**《小桔灯》** 是**叙事散文**名篇，通过一个小姑娘的故事，含蓄表达了对**光明未来**的信念。\n    - **《荷叶·母亲》** 是典型的**托物言情**散文，借雨中荷叶护红莲，歌颂**母爱**的无私与伟大。\n    - **《纸船》** 抒发了对**母亲**的深切思念，意象**单纯**而情感**浓烈**。\n    - **重点**：其**儿童文学**作品（如《寄小读者》）视角**平等**、情感**真挚**，开创了现代儿童文学的新风。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是“**五四**”新文化运动中涌现出的第一批重要作家。\n    - **重点**：抗战期间辗转**昆明**、**重庆**，坚持文化抗战。\n    - 新中国成立后，长期担任**中国文联**、**中国作协**领导职务，参与**对外文化交流**。\n- 核心要点：\n    - **重点**：其文学生涯贯穿**中国现代文学史**全过程，是重要的**时代见证者**与**书写者**。\n    - 作品与思想反映了**五四**以来知识分子对**社会**、**人生**的探索。\n    - **重点**：晚年积极参与**文化交流**与**世界和平**事业，具有广泛的社会影响力。\n    - **重点**：其“**爱的哲学**”虽曾被批评为脱离阶级斗争，但作为人类美好情感的普遍表达，具有持久的**文学价值**与**人文价值**。\n\n---", "markdown": "# 冰心\n\n## 人物档案\n\n### 基本信息\n- **姓名**：谢婉莹\n- **时代**：中国近现代（清末至当代）\n- **出生**：公元1900年10月5日，福州府（今福建省福州市）\n- **去世**：公元1999年2月28日，北京（今北京市）\n- **享年**：98岁\n- **主要身份**：作家、翻译家、儿童文学作家、社会活动家\n- **历史地位**：中国现代文学史上最具影响力的女作家之一，以“爱的哲学”和清丽文风著称。\n- **主要成就**：开创“冰心体”散文与小诗；推动中国现代儿童文学发展；翻译大量外国文学作品；积极参与民主与和平运动。\n\n### 生平概述\n冰心出生于福州一个海军军官家庭，童年随家迁往山东烟台，在海边度过，孕育了其早期创作中对海与童真的歌颂。五四运动时期，她以“冰心”为笔名登上文坛，发表《超人》等小说和《繁星》《春水》等小诗集，宣扬母爱、童真与自然。后赴美国威尔斯利女子大学留学，归国后在燕京大学、清华大学任教，并于1929年与吴文藻结婚。抗战期间辗转至昆明，坚持写作。新中国成立后，她长期致力于儿童文学创作、翻译及对外文化交流工作，晚年仍笔耕不辍，其作品与人格影响深远。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要分布于中国东部沿海（福建、山东、北京）及美国，晚年定居北京。\n- ⏱️ **时间跨度**：1900年 - 1999年，近百年。\n- 📍 **地理范围**：覆盖福建、山东、北京、美国马萨诸塞州、云南等地。\n- 🌟 **重要节点数量**：核心地点10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：福州\n- **时间**：1900年\n- **停留时间**：约4年\n- **地点**：福州府（今福建省福州市）\n- **事件**：出生于隆普营，后迁居至杨桥巷（今杨桥路）的大家族宅院。\n- **意义**：家族文化与闽地人文环境的最初熏陶。\n\n### 📍 重要地点：烟台\n- **时间**：1903年 - 1911年\n- **停留时间**：约8年\n- **地点**：登州府烟台（今山东省烟台市）\n- **事件**：父亲谢葆璋任职海军军官，全家迁居于此。在海边度过童年，广泛阅读古典与西方小说。\n- **意义**：塑造了其性格与审美，大海成为其一生创作的核心意象。\n- **名篇名句**：《童年杂忆》：“我常常一个人跑到海边……”；《寄小读者·通讯七》：“海好像我的母亲……”\n\n### 📍 重要地点：北京（初居）\n- **时间**：1911年 - 1923年\n- **停留时间**：约12年\n- **地点**：顺天府（今北京市）\n- **事件**：入读贝满女中，后考入协和女子大学预科。积极投身五四运动，开始以“冰心”为笔名发表小说《两个家庭》《斯人独憔悴》及诗集《繁星》《春水》。\n- **意义**：文学创作的起点与成名之地，确立了关注社会与宣扬“爱的哲学”的基调。\n- **名篇名句**：《繁星·一》：“繁星闪烁着——深蓝的太空，何曾听得见他们对语？”；《春水·三三》：“墙角的花！你孤芳自赏时，天地便小了。”\n\n### 📍 重要地点：美国波士顿（留学）\n- **时间**：1923年 - 1926年\n- **停留时间**：约3年\n- **地点**：马萨诸塞州波士顿（今美国马萨诸塞州波士顿）\n- **事件**：入威尔斯利女子大学攻读英国文学硕士学位。期间创作《寄小读者》系列通讯。\n- **意义**：深化了文学素养，异国思乡经历丰富了其创作情感。\n- **名篇名句**：《寄小读者·通讯十》：“她爱我的肉体，她爱我的灵魂，她爱我前后左右，过去，将来，现在的一切！”\n\n### 📍 重要地点：北京（任教）\n- **时间**：1926年 - 1938年\n- **停留时间**：约12年\n- **地点**：京兆地方（今北京市）\n- **事件**：归国后任教于燕京大学、清华大学。与吴文藻结婚。创作小说《分》、《我们太太的客厅》等。\n- **意义**：进入创作成熟期与学术生涯稳定期，家庭生活美满。\n\n### 📍 重要地点：呈贡（抗战时期）\n- **时间**：1938年 - 1940年\n- **停留时间**：约2年\n- **地点**：呈贡县（今云南省昆明市呈贡区）\n- **事件**：抗战爆发后随校南迁至昆明，曾在呈贡简易师范学校义务任教。\n- **意义**：在艰苦的抗战环境中坚持教育和写作，体现知识分子气节。\n\n### 📍 重要地点：重庆（抗战时期）\n- **时间**：1940年 - 1946年\n- **停留时间**：约6年\n- **地点**：巴县（今重庆市）\n- **事件**：迁居重庆，继续从事文艺界抗敌工作，创作《关于女人》等作品。\n- **意义**：在战时首都参与文化抗战，作品风格更趋沉实。\n\n### 📍 重要地点：日本（战后）\n- **时间**：1946年 - 1951年\n- **停留时间**：约5年\n- **地点**：东京（今日本东京都）\n- **事件**：随丈夫吴文藻赴日，曾在东京大学讲授中国新文学。\n- **意义**：在国际舞台传播中国文化，亲历战后日本社会。\n\n### 📍 重要地点：北京（晚年定居）\n- **时间**：1951年 - 1999年\n- **停留时间**：约48年\n- **地点**：北京（今北京市）\n- **事件**：回国后定居北京，历任中国文联副主席、中国作协书记处书记等职。创作《小桔灯》、《再寄小读者》，翻译泰戈尔、纪伯伦作品。晚年获多项国家级荣誉。\n- **意义**：创作与社会活动的又一个高峰，成为国家文化象征之一。\n- **名篇名句**：《小桔灯》：“天黑了，路滑，这盏小桔灯照你上山吧！”；《谈生命》：“愿你生命中有够多的云翳，来造成一个美丽的黄昏。”\n\n### 🔴 去世地：北京\n- **时间**：1999年\n- **停留时间**：约48年（1951-1999）\n- **地点**：北京（今北京市）\n- **事件**：因病在北京医院逝世。\n- **意义**：走完近一个世纪的文学生命旅程，安息于她后半生主要生活和工作的地方。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1900年 | 0岁 | 出生于福建福州。 |\n| 1903年 | 3岁 | 随家迁居山东烟台。 |\n| 1911年 | 11岁 | 随家迁居北京，入读教会学校。 |\n| 1919年 | 19岁 | 五四运动爆发，以“冰心”为笔名发表文章，登上文坛。 |\n| 1923年 | 23岁 | 燕京大学毕业，赴美国威尔斯利女子大学留学。 |\n| 1926年 | 26岁 | 获硕士学位归国，任教于燕京大学。 |\n| 1929年 | 29岁 | 与社会学家吴文藻结婚。 |\n| 1938年 | 38岁 | 抗战全面爆发后，离京南下昆明。 |\n| 1940年 | 40岁 | 迁居重庆，参与文艺界抗敌活动。 |\n| 1946年 | 46岁 | 赴日本东京。 |\n| 1951年 | 51岁 | 从日本返回北京。 |\n| 1954年 | 54岁 | 当选第一届全国人大代表。 |\n| 1958年 | 58岁 | 发表《再寄小读者》。 |\n| 1980年 | 80岁 | 因脑血栓患病，仍坚持写作。 |\n| 1999年 | 98岁 | 在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《观舞记》**、**《谈生命》**、**《荷叶·母亲》**、**《纸船》**、**《小桔灯》**\n- 核心要点：\n    - **重点**：作品普遍贯穿“**爱的哲学**”，即歌颂**母爱**、**童真**、**自然**。\n    - **重点**：语言风格**清丽典雅**、**柔美流畅**，被誉为“**冰心体**”。\n    - 善用**比喻**、**象征**等手法，如《谈生命》中将生命比作“一江春水”、“一棵小树”。\n    - **重点**：**《小桔灯》** 是**叙事散文**名篇，通过一个小姑娘的故事，含蓄表达了对**光明未来**的信念。\n    - **《荷叶·母亲》** 是典型的**托物言情**散文，借雨中荷叶护红莲，歌颂**母爱**的无私与伟大。\n    - **《纸船》** 抒发了对**母亲**的深切思念，意象**单纯**而情感**浓烈**。\n    - **重点**：其**儿童文学**作品（如《寄小读者》）视角**平等**、情感**真挚**，开创了现代儿童文学的新风。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是“**五四**”新文化运动中涌现出的第一批重要作家。\n    - **重点**：抗战期间辗转**昆明**、**重庆**，坚持文化抗战。\n    - 新中国成立后，长期担任**中国文联**、**中国作协**领导职务，参与**对外文化交流**。\n- 核心要点：\n    - **重点**：其文学生涯贯穿**中国现代文学史**全过程，是重要的**时代见证者**与**书写者**。\n    - 作品与思想反映了**五四**以来知识分子对**社会**、**人生**的探索。\n    - **重点**：晚年积极参与*   const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {

    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);

    if (out.length >= (maxItems || 5)) break;
  }

};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
