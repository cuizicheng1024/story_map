rks": ["加歇医生像", "奥维尔教堂", "麦田群鸦"], "quoteLines": ["《麦田群鸦》：“我的悲伤将永远留存。”"]}, {"name": "拉乌旅馆（奥维尔）", "ancientName": "拉乌旅馆（奥维尔）", "modernName": "法国瓦兹河畔奥维尔（Auvers-sur-Oise）拉乌旅馆（Auberge Ravoux）", "lat": 49.0714, "lng": 2.1747, "type": "death", "event": "7月27日傍晚在麦田腹部中枪（自杀或意外枪击，说法不一），负伤后走回旅馆。弟弟提奥闻讯赶来，梵高在其怀中于7月29日凌晨去世。", "time": "1890年7月29日", "duration": "去世前约两天（受伤后返回旅馆）", "significance": "人生悲剧的落幕之地。", "works": [], "quoteLines": ["遗言（对提奥）：“悲伤将永远留存。”（La tristesse durera toujours.）"]}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 初中阶段\n- **国籍与时代**：**荷兰**画家，活跃于**19世纪后期**。\n- **艺术流派**：**后印象派**代表画家之一。\n- **代表作品**：**《向日葵》**、**《星月夜》**（常被提及，但创作于圣雷米）。\n- **艺术特点**：色彩**强烈、鲜艳**，笔触**粗厚、富有动感**，充满个人情感。\n- **人生经历**：生前作品不被认可，生活贫困，依靠弟弟**提奥**支持。\n- **精神健康**：患有精神疾病（具体诊断有多种理论，如癫痫、双相情感障碍等，说法不一）。\n- **去世**：37岁时**自杀**身亡（说法一）。\n- **对比点**：与**莫奈**（印象派）对比，梵高更注重**主观情感**表达而非客观光影。\n\n### 高中阶段\n- **艺术史地位**：**后印象派**三杰之一（与塞尚、高更并列），被视为**表现主义**的先驱。\n- **风格演变**：早期（荷兰）色调**阴暗**（如《吃土豆的人》）；**巴黎时期**受**印象派**和**日本浮世绘**影响，色彩变亮；**阿尔勒及以后**形成独特风格。\n- **创作理念**：用色彩和线条**直接表达内心激情与精神世界**，艺术是“表现”而非“再现”。\n- **重要关系**：与弟弟**提奥**的书信是研究其艺术思想的核心文献；与**高更**的友谊与冲突是其人生转折点。\n- **代表作分析**：《星月夜》中**旋涡状的星空**、**火焰般的柏树**是其内心动荡与宇宙观的象征。\n- **历史影响**：对**德国表现主义**（如基希纳）、**野兽派**（如马蒂斯）产生直接影响。\n- **易混点**：**后印象派**并非“印象派之后”，而是对印象派“重客观光色”的反拨，强调**主观表现**和**形式结构**。\n\n---", "examPoints": "### 初中阶段考点\n1.  **国籍**：荷兰。\n2.  **艺术流派**：后印象派。\n3.  **代表作品**：《向日葵》、《星月夜》。\n4.  **艺术特点**：色彩大胆、对比强烈，笔触明显，富有情感。\n5.  **人生关键词**：贫困、精神病、割耳、自杀、弟弟提奥。\n6.  **作品识别**：能辨认其画作的典型风格（如厚重的笔触、明亮的黄色）。\n\n### 高中阶段考点\n1.  **艺术史定位**：后印象派代表，表现主义先驱。\n2.  **风格分期与成因**：荷兰时期、巴黎时期、阿尔勒-圣雷米时期的风格变化及原因（印象派、浮世绘影响）。\n3.  **核心艺术观**：强调主观情感和精神世界的表达。\n4.  **重要关系**：与提奥的经济与精神纽带；与高更的合作与决裂。\n5.  **代表作内涵分析**：《星月夜》、《夜间咖啡馆》等作品中的象征意义与情感表达。\n6.  **对后世的影响**：对20世纪现代艺术流派（表现主义、野兽派）的启发。\n7.  **存疑/说法不一**：割耳的具体原因（与高更争吵自残/高更割伤后包庇）；死亡是自杀还是意外枪击。", "markdown": "# 文森特·威廉·梵高\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：文森特·威廉·梵高（Vincent Willem van Gogh）\n- **时代**：19世纪（后印象派时期）\n- **出生**：1853年3月30日，荷兰北布拉班特省津德尔特\n- **去世**：1890年7月29日，法国瓦兹河畔奥维尔\n- **享年**：37岁\n- **主要身份**：画家、后印象派先驱\n- **历史地位**：对20世纪艺术发展产生深远影响的先驱，其艺术与人生成为现代艺术精神的象征。\n- **主要成就**：开创表现主义先河，深刻影响现代艺术；据不同统计，一生创作了约2000幅作品，包括约860幅油画，如《星月夜》《向日葵》系列等。（注：其在生命最后约70天于奥维尔创作了约70幅作品。）\n\n### 生平概述\n梵高出生于荷兰，早年曾从事画商、教师、传教士等职业，生活坎坷。27岁时决心投身绘画，早期作品色调阴暗。1886年前往巴黎，接触印象派与日本浮世绘，画风变得明亮、色彩丰富。1888年移居法国南部阿尔勒，迎来创作高峰，但与画家高更关系破裂，精神崩溃并割下部分耳朵。此后在圣雷米精神病院治疗期间仍坚持创作，作品充满强烈的情感与旋涡般的笔触。1890年7月27日，在瓦兹河畔奥维尔腹部中枪（自杀或意外枪击，说法不一），两日后去世，结束了短暂而炽热的一生。他的艺术在其生前几乎无人问津，却在身后成为不朽经典。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从荷兰到英国、比利时，最终在法国南部与巴黎地区完成艺术蜕变。\n- ⏱️ **时间跨度**：1853年 - 1890年，共37年。\n- 📍 **地理范围**：荷兰、英国、比利时、法国。\n- 🌟 **重要节点数量**：10个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：津德尔特\n- **公元纪年**：1853年 - 1869年\n- **停留时间**：童年及青少年早期（约16年）\n- **位置**：荷兰北布拉班特省津德尔特（Groot-Zundert）\n- **事迹**：在此度过童年，父亲是当地牧师。自然环境与乡村景象成为其早期艺术灵感的来源。\n- **意义**：艺术与宗教情感的启蒙之地。\n\n### 📍 重要地点：海牙\n- **公元纪年**：1869年 - 1873年；1881年 - 1883年\n- **停留时间**：首次作为画店学徒约4年；第二次作为画家定居约2年\n- **位置**：荷兰海牙（Den Haag）\n- **事迹**：在古皮尔画店工作，首次接触艺术市场；后跟随亲戚安东·莫夫学画，开始早期创作，并与模特西恩（Sien）共同生活。\n- **意义**：艺术生涯的起点，经历了从艺术爱好者到实践者的转变。\n- **名篇名句**：《吃土豆的人》：“我想表达的是，这些在油灯下吃土豆的人，正是用他们那双挖掘泥土的手，去挖掘食物的。”\n\n### 📍 重要地点：伦敦\n- **公元纪年**：1873年 - 1876年\n- **停留时间**：约3年\n- **位置**：英国伦敦（London）\n- **事迹**：在古皮尔画店伦敦分店工作，广泛参观博物馆，深受英国文学与艺术影响。单相思房东女儿失败，情感受挫。\n- **意义**：开阔了艺术视野，但情感上的打击使其性格愈发内向与忧郁。\n\n### 📍 重要地点：博里纳日矿区\n- **公元纪年**：1878年 - 1880年\n- **停留时间**：约2年\n- **位置**：比利时埃诺省蒙斯区博里纳日（Borinage, Hainaut）\n- **事迹**：作为传教士在贫困矿区工作，与矿工同甘共苦，因过度虔诚被教会解雇。目睹底层苦难，决心用艺术为穷人发声。\n- **意义**：人生观与艺术观的决定性转折点，坚定了成为“农民画家”的决心。\n- **名篇名句**：致弟弟提奥的信：“我将全力以赴，用画笔来表达我内心深处的情感。”\n\n### 📍 重要地点：巴黎\n- **公元纪年**：1886年2月 - 1888年2月\n- **停留时间**：约2年\n- **位置**：法国巴黎（Paris）\n- **事迹**：与弟弟提奥同住，进入科尔蒙画室学习，结识高更、劳特累克、贝尔纳等艺术家。深受印象派、新印象派及日本浮世绘影响，画风从灰暗转向明亮，色彩革命开始。\n- **意义**：艺术风格的彻底转型期，从荷兰写实主义走向现代艺术。\n- **名篇名句**：《唐吉老爹》：“色彩本身就表达某种东西。”\n\n### 📍 重要地点：阿尔勒\n- **公元纪年**：1888年2月 - 1889年5月\n- **停留时间**：约1年3个月\n- **位置**：法国南部普罗旺斯阿尔勒（Arles）\n- **事迹**：为追寻南方阳光而移居，创作力爆发，绘制了《向日葵》《夜间咖啡馆》《阿尔勒的卧室》等杰作。邀请高更同住，梦想建立“南方画室”，但两人激烈争吵，导致梵高精神崩溃，发生“割耳事件”。\n- **意义**：创作生涯的巅峰与转折点，个人悲剧的发生地。\n- **名篇名句**：《星月夜》（创作于圣雷米，灵感部分源于阿尔勒）：“我需要太阳，它把我内心的寒冷驱散，把我的阴影染成金色。”；《夜间咖啡馆》：“我试图用红色和绿色来表现人类可怕的激情。”\n\n### 📍 重要地点：圣保罗疗养院（圣雷米）\n- **公元纪年**：1889年5月 - 1890年5月\n- **停留时间**：约1年\n- **位置**：法国普罗旺斯圣雷米-德普罗旺斯（Saint-Rémy-de-Provence）\n- **事迹**：自愿入住精神病院，在病情间歇期坚持创作。作品充满旋涡般的笔触与强烈的情感表达，如《鸢尾花》《星月夜》《柏树》系列。\n- **意义**：在精神痛苦中达到艺术表现的巅峰，作品开始蕴含象征性与表现主义色彩。\n- **名篇名句**：《星月夜》：“望着星星，我总是开始做梦……我问自己，为什么天空中闪亮的点，不能像法国地图上的黑点那样容易到达呢？”\n\n### 📍 重要地点：瓦兹河畔奥维尔\n- **公元纪年**：1890年5月 - 1890年7月\n- **停留时间**：约70天\n- **位置**：法国法兰西岛大区瓦兹河谷省奥维尔（Auvers-sur-Oise）\n- **事迹**：在加歇医生监护下疗养并疯狂创作，画了约70幅作品，包括《加歇医生像》《奥维尔教堂》《麦田群鸦》。7月27日，在麦田中腹部中枪（自杀或意外枪击，说法不一），两日后在旅馆去世。\n- **意义**：生命的终点与最后的创作爆发地。\n- **名篇名句**：《麦田群鸦》：“我的悲伤将永远留存。”\n\n### 🔴 去世地：拉乌旅馆（奥维尔）\n- **公元纪年**：1890年7月29日\n- **停留时间**：去世前约两天（受伤后返回旅馆）\n- **位置**：法国瓦兹河畔奥维尔（Auvers-sur-Oise）拉乌旅馆（Auberge Ravoux）\n- **经过**：7月27日傍晚在麦田腹部中枪（自杀或意外枪击，说法不一），负伤后走回旅馆。弟弟提奥闻讯赶来，梵高在其怀中于7月29日凌晨去世。\n- **意义**：人生悲剧的落幕之地。\n- **名篇名句**：遗言（对提奥）：“悲伤将永远留存。”（La tristesse durera toujours.）\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1853 | 0 | 出生于荷兰津德尔特。 |\n| 1869 | 16 | 进入海牙古皮尔画店工作，接触艺术商业。 |\n| 1873 | 20 | 调往伦敦分店，艺术视野大开，情感受挫。 |\n| 1876 | 23 | 被解雇，辗转英国和荷兰做教师、书店店员。 |\n| 1878 | 25 | 前往比利时博里纳日矿区传教，决心投身艺术。 |\n| 1880 | 27 | 正式决定成为画家，前往布鲁塞尔学习（短暂学习，未列入重要地点）。 |\n| 1881 | 28 | 回到埃顿和海牙，向莫夫学画，与西恩同居。 |\n| 1885 | 32 | 父亲去世，创作《吃土豆的人》。 |\n| 1886 | 33 | 移居巴黎，结识印象派画家，画风巨变。 |\n| 1888 | 35 | 移居阿尔勒，创作《向日葵》系列，邀请高更。 |\n| 1888.12 | 35 | 与高更争吵后割耳（“割耳事件”）。 |\n| 1889 | 36 | 入住圣雷米精神病院，创作《星月夜》等。 |\n| 1890 | 37 | 前往奥维尔，接受加歇医生照料，创作最后一批作品。 |\n| 1890.7.27 | 37 | 在奥维尔麦田中腹部中枪（自杀或意外，说法不一）。 |\n| 1890.7.29 | 37 | 在提奥的陪伴下去世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n梵高生前仅卖出过一幅画（《红色葡萄园》），其激进的色彩和笔触不被主流艺术界接受，被视为“疯子”画家。他的艺术实践在当时是孤独的先锋实验，主要通过弟弟提奥的经济与精神支持得以维系。\n\n### 对后世的影响\n1.  **艺术风格**：直接启发了德国表现主义和法国野兽派，其强调主观情感与色彩表现力的方法成为现代艺术的重要基石。\n2.  **艺术家形象**：塑造了“生前潦倒、死后辉煌”的悲剧天才原型，其充满激情与痛苦的人生故事成为流行文化中不朽的传奇。\n3.  **市场与传播**：作品成为全球最著名、拍卖价格最高的艺术品之一，深刻影响了公众对现代艺术的认知与接受度。\n\n### 历史评价\n1.  艺术史家休·昂纳：“梵高不是在画他所见，而是在画他所感。”\n2.  画家亨利·德·图卢兹-劳特累克：“他的色彩像炸药，他的光线像发光的金属。”\n3.  后世普遍认为，梵高用燃烧生命的热情作画，将个人苦难转化为普世的艺术力量，实现了艺术史上最动人的自我超越。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **国籍与时代**：**荷兰**画家，活跃于**19世纪后期**。\n- **艺术流派**：**后印象派**代表画家之一。\n- **代表作品**：**《向日葵》**、**《星月夜》**（常被提及，但创作于圣雷米）。\n- **艺术特点**：色彩**强烈、鲜艳**，笔触**粗厚、富有动感**，充满个人情感。\n- **人生经历**：生前作品不被认可，生活贫困，依靠弟弟**提奥**支持。\n- **精神健康**：患有精神疾病（具体诊断有多种理论，如癫痫、双相情感障碍等，说法不一）。\n- **去世**：37岁时**自杀**身亡（说法一）。\n- **对比点**：与**莫奈**（印象派）对比，梵高更注重**主观情感**表达而非客观光影。\n\n### 高中阶段\n- **艺术史地位**：**后印象派**三杰之一（与塞尚、高更并列），被视为**表现主义**的先驱。\n- **风格演变**：早期（荷兰）色调**阴暗**（如《吃土豆的人》）；**巴黎时期**受**印象派**和**日本浮世绘**影响，色彩变亮；**阿尔勒及以后**形成独特风格。\n- **创作理念**：用色彩和线条**直接表达内心激情与精神世界**，艺术是“表现”而非“再现”。\n- **重要关系**：与弟弟**提奥**的书信是研究其艺术思想的核心文献；与**高更**的友谊与冲突是其人生转折点。\n- **代表作分析**：《星月夜》中**旋涡状的星空**、**火焰般的柏树**是其内心动荡与宇宙观的象征。\n- **历史影响**：对**德国表现主义**（如基希纳）、**野兽派**（如马蒂斯）产生直接影响。\n- **易混点**：**后印象派**并非“印象派之后”，而是对印象派“重客观光色”的反拨，强调**主观表现**和**形式结构**。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **国籍**：荷兰。\n2.  **艺术流派**：后印象派。\n3.  **代表作品**：《向日葵》、《星月夜》。\n4.  **艺术特点**：色彩大胆、对比强烈，笔触明显，富有情感。\n5.  **人生关键词**：贫困、精神病、割耳、自杀、弟弟提奥。\n6.  **作品识别**：能辨认其画作的典型风格（如厚重的笔触、明亮的黄色）。\n\n### 高中阶段考点\n1.  **艺术史定位**：后印象派代表，表现主义先驱。\n2.  **风格分期与成因**：荷兰时期、巴黎时期、阿尔勒-圣雷米时期的风格变化及原因（印象派、浮世绘影响）。\n3.  **核心艺术观**：强调主观情感和精神世界的表达。\n4.  **重要关系**：与提奥的经济与精神纽带；与高更的合作与决裂。\n5.  **代表作内涵分析**：《星月夜》、《夜间咖啡馆》等作品中的象征意义与情感表达。\n6.  **对后世的影响**：对20世纪现代艺术流派（表现主义、野兽派）的启发。\n7.  **存疑/说法不一**：割耳的具体原因（与高更争吵自残/高更割伤后包庇）；死亡是自杀还是意外枪击。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 津德尔特 | 荷兰北布拉班特省津德尔特 | 51.4717 | 4.6556 |\n| 海牙 | 荷兰海牙 | 52.0705 | 4.3007 |\n| 伦敦 | 英国伦敦 | 51.5074 | -0.1278 |\n| 博里纳日矿区 | 比利时埃诺省蒙斯区博里纳日 | 50.4549 | 3.8333 |\n| 巴黎 | 法国巴黎 | 48.8566 | 2.3522 |\n| 阿尔勒 | 法国普罗旺斯阿尔勒 | 43.6766 | 4.6278 |\n| 圣雷米 | 法国普罗旺斯圣雷米-德普罗旺斯 | 43.7102 | 4.8311 |\n| 奥维尔 | 法国瓦兹河畔奥维尔 | 49.0714 | 2.1747 |"};

const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const current = options.find((o) => o.id === value) || options[0] || { id: '', label: '' };
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(!open)}
        className="glass-panel rounded-lg px-3 py-1.5 text-xs flex items-center gap-2 shadow-lg hover:bg-white/95 transition-colors"
      >
        <span className="text-gray-500">{label}</span>
        <span className="text-[#7c2d12] font-bold">{current.label}</span>
        <span className="text-gray-400 text-[10px]">▾</span>
      </button>
      {open ? (
        <div className="absolute top-full right-0 mt-1 glass-panel rounded-lg shadow-xl py-1 min-w-[120px] z-20">
          {options.map((opt) => (
            <button
              key={opt.id}
              onClick={() => { onChange(opt.id); setOpen(false); }}
              className={`w-full text-left px-3 py-1.5 text-xs hover:bg-amber-50 transition-colors ${
                opt.id === value ? 'text-[#c0392b] font-bold bg-amber-50/60' : 'text-gray-700'

            >

            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
};

    }
    if (!raw || !doubtful) return { doubtful: false, candidates: [] };
    const out = [];
    const seen = new Set();
    const re = /(?:一说|或说|又说|另说)\s*(?:生于|生在|在)?\s*([^，。；;）)\n]+)\s*/g;
    let m = null;

    seen.clear();

      push('相关作品', relatedWorks.slice(0, 3).map((w) => `《${w}》`).join('、'));
    }
    return out;
  }, [relatedWorks]);
  const clampValue = (value, min, max) => Math.min(max, Math.max(min, value));
  const hexToRgba = (hex, alpha) => {
    const s = String(hex || '').replace('#', '').trim();
    const raw = s.length === 3 ? s.split('').map((x) => x + x).join('') : s;
    if (!/^[0-9a-fA-F]{6}$/.test(raw)) return `rgba(192,57,43,${alpha})`;
    const r = parseInt(raw.slice(0, 2), 16);
    const g = parseInt(raw.slice(2, 4), 16);
    const b = parseInt(raw.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  };
  const mixHex = (a, b, t) => {
    const parse = (hex) => {
      const s = String(hex || '').replace('#', '').trim();
      const raw = s.length === 3 ? s.split('').map((x) => x + x).join('') : s;
      if (!/^[0-9a-fA-F]{6}$/.test(raw)) return [192, 57, 43];
      return [
        parseInt(raw.slice(0, 2), 16),
        parseInt(raw.slice(2, 4), 16),
        parseInt(raw.slice(4, 6), 16)
      ];
    };
    const ta = clampValue(t, 0, 1);
    const [r1, g1, b1] = parse(a);
    const [r2, g2, b2] = parse(b);
    const toHex = (v) => Math.round(v).toString(16).padStart(2, '0');
    return `#${toHex(r1 + (r2 - r1) * ta)}${toHex(g1 + (g2 - g1) * ta)}${toHex(b1 + (b2 - b1) * ta)}`;

  const renderDescription = () => {
    if (!description) return null;
    return (

                            className={`absolute transition-all timeline-node ${isStartNode ? 'is-start' : ''} ${isEndNode ? 'is-end' : ''}`}
                            style={{ left: '8px', top: '16px' }}
                          >
                            <div
                              className="timeline-node-halo"
                              style={{
                                background: lifeColor,
                                boxShadow: `0 0 0 ${idx === activeIndex ? 10 : 5}px ${glowColor}`
                              }}
                            ></div>
                            <div
                              className="timeline-node-core"
                              style={{ background: lifeColor }}
                            ></div>
                          </div>
                          <div
                            onClick={() => handleLocClick(loc, idx)}
                            ref={(el) => { locItemRefs.current[idx] = el; }}
                            className={`timeline-card p-3 rounded-xl cursor-pointer transition-all border ${
                              idx === activeIndex
                                ? 'bg-white shadow-lg'
                                : 'bg-white/85 border-slate-200/80 hover:bg-white hover:shadow-md'
                            }`}
                            style={idx === activeIndex ? {
                              borderColor: hexToRgba(lifeColor, 0.42),
                              boxShadow: `0 14px 28px ${hexToRgba(lifeColor, 0.16)}`
                            } : undefined}
                          >
                            <div className="relative z-[1]">
                              <div className="flex justify-between items-start gap-3 mb-2">
                                <div className="min-w-0">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="font-bold text-sm truncate">{loc.name}</span>
                                    <span
                                      className="text-[10px] px-2 py-0.5 rounded-full border font-semibold"
                                      style={{
                                        color: lifeColor,
                                        borderColor: hexToRgba(lifeColor, 0.3),
                                        background: hexToRgba(lifeColor, 0.08)
                                      }}
                                    >
                                      {ageText}
                                    </span>
                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/70 text-gray-500 border border-[#c8b496]/40">
                                      {stageText}
                                    </span>
                                    {loc.type === 'birth' ? (
                                      <span className="timeline-ritual-badge birth">起点</span>
                                    ) : loc.type === 'death' ? (
                                      <span className="timeline-ritual-badge death">终章</span>
                                    ) : null}
                                  </div>
                                  <div className="text-[10px] text-gray-400 truncate">{loc.ancientName} → {loc.modernName}</div>
                                </div>
                                <span className="text-[10px] px-1.5 py-0.5 rounded bg-gray-100/90 text-gray-500">
                                  {loc.time || '未知'}
                                </span>
                              </div>
                              <div className="space-y-1 text-[11px] text-gray-500 mb-2">
                                <div className="flex justify-between">
                                  <span>停留时间</span>
                                  <span className="text-gray-700">{loc.duration || '未知'}</span>
                                </div>
                                <div className="flex justify-between">
                                  <span>生命进度</span>
                                  <span className="text-gray-700">{lifeProgress}%</span>
                                </div>
                                <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                                  <div
                                    className="h-full rounded-full"
                                    style={{
                                      width: `${Math.max(6, lifeProgress)}%`,
                                      background: `linear-gradient(90deg, #06b6d4 0%, #6366f1 45%, ${lifeColor} 100%)`
                                    }}
                                  ></div>
                                </div>
                              </div>
                              <p className="text-xs text-gray-500">{renderInline(loc.event)}</p>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ) : (
                <div className="text-xs text-gray-400">暂无事件</div>
              )}
            </div>
          </div>
          <div
            className="hidden lg:block w-2 rounded bg-[#c8b496]/50 hover:bg-[#c8b496] cursor-col-resize"
            onMouseDown={(e) => {
              e.preventDefault();
              draggingRef.current = true;
            }}
          ></div>
          <div className="relative flex-1">
            <div id="map"></div>
            <div className="absolute top-4 right-4 z-[1000] flex flex-col gap-2 items-end">
              <MapDropdown
                label="地图"
                value={`${mapStyleId}|${mapLayerType}`}
                onChange={(v) => {
                  const parts = String(v || '').split('|');
                  const nextStyle = (parts[0] || '').trim();
                  const nextLayer = (parts[1] || '').trim();
                  if (nextStyle) setMapStyleId(nextStyle);
                  if (nextLayer) setMapLayerType(nextLayer);
                }}
                options={[
                  { id: 'macaron|satellite', label: '马卡龙 · 卫星影像' }
                ]}
              />
            </div>
            {selectedLoc && (
              <div className="absolute top-4 left-4 z-[1000] w-72 glass-panel p-4 rounded-xl shadow-xl border-t-4 border-[#c0392b]">
                <button
                  onClick={() => setSelectedLoc(null)}
                  className="absolute top-2 right-2 text-gray-400 hover:text-gray-600"
                >✕</button>
                <h3 className="text-xl font-bold text-[#c0392b] mb-1">{selectedLoc.name}</h3>
                <p className="text-xs text-gray-400 mb-3">{selectedLoc.ancientName} → {selectedLoc.modernName}</p>
                <div className="space-y-3 text-sm">
                  <div>
                    <p className="text-gray-400 text-[10px] uppercase font-bold">公元纪年</p>
                    <p>{selectedLoc.time || '未知'}</p>
                  </div>
                  <div>
                    <p className="text-gray-400 text-[10px] uppercase font-bold">停留时间</p>
                    <p>{selectedLoc.duration || '未知'}</p>
                  </div>
                  <div>
                    <p className="text-gray-400 text-[10px] uppercase font-bold">事迹描述</p>
                    <div className="leading-relaxed">{renderMdBlock(selectedLoc.event) || renderInline(selectedLoc.event)}</div>
                  </div>
                  {selectedLoc.poster?.png ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">海报</p>
                      <a href={selectedLoc.poster.png} target="_blank" rel="noreferrer">
                        <img src={selectedLoc.poster.png} className="w-full rounded-lg border border-[#c8b496]/50" />
                      </a>
                    </div>
                  ) : null}
                  <div className="bg-[#fdf6e3] p-2 rounded border border-dashed border-[#c8b496]">
                    <p className="text-[#c0392b] text-[10px] uppercase font-bold">历史意义</p>
                    <div className="italic text-xs">{renderMdBlock(selectedLoc.significance) || renderInline(selectedLoc.significance)}</div>
                  </div>
                  {selectedLoc.quoteLines?.length ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>
                      <ul className="space-y-1">
                        {selectedLoc.quoteLines.map((q, idx) => (
                          <li key={idx} className="text-xs text-gray-700">{renderInline(q)}</li>
                        ))}
                      </ul>
                    </div>
                  ) : selectedLoc.works?.length ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>
                      <ul className="list-disc pl-4 space-y-1">
                        {selectedLoc.works.map((w, idx) => (
                          <li key={idx} className="text-xs text-gray-700">《{w}》</li>
                        ))}
                      </ul>
                    </div>
                  ) : null}
                </div>
              </div>
            )}
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">🗺️</p>
            <p className="text-xl font-bold">{stats.distance} <span className="text-xs font-normal">km</span></p>
            <p className="text-[10px] text-gray-400 uppercase">总行程估算</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">⏱️</p>
            <p className="text-xl font-bold">
              {stats.yearsLabel}{stats.yearsValue === null ? null : <span className="text-xs font-normal">年</span>}
            </p>
            <p className="text-[10px] text-gray-400 uppercase">生命跨度</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">📍</p>
            <p className="text-xl font-bold">{stats.regions} <span className="text-xs font-normal">个</span></p>
            <p className="text-[10px] text-gray-400 uppercase">覆盖地区</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">🌟</p>
            <p className="text-xl font-bold">{stats.events} <span className="text-xs font-normal">件</span></p>
            <p className="text-[10px] text-gray-400 uppercase">重要事迹</p>
          </div>
        </div>

        <section ref={chatSectionRef} className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-white/70">
          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</h2>
              <p className="text-[11px] text-gray-500 mt-1">进入足迹内容后，以第一人称与人物对话（依据史实）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="text-[11px] px-3 py-1 rounded bg-[#c0392b] text-white hover:bg-[#a93226]"
              >
                {chatOpen ? '收起' : '开始对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[#c8b496]/40 rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[#c0392b] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = String(m.content || '').trim();
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 bg-white text-gray-700">
                        正在回应…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
// exports disabled
    </script>
    <script>
      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
</body>
</html>
