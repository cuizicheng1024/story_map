成于思毁于随**”（《进学解》），影响深远。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：中唐**古文运动**的主要倡导者，与柳宗元并称“韩柳”，主张恢复先秦两汉散文传统，反对六朝以来浮华的**骈文**。\n    - **重点**：元和十四年（819年）因上**《论佛骨表》** 谏迎佛骨，触怒唐宪宗，被贬**潮州**，是其人生重大挫折，也体现了其不畏皇权、坚守儒家立场的精神。\n    - 曾参与**平定淮西藩镇**（817年），并撰写《平淮西碑》。\n    - 在地方官任上（阳山、潮州、袁州）多有**兴办学校、释放奴婢、移风易俗**的政绩。\n- 核心要点：\n    - **重点**：其思想核心是**复兴儒学**，构建儒家“**道统**”以对抗佛教和道教，著有《原道》《原性》等哲学论文。\n    - **重点**：在文学史上地位极高，被尊为“**唐宋八大家**”之首，其散文创作实践了“文以载道”的理论，对后世散文发展有**奠基性**影响。\n    - **重点**：其“**不平则鸣**”的文学主张（《送孟东野序》），强调文学的**抒情言志**和**社会批判**功能。\n    - 一生仕途坎坷，两次被贬岭南，但始终保持着积极入世、刚直敢言的**士大夫精神**。\n    - 作为教育家，曾任**国子祭酒**（国家最高学府校长），对唐代教育有重要贡献。\n\n---", "markdown": "# 韩愈\n\n## 人物档案\n\n### 基本信息\n- **姓名**：韩愈\n- **时代**：唐代\n- **出生**：公元768年（说法不一，一说769年），河阳（今河南省焦作市孟州市）\n- **去世**：公元824年12月25日，长安（今陕西省西安市）\n- **享年**：57岁\n- **主要身份**：文学家、思想家、政治家、教育家\n- **历史地位**：唐代古文运动的倡导者，“唐宋八大家”之首，有“文章巨公”和“百代文宗”之名。\n- **主要成就**：倡导古文运动，反对骈文；复兴儒学，排斥佛老；诗文创作成就卓越，影响深远。\n\n### 生平概述\n韩愈生于安史之乱后，三岁而孤，由兄嫂抚养长大。他自幼刻苦攻读，精通六经百家。贞元八年（792年）进士及第，但仕途坎坷，曾两度被贬至岭南（今广东阳山、潮州）。他一生积极倡导古文运动，主张“文以载道”，其散文气势雄健，逻辑严密，被后人尊为“百代文宗”。在思想上，他致力于复兴儒学，力排佛老，其《原道》《原性》等文系统阐述了儒家道统。晚年官至吏部侍郎，世称“韩吏部”。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要覆盖中原、关中、江南及岭南地区，核心活动区域在长安、洛阳、河南及两次贬谪途中。\n- ⏱️ **时间跨度**：公元768年 - 824年，共约57年。\n- 📍 **地理范围**：以今河南省为中心，东至江苏徐州，西至陕西长安，南抵广东潮州。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：河阳\n- **时间**：公元768年\n- **停留时间**：约3年\n- **地点**：河阳（今河南省焦作市孟州市）\n- **事件**：出生于官宦之家，祖籍昌黎，世称“韩昌黎”。父亲韩仲卿去世后，由兄长韩会抚养。\n- **意义**：其郡望“昌黎”成为后世对他的尊称之一，奠定了其家族背景。\n\n### 📍 重要地点：宣城\n- **时间**：约公元771年 - 777年\n- **停留时间**：约6年\n- **地点**：宣城（今安徽省宣城市）\n- **事件**：兄长韩会任起居舍人，韩愈随兄嫂在宣城居住，开始接受启蒙教育。约公元777年，兄韩会贬官，随兄嫂迁居韶州（今广东韶关）。\n- **意义**：在相对稳定的环境中度过童年，开始读书识字，奠定学问基础。\n\n### 📍 重要地点：长安\n- **时间**：公元786年 - 792年（求学、应试时期）\n- **停留时间**：约6年\n- **地点**：长安（今陕西省西安市）\n- **事件**：贞元二年（786年）赴长安，科举之路并不顺遂，曾三试于吏部博学宏词科皆不中。期间生活困顿，但仍积极干谒，投文公卿。\n- **意义**：接触京师文坛，磨砺意志，为其文学思想的形成和日后倡导古文运动积累了经验。\n\n### 📍 重要地点：汴州 & 徐州\n- **时间**：公元796年 - 799年\n- **停留时间**：约3年\n- **地点**：汴州（今河南省开封市）、徐州（今江苏省徐州市）\n- **事件**：进士及第后，于贞元十二年（796年）受宣武节度使董晋推荐，任汴州观察推官。董晋死后，转投徐州节度使张建封幕下任节度推官。\n- **意义**：初入仕途，积累地方从政经验，并开始广泛收徒授学，宣传自己的文学主张。\n\n### 📍 重要地点：长安（国子监）\n- **时间**：公元802年 - 803年\n- **停留时间**：约2年\n- **地点**：长安（今陕西省西安市）\n- **事件**：贞元十八年（802年）授国子监四门博士，次年晋升为监察御史。因上《御史台上论天旱人饥状》为民请命，得罪权臣，被贬为阳山令。\n- **意义**：首次在中央学府任职，正式开始其教育生涯；首次因直言进谏遭贬，体现了其刚正性格。\n\n### 🔴 被贬地：阳山\n- **时间**：公元803年 - 805年\n- **停留时间**：约2年\n- **地点**：阳山（今广东省清远市阳山县）\n- **事件**：贞元十九年（803年）底被贬。在阳山任县令期间，他兴办学校，教化百姓，深受当地民众爱戴，许多青年慕名前来从学。\n- **意义**：首次体验岭南艰苦环境，但其文教实践影响深远，阳山百姓以其姓氏命名山水（如“贤令山”）以纪念。\n- **名篇名句**：《答张十一功曹》：吟诗罢看双鬓，斗觉霜毛一半加。（作者存疑，一说贾岛）\n\n### 📍 重要地点：长安（史馆、中书舍人）\n- **时间**：公元806年 - 817年\n- **停留时间**：约12年\n- **地点**：长安（今陕西省西安市）\n- **事件**：元和元年（806年）召回长安，历任国子博士、都官员外郎、史馆修撰、中书舍人等职。期间参与平定淮西藩镇吴元济，撰写《平淮西碑》。元和十四年（819年）因上《论佛骨表》极力反对宪宗迎佛骨，触怒皇帝，被贬为潮州刺史。\n- **意义**：创作高峰期，完成了《原道》《师说》《进学解》等核心著作；因谏迎佛骨遭第二次大贬，成为其人生重大转折点。\n- **名篇名句**：《左迁至蓝关示侄孙湘》：一封朝奏九重天，夕贬潮州路八千；《师说》：师者，所以传道受业解惑也。\n\n### 🔴 被贬地：潮州\n- **时间**：公元819年\n- **停留时间**：约8个月\n- **地点**：潮州（今广东省潮州市）\n- **事件**：元和十四年（819年）被贬后赴任。在潮州虽仅八个月，却驱除鳄鱼（《祭鳄鱼文》）、释放奴婢、兴修水利、推广文教，政绩卓著。\n- **意义**：对潮州地区的发展做出了历史性贡献，深受当地百姓永久怀念，潮州山水为之改姓“韩”（如韩江、韩山）。\n- **名篇名句**：《祭鳄鱼文》：尽三日，其率丑类南徙于海，以避天子之命吏。\n\n### 📍 重要地点：袁州\n- **时间**：公元820年\n- **停留时间**：约数月\n- **地点**：袁州（今江西省宜春市）\n- **事件**：元和十五年（820年）春，遇赦调任袁州刺史。在任上继续释放因债务沦为奴婢的百姓，并兴办学校。年末回京任国子祭酒。\n- **意义**：延续了其仁政爱民、重视文教的一贯作风。\n\n### 🔴 去世地：长安\n- **时间**：公元821年 - 824年\n- **停留时间**：约4年\n- **地点**：长安（今陕西省西安市）\n- **事件**：长庆元年（821年）召回长安，历任国子祭酒、兵部侍郎、吏部侍郎等职。长庆四年（824年）病逝于长安靖安里第，赠礼部尚书，谥号“文”。\n- **意义**：晚年官位显达，完成人生旅程，其文学与思想遗产由门人李汉编集《昌黎先生集》传世。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n|---|---|---|\n| 768年 | 1岁 | 出生于河阳（今河南孟州）。 |\n| 777年 | 10岁 | 兄韩会贬官，随兄嫂迁居韶州（今广东韶关）。 |\n| 786年 | 19岁 | 赴长安，开始求学应试生涯。 |\n| 792年 | 25岁 | 登进士第。 |\n| 796年 | 29岁 | 任汴州观察推官，初入仕途。 |\n| 802年 | 35岁 | 任国子监四门博士。 |\n| 803年 | 36岁 | 任监察御史，上书言事被贬阳山令。 |\n| 806年 | 39岁 | 遇赦回京，任国子博士。 |\n| 817年 | 50岁 | 随裴度平淮西，撰《平淮西碑》。 |\n| 819年 | 52岁 | 上《论佛骨表》，被贬潮州刺史。 |\n| 820年 | 53岁 | 调任袁州刺史；年末回京任国子祭酒。 |\n| 824年 | 57岁 | 病逝于长安，谥号“文”。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《师说》**、**《马说》**、**《早春呈水部张十八员外》**、《左迁至蓝关示侄孙湘》\n- 核心要点：\n    - **重点**：**《师说》** 提出了“**师者，所以传道受业解惑也**”的核心观点，批判了当时“耻学于师”的风气，阐述了“**弟子不必不如师，师不必贤于弟子**”的进步师生观。\n    - **重点**：**《马说》** 以“千里马”与“伯乐”的关系为喻，揭示了“**世有伯乐，然后有千里马。千里马常有，而伯乐常无**”的人才困境，抒发了怀才不遇的愤懑。\n    - **重点**：其散文以“**文以载道**”为核心，气势雄健，逻辑严密，开创了**古文运动**的新局面，被苏轼誉为“**文起八代之衰**”。\n    - **《早春呈水部张十八员外》** 运用“**天街小雨润如酥，草色遥看近却无**”的细腻观察，捕捉早春独特神韵，体现其诗歌清新自然的一面。\n    - 善于运用**类比**（如《马说》）、**对比**（如《师说》）和**托物寓意**的手法，使说理生动透彻。\n    - 语言上创造了许多**成语**和**警句**，如“**业精于勤荒于嬉，行成于思毁于随**”（《进学解》），影响深远。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：中唐**古文运动**的主要倡导者，与柳宗元并称“韩柳”，主张恢复先秦两汉散文传统，反对六朝以来浮华的**骈文**。\n    - **重点**：元和十四年（819年）因上**《论佛骨表》** 谏迎佛骨，触怒唐宪宗，被贬**潮州**，是其人生重大挫折，也体现了其不畏皇权、坚守儒家立场的精神。\n    - 曾参与**平定淮西藩镇**（817年），并撰写《平淮西碑》。\n    - 在地方官任上（阳山、潮州、袁州）多有**兴办学校、释放奴婢、移风易俗**的政绩。\n- 核心要点：\n    - **重点**：其思想核心是**复兴儒学**，构建儒家“**道统**”以对抗佛教和道教，著有《原道》《原性》等哲学论文。\n    - **重点**：在文学史上地位极高，被尊为“**唐宋八大家**”之首，其散文创作实践了“文以载道”的理论，对后世散文发展有**奠基性**影响。\n    - **重点**：其“**不平则鸣**”的文学主张（《送孟东野序》），强调文学的**抒情言志**和**社会批判**功能。\n    - 一生仕途坎坷，两次被贬岭南，但始终保持着积极入世、刚直敢言的**士大夫精神**。\n    - 作为教育家，曾任**国子祭酒**（国家最高学府校长），对唐代教育有重要贡献。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 河南省焦作市孟州市 | 34.9069 | 112.7914 |\n| 安徽省宣城市 | 30.9407 | 118.7580 |\n| 陕西省西安市 | 34.3416 | 108.9398 |\n| 河南省开封市 | 34.7971 | 114.3075 |\n| 江苏省徐州市 | 34.2044 | 117.2859 |\n| 广东省清远市阳山县 | 24.4653 | 112.6414 |\n| 广东省潮州市 | 23.6567 | 116.6224 |\n| 江西省宜春市 | 27.8001 | 114.3911 |\n| 广东省韶关市 | 24.8011 | 113.5916 |"};

const extractTeachingHighlights = (raw, maxItems) => {

  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);

  const push = (text) => {

    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {

};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {

};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {

  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const current = options.find((o) => o.id === value) || options[0] || { id: '', label: '' };
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(!open)}
        className="glass-panel rounded-lg px-3 py-1.5 text-xs flex items-center gap-2 shadow-lg hover:bg-white/95 transition-colors"
      >
        <span className="text-gray-500">{label}</span>
        <span className="text-[#7c2d12] font-bold">{current.label}</span>
        <span className="text-gray-400 text-[10px]">▾</span>
      </button>
      {open ? (
        <div className="absolute top-full right-0 mt-1 glass-panel rounded-lg shadow-xl py-1 min-w-[120px] z-20">
          {options.map((opt) => (
            <button
              key={opt.id}
              onClick={() => { onChange(opt.id); setOpen(false); }}
              className={`w-full text-left px-3 py-1.5 text-xs hover:bg-amber-50 transition-colors ${
                opt.id === value ? 'text-[#c0392b] font-bold bg-amber-50/60' : 'text-gray-700'
              }`}
            >
              {opt.label}
            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
};

                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
