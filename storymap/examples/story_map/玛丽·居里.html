": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《跨越百年的美丽》**（梁衡）、**《我的信念》**（玛丽·居里自述节选）\n- 核心要点：\n    - **重点**：**《跨越百年的美丽》** 深刻阐释了居里夫人**人格美**与**科学精神**超越容貌与时间的永恒价值。\n    - **重点**：**《我的信念》** 展现了她对科学**纯粹、坚韧、淡泊名利**的追求，如“科学本身就具有伟大的美”。\n    - 文章常通过**棚屋实验**、**提炼镭**等具体事例，刻画其**艰苦奋斗**的科研环境。\n    - **象征手法**：**“镭”** 不仅是科学发现，更象征了**奉献精神**与**智慧之光**。\n    - **对比手法**：常将其**简陋的实验条件**与**伟大的科学成就**进行对比，突出其人格力量。\n    - **重点**：其形象是**爱国主义**（命名钋）、**国际主义**（无偿公开镭提炼方法）与**女性力量**的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**放射性**研究的开创者之一，与丈夫共同提出“放射性”术语。\n    - **重点**：发现两种新化学元素：**钋**和**镭**。\n    - **两次荣获诺贝尔奖**：1903年**诺贝尔物理学奖**（共同），1911年**诺贝尔化学奖**（单独）。\n    - 第一次世界大战期间，组织**X光流动车队**服务前线。\n    - 主持建立**巴黎镭学研究所**。\n- 核心要点：\n    - **重点**：她的成就打破了科学界的**性别壁垒**，是**女性科学家**的里程碑式人物。\n    - **重点**：其研究推动了**原子物理学**和**核化学**的诞生，为后来的**核能利用**奠定了基础。\n    - 她体现了**基础科学**研究向**实际应用**（如医学放疗）转化的重要价值。\n    - **重点**：其生平是**科学精神**（求真、实证、奉献）与**人文精神**（爱国、坚韧、无私）结合的完美体现。\n    - 作为**移民科学家**，她在法国取得辉煌成就，体现了**国际科学合作**与交流的重要性。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《跨越百年的美丽》**（梁衡）、**《我的信念》**（玛丽·居里自述节选）\n- 核心要点：\n    - **重点**：**《跨越百年的美丽》** 深刻阐释了居里夫人**人格美**与**科学精神**超越容貌与时间的永恒价值。\n    - **重点**：**《我的信念》** 展现了她对科学**纯粹、坚韧、淡泊名利**的追求，如“科学本身就具有伟大的美”。\n    - 文章常通过**棚屋实验**、**提炼镭**等具体事例，刻画其**艰苦奋斗**的科研环境。\n    - **象征手法**：**“镭”** 不仅是科学发现，更象征了**奉献精神**与**智慧之光**。\n    - **对比手法**：常将其**简陋的实验条件**与**伟大的科学成就**进行对比，突出其人格力量。\n    - **重点**：其形象是**爱国主义**（命名钋）、**国际主义**（无偿公开镭提炼方法）与**女性力量**的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**放射性**研究的开创者之一，与丈夫共同提出“放射性”术语。\n    - **重点**：发现两种新化学元素：**钋**和**镭**。\n    - **两次荣获诺贝尔奖**：1903年**诺贝尔物理学奖**（共同），1911年**诺贝尔化学奖**（单独）。\n    - 第一次世界大战期间，组织**X光流动车队**服务前线。\n    - 主持建立**巴黎镭学研究所**。\n- 核心要点：\n    - **重点**：她的成就打破了科学界的**性别壁垒**，是**女性科学家**的里程碑式人物。\n    - **重点**：其研究推动了**原子物理学**和**核化学**的诞生，为后来的**核能利用**奠定了基础。\n    - 她体现了**基础科学**研究向**实际应用**（如医学放疗）转化的重要价值。\n    - **重点**：其生平是**科学精神**（求真、实证、奉献）与**人文精神**（爱国、坚韧、无私）结合的完美体现。\n    - 作为**移民科学家**，她在法国取得辉煌成就，体现了**国际科学合作**与交流的重要性。\n\n---", "markdown": "# 玛丽·居里\n\n## 人物档案\n\n### 基本信息\n- **姓名**：玛丽亚·斯克沃多夫斯卡·居里\n- **时代**：19世纪末至20世纪初\n- **出生**：1867年11月7日，华沙（今波兰华沙）\n- **去世**：1934年7月4日，桑塞罗莫兹（今法国上萨瓦省桑塞罗莫兹）\n- **享年**：66岁\n- **主要身份**：物理学家、化学家\n- **历史地位**：首位获得诺贝尔奖的女性，也是唯一一位在两个不同科学领域（物理学与化学）获得诺贝尔奖的科学家。\n- **主要成就**：\n    - 发现放射性元素钋（Po）和镭（Ra）。\n    - 开创放射性理论，并发明分离放射性同位素的技术。\n    - 与丈夫皮埃尔·居里共同获得1903年诺贝尔物理学奖。\n    - 因发现钋和镭，单独获得1911年诺贝尔化学奖。\n\n### 生平概述\n玛丽·居里出生于波兰华沙一个教师家庭，年轻时因性别限制无法在祖国接受高等教育，遂赴巴黎索邦大学求学。她与丈夫皮埃尔·居里共同致力于放射性现象的研究，在极其艰苦的条件下发现了新元素钋和镭。皮埃尔去世后，她继续投身科研与教育，成为索邦大学首位女教授。第一次世界大战期间，她组织移动X光车队服务前线。晚年致力于镭学研究和和平利用，最终因长期接触放射性物质导致再生障碍性贫血逝世。她的一生是科学奉献与坚韧精神的典范。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从波兰华沙到法国巴黎，足迹遍及欧洲多国及北美。\n- ⏱️ **时间跨度**：1867年 - 1934年，约67年。\n- 📍 **地理范围**：主要活动于波兰、法国，并曾访问比利时、英国、美国等国。\n- 🌟 **重要节点数量**：12个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：华沙\n- **时间**：1867年\n- **停留时间**：约24年（至1891年）\n- **地点**：华沙（今波兰华沙）\n- **事件**：出生于知识分子家庭，在俄占波兰时期完成早期教育，参加“流动大学”秘密学习。\n- **意义**：塑造了其爱国情怀与对知识的渴求，为其日后科学事业奠定基础。\n\n### 📍 重要地点：巴黎（索邦大学）\n- **时间**：1891年 - 1894年\n- **停留时间**：约3年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：进入索邦大学攻读物理学和数学，生活清苦但学业优异。\n- **意义**：开启了她的科学生涯，结识了众多科学家，并遇到了未来的丈夫皮埃尔·居里。\n\n### 📍 重要地点：巴黎（结婚与初期研究）\n- **时间**：1895年 - 1897年\n- **停留时间**：约2年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：与皮埃尔·居里结婚，开始共同生活与研究。\n- **意义**：建立了科学伴侣关系，为后续合作发现放射性元素创造了条件。\n\n### 📍 重要地点：巴黎（贝克勒尔射线研究）\n- **时间**：1897年 - 1898年\n- **停留时间**：约1年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：选择贝克勒尔发现的铀射线作为博士论文课题，系统研究各种物质的放射性。\n- **意义**：确立了“放射性”这一术语，并发现钍也具有放射性，研究取得突破性进展。\n\n### 📍 重要地点：巴黎（发现钋和镭）\n- **时间**：1898年\n- **停留时间**：本年集中发现\n- **地点**：巴黎（今法国巴黎）\n- **事件**：在简陋的棚屋实验室中，从沥青铀矿渣中先后发现新元素钋（为纪念祖国波兰命名）和镭。\n- **意义**：这是科学史上的里程碑，直接证明了放射性是一种原子特性，颠覆了传统原子观念。\n\n### 📍 重要地点：巴黎（提炼镭与获诺贝尔物理学奖）\n- **时间**：1899年 - 1902年\n- **停留时间**：约3年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：经过数年艰苦工作，成功提炼出十分之一克纯氯化镭，并测定其原子量。1903年，与皮埃尔·居里、贝克勒尔共获诺贝尔物理学奖。\n- **意义**：使放射性研究获得世界性认可，居里夫妇名扬天下，但健康已受到损害。\n\n### 📍 重要地点：巴黎（皮埃尔逝世与继任教授）\n- **时间**：1906年\n- **停留时间**：本年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：丈夫皮埃尔不幸车祸去世。她强忍悲痛，继任丈夫在索邦大学的教席，成为该校首位女教授。\n- **意义**：展现了非凡的坚韧，独立继续放射性研究事业。\n\n### 📍 重要地点：巴黎（获诺贝尔化学奖与“朗之万事件”风波）\n- **时间**：1911年\n- **停留时间**：本年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：因成功分离纯镭并研究其性质获诺贝尔化学奖。同年因与物理学家保罗·朗之万的私人关系卷入舆论风暴。\n- **意义**：成为两度诺贝尔奖得主，但也深刻体验了社会对女性科学家的偏见与苛责。\n\n### 📍 重要地点：法国多地（一战X光车队服务）\n- **时间**：1914年 - 1918年\n- **停留时间**：约4年\n- **地点**：法国多地（具体地点待考）\n- **事件**：组织并亲自驾驶装载X光设备的“小居里”流动救护车，培训助手，为战地伤员进行透视检查。\n- **意义**：将科学知识直接应用于人道救援，拯救了数十万士兵的生命，展现了科学家的社会责任。\n\n### 📍 重要地点：美国（首次访问）\n- **时间**：1921年\n- **停留时间**：数周\n- **地点**：美国多地，包括纽约、波士顿、芝加哥等城市（具体行程待考）\n- **事件**：在美国妇女界募资帮助下，接受时任总统沃伦·哈定赠送的1克镭（用于研究）。\n- **意义**：获得了宝贵的科研物资，同时其事迹在美国广泛传播，成为国际科学偶像。\n\n### 📍 重要地点：巴黎（建立镭学研究所）\n- **时间**：1914年 - 1930年代\n- **停留时间**：长期\n- **地点**：巴黎（今法国巴黎）\n- **事件**：主持建成并领导巴黎镭学研究所，该所成为世界放射性研究中心。\n- **意义**：为法国乃至世界培养了大批放射性研究与医学人才，包括她的女儿伊雷娜·约里奥-居里。\n\n### 🔴 去世地：桑塞罗莫兹\n- **时间**：1934年7月4日\n- **停留时间**：最后数周\n- **地点**：桑塞罗莫兹（今法国上萨瓦省桑塞罗莫兹）\n- **事件**：因多年暴露于放射性物质导致的再生障碍性贫血在此疗养期间逝世。\n- **意义**：一位伟大科学家的终点，其遗产（包括实验笔记）至今仍具放射性，象征着她为科学献身的极致。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1867 | 0 | 出生于波兰华沙。 |\n| 1891 | 24 | 赴巴黎索邦大学求学。 |\n| 1895 | 28 | 与皮埃尔·居里结婚。 |\n| 1897 | 30 | 开始研究贝克勒尔射线。 |\n| 1898 | 31 | 发现新元素钋和镭。 |\n| 1903 | 36 | 获诺贝尔物理学奖。 |\n| 1906 | 39 | 丈夫皮埃尔逝世；成为索邦大学首位女教授。 |\n| 1911 | 44 | 获诺贝尔化学奖。 |\n| 1914 | 47 | 一战爆发，组织X光车队服务前线。 |\n| 1921 | 54 | 首次访问美国，获赠1克镭。 |\n| 1934 | 66 | 在法国桑塞罗莫兹逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《跨越百年的美丽》**（梁衡）、**《我的信念》**（玛丽·居里自述节选）\n- 核心要点：\n    - **重点**：**《跨越百年的美丽》** 深刻阐释了居里夫人**人格美**与**科学精神**超越容貌与时间的永恒价值。\n    - **重点**：**《我的信念》** 展现了她对科学**纯粹、坚韧、淡泊名利**的追求，如“科学本身就具有伟大的美”。\n    - 文章常通过**棚屋实验**、**提炼镭**等具体事例，刻画其**艰苦奋斗**的科研环境。\n    - **象征手法**：**“镭”** 不仅是科学发现，更象征了**奉献精神**与**智慧之光**。\n    - **对比手法**：常将其**简陋的实验条件**与**伟大的科学成就**进行对比，突出其人格力量。\n    - **重点**：其形象是**爱国主义**（命名钋）、**国际主义**（无偿公开镭提炼方法）与**女性力量**的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**放射性**研究的开创者之一，与丈夫共同提出“放射性”术语。\n    - **重点**：发现两种新化学元素：**钋**和**镭**。\n    - **两次荣获诺贝尔奖**：1903年**诺贝尔物理学奖**（共同），1911年**诺贝尔化学奖**（单独）。\n    - 第一次世界大战期间，组织**X光流动车队**服务前线。\n    - 主持建立**巴黎镭学研究所**。\n- 核心要点：\n    - **重点**：她的成就打破了科学界的**性别壁垒**，是**女性科学家**的里程碑式人物。\n    - **重点**：其研究推动了**原子物理学**和**核化学**的诞生，为后来的**核能利用**奠定了基础。\n    - 她体现了**基础科学**研究向**实际应用**（如医学放疗）转化的重要价值。\n    - **重点**：其生平是**科学精神**（求真、实证、奉献）与**人文精神**（爱国、坚韧、无私）结合的完美体现。\n    - 作为**移民科学家**，她在法国取得辉煌成就，体现了**国际科学合作**与交流的重要性。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 华沙（波兰） | 52.2297 | 21.0122 |\n| 巴黎（法国） | 48.8566 | 2.3522 |\n| 巴黎索邦大学（法国） | 48.8462 | 2.3464 |\n| 巴黎镭学研究所（法国） | 48.8422 | 2.3444 |\n| 桑塞罗莫兹（法国） | 46.3931 | 6.4736 |\n| 纽约（美国） | 40.7128 | -74.0060 |"};

const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();

    seen.add(t);

  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;

    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

    let lastErr = null;
    for (const url of tryUrls) {
      try {
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, temperature: 0.2 })
        });
        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(text || `HTTP ${resp.status}`);
        }
        return JSON.parse(text);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('request_failed');
  };
  const sendChat = async (content) => {
    const text = String(content || '').trim();
    if (!text || chatLoading) return;
    setChatError('');
    setChatLoading(true);
    const nextMessages = [...chatMessages, { role: 'user', content: text }];
    setChatMessages(nextMessages);
    setChatDraft('');
    try {
      const llmMessages = [
        { role: 'system', content: historyChatSystemPrompt },
        ...nextMessages.slice(-14)
      ];
      const resp = await _postChat(llmMessages);
      const reply = String(resp?.choices?.[0]?.message?.content || '').trim();
      setChatMessages((prev) => [...prev, { role: 'assistant', content: reply || '（史料未载，我不敢妄言。）' }]);

      setChatError(String(e?.message || e || '请求失败'));
    } finally {

    }

          try {

            const empty = !root || root.childElementCount === 0;

            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
