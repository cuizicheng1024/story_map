处时代为**春秋末期**，社会处于“礼崩乐坏”的大变革前夜。\n    - 其政治立场是维护**周礼**，但思想中蕴含了“仁”等新的时代精神。\n    - 历史评价具有两面性：既是伟大的思想家、教育家，其部分政治主张也被认为具有保守性。\n\n---", "markdown": "# 孔子\n\n## 人物档案\n\n### 基本信息\n- **姓名**：孔丘\n- **时代**：春秋时期\n- **出生**：公元前551年，鲁国陬邑（今山东省曲阜市）。\n- **去世**：公元前479年，鲁国（今山东省曲阜市）\n- **享年**：73岁\n- **主要身份**：思想家、教育家、政治家、儒家学派创始人\n- **历史地位**：中国古代最伟大的思想家、教育家，儒家学说的奠基人，被后世尊为“至圣先师”、“万世师表”。\n- **主要成就**：\n    1. 创立以“仁”与“礼”为核心的儒家思想体系。\n    2. 开创私人讲学之风，打破“学在官府”的局面，主张“有教无类”。\n    3. 整理《诗》《书》《礼》《乐》《易》《春秋》等古代典籍。\n    4. 其思想成为中国两千多年封建社会的正统思想和传统文化的主干。\n\n### 生平概述\n孔子生于春秋末期，鲁国陬邑人。他早年生活贫贱，但勤奋好学，精通六艺。中年时开始聚徒讲学，开创私学。约五十岁时，在鲁国短暂从政，官至大司寇，但因政治理想受挫，于五十五岁率领弟子周游列国，历时十四年，宣传其政治主张，却未被采纳。晚年返回鲁国，致力于教育和文献整理工作。其言行由弟子记录在《论语》中，其思想体系奠定了中国传统文化的根基。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：以鲁国为中心，周游卫、曹、宋、郑、陈、蔡、楚等诸侯国，行程遍及今山东、河南、湖北等地。\n- ⏱️ **时间跨度**：约公元前551年 - 公元前479年，总跨度约73年。\n- 📍 **地理范围**：主要覆盖今山东省中西部、河南省大部及湖北省北部地区。\n- 🌟 **重要节点数量**：核心地点12个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：陬邑\n- **时间**：公元前551年\n- **停留时间**：幼年及少年时期\n- **地点**：鲁国陬邑（今山东省曲阜市）\n- **事件**：孔子出生于此，其父叔梁纥为陬邑大夫。三岁丧父，随母颜徵在迁居曲阜阙里。\n- **意义**：生命的起点，奠定了其鲁国人的身份和早期成长环境。\n\n### 📍 重要地点：曲阜\n- **时间**：约公元前549年 - 公元前517年；公元前484年 - 公元前479年\n- **停留时间**：青年至中年；晚年\n- **地点**：鲁国都城曲阜（今山东省曲阜市）\n- **事件**：早年“吾十有五而志于学”，精通六艺；三十岁左右开始私人讲学；曾任中都宰、司空、大司寇，参与“夹谷会盟”；晚年返鲁后，专心教学与整理文献。\n- **意义**：一生主要的活动基地，教育事业和政治生涯的起点与终点。\n- **名篇名句**：《论语·为政》：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”\n\n### 📍 重要地点：洛邑\n- **时间**：约公元前535年（存疑，孔子时年约16岁，一说为青年时期）\n- **停留时间**：数月\n- **地点**：周王室都城洛邑（今河南省洛阳市）\n- **事件**：问礼于老子，观周朝文物典章制度。\n- **意义**：开阔了眼界，深化了对礼乐制度的理解，是其思想形成的重要环节。\n\n### 📍 重要地点：齐国\n- **时间**：约公元前517年 - 公元前515年\n- **停留时间**：约两年\n- **地点**：齐国都城临淄（今山东省淄博市临淄区）\n- **事件**：因鲁国内乱而适齐，为高昭子家臣，曾与齐景公论政，提出“君君、臣臣、父父、子子”的主张。\n- **意义**：首次在国际舞台上阐述其政治理念，但未获重用。\n\n### 📍 重要地点：卫国都城帝丘\n- **时间**：公元前513年 - 公元前497年（多次往返）\n- **停留时间**：累计约十年\n- **地点**：卫国都城帝丘（今河南省濮阳市）\n- **事件**：周游列国首站，受卫灵公礼遇但未获任用，期间经历“子见南子”等风波。\n- **意义**：周游列国期间停留最久的国家，是观察和宣传其学说的重要据点。\n\n### 📍 重要地点：匡城与蒲地\n- **时间**：公元前496年\n- **停留时间**：短暂被困\n- **地点**：匡城（今河南省长垣市西南）、蒲地（今河南省长垣市境内）\n- **事件**：在匡城被误认为阳虎而遭围困；在蒲地遭蒲人拦截。\n- **意义**：周游途中遭遇生命危险的典型事件，体现了其“天命”思想和坚定信念。\n- **名篇名句**：《论语·子罕》：“文王既没，文不在兹乎？天之将丧斯文也，后死者不得与于斯文也；天之未丧斯文也，匡人其如予何？”\n\n### 📍 重要地点：宋国\n- **时间**：约公元前495年\n- **停留时间**：短暂\n- **地点**：宋国（今河南省商丘市附近）\n- **事件**：在宋国大树下习礼，宋司马桓魋欲害之，孔子微服离去。\n- **意义**：遭遇政治迫害，展现了其处变不惊的态度。\n\n### 📍 重要地点：郑国\n- **时间**：约公元前493年\n- **停留时间**：短暂\n- **地点**：郑国都城新郑（今河南省新郑市）\n- **事件**：与弟子失散，独立郭门东，被郑人形容为“累累若丧家之狗”，孔子闻之欣然笑纳。\n- **意义**：留下“丧家之犬”的著名典故，体现了其幽默与豁达。\n\n### 📍 重要地点：陈国\n- **时间**：约公元前492年 - 公元前489年（多次往返）\n- **停留时间**：约三年\n- **地点**：陈国都城宛丘（今河南省周口市淮阳区）\n- **事件**：受陈湣公礼遇，期间曾解答关于“肃慎氏之矢”的典故。\n- **意义**：在相对安定的环境中讲学传道。\n\n### 📍 重要地点：蔡国故地（负函）\n- **时间**：公元前489年\n- **停留时间**：短暂\n- **地点**：蔡国故地负函（今河南省信阳市）\n- **事件**：应楚昭王之召前往楚国，途中在陈蔡之间被围困，断粮七日，即“陈蔡绝粮”。\n- **意义**：周游列国中最艰难的时刻，弟子动摇，孔子弦歌不辍，坚定信念。\n- **名篇名句**：《论语·卫灵公》：“君子固穷，小人穷斯滥矣。”\n\n### 📍 重要地点：叶邑\n- **时间**：公元前489年\n- **停留时间**：短暂\n- **地点**：楚国叶邑（今河南省叶县旧县镇）\n- **事件**：与叶公（沈诸梁）论政，留下“近者悦，远者来”的政见。\n- **意义**：与楚国地方官员交流政治理念。\n\n### 🔴 去世地：曲阜\n- **时间**：公元前479年\n- **停留时间**：约十五年（晚年）\n- **地点**：鲁国都城曲阜（今山东省曲阜市）\n- **事件**：结束周游返回鲁国，被尊为“国老”，但不被当政者所用。专心从事教育，整理《诗》《书》等典籍。七十三岁病逝，葬于鲁城北泗上。\n- **意义**：思想与学问的最终定型与传承之地，其墓地“孔林”成为后世圣地。\n- **名篇名句**：《论语·子罕》：“子在川上曰：逝者如斯夫，不舍昼夜。”\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 公元前551年 | 1岁 | 生于鲁国陬邑。 |\n| 公元前549年 | 3岁 | 父亲叔梁纥去世，随母迁居曲阜。 |\n| 约公元前535年 | 约16岁 | 适周问礼于老子（存疑）。 |\n| 公元前533年 | 19岁 | 娶宋人亓官氏之女为妻。 |\n| 公元前532年 | 20岁 | 子鲤（伯鱼）生，任委吏（仓库管理员）。 |\n| 约公元前522年 | 约30岁 | 开始私人讲学，弟子渐众，“三十而立”。 |\n| 公元前517年 | 35岁 | 因鲁乱适齐，为高昭子家臣，与齐景公论政。 |\n| 公元前515年 | 37岁 | 自齐返鲁，继续讲学。 |\n| 公元前501年 | 51岁 | 任中都宰，后升任司空、大司寇。 |\n| 公元前500年 | 52岁 | 随定公赴夹谷会盟，取得外交胜利。 |\n| 公元前498年 | 54岁 | 建议“堕三都”以强公室，失败。 |\n| 公元前497年 | 55岁 | 离开鲁国，开始周游列国。 |\n| 公元前496年 | 56岁 | 在匡、蒲遇险。 |\n| 公元前493年 | 59岁 | 在卫，闻赵简子杀贤臣，临河而叹。 |\n| 公元前489年 | 63岁 | 在陈蔡之间绝粮，后至楚地负函、叶邑。 |\n| 公元前484年 | 68岁 | 弟子冉有为季氏将师胜齐，季康子迎孔子返鲁。 |\n| 公元前479年 | 73岁 | 逝世于曲阜。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《论语》** 选篇（如《学而》《为政》《里仁》《述而》《子罕》《先进》《颜渊》《季氏》等十二章）。\n- 核心要点：\n    - **重点**：核心思想“**仁**”，即“爱人”，主张“克己复礼为仁”，实现 const dedupeTeachingMarkdown = (raw) => {

  const chunks = [];

    if (!current.length) return;

    current = [];

    if (/^###\s+/.test(t)) {

  flush();

  const seen = new Set();
  const deduped = [];
  for (const chunk of chunks) {

    if (!meaningful.length) continue;
    if (/^###\s*考点\s*$/.test(meaningful[0])) continue;
    const key = meaningful

};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const getRelatedPersonHref = (node) => {

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  const prunedKept = kept.filter((line, idx) => {
    const t = String(line || '').trim();
    const isHeading = t.startsWith('### ') || t.startsWith('#### ');
    if (!isHeading) return true;
    for (let j = idx + 1; j < kept.length; j += 1) {
      const next = String(kept[j] || '').trim();
      if (!next || /^-{3,}$/.test(next)) continue;
      if (next.startsWith('### ') || next.startsWith('#### ')) return false;
      return true;
    }
    return false;
  });

  return prunedKept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {

    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);

  }, [open]);

    <div className="relative" ref={ref}>

                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
