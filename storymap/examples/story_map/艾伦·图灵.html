学、计算机科学），其经历鼓励**创新思维**与**打破学科壁垒**。\n    - “图灵测试”本身作为一个**经典隐喻**，常被引用来讨论**人工智能**、**意识**与**人性**的边界。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：二战期间领导**布莱切利园**的密码破译工作，成功破解德国**Enigma**密码，是**二战情报战**的决定性胜利之一，极大影响了战争进程。\n    - 提出**图灵机**理论模型，为**现代计算机**的诞生奠定了**逻辑与数学基础**。\n    - **重点**：战后参与英国**早期计算机**（如ACE、曼彻斯特马克一号）的设计与研发，是**计算机硬件工程**的先驱之一。\n    - 1952年因**同性恋**行为被英国当局以“严重猥亵”罪名起诉，遭受迫害，反映了当时社会的**法律与伦理困境**。\n- 核心要点：\n    - **重点**：被公认为**计算机科学之父**和**人工智能之父**，其理论工作具有**划时代**的意义。\n    - 其贡献在**冷战**背景下长期处于**保密**状态，直至20世纪70年代后才广为人知，是**科学史**上“隐藏的巨人”。\n    - **重点**：其个人悲剧是**LGBTQ+权利史**上的标志性事件，2013年获得英国女王**皇家赦免**，引发了对历史不公的持续反思。\n    - **重点**：其生平完美诠释了**基础理论研究**（图灵机）如何转化为改变世界的**巨大应用**（计算机与密码破译）。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：图灵的作品多为学术论文与报告，非传统语文课文范畴。其思想与生平常作为**科技人文**、**科学家精神**或**时代悲剧**的例证出现在拓展阅读或论述类文本中。\n- 核心要点：\n    - **重点**：其论文《计算机器与智能》逻辑严密、论证清晰，是**科技论文**的典范，体现了将复杂哲学问题转化为可操作科学问题的**思想实验**方法。\n    - **重点**：生平故事常被用来探讨**天才与孤独**、**个人命运与时代洪流**的冲突，具有强烈的**人文关怀**和**悲剧色彩**。\n    - **重点**：作为**跨学科**天才（数学、逻辑学、生物学、计算机科学），其经历鼓励**创新思维**与**打破学科壁垒**。\n    - “图灵测试”本身作为一个**经典隐喻**，常被引用来讨论**人工智能**、**意识**与**人性**的边界。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：二战期间领导**布莱切利园**的密码破译工作，成功破解德国**Enigma**密码，是**二战情报战**的决定性胜利之一，极大影响了战争进程。\n    - 提出**图灵机**理论模型，为**现代计算机**的诞生奠定了**逻辑与数学基础**。\n    - **重点**：战后参与英国**早期计算机**（如ACE、曼彻斯特马克一号）的设计与研发，是**计算机硬件工程**的先驱之一。\n    - 1952年因**同性恋**行为被英国当局以“严重猥亵”罪名起诉，遭受迫害，反映了当时社会的**法律与伦理困境**。\n- 核心要点：\n    - **重点**：被公认为**计算机科学之父**和**人工智能之父**，其理论工作具有**划时代**的意义。\n    - 其贡献在**冷战**背景下长期处于**保密**状态，直至20世纪70年代后才广为人知，是**科学史**上“隐藏的巨人”。\n    - **重点**：其个人悲剧是**LGBTQ+权利史**上的标志性事件，2013年获得英国女王**皇家赦免**，引发了对历史不公的持续反思。\n    - **重点**：其生平完美诠释了**基础理论研究**（图灵机）如何转化为改变世界的**巨大应用**（计算机与密码破译）。\n\n---", "markdown": "# 艾伦·图灵\n\n## 人物档案\n\n### 基本信息\n- **姓名**：艾伦·麦席森·图灵\n- **时代**：20世纪（现代）\n- **出生**：1912年6月23日，英国伦敦（今英国英格兰伦敦）\n- **去世**：1954年6月7日，英国柴郡威姆斯洛（今英国英格兰柴郡威姆斯洛）\n- **享年**：41岁\n- **主要身份**：数学家、逻辑学家、密码分析学家、计算机科学家\n- **历史地位**：计算机科学与人工智能之父，现代计算逻辑的奠基人。\n- **主要成就**：提出“图灵机”概念；在二战中领导破解德国Enigma密码；发表《计算机器与智能》论文，提出“图灵测试”；为早期计算机的设计与理论做出开创性贡献。\n\n### 生平概述\n艾伦·图灵出生于英国，自幼展现出卓越的数学天赋。他在剑桥大学国王学院崭露头角，后赴普林斯顿大学深造。二战期间，他加入英国政府密码学校所在地布莱切利园，领导团队成功破解了德国著名的Enigma密码，为盟军胜利做出了不可估量的贡献。战后，他参与设计了早期自动计算引擎，并在曼彻斯特大学工作。他提出了机器智能的哲学与标准（图灵测试），开创了人工智能领域。然而，因其同性恋身份在当时受到迫害，最终英年早逝。他的一生是天才思想与时代悲剧的交织。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于英国，曾在美国求学，足迹集中于英国的教育、科研与密码工作核心区域。\n- ⏱️ **时间跨度**：1912年 - 1954年，共42年。\n- 📍 **地理范围**：英国（英格兰伦敦、南部、中北部）、美国（新泽西州）。\n- 🌟 **重要节点数量**：8个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：伦敦\n- **时间**：1912年6月23日\n- **停留时间**：童年早期\n- **地点**：英国伦敦（今英国英格兰伦敦）\n- **事件**：出生于帕丁顿的沃灵顿宅邸。\n- **意义**：生命的起点，成长于一个英属印度公务员家庭。\n\n### 📍 重要地点：谢伯恩\n- **时间**：1926年 - 1931年\n- **停留时间**：约5年\n- **地点**：英国多塞特郡谢伯恩（今英国英格兰多塞特郡谢伯恩）\n- **事件**：就读于谢伯恩公学。在此期间对数学和科学产生浓厚兴趣，结识了对他一生有重要影响的朋友克里斯托弗·莫科姆。\n- **意义**：奠定了扎实的学术基础，也经历了早期情感与思想的形成。\n\n### 📍 重要地点：剑桥\n- **时间**：1931年 - 1934年\n- **停留时间**：约3年（本科）\n- **地点**：英国剑桥（今英国英格兰剑桥郡剑桥）\n- **事件**：进入剑桥大学国王学院攻读数学。以优异成绩毕业，并被选为国王学院研究员。\n- **意义**：正式踏入顶尖学术殿堂，开始其数理逻辑研究。\n\n### 📍 重要地点：普林斯顿\n- **时间**：1936年 - 1938年\n- **停留时间**：约2年\n- **地点**：美国新泽西州普林斯顿（今美国新泽西州普林斯顿）\n- **事件**：在普林斯顿大学攻读博士学位，师从阿隆佐·邱奇。期间发表了奠定其理论地位的论文《论可计算数及其在判定问题上的应用》。\n- **意义**：提出了“图灵机”这一通用计算模型，从理论上定义了算法和计算的边界，成为计算机科学的基石。\n\n### 📍 重要地点：布莱切利园\n- **时间**：1939年 - 1945年（二战期间）\n- **停留时间**：约6年\n- **地点**：英国白金汉郡布莱切利园（今英国英格兰白金汉郡米尔顿凯恩斯布莱切利园）\n- **事件**：加入英国政府密码学校，领导“Hut 8”部门，主要负责破解德国海军使用的Enigma密码。设计了“炸弹”机等破译设备，参与了“巨人”计算机的研发。\n- **意义**：其密码破译工作极大地缩短了二战进程，拯救了无数生命，是盟军情报战的核心功臣之一，其工作直至战后多年才被解密公开。\n\n### 📍 重要地点：特丁顿\n- **时间**：1945年 - 1948年\n- **停留时间**：约3年\n- **地点**：英国米德尔塞克斯郡特丁顿（今英国英格兰大伦敦里士满自治市特丁顿）\n- **事件**：在国家物理实验室（NPL）工作，设计了自动计算引擎（ACE）的详细方案，这是最早的完整计算机设计之一。\n- **意义**：将其理论构想转化为具体的工程蓝图，推动了英国早期计算机的研发。\n\n### 📍 重要地点：曼彻斯特\n- **时间**：1948年 - 1954年\n- **停留时间**：约6年\n- **地点**：英国兰开夏郡曼彻斯特（今英国英格兰大曼彻斯特郡曼彻斯特）\n- **事件**：加入曼彻斯特大学，担任计算机实验室副主任，参与曼彻斯特马克一号计算机的研发。期间发表了划时代的论文《计算机器与智能》。\n- **意义**：在此提出了著名的“图灵测试”，成为人工智能领域的开创性定义，并继续从事数学和生物学中的形态发生学研究。\n- **名篇名句**：《计算机器与智能》：我提议考虑这个问题：“机器能思考吗？”；《论可计算数及其在判定问题上的应用》：只要一台机器能模拟任何其他机器的行为，它就是通用的。\n\n### 🔴 去世地：威姆斯洛\n- **时间**：1954年6月7日\n- **停留时间**：晚年居住地\n- **地点**：英国柴郡威姆斯洛（今英国英格兰柴郡威姆斯洛）\n- **事件**：被发现死于家中床边，死因存疑（验尸官裁定为氰化物中毒自杀，但亦有意外或他杀说法）。\n- **意义**：一位天才科学家的悲剧性终结。他的死与当时英国法律对同性恋的迫害直接相关，成为科学界的重大损失和时代不公的象征。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1912 | 0 | 出生于英国伦敦。 |\n| 1926 | 14 | 进入谢伯恩公学学习。 |\n| 1931 | 19 | 进入剑桥大学国王学院攻读数学。 |\n| 1934 | 22 | 以优异成绩从剑桥毕业，当选为国王学院研究员。 |\n| 1936 | 24 | 发表《论可计算数》，提出“图灵机”概念。 |\n| 1938 | 26 | 获普林斯顿大学博士学位，返回剑桥。 |\n| 1939 | 27 | 二战爆发，加入布莱切利园从事密码破译工作。 |\n| 1945 | 33 | 二战结束，加入国家物理实验室，设计ACE计算机。 |\n| 1948 | 36 | 转入曼彻斯特大学，参与马克一号计算机研发。 |\n| 1950 | 38 | 发表《计算机器与智能》，提出“图灵测试”。 |\n| 1952 | 40 | 因同性恋行为被起诉并被迫接受化学阉割。 |\n| 1954 | 41 | 去世于威姆斯洛家中。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：图灵的作品多为学术论文与报告，非传统语文课文范畴。其思想与生平常作为**科技人文**、**科学家精神**或**时代悲剧**的例证出现在拓展阅读或论述类文本中。\n- 核心要点：\n    - **重点**：其论文《计算机器与智能》逻辑严密、论证清晰，是**科技论文**的典范，体现了将复杂哲学问题转化为可操作科学问题的**思想实验**方法。\n    - **重点**：生平故事常被用来探讨**天才与孤独**、**个人命运与时代洪流**的冲突，具有强烈的**人文关怀**和**悲剧色彩**。\n    - **重点**：作为**跨学科**天才（数学、逻辑学、生物学、计算机科学），其经历鼓励**创新思维**与**打破学科壁垒**。\n    - “图灵测试”本身作为一个**经典隐喻**，常被引用来讨论**人工智能**、**意识**与**人性**的边界。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：二战期间领导**布莱切利园**的密码破译工作，成功破解德国**Enigma**密码，是**二战情报战**的决定性胜利之一，极大影响了战争进程。\n    - 提出**图灵机**理论模型，为**现代计算机**的诞生奠定了**逻辑与数学基础**。\n    - **重点**：战后参与英国**早期计算机**（如ACE、曼彻斯特马克一号）的设计与研发，是**计算机硬件工程**的先驱之一。\n    - 1952年因**同性恋**行为被英国当局以“严重猥亵”罪名起诉，遭受迫害，反映了当时社会的**法律与伦理困境**。\n- 核心要点：\n    - **重点**：被公认为**计算机科学之父**和**人工智能之父**，其理论工作具有**划时代**的意义。\n    - 其贡献在**冷战**背景下长期处于**保密**状态，直至20世纪70年代后才广为人知，是**科学史**上“隐藏的巨人”。\n    - **重点**：其个人悲剧是**LGBTQ+权利史**上的标志性事件，2013年获得英国女王**皇家赦免**，引发了对历史不公的持续反思。\n    - **重点**：其生平完美诠释了**基础理论研究**（图灵机）如何转化为改变世界的**巨大应用**（计算机与密码破译）。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 伦敦 | 51.5074 | -0.1278 |\n| 谢伯恩 | 50.9472 | -2.5167 |\n| 剑桥 | 52.2053 | 0.1218 |\n| 普林斯顿 | 40.3573 | -74.6672 |\n| 布莱切利园 | 52.0036 | -0.7407 |\n| 特丁顿 | 51.4206 | -0.3333 |\n| 曼彻斯特 | 53.4808 | -2.2426 |\n| 威姆斯洛 | 53.3290 | -2.2990 |"};

const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
