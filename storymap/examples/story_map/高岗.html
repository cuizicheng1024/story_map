 "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 初中阶段\n- **时代背景**：**土地革命战争**时期，中国共产党在南方建立根据地的同时，在北方**陕甘边地区**也建立了革命根据地。\n- **关键事件/贡献**：**高岗**是**陕甘革命根据地**的主要创建者之一，该根据地成为**中央红军长征的落脚点**。\n- **代表作品/思想**：无。\n- **常见易混点/对比点**：注意区分**陕甘边根据地**与**陕北根据地**，后常合称**陕甘革命根据地**；主要创建者通常并提**刘志丹、谢子长、高岗**等。\n\n### 高中阶段\n- **时代背景**：**解放战争**时期，**东北**成为国共争夺的战略重点；**新中国成立初期**，面临巩固政权、恢复经济的艰巨任务。\n- **关键事件/贡献**：解放战争期间，**高岗**主持**中共中央东北局**工作，领导东北的**土地改革**和**经济恢复**，为前线提供支援。建国后任**中央人民政府副主席**、**国家计划委员会主席**。\n- **代表作品/思想**：无个人代表思想。其施政与**建国初期经济恢复**和**“一五”计划**制定相关。\n- **常见易混点/对比点**：**“高饶事件”**是建国后第一次重大的党内斗争，需了解其背景（**1953年全国财经会议**和**组织工作会议**）和性质（**分裂党、篡夺党和国家最高权力**）；注意与后来的**“文化大革命”**在性质和规模上的区别。\n\n---", "examPoints": "### 初中阶段考点\n1.  **陕甘革命根据地**的创建者之一（与刘志丹等并列）。\n2.  该根据地是**中央红军长征的落脚点**。\n3.  抗日战争时期担任**中共中央西北局书记**，领导**陕甘宁边区**工作。\n4.  解放战争时期在**东北**担任重要领导职务。\n5.  新中国成立后，曾任**中央人民政府副主席**。\n6.  **存疑/说法不一**：其在根据地创建过程中的具体作用和排名，不同史料叙述侧重点略有不同。\n\n### 高中阶段考点\n1.  **“高饶事件”**的背景、经过和性质（**1953-1954年**，**分裂党的阴谋活动**）。\n2.  该事件是**新中国成立后党内第一次严重路线斗争**。\n3.  事件结果：**高岗**于1954年自杀，1955年被**开除党籍**。\n4.  其人在**解放战争时期**对**东北根据地**巩固和建设的贡献。\n5.  建国初期在**国家经济计划部门**（国家计委）的任职情况。\n6.  **历史评价的两面性**：革命时期的贡献与建国后的严重错误。\n7.  **存疑/说法不一**：关于“高饶事件”的具体细节和深层原因，学术研究中有不同分析和解读。", "markdown": "# 高岗\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：高岗（原名高崇德，字硕卿）\n- **时代**：近现代（中华民国、中华人民共和国）\n- **出生**：1905年，陕西省横山县（今陕西省榆林市横山区）\n- **去世**：1954年8月17日，中华人民共和国北京市\n- **享年**：49岁（虚岁）\n- **主要身份**：政治家、军事领导人、中国共产党和中华人民共和国早期领导人之一\n- **历史地位**：中国共产党和中华人民共和国早期重要领导人之一，曾担任国家副主席，后因进行反党分裂活动被揭露和清除。\n- **主要成就**：参与创建陕甘边区革命根据地；在抗日战争和解放战争时期主持中共中央西北局和东北局工作；中华人民共和国成立后任中央人民政府副主席、国家计划委员会主任等职。\n\n### 生平概述\n高岗是中国共产党的早期党员，历经土地革命战争、抗日战争和解放战争。他长期在西北地区工作，是陕甘边革命根据地的主要创建者之一，为红军提供了重要的落脚点。抗日战争时期，他担任中共中央西北局书记，巩固和发展了陕甘宁边区。解放战争时期，他被派往东北，历任中共中央东北局副书记、书记，东北人民政府主席，为东北根据地的建设和解放做出了贡献。中华人民共和国成立后，他身居高位，担任中央人民政府副主席、国家计划委员会主任等要职。1953年，他与饶漱石进行分裂党、篡夺党和国家最高权力的活动。1954年在中共七届四中全会上被揭露，1955年被开除出党。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从陕北黄土高原起步，历经东北，最终抵达北京，足迹主要贯穿中国北方。\n- ⏱️ **时间跨度**：1905年—1954年，共49年。\n- 📍 **地理范围**：主要覆盖今陕西省北部、东北三省（黑龙江、吉林、辽宁）及北京市。\n- 🌟 **重要节点数量**：核心地点约8个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：陕西省横山县\n- **公元纪年**：1905年\n- **停留时间**：青少年时期（约至1926年）\n- **位置**：横山县（今陕西省榆林市横山区）\n- **事迹**：出生于贫苦农民家庭，幼年读过私塾，后考入横山县立第一高级小学，开始接触进步思想。\n- **意义**：其人生起点，塑造了其早期朴素的阶级立场和对旧社会的不满。\n\n### 📍 重要地点：榆林、米脂等地\n- **公元纪年**：1926年—1928年\n- **停留时间**：约2年\n- **位置**：榆林（今陕西省榆林市榆阳区）、米脂（今陕西省榆林市米脂县）\n- **事迹**：在榆林中学读书期间加入中国共产党。后在米脂等地从事地下兵运工作。\n- **意义**：正式走上革命道路，开始其职业革命家生涯。\n\n### 📍 重要地点：陕北（兵运工作）\n- **公元纪年**：1928年—1931年\n- **停留时间**：约3年\n- **位置**：陕西省北部地区（具体地点待考）\n- **事迹**：在陕北从事兵运工作，为后续武装斗争做准备。\n- **意义**：积累了早期军事工作经验。\n\n### 📍 重要地点：陕甘边革命根据地（照金、南梁等地）\n- **公元纪年**：1932年—1935年\n- **停留时间**：约3年\n- **位置**：照金（今陕西省铜川市耀州区照金镇）、南梁（今甘肃省庆阳市华池县南梁镇）地区\n- **事迹**：与刘志丹、谢子长等共同创建陕甘边红军和革命根据地，历任红军陕甘边游击队总指挥部政委、红26军政委、陕甘边红军临时总指挥部政委等职，是根据地核心领导人之一。\n- **意义**：其革命生涯的第一个高峰，为中央红军长征提供了宝贵的落脚点，奠定了其在党内和军队内的地位。\n- **名篇名句**：无直接文学作品。相关历史文献可见于当时党的决议和报告。\n\n### 📍 重要地点：延安\n- **公元纪年**：1935年—1945年\n- **停留时间**：约10年\n- **位置**：延安（今陕西省延安市宝塔区）\n- **事迹**：中央红军到达陕北后，历任中共陕甘宁边区党委书记、边区参议会议长、中共中央西北局书记等职，成为陕甘宁边区主要负责人之一，参与领导边区的建设和大生产运动。\n- **意义**：在中共中央直接领导下工作，巩固了其在西北党内的领导地位，并积累了丰富的根据地治理经验。\n- **名篇名句**：无直接文学作品。其讲话和报告可见于《解放日报》等边区刊物。\n\n### 📍 重要地点：东北（哈尔滨、沈阳等地）\n- **公元纪年**：1945年—1952年\n- **停留时间**：约7年\n- **位置**：主要活动于今黑龙江省哈尔滨市、辽宁省沈阳市等地\n- **事迹**：日本投降后赴东北，历任中共中央东北局副书记、东北民主联军副政委、东北人民政府主席、东北局书记等职，主持东北的后方建设、土地改革和经济恢复工作，为东北解放战争提供了坚实保障。\n- **意义**：其政治生涯的顶峰时期，全面主持一个大战略区的党政军工作，权力和影响力达到空前高度。\n- **名篇名句**：无直接文学作品。其施政报告可见于《东北日报》。\n\n### 📍 重要地点：北京\n- **公元纪年**：1949年—1954年（主要活动于1952年调中央工作后）\n- **停留时间**：断续居住，后期常驻\n- **位置**：北京（今北京市）\n- **事迹**：1949年赴京参加中国人民政治协商会议，当选中央人民政府副主席。1952年调中央工作，任新成立的国家计划委员会主席，分管全国经济工作。1953年与饶漱石进行分裂党的活动。\n- **意义**：进入党和国家最高权力中心，但也在此地策划了导致其政治生命终结的“高饶事件”。\n- **名篇名句**：无直接文学作品。相关活动见于中共中央文件。\n\n### 🔴 去世地：北京\n- **公元纪年**：1954年8月17日\n- **停留时间**：自1953年被揭露后至去世\n- **位置**：北京（今北京市）\n- **经过**：1954年中共七届四中全会揭露其反党分裂活动后，受到审查并被撤销一切职务。在隔离审查期间，于8月17日自杀身亡。\n- **意义**：其政治生涯和生命的终点，标志着“高饶事件”的终结。\n- **名篇名句**：无。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 1905 | 0 | 出生于陕西省横山县。 |\n| 1926 | 21 | 在榆林中学加入中国共产党。 |\n| 1928-1931 | 23-26 | 在陕北从事兵运工作。 |\n| 1932-1935 | 27-30 | 参与创建陕甘边红军和革命根据地，任红26军政委等职。 |\n| 1935 | 30 | 中央红军到达陕北后，任中共陕甘宁边区党委书记。 |\n| 1938-1945 | 33-40 | 任中共中央西北局书记，主持陕甘宁边区工作。 |\n| 1945 | 40 | 当选中共第七届中央委员、政治局委员；赴东北工作。 |\n| 1946-1949 | 41-44 | 历任中共中央东北局副书记、书记，东北人民政府主席。 |\n| 1949 | 44 | 当选中央人民政府副主席。 |\n| 1952 | 47 | 调任中央人民政府国家计划委员会主席。 |\n| 1953 | 48 | 与饶漱石进行分裂党、篡夺党和国家最高权力的阴谋活动（“高饶事件”）。 |\n| 1954 | 49 | 在中共七届四中全会上被揭露和批判；8月17日，在北京自杀身亡。 |\n| 1955 | （追认决议年份） | 被中共中央全国代表会议通过决议，开除党籍，撤销党内外一切职务。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n高岗在民主革命时期，特别是在创建陕甘革命根据地和主持东北解放区工作方面，做出了重要贡献，是党和国家在北方的重要领导人之一。建国初期，他身居要职，对国民经济恢复和“一五”计划的制定有一定影响。1953年，他与饶漱石结成联盟，进行分裂党的非组织活动，企图攫取党和国家更高权力，这一事件（“高饶事件”）是建国后党内第一次严重的路线斗争，对当时党的团结和集中统一构成了严峻挑战，直接导致了其个人的政治覆灭。\n\n### 对后世的影响\n1. **党内斗争的警示案例**：“高饶事件”成为中共党史上维护党的团结统一、反对野心家和阴谋家的典型反面教材，长期被引以为戒。\n2. **干部管理制度的反思**：该事件促使党中央反思建国初期高级干部的管理、监督和权力制衡机制。\n3. **历史研究的复杂对象**：其一生功过并存，对他在革命时期的贡献与后来的错误如何客观、历史地评价，成为党史研究中的一个课题。\n4. **“高岗、饶漱石反党联盟”成为固定政治术语**：在特定历史时期的政治话语中，常被用来指代党内进行分裂活动的集团。\n\n### 历史评价\n1. **中共中央1955年决议评价**：“高岗、饶漱石反党联盟的目的是要夺取党和国家的最高权力，他们用阴谋手段反对刘少奇同志和周恩来同志，反对党中央的其他负责同志，企图分裂党中央，瓦解我们的党。”\n2. **党史研究一般观点**：肯定其在新民主主义革命时期的贡献，同时严厉批判其建国后进行分裂党、篡夺党和国家最高权力的阴谋活动，认为其错误是严重的、系统的。\n3. **部分历史学者观点**：认为应将其革命时期的功绩与后来的错误分开评价，承认其在创建根据地和东北建设中的历史作用，但对其政治野心和破坏党的团结的行为予以否定。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**土地革命战争**时期，中国共产党在南方建立根据地的同时，在北方**陕甘边地区**也建立了革命根据地。\n- **关键事件/贡献**：**高岗**是**陕甘革命根据地**的主要创建者之一，该根据地成为**中央红军长征的落脚点**。\n- **代表作品/思想**：无。\n- **常见易混点/对比点**：注意区分**陕甘边根据地**与**陕北根据地**，后常合称**陕甘革命根据地**；主要创建者通常并提**刘志丹、谢子长、高岗**等。\n\n### 高中阶段\n- **时代背景**：**解放战争**时期，**东北**成为国共争夺的战略重点；**新中国成立初期**，面临巩固政权、恢复经济的艰巨任务。\n- **关键事件/贡献**：解放战争期间，**高岗**主持**中共中央东北局**工作，领导东北的**土地改革**和**经济恢复**，为前线提供支援。建国后任**中央人民政府副主席**、**国家计划委员会主席**。\n- **代表作品/思想**：无个人代表思想。其施政与**建国初期经济恢复**和**“一五”计划**制定相关。\n- **常见易混点/对比点**：**“高饶事件”**是建国后第一次重大的党内斗争，需了解其背景（**1953年全国财经会议**和**组织工作会议**）和性质（**分裂党、篡夺党和国家最高权力**）；注意与后来的**“文化大革命”**在性质和规模上的区别。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  ** const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
