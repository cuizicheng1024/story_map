: {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：笛卡尔的作品较少作为独立课文出现，但其哲学思想（尤其是**理性主义**和**“我思故我在”**）常在哲学、文学理论或科学史相关课文的背景知识中被提及。\n- 核心要点：\n    - **重点**：**“我思故我在”**（Cogito, ergo sum）是其哲学体系的**第一原理**，确立了**自我意识**作为一切知识的确定性起点。\n    - 其**理性主义**哲学强调**天赋观念**和**理性演绎**，与**经验主义**形成对比，是西方哲学史上的核心争论之一。\n    - **普遍怀疑**的方法：主张通过怀疑一切可怀疑之物，来寻找不可怀疑的**阿基米德支点**。\n    - **心物二元论**：认为**心灵**（思维实体）与**身体**（广延实体）是两种截然不同的实体，这一观点深刻影响了后世哲学与心理学。\n    - **解析几何**（笛卡尔坐标系）的创立，实现了**几何**问题与**代数**问题的相互转化，是数学史上的革命。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活在**科学革命**时期，与**伽利略**、**开普勒**等科学家同时代，其哲学为新科学提供了认识论基础。\n    - 主要著作在**荷兰**完成并出版，得益于当时荷兰相对宽松的**出版审查**环境。\n    - **《谈谈方法》** 的出版标志着其独立哲学体系的公开面世。\n    - 晚年应**瑞典女王克里斯蒂娜**之邀前往宫廷，最终客死他乡。\n- 核心要点：\n    - **重点**：被誉为**“近代哲学之父”**，其哲学开启了从**本体论**向**认识论**转向的“**主体性**”时代。\n    - **重点**：其**机械论**自然观（将宇宙视为一部大机器）为近代**经典物理学**的发展扫清了思想障碍。\n    - 与**教会长期保持谨慎关系**，其著作《论世界》因伽利略事件而主动暂停出版，但《第一哲学沉思集》仍试图为上帝存在提供新的证明。\n    - **功过评价**：其思想极大地推动了**理性**与**科学**精神的张扬，但其**心物二元论**也留下了难以解决的“**身心交感**”问题。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：笛卡尔的作品较少作为独立课文出现，但其哲学思想（尤其是**理性主义**和**“我思故我在”**）常在哲学、文学理论或科学史相关课文的背景知识中被提及。\n- 核心要点：\n    - **重点**：**“我思故我在”**（Cogito, ergo sum）是其哲学体系的**第一原理**，确立了**自我意识**作为一切知识的确定性起点。\n    - 其**理性主义**哲学强调**天赋观念**和**理性演绎**，与**经验主义**形成对比，是西方哲学史上的核心争论之一。\n    - **普遍怀疑**的方法：主张通过怀疑一切可怀疑之物，来寻找不可怀疑的**阿基米德支点**。\n    - **心物二元论**：认为**心灵**（思维实体）与**身体**（广延实体）是两种截然不同的实体，这一观点深刻影响了后世哲学与心理学。\n    - **解析几何**（笛卡尔坐标系）的创立，实现了**几何**问题与**代数**问题的相互转化，是数学史上的革命。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活在**科学革命**时期，与**伽利略**、**开普勒**等科学家同时代，其哲学为新科学提供了认识论基础。\n    - 主要著作在**荷兰**完成并出版，得益于当时荷兰相对宽松的**出版审查**环境。\n    - **《谈谈方法》** 的出版标志着其独立哲学体系的公开面世。\n    - 晚年应**瑞典女王克里斯蒂娜**之邀前往宫廷，最终客死他乡。\n- 核心要点：\n    - **重点**：被誉为**“近代哲学之父”**，其哲学开启了从**本体论**向**认识论**转向的“**主体性**”时代。\n    - **重点**：其**机械论**自然观（将宇宙视为一部大机器）为近代**经典物理学**的发展扫清了思想障碍。\n    - 与**教会长期保持谨慎关系**，其著作《论世界》因伽利略事件而主动暂停出版，但《第一哲学沉思集》仍试图为上帝存在提供新的证明。\n    - **功过评价**：其思想极大地推动了**理性**与**科学**精神的张扬，但其**心物二元论**也留下了难以解决的“**身心交感**”问题。\n\n---", "markdown": "# 笛卡尔\n\n## 人物档案\n\n### 基本信息\n- **姓名**：勒内·笛卡尔\n- **时代**：17世纪（欧洲近代早期）\n- **出生**：公元1596年3月31日，法兰西王国图赖讷省拉艾（今法国安德尔-卢瓦尔省笛卡尔镇）\n- **去世**：公元1650年2月11日，瑞典斯德哥尔摩（今瑞典斯德哥尔摩）\n- **享年**：53岁\n- **主要身份**：哲学家、数学家、物理学家\n- **历史地位**：近代西方哲学与解析几何的奠基人之一，被誉为“近代哲学之父”。\n- **主要成就**：\n    - 创立以“我思故我在”为核心的理性主义哲学体系。\n    - 发明解析几何，将代数与几何相结合（笛卡尔坐标系）。\n    - 提出“普遍怀疑”的方法论。\n    - 在物理学上发展了关于宇宙的漩涡理论。\n\n### 生平概述\n笛卡尔生于法国一个贵族家庭，幼年丧母，身体孱弱但求知欲强。他早年接受耶稣会教育，后在普瓦捷大学学习法律。1618年，他投身荷兰奥兰治拿骚的莫里斯亲王军队，开始游历欧洲。1628年后，他主要定居于思想相对自由的荷兰，在那里完成了其大部分重要著作，包括《谈谈方法》、《第一哲学沉思集》和《哲学原理》。1649年，他应瑞典女王克里斯蒂娜之邀前往斯德哥尔摩宫廷讲学，终因不适应严寒气候与繁重课业，次年病逝。他的思想深刻影响了后世的科学与哲学发展。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍布西欧，以法国为起点，荷兰为长期居所，终老于瑞典。\n- ⏱️ **时间跨度**：公元1596年 - 1650年，共53年。\n- 📍 **地理范围**：主要覆盖今法国、荷兰、瑞典，并游历过丹麦、德国、意大利等地。\n- 🌟 **重要节点数量**：核心地点9个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：拉艾（La Haye en Touraine）\n- **时间**：公元1596年\n- **停留时间**：童年早期（约至1604年左右）\n- **地点**：法兰西王国图赖讷省拉艾（今法国安德尔-卢瓦尔省笛卡尔镇）\n- **事件**：出生于一个地位较低的贵族家庭，母亲在他一岁多时因肺结核去世。\n- **意义**：其出生地后更名为“笛卡尔镇”以纪念他。\n\n### 📍 重要地点：拉弗莱什（La Flèche）\n- **时间**：约公元1604年 - 1612年\n- **停留时间**：约8年\n- **地点**：法兰西王国拉弗莱什（今法国卢瓦尔河地区大区萨尔特省拉弗莱什）\n- **事件**：进入由亨利四世创立的拉弗莱什耶稣会公学学习，接受了系统的古典学、数学和哲学教育。\n- **意义**：奠定了其深厚的学术基础，但也促使他后来对经院哲学产生普遍怀疑。\n\n### 📍 重要地点：普瓦捷（Poitiers）\n- **时间**：约公元1612年 - 1616年\n- **停留时间**：约4年\n- **地点**：法兰西王国普瓦捷（今法国新阿基坦大区维埃纳省普瓦捷）\n- **事件**：在普瓦捷大学学习法律，于1616年获得法学学位。\n- **意义**：完成了正规的高等教育，但此后他并未从事法律职业，而是选择了探索世界与追求真理。\n\n### 📍 重要地点：荷兰（军旅与游历）\n- **时间**：公元1618年 - 1619年\n- **停留时间**：约1年\n- **地点**：荷兰共和国布雷达等地（今荷兰北布拉班特省布雷达）\n- **事件**：加入莫里斯亲王的军队。在布雷达结识了数学家贝克曼，激发了对数学和科学的强烈兴趣。1619年11月10日，在德国乌尔姆（今德国巴登-符腾堡州乌尔姆）的“火炉”梦境中，获得了关于“一门非凡新科学”的启示。开启了其学术生涯的关键转折点，确立了将数学的确定性方法应用于所有知识领域的志向。\n\n### 📍 重要地点：巴黎\n- **时间**：公元1622年 - 1628年（间歇居住）\n- **停留时间**：累计数年\n- **地点**：法兰西王国巴黎（今法国巴黎）\n- **事件**：游历意大利后返回法国，在巴黎的学术圈中活动，与马兰·梅森、伽桑狄等学者交流，阐述自己的早期思想。\n- **意义**：在学术中心检验和传播自己的思想，最终因觉得巴黎过于喧嚣，决定前往更安静的荷兰定居。\n\n### 📍 重要地点：阿姆斯特丹（Amsterdam）\n- **时间**：公元1629年 - 1630年（及后续多次短期居住）\n- **停留时间**：约1年（首次长期定居）\n- **地点**：荷兰共和国阿姆斯特丹（今荷兰北荷兰省阿姆斯特丹）\n- **事件**：在荷兰的首个主要居住地，开始系统撰写《论世界》。\n- **意义**：开启了在荷兰长达约20年的隐居著述生涯。\n\n### 📍 重要地点：莱顿（Leiden）\n- **时间**：公元1630年 - 1632年\n- **停留时间**：约2年\n- **地点**：荷兰共和国莱顿（今荷兰南荷兰省莱顿）\n- **事件**：移居莱顿，与当地出版商埃尔泽维尔家族建立联系。1632年，完成了《谈谈方法》及其附录《几何学》的撰写，但出版推迟至1637年；同时，撰写了以哥白尼学说为基础的物理学著作《世界》（后因伽利略被审判而暂停出版）。\n- **意义**：《几何学》的完成标志着解析几何的诞生，是其科学成就的顶峰之一。\n\n### 📍 重要地点：埃赫蒙德-宾嫩（Egmond-Binnen）\n- **时间**：公元1643年 - 1649年\n- **停留时间**：约6年\n- **地点**：荷兰共和国北荷兰省埃格蒙德（今荷兰北荷兰省埃赫蒙德-宾嫩）\n- **事件**：在荷兰最宁静的居住地之一。期间与波希米亚的伊丽莎白公主通信，探讨哲学与伦理问题，出版了《哲学原理》。也卷入了与乌得勒支大学教授的激烈论战。\n- **意义**：完成了其哲学体系的最终阐述，也经历了在荷兰最严重的学术与人身攻击。\n\n### 🔴 去世地：斯德哥尔摩（Stockholm）\n- **时间**：公元1649年10月 - 1650年2月\n- **停留时间**：约5个月\n- **地点**：瑞典斯德哥尔摩（今瑞典斯德哥尔摩）\n- **事件**：应瑞典女王克里斯蒂娜之邀，前往宫廷担任哲学教师。每周三次在清晨五点为女王授课。\n- **意义**：不适应北欧严寒气候和凌晨授课的严苛作息，患上肺炎，于1650年2月11日病逝。\n- **名篇名句**：《谈谈方法》：“我思，故我在。”（Cogito, ergo sum.）\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1596 | 0 | 出生于法国拉艾。 |\n| 1604 | 8 | 进入拉弗莱什耶稣会学校学习。 |\n| 1616 | 20 | 获普瓦捷大学法学学位。 |\n| 1618 | 22 | 加入荷兰军队，结识贝克曼，投身数学与科学研究。 |\n| 1619 | 23 | 经历“火炉”梦境，确立方法论志向。 |\n| 1628 | 32 | 离开巴黎，决定定居荷兰。 |\n| 1632 | 36 | 移居莱顿，完成《谈谈方法》及附录《几何学》撰写。 |\n| 1637 | 41 | 出版《谈谈方法》及附录《几何学》，发明解析几何，首次公开阐述其哲学方法。 |\n| 1641 | 45 | 出版《第一哲学沉思集》。 |\n| 1644 | 48 | 出版《哲学原理》，系统阐述其物理学和宇宙观。 |\n| 1649 | 53 | 应邀前往瑞典斯德哥尔摩。 |\n| 1650 | 53 | 在斯德哥尔摩病逝。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：笛卡尔的作品较少作为独立课文出现，但其哲学思想（尤其是**理性主义**和**“我思故我在”**）常在哲学、文学理论或科学史相关课文的背景知识中被提及。\n- 核心要点：\n    - **重点**：**“我思故我在”**（Cogito, ergo sum）是其哲学体系的**第一原理**，确立了**自我意识**作为一切知识的确定性起点。\n    - 其**理性主义**哲学强调**天赋观念**和**理性演绎**，与**经验主义**形成对比，是西方哲学史上的核心争论之一。\n    - **普遍怀疑**的方法：主张通过怀疑一切可怀疑之物，来寻找不可怀疑的**阿基米德支点**。\n    - **心物二元论**：认为**心灵**（思维实体）与**身体**（广延实体）是两种截然不同的实体，这一观点深刻影响了后世哲学与心理学。\n    - **解析几何**（笛卡尔坐标系）的创立，实现了**几何**问题与**代数**问题的相互转化，是数学史上的革命。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活在**科学革命**时期，与**伽利略**、**开普勒**等科学家同时代，其哲学为新科学提供了认识论基础。\n    - 主要著作在**荷兰**完成并出版，得益于当时荷兰相对宽松的**出版审查**环境。\n    - **《谈谈方法》** 的出版标志着其独立哲学体系的公开面世。\n    - 晚年应**瑞典女王克里斯蒂娜**之邀前往宫廷，最 const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};

root.render(<App />);
