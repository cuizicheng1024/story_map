 "quoteLines": ["电影剧本《祝福》（改编自鲁迅同名小说）。"]}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《包身工》**（报告文学）、**《祝福》**（电影剧本，改编自鲁迅小说）。\n- 核心要点：\n    - **重点**：**《包身工》** 是中国现代报告文学的奠基之作，以实地调查为基础，具有强烈的**纪实性**与**批判性**。\n    - **重点**：作品通过“芦柴棒”等典型人物与细节，深刻揭露了**半殖民地半封建社会**下帝国主义与中国封建势力结合对劳动人民的残酷压榨。\n    - **重点**：**《包身工》** 运用了**文学化的叙事**与**数据化分析**相结合的手法，增强了作品的真实性与感染力。\n    - **《祝福》** 的改编成功地将鲁迅小说的**思想深度**转化为电影语言，保留了原著对**封建礼教**“吃人”本质的控诉。\n    - 夏衍的创作风格以**严谨、冷峻、深刻**著称，善于从社会底层挖掘题材，体现强烈的社会责任感。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：夏衍是**中国左翼作家联盟**（左联）和**左翼戏剧家联盟**的发起人与领导人之一，是**左翼文艺运动**的核心人物。\n    - 抗战时期，他在上海、广州、桂林、重庆等地坚持**抗战文艺**工作，是文化战线抗日民族统一战线的重要执行者。\n    - **重点**：新中国成立后，他长期担任**文化部副部长**，是**社会主义文艺建设**的重要领导者之一，在电影、戏剧改革中发挥了关键作用。\n- 核心要点：\n    - **重点**：夏衍的一生贯穿了20世纪中国**革命与建设**的多个阶段，其文艺活动与政治追求紧密结合，是**革命文艺家**的典型代表。\n    - **重点**：他的作品与活动始终服务于**民族解放**与**社会进步**的宏大目标，体现了文艺的**社会功能**与**战斗性**。\n    - **重点**：作为**社会活动家**，他在团结知识分子、推动统一战线方面成就卓著，其个人命运与中国现代史进程深刻交织。", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《包身工》**（报告文学）、**《祝福》**（电影剧本，改编自鲁迅小说）。\n- 核心要点：\n    - **重点**：**《包身工》** 是中国现代报告文学的奠基之作，以实地调查为基础，具有强烈的**纪实性**与**批判性**。\n    - **重点**：作品通过“芦柴棒”等典型人物与细节，深刻揭露了**半殖民地半封建社会**下帝国主义与中国封建势力结合对劳动人民的残酷压榨。\n    - **重点**：**《包身工》** 运用了**文学化的叙事**与**数据化分析**相结合的手法，增强了作品的真实性与感染力。\n    - **《祝福》** 的改编成功地将鲁迅小说的**思想深度**转化为电影语言，保留了原著对**封建礼教**“吃人”本质的控诉。\n    - 夏衍的创作风格以**严谨、冷峻、深刻**著称，善于从社会底层挖掘题材，体现强烈的社会责任感。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：夏衍是**中国左翼作家联盟**（左联）和**左翼戏剧家联盟**的发起人与领导人之一，是**左翼文艺运动**的核心人物。\n    - 抗战时期，他在上海、广州、桂林、重庆等地坚持**抗战文艺**工作，是文化战线抗日民族统一战线的重要执行者。\n    - **重点**：新中国成立后，他长期担任**文化部副部长**，是**社会主义文艺建设**的重要领导者之一，在电影、戏剧改革中发挥了关键作用。\n- 核心要点：\n    - **重点**：夏衍的一生贯穿了20世纪中国**革命与建设**的多个阶段，其文艺活动与政治追求紧密结合，是**革命文艺家**的典型代表。\n    - **重点**：他的作品与活动始终服务于**民族解放**与**社会进步**的宏大目标，体现了文艺的**社会功能**与**战斗性**。\n    - **重点**：作为**社会活动家**，他在团结知识分子、推动统一战线方面成就卓著，其个人命运与中国现代史进程深刻交织。", "markdown": "# 夏衍\n\n## 人物档案\n\n### 基本信息\n- **姓名**：夏衍\n- **别名/原名**：沈乃熙，字端轩（亦作端先）\n- **时代**：近现代中国（清末至新中国）\n- **出生**：公元1900年，浙江杭州府（今浙江省杭州市）\n- **去世**：公元1995年，北京（今北京市）\n- **享年**：95岁（96虚岁）\n- **主要身份**：剧作家、作家、翻译家、社会活动家\n- **历史地位**：中国现代戏剧的开拓者之一，左翼文艺运动的先驱与领导者。\n- **主要成就**：\n    - 创作了话剧《上海屋檐下》、报告文学《包身工》等里程碑式作品。\n    - 改编鲁迅小说《祝福》为电影剧本，成为经典。\n    - 改编茅盾小说《林家铺子》为电影剧本。\n    - 撰写回忆录《懒寻旧梦录》。\n    - 长期领导左翼戏剧运动及新中国文化事业。\n\n### 生平概述\n夏衍生于清末，成长于民族危亡之际。早年留学日本，接触马克思主义，思想发生转变。1927年回国后加入中国共产党，成为左翼作家联盟和左翼戏剧家联盟的领导人之一，以笔为枪进行社会批判与革命宣传。抗战期间，他辗转上海、广州、桂林、重庆等地，坚持抗战文艺创作与组织工作。新中国成立后，他担任文化部副部长等职务，为社会主义文艺事业的建设与发展作出了重要贡献。其一生跨越多个历史时期，始终与中国现代文艺的进程紧密相连。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从杭州出发，足迹遍及日本、上海、广州、桂林、重庆、北京等地，横跨中国东部、南部并远至日本。\n- ⏱️ **时间跨度**：1900年 - 1995年（共96个年份）。\n- 📍 **地理范围**：主要覆盖浙江、日本东京、上海、广东、广西、四川（含抗战时期属四川的重庆）、北京等地。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：杭州\n- **时间**：公元1900年\n- **停留时间**：约15年\n- **地点**：浙江杭州府（今浙江省杭州市）\n- **事件**：出生于一个没落的书香门第，原名沈乃熙，字端轩。\n- **意义**：江南的文化氛围为其奠定了最初的文学基础。\n\n### 📍 重要地点：杭州（求学与思想启蒙）\n- **时间**：约公元1915年 - 1919年\n- **停留时间**：约4年\n- **地点**：浙江杭州（今浙江省杭州市）\n- **事件**：就读于浙江省立甲种工业学校；积极参与五四运动，接触《新青年》等进步刊物。\n- **意义**：接受了民主与科学的新思想，开始关注社会现实，为其日后走上革命文艺道路埋下伏笔。\n\n### 📍 重要地点：日本东京\n- **时间**：公元1920年 - 1927年\n- **停留时间**：约7年\n- **地点**：日本东京（今日本东京都）\n- **事件**：公费留学，就读于明治专门学校（今九州工业大学）电机专业；系统学习马克思主义理论，参加日本工人运动和左翼文艺活动。\n- **意义**：完成了从工业救国到革命文艺的思想转变，确立了共产主义信仰，为回国从事左翼文化运动做好了准备。\n\n### 📍 重要地点：上海（左翼文化核心时期）\n- **时间**：公元1927年 - 1937年\n- **停留时间**：约10年\n- **地点**：上海（今上海市）\n- **事件**：加入中国共产党；参与筹备左翼作家联盟并当选执行委员；领导左翼戏剧家联盟；创作报告文学《包身工》、话剧《上海屋檐下》；翻译高尔基《母亲》等外国进步文学。\n- **意义**：成为左翼文艺运动的中坚力量，其作品深刻揭露社会黑暗，艺术上达到高峰，奠定了在中国现代文学史上的重要地位。\n- **名篇名句**：《包身工》：“黑夜，静寂得像死一般的黑夜！但是，黎明的到来，毕竟是无法抗拒的。”；《上海屋檐下》：“大家都是穷人，穷人何必为难穷人。”\n\n### 📍 重要地点：上海（抗战初期）\n- **时间**：公元1937年 - 1938年\n- **停留时间**：约1年\n- **地点**：上海（今上海市）\n- **事件**：“八一三”事变后，留在“孤岛”上海，主持《救亡日报》工作，进行抗战宣传。\n- **意义**：在极其艰难的环境下坚守文化抗战阵地，鼓舞民众抗战士气。\n\n### 📍 重要地点：广州\n- **时间**：公元1938年\n- **停留时间**：数月\n- **地点**：广东广州（今广东省广州市）\n- **事件**：上海沦陷后，将《救亡日报》迁至广州复刊，继续开展抗日宣传。\n- **意义**：延续了抗战文化火种，团结华南文化界人士。\n\n### 📍 重要地点：桂林\n- **时间**：公元1939年 - 1941年\n- **停留时间**：约2年\n- **地点**：广西桂林（今广西壮族自治区桂林市）\n- **事件**：在广州失守后辗转至桂林，继续主持《救亡日报》并从事戏剧创作和统战工作。\n- **意义**：在抗战时期的文化城桂林，为保存和壮大进步文化力量作出了贡献。\n\n### 📍 重要地点：重庆\n- **时间**：公元1942年 - 1945年\n- **停留时间**：约3年\n- **地点**：重庆（今重庆市）\n- **事件**：奉周恩来之命赴重庆，负责文化界统一战线工作；担任《新华日报》特约评论员；创作话剧《法西斯细菌》。\n- **意义**：在国统区中心，以文艺为武器，坚持团结抗战，反对分裂倒退。\n- **名篇名句**：《法西斯细菌》：“法西斯主义是科学的敌人，是文化的敌人。”\n\n### 📍 重要地点：上海（战后至建国前）\n- **时间**：公元1946年 - 1949年\n- **停留时间**：约3年\n- **地点**：上海（今上海市）\n- **事件**：抗战胜利后返回上海，从事统战和文化领导工作；迎接上海解放。\n- **意义**：为战后上海文化界的恢复和迎接新中国诞生做了大量工作。\n\n### 🔴 去世地：北京\n- **时间**：公元1949年 - 1995年\n- **停留时间**：46年\n- **地点**：北京（今北京市）\n- **事件**：新中国成立后，历任上海市委常委、宣传部长，文化部副部长等职；主持改编电影《祝福》《林家铺子》；晚年撰写回忆录《懒寻旧梦录》。\n- **意义**：作为新中国文化事业的重要领导人之一，在戏剧、电影等领域贡献卓著；其一生是20世纪中国知识分子追求光明、投身革命的缩影。\n- **名篇名句**：电影剧本《祝福》（改编自鲁迅同名小说）。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1900 | 0岁 | 出生于浙江杭州。 |\n| 1919 | 19岁 | 在杭州参与五四运动。 |\n| 1920 | 20岁 | 赴日本留学，思想逐渐转向马克思主义。 |\n| 1927 | 27岁 | 回国，在上海加入中国共产党，开始左翼文艺生涯。 |\n| 1930 | 30岁 | 参与发起成立“左联”。 |\n| 1936 | 36岁 | 发表报告文学代表作《包身工》。 |\n| 1937 | 37岁 | 创作话剧《上海屋檐下》；抗战爆发后投身救亡运动。 |\n| 1942 | 42岁 | 抵达重庆，从事统战与文化工作。 |\n| 1949 | 49岁 | 参加中国人民政治协商会议第一届全体会议；新中国成立后定居北京。 |\n| 1954 | 54岁 | 调任文化部副部长。 |\n| 1956 | 56岁 | 主持改编的电影《祝福》上映。 |\n| 1995 | 95岁 | 在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《包身工》**（报告文学）、**《祝福》**（电影剧本，改编自鲁迅小说）。\n- 核心要点：\n    - **重点**：**《包身工》** 是中国现代报告文学的奠基之作，以实地调查为基础，具有强烈的**纪实性**与**批判性**。\n    - **重点**：作品通过“芦柴棒”等典型人物与细节，深刻揭露了**半殖民地半封建社会**下帝国主义与中国封建势力结合对劳动人民的残酷压榨。\n    - **重点**：**《包身工》** 运用了**文学化的叙事**与**数据化分析**相结合的手法，增强了作品的真实性与感染力。\n    - **《祝福》** 的改编成功地将鲁迅小说的**思想深度**转化为电影语言，保留了原著对**封建礼教**“吃人”本质的控诉。\n    - 夏衍的创作风格以**严谨、冷峻、深刻**著称，善于从社会底层挖掘题材，体现强烈的社会责任感。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：夏衍是**中国左翼作家联盟**（左联）和**左翼戏剧家联盟**的发起人与领导人之一，是**左翼文艺运动**的核心人物。\n    - 抗战时期，他在上海、广州、桂林、重庆等地坚持**抗战文艺**工作，是文化战线抗日民族统一战线的重要执行者。\n    - **重点**：新中国成立后，他长期担任**文化部副部长**，是**社会主义文艺建设**的重要领导者之一，在电影、戏剧改革中发挥了关键作用。\n- 核心要点：\n    - **重点**：夏衍的一生贯穿了20世纪中国* const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
