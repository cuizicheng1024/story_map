于学术中心。\n- ⏱️ **时间跨度**：1879年 - 1955年，共计76年。\n- 📍 **地理范围**：主要覆盖中欧（德语区）及美国东海岸。\n- 🌟 **重要节点数量**：约10个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：乌尔姆\n- **公元纪年**：1879年\n- **停留时间**：约1年（婴儿期）\n- **位置**：德意志帝国符腾堡王国乌尔姆市（今德国巴登-符腾堡州乌尔姆市）\n- **事迹**：在此出生。\n- **意义**：生命的起点。\n\n### 📍 重要地点：慕尼黑\n- **公元纪年**：1880年 - 1894年\n- **停留时间**：童年及青少年时期（约14年）\n- **位置**：德意志帝国巴伐利亚王国慕尼黑（今德国巴伐利亚州慕尼黑市）\n- **事迹**：在此接受小学和中学教育；对电磁现象产生浓厚兴趣；因厌恶德国军国主义教育，首次萌生放弃德国国籍的念头。\n- **意义**：科学兴趣的启蒙地，也是其反权威、反军国主义思想的萌芽地。\n\n### 📍 重要地点：苏黎世（求学）\n- **公元纪年**：1896年 - 1900年\n- **停留时间**：大学时期（4年）\n- **位置**：瑞士联邦苏黎世（今瑞士苏黎世）\n- **事迹**：进入苏黎世联邦理工学院学习物理学和数学；与同学米列娃·马里奇相识相恋；学业上常因不循常规而与教授产生矛盾。\n- **意义**：获得系统科学训练，奠定学术基础，并结识第一任妻子。\n\n### 📍 重要地点：伯尔尼\n- **公元纪年**：1902年 - 1909年\n- **停留时间**：约7年\n- **位置**：瑞士联邦伯尔尼（今瑞士伯尔尼）\n- **事迹**：在伯尔尼联邦专利局担任三级技术员；与好友哈比希特、索洛文组成“奥林匹亚科学院”自学讨论；1905年（“奇迹年”）发表《论动体的电动力学》（狭义相对论）、《关于光的产生和转化的一个启发性观点》（光量子说）等四篇划时代论文。\n- **意义**：职业生涯初期，也是其科学创造力爆发的黄金时期，完成了从专利员到顶尖物理学家的蜕变。\n- **名篇名句**：《论动体的电动力学》：“……我们应当把时间的陈述理解为同时性事件的陈述。”；《关于光的产生和转化的一个启发性观点》：“……光的能量在空间中不是连续分布的。”\n\n### 📍 重要地点：布拉格\n- **公元纪年**：1911年 - 1912年\n- **停留时间**：约1年半\n- **位置**：奥匈帝国波希米亚王国布拉格（今捷克共和国布拉格）\n- **事迹**：任布拉格德意志大学理论物理学教授；首次计算光线经过太阳边缘的偏折角度，为广义相对论提供关键预言。\n- **意义**：首次获得教授职位，学术地位提升，广义相对论研究取得关键进展。\n\n### 📍 重要地点：柏林\n- **公元纪年**：1914年 - 1933年\n- **停留时间**：约19年\n- **位置**：德意志帝国/魏玛共和国柏林（今德国柏林）\n- **事迹**：任普鲁士科学院院士、柏林大学教授、威廉皇帝物理研究所所长；与第一任妻子离婚，与表姐爱尔莎结婚；1915年完成广义相对论；1919年日食观测证实其引力透镜预言，使其举世闻名；公开反对德国军国主义和纳粹主义。\n- **意义**：学术生涯的顶峰，完成了最伟大的科学成就（广义相对论），并成为具有巨大公共影响力的知识分子。此地也见证了他因政治环境被迫离开德国。\n- **名篇名句**：《广义相对论的基础》：“……物理定律必须具有这样的性质，它们对于无论以哪种方式运动着的参照系都是成立的。”\n\n### 📍 重要地点：莱顿\n- **公元纪年**：20世纪20年代（多次短期访问）\n- **停留时间**：短期访问讲学\n- **位置**：荷兰王国莱顿（今荷兰莱顿）\n- **事迹**：作为特邀教授访问莱顿大学，与好友、物理学家埃伦费斯特交流，并与洛伦兹、外尔等学者切磋。\n- **意义**：重要的国际学术交流中心，与欧洲顶尖物理学家保持密切联系。\n\n### 📍 重要地点：普林斯顿\n- **公元纪年**：1933年 - 1955年\n- **停留时间**：晚年时期（22年）\n- **位置**：美国新泽西州普林斯顿（今美国新泽西州普林斯顿市）\n- **事迹**：受聘于新成立的普林斯顿高等研究院；致力于统一场论研究；二战期间致信罗斯福总统，促成“曼哈顿计划”，但本人未参与具体研究；战后积极倡导核武器控制与世界政府；1955年签署《罗素-爱因斯坦宣言》，呼吁和平利用科学。\n- **意义**：人生的最后驿站，远离欧洲战火，在相对宁静的环境中继续思考终极物理问题，并成为全球和平与人道主义的象征。\n- **名篇名句**：致罗斯福总统的信（1939年）：“……这种新的现象（指核裂变）也可用来制造炸弹，并且能够想象——尽管还不能确定——一种新型的威力极大的炸弹可以由此制造出来。”\n\n### 🔴 去世地：普林斯顿\n- **公元纪年**：1955年4月18日\n- **停留时间**：生命最后22年\n- **位置**：美国新泽西州普林斯顿（今美国新泽西州普林斯顿市）\n- **经过**：因腹主动脉瘤破裂逝世于普林斯顿医院。遵照其遗嘱，遗体火化，骨灰被秘密撒放，不立纪念碑，不举行公开葬礼。\n- **意义**：生命的终点。其简朴的葬礼和对身后事的安排，体现了他一生反对个人崇拜、追求精神自由的品格。\n- **名篇名句**：临终前（对护士，用德语）：“我已完成了我的份内事，现在该走了。”\n\n---\n\n## 四、地点坐标\n\n| 地点名称（现代） | 备注 |\n| :--- | :--- |\n| 今德国巴登-符腾堡州乌尔姆市 | 出生地 |\n| 今德国巴伐利亚州慕尼黑市 | 童年及青少年时期 |\n| 今瑞士苏黎世 | 大学求学地 |\n| 今瑞士伯尔尼 | 专利局工作及“奇迹年”所在地 |\n| 今捷克共和国布拉格 | 首次担任教授地 |\n| 今德国柏林 | 学术生涯顶峰时期所在地 |\n| 今荷兰莱顿 | 学术访问地 |\n| 今美国新泽西州普林斯顿市 | 晚年工作及去世地 |\n\n---\n\n## 五、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 1879 | 0 | 出生于德国乌尔姆。 |\n| 1896 | 17 | 放弃德国国籍，进入苏黎世联邦理工学院学习。 |\n| 1900 | 21 | 毕业，但未能获得助教职位。 |\n| 1902 | 23 | 受聘于伯尔尼专利局；“奥林匹亚科学院”成立。 |\n| 1905 | 26 | “奇迹年”，发表狭义相对论、光量子说等四篇论文。 |\n| 1909 | 30 | 离开专利局，首次获得苏黎世大学编外教授职位。 |\n| 1911 | 32 | 任布拉格德意志大学教授；首次计算光线偏折。 |\n| 1914 | 35 | 迁居柏林，任普鲁士科学院院士等职。 |\n| 1915 | 36 | 完成广义相对论。 |\n| 1919 | 40 | 日食观测证实广义相对论预言，名声大振；与米列娃离婚。 |\n| 1921 | 42 | 因光电效应定律获诺贝尔物理学奖。 |\n| 1933 | 54 | 因纳粹迫害移居美国，任职于普林斯顿高等研究院。 |\n| 1939 | 60 | 上书罗斯福总统，建议研制原子弹。 |\n| 1952 | 73 | 以色列政府邀请其出任第二任总统，婉拒。 |\n| 1955 | 76 | 签署《罗素-爱因斯坦宣言》；4月18日在普林斯顿逝世。 |\n\n---\n\n## 六、历史影响\n\n### 对当时的影响\n爱因斯坦的相对论彻底颠覆了牛顿力学建立的绝对时空观，引发了物理学基础理论的革命，使他在20世纪初即成为科学界的泰斗。他的光量子假说为量子力学的建立开辟了道路。同时，作为一位具有强烈社会责任感的公共知识分子，他对两次世界大战、法西斯主义、种族迫害的鲜明反对态度，以及对核武器的警惕，深刻影响了当时的科学界舆论和国际和平运动。\n\n### 对后世的影响\n1. **科技发展**：相对论是现代宇宙学、天体物理学（如黑洞、引力波）、粒子物理学和全球卫星定位系统（GPS）的理论基石。\n2. **科学方法论**：其思想实验和追求理论统一性的方法，成为理论物理学研究的典范。\n3. **文化符号**：“爱因斯坦”成为“天才”的代名词，其形象（蓬乱白发、吐舌照片）和质能方程（E=mc²）成为流行文化标志。\n4. **科学家的社会责任**：树立了科学家关心人类命运、积极参与公共事务的榜样。\n\n### 历史评价\n1. **马克斯·普朗克**（量子论创始人）：“爱因斯坦的理论，将把我们关于物质结构和宇宙演化的全部观念引向一个新的方向。”\n2. **《时代》杂志**（1999年）：评选爱因斯坦为“20世纪风云人物”，称他“作为科学家、人道主义者以及原子时代一位不太可能的文化偶像，界定了我们这个世纪的创造性天才。”\n3. **杨振宁**（物理学家）：“20世纪物理学的三大贡献中，有两个半都是爱因斯坦的。”（指狭义相对论、广义相对论和量子力学的奠基工作）\n4. **罗素**（哲学家）：“爱因斯坦不仅是一位伟大的科学家，也是一位伟大的人……他具有战士的坚韧，又有艺术家的敏感与温柔。”\n\n---\n\n## 七、人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**第二次工业革命**后，科学技术迅猛发展；**两次世界大战**深刻影响世界格局。\n- **关键事件/贡献**：提出**狭义相对论**和**广义相对论**，改变了人类对**时间、空间、物质和引力**的认识；因解释**光电效应**获得**诺贝尔物理学奖**。\n- **代表作品/思想**：质能方程 **E=mc²**。\n- **常见易混点/对比点**：与**牛顿**经典力学体系的关系（继承与发展）；相对论与日常生活经验（低速下）的差异。\n\n### 高中阶段\n- **时代背景**：**经典物理学**危机（以太漂移实验、黑体辐射等）；**量子力学**的诞生与发展。\n- **关键事件/贡献**：1905年“**奇迹年**”的四篇论文；**光量子假说**（光的波粒二象性）对量子理论的贡献；**布朗运动**的理论解释；**广义相对论**预言（光线弯曲、引力红移、引力波）。\n- **代表作品/思想**：**《论动体的电动力学》**；**统一场论**的探索。\n- **常见易混点/对比点**：**狭义相对论**（惯性系、光速不变）与**广义相对论**（非惯性系、等效原理）的核心区别；爱因斯坦对**量子力学**的贡献（奠基）与对其**哥本哈根诠释**的质疑（“上帝不掷骰子”）。\n\n---\n\n## 八、初高中阶段考点\n\n### 初中阶段\n- 爱因斯坦是**20世纪最伟大的物理学家**之一。\n- 他最重要的理论是**相对论**，包括**狭义相对论**和**广义相对论**。\n- 他提出了著名的质能方程 **E=mc²**，揭示了质量和能量可以相互转换。\n- 他因在**光电效应**方面的研究获得**1921年诺贝尔物理学奖**。\n- 他是一位**和平主义者**，反对战争和法西斯主义。\n- （存疑/说法不一）关于他是否亲自参与**曼哈顿计划**（原子弹研制）：他本人并未参与，但其理论和上书罗斯福的信件是重要推动因素。\n\n### 高中阶段\n- **狭义相对论**的两个基本原理：**相对性原理**和**光速不变原理**。\n- **广义相对论**的核心思想：**等效原理**（引力与加速度等效）和**时空弯曲**（物质告诉时空如何弯曲，时空告诉物质如何运动）。\n- **光电效应**方程：**E_k = hν - W**，其中h是**普朗克常量**，ν是入射光频率，W是**逸出功**。该理论支持了**光的粒子性**。\n- 爱因斯坦对**量子力学**发展的双重角色：既是**奠基人之一**（光量子说），又是**主要质疑者**（对概率诠释的不满）。\n- **相对论**与**牛顿力学**的关系：牛顿力学是相对论在**低速（v<<c）宏观**条件下的近似。\n- 其科学成就的哲学意义：挑战了**绝对时空观**，建立了**相对时空观**。\n- （存疑/说法不一）关于**统一场论**的最终评价：其晚年致力于统一引力和电磁力的努力未获成功，但为后世**大统一理论**和**弦理论**等研究提供了思想启发。", "relatedGraph": {"center": {"id": "阿尔伯特·爱因斯坦", "name": "阿尔伯特·爱因斯坦", "file": "阿尔伯特·爱因斯坦.html", "dynasty": "现代（19世纪末至20世纪中期）", "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "阿尔伯特·爱因斯坦", "name": "阿尔伯特·爱因斯坦", "file": "阿尔伯特·爱因斯坦.html", "dynasty": "现代（19世纪末至20世纪中期）", "relationLabel": "中心人物", "isCenter": true}, {"id": "牛顿", "name": "牛顿", "file": "牛顿.html", "dynasty": "清", "relationLabel": "君臣", "sourceType": "markdown", "confidence": null, "isCenter": false}, {"id": "罗斯福", "name": "罗斯福", "file": "罗斯福.html", "dynasty": "20世纪上半叶（美国）", "relationLabel": "君臣", "sourceType": "markdown", "confidence": null, "isCenter": false}, {"id": "爱因斯坦", "name": "爱因斯坦", "file": "爱因斯坦.html", "dy     const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  const prunedKept = kept.filter((line, idx) => {
    const t = String(line || '').trim();
    const isHeading = t.startsWith('### ') || t.startsWith('#### ');
    if (!isHeading) return true;
    for (let j = idx + 1; j < kept.length; j += 1) {
      const next = String(kept[j] || '').trim();
      if (!next || /^-{3,}$/.test(next)) continue;
      if (next.startsWith('### ') || next.startsWith('#### ')) return false;
      return true;
    }
    return false;
  });

  return prunedKept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
