## 高中阶段\n- **时代背景**：在深入分析“文化大革命”的起因、过程和影响时，会涉及其角色。\n- **关键事件/贡献**：长期担任**毛泽东政治秘书**；参与**延安整风**和多次党内理论论争；**《红旗》杂志总编辑**；**中央文革小组**的组建与运作。\n- **代表作品/思想**：可能提及《窃国大盗袁世凯》、《人民公敌蒋介石》等早期著作，以及“文革”期间的社论。\n- **常见易混点/对比点**：其角色与**“四人帮”**（王洪文、张春桥、江青、姚文元）的异同；从“理论家”到“反革命集团主犯”的转变；**1970年庐山会议**（中共九届二中全会）是其政治生涯的转折点。\n\n---", "examPoints": "### 初中阶段\n1.  “文化大革命”的发动：**中央文革小组**成立，组长为**陈伯达**。\n2.  “文革”中的主要反革命集团：**林彪、江青反革命集团**，陈伯达是该集团主犯之一。\n3.  “文革”的结束与教训：1976年10月，“四人帮”被粉碎；1981年，最高人民法院特别法庭对林彪、江青反革命集团主犯进行公开审判，陈伯达被判处有期徒刑。\n\n### 高中阶段\n1.  毛泽东思想的形成与发展：在**延安时期**，陈伯达作为毛泽东的秘书，参与了理论宣传工作。\n2.  “文化大革命”的深层原因：涉及党内关于社会主义建设道路的分歧，以及个人崇拜现象的滋长，陈伯达的理论活动是这一背景的体现。\n3.  “文革”的发动标志：1966年5月中央政治局扩大会议和8月中共八届十一中全会，**中央文革小组**成立并逐步取代中央书记处，陈伯达任组长。\n4.  “文革”中的重大事件：**1970年庐山会议（九届二中全会）**，毛泽东与林彪集团矛盾公开化，陈伯达因此倒台，成为批陈整风运动的对象。\n5.  对“文革”的反思：**历史审判**的意义，1981年对林彪、江青反革命集团的审判，标志着对“文革”在法律和政治上的彻底否定。陈伯达案是其中重要组成部分。\n6.  **存疑/说法不一**：关于陈伯达在许多具体历史事件（如某些理论文章的起草、具体会议的发言）中的确切作用和动机，部分细节在不同回忆录和研究中存在出入。", "markdown": "# 陈伯达\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：陈伯达（原名陈建相，字尚友）\n- **时代**：现代中国（20世纪）\n- **出生**：1904年，福建省惠安县（今福建省泉州市惠安县）\n- **去世**：1989年9月20日，北京市\n- **享年**：约85岁（生于1904年，卒于1989年）\n- **主要身份**：政治人物、理论家、秘书、中共中央宣传部副部长、《红旗》杂志总编辑\n- **历史地位**：中国共产党高层的重要理论家和政治人物，曾长期担任毛泽东的政治秘书，在“文化大革命”中扮演了关键角色。\n- **主要成就**：长期担任毛泽东政治秘书；参与起草中共重要理论文件和社论；曾任《红旗》杂志总编辑；曾任中共中央政治局常委（1969-1970）。\n\n### 生平概述\n陈伯达早年投身革命，赴苏联莫斯科中山大学学习，回国后长期在中共宣传和理论战线工作。自1939年起担任毛泽东的政治秘书，历时31年，是毛泽东最重要的政治秘书和理论助手之一。他参与了延安整风、新中国成立后的多次理论论争，并在“文化大革命”初期进入权力核心，任中央文革小组组长，成为“中央第四号人物”。1970年庐山会议后失势，被开除党籍并关押。1981年被确认为林彪、江青反革命集团主犯之一，被判处有期徒刑18年（刑期自1970年被审查羁押起算）。晚年保外就医，直至去世。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要在中国，从东南沿海（福建）到革命中心（延安），再到政治中心（北京），最终囚禁于北京。\n- ⏱️ **时间跨度**：1904年 - 1989年，共约85年。\n- 📍 **地理范围**：福建、上海、莫斯科、延安、西柏坡、北京等地。\n- 🌟 **重要节点数量**：8个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：福建惠安\n- **公元纪年**：1904年\n- **停留时间**：童年及少年早期\n- **位置**：福建省惠安县（今福建省泉州市惠安县）\n- **事迹**：出生于此，并在此度过童年，接受早期教育。\n- **意义**：人生的起点，塑造了其早期的文化背景。\n\n### 📍 重要地点：厦门\n- **公元纪年**：1920年代初期\n- **停留时间**：求学阶段\n- **位置**：福建省厦门市（今福建省厦门市）\n- **事迹**：就读于集美师范学校，开始接触新思想。\n- **意义**：思想启蒙之地，为其后来走向革命道路奠定基础。\n\n### 📍 重要地点：上海\n- **公元纪年**：1924年-1927年\n- **停留时间**：约3年\n- **位置**：上海市（今上海市）\n- **事迹**：进入上海大学学习，加入中国国民党，并于1927年加入中国共产党。\n- **意义**：正式投身政治活动并加入中国共产党的关键转折点。\n\n### 📍 重要地点：莫斯科\n- **公元纪年**：1927年-1930年\n- **停留时间**：约3年\n- **位置**：苏联莫斯科（今俄罗斯联邦莫斯科）\n- **事迹**：赴莫斯科中山大学学习，系统接受马克思列宁主义理论训练。\n- **意义**：奠定了其马列主义理论基础，为其日后成为中共理论家做准备。\n\n### 📍 重要地点：延安\n- **公元纪年**：1937年-1947年\n- **停留时间**：约10年\n- **位置**：延安（今陕西省延安市）\n- **事迹**：1939年起担任毛泽东的政治秘书；参与延安整风运动；撰写《窃国大盗袁世凯》、《中国四大家族》（与人合著）等论著；在《解放日报》发表大量理论文章。\n- **意义**：人生和事业的黄金时期，成为毛泽东的核心智囊，奠定了其在党内理论界的地位。\n- **名篇名句**：《读〈湖南农民运动考察报告〉》；《评〈中国之命运〉》\n\n### 📍 重要地点：西柏坡\n- **公元纪年**：1947年-1949年\n- **停留时间**：约2年\n- **位置**：西柏坡（今河北省石家庄市平山县西柏坡镇）\n- **事迹**：随中共中央机关在此工作，参与起草重要文件，为新中国成立做理论准备。\n- **意义**：参与筹划新中国蓝图的“最后一个农村指挥所”。\n\n### 📍 重要地点：北京（中南海、钓鱼台等）\n- **公元纪年**：1949年-1970年\n- **停留时间**：21年\n- **位置**：北京市（今北京市）\n- **事迹**：继续担任毛泽东秘书；历任中宣部副部长、中国科学院副院长、《红旗》杂志总编辑；参与起草中共八大政治报告、关于国际共产主义运动总路线的论战文章等；1966年成为中央文革小组组长，进入政治局常委。\n- **意义**：政治生涯的顶峰，也是其权力核心活动的主要舞台。\n- **名篇名句**：《在毛泽东同志的旗帜下》；《资产阶级的世界观还是无产阶级的世界观》（与人合写）\n\n### 🔴 去世地：北京（秦城监狱及保外就医处）\n- **公元纪年**：1970年-1989年\n- **停留时间**：1970年-1989年（其中1970年起被审查，1971年起关押于秦城监狱约10年，1988年保外就医约1年）\n- **位置**：秦城监狱（位于今北京市昌平区）及北京市\n- **经过**：1970年庐山会议后被审查，随后被关押于秦城监狱。1981年被判处有期徒刑18年。1988年10月刑满释放，保外就医安置于北京。1989年9月20日因心肌梗塞在家中去世。\n- **意义**：人生的终点，从权力巅峰跌落至囚徒，最终在此走完一生。\n- **名篇名句**：无（晚年无公开作品）\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 1904 | 0 | 出生于福建惠安。 |\n| 1924 | 20 | 进入上海大学学习，加入国民党。 |\n| 1927 | 23 | 加入中国共产党；赴莫斯科中山大学学习。 |\n| 1930 | 26 | 回国，在天津、北平从事地下工作。 |\n| 1937 | 33 | 抵达延安，先后在陕北公学、中央党校等处任教。 |\n| 1939 | 35 | 开始担任毛泽东政治秘书。 |\n| 1945 | 41 | 参与中共七大，当选中央候补委员。 |\n| 1949 | 45 | 随中央迁至北京；任中宣部副部长等职。 |\n| 1958 | 54 | 任《红旗》杂志总编辑。 |\n| 1966 | 62 | 任中央文革小组组长；进入中共中央政治局常委行列。 |\n| 1969 | 65 | 在中共九大上当选政治局常委，排名第四。 |\n| 1970 | 66 | 庐山会议上受批判，被隔离审查。 |\n| 1971 | 67 | 被关入秦城监狱。 |\n| 1981 | 77 | 被最高人民法院特别法庭确认为林彪、江青反革命集团主犯，判处有期徒刑18年。 |\n| 1988 | 84 | 刑满释放，保外就医。 |\n| 1989 | 85 | 9月20日在北京病逝。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n陈伯达作为毛泽东的首席政治秘书和理论笔杆，其文章和观点深刻影响了延安整风以来中共的意识形态表述和理论建构。在“文化大革命”期间，他作为中央文革小组组长，是发动和推动运动的核心决策者之一，对当时的政治动荡和社会混乱负有直接责任。他的崛起与陨落，是“文革”时期高层政治生态剧变的典型缩影。\n\n### 对后世的影响\n1.  **理论遗产的复杂性**：其大量理论著述成为研究中共党史、毛泽东思想和“文革”史的重要文本，但其理论服务于特定政治斗争，需批判性审视。\n2.  **历史教训的象征**：其人生轨迹警示了知识分子在政治漩涡中可能面临的异化与悲剧，以及个人崇拜和极左路线的危害。\n3.  **“文革”研究的关键个案**：作为“文革”核心圈层的亲历者和推动者，其回忆与反思（尽管有限）是研究“文革”起源和过程的重要史料。\n\n### 历史评价\n1.  **官方定性**：林彪、江青反革命集团主犯之一，对国家和人民造成了极其严重的危害。（1981年《最高人民法院特别法庭判决书》）\n2.  **学者观点**：一个“复杂的历史人物”，兼具“书生”与“政客”的双重性，其悲剧是时代与个人选择共同作用的结果。\n3.  **秘书角色评价**：曾被视为党内“一支笔”，是毛泽东在理论阐释和文字加工方面最得力的助手，但其后期权力的膨胀脱离了秘书的本分。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：通常在讲述“文化大革命”时作为背景人物提及。\n- **关键事件/贡献**：**中央文革小组组长**；“文革”初期的重要领导人之一。\n- **代表作品/思想**：教材一般不涉及具体作品。\n- **常见易混点/对比点**：与**林彪、江青**反革命集团的关系；作为“文革”中“四人帮”之外的另一关键人物。\n\n### 高中阶段\n- **时代背景**：在深入分析“文化大革命”的起因、过程和影响时，会涉及其角色。\n- **关键事件/贡献**：长期担任**毛泽东政治秘书**；参与**延安整风**和多次党内理论论争；**《红旗》杂志总编辑**；**中央文革小组**的组建与运作。\n- **代表作品/思想**：可能提及《窃国大盗袁世凯》、《人民公敌蒋介石》等早期著作，以及“文革”期间的社论。\n- **常见易混点/对比点**：其角色与**“四人帮”**（王洪文、张春桥、江青、姚文元）的异同；从“理论家”到“反革命集团主犯”的转变；**1970年庐山会议**（中共九届二中全会）是其政治生涯的转折点。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n1.  “文化大革命”的发动：**中央文革小组**成立，组长为**陈伯达**。\n2.  “文革”中的主要反革命集团：**林彪、江青反革命集团**，陈伯达是该集团主犯之一。\n3.  “文革”的结束与教训：1976年10月，“四人帮”被粉碎；1981年，最高人民法院特别法庭对林彪、江青反革命集团主犯进行公开审判，陈伯达被判处有期徒刑。\n\n### 高中阶段\n1.  毛泽东思想的形成与发展：在**延安时期**，陈伯达作为毛泽东的秘书，参与了理论宣传工作。\n2.  “文化大革命”的深层原因：涉及党内关于社会主义建设道路的分歧，以及个人崇拜现象的滋长，陈伯达的理论活动是这一背景的体现。\n3.  “文革”的发动标志：1966年5月中央政治局扩大会议和8月中共八届十一中全会，**中央文革小组**成立并逐步取代中央书记处，陈伯达任组长。\n4.  “文革”中的重大事件：**1970年庐山会议（九届二中全会）**，毛泽东与林彪集团矛盾公开化，陈伯达因此倒台，成为批陈整风运动的对象。\n5.  对“文革”的反思：**历史审判**的意义，1981年对林彪、江青反革命集团的审判，标志着对“文革”在法律和政治上的彻底否定。陈伯达案是其中重要组成部分。\n6.  **存疑/说法不一**：关于陈伯达在许多具体历史事件（如某些理论文章的起草、具体会议的发言）中的确切作用和动机，部分细节在不同回忆录和研究中存在出入。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 福建惠安 | 福建省泉州市惠安县 | 25.0306 | 118.7969 |\n| 厦门 | 福建省厦门市 | 24.4798 | 118.0894 |\n| 上海 | 上海市 | 31.2304 | 121.4737 |\n| 莫斯科 | 俄罗斯联邦莫斯科 | 55.7558 | 37.6173 |\n| 延安 | 陕西省延安市 | 36.5854 | 109.4898 const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;

    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};

  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
