": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 初中阶段\n- **时代背景**：公元前4世纪，**马其顿王国**崛起，**腓力二世**改革强军，控制希腊。\n- **关键事件**：**亚历山大东征**（公元前334年-前323年），灭亡**波斯帝国**。\n- **代表成就**：建立地跨**欧、亚、非**三洲的大帝国；促进**东西方文化交流**（希腊化时代开端）。\n- **核心概念**：**希腊化时代**（Hellenistic Age）指从亚历山大去世到罗马征服东地中海之间的时期。\n- **常见易混点**：区分**古希腊城邦时代**（如雅典、斯巴达）与**马其顿-希腊化时代**；亚历山大帝国与后来的**罗马帝国**是不同时期的帝国。\n\n### 高中阶段\n- **时代背景**：希腊城邦危机与马其顿霸权；波斯帝国衰落。\n- **关键事件**：**格拉尼库斯河战役**、**伊苏斯战役**、**高加米拉战役**等决定性胜利；**建立亚历山大城**（埃及）。\n- **代表思想/政策**：推行**“东西方融合”政策**（如鼓励通婚、采用波斯礼仪）；个人崇拜（自视为神裔）。\n- **历史影响分析**：客观上**加速了古代世界从分散到整体的进程**；**希腊化文化**成为罗马文化的重要源头之一。\n- **深入对比**：亚历山大东征与**汉武帝通西域**在促进东西方交流方面的异同；**希腊化文化**与**古典希腊文化**的区别（如世界主义倾向增强）。\n\n---", "examPoints": "### 初中阶段考点\n1.  **亚历山大帝国**建立的时间、疆域范围（欧、亚、非）。\n2.  **亚历山大东征**的主要路线和关键战役（如伊苏斯、高加米拉）。\n3.  东征的**历史影响**（积极：促进文化交流；消极：战争破坏）。\n4.  **希腊化时代**的概念及其开始的标志（亚历山大去世）。\n5.  亚历山大帝国与**波斯帝国**的继承与取代关系。\n\n### 高中阶段考点\n1.  **马其顿方阵**的特点及其在东征中的作用。\n2.  亚历山大**军事成功的原因**（个人才能、军队改革、对手弱点等）。\n3.  **希腊化时代**的主要特征（文化融合、城市发展、科学进步）。\n4.  亚历山大**“融合政策”** 的内容、目的及其局限性。\n5.  亚历山大帝国**迅速分裂的原因**（缺乏稳固继承制度、地方势力强大等）。\n6.  （存疑/说法不一）亚历山大**焚毁波斯波利斯**的动机（报复？意外？）。", "markdown": "# 亚历山大大帝\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：亚历山大三世（Alexander III），通称亚历山大大帝（Alexander the Great）\n- **时代**：马其顿王国（古典时代晚期，公元前4世纪）\n- **出生**：公元前356年，马其顿王国佩拉（今希腊中马其顿大区佩拉考古遗址）\n- **去世**：公元前323年6月10日或11日，巴比伦（今伊拉克巴比伦省希拉市北）\n- **享年**：32岁\n- **主要身份**：马其顿国王、军事统帅、帝国缔造者\n- **历史地位**：古代世界最杰出的军事家和征服者之一，其东征开启了希腊化时代，促进了东西方文明的首次大规模交融。\n- **主要成就**：统一希腊全境；灭亡波斯阿契美尼德王朝；建立横跨欧、亚、非三洲的庞大帝国；推广希腊文化至东方。\n\n### 生平概述\n亚历山大出生于马其顿王室，师从哲学家亚里士多德，自幼接受严格的军事与文化教育。公元前336年，其父腓力二世遇刺后继位，迅速平定希腊各邦的叛乱。公元前334年，他以“解放小亚细亚希腊城邦”为名，率领希腊联军东征。在短短十年间，他取得了格拉尼库斯河、伊苏斯、高加米拉等一系列决定性战役的胜利，征服了庞大的波斯帝国，并远征至中亚和印度河流域。他的征服不仅改变了古代世界的地缘政治格局，更将希腊的语言、艺术、哲学和制度带到了东方，催生了持续数百年的希腊化文明。公元前323年，他在筹备新的远征时病逝于巴比伦，其帝国随即分裂。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从希腊半岛出发，横扫小亚细亚、埃及、波斯腹地，远征至中亚与印度西北部。\n- ⏱️ **时间跨度**：公元前356年至公元前323年，共计33年（其中东征约10年）。\n- 📍 **地理范围**：覆盖今希腊、土耳其、叙利亚、黎巴嫩、以色列/巴勒斯坦、埃及、伊拉克、伊朗、阿富汗、巴基斯坦等地区。\n- 🌟 **重要节点数量**：9个核心地点\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：佩拉\n- **公元纪年**：公元前356年\n- **停留时间**：童年及青少年早期（约至公元前343年）\n- **位置**：马其顿王国首都佩拉（今希腊中马其顿大区佩拉考古遗址）\n- **事迹**：在此出生并度过童年，接受早期宫廷教育。\n- **意义**：王权的起点，奠定了其作为马其顿王子的身份与早期世界观。\n\n### 📍 重要地点：米埃扎\n- **公元纪年**：约公元前343年-前340年\n- **停留时间**：约3年\n- **位置**：马其顿的米埃扎（今希腊伊马西亚地区）\n- **事迹**：师从亚里士多德，学习哲学、科学、医学和文学。\n- **意义**：接受了系统的希腊精英教育，塑造了其文化视野和对知识的尊重，影响了其统治理念。\n- **名篇名句**：（亚里士多德教导）“吾爱吾师，吾更爱真理”（此为后世概括，非亚历山大原话）。\n\n### 📍 重要地点：科林斯\n- **公元纪年**：公元前336年\n- **停留时间**：短暂\n- **位置**：希腊城邦科林斯（今希腊科林斯）\n- **事迹**：父亲腓力二世遇刺后，迅速在此被希腊同盟会议确认为“希腊联军统帅”，继承东征大业。\n- **意义**：获得了领导全希腊对波斯作战的合法名分，是其政治生涯的关键转折点。\n\n### 📍 重要地点：格拉尼库斯河战场\n- **公元纪年**：公元前334年5月\n- **停留时间**：战役发生地\n- **位置**：小亚细亚西北部的格拉尼库斯河（今土耳其恰纳卡莱省比加河区域）\n- **事迹**：取得东征首场重大战役的胜利，击溃波斯总督联军。\n- **意义**：打开了进入小亚细亚的大门，极大鼓舞了希腊联军士气，确立了其军事天才的声誉。\n- **名篇名句**：（战前对部将说）“波斯人将会发现，马其顿的长矛和希腊的勇气是不可战胜的。”（据阿里安记载）。\n\n### 📍 重要地点：伊苏斯\n- **公元纪年**：公元前333年11月\n- **停留时间**：战役发生地\n- **位置**：小亚细亚东南部的伊苏斯平原（今土耳其哈塔伊省伊斯肯德伦区域）\n- **事迹**：以少胜多，大败波斯皇帝大流士三世亲率的主力大军，大流士仓皇逃走。\n- **意义**：决定性战役之一，俘获大流士家眷，奠定了征服波斯帝国的基础，声威震动地中海世界。\n\n### 📍 重要地点：推罗\n- **公元纪年**：公元前332年1月-7月\n- **停留时间**：围城约7个月\n- **位置**：腓尼基沿海城市推罗（今黎巴嫩苏尔省苏尔市）\n- **事迹**：建造堤道攻占这座被认为不可攻破的海上要塞。\n- **意义**：展示了其坚韧不拔的意志和工程能力，控制了东地中海制海权，切断了波斯海军基地。\n- **名篇名句**：（围城期间致书大流士）“我是全亚洲的主人，来与我谈判，否则战场上见。”（据普鲁塔克记载）。\n\n### 📍 重要地点：高加米拉\n- **公元纪年**：公元前331年10月1日\n- **停留时间**：战役发生地\n- **位置**：美索不达米亚的高加米拉平原（今伊拉克尼尼微省摩苏尔区域）\n- **事迹**：以精妙的战术再次以少胜多，彻底击溃大流士三世的庞大军队。\n- **意义**：终结了波斯阿契美尼德王朝的有效抵抗，亚历山大成为“亚洲之王”，帝国重心东移。\n\n### 📍 重要地点：波斯波利斯\n- **公元纪年**：公元前330年\n- **停留时间**：短暂\n- **位置**：波斯帝国故都波斯波利斯（今伊朗法尔斯省设拉子市东北约60公里）\n- **事迹**：占领并可能焚毁了波斯波利斯王宫（存疑/说法不一，动机可能是报复或意外）。\n- **意义**：象征波斯帝国权力的终结，但焚毁行为在后世评价中存在争议。\n\n### 🔴 去世地：巴比伦\n- **公元纪年**：公元前323年6月\n- **停留时间**：生命最后数月\n- **位置**：新巴比伦王国故都巴比伦（今伊拉克巴比伦省希拉市北部区域）\n- **经过**：在筹备阿拉伯半岛及可能的迦太基远征期间，突发高烧，十日后病逝。死因存疑，可能为伤寒、疟疾或中毒。\n- **意义**：其庞大帝国的首都与终点，他的死亡标志着一个时代的结束和继业者战争的开始。\n- **名篇名句**：（临终遗言，据不同史料记载）“留给最强者”或“帝国交给最好的人”（存疑/说法不一）。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 公元前356年 | 0 | 出生于马其顿佩拉。 |\n| 公元前343年 | 13 | 师从亚里士多德于米埃扎。 |\n| 公元前338年 | 18 | 喀罗尼亚战役中指挥马其顿骑兵左翼，击败底比斯圣队，助父腓力二世确立希腊霸权。 |\n| 公元前336年 | 20 | 父亲遇刺，继位为马其顿国王；在科林斯被推举为希腊联军统帅。 |\n| 公元前334年 | 22 | 率军东征，于格拉尼库斯河首胜波斯军。 |\n| 公元前333年 | 23 | 伊苏斯战役大败大流士三世。 |\n| 公元前332年 | 24 | 攻克推罗城；进入埃及，建立亚历山大城，于锡瓦绿洲被尊为阿蒙神之子。 |\n| 公元前331年 | 25 | 高加米拉战役彻底击败波斯帝国；进入巴比伦和波斯波利斯。 |\n| 公元前330年 | 26 | 占领波斯波利斯，王宫被焚毁（存疑/说法不一）；大流士三世被部下所杀。 |\n| 公元前327年 | 29 | 进军中亚，遭遇顽强抵抗；娶巴克特里亚公主罗克珊娜。 |\n| 公元前326年 | 30 | 希达斯皮斯河战役击败印度波罗斯王；军队拒绝继续东进，决定班师。 |\n| 公元前324年 | 32 | 返回巴比伦；推行“东西方融合”政策，举行大规模集体婚礼。 |\n| 公元前323年 | 32 | 6月，在巴比伦病逝。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n亚历山大的征服彻底摧毁了古老的波斯帝国，终结了希腊城邦时代长期的纷争与恐惧，将希腊世界的政治中心从爱琴海转移到了东方。他建立的庞大帝国虽在其死后迅速分裂，但由其将领（继业者）建立的希腊化王国（如托勒密埃及、塞琉古帝国等）延续了数百年，深刻改变了从地中海到中亚的政治、经济与文化版图。\n\n### 对后世的影响\n- **开创希腊化时代**：将希腊语言、艺术、哲学和科学大规模传播至东方，促进了东西方文明的空前融合，形成了影响深远的希腊化文化。\n- **军事典范**：其战术思想、后勤组织和对骑兵的运用成为后世军事家研究的典范，影响了罗马乃至更后世的战争艺术。\n- **东西方交流的象征**：成为东西方文化交流与冲突的永恒象征，激发了后世无数关于帝国、征服与文明交融的讨论。\n- **城市化推动者**：在征服路线上建立了数十座以“亚历山大”命名的城市（如埃及亚历山大城），成为希腊化世界的经济文化中心。\n\n### 历史评价\n- **古罗马史家阿里安**：“他是所有国王中最卓越的，无论在勇气、艰苦奋斗还是在军事才能方面。”\n- **英国历史学家J.B.伯里**：“亚历山大是历史上最伟大的将军之一，他的征服改变了世界历史的进程。”\n- **现代史学观点**：一方面肯定其促进文明交流的客观作用，另一方面也批判其征服战争的破坏性与个人权力的无限膨胀。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：公元前4世纪，**马其顿王国**崛起，**腓力二世**改革强军，控制希腊。\n- **关键事件**：**亚历山大东征**（公元前334年-前323年），灭亡**波斯帝国**。\n- **代表成就**：建立地跨**欧、亚、非**三洲的大帝国；促进**东西方文化交流**（希腊化时代开端）。\n- **核心概念**：**希腊化时代**（Hellenistic Age）指从亚历山大去世到罗马征服东地中海之间的时期。\n- **常见易混点**：区分**古希腊城邦时代**（如雅典、斯巴达）与**马其顿-希腊化时代**；亚历山大帝国与后来的**罗马帝国**是不同时期的帝国。\n\n### 高中阶段\n- **时代背景**：希腊城邦危机与马其顿霸权；波斯帝国衰落。\n- **关键事件**：**格拉尼库斯河战役**、**伊苏斯战役**、**高加米拉战役**等决定性胜利；**建立亚历山大城**（埃及）。\n- **代表思想/政策**：推行**“东西方融合”政策**（如鼓励通婚、采用波斯礼仪）；个人崇拜（自视为神裔）。\n- **历史影响分析**：客观上**加速了古代世界从分散到整体的进程**；**希腊化文化**成为罗马文化的重要源头之一。\n- **深入对比**：亚历山大东征与**汉武帝通西域**在促进东西方交流方面的异同；**希腊化文化**与**古典希腊文化**的区别（如世界主义倾向增强）。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **亚历山大帝国**建立的时间、疆域范围（欧、亚、非）。\n2.  **亚历山大东征**的主要路线和关键战役（如伊苏斯、高加米拉）。\n3.  东征的**历史影响**（积极：促进文化交流；消极：战争破坏）。\n4.  **希腊化时代**的概念及其开始的标志（亚历山大去世）。\n5.  亚历山大帝国与**波斯帝国**的继承与取代关系。\n\n### 高中阶段考点\n1.  **马其顿方阵**的特点及其在东征中的作用。\n2.  亚历山大**军事成功的原因**（个人才能、军队改革、对手弱点等）。\n3.  **希腊化时代**的主要特征（文化融合、城市发展、科学进步）。\n4.  亚历山大**“融合政策”** 的内容、目的及其局限性。\n5.  亚历山大帝国**迅速分裂的原因**（缺乏稳固继承制度、地方势力强大等）。\n6.  （存疑/说法不一）亚历山大**焚毁波斯波利斯**的动机（报复？意外？）。\n\n## 地点坐标（待人工核实与补充）\n*注：原坐标表数据严重错误，已删除。以下为建议的现代参考地点，坐标需人工核实后补充。*\n| 历史地名 | 现代参考地点 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 佩拉 | 希腊中马其顿大区佩拉考古遗址 | 约40.76°N | 约22.52°E |\n| 米埃扎 | 希腊伊马西亚地区 | 约40.59°N | 约22.15°E |\n| 科林斯 | 希腊科林斯 | 约37.94°N | 约22.93°E |\n| 格拉尼库斯河 | 土耳其恰纳卡莱省比加河区域 | 约40.22°N | 约27.25°E |\n| 伊苏斯 | 土耳其哈塔伊省伊斯肯德伦区域 | 约36.85°N | 约36.17°E |\n| 推罗 | 黎巴嫩苏尔省苏尔市 | 约33.27°N | 约35.20°E |\n| 高加米拉 | 伊拉克尼尼微省摩苏尔区域 | 约36.34°N | 约43.12°E |\n| 波斯波利斯 | 伊朗法尔斯省设拉子市东北约60公里 | 约29.93°N | 约52.89°E |\n| 巴比伦 | 伊拉克巴比伦省希拉市北部区域 | 约32.54°N | 约44.42°E |", "relatedGraph": {"center": {"id": "亚历山大大帝", "name": "亚历山大大帝", "file": "亚历山大大帝.html", "dynasty": "马其顿王国（古典时代晚期，公元前4世纪）", "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "亚历山大大帝", "name": "亚历山大大帝", "file": "亚历山大大帝.html", "dynasty": "马其顿王国（古典时代晚期，公元前4世纪）", "relationLabel": "中心人物", "isCenter": true}, {"id": "亚里士多德", "name": "亚里士多德", "file": "亚里士多德.html", "dynasty": "古希腊（古典时代晚期）", "relationLabel": "师生", "sourceType": "markdown", "confidence": null, "isCenter": false}, {"id": "欧几里得", "name": "欧几里得", "file": "欧几里得.html", "dynasty": "古希腊时期（托勒密王国）", "relationLabel": "同时代人物", "sourceType": "fallback", "confidence": null, "isCenter": false}, {"id": "柏拉图", "name": "柏拉图", "file": "柏拉图.html", "dynasty": "春秋战国", "relationLabel": "同时代人物", "sourceType": "fallback", "confidence": null, "isCenter": false}, {"id": "庄子", "name": "庄子", "file": "庄子.html", "dynasty": "春秋战国", "relationLabel": "同时代人物", "sourceType": "fallback", "confidence": null, "isCenter": false}, {"id": "屈原", "name": "屈原", "file": "屈原.html", "dynasty": "春秋战国", "relationLabel": "同时代人物", "sourceType": "fallback", "confidence": null, "isCenter": false}, {"id": "孟子", "name": "孟子", "file": "孟子.html", "dynasty": "春秋战国", "relationLabel": "同 const dedupeTeachingMarkdown = (raw) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}+n`, 'g');
  const lines = String(raw || '').split(splitRe);
  const chunks = [];
  let current = [];
  const flush = () => {
    if (!current.length) return;
    chunks.push(current);
    current = [];
  };
  for (const rawLine of lines) {
    const t = String(rawLine || '').trim();
    if (/^###\s+/.test(t)) {
      flush();
      current = [rawLine];
      continue;
    }
    if (!current.length && !t) continue;
    current.push(rawLine);
  }
  flush();

  const seen = new Set();
  const deduped = [];
  for (const chunk of chunks) {
    const meaningful = chunk.map((x) => String(x || '').trim()).filter(Boolean);
    if (!meaningful.length) continue;
    if (/^###\s*考点\s*$/.test(meaningful[0])) continue;
    const key = meaningful
      .map((x) => x.replace(/\*\*/g, '').replace(/\s+/g, ' ').trim())
      .join('\n');
    if (seen.has(key)) continue;
    seen.add(key);
    deduped.push(chunk.join('\n'));
  }
  return deduped.join('\n\n').trim();
};

const extractTeachingHighlights = (raw, maxItems) => {

  const out = [];

    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  const prunedKept = kept.filter((line, idx) => {
    const t = String(line || '').trim();
    const isHeading = t.startsWith('### ') || t.startsWith('#### ');
    if (!isHeading) return true;
    for (let j = idx + 1; j < kept.length; j += 1) {
      const next = String(kept[j] || '').trim();
      if (!next || /^-{3,}$/.test(next)) continue;
      if (next.startsWith('### ') || next.startsWith('#### ')) return false;
      return true;
    }
    return false;
  });

  return prunedKept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
