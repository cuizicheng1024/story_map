: [], "quoteLines": []}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：哥伦布本人无文学作品传世，但其**航海日志**和写给西班牙王室的**信件**是重要的历史文献，常被节选作为了解其航行见闻和动机的材料。\n- 核心要点：\n    - **重点**：文献中体现了强烈的**宗教传播**动机，常将航行描述为“为上帝和国王陛下效力”。\n    - **重点**：对美洲“新世界”的**描述**充满了欧洲中心的想象，如将土著称为“印第安人”（Indians），误认为其土地是印度附近。\n    - 其文字记录了早期欧洲人对美洲**自然环境**（如植被、动物）和**原住民**的初步观察。\n    - **重点**：文献也暴露了其**殖民意图**，如对黄金的渴望和对占领土地的宣告。\n    - 风格上兼具**纪实性**与**宣传性**，旨在向资助者汇报成果并争取更多支持。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1492年**，在西班牙王室资助下，哥伦布船队抵达美洲，这一事件被传统史观视为“**地理大发现**”的标志性事件。\n    - 他至死坚信自己到达的是**亚洲**，其航行促进了“**地圆说**”的实践验证。\n    - **重点**：他的航行引发了“**哥伦布大交换**”，导致了旧大陆与新大陆之间**物种**（如马铃薯、玉米传入欧亚，马、牛传入美洲）、**疾病**（如天花传入美洲）和**文化**的全球性交流。\n    - 他担任过新发现土地的**总督**，但其殖民管理引发争议，最终被撤职。\n- 核心要点：\n    - **重点**：哥伦布是**欧洲大航海时代**的代表人物，其成功得益于当时的**航海技术**进步、**地圆说**知识传播以及欧洲对**东方财富**的渴望。\n    - **重点**：从**全球史**视角看，哥伦布航行是**世界历史**从分散走向整体的关键转折点之一。\n    - 对其评价存在**巨大争议**：传统观点颂扬其勇气与开拓精神；现代观点则批判其航行开启了**欧洲殖民主义**，给美洲原住民带来了**灾难性后果**（疾病、奴役、文化毁灭）。\n    - **重点**：他的活动体现了**国家支持**（西班牙王室）与**个人野心**（寻求财富、荣誉和封地）在早期殖民扩张中的紧密结合。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：哥伦布本人无文学作品传世，但其**航海日志**和写给西班牙王室的**信件**是重要的历史文献，常被节选作为了解其航行见闻和动机的材料。\n- 核心要点：\n    - **重点**：文献中体现了强烈的**宗教传播**动机，常将航行描述为“为上帝和国王陛下效力”。\n    - **重点**：对美洲“新世界”的**描述**充满了欧洲中心的想象，如将土著称为“印第安人”（Indians），误认为其土地是印度附近。\n    - 其文字记录了早期欧洲人对美洲**自然环境**（如植被、动物）和**原住民**的初步观察。\n    - **重点**：文献也暴露了其**殖民意图**，如对黄金的渴望和对占领土地的宣告。\n    - 风格上兼具**纪实性**与**宣传性**，旨在向资助者汇报成果并争取更多支持。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1492年**，在西班牙王室资助下，哥伦布船队抵达美洲，这一事件被传统史观视为“**地理大发现**”的标志性事件。\n    - 他至死坚信自己到达的是**亚洲**，其航行促进了“**地圆说**”的实践验证。\n    - **重点**：他的航行引发了“**哥伦布大交换**”，导致了旧大陆与新大陆之间**物种**（如马铃薯、玉米传入欧亚，马、牛传入美洲）、**疾病**（如天花传入美洲）和**文化**的全球性交流。\n    - 他担任过新发现土地的**总督**，但其殖民管理引发争议，最终被撤职。\n- 核心要点：\n    - **重点**：哥伦布是**欧洲大航海时代**的代表人物，其成功得益于当时的**航海技术**进步、**地圆说**知识传播以及欧洲对**东方财富**的渴望。\n    - **重点**：从**全球史**视角看，哥伦布航行是**世界历史**从分散走向整体的关键转折点之一。\n    - 对其评价存在**巨大争议**：传统观点颂扬其勇气与开拓精神；现代观点则批判其航行开启了**欧洲殖民主义**，给美洲原住民带来了**灾难性后果**（疾病、奴役、文化毁灭）。\n    - **重点**：他的活动体现了**国家支持**（西班牙王室）与**个人野心**（寻求财富、荣誉和封地）在早期殖民扩张中的紧密结合。\n\n---", "markdown": "# 哥伦布\n\n## 人物档案\n\n### 基本信息\n- **姓名**：克里斯托弗·哥伦布\n- **时代**：15世纪末至16世纪初（欧洲大航海时代）\n- **出生**：公元1451年，古称热那亚共和国（今意大利利古里亚大区热那亚）（具体日期存疑）\n- **去世**：公元1506年5月20日，古称卡斯蒂利亚王国巴利亚多利德（今西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德）\n- **享年**：存疑（约54-55岁，因具体出生日期不详）\n- **主要身份**：航海家、探险家、殖民者\n- **历史地位**：欧洲大航海时代的先驱，其航行开启了欧洲对美洲大陆的持续探索与殖民进程。\n- **主要成就**：1. 完成首次横渡大西洋的航行（1492年）；2. “发现”美洲新大陆（对欧洲而言）；3. 开辟了从欧洲到美洲的新航路；4. 促成欧洲与美洲之间持续的物种、文化与人口交流（哥伦布大交换）。\n\n### 生平概述\n哥伦布生于热那亚，后移居葡萄牙。他坚信地圆说，并计划向西航行到达亚洲。在葡萄牙王室拒绝其计划后，他转而寻求西班牙（卡斯蒂利亚）伊莎贝拉一世女王的支持。1492年，他率领船队从西班牙出发，横渡大西洋，抵达了他认为的“印度”，实则为美洲的巴哈马群岛。此后，他又进行了三次西航，到达了加勒比海诸岛及中美洲沿岸。他的航行虽未实现到达亚洲的初衷，却意外地为欧洲打开了通往美洲的大门，深刻改变了世界历史的进程。晚年，他在争议与失意中于西班牙去世。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从地中海到大西洋，横跨欧洲与美洲大陆。\n- ⏱️ **时间跨度**：约1470年代至1506年，总跨度约30余年。\n- 📍 **地理范围**：覆盖今意大利、葡萄牙、西班牙、加那利群岛、巴哈马群岛、古巴、海地、牙买加、中美洲沿岸等地。\n- 🌟 **重要节点数量**：10个核心地点（含出生地、去世地及安葬地）。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：热那亚\n- **时间**：约公元1451年\n- **停留时间**：青少年时期（约20年）\n- **地点**：古称热那亚共和国（今意大利利古里亚大区热那亚）\n- **事件**：出生并成长于一个纺织工家庭，早年可能参与过海上贸易。\n- **意义**：其热那亚出身影响了他早期的航海视野与商业思维。\n\n### 📍 重要地点：里斯本\n- **时间**：约1476年-1485年\n- **停留时间**：约9年\n- **地点**：古称葡萄牙王国里斯本（今葡萄牙里斯本大区里斯本）\n- **事件**：移居当时欧洲的航海中心，学习航海知识、地图绘制，并参与了前往非洲等地的航行。在此期间形成了西航亚洲的构想。约1485年离开葡萄牙，前往西班牙寻求支持。\n- **意义**：航海知识与技能的关键积累地，其西航计划在此萌芽并初步成型。\n\n### 📍 重要地点：帕洛斯-德拉弗龙特拉\n- **时间**：1492年8月3日出发\n- **停留时间**：出发港，短暂停留\n- **地点**：古称卡斯蒂利亚王国帕洛斯港（今西班牙安达卢西亚自治区韦尔瓦省帕洛斯-德拉弗龙特拉）\n- **事件**：率领“圣玛丽亚号”、“平塔号”和“尼尼亚号”三艘帆船从这里启航，开始第一次西航。\n- **意义**：人类历史上首次有计划的横渡大西洋航行的起点。\n\n### 📍 重要地点：加那利群岛（戈梅拉岛）\n- **时间**：1492年9月\n- **停留时间**：约1个月\n- **地点**：古称加那利群岛（今西班牙加那利群岛戈梅拉岛）\n- **事件**：船队在此进行最后的休整和补给，修理船只。\n- **意义**：进入大西洋未知海域前的最后文明前哨站。\n\n### 📍 重要地点：圣萨尔瓦多岛（华特林岛）\n- **时间**：1492年10月12日\n- **停留时间**：数日\n- **地点**：古称瓜纳哈尼岛（今巴哈马国圣萨尔瓦多岛/华特林岛）\n- **事件**：船队首次登陆美洲土地，与当地泰诺人接触。哥伦布宣布为西班牙国王占领此地，并误以为到达了亚洲的印度附近岛屿。\n- **意义**：欧洲人“发现”美洲的标志性地点，开启了哥伦布大交换。\n\n### 📍 重要地点：古巴岛（东北海岸）\n- **时间**：1492年10月末-11月\n- **停留时间**：约一个月\n- **地点**：古称胡安娜岛（今古巴岛东北部）\n- **事件**：沿古巴海岸探索，坚信这是亚洲大陆（可能是中国或日本的一部分）。派遣使团寻找内陆的“可汗”宫殿。\n- **意义**：首次踏上他认为的“亚洲大陆”，进一步强化了其地理误判。\n\n### 📍 重要地点：伊斯帕尼奥拉岛（海地岛）\n- **时间**：1492年12月-1493年1月（首次航行）；后续航行多次返回\n- **停留时间**：首次停留数周，后建立殖民据点\n- **地点**：古称伊斯帕尼奥拉岛（今海地与多米尼加共和国所在岛屿，首次登陆点约在今海地角附近）\n- **事件**：在圣诞日，“圣玛丽亚号”在此搁浅。哥伦布利用船材建立了欧洲在美洲的第一个定居点“拉纳维达德”。后因与土著冲突，据点被毁。\n- **意义**：西班牙在美洲的第一个永久定居尝试的起点，也是后续殖民扩张的基地。\n\n### 📍 重要地点：委内瑞拉沿岸（南美大陆）\n- **时间**：1498年8月（第三次航行）\n- **停留时间**：短暂登陆\n- **地点**：古称帕里亚半岛（今委内瑞拉苏克雷州帕里亚半岛，具体登陆点存疑）\n- **事件**：首次踏上南美大陆，观察到奥里诺科河淡水入海，推测存在巨大陆地。\n- **意义**：首次接触南美大陆，地理认知有所扩展。\n\n### 📍 重要地点：牙买加岛\n- **时间**：1503年6月-1504年6月（第四次航行期间）\n- **停留时间**：约一年\n- **地点**：古称牙买加岛（今牙买加）\n- **事件**：因船只严重损毁，哥伦布与船员被困于此长达一年，依靠与土著交易和月食预言维持生存，最终获救。\n- **意义**：哥伦布航海生涯中最艰难困顿的时期之一，显示了其探险活动的巨大风险。\n\n### 🔴 去世地：巴利亚多利德\n- **时间**：公元1506年5月20日\n- **停留时间**：晚年大部分时间\n- **地点**：古称卡斯蒂利亚王国巴利亚多利德（今西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德）\n- **事件**：在健康状况不佳和未获国王兑现承诺的沮丧中去世。\n- **意义**：一代航海探险家的终点，其遗产（地理发现权与利益）在此后数十年间由其继承人与西班牙王室反复诉讼争夺。\n\n### 📍 安葬地：塞维利亚\n- **时间**：最初安葬于巴利亚多利德，后迁葬\n- **性质**：永久安葬地\n- **地点**：古称卡斯蒂利亚王国塞维利亚（今西班牙安达卢西亚自治区塞维利亚）\n- **事件**：哥伦布的遗骨最初安葬于巴利亚多利德，后迁至塞维利亚大教堂。\n- **意义**：哥伦布的最终安息地，也是重要的纪念场所。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 约1451年 | 0岁 | 出生于热那亚 |\n| 约1476年 | 约25岁 | 移居葡萄牙里斯本 |\n| 1485年 | 约34岁 | 离开葡萄牙，前往西班牙寻求支持 |\n| 1492年 | 约41岁 | 获西班牙女王支持；4月签订《圣塔菲协定》；8月3日首次西航出发；10月12日抵达美洲 |\n| 1493年 | 约42岁 | 3月返回西班牙，受到隆重欢迎；9月率领庞大船队开始第二次航行 |\n| 1498年 | 约47岁 | 进行第三次航行，首次踏上南美大陆（今委内瑞拉沿岸） |\n| 1502年 | 约51岁 | 开始第四次航行，探索中美洲沿岸 |\n| 1504年 | 约53岁 | 第四次航行结束，返回西班牙 |\n| 1506年 | 约54-55岁 | 5月20日在巴利亚多利德去世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：哥伦布本人无文学作品传世，但其**航海日志**和写给西班牙王室的**信件**是重要的历史文献，常被节选作为了解其航行见闻和动机的材料。\n- 核心要点：\n    - **重点**：文献中体现了强烈的**宗教传播**动机，常将航行描述为“为上帝和国王陛下效力”。\n    - **重点**：对美洲“新世界”的**描述**充满了欧洲中心的想象，如将土著称为“印第安人”（Indians），误认为其土地是印度附近。\n    - 其文字记录了早期欧洲人对美洲**自然环境**（如植被、动物）和**原住民**的初步观察。\n    - **重点**：文献也暴露了其**殖民意图**，如对黄金的渴望和对占领土地的宣告。\n    - 风格上兼具**纪实性**与**宣传性**，旨在向资助者汇报成果并争取更多支持。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1492年**，在西班牙王室资助下，哥伦布船队抵达美洲，这一事件被传统史观视为“**地理大发现**”的标志性事件。\n    - 他至死坚信自己到达的是**亚洲**，其航行促进了“**地圆说**”的实践验证。\n    - **重点**：他的航行引发了“**哥伦布大交换**”，导致了旧大陆与新大陆之间**物种**（如马铃薯、玉米传入欧亚，马、牛传入美洲）、**疾病**（如天花传入美洲）和**文化**的全球性交流。\n    - 他担任过新发现土地的**总督**，但其殖民管理引发争议，最终被撤职。\n- 核心要点：\n    - **重点**：哥伦布是**欧洲大航海时代**的代表人物，其成功得益于当时的**航海技术**进步、**地圆说**知识传播以及欧洲对**东方财富**的渴望。\n    - **重点**：从**全球史**视角看，哥伦布航行是**世界历史**从分散走向整体的关键转折点之一。\n    - 对其评价存在**巨大争议**：传统观点颂扬其勇气与开拓精神；现代观点则批判其航行开启了**欧洲殖民主义**，给美洲原住民带来了**灾难性后果**（疾病、奴役、文化毁灭）。\n    - **重点**：他的活动体现了**国家支持**（西班牙王室）与**个人野心**（寻求财富、荣誉和封地）在早期殖民扩张中的紧密结合。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 热那亚，意大利 | 44.4056 | 8.9463 |\n| 里斯本，葡萄牙 | 38.7223 | -9.1393 |\n| 帕洛斯-德拉弗龙特拉，西班牙 | 37.2333 | -6.9333 |\n| 戈梅拉岛，加那利群岛，西班牙 | 28.1000 | -17.2000 |\n| 圣萨尔瓦多岛，巴哈马 | 24.0500 | -74.5333 |\n| 古巴岛东北部（近似坐标），古巴 | 21.5000 | -77.0000 |\n| 海地角，海地 | 19.7578 | -72.2042 |\n| 牙买加岛，牙买加 | 18.4333 | -77.2000 |\n| 巴利亚多利德，西班牙 | 41.6523 | -4.7245 |\n| 塞维利亚，西班牙（哥伦布安葬地） | 37.3891 | -5.9845 |"};

const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;

    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;

  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const current = options.find((o) => o.id === value) || options[0] || { id: '', label: '' };
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(!open)}
        className="glass-panel rounded-lg px-3 py-1.5 text-xs flex items-center gap-2 shadow-lg hover:bg-white/95 transition-colors"
      >
        <span className="text-gray-500">{label}</span>
        <span className="text-[#7c2d12] font-bold">{current.label}</span>
        <span className="text-gray-400 text-[10px]">▾</span>
      </button>
      {open ? (
        <div className="absolute top-full right-0 mt-1 glass-panel rounded-lg shadow-xl py-1 min-w-[120px] z-20">
          {options.map((opt) => (
            <button
              key={opt.id}
              onClick={() => { onChange(opt.id); setOpen(false); }}
              className={`w-full text-left px-3 py-1.5 text-xs hover:bg-amber-50 transition-colors ${
                opt.id === value ? 'text-[#c0392b] font-bold bg-amber-50/60' : 'text-gray-700'
              }`}
            >
              {opt.label}
            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
};

        seen.add(t);
        out.push(t);
        if (out.length >= 6) break;

      return { doubtful: doubtful || out.length > 0, candidates: out };
    }
    if (!raw || !doubtful) return { doubtful: false, candidates: [] };
    const out = [];
    const seen = new Set();
    const re = /(?:一说|或说|又说|另说)\s*(?:生于|生在|在)?\s*([^，。；;）)\n]+)\s*/g;

                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">

                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};

root.render(<App />);
