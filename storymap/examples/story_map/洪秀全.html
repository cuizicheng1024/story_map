, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：太平天国相关文献常作为历史背景材料出现，如《**原道救世歌**》《**原道醒世训**》《**原道觉世训**》等宣传文本的片段。\n- 核心要点：\n    - **重点**：洪秀全的作品是**拜上帝教**教义的核心载体，融合了基督教义与中国传统大同思想。\n    - 其诗文语言通俗，旨在**动员群众**，具有强烈的**战斗性**和**宣传鼓动性**。\n    - 《**天朝田亩制度**》虽非文学作品，但作为纲领性文件，其“有田同耕，有饭同食”的**绝对平均主义**思想是理解太平天国社会理想的关键。\n    - 作品中体现了对**清朝统治**的彻底否定和建立“**天下一家，共享太平**”理想社会的追求。\n    - **重点**：其思想体系反映了近代中国农民阶级在寻求出路时，对**外来文化**的初步吸收与改造。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：领导**金田起义**（1851年），标志着中国旧式农民战争的最高峰——**太平天国运动**的开始。\n    - 定都**天京**（1853年），建立与清王朝对峙的农民政权。\n    - 颁布《**天朝田亩制度**》，提出废除封建土地所有制的纲领（虽未真正实施）。\n    - 经历**天京事变**（1856年），领导集团内讧，成为太平天国由盛转衰的转折点。\n    - **重点**：太平天国运动是在**鸦片战争**后中国社会主要矛盾激化（阶级矛盾与民族矛盾）背景下爆发的，具有**反封建反侵略**的双重性质。\n- 核心要点：\n    - **重点**：洪秀全创立的**拜上帝教**是组织和发动起义的思想工具，其教义具有**政教合一**的特点。\n    - 太平天国运动沉重打击了清王朝的**封建统治**和**儒家纲常伦理**。\n    - **重点**：运动后期，洪秀全日益**沉溺宗教**，**疏于政事**，导致中央权力分散，加速了政权的衰败。\n    - 其失败的根本原因在于农民阶级的**历史局限性**，缺乏科学的理论指导和先进的阶级领导。\n    - **重点**：太平天国运动与同时期的**捻军**等起义相互呼应，共同构成了19世纪中叶中国民众反抗的浪潮，促使清廷权力下移（如**湘军**、**淮军**地方势力崛起）。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：太平天国相关文献常作为历史背景材料出现，如《**原道救世歌**》《**原道醒世训**》《**原道觉世训**》等宣传文本的片段。\n- 核心要点：\n    - **重点**：洪秀全的作品是**拜上帝教**教义的核心载体，融合了基督教义与中国传统大同思想。\n    - 其诗文语言通俗，旨在**动员群众**，具有强烈的**战斗性**和**宣传鼓动性**。\n    - 《**天朝田亩制度**》虽非文学作品，但作为纲领性文件，其“有田同耕，有饭同食”的**绝对平均主义**思想是理解太平天国社会理想的关键。\n    - 作品中体现了对**清朝统治**的彻底否定和建立“**天下一家，共享太平**”理想社会的追求。\n    - **重点**：其思想体系反映了近代中国农民阶级在寻求出路时，对**外来文化**的初步吸收与改造。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：领导**金田起义**（1851年），标志着中国旧式农民战争的最高峰——**太平天国运动**的开始。\n    - 定都**天京**（1853年），建立与清王朝对峙的农民政权。\n    - 颁布《**天朝田亩制度**》，提出废除封建土地所有制的纲领（虽未真正实施）。\n    - 经历**天京事变**（1856年），领导集团内讧，成为太平天国由盛转衰的转折点。\n    - **重点**：太平天国运动是在**鸦片战争**后中国社会主要矛盾激化（阶级矛盾与民族矛盾）背景下爆发的，具有**反封建反侵略**的双重性质。\n- 核心要点：\n    - **重点**：洪秀全创立的**拜上帝教**是组织和发动起义的思想工具，其教义具有**政教合一**的特点。\n    - 太平天国运动沉重打击了清王朝的**封建统治**和**儒家纲常伦理**。\n    - **重点**：运动后期，洪秀全日益**沉溺宗教**，**疏于政事**，导致中央权力分散，加速了政权的衰败。\n    - 其失败的根本原因在于农民阶级的**历史局限性**，缺乏科学的理论指导和先进的阶级领导。\n    - **重点**：太平天国运动与同时期的**捻军**等起义相互呼应，共同构成了19世纪中叶中国民众反抗的浪潮，促使清廷权力下移（如**湘军**、**淮军**地方势力崛起）。\n\n---", "markdown": "# 洪秀全\n\n## 人物档案\n\n### 基本信息\n- **姓名**：洪秀全\n- **时代**：清朝（晚清）\n- **出生**：公元1814年（出生日期有不同说法，具体月日存疑），广东花县（今广东省广州市花都区）\n- **去世**：公元1864年6月（具体日期存疑），天京（今江苏省南京市）\n- **享年**：约50岁（周岁，因出生月日存疑，具体年龄有不同说法）\n- **主要身份**：太平天国运动领袖、拜上帝教创始人、天王\n- **历史地位**：领导了中国历史上规模最大的农民起义——太平天国运动，动摇了清朝统治根基。\n- **主要成就**：创立拜上帝教，构建反清理论体系；发动金田起义，建立太平天国政权；定都天京，颁布《天朝田亩制度》等纲领；沉重打击了清王朝与外国侵略势力。\n\n### 生平概述\n洪秀全生于广东花县，早年科举屡试不第，后受基督教布道册子《劝世良言》启发，创立拜上帝教，自称上帝次子、耶稣之弟。他与冯云山等在广西传教，聚集了杨秀清、萧朝贵等核心力量。1851年于广西金田村发动起义，建号太平天国，旋即称天王。太平军一路北上，攻占南京并定都于此，改名天京。此后，太平天国经历北伐、西征与天京事变等重大事件，由盛转衰。1864年，天京被清军围困，洪秀全病逝，不久天京陷落，太平天国运动失败。其运动发生于鸦片战争后中国社会矛盾激化的背景下，是一场兼具反封建与反侵略性质的农民战争。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从广东花县出发，经广西桂平、永安等地，一路征战至江苏南京（天京），活动范围主要覆盖华南、华中及华东地区。\n- ⏱️ **时间跨度**：约1843年至1864年，共21年。\n- 📍 **地理范围**：大致覆盖今广东、广西、湖南、湖北、江西、安徽、江苏等省（太平军活动或影响范围更广，但洪秀全本人主要活动区域如上）。\n- 🌟 **重要节点数量**：核心地点10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：广东花县\n- **时间**：1814年\n- **停留时间**：约29年（至1843年前后开始外出传教）\n- **地点**：广东花县（今广东省广州市花都区）\n- **事件**：出生、成长、多次参加科举考试失败。\n- **意义**：其早年生活与科举失意的经历，为日后创立拜上帝教、走上反清道路埋下伏笔。\n\n### 📍 重要地点：广东广州\n- **时间**：1836年、1843年\n- **停留时间**：短期停留\n- **地点**：广东广州（今广东省广州市）\n- **事件**：1836年在广州应试时得到《劝世良言》；1843年最后一次科考失败后，重读此书，决心信奉上帝，创立拜上帝教。\n- **意义**：获得思想启蒙的关键地点，是其从传统士子向宗教领袖转变的起点。\n\n### 📍 重要地点：广西桂平紫荆山区\n- **时间**：约1844年至1847年\n- **停留时间**：约3年（断断续续）\n- **地点**：广西桂平紫荆山区（今广西壮族自治区贵港市桂平市）\n- **事件**：与冯云山深入山区传教，发展了杨秀清、萧朝贵、韦昌辉、石达开等核心骨干，建立了稳固的拜上帝教基地。\n- **意义**：太平天国运动的组织摇篮和力量积蓄地。\n\n### 📍 重要地点：广西金田村\n- **时间**：1851年1月11日\n- **停留时间**：起义前后短期驻扎\n- **地点**：广西桂平金田村（今广西壮族自治区贵港市桂平市金田镇）\n- **事件**：领导拜上帝教众正式发动武装起义，建号“太平天国”，起义军称太平军，洪秀全称天王。\n- **意义**：太平天国运动正式爆发的标志性地点。\n\n### 📍 重要地点：广西永安州\n- **时间**：1851年9月至1852年4月\n- **停留时间**：约7个月\n- **地点**：广西永安州（今广西壮族自治区梧州市蒙山县）\n- **事件**：太平军攻占的第一座州城。在此进行政权建设，分封东、西、南、北、翼五王（杨秀清、萧朝贵、冯云山、韦昌辉、石达开），建立官制，颁行天历，整顿军纪。\n- **意义**：太平天国初具立国规模，是其从流动作战转向建立政权的转折点。\n\n### 📍 重要地点：湖南长沙\n- **时间**：1852年\n- **停留时间**：围攻约80天，未克\n- **地点**：湖南长沙（今湖南省长沙市）\n- **事件**：太平军北上途中围攻长沙，西王萧朝贵在此战中阵亡。\n- **意义**：太平天国早期重大挫折，损失重要领袖，但也检验了军队战斗力。\n\n### 📍 重要地点：湖北武昌\n- **时间**：1852年底至1853年初\n- **停留时间**：约一个月\n- **地点**：湖北武昌（今湖北省武汉市武昌区）\n- **事件**：太平军首次攻克省城大城，获得大量物资和人员补充，声威大震。\n- **意义**：太平军实力壮大的重要节点，为顺江东下、攻取南京奠定了基础。\n\n### 📍 重要地点：江苏南京（天京）\n- **时间**：1853年3月至1864年6月\n- **停留时间**：约11年\n- **地点**：江苏江宁，太平天国改称天京（今江苏省南京市）\n- **事件**：定都于此，建立与清廷对峙的农民政权；颁布《天朝田亩制度》；经历天京事变（1856年）内讧；后期困守孤城，直至病逝。\n- **意义**：太平天国的首都和统治中心，是其政权兴衰的见证地。\n\n### 📍 重要地点：安徽安庆\n- **时间**：1853年至1861年（多次争夺）\n- **停留时间**：太平军控制断续多年\n- **地点**：安徽安庆（今安徽省安庆市）\n- **事件**：天京上游重要屏障，太平军与湘军在此展开长期激烈争夺。1861年失守，天京门户洞开。\n- **意义**：太平天国西线战场的战略枢纽，其得失直接关系天京安危。\n\n### 🔴 去世地：天京（南京）\n- **时间**：1864年6月\n- **停留时间**：同上（定都后一直在此）\n- **地点**：天京（今江苏省南京市）\n- **事件**：在清军（湘军）合围天京的严峻形势下病逝（一说服毒自尽）。\n- **意义**：标志着太平天国运动核心领导的终结，一个多月后天京陷落，运动失败。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1814年 | 0岁 | 出生于广东花县。 |\n| 1836年 | 22岁 | 在广州应试，得《劝世良言》。 |\n| 1843年 | 29岁 | 最后一次科举失败，创立拜上帝教。 |\n| 1844年 | 30岁 | 与冯云山赴广西传教。 |\n| 1851年1月 | 37岁 | 在广西金田发动起义，建号太平天国，称天王。 |\n| 1851年9月 | 37岁 | 攻占永安州，分封诸王，初建政权。 |\n| 1853年3月 | 39岁 | 攻克南京，定都为天京。 |\n| 1853年冬 | 39岁 | 颁布《天朝田亩制度》（一说1854年初）。 |\n| 1856年秋 | 42岁 | 天京事变爆发，太平天国元气大伤。 |\n| 1864年6月 | 50岁 | 在天京病逝。 |\n\n---\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：太平天国相关文献常作为历史背景材料出现，如《**原道救世歌**》《**原道醒世训**》《**原道觉世训**》等宣传文本的片段。\n- 核心要点：\n    - **重点**：洪秀全的作品是**拜上帝教**教义的核心载体，融合了基督教义与中国传统大同思想。\n    - 其诗文语言通俗，旨在**动员群众**，具有强烈的**战斗性**和**宣传鼓动性**。\n    - 《**天朝田亩制度**》虽非文学作品，但作为纲领性文件，其“有田同耕，有饭同食”的**绝对平均主义**思想是理解太平天国社会理想的关键。\n    - 作品中体现了对**清朝统治**的彻底否定和建立“**天下一家，共享太平**”理想社会的追求。\n    - **重点**：其思想体系反映了近代中国农民阶级在寻求出路时，对**外来文化**的初步吸收与改造。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：领导**金田起义**（1851年），标志着中国旧式农民战争的最高峰——**太平天国运动**的开始。\n    - 定都**天京**（1853年），建立与清王朝对峙的农民政权。\n    - 颁布《**天朝田亩制度**》，提出废除封建土地所有制的纲领（虽未真正实施）。\n    - 经历**天京事变**（1856年），领导集团内讧，成为太平天国由盛转衰的转折点。\n    - **重点**：太平天国运动是在**鸦片战争**后中国社会主要矛盾激化（阶级矛盾与民族矛盾）背景下爆发的，具有**反封建反侵略**的双重性质。\n- 核心要点：\n    - **重点**：洪秀全创立的**拜上帝教**是组织和发动起义的思想工具，其教义具有**政教合一**的特点。\n    - 太平天国运动沉重打击了     if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
