段论**推理，成为西方逻辑学的基础。\n- **科学方法**：强调**目的因**（四因说），其自然观在中世纪长期占据统治地位。\n- **美学思想**：在《**诗学**》中提出**悲剧理论**（净化说），对西方文艺理论影响深远。\n- **历史影响**：其著作经**阿拉伯学者**保存、翻译，于中世纪后期传回欧洲，推动了**经院哲学**的发展和**文艺复兴**。\n- **思想局限**：其物理学（如地心说、自然运动理论）被**近代科学革命**（伽利略、牛顿）所推翻。\n- **对比学习**：常与**柏拉图**对比（经验主义 vs. 理性主义）；与**孔子**对比（西方理性传统 vs. 东方伦理传统）。\n\n---", "examPoints": "### 初中阶段考点\n- **人物定位**：古希腊哲学家、科学家，柏拉图的学生，亚历山大大帝的老师。\n- **核心主张**：认为**求知是人的本性**；强调**观察和经验**的重要性。\n- **主要成就**：创立**逻辑学**；在**生物学**领域进行分类研究；建立**吕克昂学园**。\n- **历史地位**：**古希腊哲学的集大成者**，对西方科学和哲学发展影响深远。\n- **名言识记**：“**吾爱吾师，吾更爱真理。**”\n\n### 高中阶段考点\n- **哲学思想**：**四因说**（质料因、形式因、动力因、目的因）；**实体学说**；**伦理学**中的“**中道**”思想与**幸福观**。\n- **逻辑学贡献**：**三段论**的基本形式（大前提、小前提、结论）；对**范畴**的划分。\n- **政治学观点**：对**政体**的分类（君主制、贵族制、共和制及其变态形式）；“**人是天生的政治动物**”。\n- **美学理论**：《**诗学**》中关于**悲剧**的定义、要素（情节、性格等）及“**卡塔西斯**”（净化）作用。\n- **历史影响**：其思想如何被**中世纪经院哲学**（托马斯·阿奎那）吸收利用；如何成为**近代科学革命**的批判对象。\n- **重要对比**：与**柏拉图**哲学体系的异同；其逻辑学与**现代逻辑**的关系。\n- **著作识记**：《**形而上学**》、《**尼各马可伦理学**》、《**政治学**》、《**诗学**》、《**工具论**》（逻辑学著作集）。", "markdown": "# 亚里士多德\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：亚里士多德\n- **外文名**：Aristotle（希腊语：Ἀριστοτέλης）\n- **时代**：古希腊（古典时代晚期）\n- **出生**：公元前384年，马其顿王国斯塔基拉城（今希腊哈尔基季基州）\n- **去世**：公元前322年，优卑亚岛卡尔基斯城（今希腊哈尔基斯）\n- **享年**：62岁\n- **主要身份**：哲学家、科学家、教育家、百科全书式学者\n- **历史地位**：古希腊哲学的集大成者，西方思想史上影响最深远的人物之一，被誉为“百科全书式的学者”。\n- **主要成就**：创立逍遥学派；形式逻辑学（三段论）的奠基人；在哲学、伦理学、政治学、物理学、生物学、诗学等众多领域做出开创性贡献。\n\n### 生平概述\n亚里士多德生于马其顿的医生家庭，青年时期赴雅典，入柏拉图学园学习近二十年。柏拉图去世后，他游历小亚细亚等地，后受马其顿国王腓力二世邀请，成为王子亚历山大（即后来的亚历山大大帝）的教师。亚历山大东征后，亚里士多德重返雅典，创建吕克昂学园，进行教学与研究，其学派因此得名“逍遥学派”。亚历山大大帝去世后，雅典反马其顿情绪高涨，亚里士多德被迫离开雅典，次年病逝于卡尔基斯。他一生著述宏富，构建了涵盖自然与人文的庞大知识体系，对西方文明产生了无与伦比的持久影响。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从马其顿到雅典，再辗转小亚细亚、爱琴海诸岛，最终归于优卑亚岛。\n- ⏱️ **时间跨度**：公元前384年至公元前322年，共62年。\n- 📍 **地理范围**：主要活动于古希腊世界，包括马其顿、雅典、小亚细亚沿岸及爱琴海岛屿。\n- 🌟 **重要节点数量**：7个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：斯塔基拉\n- **公元纪年**：公元前384年\n- **停留时间**：童年及少年时期（约至17岁）\n- **位置**：古称斯塔基拉（Stageira），今希腊马其顿区哈尔基季基州斯塔基拉村。\n- **事迹**：出生于医生世家，父亲尼各马可是马其顿国王阿明塔斯三世的御医。自幼接触医学与自然科学知识。\n- **意义**：家庭环境培养了他对生物学和经验观察的最初兴趣，为其日后注重实证的学术风格奠定基础。\n\n### 📍 重要地点：雅典（柏拉图学园）\n- **公元纪年**：约公元前367年 – 前347年\n- **停留时间**：约20年\n- **位置**：古称雅典（Athens），今希腊首都雅典。\n- **事迹**：进入柏拉图学园学习，成为柏拉图的杰出学生，深入研习哲学、数学等。柏拉图称其为“学园的精英”。\n- **意义**：系统接受了柏拉图哲学的训练，但逐渐形成独立的批判性思考，为其日后哲学体系的建立打下核心基础。\n- **名篇名句**：《形而上学》：“吾爱吾师，吾更爱真理。”\n\n### 📍 重要地点：阿塔尔纽斯与米蒂利尼\n- **公元纪年**：约公元前347年 – 前344年\n- **停留时间**：约3年\n- **位置**：阿塔尔纽斯（Atarneus，今土耳其西部沿海）；米蒂利尼（Mytilene，今希腊莱斯博斯岛）。\n- **事迹**：柏拉图去世后，与同学离开雅典，受阿塔尔纽斯僭主赫尔米亚斯庇护，进行学术研究，尤其专注于生物学考察。\n- **意义**：开始了独立的学术生涯，并在莱斯博斯岛进行了重要的海洋生物观察与研究。\n- **名篇名句**：《动物志》中对海洋生物的描述多源于此时期考察。\n\n### 📍 重要地点：马其顿王宫（佩拉）\n- **公元纪年**：约公元前343年 – 前340年\n- **停留时间**：约3年\n- **位置**：古称佩拉（Pella），今希腊中马其顿大区佩拉市。\n- **事迹**：受马其顿国王腓力二世邀请，担任年仅13岁的王子亚历山大的教师。\n- **意义**：对未来的亚历山大大帝产生了深远影响，传授了哲学、政治、伦理等知识，间接影响了希腊化时代的开启。\n- **名篇名句**：《政治学》：“人天生是政治的动物。”（此思想可能影响了亚历山大的统治观念）\n\n### 📍 重要地点：雅典（吕克昂学园）\n- **公元纪年**：约公元前335年 – 前323年\n- **停留时间**：约12年\n- **位置**：古称吕克昂（Lyceum），今雅典市内考古遗址。\n- **事迹**：重返雅典，建立自己的学园——吕克昂学园。每日与学生在林荫道上边散步边讨论学问，故其学派得名“逍遥学派”。在此完成了大部分著作。\n- **意义**：学术生涯的巅峰时期，建立了庞大的知识体系，形成了与柏拉图学园并立的学术中心。\n- **名篇名句**：《尼各马可伦理学》：“幸福是灵魂的一种合乎德性的现实活动。”；《诗学》：“诗比历史更富有哲学意味。”\n\n### 📍 重要地点：哈尔基斯（优卑亚岛）\n- **公元纪年**：公元前323年 – 前322年\n- **停留时间**：约1年\n- **位置**：古称哈尔基斯（Chalcis），今希腊优卑亚岛哈尔基斯市。\n- **事迹**：亚历山大大帝去世后，雅典爆发反马其顿运动，亚里士多德因“不敬神”罪名被指控，为免“雅典人再次对哲学犯罪”（指苏格拉底之死），他离开雅典，避居于此。\n- **意义**：生命的终点与学术生涯的终结地。\n- **名篇名句**：无直接相关名篇，但其临终选择体现了对雅典政治环境的清醒认识。\n\n### 🔴 去世地：哈尔基斯\n- **公元纪年**：公元前322年\n- **停留时间**：生命最后阶段\n- **位置**：古称哈尔基斯（Chalcis），今希腊优卑亚岛哈尔基斯市。\n- **经过**：抵达哈尔基斯后不久，因长期劳累与疾病（据传为胃病）去世。\n- **意义**：标志着古希腊哲学一个伟大时代的终结。其著作与思想通过吕克昂学园得以保存和传播。\n- **名篇名句**：无直接相关名篇。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 公元前384年 | 0岁 | 出生于马其顿斯塔基拉。 |\n| 约公元前367年 | 约17岁 | 前往雅典，进入柏拉图学园学习。 |\n| 约公元前347年 | 约37岁 | 柏拉图去世，离开雅典，前往小亚细亚。 |\n| 约公元前343年 | 约41岁 | 受聘为马其顿王子亚历山大的教师。 |\n| 约公元前335年 | 约49岁 | 重返雅典，建立吕克昂学园，开始逍遥学派时期。 |\n| 公元前323年 | 约61岁 | 亚历山大大帝去世，雅典反马其顿情绪高涨。 |\n| 公元前323年 | 约61岁 | 为避政治迫害，离开雅典，迁居优卑亚岛哈尔基斯。 |\n| 公元前322年 | 62岁 | 在哈尔基斯病逝。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n亚里士多德通过教育亚历山大大帝，将希腊文化与哲学思想注入了未来的征服者心中，促进了希腊文化在东方的传播。他建立的吕克昂学园是当时最重要的学术中心之一，培养了大批学者，其研究成果（尤其是自然科学）直接推动了希腊化时代的科学发展。\n\n### 对后世的影响\n- **哲学与科学**：其逻辑学（三段论）统治西方思想近两千年；其自然哲学和科学分类方法为中世纪伊斯兰与基督教世界所继承，成为近代科学革命的起点之一。\n- **思想体系**：他的形而上学、伦理学、政治学、美学思想构成了西方学术传统的基石，深刻影响了托马斯·阿奎那、笛卡尔、黑格尔等后世哲学家。\n- **教育模式**：吕克昂学园的教学与研究相结合的模式，成为后世大学的雏形。\n\n### 历史评价\n1. **马克思**：称其为“古代最伟大的思想家”。\n2. **黑格尔**：认为“如果真有所谓人类导师的话，就应该认为亚里士多德是这样一个人”。\n3. **但丁**：在《神曲》中尊称他为“智者们的大师”。\n4. **罗素**：评价其“在每一个时代都对思想产生了最深刻的影响”。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**古希腊**文明繁荣时期，城邦政治与哲学思辨兴盛。\n- **关键身份**：**柏拉图的学生**，**亚历山大大帝的老师**。\n- **核心思想**：强调**观察与经验**在认识世界中的重要性（与柏拉图强调理念不同）。\n- **代表贡献**：被誉为“**百科全书式的学者**”，在**逻辑学、生物学、物理学**等领域有开创性研究。\n- **教育贡献**：创办**吕克昂学园**，其学派被称为“**逍遥学派**”。\n- **历史地位**：与**苏格拉底、柏拉图**并称为“**古希腊三大哲学家**”。\n- **常见易混点**：区分其与柏拉图哲学观点的差异（经验 vs. 理念）。\n\n### 高中阶段\n- **哲学体系**：系统阐述了**形而上学**（研究“作为存在的存在”）、**伦理学**（幸福论与德性论）、**政治学**（政体分类）。\n- **逻辑学奠基**：创立了**形式逻辑**，其核心是**三段论**推理，成为西方逻辑学的基础。\n- **科学方法**：强调**目的因**（四因说），其自然观在中世纪长期占据统治地位。\n- **美学思想**：在《**诗学**》中提出**悲剧理论**（净化说），对西方文艺理论影响深远。\n- **历史影响**：其著作经**阿拉伯学者**保存、翻译，于中世纪后期传回欧洲，推动了**经院哲学**的发展和**文艺复兴**。\n- **思想局限**：其物理学（如地心说、自然运动理论）被**近代科学革命**（伽利略、牛顿）所推翻。\n- **对比学习**：常与**柏拉图**对比（经验主义 vs. 理性主义）；与**孔子**对比（西方理性传统 vs. 东方伦理传统）。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n- **人物定位**：古希腊哲学家、科学家，柏拉图的学生，亚历山大大帝的老师。\n- **核心主张**：认为**求知是人的本性**；强调**观察和经验**的重要性。\n- **主要成就**：创立**逻辑学**；在**生物学**领域进行分类研究；建立**吕克昂学园**。\n- **历史地位**：**古希腊哲学的集大成者**，对西方科学和哲学发展影响深远。\n- **名言识记**：“**吾爱吾师，吾更爱真理。**”\n\n### 高中阶段考点\n- **哲学思想**：**四因说**（质料因、形式因、动力因、目的因）；**实体学说**；**伦理学**中的“**中道**”思想与**幸福观**。\n- **逻辑学贡献**：**三段论**的基本形式（大前提、小前提、结论）；对**范畴**的划分。\n- **政治学观点**：对**政体**的分类（君主制、贵族制、共和制及其变态形式）；“**人是天生的政治动物**”。\n- **美学理论**：《**诗学**》中关于**悲剧**的定义、要素（情节、性格等）及“**卡塔西斯**”（净化）作用。\n- **历史影响**：其思想如何被**中世纪经院哲学**（托马斯·阿奎那）吸收利用；如何成为**近代科学革命**的批判对象。\n- **重要对比**：与**柏拉图**哲学体系的异同；其逻辑学与**现代逻辑**的关系。\n- **著作识记**：《**形而上学**》、《**尼各马可伦理学**》、《**政治学**》、《**诗学**》、《**工具论**》（逻辑学著作集）。\n\n## 地点坐标（自动地理编码）\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 斯塔基拉（出生地） | const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

            <p className="text-2xl mb-1">🌟</p>
            <p className="text-xl font-bold">{stats.events} <span className="text-xs font-normal">件</span></p>
            <p className="text-[10px] text-gray-400 uppercase">重要事迹</p>
          </div>
        </div>

        <section ref={chatSectionRef} className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-white/70">
          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</h2>
              <p className="text-[11px] text-gray-500 mt-1">进入足迹内容后，以第一人称与人物对话（依据史实）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="text-[11px] px-3 py-1 rounded bg-[#c0392b] text-white hover:bg-[#a93226]"
              >
                {chatOpen ? '收起' : '开始对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[#c8b496]/40 rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[#c0392b] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = String(m.content || '').trim();
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 bg-white text-gray-700">
                        正在回应…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
    <script>
      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
</body>
