color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 初中阶段\n- **时代背景**：**唐代**社会经济繁荣，**饮茶风气**从南方传至全国并普及。\n- **关键人物**：**陆羽**，被誉为“**茶圣**”。\n- **代表作品**：世界上第一部关于茶的专著《**茶经**》。\n- **核心贡献**：系统总结了唐代及以前的**茶学知识**，使茶从一种普通饮料升华为一种文化。\n- **常见关联**：常与唐代**社会生活**、**文化繁荣**等知识点结合考查。\n\n### 高中阶段\n- **时代背景**：**安史之乱**后，经济重心南移趋势加强，**江南地区**开发深入，为茶业发展提供条件。\n- **思想文化**：陆羽的茶学思想融合了**儒家**的“俭德”、**道家**的“自然”与**佛家**的“禅意”，体现了唐代**三教合流**的文化特点。\n- **历史地位**：《茶经》的问世标志着**茶学**成为一门独立的学问，是中国**传统文化**（物质文化与精神文化结合）的典型代表。\n- **经济视角**：反映了唐代**商品经济**的发展和**农产品商品化**程度的提高。\n- **对比点**：可与**丝绸之路**上的瓷器、丝绸等商品对比，理解其作为**文化载体**的共性；亦可与**宋代**点茶、斗茶文化对比，看茶文化的演变。\n\n---", "examPoints": "### 初中阶段考点\n1.  **人物别称**：陆羽被后世尊称为“**茶圣**”。\n2.  **代表著作**：其撰写的《**茶经**》是世界上第一部茶学专著。\n3.  **历史意义**：陆羽和《茶经》推动了**饮茶风气**在全国的普及，并奠定了中国**茶文化**的基础。\n4.  **时代背景**：生活在**唐朝**（中唐时期）。\n5.  **生平特点**：出身孤苦，通过自学和游历考察取得成就。\n\n### 高中阶段考点\n1.  **《茶经》内容**：系统论述了茶的**起源**、**制作工具**、**采制方法**、**煮饮技艺**、**产地分布**等，构建了完整的茶学体系。\n2.  **文化内涵**：陆羽将**“精行俭德”** 的道德理念融入茶事，体现了**儒家**思想对物质文化的影响。\n3.  **社会经济**：陆羽对茶区的详细记载，反映了唐代**茶叶种植**的广泛性和**商品化**趋势。\n4.  **历史评价**：理解“**茶圣**”称号的由来及其对**东亚茶文化**（特别是日本茶道）的深远影响。\n5.  **人物关系**：需了解其与诗僧**皎然**、书法家**颜真卿**的交往，这是理解其生平与思想的重要背景。\n6.  **存疑/说法不一**：关于陆羽的**确切出生地**（竟陵龙盖寺或西湖之滨）、**《茶经》成书的确切年份**（有初稿与定稿之别），学界存在细微讨论。", "markdown": "# 陆羽\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：陆羽（字鸿渐，一名疾，字季疵，号竟陵子、桑苎翁、东冈子）\n- **时代**：唐代\n- **出生**：公元733年（开元二十一年），复州竟陵（今湖北天门）\n- **去世**：公元804年（贞元二十年），湖州（今浙江湖州）\n- **享年**：约71岁（按生卒年跨度计算）\n- **主要身份**：茶学家、文学家、历史学家\n- **历史地位**：被后世尊为“茶圣”，其著作《茶经》是世界上第一部茶学专著，奠定了中国茶文化的基础。\n- **主要成就**：撰《茶经》三卷；系统总结唐代及以前茶的起源、制作、器具、煮饮等知识；推动茶从物质饮品升华为文化载体；工于诗文，与皎然、颜真卿等交游。\n\n### 生平概述\n陆羽生于盛唐，身世坎坷，幼年被弃，为竟陵龙盖寺僧智积禅师收养。少年时期在戏班学艺，后得竟陵太守李齐物赏识，荐至邹夫子门下读书。安史之乱后，他遍历长江中下游茶区，实地考察茶事，并结交诗僧皎然、书法家颜真卿等名士。晚年隐居湖州，潜心著述，最终完成划时代的《茶经》。他一生淡泊名利，以茶为志，将个人的身世感悟与对自然、文化的深刻理解融入茶学，使饮茶从日常习惯升华为一门精深的学问与艺术。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要集中在长江中下游的湖北、江苏、浙江、江西等地，以考察茶事、游历山水、访友著述为主。\n- ⏱️ **时间跨度**：公元733年—公元804年，共约71年。\n- 📍 **地理范围**：东至越州（今浙江绍兴），西至峡州（今湖北宜昌），南至信州（今江西上饶），北至常州（今江苏常州）。\n- 🌟 **重要节点数量**：约10个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：复州竟陵\n- **公元纪年**：约733年\n- **停留时间**：约13年（幼年及少年初期）\n- **位置**：复州竟陵（今湖北省天门市）\n- **事迹**：被遗弃于西湖之滨，为龙盖寺智积禅师收养；在寺院中学习烹茶、识字；因不堪寺院生活而出逃，加入戏班。\n- **意义**：人生起点与茶缘初结之地，寺院生活为其奠定了最初的茶学基础与文化启蒙。\n\n### 📍 重要地点：龙盖寺\n- **公元纪年**：约733年—约746年\n- **停留时间**：约13年\n- **位置**：复州竟陵西湖畔（今湖北省天门市西塔寺附近）\n- **事迹**：由智积禅师抚育成人；学习佛典、煎茶技艺；因不愿皈依佛门而与禅师产生矛盾，最终离开。\n- **意义**：其茶学与文化的启蒙地，智积禅师是其第一位茶艺导师。\n\n### 📍 重要地点：天门火门山（火门山）\n- **公元纪年**：约746年—约752年\n- **停留时间**：约6年\n- **位置**：复州竟陵北部（今湖北省天门市皂市镇火门山）\n- **事迹**：得遇太守李齐物，受其赏识并赠书，推荐至火门山邹夫子处读书。（注：具体年份存疑）\n- **意义**：系统接受儒家经典教育的转折点，为其日后著述打下文学与史学基础。\n\n### 📍 重要地点：常州（义兴/阳羡）\n- **公元纪年**：约755年—约756年（安史之乱前后）\n- **停留时间**：数年\n- **位置**：常州义兴（今江苏省宜兴市）\n- **事迹**：考察阳羡茶；与常州刺史李栖筠交往，品茶论道。\n- **意义**：重要的早期茶区考察地，深化了对名茶“阳羡茶”的认识。\n\n### 📍 重要地点：湖州杼山（妙喜寺）\n- **公元纪年**：约756年（至德元载）初识，后长期往来\n- **停留时间**：断续停留，交往长达数十年\n- **位置**：湖州乌程杼山（今浙江省湖州市吴兴区）\n- **事迹**：结识诗僧皎然，结为“缁素忘年之交”；共同探讨茶道、诗文；参与颜真卿主持的《韵海镜源》编纂。\n- **意义**：人生最重要的精神家园与学术交流中心，皎然是其茶学思想与文学创作的关键知己与支持者。\n- **名篇名句**：《六羡歌》（一作《歌》）：“不羡黄金罍，不羡白玉杯；不羡朝入省，不羡暮入台；千羡万羡西江水，曾向竟陵城下来。”（注：传世版本有细微差异）\n\n### 📍 重要地点：湖州苕溪草堂\n- **公元纪年**：约760年（上元元年）开始\n- **停留时间**：隐居数年\n- **位置**：湖州苕溪畔（今浙江省湖州市吴兴区苕溪两岸）\n- **事迹**：闭门著书，初步完成《茶经》初稿；自称“桑苎翁”，过着清贫的隐居生活。\n- **意义**：《茶经》的诞生地，标志着其茶学体系的初步形成。\n- **名篇名句**：《自传》（即《陆文学自传》）：“结庐于苕溪之滨，闭关对书，不杂非类，名僧高士，谈宴永日。”\n\n### 📍 重要地点：苏州\n- **公元纪年**：约760年代—770年代\n- **停留时间**：多次游历\n- **位置**：苏州（今江苏省苏州市）\n- **事迹**：品鉴洞庭山茶；与当地文人雅士交游。\n- **意义**：考察江南茶区与文化的重要一站。\n\n### 📍 重要地点：越州（会稽）\n- **公元纪年**：约770年代\n- **停留时间**：游历\n- **位置**：越州会稽（今浙江省绍兴市）\n- **事迹**：考察越州茶，品评“剡溪茶”；游览若耶溪、兰亭等名胜。\n- **意义**：深入浙东茶区，丰富《茶经》中关于茶叶产地的记载。\n\n### 📍 重要地点：杭州\n- **公元纪年**：约770年代\n- **停留时间**：游历\n- **位置**：杭州（今浙江省杭州市）\n- **事迹**：品鉴天竺、灵隐一带所产茶；游览西湖。\n- **意义**：考察杭州茶区，为后世龙井茶文化埋下伏笔。\n\n### 🔴 去世地：湖州青塘别业\n- **公元纪年**：公元804年（贞元二十年）\n- **停留时间**：晚年定居于此\n- **位置**：湖州青塘门外（今浙江省湖州市吴兴区）\n- **经过**：晚年定居于此，最终在此逝世，葬于杼山，与皎然塔相邻。\n- **意义**：人生最后的归宿与安息地，象征其与湖州、与皎然不解的茶缘与文缘。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 733年 | 0岁 | 生于复州竟陵，被弃，为智积禅师收养。 |\n| 约746年 | 约13岁 | 逃离寺院，加入戏班。 |\n| 约746年 | 约13岁 | 得遇太守李齐物，受荐至火门山读书。（注：具体年份存疑） |\n| 约752年 | 约19岁 | 学成下山。与崔国辅交游（具体时间存疑）。 |\n| 755年 | 22岁 | 安史之乱爆发，开始南渡避乱、考察茶事之旅。 |\n| 756年 | 23岁 | 抵达湖州，结识皎然，成为一生挚友。 |\n| 约760年 | 约27岁 | 隐居湖州苕溪，自称“桑苎翁”，撰《茶经》初稿。 |\n| 约765年 | 约32岁 | 《茶经》初稿完成并流传。 |\n| 773年 | 40岁 | 入湖州刺史颜真卿幕府，参与编纂《韵海镜源》。 |\n| 780年代 | 约50岁 | 游历各地，考察茶事，修订《茶经》。 |\n| 约804年 | 约71岁 | 逝世于湖州，葬于杼山。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n陆羽在唐代中叶，通过《茶经》将零散的茶知识系统化、理论化，提升了饮茶的文化格调。他与颜真卿、皎然等文化名流的交往，使茶事活动成为文人雅集的重要组成部分，极大地推动了茶文化在士人阶层的普及与发展，为宋代茶文化的巅峰奠定了坚实基础。\n\n### 对后世的影响\n1.  **确立茶学体系**：《茶经》成为后世茶学的奠基之作，被翻译成多国文字，影响世界茶学发展。\n2.  **塑造茶道精神**：将“精行俭德”的道德追求融入茶事，奠定了中国茶道的精神内核。\n3.  **推动产业与文化**：其对茶树种植、制作、品饮的规范，直接促进了后世茶叶生产技术的进步和茶商品的繁荣。\n4.  **影响东亚文化**：对日本茶道的形成与发展产生了深远影响。\n\n### 历史评价\n1.  **《新唐书·陆羽传》**：“羽嗜茶，著经三篇，言茶之原、之法、之具尤备，天下益知饮茶矣。”\n2.  **宋代陈师道《茶经序》**：“夫茶之著书，自羽始；其用于世，亦自羽始。羽诚有功于茶者也。”\n3.  **后世尊称**：“茶仙”、“茶神”、“茶圣”。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**唐代**社会经济繁荣，**饮茶风气**从南方传至全国并普及。\n- **关键人物**：**陆羽**，被誉为“**茶圣**”。\n- **代表作品**：世界上第一部关于茶的专著《**茶经**》。\n- **核心贡献**：系统总结了唐代及以前的**茶学知识**，使茶从一种普通饮料升华为一种文化。\n- **常见关联**：常与唐代**社会生活**、**文化繁荣**等知识点结合考查。\n\n### 高中阶段\n- **时代背景**：**安史之乱**后，经济重心南移趋势加强，**江南地区**开发深入，为茶业发展提供条件。\n- **思想文化**：陆羽的茶学思想融合了**儒家**的“俭德”、**道家**的“自然”与**佛家**的“禅意”，体现了唐代**三教合流**的文化特点。\n- **历史地位**：《茶经》的问世标志着**茶学**成为一门独立的学问，是中国**传统文化**（物质文化与精神文化结合）的典型代表。\n- **经济视角**：反映了唐代**商品经济**的发展和**农产品商品化**程度的提高。\n- **对比点**：可与**丝绸之路**上的瓷器、丝绸等商品对比，理解其作为**文化载体**的共性；亦可与**宋代**点茶、斗茶文化对比，看茶文化的演变。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **人物别称**：陆羽被后世尊称为“**茶圣**”。\n2.  **代表著作**：其撰写的《**茶经**》是世界上第一部茶学专著。\n3.  **历史意义**：陆羽和《茶经》推动了**饮茶风气**在全国的普及，并奠定了中国**茶文化**的基础。\n4.  **时代背景**：生活在**唐朝**（中唐时期）。\n5.  **生平特点**：出身孤苦，通过自学和游历考察取得成就。\n\n### 高中阶段考点\n1.  **《茶经》内容**：系统论述了茶的**起源**、**制作工具**、**采制方法**、**煮饮技艺**、**产地分布**等，构建了完整的茶学体系。\n2.  **文化内涵**：陆羽将**“精行俭德”** 的道德理念融入茶事，体现了**儒家**思想对物质文化的影响。\n3.  **社会经济**：陆羽对茶区的详细记载，反映了唐代**茶叶种植**的广泛性和**商品化**趋势。\n4.  **历史评价**：理解“**茶圣**”称号的由来及其对**东亚茶文化**（特别是日本茶道）的深远影响。\n5.  **人物关系**：需了解其与诗僧**皎然**、书法家**颜真卿**的交往   const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
