      const data = {"person": {"name": "班超", "title": "", "description": "班超字仲升，出身儒学世家，早年为官府抄写文书以养家，后投笔从戎。汉明帝永平十六年（73年），他随窦固出击北匈奴，随后奉命率吏士三十六人出使西域。在西域的三十一年间，他凭借智谋与胆略，以夷制夷，团结亲汉力量，平定了多次叛乱，击败了外部势力的干预，最终使西域五十余国归附汉朝，被任命为西域都护，封定远侯。他的活动确保了丝绸之路的长期稳定，为多民族国家的统一与中外交流做出了卓越贡献。", "quote": "", "dynasty": "东汉", "birthplace": "扶风平陵（今陕西省咸阳市秦都区）", "avatar": "", "birth": {"date": "32年", "location": "扶风平陵（今陕西省咸阳市秦都区）", "lat": 34.3296, "lng": 108.7089}, "death": {"date": "102年", "location": "雒阳（今河南省洛阳市）", "lat": 34.6197, "lng": 112.454}, "lifespan": "约70-71岁", "highlights": {"honor": "", "status": "东汉名将，经营西域三十一年，重新打通并保障了丝绸之路的畅通。", "identities": "军事家、外交家", "achievements": "1. 出使西域，恢复汉朝对西域诸国的管辖；2. 平定莎车、龟兹、焉耆等地的叛乱；3. 击退贵霜帝国（大月氏）的入侵；4. 重建西域都护府，巩固边防；5. 促进东西方经济文化交流。", "works": [], "reviews": []}}, "locations": [{"name": "扶风平陵", "ancientName": "扶风平陵", "modernName": "陕西省咸阳市秦都区", "lat": 34.3296, "lng": 108.7089, "type": "birth", "event": "出生于儒学世家，其父班彪、兄班固、妹班昭均为著名史学家。早年家贫，常为官府抄写文书。", "time": "约公元32年", "duration": "约三十年", "significance": "奠定了其文化基础与家族背景，为日后“投笔从戎”的抉择提供了反差背景。", "works": [], "quoteLines": []}, {"name": "雒阳", "ancientName": "雒阳", "modernName": "河南省洛阳市", "lat": 34.6197, "lng": 112.454, "type": "normal", "event": "在官府担任抄写文书的“兰台令史”，后因事免官。曾感叹“大丈夫无它志略，犹当效傅介子、张骞立功异域，以取封侯，安能久事笔研间乎？”遂“投笔从戎”。", "time": "约公元62年前后", "duration": "数年", "significance": "人生重大转折点，从文吏转变为志在边疆的勇士。", "works": [], "quoteLines": []}, {"name": "雒阳", "ancientName": "雒阳", "modernName": "河南省洛阳市", "lat": 34.6197, "lng": 112.454, "type": "death", "event": "年老思乡，上书请求回国，书中言“臣不敢望到酒泉郡，但愿生入玉门关”。其妹班昭亦上书陈情，汉和帝深受感动，征召班超回京。公元102年八月，班超回到洛阳，拜为射声校尉，同年九月病逝。", "time": "公元102年", "duration": "约一个月", "significance": "落叶归根，结束了其波澜壮阔的西域生涯，后世誉为“投笔从戎”、“不入虎穴，焉得虎子”的典范。", "works": [], "quoteLines": []}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《后汉书·班超传》**（节选）、“**投笔从戎**”、“**不入虎穴，焉得虎子**”等典故。\n- 核心要点：\n    - **重点**：**“投笔从戎”** 的典故，体现了班超不甘平庸、立志报国的豪情壮志。\n    - **重点**：**“不入虎穴，焉得虎子”** 的典故，生动展现了班超临危不惧、果断勇敢的英雄气概与非凡胆识。\n    - **重点**：**“但愿生入玉门关”** 的语句，深刻表达了戍边将士年老思归的复杂情感与对故土的深切眷恋。\n    - 人物形象塑造：通过**语言描写**（如“安能久事笔研间乎？”）和**行动描写**（如夜袭匈奴营），刻画了一位有勇有谋、坚韧不拔的外交家与军事家形象。\n    - **叙事手法**：选文情节**跌宕起伏**，善于在**矛盾冲突**（如鄯善态度的转变）中凸显人物性格。\n    - **精神内涵**：歌颂了维护国家统一、开拓进取、不畏艰险的**爱国主义精神**与**英雄主义精神**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**东汉明帝**时期，班超奉命出使西域，开始了其经营西域的伟业。\n    - **重点**：班超以**西域都护**的身份，代表东汉政府恢复并加强了对**西域**（狭义指今新疆地区）的有效管辖。\n    - 成功运用 **“以夷制夷”** 的策略，主要依靠西域当地国家的兵力进行征战，耗费中原资源较少。\n    - **重点**：在任期间，**击退贵霜帝国（大月氏）** 的入侵，维护了西域的稳定。\n    - 派遣**甘英**出使**大秦（罗马帝国）**，虽未抵达，但加深了对西方世界的了解。\n- 核心要点：\n    - **重点**：班超经营西域的背景是**西汉末年至王莽时期**中原对西域控制的减弱，以及**北匈奴**势力在西域的扩张。\n    - **重点**：其成功的关键在于个人卓越的**外交才能**、**军事胆略**以及对西域各国形势的深刻理解。\n    - **重点**：班超的功业具有重大历史意义：**重新打通并保障了陆上丝绸之路的畅通**，促进了东西方经济文化交流。\n    - 他的活动巩固了**多民族国家**的统一，为后世中原王朝治理边疆提供了重要借鉴。\n    - 历史评价：班超是**中国古代杰出的外交家**和**民族英雄**，其“投笔从戎”的事迹激励了后世无数志士仁人。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《后汉书·班超传》**（节选）、“**投笔从戎**”、“**不入虎穴，焉得虎子**”等典故。\n- 核心要点：\n    - **重点**：**“投笔从戎”** 的典故，体现了班超不甘平庸、立志报国的豪情壮志。\n    - **重点**：**“不入虎穴，焉得虎子”** 的典故，生动展现了班超临危不惧、果断勇敢的英雄气概与非凡胆识。\n    - **重点**：**“但愿生入玉门关”** 的语句，深刻表达了戍边将士年老思归的复杂情感与对故土的深切眷恋。\n    - 人物形象塑造：通过**语言描写**（如“安能久事笔研间乎？”）和**行动描写**（如夜袭匈奴营），刻画了一位有勇有谋、坚韧不拔的外交家与军事家形象。\n    - **叙事手法**：选文情节**跌宕起伏**，善于在**矛盾冲突**（如鄯善态度的转变）中凸显人物性格。\n    - **精神内涵**：歌颂了维护国家统一、开拓进取、不畏艰险的**爱国主义精神**与**英雄主义精神**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**东汉明帝**时期，班超奉命出使西域，开始了其经营西域的伟业。\n    - **重点**：班超以**西域都护**的身份，代表东汉政府恢复并加强了对**西域**（狭义指今新疆地区）的有效管辖。\n    - 成功运用 **“以夷制夷”** 的策略，主要依靠西域当地国家的兵力进行征战，耗费中原资源较少。\n    - **重点**：在任期间，**击退贵霜帝国（大月氏）** 的入侵，维护了西域的稳定。\n    - 派遣**甘英**出使**大秦（罗马帝国）**，虽未抵达，但加深了对西方世界的了解。\n- 核心要点：\n    - **重点**：班超经营西域的背景是**西汉末年至王莽时期**中原对西域控制的减弱，以及**北匈奴**势力在西域的扩张。\n    - **重点**：其成功的关键在于个人卓越的**外交才能**、**军事胆略**以及对西域各国形势的深刻理解。\n    - **重点**：班超的功业具有重大历史意义：**重新打通并保障了陆上丝绸之路的畅通**，促进了东西方经济文化交流。\n    - 他的活动巩固了**多民族国家**的统一，为后世中原王朝治理边疆提供了重要借鉴。\n    - 历史评价：班超是**中国古代杰出的外交家**和**民族英雄**，其“投笔从戎”的事迹激励了后世无数志士仁人。\n\n---", "markdown": "# 班超\n\n## 人物档案\n\n### 基本信息\n- **姓名**：班超\n- **时代**：东汉\n- **出生**：约公元32年（一说33年），扶风平陵（今陕西省咸阳市秦都区）\n- **去世**：公元102年，雒阳（今河南省洛阳市）\n- **享年**：约70-71岁\n- **主要身份**：军事家、外交家\n- **历史地位**：东汉名将，经营西域三十一年，重新打通并保障了丝绸之路的畅通。\n- **主要成就**：1. 出使西域，恢复汉朝对西域诸国的管辖；2. 平定莎车、龟兹、焉耆等地的叛乱；3. 击退贵霜帝国（大月氏）的入侵；4. 重建西域都护府，巩固边防；5. 促进东西方经济文化交流。\n\n### 生平概述\n班超字仲升，出身儒学世家，早年为官府抄写文书以养家，后投笔从戎。汉明帝永平十六年（73年），他随窦固出击北匈奴，随后奉命率吏士三十六人出使西域。在西域的三十一年间，他凭借智谋与胆略，以夷制夷，团结亲汉力量，平定了多次叛乱，击败了外部势力的干预，最终使西域五十余国归附汉朝，被任命为西域都护，封定远侯。他的活动确保了丝绸之路的长期稳定，为多民族国家的统一与中外交流做出了卓越贡献。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从都城洛阳出发，足迹遍及西域（今新疆及中亚部分地区），最远可能抵达中亚。\n- ⏱️ **时间跨度**：主要活动于公元73年至102年，约30年。\n- 📍 **地理范围**：东起中原（河南），西至西域诸国（新疆全境及中亚费尔干纳盆地）。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：扶风平陵\n- **时间**：约公元32年\n- **停留时间**：约三十年\n- **地点**：扶风平陵（今陕西省咸阳市秦都区）\n- **事件**：出生于儒学世家，其父班彪、兄班固、妹班昭均为著名史学家。早年家贫，常为官府抄写文书。\n- **意义**：奠定了其文化基础与家族背景，为日后“投笔从戎”的抉择提供了反差背景。\n\n### 📍 重要地点：雒阳\n- **时间**：约公元62年前后\n- **停留时间**：数年\n- **地点**：雒阳（今河南省洛阳市）\n- **事件**：在官府担任抄写文书的“兰台令史”，后因事免官。曾感叹“大丈夫无它志略，犹当效傅介子、张骞立功异域，以取封侯，安能久事笔研间乎？”遂“投笔从戎”。\n- **意义**：人生重大转折点，从文吏转变为志在边疆的勇士。\n\n### 📍 重要地点：伊吾（哈密）\n- **时间**：公元73年\n- **停留时间**：短暂\n- **地点**：伊吾（今新疆维吾尔自治区哈密市）\n- **事件**：随奉车都尉窦固出击北匈奴，在伊吾卢（哈密）之战中表现英勇，被窦固赏识，受命与郭恂率吏士三十六人出使西域。\n- **意义**：军事生涯的起点，也是其独立外交事业的开端。\n\n### 📍 重要地点：鄯善（楼兰）\n- **时间**：公元73年\n- **停留时间**：数日\n- **地点**：鄯善（古称楼兰，今新疆维吾尔自治区若羌县）\n- **事件**：初到时受礼遇，后因匈奴使团到来而遭冷遇。班超以“不入虎穴，焉得虎子”激励部下，夜袭匈奴营帐，斩杀匈奴使者，迫使鄯善王归附汉朝。\n- **意义**：初显胆识与决断力，威震西域，成功迈出经营西域的第一步。\n- **名篇名句**：《后汉书·班超传》：“不入虎穴，焉得虎子。”\n\n### 📍 重要地点：于阗\n- **时间**：公元73年\n- **停留时间**：数月\n- **地点**：于阗（今新疆维吾尔自治区和田市）\n- **事件**：于阗王广德因有匈奴监护，对班超冷淡。班超设计斩杀反对汉朝的巫师，迫使广德斩杀匈奴使者归附。\n- **意义**：进一步巩固汉朝在西域南道的威信。\n\n### 📍 重要地点：疏勒\n- **时间**：公元74年-公元102年（主要经营地）\n- **停留时间**：断续经营约三十年\n- **地点**：疏勒（今新疆维吾尔自治区喀什市）\n- **事件**：废除匈奴支持的傀儡国王，扶立亲汉的疏勒人为王，稳定局势。此后长期以此为基地，指挥调度西域各国力量，对抗匈奴、平定叛乱、抵御外敌（如大月氏）。\n- **意义**：班超经营西域的核心基地与大本营，见证了其大部分功业。\n- **名篇名句**：《后汉书·班超传》：“臣不敢望到酒泉郡，但愿生入玉门关。”\n\n### 📍 重要地点：龟兹\n- **时间**：公元78年-公元94年（多次行动）\n- **停留时间**：多次往返\n- **地点**：龟兹（今新疆维吾尔自治区库车市）\n- **事件**：龟兹是匈奴在西域北道的重要盟友。班超联合疏勒、于阗等国，与龟兹及其盟国莎车进行了长期斗争。公元94年，最终攻破龟兹，将其纳入汉朝管辖。\n- **意义**：平定西域北道的关键，标志着汉朝对西域的全面控制得以恢复。\n\n### 📍 重要地点：乌即城（属疏勒）\n- **时间**：公元75年-公元78年\n- **停留时间**：坚守数年\n- **地点**：疏勒国境内（今新疆维吾尔自治区喀什地区）\n- **事件**：汉明帝驾崩，西域诸国叛乱，进攻班超。班超孤立无援，坚守疏勒的乌即城，联合亲汉力量，最终稳住阵脚。\n- **意义**：展现了班超在极端困境下的坚韧与外交手腕。\n\n### 📍 重要地点：它乾城（西域都护府治所）\n- **时间**：公元91年-公元102年\n- **停留时间**：约十一年\n- **地点**：西域都护府治所（今新疆维吾尔自治区阿克苏地区一带）\n- **事件**：公元91年，班超被任命为西域都护，设治所于它乾城。在此期间，他完全平定西域，于公元97年派甘英出使大秦（罗马帝国），抵达波斯湾。\n- **意义**：班超事业的顶峰，代表汉朝西域管辖机构的正式重建与运作。\n- **名篇名句**：《后汉书·班超传》：“定远慷慨，专功西遐。坦步葱、雪，咫尺龙沙。”\n\n### 🔴 去世地：雒阳\n- **时间**：公元102年\n- **停留时间**：约一个月\n- **地点**：雒阳（今河南省洛阳市）\n- **事件**：年老思乡，上书请求回国，书中言“臣不敢望到酒泉郡，但愿生入玉门关”。其妹班昭亦上书陈情，汉和帝深受感动，征召班超回京。公元102年八月，班超回到洛阳，拜为射声校尉，同年九月病逝。\n- **意义**：落叶归根，结束了其波澜壮阔的西域生涯，后世誉为“投笔从戎”、“不入虎穴，焉得虎子”的典范。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 约公元32年 | 0岁 | 出生于扶风平陵（今陕西咸阳秦都区）。 |\n| 约公元62年 | 约30岁 | 在洛阳任兰台令史，后免官。“投笔从戎”之志萌生。 |\n| 公元73年 | 约41岁 | 随窦固出击北匈奴于伊吾。率三十六人出使西域，智斩匈奴使团，慑服鄯善。至于阗，设计迫使于阗王归附。 |\n| 公元74年 | 约42岁 | 至疏勒，废匈奴所立王，扶立新王，稳定疏勒。 |\n| 公元75年 | 约43岁 | 汉明帝驾崩，西域叛乱，坚守疏勒乌即城。 |\n| 公元78年 | 约46岁 | 率疏勒、于阗等国兵攻破姑墨，上书请兵平定西域。 |\n| 公元80年 | 约48岁 | 汉章帝派徐干率兵增援。 |\n| 公元84年 | 约52岁 | 平定疏勒叛乱，联合乌孙牵制匈奴。 |\n| 公元87年 | 约55岁 | 率西域诸国兵大败莎车，威震西域。 |\n| 公元90年 | 约58岁 | 击退大月氏（贵霜帝国）副王谢的入侵，迫使其纳贡求和。 |\n| 公元91年 | 约59岁 | 龟兹、姑墨等国归降，被任命为西域都护，驻它乾城。 |\n| 公元94年 | 约62岁 | 攻破焉耆，西域五十余国全部纳质内属，西域平定。 |\n| 公元97年 | 约65岁 | 派甘英出使大秦（罗马帝国），至波斯湾而还。 |\n| 公元100年 | 约68岁 | 上书请求回国。 |\n| 公元102年 | 约71岁 | 八月，回到洛阳。九月，病逝。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《后汉书·班超传》**（节选）、“**投笔从戎**”、“**不入虎穴，焉得虎子**”等典故。\n- 核心要点：\n    - **重点**：**“投笔从戎”** 的典故，体现了班超不甘平庸、立志报国的豪情壮志。\n    - **重点**：**“不入虎穴，焉得虎子”** 的典故，生动展现了班超临危不惧、果断勇敢的英雄气概与非凡胆识。\n    - **重点**：**“但愿生入玉门关”** 的语句，深刻表达了戍边将士年老思归的复杂情感与对故土的深切眷恋。\n    - 人物形象塑造：通过**语言描写**（如“安能久事笔研间乎？”）和**行动描写**（如夜袭匈奴营），刻画了一位有勇有谋、坚韧不拔的外交家与军事家形象。\n    - **叙事手法**：选文情节**跌宕起伏**，善于在**矛盾冲突**（如鄯善态度的转变）中凸显人物性格。\n    - **精神内涵**：歌颂了维护国家统一、开拓进取、不畏艰险的**爱国主义精神**与**英雄主义精神**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**东汉明帝**时期，班超奉命出使西域，开始了其经营西域的伟业。\n    - **重点**：班超以**西域都护**的身份，代表东汉政府恢复并加强了对**西域**（狭义指今新疆地区）的有效管辖。\n    - 成功运用 **“以夷制夷”** 的策略，主要依靠西域当地国家的兵力进行征战，耗费中原资源较少。\n    - **重点**：在任期间，**击退贵霜帝国（大月氏）** 的入侵，维护了西域的稳定。\n    - 派遣**甘英**出使**大秦（罗马帝国）**，虽未抵达，但加深了对西方世界的了解。\n- 核心要点：\n    - **重点**：班超经营西域的背景是**西汉末年至王莽时期**中原对西域控制的减弱，以及**北匈奴**势力在西域的扩张。\n    - **重点**：其成功的关键在于个人卓越的**外交才能**、**军事胆略**以及对西域各国形势的深刻理解。\n    - **重点**：班超的功业具有重大历史意义：**重新打通并保障了陆上丝绸之路的畅通**，促进了东西方经济文化交流。\n    - 他的活动巩固了**多民族国家**的统一，为后世中原王朝治理边疆提供了重要借鉴。\n    - 历史评价：班超是**中国古代杰出的外交家**和**民族英雄**，其“投笔从戎”的事迹激励了后世无数志士仁人。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 陕西省咸阳市秦都区 | 34.3296 | 108.7089 |\n| 河南省洛阳市 | 34.6197 | 112.4540 |\n| 新疆哈密市 | 42.8333 | 93.5167 |\n| 新疆若羌县 | 39.0231 | 88.1683 |\n| 新疆和田市 | 37.1118 | 79.9316 |\n| 新疆喀什市 | 39.4677 | 75.9920 |\n| 新疆库车市 | 41.7179 | 82.9620 |"};

const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

    ].join('\n');
    const identity = personName ? `你正在扮演历史人物：${personName}。` : '你正在扮演一位历史人物。';
    const profile = [
      dynasty ? `朝代：${dynasty}` : '',
      birthplace ? `籍贯：${birthplace}` : '',
      lifeDatesLocal ? `生卒：${lifeDatesLocal}` : ''
    ].filter(Boolean).join('\n');
    const knowledge = [
      profile ? `【人物档案】\n${profile}` : '',
      keyFacts ? `【人物要点】\n${keyFacts}` : '',
      keyWorks ? `【相关作品/名句】\n${keyWorks}` : '',
      locLines ? `【足迹时间线】\n${locLines}` : '',
      quotes ? `【名句摘录】\n${quotes}` : ''
    ].filter(Boolean).join('\n\n');
    const chatTitle = personName ? `跟${personName}对话` : '与历史对话';
    return `${identity}\n\n你的目标：与用户进行“${chatTitle}”，像与一位来访者对话那样自然回答；用户问原理就讲原理，问作品就讲作品。\n\n对话规则：\n${rules}\n\n可用资料：\n${knowledge}`;
  }, [data, locations]);
  useEffect(() => {
    if (!chatOpen) return;
    const el = chatListRef.current;
    if (!el) return;
    el.scrollTop = el.scrollHeight;
  }, [chatOpen, chatMessages, chatLoading]);
  const _postChat = async (messages) => {
    const toUrl = (u) => String(u || '').trim();
    const tryUrls = [];
    const pushUrl = (u) => {
      const val = toUrl(u);
      if (!val) return;
      if (!tryUrls.includes(val)) tryUrls.push(val);
    };
    if (typeof window.MAP_STORY_AI_ENDPOINT === 'string' && window.MAP_STORY_AI_ENDPOINT.trim()) {
      pushUrl(toUrl(window.MAP_STORY_AI_ENDPOINT).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (typeof window.MAP_STORY_API_BASE === 'string' && window.MAP_STORY_API_BASE.trim()) {
      pushUrl(toUrl(window.MAP_STORY_API_BASE).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (window.location && window.location.protocol !== 'file:') {
      pushUrl('/api/ai/proxy');
      if (window.location.origin) {
        pushUrl(toUrl(window.location.origin).replace(/\/+$/, '') + '/api/ai/proxy');
      }
    }
    pushUrl('http://127.0.0.1:8765/api/ai/proxy');
    pushUrl('http://localhost:8765/api/ai/proxy');
    let lastErr = null;
    for (const url of tryUrls) {
      try {
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, temperature: 0.2 })
        });
        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(text || `HTTP ${resp.status}`);
        }
        return JSON.parse(text);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('request_failed');
  };
  const sendChat = async (content) => {
    const text = String(content || '').trim();
    if (!text || chatLoading) return;
    setChatError('');
    setChatLoading(true);
    const nextMessages = [...chatMessages, { role: 'user', content: text }];
    setChatMessages(nextMessages);
    setChatDraft('');
    try {
      const llmMessages = [
        { role: 'system', content: historyChatSystemPrompt },
        ...nextMessages.slice(-14)
      ];
      const resp = await _postChat(llmMessages);
      const reply = String(resp?.choices?.[0]?.message?.content || '').trim();
      setChatMessages((prev) => [...prev, { role: 'assistant', content: reply || '（史料未载，我不敢妄言。）' }]);
    } catch (e) {
      setChatError(String(e?.message || e || '请求失败'));
    } finally {
      setChatLoading(false);
    }
  };
  return (
    <div className="max-w-screen-2xl mx-auto space-y-6">
      <header className="glass-panel p-6 rounded-xl shadow-sm border-l-8 border-[#c0392b] flex flex-col md:flex-row gap-6 items-center">
        <div className="w-32 h-32 bg-[#fdf6e3] rounded-full flex items-center justify-center border-4 border-white shadow-inner overflow-hidden">
          <span className="text-[#7c2d12] text-5xl font-black tracking-wide">{surname}</span>
        </div>
        <div className="flex-1 text-center md:text-left">
          <h1 className="text-4xl font-bold">{data.person.name}</h1>
          {introTags.length ? (
            <div className="mt-2 mb-3 flex flex-wrap gap-2 justify-center md:justify-start">
              {introTags.map((tag, idx) => (
                <span key={idx} className="text-[11px] px-2.5 py-1 rounded-full bg-[#fdf6e3] border border-[#c8b496]/60 text-[#7c2d12] font-semibold">
                  {renderInline(tag)}
                </span>
              ))}
            </div>
          ) : null}
          {headerSubtitle ? (
            <p className="text-sm text-gray-500 italic mb-3">{renderInline(headerSubtitle)}</p>
          ) : null}
          <div className="mb-4 rounded-2xl border border-[#c8b496]/50 bg-amber-50/70 px-4 py-4 text-left">
            {relatedHonor && relatedHonor !== headerSubtitle ? (
              <p className="text-sm text-[#7c2d12] font-semibold mb-2">{renderInline(relatedHonor)}</p>
            ) : null}
            {renderDescription()}
            {introFactLines.length ? (
              <div className="space-y-1 mt-3">
                {introFactLines.map((line, idx) => (
                  <p key={idx} className="text-sm text-gray-700 leading-relaxed">
                    {renderInline(line)}
                  </p>
                ))}
              </div>
            ) : null}
            {introMetaItems.length ? (
              <div className="mt-3 flex flex-wrap gap-2">
                {introMetaItems.map((item, idx) => (
                  <span key={idx} className="inline-flex items-center gap-1 rounded-full bg-white/80 px-3 py-1 text-xs text-gray-700 border border-[#c8b496]/40">
                    <span className="font-bold text-[#7c2d12]">{item.label}</span>
                    <span>{renderInline(item.value)}</span>
                  </span>
                ))}
              </div>
            ) : null}
            {birthplaceMeta.candidates.length ? (
              <div className="mt-2 text-xs text-amber-800">
                <span className="font-bold">籍贯存疑：</span>
                {birthplaceMeta.candidates.slice(0, 4).map((t, i) => (
                  <span key={i}>{i ? '、' : ''}{t}</span>
                ))}
              </div>
            ) : null}
            {teachingHighlights.length ? (
              <div className="mt-3 pt-3 border-t border-[#c8b496]/35">
                <p className="text-sm font-bold text-[#7c2d12] mb-1">学习要点</p>
                <ul className="space-y-1.5">
                  {teachingHighlights.slice(0, 3).map((item, idx) => (
                    <li key={idx} className="text-sm text-gray-700 leading-relaxed">
                      <span className="mr-1 text-[#c0392b]">-</span>
                      {renderInline(item)}
                    </li>
                  ))}
                </ul>
              </div>
            ) : null}
          </div>
        </div>
      </header>
      <div className="space-y-6">
        <div ref={splitRef} className="flex flex-col lg:flex-row gap-6 items-stretch">
          <div
            className="glass-panel rounded-xl overflow-hidden flex flex-col h-[620px]"
            style={{ flexBasis: `${splitPct}%`, flexGrow: 0 }}
          >
            <div className="p-4 bg-[#c0392b] text-white font-bold flex items-center justify-between">
              <span>足迹时间轴</span>
              <div className="flex items-center gap-2 text-xs">
                <button
                  onClick={() => changeEvent(activeIndex - 1)}

                <span className="opacity-80">{totalEvents ? activeIndex + 1 : 0} / {totalEvents}</span>

                    <div className="flex justify-between items-start mb-2">
                      <div className="min-w-0">

                          <span className="font-bold text-sm truncate">{loc.name}</span>
                          {loc.type === 'birth' ? (

                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">
                        {loc.time || '未知'}

                        <span className="text-gray-700">{loc.duration || '未知'}</span>

                    </div>
                    <p className="text-xs text-gray-500">{renderInline(loc.event)}</p>

          </div>
          <div

          <div className="relative flex-1">
            <div id="map"></div>
            {selectedLoc && (
              <div className="absolute top-4 left-4 z-[1000] w-72 glass-panel p-4 rounded-xl shadow-xl border-t-4 border-[#c0392b]">
                <button

                <div className="space-y-3 text-sm">

                    <p className="text-gray-400 text-[10px] uppercase font-bold">停留时间</p>
                    <p>{selectedLoc.duration || '未知'}</p>

                  <div>
                    <p className="text-gray-400 text-[10px] uppercase font-bold">事迹描述</p>
                    <div className="leading-relaxed">{renderMdBlock(selectedLoc.event) || renderInline(selectedLoc.event)}</div>
                  </div>
                  {selectedLoc.poster?.png ? (

                  ) : null}
                  <div className="bg-[#fdf6e3] p-2 rounded border border-dashed border-[#c8b496]">
                    <p className="text-[#c0392b] text-[10px] uppercase font-bold">历史意义</p>
                    <div className="italic text-xs">{renderMdBlock(selectedLoc.significance) || renderInline(selectedLoc.significance)}</div>
                  </div>
                  {selectedLoc.quoteLines?.length ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>
                      <ul className="space-y-1">
                        {selectedLoc.quoteLines.map((q, idx) => (

                  ) : selectedLoc.works?.length ? (

                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>

                    </div>
                  ) : null}
                </div>
              </div>
            )}
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">🗺️</p>
            <p className="text-xl font-bold">{stats.distance} <span className="text-xs font-normal">km</span></p>
            <p className="text-[10px] text-gray-400 uppercase">总行程估算</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">⏱️</p>
            <p className="text-xl font-bold">
              {stats.yearsLabel}{stats.yearsValue === null ? null : <span className="text-xs font-normal">年</span>}
            </p>
            <p className="text-[10px] text-gray-400 uppercase">生命跨度</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">📍</p>
            <p className="text-xl font-bold">{stats.regions} <span className="text-xs font-normal">个</span></p>
            <p className="text-[10px] text-gray-400 uppercase">覆盖地区</p>
          </div>
          <div className="glass-panel p-4 rounded-xl text-center">
            <p className="text-2xl mb-1">🌟</p>
            <p className="text-xl font-bold">{stats.events} <span className="text-xs font-normal">件</span></p>
            <p className="text-[10px] text-gray-400 uppercase">重要事迹</p>
          </div>
        </div>

        <section ref={chatSectionRef} className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-white/70">
          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</h2>
              <p className="text-[11px] text-gray-500 mt-1">进入足迹内容后，以第一人称与人物对话（依据史实）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="text-[11px] px-3 py-1 rounded bg-[#c0392b] text-white hover:bg-[#a93226]"
              >
                {chatOpen ? '收起' : '开始对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[#c8b496]/40 rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[#c0392b] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = String(m.content || '').trim();
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 bg-white text-gray-700">
                        正在回应…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>

    <script>
      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();

          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
