{"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《邓稼先》**（杨振宁著，选入人教版初中语文教材）\n- 核心要点：\n    - **主题思想**：通过对比和细节描写，展现邓稼先**忠厚平实**、**无私奉献**的崇高品格，以及他作为**“两弹”元勋**的历史功绩。\n    - **人物形象**：重点刻画了邓稼先**真诚坦白**、**从不骄人**、**没有小心眼**的“纯”的性格，以及**身先士卒**、**不怕牺牲**的担当精神。\n    - **写作手法**：运用**小标题**结构，从不同侧面组织材料；采用**对比手法**（如与奥本海默对比）突出人物特质；语言**平实而饱含深情**。\n    - **情感线索**：贯穿全文的是作者对挚友的**深切怀念**、**无比敬佩**以及对其英年早逝的**沉痛惋惜**之情。\n    - **重点**：文章通过“邓稼先与奥本海默”这一节，深刻阐释了**中国文化**与**中国知识分子**的独特品格——**忠厚平实**、**无私奉献**，这正是邓稼先成功领导中国核事业的文化根基。\n    - **重点**：文中引用的**“鞠躬尽瘁，死而后已”**（出自《后出师表》），高度概括了邓稼先为国防事业奋斗终生、耗尽心血的一生，是其精神的最凝练写照。\n    - **重点**：**“民族感情？友情？”** 这一节，通过杨振宁收到的短信和邓稼先的答复，侧面反映了中国原子弹工程**完全由中国人自主设计**这一事实，突出了邓稼先及其团队的**独立自主**、**自力更生**精神。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **“两弹一星”工程**：邓稼先是**中国第一颗原子弹**和**第一颗氢弹**理论设计的主要负责人和领导者。\n    - **隐姓埋名**：为了国家核武器事业，他**隐姓埋名28年**，连家人都不知其具体工作内容。\n    - **九院工作**：长期担任**第二机械工业部第九研究院（中国工程物理研究院）** 的领导职务，是核武器研制的**理论核心**。\n    - **重点**：**1964年10月16日**，中国第一颗原子弹在**罗布泊**爆炸成功；**1967年6月17日**，中国第一颗氢弹爆炸成功。邓稼先是这两次里程碑事件背后的**关键理论奠基人**。\n    - **重点**：他领导的理论部用**“九次计算”** 等方式，独立攻克了原子弹和氢弹的**关键物理原理与设计**，证明了中国人依靠自己的智慧也能攀登科技高峰。\n- 核心要点：\n    - **时代背景**：新中国成立初期面临严峻的**国际核威胁**与**技术封锁**，发展核武器是保障国家安全、提升国际地位的**战略抉择**。\n    - **科学家精神**：邓稼先体现了**热爱祖国**、**无私奉献**、**自力更生**、**艰苦奋斗**、**大力协同**、**勇于登攀**的“两弹一星”精神。\n    - **历史评价**：他是中国知识分子的**杰出代表**，将个人才华与国家命运紧密结合，实现了**科学报国**的最高理想。\n    - **重点**：邓稼先的选择与成就，深刻反映了**新中国第一代科学家**在**国家利益**与**个人前途**发生冲突时，义无反顾选择前者的**崇高爱国主义情怀**。\n    - **重点**：他的工作使中国在**尖端国防科技**领域取得了历史性突破，打破了超级大国的核垄断，极大地提升了中国的**国际地位**和**民族自信心**。\n    - **重点**：邓稼先被誉为**“两弹元勋”**，这一称号不仅是对其科技贡献的肯定，更是对其**人格力量**和**奉献精神**的最高褒奖。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《邓稼先》**（杨振宁著，选入人教版初中语文教材）\n- 核心要点：\n    - **主题思想**：通过对比和细节描写，展现邓稼先**忠厚平实**、**无私奉献**的崇高品格，以及他作为**“两弹”元勋**的历史功绩。\n    - **人物形象**：重点刻画了邓稼先**真诚坦白**、**从不骄人**、**没有小心眼**的“纯”的性格，以及**身先士卒**、**不怕牺牲**的担当精神。\n    - **写作手法**：运用**小标题**结构，从不同侧面组织材料；采用**对比手法**（如与奥本海默对比）突出人物特质；语言**平实而饱含深情**。 86年，共62年。\n- 📍 **地理范围**：中国（安徽、北京、云南、青海、四川、新疆等）、美国（印第安纳州）。\n- 🌟 **重要节点数量**：11个\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：安徽省怀宁县\n- **时间**：1924年\n- **停留时间**：童年时期（约5年）\n- **地点**：安徽省怀宁县（今安徽省安庆市怀宁县）\n- **事件**：出生于书香世家，父亲邓以蛰是著名美学家和教育家。\n- **意义**：良好的家庭环境为其奠定了深厚的传统文化基础和爱国情怀。\n\n### 📍 重要地点：北平（北京）\n- **时间**：1929年 - 1937年\n- **停留时间**：约8年\n- **地点**：北平（今北京市）\n- **事件**：随父迁居北平，就读于崇德中学、志成中学。目睹日军暴行，埋下科学救国的种子。\n- **意义**：接受了现代科学启蒙，确立了“为国家强盛而学习”的志向。\n- **名篇名句**：《邓稼先》（杨振宁）：“从‘任人宰割’到‘站起来了’。”\n\n### 📍 重要地点：昆明（西南联合大学）\n- **时间**：1941年 - 1945年\n- **停留时间**：4年\n- **地点**：云南省昆明市\n- **事件**：考入西南联合大学物理系，师从吴有训、叶企孙、王竹溪等名家，与杨振宁结为终身挚友。\n- **意义**：在战火纷飞中接受了中国最顶尖的物理学教育，锤炼了坚韧不拔的意志。\n- **名篇名句**：《邓稼先》（杨振宁）：“邓稼先则是一个最不要引人注目的人物。和他谈话几分钟就看出他是忠厚平实的人。”\n\n### 📍 重要地点：美国普渡大学\n- **时间**：1948年 - 1950年\n- **停留时间**：约2年\n- **地点**：美国印第安纳州西拉法叶市\n- **事件**：赴美留学，以《氘核的光致蜕变》论文获得物理学博士学位。\n- **意义**：展现了卓越的科研才华，为日后领导核武器理论研究奠定了坚实基础。\n\n### 📍 重要地点：中国科学院近代物理研究所（北京）\n- **时间**：1950年 - 1958年\n- **停留时间**：8年\n- **地点**：北京市\n- **事件**：回国后在此工作，从事原子核理论研究，参与筹建中国科学院近代物理研究所。\n- **意义**：从纯粹的学术研究转向国家急需的核物理应用研究，成为事业的重要转折点。\n\n### 📍 重要地点：第二机械工业部第九研究院（理论部）\n- **时间**：1958年 - 1969年\n- **停留时间**：11年（前期主要在北京）\n- **地点**：北京市（初期）\n- **事件**：奉命担任原子弹理论设计的总负责人，组建并领导理论部，开始长达28年的隐姓埋名生涯。\n- **意义**：开启了中国核武器研制的征程，成为“两弹”事业的理论核心。\n\n### 📍 重要地点：青海221核武器研制基地\n- **时间**：1963年 - 1969年（间断性驻扎）\n- **停留时间**：累计数年\n- **地点**：青海省海晏县金银滩（今青海省海北藏族自治州海晏县）\n- **事件**：带领理论部主要科研力量迁往青海基地，在高寒缺氧的环境中进行原子弹的最终理论设计和实验验证。\n- **意义**：完成了原子弹的“九次计算”，为1964年原子弹成功爆炸提供了关键理论支持。\n\n### 📍 重要地点：新疆罗布泊核试验场\n- **时间**：1964年10月16日\n- **停留时间**：短期\n- **地点**：新疆维吾尔自治区巴音郭楞蒙古自治州若羌县罗布泊（今已干涸）\n- **事件**：亲临现场，参与指挥中国第一颗原子弹（代号“596”）的塔爆试验，并获得关键数据。\n- **意义**：见证了中国成为有核国家的历史性时刻，其理论设计得到实践检验。\n\n### 📍 重要地点：新疆罗布泊核试验场（氢弹试验）\n- **时间**：1967年6月17日\n- **停留时间**：短期\n- **地点**：新疆维吾尔自治区罗布泊核试验场\n- **事件**：参与领导并见证中国第一颗氢弹空爆试验成功。\n- **意义**：标志着中国核武器技术实现又一次重大飞跃。\n\n### 📍 重要地点：四川梓潼（九院内迁地）\n- **时间**：1969年 - 1980年代中期\n- **停留时间**：约15年\n- **地点**：四川省梓潼县（今四川省绵阳市梓潼县）\n- **事件**：因战备需要，九院内迁至四川深山。邓稼先在此继续领导氢弹原理突破及后续核武器的小型化、实战化研究。\n- **意义**：在极其艰苦的“三线”环境下，完成了氢弹研制和核武器技术的持续迭代。\n- **名篇名句**：《邓稼先》（杨振宁）：“鞠躬尽瘁，死而后已。”\n\n### 📍 重要地点：新疆罗布泊核试验场（地下核试验）\n- **时间**：1984年\n- **停留时间**：短期\n- **地点**：新疆维吾尔自治区罗布泊试验场\n- **事件**：抱病亲赴现场，成功指挥了中国第二代核武器（中子弹原理试验）的关键性试验。\n- **意义**：标志着中国核武器技术达到新水平，也是他最后一次亲临核试验现场。\n\n### 🔴 去世地：中国人民解放军总医院（北京）\n- **时间**：1986年7月29日\n- **停留时间**：住院治疗期间\n- **地点**：北京市海淀区\n- **事件**：因直肠癌医治无效逝世。临终前仍关心中国核武器发展事业。\n- **意义**：他的逝世是中国国防科技事业的重大损失，其无私奉献的科学家精神成为民族丰碑。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1924 | 0 | 出生于安徽省怀宁县。 |\n| 1929 | 5 | 随父迁居北平（今北京）。 |\n| 1941 | 17 | 考入昆明西南联合大学物理系。 |\n| 1948 | 24 | 赴美国普渡大学物理系留学。 |\n| 1950 | 26 | 获物理学博士学位，旋即回国。 |\n| 1950-1958 | 26-34 | 在中国科学院近代物理研究所从事原子核理论研究。 |\n| 1958 | 34 | 奉命秘密领导中国原子弹理论设计，隐姓埋名生涯开始。 |\n| 1963 | 39 | 带领理论部迁往青海221基地。 |\n| 1964 | 40 | 参与领导并见证中国第一颗原子弹爆炸成功。 |\n| 1967 | 43 | 参与领导并见证中国第一颗氢弹空爆试验成功。 |\n| 1971 | 47 | 因杨振宁回国探访，其贡献始为外界所知。 |\n| 1984 | 60 | 抱病指挥新一代核武器（中子弹原理）试验成功。 |\n| 1986 | 62 | 获“全国劳动模范”称号。因癌症在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《邓稼先》**（杨振宁著，选入人教版初中语文教材）\n- 核心要点：\n    - **主题思想**：通过对比和细节描写，展现邓稼先**忠厚平实**、**无私奉献**的崇高品格，以及他作为**“两弹”元勋**的历史功绩。\n    - **人物形象**：重点刻画了邓稼先**真诚坦白**、**从不骄人**、**没有小心眼**的“纯”的性格，以及**身先士卒**、**不怕牺牲**的担当精神。\n    - **写作手法**：运用**小标题**结构，从不同侧面组织材料；采用**对比手法**（如与奥本海默对比）突出人物特质；语言**平实而饱含深情**。\n    - **情感线索**：贯穿全文的是作者对挚友的**深切怀念**、**无比敬佩**以及对其英年早逝的**沉痛惋惜**之情。\n    - **重点**：文章通过“邓稼先与奥本海默”这一节，深刻阐释了**中国文化**与**中国知识分子**的独特品格——**忠厚平实**、**无私奉献**，这正是邓稼先成功领导中国核事业的文化根基。\n    - **重点**：文中引用的**“鞠躬尽瘁，死而后已”**（出自《后出师表》），高度概括了邓稼先为国防事业奋斗终生、耗尽心血的一生，是其精神的最凝练写照。\n    - **重点**：**“民族感情？友情？”** 这一节，通过杨振宁收到的短信和邓稼先的答复，侧面反映了中国原子弹工程**完全由中国人自主设计**这一事实，突出了邓稼先及其团队的**独立自主**、**自力更生**精神。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **“两弹一星”工程**：邓稼先是**中国第一颗原子弹**和**第一颗氢弹**理论设计的主要负责人和领导者。\n    - **隐姓埋名**：为了国家核武器事业，他**隐姓埋名28年**，连家人都不知其具体工作内容。\n    - **九院工作**：长期担任**第二机械工业部第九研究院（中国工程物理研究院）** 的领导职务，是核武器研制的**理论核心**。\n    - **重点**：**1964年10月16日**，中国第一颗原子弹在**罗布泊**爆炸成功；**1967年6月17日**，中国第一颗氢弹爆炸成功。邓稼先是这两次里程碑事件背后的**关键理论奠基人**。\n    - **重点**：他领导的理论部用**“九次计算”** 等方式，独立攻克了原子弹和氢弹的**关键物理原理与设计**，证明了中国人依 const extractTeachingHighlights = (raw, maxItems) => {

    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};

root.render(<App />);
