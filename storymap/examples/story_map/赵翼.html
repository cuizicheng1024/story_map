初中阶段\n1.  **身份**：清代著名**史学家**、**诗人**。\n2.  **代表作**：史学著作**《廿二史札记》**。\n3.  **名句**：“**江山代有才人出，各领风骚数百年**”（出自《论诗》）。\n4.  **核心思想**：主张**文学创作要创新，反对盲目崇古**。\n5.  **并称**：与袁枚、蒋士铨合称“**乾隆三大家**”（诗歌方面）。\n6.  **时代**：活跃于**清朝乾隆、嘉庆时期**。\n\n### 高中阶段\n1.  **史学地位**：乾嘉史学代表人物之一，与**钱大昕**、**王鸣盛**并称。\n2.  **史学方法**：在《廿二史札记》中运用**归纳法**和**比较法**研究历史，注重对一代史事、制度的综合考论。\n3.  **史学著作价值**：《廿二史札记》不仅是考史著作，也包含了大量**史学评论**和**历史见识**。\n4.  **诗学理论**：著有**《瓯北诗话》**，系统评论古代诗人，其诗论强调**创新、重“才气”与“性灵”**，但也不废学问。\n5.  **生平关键点**：曾任**广西镇安知府**、**广州知府**等职，后辞官归里著述。\n6.  **易考点对比**：\n    - **赵翼 vs 钱大昕**：赵重**史事综合**，钱重**文字考订**。\n    - **赵翼 vs 袁枚**：同倡“性灵”，赵更重**学问根基**。\n7.  **作品辨析**：区分**《廿二史札记》**（史学）、**《陔余丛考》**（杂考）、**《瓯北诗话》**（诗论）、**《瓯北诗集》**（诗歌）的不同性质。", "markdown": "# 赵翼\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：赵翼（字云崧，一字耘崧，号瓯北，又号裘萼，晚号三半老人）\n- **时代**：清代（乾隆、嘉庆年间）\n- **出生**：清雍正五年（1727年）十月二十二日，江苏阳湖（今江苏省常州市）\n- **去世**：清嘉庆十九年（1814年）四月十七日，江苏阳湖（今江苏省常州市）\n- **享年**：88岁（虚岁）\n- **主要身份**：史学家、文学家、诗人、官员\n- **历史地位**：清代乾嘉时期著名的史学三大家之一（与钱大昕、王鸣盛齐名），其史学著作与诗歌创作、诗论在清代学术与文学史上均占有重要地位。\n- **主要成就**：著《廿二史札记》，开创史学“归纳考证”新方法；诗作与袁枚、蒋士铨并称“乾隆三大家”；提出“江山代有才人出，各领风骚数百年”的文学发展观。乾隆二十六年（1761年）考中探花（一甲第三名）。\n\n### 生平概述\n赵翼生于清雍正五年，历经雍正、乾隆、嘉庆三朝，是清代“乾嘉盛世”的亲历者与见证者。他出身贫寒，但自幼聪颖好学，以科举入仕，曾任内阁中书、方略馆纂修官，并外放广西镇安府、广东广州府知府等职。中年后因遭弹劾而辞官归里，主讲安定书院，潜心著述。其一生在史学、文学两方面成就卓著，尤以《廿二史札记》享誉后世，该书以归纳比较之法考论历代正史，见解精辟，影响深远。其诗歌创作宏富，诗论主张创新，反对拟古，是清代中期文坛的代表人物之一。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于江苏、北京、广西、贵州、广东等地，晚年归老于乡。\n- ⏱️ **时间跨度**：1727年 - 1814年，共约87年。\n- 📍 **地理范围**：华东（江苏）、华北（北京）、华南（广西、广东）、西南（贵州）。\n- 🌟 **重要节点数量**：8个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：阳湖（今江苏常州）\n- **公元纪年**：1727年\n- **停留时间**：少年时期（约1727-1749年赴京前）\n- **位置**：江苏阳湖（今江苏省常州市）\n- **事迹**：出生于清贫书香之家，幼年丧父，由母亲抚养成人，自幼显露才华，刻苦攻读。\n- **意义**：人生起点与文化根基所在，塑造了其勤奋坚韧的品格，并深受江南学术风气熏陶。\n\n### 📍 重要地点：北京\n- **公元纪年**：1749年（约） - 1761年；1766年 - 1772年\n- **停留时间**：前后累计约十余年\n- **位置**：京师（今北京市）\n- **事迹**：以举人身份入直军机处，任内阁中书、方略馆纂修官；考中探花（1761年）；参与修纂《通鉴辑览》。\n- **意义**：科举功名成就之地，也是其早期政治生涯与学术积累的核心舞台，得以接触大量宫廷档案与典籍。\n- **名篇名句**：《论诗》：江山代有才人出，各领风骚数百年。\n\n### 📍 重要地点：广西镇安府（今广西德保 的方法论范例。\n2.  **文学发展观**：“江山代有才人出，各领风骚数百年”的论断，成为倡导创新、反对复古拟古的经典名句，深刻影响了后世的文学批评与创作观念。\n3.  **史料价值**：其著作中对历代正史编纂得失、史实真伪的考辨，以及对典章制度、社会风俗的梳理，至今仍是研究中国古代史的重要参考资料。\n\n### 历史评价\n1.  **清代学者李慈铭评**：“（《廿二史札记》）贯串全史，参互考订，不特阙文误义多所辨明，而各朝之史，皆综其要义，铨其异闻，使首尾井然，一览可悉。”\n2.  **近代史学家梁启超评**：“赵翼之《廿二史札记》，其考史之法，皆先搜集若干同类之史料，比次之，贯穿之，然后下一断案……此实为现代史学之先驱。”\n3.  **文学史评价**：与袁枚、蒋士铨齐名，其诗论主张“独创”，反对“荣古虐今”，是清代中期诗坛从格调说向性灵说转变过程中的关键人物之一。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：生活在**清朝中期（乾隆、嘉庆年间）**，社会相对稳定，学术上**乾嘉考据学**盛行。\n- **关键事件/贡献**：以历史学家身份被提及，代表作为**《廿二史札记》**，该书是学习**中国古代史**的重要参考。\n- **代表作品/思想**：诗歌**《论诗》**中的名句“**江山代有才人出，各领风骚数百年**”常被引用，用以说明**文学发展需要创新**的观点。\n- **常见易混点/对比点**：注意与同时代史学家**钱大昕**、**王鸣盛**并称“史学三大家”；其文学地位与**袁枚**、**蒋士铨**并称“乾隆三大家”。\n\n### 高中阶段\n- **时代背景**：处于**清朝文化专制与考据学兴盛并存**的时期，知识分子多埋首故纸，从事考据。\n- **关键事件/贡献**：深入理解其史学方法——**归纳考证法**，即通过排比归纳史料来考证历史问题，这与传统的单纯训诂考据有所不同。\n- **代表作品/思想**：\n    - 史学：**《廿二史札记》**（重点：其体例、方法与价值）；**《陔余丛考》**（综合性笔记）。\n    - 文学：**《瓯北诗话》**（系统评论历代诗人，尤其推崇李白、杜甫、苏轼等）；其诗歌创作体现**性灵说**倾向。\n- **常见易混点/对比点**：\n    - 史学成就对比：赵翼《札记》重**综合与史论**，钱大昕《考异》重**文字校勘与名物训诂**，王鸣盛《商榷》重**典制与史实考订**。\n    - 文学流派对比：赵翼的诗论与**袁枚**的“性灵说”相呼应，但更强调**学问根底**，与**沈德潜**的“格调说”、**翁方纲**的“肌理说”形成不同主张。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n1.  **身份**：清代著名**史学家**、**诗人**。\n2.  **代表作**：史学著作**《廿二史札记》**。\n3.  **名句**：“**江山代有才人出，各领风骚数百年**”（出自《论诗》）。\n4.  **核心思想**：主张**文学创作要创新，反对盲目崇古**。\n5.  **并称**：与袁枚、蒋士铨合称“**乾隆三大家**”（诗歌方面）。\n6.  **时代**：活跃于**清朝乾隆、嘉庆时期**。\n\n### 高中阶段\n1.  **史学地位**：乾嘉史学代表人物之一，与**钱大昕**、**王鸣盛**并称。\n2.  **史学方法**：在《廿二史札记》中运用**归纳法**和**比较法**研究历史，注重对一代史事、制度的综合考论。\n3.  **史学著作价值**：《廿二史札记》不仅是考史著作，也包含了大量**史学评论**和**历史见识**。\n4.  **诗学理论**：著有**《瓯北诗话》**，系统评论古代诗人，其诗论强调**创新、重“才气”与“性灵”**，但也不废学问。\n5.  **生平关键点**：曾任**广西镇安知府**、**广州知府**等职，后辞官归里著述。\n6.  **易考点对比**：\n    - **赵翼 vs 钱大昕**：赵重**史事综合**，钱重**文字考订**。\n    - **赵翼 vs 袁枚**：同倡“性灵”，赵更重**学问根基**。\n7.  **作品辨析**：区分**《廿二史札记》**（史学）、**《陔余丛考》**（杂考）、**《瓯北诗话》**（诗论）、**《瓯北诗集》**（诗歌）的不同性质。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |"};

const extractTeachingHighlights = (raw, maxItems) => {

  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;

    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }

};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

        seen.add(t);
        out.push(t);

      return { doubtful: doubtful || out.length > 0, candidates: out };
    }
    if (!raw || !doubtful) return { doubtful: false, candidates: [] };
    const out = [];
    const seen = new Set();

            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
