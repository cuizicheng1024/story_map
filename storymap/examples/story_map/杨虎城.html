th": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：在中学语文教材中，杨虎城的事迹通常作为历史背景出现在与**西安事变**相关的课文或阅读材料中，而非以其独立文学作品形式呈现。\n- 核心要点：\n    - **重点**：杨虎城是**西安事变**的核心领导者之一，其行动体现了崇高的**爱国主义**精神。\n    - **重点**：他与张学良的**兵谏**行动，是促使蒋介石停止内战、联共抗日的关键转折点，展现了**民族大义**高于个人安危的抉择。\n    - 在历史叙述中，他被塑造为一位从旧军人转变为**抗日民族统一战线**重要推动者的典型人物。\n    - 其人生结局（被长期囚禁并杀害）常作为**革命斗争残酷性**和**爱国志士牺牲**的例证。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1936年12月12日，杨虎城与张学良发动**西安事变**（又称“双十二事变”），扣押蒋介石，提出抗日救国八项主张。\n    - **重点**：西安事变最终在中共调停下**和平解决**，成为时局转换的枢纽，标志着十年内战的基本结束和**抗日民族统一战线**的初步形成。\n    - 事变后，杨虎城被迫出国，抗战爆发后回国即遭国民党当局长达十二年的囚禁。\n    - 1949年9月6日，在重庆解放前夕被国民党特务秘密杀害。\n- 核心要点：\n    - **重点**：杨虎城是国民党内**地方实力派**中主张抗日的代表人物，其行动反映了当时全国上下要求停止内战、一致抗日的强烈呼声。\n    - **重点**：西安事变是中国近代史上的重大转折点，杨虎城作为主要发动者，其历史地位与**张学良**紧密相连，合称“张杨”。\n    - 他的个人命运与**国共关系**的演变密切相关，从合作到破裂再到其个人被囚禁，体现了复杂的政治斗争。\n    - **重点**：中华人民共和国成立后，杨虎城被追认为**革命烈士**，其爱国精神得到官方肯定和纪念。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：在中学语文教材中，杨虎城的事迹通常作为历史背景出现在与**西安事变**相关的课文或阅读材料中，而非以其独立文学作品形式呈现。\n- 核心要点：\n    - **重点**：杨虎城是**西安事变**的核心领导者之一，其行动体现了崇高的**爱国主义**精神。\n    - **重点**：他与张学良的**兵谏**行动，是促使蒋介石停止内战、联共抗日的关键转折点，展现了**民族大义**高于个人安危的抉择。\n    - 在历史叙述中，他被塑造为一位从旧军人转变为**抗日民族统一战线**重要推动者的典型人物。\n    - 其人生结局（被长期囚禁并杀害）常作为**革命斗争残酷性**和**爱国志士牺牲**的例证。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1936年12月12日，杨虎城与张学良发动**西安事变**（又称“双十二事变”），扣押蒋介石，提出抗日救国八项主张。\n    - **重点**：西安事变最终在中共调停下**和平解决**，成为时局转换的枢纽，标志着十年内战的基本结束和**抗日民族统一战线**的初步形成。\n    - 事变后，杨虎城被迫出国，抗战爆发后回国即遭国民党当局长达十二年的囚禁。\n    - 1949年9月6日，在重庆解放前夕被国民党特务秘密杀害。\n- 核心要点：\n    - **重点**：杨虎城是国民党内**地方实力派**中主张抗日的代表人物，其行动反映了当时全国上下要求停止内战、一致抗日的强烈呼声。\n    - **重点**：西安事变是中国近代史上的重大转折点，杨虎城作为主要发动者，其历史地位与**张学良**紧密相连，合称“张杨”。\n    - 他的个人命运与**国共关系**的演变密切相关，从合作到破裂再到其个人被囚禁，体现了复杂的政治斗争。\n    - **重点**：中华人民共和国成立后，杨虎城被追认为**革命烈士**，其爱国精神得到官方肯定和纪念。\n\n---", "markdown": "# 杨虎城\n\n## 人物档案\n\n### 基本信息\n- **姓名**：杨虎城\n- **时代**：中国近代（清末至民国）\n- **出生**：公元1893年11月26日，陕西省蒲城县（今陕西省渭南市蒲城县）\n- **去世**：公元1949年9月6日，四川省重庆（今重庆市）\n- **享年**：55周岁\n- **主要身份**：爱国将领、国民党陆军二级上将、西安事变主要发动者之一\n- **历史地位**：中国近代史上著名的爱国将领，因与张学良联合发动“西安事变”促成抗日民族统一战线而名垂青史。\n- **主要成就**：\n    - 参与领导反清革命与护国战争。\n    - 在军阀混战中崛起，主政陕西。\n    - 与张学良共同发动“西安事变”，兵谏蒋介石，成为时局转换的枢纽。\n    - 坚持抗日救国立场，为民族解放事业献出生命。\n\n### 生平概述\n杨虎城出身贫寒，早年投身反清革命，历经护国战争、靖国军等斗争，逐步成为陕西地方实力派将领。他拥护孙中山的三大政策，参与北伐。1930年主政陕西，期间倾向进步，与共产党有所接触。面对日本侵略的加剧，他主张抗日。1936年12月12日，他与张学良毅然发动“西安事变”，扣押蒋介石，提出抗日救国八项主张。事变和平解决后，他被迫出国“考察”。抗战爆发后回国即遭长期囚禁，1949年新中国成立前夕，在重庆被国民党特务秘密杀害。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从陕西关中起家，足迹遍及北方多省，最终于重庆遇害。\n- ⏱️ **时间跨度**：约1893年至1949年，约56年。\n- 📍 **地理范围**：主要活动于陕西、河南、江西、湖南、重庆等地，曾途经或活动于安徽、江苏、浙江。\n- 🌟 **重要节点数量**：核心地点11个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：蒲城\n- **时间**：公元1893年\n- **停留时间**：童年及少年时期\n- **地点**：陕西省蒲城县（今陕西省渭南市蒲城县）\n- **事件**：出生于贫苦农民家庭，父亲杨怀福以木工为业。早年丧父，生活艰辛。\n- **意义**：塑造了他坚韧不屈、同情底层的品格，为其日后反抗压迫的生涯埋下伏笔。\n\n### 📍 重要地点：西安\n- **时间**：公元1911年-1917年（多次往返）\n- **停留时间**：断断续续\n- **地点**：长安（今陕西省西安市）\n- **事件**：辛亥革命时参加陕西民军。后在此参与反袁世凯的斗争，加入陕西护国军。\n- **意义**：是他早期军事政治活动的中心舞台，结识了于右任等革命党人，坚定了革命信念。\n\n### 📍 重要地点：武功、扶风\n- **时间**：公元1917年-1922年\n- **停留时间**：约5年\n- **地点**：陕西省武功县、扶风县（今陕西省咸阳市武功县、扶风县）\n- **事件**：作为陕西靖国军的部将，在关中西部坚持护法斗争，与北洋军阀部队周旋作战。\n- **意义**：在极端困难的环境下保存了革命火种，锻炼了部队，赢得了“坚守关中”的声誉。\n\n### 📍 重要地点：陕北（榆林）\n- **时间**：公元1922年-1924年\n- **停留时间**：约2年\n- **地点**：榆林（今陕西省榆林市）\n- **事件**：靖国军失败后，率部退往陕北，依托井岳秀部休整，并接触共产党人魏野畴等，部队后加入国民军。\n- **意义**：部队得以喘息和整训，思想上受到进步影响，为日后与共产党合作奠定基础。\n\n### 📍 重要地点：河南（归德、郑州）\n- **时间**：公元1927年-1929年\n- **停留时间**：约2年\n- **地点**：归德（今河南省商丘市）、郑州（今河南省郑州市）\n- **事件**：率部参加冯玉祥的国民联军，东出潼关，参与北伐，在豫东与奉系军阀作战。\n- **意义**：部队正式编入国民革命军序列，其军事生涯从地方武装转向参与全国性政治军事斗争。\n\n### 📍 重要地点：山东（临沂）\n- **时间**：公元1929年\n- **停留时间**：数月\n- **地点**：临沂（今山东省临沂市）\n- **事件**：所部被蒋介石改编为新编第十四师，调往山东驻防。\n- **意义**：标志着其部队被纳入蒋介石中央军系统，但双方关系充满猜忌与利用。\n\n### 📍 重要地点：南阳、驻马店\n- **时间**：公元1929年-1930年\n- **停留时间**：近一年\n- **地点**：南阳（今河南省南阳市）、驻马店（今河南省驻马店市）\n- **事件**：在蒋冯战争中倒冯投蒋，后又在蒋唐战争中为蒋作战，部队扩编为第十七路军。\n- **意义**：在军阀混战中实力迅速壮大，最终在中原大战后取得陕西军政大权。\n\n### 📍 重要地点：西安（主政时期）\n- **时间**：公元1930年-1937年（主要在1930-1933年实际主政）\n- **停留时间**：约7年（含出国前后）\n- **地点**：长安（今陕西省西安市）\n- **事件**：任陕西省政府主席、西安绥靖公署主任。兴办实业、发展教育、修筑铁路。1936年12月12日，与张学良发动“西安事变”。\n- **意义**：其政治生涯的顶点。西安事变成为扭转中国时局的关键，直接促成了第二次国共合作和全面抗战的开始。\n- **名篇名句**：《杨虎城在西安事变中的讲话》：“我们救国的主张……是绝对不变更的。”\n\n### 📍 重要地点：南昌、长沙\n- **时间**：公元1937年\n- **停留时间**：短暂\n- **地点**：南昌（今江西省南昌市）、长沙（今湖南省长沙市）\n- **事件**：出国“考察”回国后，先后被安排至南昌、长沙，实则被军统监视，行动开始受限。\n- **意义**：标志着其失去自由，软禁生涯的开始。\n\n### 🔴 去世地：重庆（戴公馆、松林坡）\n- **时间**：公元1937年-1949年（被囚禁），1949年9月6日遇害\n- **停留时间**：被囚禁约12年\n- **地点**：四川省重庆（今重庆市）戴公馆、松林坡\n- **事件**：先后被囚禁于江西、湖南、贵州、重庆等地。1949年9月6日，在重庆解放前夕，被蒋介石下令特务杀害于重庆松林坡“戴公祠”。\n- **意义**：为民族团结和抗日救国事业献出了生命，成为著名的爱国烈士。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n|---|---|---|\n| 1893 | 0 | 出生于陕西蒲城。 |\n| 1908 | 15 | 父亲被清政府绞杀，立志反清。 |\n| 1911 | 18 | 参加辛亥革命陕西民军。 |\n| 1915 | 22 | 参加护国战争，讨伐袁世凯。 |\n| 1917 | 24 | 参加陕西靖国军，反对北洋军阀。 |\n| 1924 | 31 | 在陕北结识共产党人，部队加入国民军。 |\n| 1927 | 34 | 参加冯玉祥国民联军，东出潼关参与北伐。 |\n| 1929 | 36 | 部队被蒋介石改编，调往山东、河南。 |\n| 1930 | 37 | 中原大战后入主陕西，任省政府主席。 |\n| 1933 | 40 | 主张抗日，与共产党方面有所接触。 |\n| 1936 | 43 | 12月12日，与张学良发动“西安事变”。 |\n| 1937 | 44 | 被迫出国“考察”；抗战爆发后回国，旋即被囚禁。 |\n| 1949 | 55 | 9月6日，在重庆被国民党特务秘密杀害。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：在中学语文教材中，杨虎城的事迹通常作为历史背景出现在与**西安事变**相关的课文或阅读材料中，而非以其独立文学作品形式呈现。\n- 核心要点：\n    - **重点**：杨虎城是**西安事变**的核心领导者之一，其行动体现了崇高的**爱国主义**精神。\n    - **重点**：他与张学良的**兵谏**行动，是促使蒋介石停止内战、联共抗日的关键转折点，展现了**民族大义**高于个人安危的抉择。\n    - 在历史叙述中，他被塑造为一位从旧军人转变为**抗日民族统一战线**重要推动者的典型人物。\n    - 其人生结局（被长期囚禁并杀害）常作为**革命斗争残酷性**和**爱国志士牺牲**的例证。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1936年12月12日，杨虎城与张学良发动**西安事变**（又称“双十二事变”），扣押蒋介石，提出抗日救国八项主张。\n    - **重点**：西安事变最终在中共调停下**和平解决**，成为时局转换的枢纽，标志着十年内战的基本结束和**抗日民族统一战线**的初步形成。\n    - 事变后，杨虎城被迫出国，抗战爆发后回国即遭国民党当局长达十二年的囚禁。\n    - 1949年9月6日，在重庆解放前夕被国民党特务秘密杀害。\n- 核心要点：\n    - **重点**：杨虎城是国民党内**地方实力派**中主张抗日的代表人物，其行动反映了当时全国上下要求停止内战、一致抗日的强烈呼声。\n    - **重点**：西安事变是中国近代史上的重大转折点，杨虎城作为主要发动者，其历史地位与**张学良**紧密相连，合称“张杨”。\n    - 他的个人命运与**国共关系**的演变密切相关，从合作到破裂再到其个人被囚禁，体现了复杂的政治斗争。\n    - **重点**：中华人民共和国成立后，杨虎城被追认为**革命烈士**，其爱国精神得到官方肯定和纪念。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 陕西省渭南市蒲城县 | 34.9551 | 109.5865 |\n| 陕西省西安市 | 34.3416 const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
