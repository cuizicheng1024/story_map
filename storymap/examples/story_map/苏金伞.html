中阶段\n- **时代背景**：**中国现当代文学史**脉络中的重要诗人，跨越现、当代两个时期。\n- **关键贡献**：**中原诗风**的代表性构建者；其创作生涯体现了**知识分子**在时代变迁中的坚守与曲折。\n- **代表作品/思想**：晚期代表作**《鹁鸪鸟》**、**《埋葬了的爱情》**，展现历经沧桑后的**凝练**与**深邃**；诗歌理论强调“诗要从**生活**的土壤中生长出来”。\n- **常见易混点/对比点**：在文学史归类上，不同于**“九叶派”** 的现代主义倾向，也区别于**“政治抒情诗”** 的激昂，其风格是**个人化**的**现实主义**乡土书写；可与**艾青**的“土地”意象进行对比阅读。\n\n---", "examPoints": "### 初中阶段考点\n- 苏金伞是中国现代著名**诗人**，河南籍。\n- 他的诗歌主要描写**农村生活**和**农民命运**，风格**朴素、深沉**。\n- 了解其抗战时期在**重庆**的文学活动。\n- 知道其代表诗集有**《地层下》**。\n- （存疑/说法不一）其具体作品是否入选某些地方版本初中教材。\n\n### 高中阶段考点\n- 苏金伞在**中国现当代文学史**上的地位：**中原乡土诗**的代表人物。\n- 其创作历程贯穿**抗战**、**新中国成立**、**改革开放**等重大历史时期。\n- 分析其诗歌（如《鹁鸪鸟》中**土地意象**与**朴素语言**中所蕴含的深沉情感。\n- 理解其人生轨迹（如1957年遭遇）与**时代背景**的关系。\n- （存疑/说法不一）将其与**臧克家**、**艾青**等诗人的乡土诗进行异同比较，是常见的分析角度。", "markdown": "# 苏金伞\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：苏金伞（原名苏鹤田，字筠仙）\n- **时代**：现当代\n- **出生**：1906年，河南省睢县周营村（今河南省商丘市睢县周营村）\n- **去世**：1997年1月24日，河南省郑州市\n- **享年**：91岁\n- **主要身份**：诗人、作家\n- **历史地位**：中国现当代著名诗人，中原诗坛的代表性人物，以质朴深沉的乡土诗风闻名。\n- **主要成就**：开创并坚守河南乡土诗风；推动中国新诗发展；作品被译介至海外；长期担任文学组织工作，培养青年作家。\n\n### 生平概述\n苏金伞生于清末，成长于中原大地，其一生贯穿了中国现当代的剧烈变革。他自幼接触古典文学，青年时期在开封求学并开始新诗创作，作品多描绘农村生活与农民命运，语言朴素而情感深沉。抗战期间辗转于北平（今北京）、河南、湖北、四川等地，以笔为枪，宣传抗日。新中国成立后，他定居郑州，主持河南省文联工作，继续诗歌创作，其诗风愈发凝练厚重，被誉为“中原诗坛的一面旗帜”。他的一生笔耕不辍，其创作深深植根于中国乡土，记录了时代的变迁与人民的悲欢。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于中原（河南）、华北（北京）、西南（重庆）及西北（西安）地区。\n- ⏱️ **时间跨度**：1906年—1997年，共计约91年。\n- 📍 **地理范围**：以河南省为核心，辐射至北京、重庆、西安。\n- 🌟 **重要节点数量**：7个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：睢县周营村\n- **公元纪年**：1906年—1924年\n- **停留时间**：童年及少年时期，约18年\n- **位置**：清归德府睢州周营村（今河南省商丘市睢县周营村）\n- **事迹**：在此度过童年与少年，接受私塾启蒙教育，接触民间歌谣与古典诗词，培养了最初的文学兴趣。\n- **意义**：乡土生活的滋养成为其日后诗歌创作的永恒底色与灵感源泉。\n\n### 📍 重要地点：开封\n- **公元纪年**：1924年—1938年\n- **停留时间**：求学及早期工作时期，约14年\n- **位置**：古称汴梁、汴京（今河南省开封市）\n- **事迹**：考入河南省立第一师范学校；开始新诗创作，于《河南民报》发表第一首诗；毕业后任教于开封多所学校；参与进步文艺活动。\n- **意义**：文学创作的起点与思想成型的关键期，从古典转向新文学，确立了以诗反映现实的志向。\n- **名篇名句**：《拟拟曲》：“在抽搐的脸上，/找不出一丝笑纹。”\n\n### 📍 重要地点：北京（北平）\n- **公元纪年**：1938年—1940年\n- **停留时间**：约2年\n- **位置**：古称燕京、北平（今北京市）\n- **事迹**：抗战爆发后北上，参与抗日救亡戏剧活动；与文艺界人士交流，诗风受时代氛围影响更趋沉郁。\n- **意义**：在文化中心开阔了视野，其创作与民族命运更紧密地结合。\n- **名篇名句**：《地层下》：“冰雪/使大地沉默。”\n\n### 📍 重要地点：重庆\n- **公元纪年**：1940年—1945年\n- **停留时间**：约5年\n- **位置**：古称渝州（今重庆市）\n- **事迹**：抗战期间流寓重庆；担任《大刚报》副刊编辑；创作了大量反映战时生活与民族苦难的诗篇；参与“文协”活动。\n- **意义**：在抗战大后方坚持创作，其作品成为记录时代苦难与民族精神的重要文本。\n- **名篇名句**：《睡眠》：“在土里睡眠，/多么安静，/多么甜蜜。”\n\n### 📍 重要地点：西安\n- **公元纪年**：1945年—1948年\n- **停留时间**：约3年\n- **位置**：古称长安（今陕西省西安市）\n- **事迹**：任教于陕西师范专科学校；继续诗歌创作与发表；作品关注社会现实与底层人民。\n- **意义**：在西北延续其文学与教育生涯，创作保持了对现实的高度关注。\n- **名篇名句**：《无弦琴》：“不愿被装上琴弦，/不愿被弹出声音。”\n\n### 📍 重要地点：开封（解放后）\n- **公元纪年**：1948年—1949年\n- **停留时间**：约一年\n- **位置**：古称汴梁、汴京（今河南省开封市）\n- **事迹**：开封解放后，参与接收河南大学等工作；担任河南省文联副主席等职务，开始参与新中国文艺组织工作。\n- **意义**：人生轨迹与政治时代同步转折，从自由撰稿人转向文艺工作的组织者与领导者。\n\n### 📍 重要地点：郑州\n- **公元纪年**：1949年—1997年\n- **停留时间**：建国后至晚年，约48年\n- **位置**：古称管城（今河南省郑州市）\n- **事迹**：长期定居郑州，主持河南省文联、作家协会工作；主编《奔流》等文学刊物；在“反右”等运动中受到冲击；晚年笔耕不辍，出版《鹁鸪鸟》《苏金伞诗选》等多部诗集。\n- **意义**：人生后半程的主要生活与创作基地，见证了其从壮年到暮年的全部文学活动与成就，是其文学地位最终确立之地。\n- **名篇名句**：《鹁鸪鸟》：“鹁鸪鸟，在远远的雨中叫着。/我肺腑中所浸透的，/也都是它的声音。”\n\n### 🔴 去世地：郑州\n- **公元纪年**：1997年1月\n- **停留时间**：晚年直至去世\n- **位置**：古称管城（今河南省郑州市）\n- **经过**：因病在郑州逝世，享年91岁。\n- **意义**：生命的终点，也是其作为“中原诗魂”文学遗产的归宿地。\n- **名篇名句**：《埋葬了的爱情》：“那时我们爱得正苦/常常一同到城外沙丘中漫步。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 1906 | 0 | 生于河南省睢县周营村。 |\n| 1924 | 18 | 考入河南省立第一师范学校（开封）。 |\n| 1926 | 20 | 在《河南民报》发表第一首新诗，开始文学生涯。 |\n| 1938 | 32 | 抗战爆发后赴北平，参与抗日救亡活动。 |\n| 1940 | 34 | 辗转至重庆，任《大刚报》副刊编辑，坚持抗战文艺创作。 |\n| 1945 | 39 | 抗战胜利后，任教于陕西师专（西安）。 |\n| 1948 | 42 | 开封解放，参与文教接收工作，任河南省文联副主席。 |\n| 1949 | 43 | 随省会迁至郑州，此后长期在此工作、生活。 |\n| 1957 | 51 | 被错划为“右派”，创作与工作受到严重影响。 |\n| 1979 | 73 | 冤案平反，恢复工作，创作进入新的高峰期。 |\n| 1997 | 91 | 1月24日，在郑州病逝。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n苏金伞是二十世纪中国诗坛坚持地域性写作的杰出代表。他的诗歌以中原农村为根基，用质朴、凝练的语言刻画农民的生存状态与精神世界，在同时代诗人中独树一帜。作为河南省文学界的重要组织者，他在培养青年作家、推动地方文学发展方面发挥了不可替代的作用，其人格与诗品深刻影响了河南乃至中原地区的文学风气。\n\n### 对后世的影响\n1.  **乡土诗传统的奠基者**：他开创的深沉、质朴、充满土地气息的诗风，成为“中原诗派”的重要源头，影响了后世众多书写乡土的诗人。\n2.  **诗歌精神的典范**：其一生历经磨难却始终忠于艺术、忠于人民的创作态度，为后世诗人树立了精神标杆。\n3.  **文学史的重要坐标**：他的作品是中国新诗史上不可或缺的组成部分，为研究二十世纪中国农村变迁与知识分子心路历程提供了珍贵文本。\n\n### 历史评价\n1.  牛汉（诗人）：“苏老的诗，是中原的泥土和血汗捏成的，有土地的厚重和生命的坚韧。”\n2.  痖弦（台湾诗人）：“苏金伞先生是‘土地的歌者’，他的声音来自中国最深的根。”\n3.  文学史家评：“他的诗风单纯而非单薄，明朗而不浅白，在乡土题材中达到了相当的艺术高度。”\n\n---\n\n## 人教版教材知识点\n（注：苏金伞作品是否入选全国统编教材核心篇目尚不确定，但有资料显示其可能出现在部分版本教材中。）\n\n### 初中阶段\n- **时代背景**：**抗日战争**、**解放战争**时期的重要诗人。\n- **关键事件**：在**重庆**坚持抗战文艺创作；建国后长期主持**河南省文联**工作。\n- **代表作品/思想**：诗集**《地层下》**、**《窗外》**；诗歌主题多关注**农村**与**农民**，风格**质朴深沉**。\n- **常见易混点/对比点**：与同时代诗人**臧克家**（山东乡土）对比，两者都写农村，但苏金伞的诗更显**中原地域**特色；与“七月派”诗人有交往，但风格独立。\n\n### 高中阶段\n- **时代背景**：**中国现当代文学史**脉络中的重要诗人，跨越现、当代两个时期。\n- **关键贡献**：**中原诗风**的代表性构建者；其创作生涯体现了**知识分子**在时代变迁中的坚守与曲折。\n- **代表作品/思想**：晚期代表作**《鹁鸪鸟》**、**《埋葬了的爱情》**，展现历经沧桑后的**凝练**与**深邃**；诗歌理论强调“诗要从**生活**的土壤中生长出来”。\n- **常见易混点/对比点**：在文学史归类上，不同于**“九叶派”** 的现代主义倾向，也区别于**“政治抒情诗”** 的激昂，其风格是**个人化**的**现实主义**乡土书写；可与**艾青**的“土地”意象进行对比阅读。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n- 苏金伞是中国现代著名**诗人**，河南籍。\n- 他的诗歌主要描写**农村生活**和**农民命运**，风格**朴素、深沉**。\n- 了解其抗战时期在**重庆**的文学活动。\n- 知道其代表诗集有**《地层下》**。\n- （存疑/说法不一）其具体作品是否入选某些地方版本初中教材。\n\n### 高中阶段考点\n- 苏金伞在**中国现当代文学史**上的地位：**中原乡土诗**的代表人物。\n- 其创作历程贯穿**抗战**、**新中国成立**、**改革开放**等重大历史时期。\n- 分析其诗歌（如《鹁鸪鸟》中**土地意象**与**朴素语言**中所蕴含的深沉情感。\n- 理解其人生轨迹（如1957年遭遇）与**时代背景**的关系。\n- （存疑/说法不一）将其与**臧克家**、**艾青**等诗人的乡土诗进行异同比较，是常见的分析角度。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 睢县周营村 | 河南省商丘市睢县周营村 | 34.44 | 115.07 |\n| 开封 | 河南省开封市 | 34.80 | 114.31 |\n| 北京 | 北京市 | 39.90 | 116.40 |\n| 重庆 | 重庆市 | 29.56 | 106.55 |\n| 西安 | 陕西省西安市 | 34.26 | 108.94 |\n| 郑州 | 河南省郑州市 | 34.75 | 113.65 |"};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {

  const match = raw.match(/(\d{1,4})\s*年/);

};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const current = options.find((o) => o.id === value) || options[0] || { id: '', label: '' };
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(!open)}
        className="glass-panel rounded-lg px-3 py-1.5 text-xs flex items-center gap-2 shadow-lg hover:bg-white/95 transition-colors"
      >
        <span className="text-gray-500">{label}</span>
        <span className="text-[#7c2d12] font-bold">{current.label}</span>
        <span className="text-gray-400 text-[10px]">▾</span>
      </button>
      {open ? (
        <div className="absolute top-full right-0 mt-1 glass-panel rounded-lg shadow-xl py-1 min-w-[120px] z-20">
          {options.map((opt) => (
            <button
              key={opt.id}
              onClick={() => { onChange(opt.id); setOpen(false); }}
              className={`w-full text-left px-3 py-1.5 text-xs hover:bg-amber-50 transition-colors ${
                opt.id === value ? 'text-[#c0392b] font-bold bg-amber-50/60' : 'text-gray-700'
              }`}
            >
              {opt.label}
            </button>
          ))}
        </div>
      ) : null}
    </div>
  );
};

                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
