49年8月28日，美因河畔法兰克福（今德国法兰克福）\n- **去世**：公元1832年3月22日，魏玛（今德国图林根州魏玛市）\n- **享年**：83岁\n- **主要身份**：诗人、剧作家、小说家、自然科学家、政治家\n- **历史地位**：德国最伟大的作家之一，世界文学巨匠，其作品与思想深刻影响了欧洲文学与思想进程。\n- **主要成就**：创作诗剧《浮士德》；小说《少年维特之烦恼》；提出形态学与色彩理论；长期主持魏玛公国政务，推动文化艺术发展。\n\n### 生平概述\n歌德生于法兰克福一个富裕的市民家庭，早年学习法律，但志在文学与艺术。他参与发起“狂飙突进”运动，以《少年维特之烦恼》蜚声文坛。后受邀至魏玛公国，身居枢密顾问要职，涉足政治、科学、军事管理等多个领域。中年曾旅居意大利，古典艺术对其影响深远。晚年深居简出，潜心创作，最终完成毕生巨著《浮士德》。他的一生横跨多个时代，作品融合了启蒙理性与浪漫情感，成为连接德国与世界文化的重要桥梁。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：以德国魏玛为中心，足迹遍及莱茵河畔、施特拉斯堡，并远至意大利。\n- ⏱️ **时间跨度**：1749年 - 1832年，共计83年。\n- 📍 **地理范围**：主要位于今德国中部（黑森州、萨克森州、图林根州），以及瑞士、意大利北部地区。\n- 🌟 **重要节点数量**：9个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：美因河畔法兰克福\n- **时间**：1749年 - 1765年\n- **停留时间**：约16年\n- **地点**：美因河畔法兰克福（今德国法兰克福）\n- **事件**：出生于富裕的市民家庭，接受良好早期教育，阅读广泛，对民间戏剧产生兴趣。\n- **意义**：塑造了其世界观的基础，法兰克福自由市的环境培养了他对政治与社会的早期认知。\n\n### 📍 重要地点：莱比锡\n- **时间**：1765年 - 1768年\n- **停留时间**：约3年\n- **地点**：莱比锡（今德国萨克森州莱比锡市）\n- **事件**：遵从父命学习法律，但主要兴趣在文学与艺术创作，结识了早期的重要朋友与导师。\n- **意义**：创作风格转向洛可可式，出版首部诗集；因病休学，人生首次重大挫折。\n- **名篇名句**：《情人的脾气》：早期洛可可风格诗歌。\n\n### 📍 重要地点：斯特拉斯堡\n- **时间**：1770年 - 1771年\n- **停留时间**：约1年\n- **地点**：斯特拉斯堡（今法国斯特拉斯堡）\n- **事件**：继续学业并获得法学博士学位；结识思想家赫尔德，受其影响收集民歌，文学观念发生巨变。\n- **意义**：“狂飙突进”运动思想形成的关键期，开始创作具有鲜明反叛精神的作品。\n- **名篇名句**：《五月之歌》：自然与情感交融的抒情诗。\n\n### 📍 重要地点：韦茨拉尔\n- **时间**：1772年\n- **停留时间**：数月\n- **地点**：韦茨拉尔（今德国黑森州韦茨拉尔市）\n- **事件**：在帝国最高法院实习，结识友人并经历无望的爱情，此段经历成为《少年维特之烦恼》的素材。\n- **意义**：个人情感体验与时代苦闷结合，催生了其第一部具有世界影响力的小说。\n- **名篇名句**：《少年维特之烦恼》：“哪个少年不钟情，哪个少女不怀春。”\n\n### 📍 重要地点：魏玛（首次抵达与任职）\n- **时间**：1775年 - 1786年\n- **停留时间**：约11年\n- **地点**：魏玛（今德国图林根州魏玛市）\n- **事件**：受魏玛公爵卡尔·奥古斯特邀请，担任枢密顾问，主管军事、交通、财政等实务。1782年获得贵族身份。\n- **意义**：从狂飙突进的青年作家转变为务实的政治家与管理者，进入人生新阶段。\n\n### 📍 重要地点：意大利\n- **时间**：1786年 - 1788年\n- **停留时间**：约2年\n- **地点**：威尼斯、罗马、西西里岛等地（今意大利）\n- **事件**：秘密前往意大利，研究古典艺术与自然科学，完成多部剧本，艺术观转向古典主义。\n- **意义**：“意大利之旅”是其精神与艺术的重生，确立了“高贵的单纯，静穆的伟大”的美学理想。\n- **名篇名句**：《意大利游记》（日记与书信集）。\n\n### 📍 重要地点：魏玛（与席勒合作时期）\n- **时间**：1794年 - 1805年\n- **停留时间**：约11年\n- **地点**：魏玛（今德国图林根州魏玛市）\n- **事件**：与席勒建立深厚友谊并密切合作，共同主办《季节女神》杂志，推动德国古典文学高峰。常访问耶拿（今德国图林根州耶拿市）进行学术交流。\n- **意义**：德国文学的“古典主义”时期，两人合力创作，成就文学史佳话。\n- **名篇名句**：《浮士德》（片段）；《威廉·迈斯特的学习时代》。\n\n### 📍 重要地点：魏玛（晚年与《浮士德》完成）\n- **时间**：1806年 - 1832年\n- **停留时间**：约26年\n- **地点**：魏玛（今德国图林根州魏玛市）\n- **事件**：经历拿破仑战争，晚年沉浸于科学研究与《浮士德》第二部的创作，直至生命最后。常前往卡罗维发利（今捷克卡罗维发利）疗养，并在伊尔梅瑙（今德国图林根州伊尔梅瑙市）等地进行自然考察。\n- **意义**：完成思想与艺术的集大成之作，使魏玛成为欧洲文化圣地。\n- **名篇名句**：《浮士德》：“凡是自强不息者，到头我辈终能救。”\n\n### 🔴 去世地：魏玛\n- **时间**：1832年3月22日\n- **停留时间**：（同上，晚年居所）\n- **地点**：魏玛（今德国图林根州魏玛市）\n- **事件**：在完成《浮士德》手稿封存后不久，因病逝世。\n- **意义**：标志着德国古典文学时代的终结，其故居与陵墓成为重要文化纪念地。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1749 | 0 | 出生于法兰克福 |\n| 1765 | 16 | 赴莱比锡学习法律 |\n| 1770 | 21 | 赴斯特拉斯堡，结识赫尔德 |\n| 1771 | 22 | 在斯特拉斯堡获得法学博士学位，返回法兰克福 |\n| 1772 | 23 | 在韦茨拉尔实习，经历“维特”式情感 |\n| 1773 | 24 | 出版《葛兹·冯·伯利欣根》 |\n| 1774 | 25 | 出版《少年维特之烦恼》，轰动欧洲 |\n| 1775 | 26 | 应邀前往魏玛，从此定居 |\n| 1782 | 33 | 获得贵族身份，姓氏加入“冯” |\n| 1786 | 37 | 秘密前往意大利 |\n| 1788 | 39 | 返回魏玛，结识克里斯蒂娜·武尔皮乌斯 |\n| 1794 | 45 | 与席勒开始合作 |\n| 1806 | 57 | 与克里斯蒂娜正式结婚 |\n| 1808 | 59 | 《浮士德》第一部出版 |\n| 1829 | 80 | 《威廉·迈斯特的漫游时代》完成 |\n| 1831 | 82 | 《浮士德》第二部终稿完成 |\n| 1832 | 83 | 在魏玛逝世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《浮士德》**（选段）、**《少年维特之烦恼》**（节选）、《五月之歌》（诗歌）。\n- 核心要点：\n    - **重点**：**《浮士德》** 的核心主题是 **自强不息** 的探索精神，通过主人公追求真理、爱情、事业、美与社会理想的历程展现。\n    - **重点**：**《少年维特之烦恼》** 是 **狂飙突进运动** 的代表作，体现了对 **个性解放** 和 **自然情感** 的强烈呼唤。\n    - 作品中大量运用 **象征** 手法，如浮士德与魔鬼的契约象征人类对欲望与知识的矛盾。\n    - 诗歌风格从早期的 **洛可可** 风格，发展到狂飙突进的 **激情澎湃**，再到古典时期的 **和谐静穆**。\n    - **重点**：歌德善于将 **个人经历** 与 **时代精神** 相融合，使作品具有深刻的普遍性。\n    - 语言艺术上，其作品兼具 **哲理性** 与 **抒情性**，对德语文学语言的规范化有巨大贡献。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：歌德是 **狂飙突进运动** 的核心人物，该运动是德国启蒙运动的高潮，强调情感、天才与反抗。\n    - 1775年后，他受邀进入 **魏玛公国** 政府，成为开明 **贵族政治** 的实践者。\n    - **重点**：他与 **席勒** 的合作（1794-1805）共同开创了德国文学的 **“古典主义”** 时期。\n    - 他的 **自然科学研究**（如色彩学、形态学）是其理性与经验主义思想的重要体现。\n- 核心要点：\n    - **重点**：歌德的一生是 **启蒙理性** 与 **浪漫情感** 之间的桥梁，其思想具有 **过渡时代** 的复杂性。\n    - 他不仅是文学家，更是 **文艺复兴式** 的全才，在政治、科学、艺术管理等领域均有建树。\n    - **重点**：**魏玛** 因歌德与席勒等人的存 const extractTeachingHighlights = (raw, maxItems) => {
  const LF = String.fromCharCode(10);

  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}n`, 'g');
  const lines = String(raw || '').split(splitRe).map((x) => String(x || '').trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (text) => {
    const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;

    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};

  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

      '先直接回答用户的问题，再用足迹材料作简短佐证（不要反复复述行程）。',

      dynasty ? `朝代：${dynasty}` : '',
      birthplace ? `籍贯：${birthplace}` : '',
      lifeDatesLocal ? `生卒：${lifeDatesLocal}` : ''
    ].filter(Boolean).join('\n');
    const knowledge = [
      profile ? `【人物档案】\n${profile}` : '',
      keyFacts ? `【人物要点】\n${keyFacts}` : '',
      keyWorks ? `【相关作品/名句】\n${keyWorks}` : '',
      locLines ? `【足迹时间线】\n${locLines}` : '',
      quotes ? `【名句摘录】\n${quotes}` : ''

  const _postChat = async (messages) => {
    const toUrl = (u) => String(u || '').trim();
    const tryUrls = [];
    const pushUrl = (u) => {
      const val = toUrl(u);
      if (!val) return;
      if (!tryUrls.includes(val)) tryUrls.push(val);
    };
    if (typeof window.MAP_STORY_AI_ENDPOINT === 'string' && window.MAP_STORY_AI_ENDPOINT.trim()) {
      pushUrl(toUrl(window.MAP_STORY_AI_ENDPOINT).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (typeof window.MAP_STORY_API_BASE === 'string' && window.MAP_STORY_API_BASE.trim()) {
      pushUrl(toUrl(window.MAP_STORY_API_BASE).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (window.location && window.location.protocol !== 'file:') {
      pushUrl('/api/ai/proxy');
      if (window.location.origin) {
        pushUrl(toUrl(window.location.origin).replace(/\/+$/, '') + '/api/ai/proxy');
      }
    }
    pushUrl('http://127.0.0.1:8765/api/ai/proxy');
    pushUrl('http://localhost:8765/api/ai/proxy');
    let lastErr = null;
    for (const url of tryUrls) {
      try {
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, temperature: 0.2 })
        });
        const text = await resp.text();
        if (!resp.ok) {
          throw new Error(text || `HTTP ${resp.status}`);

        return JSON.parse(text);
      } catch (e) {
        lastErr = e;

      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
