**：石穿、得华（原名）\n- **时代**：近现代\n- **出生**：公元1898年10月24日，湖南省湘潭县彭家围子\n- **去世**：公元1974年11月29日，北京市\n- **享年**：76岁\n- **主要身份**：军事家、政治家、中华人民共和国开国元帅\n- **历史地位**：中国共产党、中华人民共和国和中国人民解放军的卓越领导人之一，为新中国的建立与建设立下不朽功勋。\n- **主要成就**：领导平江起义，创建红五军；参与指挥长征，到达陕北；指挥八路军发动百团大战；指挥西北野战军解放大西北；担任中国人民志愿军司令员兼政治委员，指挥抗美援朝战争。\n\n### 生平概述\n彭德怀，原名得华，出身湖南湘潭贫苦农家。早年投身湘军，后加入中国共产党，于1928年领导平江起义，开创湘鄂赣革命根据地。在中央苏区反“围剿”和长征中屡建奇功。抗日战争时期，作为八路军副总指挥，指挥了著名的百团大战。解放战争时期，率西北野战军以弱胜强，解放大西北。新中国成立后，临危受命出任志愿军司令员，率部抗美援朝，保家卫国。后任国务院副总理兼国防部长等职。他一生耿直刚烈，为民请命，是深受人民爱戴的革命家和军事统帅。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及中国湖南、江西、陕西、山西、河北、北京、朝鲜等多地，从革命战争到国防建设。\n- ⏱️ **时间跨度**：1898年 - 1974年，共76年。\n- 📍 **地理范围**：主要覆盖中国中南、西北、华北地区，并延伸至朝鲜半岛。\n- 🌟 **重要节点数量**：12个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：湘潭县彭家围子\n- **时间**：1898年\n- **停留时间**：约16年\n- **地点**：湖南省湘潭县彭家围子\n- **事件**：出生于贫苦农民家庭，幼年读过两年私塾，后因丧母辍学，做过牧童、矿工。\n- **意义**：苦难的童年塑造了他坚韧不拔、同情底层人民的性格底色。\n\n### 📍 重要地点：湘军驻地（湖南多地）\n- **时间**：1916年 - 1922年\n- **停留时间**：约6年\n- **地点**：湖南省长沙市等地\n- **事件**：加入湘军，从二等兵做起，参与了护法战争等军阀混战。在军队中结识进步人士，开始接触革命思想。\n- **意义**：积累了早期军事经验，并开始思考救国救民的道路。\n\n### 📍 重要地点：陆军军官学校（湖南讲武堂）\n- **时间**：1922年 - 1923年\n- **停留时间**：约1年\n- **地点**：湖南省长沙市（湖南陆军讲武堂）\n- **事件**：考入湖南陆军军官讲武堂学习军事。\n- **意义**：接受了系统的军事理论教育，为日后卓越的军事指挥才能打下基础。\n\n### 📍 重要地点：平江\n- **时间**：1928年7月\n- **停留时间**：起义后不久即转移\n- **地点**：平江县（今湖南省岳阳市平江县）\n- **事件**：与滕代远、黄公略等发动和领导平江起义，成立中国工农红军第五军。\n- **意义**：标志着其正式成为红军的重要创建者之一，开辟了湘鄂赣革命根据地。\n\n### 📍 重要地点：井冈山与中央苏区\n- **时间**：1928年12月 - 1934年10月\n- **停留时间**：约6年\n- **地点**：井冈山（主体位于今江西省吉安市井冈山市，部分区域涉及湖南省株洲市炎陵县等地）；瑞金（今江西省瑞金市）\n- **事件**：率红五军上井冈山与朱毛红军会师。后在中央苏区历次反“围剿”中担任重要指挥职务，屡立战功。\n- **意义**：巩固了井冈山根据地，成为中央红军的核心将领之一。\n\n### 📍 重要地点：陕北吴起镇\n- **时间**：1935年10月\n- **停留时间**：短暂\n- **地点**：吴起镇（今陕西省延安市吴起县）\n- **事件**：率红一方面军主力（陕甘支队）抵达此地，结束长征。\n- **意义**：标志着艰苦卓绝的长征胜利结束，为革命大本营奠基西北。\n\n### 📍 重要地点：太行山区（八路军总部）\n- **时间**：1937年 - 1943年\n- **停留时间**：约6年\n- **地点**：晋东南地区（指挥部曾设于今山西省长治市武乡县等地）\n- **事件**：任八路军副总司令，坐镇太行，指挥华北敌后抗战。1940年组织指挥了著名的百团大战。\n- **意义**：领导华北抗日根据地军民沉重打击了日军，坚定了全国抗战信心。\n- **相关记述（存疑）**：关于百团大战的动员讲话，有“这一仗必须打，打出八路军的威风，打出中国人民的志气！”等说法，但具体出处及原文存疑，现存多种版本。\n\n### 📍 重要地点：延安\n- **时间**：1943年 - 1947年\n- **停留时间**：约4年\n- **地点**：延安（今陕西省延安市）\n- **事件**：返回延安，参与中央领导工作。在延安整风运动、中共七大上发挥重要作用。1947年国民党军重点进攻陕北时，临危受命指挥西北野战军。\n- **意义**：在中央层面参与决策，并直接指挥了保卫延安的战役。\n\n### 📍 重要地点：朝鲜半岛（志愿军总部）\n- **时间**：1950年10月 - 1952年（主要指挥时期）\n- **停留时间**：约2年\n- **地点**：朝鲜民主主义人民共和国桧仓郡等地\n- **事件**：出任中国人民志愿军司令员兼政治委员，指挥志愿军入朝作战，连续发动五次战役，将以美国为首的“联合国军”打回三八线附近。\n- **意义**：赢得了抗美援朝战争的伟大胜利，捍卫了新中国安全，提高了中国的国际威望。\n- **相关记述（存疑）**：有电文提及前线“饥无粮，寒无衣”等困难状况，但具体电文内容及出处存疑，现存多种版本。\n\n### 📍 重要地点：北京（中南海）\n- **时间**：1952年 - 1959年\n- **停留时间**：约7年\n- **地点**：北京市（中南海）\n- **事件**：主持中央军委日常工作，任国务院副总理兼国防部长，致力于国防现代化和军队正规化建设。1959年在庐山会议上受到错误批判。\n- **意义**：为新中国国防和军队建设作出奠基性贡献，其人生轨迹在此发生重大转折。\n\n### 📍 重要地点：北京（吴家花园、监护地）\n- **时间**：1959年 - 1974年\n- **停留时间**：约15年\n- **地点**：北京市（挂甲屯吴家花园；后被监护地点）\n- **事件**：被免职后在北京西郊挂甲屯吴家花园学习、劳动。后遭长期监禁，身患重病。\n- **意义**：在逆境中仍坚持真理，心系国家和人民，度过了悲壮的晚年。\n\n### 🔴 去世地：北京\n- **时间**：1974年11月29日\n- **停留时间**：长期\n- **地点**：北京市\n- **事件**：因患直肠癌，在监护中病逝。\n- **意义**：一代元帅含冤逝世。1978年中共十一届三中全会为其平反昭雪，恢复名誉。骨灰安放于八宝山革命公墓。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| :--- | :--- | :--- |\n| 1898 | 0 | 出生于湖南省湘潭县。 |\n| 1916 | 18 | 加入湘军。 |\n| 1922 | 24 | 考入湖南陆军讲武堂。 |\n| 1928 | 30 | 领导平江起义，加入中国共产党，创建红五军。率部上井冈山与朱毛红军会师。 |\n| 1934-1935 | 36-37 | 参加长征，率部到达陕北。 |\n| 1937-1945 | 39-47 | 任八路军副总司令，指挥华北抗战，组织百团大战。 |\n| 1947-1949 | 49-51 | 任西北野战军司令员，指挥解放大西北。 |\n| 1950-1953 | 52-55 | 任中国人民志愿军司令员兼政委，指挥抗美援朝战争。 |\n| 1954-1959 | 56-61 | 任国务院副总理兼国防部长，主持军委日常工作。 |\n| 1959 | 61 | 庐山会议后被免职。 |\n| 1974 | 76 | 在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《百团大战》**（相关历史记述）、**《给毛泽东的电报》**（选段）\n- 核心要点：\n    - **重点**：相关记述中提及前线“饥无粮，寒无衣”等困难状况，以极其**质朴**、**直接**的语言，真实反映了前线极端艰苦的条件，体现了彭德怀**实事求是**、敢于直言的品格。\n    - **重点**：其文字风格**刚健质朴**，**不尚空谈**，具有强烈的**纪实性**和**感染力**，是革命现实主义文学的典型材料。\n    - 通过历史记述学习**百团大战**的**战略意义**：它是抗战期间中国军队主动出击日军的最大规模战役，**振奋**了全国军民的抗战信心。\n    - 体会彭德怀作为**军事统帅**的**担当精神**与对战士的**深厚感情**，其相关记述是**情感**与**事实**结合的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1928年领导**平江起义**，是创建中国工农红军和开辟**湘鄂赣革命根据地**的关键事件之一。\n    - **重     const t = String(text || '').replace(/^[-•]\s*/, '').trim();
    if (!t || seen.has(t)) return;
    seen.add(t);
    out.push(t);
  };
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    if (/\*\*重点\*\*|重点|核心要点|关键史实|历史评价|民族大义|时代背景/.test(line)) push(line);
    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);
  }
  for (const line of lines) {
    if (/^(#{1,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(line)) continue;
    if (/^###\s+/.test(line) || /^####\s+/.test(line)) continue;
    if (!/^[-•]\s+/.test(line) && !/^\d+\.\s+/.test(line)) continue;
    push(line);
    if (out.length >= (maxItems || 5)) break;
  }
  return out.slice(0, maxItems || 5);
};

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
