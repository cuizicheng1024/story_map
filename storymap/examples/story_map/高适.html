at": 30.572, "lng": 104.066, "type": "normal", "event": "代**剑南西川节度使**，入朝前曾短暂驻守成都。与杜甫在蜀中时有诗歌唱和。", "time": "公元762年 - 764年", "duration": "约两年", "significance": "在蜀地最高军政长官任上，稳定局势。与故友杜甫在战乱后重逢，留下诗篇。", "works": [], "quoteLines": []}, {"name": "长安", "ancientName": "长安", "modernName": "陕西西安", "lat": 34.341, "lng": 108.939, "type": "death", "event": "回朝任**散骑常侍**，加**银青光禄大夫**，世称“高常侍”。同年正月去世，赠**礼部尚书**，谥号“**忠**”。", "time": "公元765年", "duration": "约一年", "significance": "以朝廷重臣、文坛宿将的身份走完一生，荣宠善终。", "works": [], "quoteLines": ["《除夜作》：“故乡今夜思千里，霜鬓明朝又一年。”"]}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "#### 语文（课文/诗作）\n- 课文/诗作：**《燕歌行》**、**《别董大》**、《塞上听吹笛》\n- 核心要点：\n    - **重点**：**《燕歌行》** 是唐代边塞诗的压卷之作，主题思想复杂深刻，既歌颂战士的英勇，也揭露军中苦乐不均、将帅骄奢的现实。\n    - **重点**：诗歌中“**战士军前半死生，美人帐下犹歌舞**”的强烈对比，是批判现实、同情士卒的千古名句。\n    - **意象**：善于运用**大漠**、**风雪**、**孤城**、**落日**等苍茫辽阔的**边塞意象**，营造雄浑悲壮的意境。\n    - **风格**：诗风**雄浑悲壮**、**慷慨激昂**，兼具浪漫豪情与现实深度，是**盛唐气象**在边塞诗中的典型体现。\n    - **情感**：**《别董大》** 中“莫愁前路无知己，天下谁人不识君”展现了豪迈乐观、昂扬向上的**盛唐精神**，一扫送别诗的悲切之风。\n    - **重点**：高适的边塞诗不仅描绘风光、抒发豪情，更注重对**战争本质**、**社会矛盾**和**官兵关系**的深入思考与批判。\n\n#### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**安史之乱**中的重要人物，前期随**哥舒翰**守潼关，后期成为**唐肃宗**倚重的平叛统帅之一，出任**淮南节度使**。\n    - 参与平定**永王李璘之乱**，此事导致其与好友**李白**立场对立，李白因此获罪流放。\n    - 晚年经营**剑南西川**，抵御**吐蕃**，稳定唐朝西南边疆。\n    - **重点**：从一介书生、低级县尉，凭借军功和政治才能，最终官至**节度使**、封**渤海县侯**，是唐代“**诗人之达者**”的典范。\n- 核心要点：\n    - **时代背景**：亲身经历唐朝由**开元盛世**转向**安史之乱**的巨大历史动荡，其人生轨迹是时代剧变的缩影。\n    - **人物关系**：与**李白**、**杜甫**并称“**李杜高**”，三人友谊是文学史佳话，但因安史之乱中的政治选择而命运迥异。\n    - **重点**：其成功在于将**文才**与**干略**相结合，在乱世中抓住机遇，实现了从**文人**到**封疆大吏**的转型。\n    - **历史评价**：在《旧唐书》、《新唐书》中均有传，被评价为“**有唐以来，诗人之达者，唯适而已**”。\n    - **重点**：其生平与诗歌，是研究**盛唐向中唐过渡**时期社会变迁、文人心态与边塞政策的重要个案。\n\n---", "examPoints": "### 考点\n#### 语文（课文/诗作）\n- 课文/诗作：**《燕歌行》**、**《别董大》**、《塞上听吹笛》\n- 核心要点：\n    - **重点**：**《燕歌行》** 是唐代边塞诗的压卷之作，主题思想复杂深刻，既歌颂战士的英勇，也揭露军中苦乐不均、将帅骄奢的现实。\n    - **重点**：诗歌中“**战士军前半死生，美人帐下犹歌舞**”的强 **地点**：宋州（今河南商丘睢阳区）\n- **事件**：青年至中年长期在此寓居、耕读、漫游，生活困顿，“以求丐自给”。\n- **意义**：形成其性格与早期诗风的重要阶段，创作了《**别董大**》等早期名篇。公元744年秋，与**李白**、**杜甫**在此相会，同游梁宋，成为中国文学史上的佳话。\n- **名篇名句**：《别董大》：“莫愁前路无知己，天下谁人不识君。”\n\n### 📍 重要地点：长安\n- **时间**：约公元730年代 - 740年代（多次往返）\n- **停留时间**：断续数年\n- **地点**：长安（今陕西西安）\n- **事件**：多次赴长安求仕，干谒王公权贵，但仕途不顺，曾写下“拜迎长官心欲碎，鞭挞黎庶令人悲”的诗句表达矛盾痛苦。\n- **意义**：体验了盛唐政治中心的繁华与官场现实，加深了对社会矛盾的认识，诗歌题材更为广泛。\n\n### 📍 重要地点：封丘\n- **时间**：公元749年 - 约752年\n- **停留时间**：约三年\n- **地点**：封丘（今河南封丘）\n- **事件**：年近五十，经人荐举中有道科，授**封丘县尉**。任内深感官职卑微与职责的痛苦。\n- **意义**：正式踏入仕途，但低级官吏的体验使其决心改变人生轨迹，最终弃官西去。\n- **名篇名句**：《封丘作》：“我本渔樵孟诸野，一生自是悠悠者。”\n\n### 📍 重要地点：河西幕府（武威）\n- **时间**：约公元752年 - 755年\n- **停留时间**：约三年\n- **地点**：武威（凉州，今甘肃武威）\n- **事件**：弃官后，赴西北边塞，入**河西节度使哥舒翰**幕府，任掌书记。亲身经历边塞军旅生活。\n- **意义**：创作达到高峰，写下大量雄浑悲壮的边塞诗，如《**燕歌行**》。深入了解边防形势与军队实情，为其后来军事生涯奠定基础。\n- **名篇名句**：《燕歌行》：“战士军前半死生，美人帐下犹歌舞。”\n\n### 📍 重要地点：潼关\n- **时间**：公元755年 - 756年\n- **停留时间**：数月\n- **地点**：潼关（今陕西渭南潼关县）\n- **事件**：安史之乱爆发，随哥舒翰镇守潼关。兵败后，追随玄宗西逃。\n- **意义**：亲历安史之乱这一重大历史转折点，军事生涯遭遇重大挫折，但获得了宝贵的政治经验。\n\n### 📍 重要地点：长安（玄宗朝）\n- **时间**：公元756年（短暂）\n- **停留时间**：短暂\n- **地点**：长安（今陕西西安）\n- **事件**：随玄宗至长安，旋即又随玄宗奔蜀。\n- **意义**：见证了都城陷落前后的混乱。\n\n### 📍 重要地点：灵武\n- **时间**：公元756年\n- **停留时间**：数月\n- **地点**：灵武（今宁夏灵武西南）\n- **事件**：追上玄宗后，奉命前往灵武向**唐肃宗**进呈陈述军事形势的奏章，受到肃宗赏识，拜为**谏议大夫**。\n- **意义**：政治生涯的关键转折点，从此成为肃宗朝臣，跻身权力核心。\n\n### 📍 重要地点：淮南（广陵）\n- **时间**：公元756年 - 758年\n- **停留时间**：约两年\n- **地点**：广陵（扬州，今江苏扬州）\n- **事件**：出任**淮南节度使**，参与讨伐**永王李璘**之乱及平定江淮地区叛军。\n- **意义**：达到个人政治与军事权力的顶峰，成为一方统帅。与李白因永王事件立场对立，关系破裂。\n- **名篇名句**：《送李少府贬峡中王少府贬长沙》：“圣代即今多雨露，暂时分手莫踌躇。”\n\n### 📍 重要地点：东川（梓州）\n- **时间**：公元760年 - 762年\n- **停留时间**：约两年\n- **地点**：梓州（今四川三台）\n- **事件**：出任**彭州刺史**，后迁**蜀州刺史**，再迁**剑南东川节度使**。在蜀地抵御吐蕃。\n- **意义**：经营西南边防，保障了唐朝西南地区的暂时安定。\n\n### 📍 重要地点：成都\n- **时间**：公元762年 - 764年\n- **停留时间**：约两年\n- **地点**：成都（今四川成都）\n- **事件**：代**剑南西川节度使**，入朝前曾短暂驻守成都。与杜甫在蜀中时有诗歌唱和。\n- **意义**：在蜀地最高军政长官任上，稳定局势。与故友杜甫在战乱后重逢，留下诗篇。\n\n### 🔴 去世地：长安\n- **时间**：公元765年\n- **停留时间**：约一年\n- **地点**：长安（今陕西西安）\n- **事件**：回朝任**散骑常侍**，加**银青光禄大夫**，世称“高常侍”。同年正月去世，赠**礼部尚书**，谥号“**忠**”。\n- **意义**：以朝廷重臣、文坛宿将的身份走完一生，荣宠善终。\n- **名篇名句**：《除夜作》：“故乡今夜思千里，霜鬓明朝又一年。”\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 约704年 | 1岁 | 出生于渤海蓨县（存疑，另有洛阳、宋州等说）。 |\n| 约730年代初 | 约20岁 | 首次游历长安，干谒求仕未果。 |\n| 约730年代 | 约30岁 | 寓居宋州，躬耕自给，创作早期诗歌。 |\n| 744年 | 约41岁 | 与李白、杜甫相会于梁宋，同游赋诗。 |\n| 749年 | 约46岁 | 中有道科，授封丘县尉。 |\n| 约752年 | 约49岁 | 弃官，赴河西，入哥舒翰幕府任掌书记。 |\n| 755年 | 约52岁 | 安史之乱爆发，随哥舒翰守潼关。 |\n| 756年 | 约53岁 | 潼关兵败，追随玄宗；后奉使见肃宗，拜谏议大夫。 |\n| 756年末 | 约53岁 | 出任淮南节度使，讨伐永王李璘。 |\n| 758年 | 约55岁 | 罢淮南节度使，任太子少詹事。 |\n| 760年 | 约57岁 | 出任彭州刺史，后转蜀州刺史。 |\n| 762年 | 约59岁 | 迁剑南东川节度使，后兼领西川。 |\n| 764年 | 约61岁 | 入朝，任刑部侍郎，转散骑常侍。 |\n| 765年 | 约62岁 | 正月，卒于长安，赠礼部尚书，谥号“忠”。 |\n\n---\n\n## 人教版教材知识点\n#### 语文（课文/诗作）\n- 课文/诗作：**《燕歌行》**、**《别董大》**、《塞上听吹笛》\n- 核心要点：\n    - **重点**：**《燕歌行》** 是唐代边塞诗的压卷之作，主题思想复杂深刻，既歌颂战士的英勇，也揭露军中苦乐不均、将帅骄奢的现实。\n    - **重点**：诗歌中“**战士军前半死生，美人帐下犹歌舞**”的强烈对比，是批判现实、同情士卒的千古名句。\n    - **意象**：善于运用**大漠**、**风雪**、**孤城**、**落日**等苍茫辽阔的**边塞意象**，营造雄浑悲壮的意境。\n    - **风格**：诗风**雄浑悲壮**、**慷慨激昂**，兼具浪漫豪情与现实深度，是**盛唐气象**在边塞诗中的典型体现。\n    - **情感**：**《别董大》** 中“莫愁前路无知己，天下谁人不识君”展现了豪迈乐观、昂扬向上的**盛唐精神**，一扫送别诗的悲切之风。\n    - **重点**：高适的边塞诗不仅描绘风光、抒发豪情，更注重对**战争本质**、**社会矛盾**和**官兵关系**的深入思考与批判。\n\n#### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**安史之乱**中的重要人物，前期随**哥舒翰**守潼关，后期成为**唐肃宗**倚重的平叛统帅之一，出任**淮南节度使**。\n    - 参与平定**永王李璘之乱**，此事导致其与好友**李白**立场对立，李白因此获罪流放。\n    - 晚年经营**剑南西川**，抵御**吐蕃**，稳定唐朝西南边疆。\n    - **重点**：从一介书生、低级县尉，凭借军功和政治才能，最终官至**节度使**、封**渤海县侯**，是唐代“**诗人之达者**”的典范。\n- 核心要点：\n    - **时代背景**：亲身经历唐朝由**开元盛世**转向**安史之乱**的巨大历史动荡，其人生轨迹是时代剧变的缩影。\n    - **人物关系**：与**李白**、**杜甫**并称“**李杜高**”，三人友谊是文学史佳话，但因安史之乱中的政治选择而命运迥异。\n    - **重点**：其成功在于将**文才**与**干略**相结合，在乱世中抓住机遇，实现了从**文人**到**封疆大吏**的转型。\n    - **历史评价**：在《旧唐书》、《新唐书》中均有传，被评价为“**有唐以来，诗人之达者，唯适而已**”。\n    - **重点**：其生平与诗歌，是研究**盛唐向中唐过渡**时期社会变迁、文人心态与边塞政策的重要个案。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 河北景县 | 37.692 | 116.269 |\n| 河南洛阳 | 34.619 | 112.454 |\n| 河南商丘睢阳区 | 34.388 | 115.653 |\n| 河南开封 | 34.797 | 114.307 |\n| 陕西西安 | 34.341 | 108.939 |\n| 河南封丘 | 35.044 | 114.4 const extractTeachingHighlights = (raw, maxItems) => {

    out.push(t);

  for (const line of lines) {

    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);

  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const renderMdBlock = (text) => {
  const s = String(text || '').trim();
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  return kept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              点击“开始对话”，即可在本页与人物进行对话；若你是直接双击打开 HTML，请先用本地服务打开（否则无法请求对话接口）。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">教材知识点与考点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
                <span className="text-[10px] text-gray-500">面向教学</span>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
