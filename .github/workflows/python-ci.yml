name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Debug CI Environment
        run: |
          echo "which python: $(which python)"
          python --version
          echo "which pip: $(which pip)"
          python -m pip --version
          echo "which ruff: $(which ruff || true)"
          echo "which pytest: $(which pytest || true)"
          python - <<'PY'
          import shutil
          import sys
          print("sys.executable:", sys.executable)
          print("ruff on PATH:", shutil.which("ruff"))
          print("pytest on PATH:", shutil.which("pytest"))
          PY
          python -m pip list

      - name: Debug StoryMap Check Resolver
        run: |
          python - <<'PY'
          import tools.run_storymap_checks as m
          python_bin = m._python_bin()
          print("resolved python:", python_bin)
          print("resolved ruff:", m._ruff_command(python_bin))
          print("default tests:", m.DEFAULT_TESTS)
          print("default ruff targets:", m.DEFAULT_RUFF_TARGETS)
          PY

      - name: Run Ruff Check
        run: |
          python -m ruff check --select F \
            storymap/script/story_map.py \
            storymap/script/app_factory.py \
            storymap/script/artifacts.py \
            storymap/script/static.py \
            storymap/script/task.py \
            storymap/script/runtime_support.py \
            storymap/script/export_builders.py \
            tests/test_artifacts.py \
            tests/test_fastapi_app.py \
            tests/test_static_service.py \
            tests/test_task_service.py \
            tools/run_storymap_checks.py

      - name: Pytest test_env_aliases
        run: python -m pytest -vv -ra --maxfail=1 tests/test_env_aliases.py

      - name: Pytest test_output_paths
        run: python -m pytest -vv -ra --maxfail=1 tests/test_output_paths.py

      - name: Pytest test_artifacts
        run: python -m pytest -vv -ra --maxfail=1 tests/test_artifacts.py

      - name: Pytest test_static_service
        run: python -m pytest -vv -ra --maxfail=1 tests/test_static_service.py

      - name: Pytest test_parsers
        run: python -m pytest -vv -ra --maxfail=1 tests/test_parsers.py

      - name: Pytest test_offline_profile_locations
        run: python -m pytest -vv -ra --maxfail=1 tests/test_offline_profile_locations.py

      - name: Pytest test_generation_flow
        run: python -m pytest -vv -ra --maxfail=1 tests/test_generation_flow.py

      - name: Pytest test_fastapi_app
        run: python -m pytest -vv -ra --maxfail=1 tests/test_fastapi_app.py

      - name: Pytest test_task_service
        run: python -m pytest -vv -ra --maxfail=1 tests/test_task_service.py

      - name: Pytest test_profile_page_template
        run: python -m pytest -vv -ra --maxfail=1 tests/test_profile_page_template.py

      - name: Pytest test_validate_story_markdown
        run: python -m pytest -vv -ra --maxfail=1 tests/test_validate_story_markdown.py
