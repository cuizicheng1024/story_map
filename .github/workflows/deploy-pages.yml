name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAP_STORY_OUTPUT_DIR: artifacts/story_map
      MAP_STORY_STATIC_SITE: "1"
      AMAP_KEY: ${{ secrets.AMAP_KEY }}
      AMAP_SECURITY: ${{ secrets.AMAP_SECURITY }}
      MAP_STORY_API_BASE: ${{ vars.MAP_STORY_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Detect changed story markdown files
        id: changed_story_md
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMR "$before" "$GITHUB_SHA" -- storymap/examples/story > /tmp/changed_story_md.txt || true
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- storymap/examples/story > /tmp/changed_story_md.txt || true
          fi
          grep '\.md$' /tmp/changed_story_md.txt > /tmp/changed_story_md_filtered.txt || true
          count=$(grep -c . /tmp/changed_story_md_filtered.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed Markdown files: $count"
          cat /tmp/changed_story_md_filtered.txt || true

      - name: Markdown smoke check
        if: steps.changed_story_md.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t files < /tmp/changed_story_md_filtered.txt
          python tools/validate_story_markdown.py --report-json data/markdown_smoke_report.json --files "${files[@]}"

      - name: Build static story map site
        run: |
          python cli/generate_pure_story_map.py --render-all --all-mode nogeocode
          python tools/build_stellar_homepage.py --story-map-dir artifacts/story_map --story-md-dir storymap/examples/story
          cp artifacts/story_map/index.html artifacts/story_map/404.html
          touch artifacts/story_map/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/story_map

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
