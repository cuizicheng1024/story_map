/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

接新的生活与创作。", "quotes": ["迁居至拉斯佩齐亚湾畔的莱里奇，准备迎接新的生活与创作。", "事件：在威尼斯与拜伦商议创办杂志《自由派》；"], "quote_policy": "preferred"}, "麦布女王": {"title": "麦布女王", "aliases": [], "authors": ["珀西·比希·雪莱"], "related_people": ["雪莱"], "source_pages": ["雪莱"], "era": "英国浪漫主义时期", "genre": "长诗", "one_liner": "雪莱1813年自费出版的长篇哲理诗，以仙后麦布向凡人展示过去、现在与未来之梦的方式，全面抨击专制暴政、宗教迷信和社会不公，宣扬理性、自由与博爱。", "summary": "| 1813 | | | （年龄：21）自费出版长诗《麦布女王》，抨击社会制度。", "quote": "The world's great age begins anew, The golden years return.", "quotes": ["The world's great age begins anew, The golden years return.", "How wonderful is Death, Death, and his brother Sleep!"], "quote_policy": "preferred"}, "弗兰肯斯坦": {"title": "弗兰肯斯坦", "aliases": [], "authors": [], "related_people": ["雪莱"], "source_pages": ["雪莱"], "era": "", "genre": "", "one_liner": "其妻玛丽·雪莱是科幻小说《弗兰肯斯坦》的作者，两人共同的朋友圈是当时欧洲重要的知识分子流亡群体。", "summary": "其妻玛丽·雪莱是科幻小说《弗兰肯斯坦》的作者，两人共同的朋友圈是当时欧洲重要的知识分子流亡群体。", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 雪莱\n\n## 人物档案\n\n### 基本信息\n- **姓名**：珀西·比希·雪莱\n- **时代**：英国浪漫主义时期（18世纪末至19世纪初）\n- **出生**：公元1792年8月4日，英格兰萨塞克斯郡霍舍姆菲尔德庄园（今英国西萨塞克斯郡霍舍姆）\n- **去世**：公元1822年7月8日，意大利拉斯佩齐亚湾（今意大利利古里亚大区拉斯佩齐亚省）\n- **享年**：29岁\n- **主要身份**：诗人、剧作家、小说家、散文家\n- **历史地位**：英国最伟大的抒情诗人之一，浪漫主义运动的核心人物，以其理想主义、激进思想与对自由的歌颂闻名于世。\n- **主要成就**：\n    1. 创作了《西风颂》《云》《致云雀》等不朽的抒情诗篇。\n    2. 完成了诗剧《解放了的普罗米修斯》，展现其社会理想。\n    3. 撰写《诗辩》等重要文学评论，阐述诗歌的社会功能。\n    4. 其思想与作品深刻影响了后世的宪章运动、社会主义思潮及文学创作。\n\n### 生平概述\n雪莱出生于英国一个富裕的乡绅家庭，早年就读于伊顿公学与牛津大学，因发表《无神论的必然性》被开除。他一生秉持激进的自由思想与反叛精神，同情爱尔兰人民，抨击社会不公。因个人生活风波与政治压力，他于1818年永久移居意大利。在意大利期间，他与拜伦过从甚密，迎来了创作的巅峰期，完成了众多杰作。1822年，他在一次航海中遭遇风暴不幸溺亡，其骨灰安葬于罗马。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹从英格兰东南部出发，遍及伦敦、湖区、爱尔兰，最终在意大利半岛多地（尤其是比萨、威尼斯、罗马）度过创作巅峰并长眠。\n- ⏱️ **时间跨度**：公元1792年 - 公元1822年，共计约30年。\n- 📍 **地理范围**：主要覆盖英格兰中南部、爱尔兰都柏林地区，以及意大利中北部（托斯卡纳、拉齐奥、威尼托等大区）。\n- 🌟 **重要节点数量**：核心地点9个（含出生地与去世地）。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：菲尔德庄园\n- **时间**：公元1792年\n- **停留时间**：童年早期\n- **地点**：英格兰萨塞克斯郡霍舍姆菲尔德庄园（今英国西萨塞克斯郡霍舍姆）\n- **事件**：出生于一个保守的辉格党乡绅家庭。\n- **意义**：其成长环境与后来的激进思想形成鲜明对比，乡村的自然风光也最早滋养了他的诗人气质。\n\n### 📍 重要地点：伊顿公学\n- **时间**：公元1804年 - 1810年\n- **停留时间**：约6年\n- **地点**：英格兰伯克郡伊顿（今英国伯克郡温莎和梅登黑德皇家自治市）\n- **事件**：开始广泛阅读科学与文学著作，对自然科学产生浓厚兴趣，并初步形成反叛性格，反抗学校的“学仆制”。\n- **意义**：需说明，此条与史实有出入——雪莱生命的最后阶段（一八二二年）居于意大利勒里奇，他与拜伦合办《自由》杂志、筹划《唐璜》续篇的计划都发生在托斯卡纳的海岸边。伊顿在他生命中属于少年时期，并非终老之地。如需保留\"未来计划与期待\"这一核心，可改写为：伊顿公学：寄宿时期的孤独与压抑，反而让雪莱更早地萌生对自由与乌托邦的憧憬，他在笔记中写下的少年理想，成为日后《解放了的普罗米修斯》中\"未来世界\"最早的草图\n\n### 📍 重要地点：牛津大学\n- **时间**：公元1810年 - 1811年\n- **停留时间**：约1年\n- **地点**：英格兰牛津郡牛津（今英国牛津郡牛津市）\n- **事件**：与好友霍格合作发表小册子《无神论的必然性》，因此被学校开除。\n- **意义**：需说明，此条与史实有出入——雪莱生命的最后阶段（一八二二年）居于意大利勒里奇，他与拜伦合办《自由》杂志、筹划《唐璜》续篇的计划都发生在托斯卡纳的海岸边。伊顿在他生命中属于少年时期，并非终老之地。如需保留\"未来计划与期待\"这一核心，可改写为：伊顿公学：寄宿时期的孤独与压抑，反而让雪莱更早地萌生对自由与乌托邦的憧憬，他在笔记中写下的少年理想，成为日后《解放了的普罗米修斯》中\"未来世界\"最早的草图\n\n### 📍 重要地点：伦敦与凯西克（湖区）\n- **时间**：公元1811年 - 1812年\n- **停留时间**：数月\n- **地点**：伦敦（今英国大伦敦）；凯西克（今英国坎布里亚郡湖区国家公园内）\n- **事件**：在伦敦结识激进出版商胡克斯，接触更广泛的改革派圈子；前往湖区拜访诗人骚塞。\n- **意义**：当雪莱在意大利的浪涛中迎来生命尽头，伊顿的回响始终萦绕在他心底。那些在课堂角落里写就的诗行、那些与同龄人激烈辩论的夜晚，早已化作他丈量世界的尺度。他用一生去实现少年时在伊顿许下的诺言——推翻暴政、解放人类、用西风唤醒整个春天\n\n### 📍 重要地点：都柏林\n- **时间**：公元1812年\n- **停留时间**：数周\n- **地点**：爱尔兰都柏林（今爱尔兰都柏林郡都柏林市）\n- **事件**：散发《告爱尔兰人民书》，公开呼吁天主教解放、爱尔兰民族权利与社会改革。\n- **意义**：将其激进思想付诸政治实践的首次重要尝试，展现了无畏的行动力。\n\n### 📍 重要地点：伯尔尼与日内瓦（瑞士）\n- **时间**：公元1816年\n- **停留时间**：数月\n- **地点**：伯尔尼（今瑞士伯尔尼州伯尔尼市）；日内瓦（今瑞士日内瓦州日内瓦市）\n- **事件**：首次与拜伦勋爵在日内瓦湖畔深入交往，进行文学与思想交流。\n- **意义**：与同时代最伟大诗人的思想碰撞，极大地激发了创作灵感，标志着其文学生涯进入新阶段。\n\n### 📍 重要地点：那不勒斯与罗马\n- **时间**：公元1818年 - 1819年\n- **停留时间**：数月\n- **地点**：那不勒斯（今意大利坎帕尼亚大区那不勒斯广域市）；罗马（今意大利拉齐奥大区罗马首都都会市）\n- **事件**：在意大利旅行，参观古罗马遗迹，深受历史沧桑感震撼。在罗马期间，其子威廉不幸夭折。\n- **意义**：个人悲剧与古典历史的厚重感交织，深刻影响了其后期诗歌的悲剧意识与历史深度。\n\n### 📍 重要地点：佛罗伦萨与比萨\n- **时间**：公元1819年 - 1821年\n- **停留时间**：约2年\n- **地点**：佛罗伦萨（今意大利托斯卡纳大区佛罗伦萨广域市）；比萨（今意大利托斯卡纳大区比萨省）\n- **事件**：迎来创作的“奇迹之年”（1819年），写下《西风颂》《云》《致云雀》等名篇；完成诗剧《解放了的普罗米修斯》。在比萨与一批流亡意大利的英国友人组成“比萨圈子”。\n- **意义**：创作生涯的巅峰期与核心地理坐标，其最富盛名的作品皆诞生于此。\n\n### 📍 重要地点：威尼斯与莱里奇\n- **时间**：公元1822年\n- **停留时间**：数周\n- **地点**：威尼斯（今意大利威尼托大区威尼斯广域市）；莱里奇（今意大利利古里亚大区拉斯佩齐亚省）\n- **事件**：在威尼斯与拜伦商议创办杂志《自由派》；迁居至拉斯佩齐亚湾畔的莱里奇，准备迎接新的生活与创作。\n- **意义**：当雪莱在意大利的浪涛中迎来生命尽头，伊顿的回响始终萦绕在他心底。那些在课堂角落里写就的诗行、那些与同龄人激烈辩论的夜晚，早已化作他丈量世界的尺度。他用一生去实现少年时在伊顿许下的诺言——推翻暴政、解放人类、用西风唤醒整个春天所，充满了对未来的计划与期待。\n\n### 🔴 去世地：拉斯佩齐亚湾\n- **时间**：公元1822年7月8日\n- **停留时间**：遇难地\n- **地点**：意大利拉斯佩齐亚湾（今意大利利古里亚大区拉斯佩齐亚省）\n- **事件**：乘船从莱里奇前往莱航（今利沃诺）迎接友人，返航途中遭遇风暴，与两名同伴不幸溺亡。\n- **意义**：天才诗人的意外陨落之地。其遗体在海岸火化，骨灰后安葬于罗马新教公墓，墓碑铭文为“众心之心”。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1792 | 菲尔德庄园 | 英国西萨塞克斯郡霍舍姆 | （年龄：0）出生于英格兰萨塞克斯郡菲尔德庄园。 |\n| 1804 | 伊顿公学 | 英国伯克郡温莎和梅登黑德皇家自治市 | （年龄：12）进入伊顿公学就读。 |\n| 1810 | 牛津大学 | 英国牛津郡牛津市 | （年龄：18）进入牛津大学。 |\n| 1811 | 牛津大学 | 英国牛津郡牛津市 | （年龄：19）因《无神论的必然性》被牛津大学开除，与家庭决裂；与哈丽特·韦斯特布鲁克私奔结婚。 |\n| 1812 | 都柏林 | 爱尔兰都柏林郡都柏林市 | （年龄：20）前往都柏林散发传单，支持爱尔兰独立运动。 |\n| 1813 |  |  | （年龄：21）自费出版长诗《麦布女王》，抨击社会制度。 |\n| 1814 |  |  | （年龄：22）与玛丽·戈德温（后来的玛丽·雪莱）私奔至欧洲大陆。 |\n| 1816 | 伯尔尼与日内瓦（瑞士） | 瑞士伯尔尼州伯尔尼市 | （年龄：24）前妻哈丽特投河自尽；与玛丽正式结婚；在瑞士日内瓦结识拜伦。 |\n| 1818 |  |  | （年龄：26）永久移居意大利，开始漂泊的流亡生涯。 |\n| 1819 |  |  | （年龄：27）创作进入巅峰期，完成《西风颂》《解放了的普罗米修斯》等核心作品。 |\n| 1822 | 拉斯佩齐亚湾 | 意大利利古里亚大区拉斯佩齐亚省 | （年龄：29）在意大利拉斯佩齐亚湾遭遇风暴溺亡；遗体火化，骨灰葬于罗马。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《西风颂》**、**《云》**、**《致云雀》**。\n- 核心要点：\n    - **重点**：《西风颂》中“如果冬天来了，春天还会远吗？”是**革命乐观主义**精神的经典表达，以**西风**象征摧毁旧世界、催生新世界的革命力量。\n    - **重点**：《致云雀》以**云雀**为**核心意象**，歌颂了欢乐、光明与对自由的向往，体现了浪漫主义诗歌**托物言志**的典型手法。\n    - 《云》运用丰富的**想象力**和**拟人化**手法，将自然现象（云、雨、雷电）描绘成不知疲倦的变革者和生命的赋予者。\n    - 雪莱诗歌普遍充满**象征主义**色彩，自然景物（风、云、鸟、光）常被赋予深刻的**政治与哲学寓意**。\n    - 其诗歌语言优美，节奏感强，富有**音乐性**，善于运用**倒装**、**重复**等修辞增强气势。\n    - **重点**：雪莱的诗歌理论强调诗歌的**社会功能**，认为诗人是“未经公认的立法者”，其作品应推动社会进步与人类解放。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：因发表**《无神论的必然性》** 被牛津大学开除，是其**激进思想**与**反叛精神**的首次公开宣言。\n    - 前往**爱尔兰**进行政治宣传，是其将**浪漫主义理想**付诸**社会改革实践**的早期尝试。\n    - **重点**：与**拜伦**的交往是英国浪漫主义文学史上的重要事件，两人并称“**恶魔派**”诗人，共同代表了浪漫主义的激进翼。\n    - 其妻**玛丽·雪莱**是科幻小说《弗兰肯斯坦》的作者，两人共同的朋友圈是当时欧洲重要的**知识分子流亡群体**。\n- 核心要点：\n    - **重点**：雪莱生活在**法国大革命**与**拿破仑战争**后的欧洲“**复辟时代**”，其作品充满了对**自由**、**平等**、**博爱**理想的坚持与对**专制压迫**的反抗。\n    - 他的思想融合了**启蒙理性**、**浪漫激情**与**空想社会主义**萌芽，被视为**宪章运动**等后世进步运动的思想先驱。\n    - **重点**：其个人生活（如两次婚姻）在当时保守的英国社会引发巨大争议，成为其被迫**流亡意大利**的重要原因，也反映了**个人自由**与**社会规范**的冲突。\n    - 文学史上，他与**华兹华斯**、**柯勒律治**、**拜伦**并称为英国浪漫主义时期最重要的诗人，但其**政治立场**更为激进，**革命性**更强。\n    - **重点**：意外早逝使其形象**浪漫化**，与拜伦的希腊之死一同成为**浪漫主义英雄**的终极象征，其墓地成为后世瞻仰的圣地。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：菲尔德庄园 | 菲尔德庄园（霍舍姆，西萨塞克斯郡） | 51.0578 | -0.3264 |\n| 重要地点：伊顿公学 | 伊顿公学（温莎） | 51.4872 | -0.6085 |\n| 重要地点：牛津大学 | 牛津大学 | 51.7548 | -1.2544 |\n| 重要地点：伦敦与凯西克（湖区） | 伦敦 | 51.5074 | -0.1278 |\n| 重要地点：都柏林 | 都柏林 | 53.3498 | -6.2603 |\n| 重要地点：伯尔尼与日内瓦（瑞士） | 日内瓦 | 46.2044 | 6.1432 |\n| 重要地点：那不勒斯与罗马 | 罗马 | 41.9028 | 12.4964 |\n| 重要地点：佛罗伦萨与比萨 | 佛罗伦萨 | 43.7696 | 11.2558 |\n| 重要地点：威尼斯与莱里奇 | 比萨 | 43.7228 | 10.4017 |\n| 去世地：拉斯佩齐亚湾 | 莱里奇（拉斯佩齐亚湾） | 44.0747 | 9.9117 |\n|---|---|---|\n| 菲尔德庄园（霍舍姆，西萨塞克斯郡） | 51.0578 | -0.3264 |\n| 伊顿公学（温莎） | 51.4872 | -0.6085 |\n| 牛津大学 | 51.7548 | -1.2544 |\n| 伦敦 | 51.5074 | -0.1278 |\n| 都柏林 | 53.3498 | -6.2603 |\n| 日内瓦 | 46.2044 | 6.1432 |\n| 罗马 | 41.9028 | 12.4964 |\n| 佛罗伦萨 | 43.7696 | 11.2558 |\n| 比萨 | 43.7228 | 10.4017 |\n| 莱里奇（拉斯佩齐亚湾） | 44.0747 | 9.9117 |", "relatedGraph": {"center": {"id": "雪莱", "name": "雪莱", "file": "雪莱.html", "dynasty": "英国浪漫主义时期（18世纪末至19世纪初）", "aliases": [], "birth_year": 1792, "death_year": 1822, "quote": "如果冬天来了，春天还会远吗？", "review": "完成了诗剧《解放了的普罗米修斯》，展现其社会理想。", "foreign_name": "", "main_role_label": "诗人", "birthplace": "英格兰萨塞克斯郡霍舍姆菲尔德庄园", "birthplace_modern": "英国西萨塞克斯郡霍舍姆", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "雪莱", "name": "雪莱", "file": "雪莱.html", "dynasty": "英国浪漫主义时期（18世纪末至19世纪初）", "aliases": [], "birth_year": 1792, "death_year": 1822, "quote": "如果冬天来了，春天还会远吗？", "review": "完成了诗剧《解放了的普罗米修斯》，展现其社会理想。", "foreign_name": "", "main_role_label": "诗人", "birthplace": "英格兰萨塞克斯郡霍舍姆菲尔德庄园", "birthplace_modern": "英国西萨塞克斯郡霍舍姆", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, {"id": "马尔萨斯", "name": "马尔萨斯",
