.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

**的典范。\n    - **重点**：**《如梦令》** 通过“争渡”的生动场景，展现早期**生活情趣**与**清新活泼**的词风。\n    - **重点**：**《醉花阴》** 中“人比黄花瘦”以**黄花**自喻，将**相思之苦**写得含蓄深沉，是“**易安体**”的代表。\n    - **意象**：善用**酒**、**黄花**、**梧桐**、**细雨**等意象营造**愁绪**氛围。\n    - **风格**：前期词风**清丽婉转**，后期词风**沉郁悲怆**，体现**时代巨变**对个人创作的影响。\n    - **手法**：擅长**白描**，语言**浅俗清新**而意境深远。\n    - **情感**：作品贯穿着对**故国**、**往事**的深切怀念与**身世飘零**的悲慨。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活于**两宋之交**，亲身经历**靖康之变**，是**南渡词人**群体的杰出代表。\n    - **重点**：与丈夫赵明诚共同致力于**金石学**研究，所著**《金石录》** 是重要的学术著作。\n    - **南渡**：其人生与创作以**南渡**为界，分为截然不同的两个时期。\n- 核心要点：\n    - **重点**：其生平是**宋代士大夫家庭文化生活**与**女性文学创作**的珍贵个案。\n    - **重点**：词作深刻反映了**宋室南渡**前后**社会动荡**与**文人心态**的变化。\n    - **重点**：提出“**词别是一家**”的观点，强调词的**独立文体地位**与**协律**特性。\n    - **评价**：在**男性主导**的古代文坛中，以其卓越才华获得“**千古第一才女**”与“**词家之冠**”的崇高声誉。\n    - **关系**：其父**李格非**属旧党，公公**赵挺之**属新党，家庭背景使其对**北宋党争**有切身感受。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《如梦令》（常记溪亭日暮）**、**《声声慢》（寻寻觅觅）**、《醉花阴》（薄雾浓云愁永昼）、《武陵春》（风住尘香花已尽）\n- 核心要点：\n    - **重点**：**《声声慢》** 开篇连用七组叠字，被誉为“公孙大娘舞剑手”，极写**孤寂凄惶**之情，是**婉约词**的典范。\n    - **重点**：**《如梦令》** 通过“争渡”的生动场景，展现早期**生活情趣**与**清新活泼**的词风。\n    - **重点**：**《醉花阴》** 中“人比黄花瘦”以**黄花**自喻，将**相思之苦**写得含蓄深沉，是“**易安体**”的代表。\n    - **意象**：善用**酒**、**黄花**、**梧桐**、**细雨**等意象营造**愁绪**氛围。\n    - **风格**：前期词风**清丽婉转**，后期词风**沉郁悲怆**，体现**时代巨变**对个人创作的影响。\n    - **手法**：擅长**白描**，语言**浅俗清新**而意境深远。\n    - **情感**：作品贯穿着对**故国**、**往事**的深切怀念与**身世飘零**的悲慨。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活于**两宋之交**，亲身经历**靖康之变**，是**南渡词人**群体的杰出代表。\n    - **重点**：与丈夫赵明诚共同致力于**金石学**研究，所著**《金石录》** 是重要的学术著作。\n    - **南渡**：其人生与创作以**南渡**为界，分为截然不同的两个时期。\n- 核心要点：\n    - **重点**：其生平是**宋代士大夫家庭文化生活**与**女性文学创作**的珍贵个案。\n    - **重点**：词作深刻反映了**宋室南渡**前后**社会动荡**与**文人心态**的变化。\n    - **重点**：提出“**词别是一家**”的观点，强调词的**独立文体地位**与**协律**特性。\n    - **评价**：在**男性主导**的古代文坛中，以其卓越才华获得“**千古第一才女**”与“**词家之冠**”的崇高声誉。\n    - **关系**：其父**李格非**属旧党，公公**赵挺之**属新党，家庭背景使其对**北宋党争**有切身感受。\n\n---", "workTexts": {"如梦令·常记溪亭日暮": "争渡，争渡，惊起一滩鸥鹭。", "如梦令": "争渡，争渡，惊起一滩鸥鹭。", "常记溪亭日暮": "争渡，争渡，惊起一滩鸥鹭。", "点绛唇·蹴罢秋千": "和羞走，倚门回首，却把青梅嗅。", " ummary": "千古风流八咏楼，江山留与后人愁。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "声声慢·寻寻觅觅": {"title": "声声慢·寻寻觅觅", "aliases": ["声声慢", "寻寻觅觅"], "authors": ["李清照"], "related_people": ["李清照"], "source_pages": ["李清照"], "era": "北宋末至南宋初", "genre": "", "one_liner": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", "summary": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", "quote": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", "quotes": ["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。"], "quote_policy": "preferred"}}, "markdown": "# 李清照\n\n## 人物档案\n\n### 基本信息\n- **姓名**：李清照\n- **号**：易安居士\n- **时代**：北宋末至南宋初\n- **出生**：公元1084年，齐州章丘（今山东省济南市章丘区）。学界对其具体出生地有不同看法，但章丘是主流且可考的说法。\n- **去世**：约公元1155年，临安府（今浙江省杭州市）。卒年与地点为学界普遍接受的说法，但具体细节存疑（另有1156年等说法）。\n- **享年**：约71-72岁\n- **主要身份**：女词人、散文家、文学家\n- **历史地位**：宋代婉约派代表词人，被誉为“千古第一才女”，亦常被视为“词家之冠”。\n- **主要成就**：1. 开创“易安体”，词作语言清丽典雅，情感真挚深沉代表作《声声慢》《如梦令》《一剪梅》《醉花阴》《武陵春》等；2. 提出“词别是一家”的词学理论；3. 在诗、文方面亦有建树，留存《金石录后序》等名篇；4. 与赵明诚共同从事金石碑刻、书籍字画的搜集整理；5. 其作品是宋词南渡前后历史变迁与个人命运交织的珍贵记录。\n\n### 生平概述\n李清照（1084年—约1155年），号易安居士，是中国宋代著名的女词人和散文家，也是中国文学史上最杰出的女性作家之一。她被誉为“千古第一才女”，亦常被称为“词家之冠”，在中国文学史上占有重要地位。她的创作生涯跨越北宋与南宋两个时期，生活在两宋之交这一战乱频仍的时代，时代巨变深刻影响了她的创作轨迹。早年生于书香门第，生活优裕，与丈夫赵明诚共同致力于金石碑刻、书籍字画的搜集、整理与研究，收藏极为丰富，词作多写闺中雅趣、自然景物与相思情怀，如“知否，知否？应是绿肥红瘦”等名句至今仍广为传诵。靖康之变后，金兵南侵、北宋灭亡，她被迫南渡，经历丈夫病故、珍藏文物散失等重大打击，晚年漂泊江南，词风转为沉郁悲凉，深刻抒发对故国的思念、离乱的哀愁与身世飘零之悲。她的词风婉约，善于运用白描手法，语言清丽，意境深远，并以女性独特的视角和细腻情感突破了传统文人词的某些局限。尽管传世作品仅以残篇形式流传，但其原创性、艺术价值与文学地位至今仍备受推崇。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从山东故乡出发，南渡至江浙地区，最终定居临安（今杭州），足迹主要覆盖今山东、河南、江苏、浙江等省。\n- ⏱️ **时间跨度**：约公元1084年 - 约公元1155年，总跨度约71-72年。\n- 📍 **地理范围**：主要覆盖今山东省、河南省、江苏省、浙江省。\n- 🌟 **重要节点数量**：核心地点10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：章丘\n- **时间**：公元1084年\n- **停留时间**：童年时期\n- **地点**：齐州章丘（今山东省济南市章丘区）\n- **事件**：出生于士大夫家庭，父亲李格非为“苏门后四学士”之一，家学渊源深厚。\n- **意义**：书香门第出身，父亲李格非名列\"后四学士\"，母亲亦工文章。李清照自幼遍读诗书，琴棋书画兼修，早年才情已露锋芒，这份家学渊源悄然为她日后\"词压江南\"的传奇埋下第一颗种子\n\n### 📍 重要地点：汴京\n- **时间**：约公元1101年前后\n- **停留时间**：数年\n- **地点**：汴京（今河南省开封市）\n- **事件**：与太学生赵明诚成婚。婚后共同校勘古籍，鉴赏金石书画，生活高雅和谐。\n- **意义**：约绍兴二十五年，一代词宗李清照在江南悄然辞世。这位从汴京走出的绝世才女，至死未能回到魂牵梦萦的故土，她的词作却穿越时空，与李煜、辛弃疾并立于宋代词坛之巅\n- **名篇名句**：《如梦令·常记溪亭日暮》：“争渡，争渡，惊起一滩鸥鹭。”；《点绛唇·蹴罢秋千》：“和羞走，倚门回首，却把青梅嗅。”\n\n### 📍 重要地点：青州\n- **时间**：约公元1107年 - 公元1127年\n- **停留时间**：约20年\n- **地点**：青州（今山东省潍坊市青州市）\n- **事件**：因党争，随赵明诚屏居乡里。夫妇二人将居所命名为“归来堂”，致力于搜集、校勘金石文物，完成《金石录》初稿。此时期生活相对宁静。\n- **意义**：金人铁蹄之下，半壁江山易主，她半生心血——金石书画与丈夫遗稿——皆散落于南渡的颠沛途中。肉体虽迟至临安才闭目，但汴京的陷落，已是她作为词人与妻子的真正死地\n- **名篇名句**：《一剪梅·红藕香残玉簟秋》：“此情无计可消除，才下眉头，却上心头。”；《醉花阴·薄雾浓云愁永昼》：“莫道不销魂，帘卷西风，人比黄花瘦。”\n\n### 📍 重要地点：莱州\n- **时间**：约公元1121年\n- **停留时间**：短暂\n- **地点**：莱州（今山东省烟台莱州市）\n- **事件**：赵明诚任莱州知府，李清照前往相聚。\n- **意义**：金人铁蹄之下，半壁江山易主，她半生心血——金石书画与丈夫遗稿——皆散落于南渡的颠沛途中。肉体虽迟至临安才闭目，但汴京的陷落，已是她作为词人与妻子的真正死地\n- **名篇名句**：《蝶恋花·泪湿罗衣脂粉满》：“惜别伤离方寸乱，忘了临行，酒盏深和浅。”\n\n### 📍 重要地点：建康\n- **时间**：公元1129年\n- **停留时间**：数月\n- **地点**：建康（今江苏省南京市）\n- **事件**：赵明诚于赴任湖州途中病逝于此。李清照悲痛欲绝，大病一场。时值金兵南下，局势危急。\n- **意义**：都城陷落，于她不只是国破，更是整个人生的崩塌。此后颠沛江南数十年，晚景凄凉、再嫁风波、文稿零落，一代词宗最终在临安悄然辞世，魂牵梦萦的故土，至死未能北归\n- **名篇名句**：《夏日绝句》：“生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。”\n\n### 📍 重要地点：越州\n- **时间**：约公元1130年 - 公元1131年\n- **停留时间**：流寓期间\n- **地点**：越州（今浙江省绍兴市）\n- **事件**：为躲避战乱和追查，携带部分文物颠沛流离于浙东地区，曾居于越州。\n- **意义**：约绍兴二十五年，一代词宗李清照在江南悄然辞世。这位从汴京走出的绝世才女，至死未能回到魂牵梦萦的故土，她的词作却穿越时空，与李煜、辛弃疾并立于宋代词坛之巅\n\n### 📍 重要地点：台州\n- **时间**：约公元1130年 - 公元1131年\n- **停留时间**：流寓期间\n- **地点**：台州（今浙江省台州市）\n- **事件**：为躲避战乱和追查，携带部分文物颠沛流离于浙东地区，曾经过或暂居台州。\n- **意义**：约绍兴二十五年，一代词宗李清照在江南悄然辞世。这位从汴京走出的绝世才女，至死未能回到魂牵梦萦的故土，她的词作却穿越时空，与李煜、辛弃疾并立于宋代词坛之巅\n\n### 📍 重要地点：杭州（再嫁风波）\n- **时间**：约公元1132年\n- **停留时间**：短暂\n- **地点**：临安府（今浙江省杭州市）\n- **事件**：暂居杭州，曾再嫁张汝舟，后因发现其品行不端而迅速离异，并因此事入狱（后获释）。此事在当时引起非议。\n- **意义**：约绍兴二十五年，一代词宗李清照在江南悄然辞世。这位从汴京走出的绝世才女，至死未能回到魂牵梦萦的故土，她的词作却穿越时空，与李煜、辛弃疾并立于宋代词坛之巅\n\n### 📍 重要地点：金华\n- **时间**：约公元1134年 - 公元1135年\n- **停留时间**：约一年\n- **地点**：婺州金华（今浙江省金华市）\n- **事件**：避乱居金华，常登“八咏楼”眺望。写下记录生平与文物散失经过的《金石录后序》。\n- **意义**：约绍兴二十五年，一代词宗李清照在江南悄然辞世。这位从汴京走出的绝世才女，至死未能回到魂牵梦萦的故土，她的词作却穿越时空，与李煜、辛弃疾并立于宋代词坛之巅回顾与总结。\n- **名篇名句**：《武陵春·春晚》：“只恐双溪舴艋舟，载不动许多愁。”；《题八咏楼》：“千古风流八咏楼，江山留与后人愁。”\n\n### 🔴 去世地：杭州（晚年定居）\n- **时间**：约公元1155年\n- **停留时间**：晚年约二十年\n- **地点**：临安府（今浙江省杭州市）\n- **事件**：在孤寂中度过晚年，具体事迹不详。应卒于杭州。\n- **意义**：都城陷落，于她不只是国破，更是整个人生的崩塌。此后颠沛江南数十年，晚景凄凉、再嫁风波、文稿零落，一代词宗最终在临安悄然辞世，魂牵梦萦的故土，至死未能北归\n- **名篇名句**：《声声慢·寻寻觅觅》：“寻寻觅觅，冷冷清清，凄凄惨惨戚戚。”\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1084年 | 章丘 | 山东省济南市章丘区 | （年龄：1岁）生于齐州章丘。 |\n| 约1101年 | 汴京 | 河南省开封市 | （年龄：约18岁）嫁与赵明诚，居汴京。 |\n| 约1107年 | 青州 | 山东省潍坊市青州市 | （年龄：约24岁）随夫屏居青州，开始“归来堂”生活。 |\n| 1127年 |  |  | （年龄：43岁）靖康之变，北宋灭亡。开始南渡。 |\n| 1129年 | 建康 | 江苏省南京市 | （年龄：46岁）丈夫赵明诚病逝于建康。 |\n| 1130-1131年 | 越州 | 浙江省绍兴市 | （年龄：47-48岁）流寓越州、台州，文物散失严重。 |\n| 1132年 |  |  | （年龄：49岁）再嫁张汝舟，旋即离异并入狱。 |\n| 1134年 | 金华 | 浙江省金华市 | （年龄：51岁）避乱居金华，作《金石录后序》。 |\n| 约1155年 | 杭州（晚年定居） | 浙江省杭州市 | （年龄：约71-72岁）约卒于临安。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《如梦令》（常记溪亭日暮）**、**《声声慢》（寻寻觅觅）**、《醉花阴》（薄雾浓云愁永昼）、《武陵春》（风住尘香花已尽）\n- 核心要点：\n    - **重点**：**《声声慢》** 开篇连用七组叠字，被誉为“公孙大娘舞剑手”，极写**孤寂凄惶**之情，是**婉约词**的典范。\n    - **重点**：**《如梦令》** 通过“争渡”的生动场景，展现早期**生活情趣**与**清新活泼**的词风。\n    - **重点**：**《醉花阴》** 中“人比黄花瘦”以**黄花**自喻，将**相思之苦**写得含蓄深沉，是“**易安体**”的代表。\n    - **意象**：善用**酒**、**黄花**、**梧桐**、**细雨**等意象营造**愁绪**氛围。\n    - **风格**：前期词风**清丽婉转**，后期词风**沉郁悲怆**，体现**时代巨变**对个人创作的影响。\n    - **手法**：擅长**白描**，语言**浅俗清新**而意境深远。\n    - **情感**：作品贯穿着对**故国**、**往事**的深切怀念与**身世飘零**的悲慨。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活于**两宋之交**，亲身经历**靖康之变**，是**南渡词人**群体的杰出代表。\n    - **重点**：与丈夫赵明诚共同致力于**金石学**研究，所著**《金石录》** 是重要的学术著作。\n    - **南渡**：其人生与创作以**南渡**为界，分为截然不同的两个时期。\n- 核心要点：\n    - **重点**：其生平是**宋代士大夫家庭文化生活**与**女性文学创作**的珍贵个案。\n    - **重点**：词作深刻反映了**宋室南渡**前后**社会动荡**与**文人心态**的变化。\n    - **重点**：提出“**词别是一家**”的观点，强调词的**独立文体地位**与**协律**特性。\n    - **评价**：在**男性主导**的古代文坛中，以其卓越才华获得“**千古第一才女**”与“**词家之冠**”的崇高声誉。\n    - **关系**：其父**李格非**属旧党，公公**赵挺之**属新党，家庭背景使其对**北宋党争**有切身感受。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 济南市章丘区 | 36.708 | 117.527 |\n| 开封市 | 34.797 | 114.307 |\n| 青州市 | 36.685 | 118.479 |\n| 莱州市 | 37.178 | 119.942 |\n| 南京市 | 32.060 | 118.797 |\n| 绍兴市 | 30.002 | 120.581 |\n| 台州市 | 28.656 | 121.421 |\n| 杭州市 | 30.274 | 120.155 |\n| 金华市 | 29.079 | 119.647 |\n", "relatedGraph": {"center": {"id": 228, "name": "李清照", "file": "李清照.html", "dynasty": "北宋末至
