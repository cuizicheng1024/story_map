  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {
  font-weight: 600;
  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {
  filter: saturate(1.08);
}
.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {
  transform: translateY(-1px);

   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */

  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

中阶段\n- **艺术史地位**：**后印象派**三杰之一（与塞尚、高更并列），被视为**表现主义**的先驱。\n- **风格演变**：早期（荷兰）色调**阴暗**（如《吃土豆的人》）；**巴黎时期**受**印象派**和**日本浮世绘**影响，色彩变亮；**阿尔勒及以后**形成独特风格。\n- **创作理念**：用色彩和线条**直接表达内心激情与精神世界**，艺术是“表现”而非“再现”。\n- **重要关系**：与弟弟**提奥**的书信是研究其艺术思想的核心文献；与**高更**的友谊与冲突是其人生转折点。\n- **代表作分析**：《星月夜》中**旋涡状的星空**、**火焰般的柏树**是其内心动荡与宇宙观的象征。\n- **历史影响**：对**德国表现主义**（如基希纳）、**野兽派**（如马蒂斯）产生直接影响。\n- **易混点**：**后印象派**并非“印象派之后”，而是对印象派“重客观光色”的反拨，强调**主观表现**和**形式结构**。\n\n---","examPoints": "### 初中阶段考点\n1.  **国籍**：荷兰。\n2.  **艺术流派**：后印象派。\n3.  **代表作品**：《向日葵》、《星月夜》。\n4.  **艺术特点**：色彩大胆、对比强烈，笔触明显，富有情感。\n5.  **人生关键词**：贫困、精神病、割耳、自杀、弟弟提奥。\n6.  **作品识别**：能辨认其画作的典型风格（如厚重的笔触、明亮的黄色）。\n\n### 高中阶段考点\n1.  **艺术史定位**：后印象派代表，表现主义先驱。\n2.  **风格分期与成因**：荷兰时期、巴黎时期、阿尔勒-圣雷米时期的风格变化及原因（印象派、浮世绘影响）。\n3.  **核心艺术观**：强调主观情感和精神世界的表达。\n4.  **重要关系**：与提奥的经济与精神纽带；与高更的合作与决裂。\n5.  **代表作内涵分析**：《星月夜》、《夜间咖啡馆》等作品中的象征意义与情感表达。\n6.  **对后世的影响**：对20世纪现代艺术流派（表现主义、野兽派）的启发。\n7.  **存疑/说法不一**：割耳的具体原因（与高更争吵自残/高更割伤后包庇）；死亡是自杀还是意外枪击。","workTexts": {"吃土豆的人": "我想表达的是，这些在油灯下吃土豆的人，正是用他们那双挖掘泥土的手，去挖掘食物的。","唐吉老爹": "色彩本身就表达某种东西。","夜间咖啡馆": "我试图用红色和绿色来表现人类可怕的激情。","星月夜": "望着星星，我总是开始做梦……我问自己，为什么天空中闪亮的点，不能像法国地图上的黑点那样容易到达呢？","麦田群鸦": "我的悲伤将永远留存。","圣经": "意义：博里纳日矿区山谷里，年轻的梵高怀抱《圣经》走进矿工漆黑的棚屋。","向日葵": "| 1888 | 阿尔勒 | 法国南部普罗旺斯阿尔勒 | （年龄：35）移居阿尔勒，创作《向日葵》系列，邀请高更。","红色葡萄园": "“疯子”"},"workSummaries": {"星月夜": {"title": "星月夜","aliases": [],"authors": ["梵高","文森特·威廉·梵高"],"related_people": ["梵高"],"source_pages": ["梵高"],"era": "19世纪（后印象派时期）","genre": "油画","one_liner": "梵高在圣雷米精神病院疗养期间创作的油画代表作，以旋涡状笔触描绘了繁星闪烁的夜空与宁静村庄，火焰般的柏树直冲云霄，是后印象派与表现主义的巅峰之作。","summary": "望着星星，我总是开始做梦……我问自己，为什么天空中闪亮的点，不能像法国地图上的黑点那样容易到达呢？","quote": "《星月夜》（创作于圣雷米，灵感部分源于阿尔勒）：“我需要太阳，它把我内心的寒冷驱散，把我的阴影染成金色。","quotes": ["《星月夜》（创作于圣雷米，灵感部分源于阿尔勒）：“我需要太阳，它把我内心的寒冷驱散，把我的阴影染成金色。","望着星星，我总是开始做梦……我问自己，为什么天空中闪亮的点，不能像法国地图上的黑点那样容易到达呢？","据不同统计，一生创作了约2000幅作品，包括约860幅油画，如《星月夜》《向日葵》系列等。"],"quote_policy": "preferred"},"向日葵": {"title": "向日葵","aliases": [],"authors": ["梵高","文森特·威廉·梵高"],"related_people": ["梵高"],"source_pages": ["梵高"],"era": "19世纪（后印象派时期）","genre 出生**：1853年3月30日，荷兰北布拉班特省津德尔特\n- **去世**：1890年7月29日，法国瓦兹河畔奥维尔\n- **享年**：37岁\n- **主要身份**：画家、后印象派先驱\n- **历史地位**：对20世纪艺术发展产生深远影响的先驱，其艺术与人生成为现代艺术精神的象征。\n- **主要成就**：开创表现主义先河，深刻影响现代艺术；据不同统计，一生创作了约2000幅作品，包括约860幅油画，如《星月夜》《向日葵》系列等。（注：其在生命最后约70天于奥维尔创作了约70幅作品。）\n\n### 生平概述\n梵高出生于荷兰，早年曾从事画商、教师、传教士等职业，生活坎坷。27岁时决心投身绘画，早期作品色调阴暗。1886年前往巴黎，接触印象派与日本浮世绘，画风变得明亮、色彩丰富。1888年移居法国南部阿尔勒，迎来创作高峰，但与画家高更关系破裂，精神崩溃并割下部分耳朵。此后在圣雷米精神病院治疗期间仍坚持创作，作品充满强烈的情感与旋涡般的笔触。1890年7月27日，在瓦兹河畔奥维尔腹部中枪（自杀或意外枪击，说法不一），两日后去世，结束了短暂而炽热的一生。他的艺术在其生前几乎无人问津，却在身后成为不朽经典。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从荷兰到英国、比利时，最终在法国南部与巴黎地区完成艺术蜕变。\n- ⏱️ **时间跨度**：1853年 - 1890年，共37年。\n- 📍 **地理范围**：荷兰、英国、比利时、法国。\n- 🌟 **重要节点数量**：10个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：津德尔特\n- **公元纪年**：1853年 - 1869年\n- **停留时间**：童年及青少年早期（约16年）\n- **位置**：荷兰北布拉班特省津德尔特（Groot-Zundert）\n- **事迹**：在此度过童年，父亲是当地牧师。自然环境与乡村景象成为其早期艺术灵感的来源。\n- **意义**：博里纳日矿区山谷里，年轻的梵高怀抱《圣经》走进矿工漆黑的棚屋。他将衣食分给穷人却被教会辞退，宗教理想的破灭，反点燃了用画笔救赎众生的另一团火\n\n### 📍 重要地点：海牙\n- **公元纪年**：1869年 - 1873年；1881年 - 1883年\n- **停留时间**：首次作为画店学徒约4年；第二次作为画家定居约2年\n- **位置**：荷兰海牙（Den Haag）\n- **事迹**：在古皮尔画店工作，首次接触艺术市场；后跟随亲戚安东·莫夫学画，开始早期创作，并与模特西恩（Sien）共同生活。\n- **意义**：海牙的悲剧并非结尾，而是漫长苦难的第一声轰鸣。家庭的拒绝、爱情的破碎、社会的冷眼，在他身后缓缓合拢，铸成他日后举世皆惊的孤独——也铸成那震颤的星空与翻涌的麦田\n- **名篇名句**：《吃土豆的人》：“我想表达的是，这些在油灯下吃土豆的人，正是用他们那双挖掘泥土的手，去挖掘食物的。”\n\n### 📍 重要地点：伦敦\n- **公元纪年**：1873年 - 1876年\n- **停留时间**：约3年\n- **位置**：英国伦敦（London）\n- **事迹**：在古皮尔画店伦敦分店工作，广泛参观博物馆，深受英国文学与艺术影响。单相思房东女儿失败，情感受挫。\n- **意义**：梵高艺术之路的真正起点。1869年他在此进入古皮尔画廊，第一次被印象派的光影击中；1881年重返师从莫夫执起画笔，却因收留街头妓女西恩而被家族放逐。这双重际遇——艺术的启蒙与亲情的断裂——让他此后所有的金色都带着一种被遗弃者的体温\n\n### 📍 重要地点：博里纳日矿区\n- **公元纪年**：1878年 - 1880年\n- **停留时间**：约2年\n- **位置**：比利时埃诺省蒙斯区博里纳日（Borinage, Hainaut）\n- **事迹**：作为传教士在贫困矿区工作，与矿工同甘共苦，因过度虔诚被教会解雇。目睹底层苦难，决心用艺术为穷人发声。\n- **意义**：人生观与艺术观的决定性转折点，坚定了成为“农民画家”的决心。\n- **名篇名句**：致弟弟提奥的信：“我将全力以赴，用画笔来表达我内心深处的情感。”\n\n### 📍 重要地点：巴黎\n- **公元纪年**：1886年2月 - 1888年2月\n- **停留时间**：约2年\n- **位置**：法国巴黎（Paris）\n- **事迹**：与弟弟提奥同住，进入科尔蒙画室学习，结识高更、劳特累克、贝尔纳等艺术家。深受印象派、新印象派及日本浮世绘影响，画风从灰暗转向明亮，色彩革命开始。\n- **意义**：梵高艺术之路的真正起点。1869年他在此进入古皮尔画廊，第一次被印象派的光影击中；1881年重返师从莫夫执起画笔，却因收留街头妓女西恩而被家族放逐。这双重际遇——艺术的启蒙与亲情的断裂——让他此后所有的金色都带着一种被遗弃者的体温型期，从荷兰写实主义走向现代艺术。\n- **名篇名句**：《唐吉老爹》：“色彩本身就表达某种东西。”\n\n### 📍 重要地点：阿尔勒\n- **公元纪年**：1888年2月 - 1889年5月\n- **停留时间**：约1年3个月\n- **位置**：法国南部普罗旺斯阿尔勒（Arles）\n- **事迹**：为追寻南方阳光而移居，创作力爆发，绘制了《向日葵》《夜间咖啡馆》《阿尔勒的卧室》等杰作。邀请高更同住，梦想建立“南方画室”，但两人激烈争吵，导致梵高精神崩溃，发生“割耳事件”。\n- **意义**：当梵高被叔父召回、被表姐拒之门外、被亲属逼着在西恩与\"体面\"之间做抉择，他所期待的寻常人生便在此彻底落幕。唯有弟弟提奥按月寄来的汇款，成为他继续执笔的最后绳索\n- **名篇名句**：《星月夜》（创作于圣雷米，灵感部分源于阿尔勒）：“我需要太阳，它把我内心的寒冷驱散，把我的阴影染成金色。”；《夜间咖啡馆》：“我试图用红色和绿色来表现人类可怕的激情。”\n\n### 📍 重要地点：圣保罗疗养院（圣雷米）\n- **公元纪年**：1889年5月 - 1890年5月\n- **停留时间**：约1年\n- **位置**：法国普罗旺斯圣雷米-德普罗旺斯（Saint-Rémy-de-Provence）\n- **事迹**：自愿入住精神病院，在病情间歇期坚持创作。作品充满旋涡般的笔触与强烈的情感表达，如《鸢尾花》《星月夜》《柏树》系列。\n- **意义**：在精神痛苦中达到艺术表现的巅峰，作品开始蕴含象征性与表现主义色彩。\n- **名篇名句**：《星月夜》：“望着星星，我总是开始做梦……我问自己，为什么天空中闪亮的点，不能像法国地图上的黑点那样容易到达呢？”\n\n### 📍 重要地点：瓦兹河畔奥维尔\n- **公元纪年**：1890年5月 - 1890年7月\n- **停留时间**：约70天\n- **位置**：法国法兰西岛大区瓦兹河谷省奥维尔（Auvers-sur-Oise）\n- **事迹**：在加歇医生监护下疗养并疯狂创作，画了约70幅作品，包括《加歇医生像》《奥维尔教堂》《麦田群鸦》。7月27日，在麦田中腹部中枪（自杀或意外枪击，说法不一），两日后在旅馆去世。\n- **意义**：梵高艺术之路的真正起点。1869年他在此进入古皮尔画廊，第一次被印象派的光影击中；1881年重返师从莫夫执起画笔，却因收留街头妓女西恩而被家族放逐。这双重际遇——艺术的启蒙与亲情的断裂——让他此后所有的金色都带着一种被遗弃者的体温\n- **名篇名句**：《麦田群鸦》：“我的悲伤将永远留存。”\n\n### 🔴 去世地：拉乌旅馆（奥维尔）\n- **公元纪年**：1890年7月29日\n- **停留时间**：去世前约两天（受伤后返回旅馆）\n- **位置**：法国瓦兹河畔奥维尔（Auvers-sur-Oise）拉乌旅馆（Auberge Ravoux）\n- **经过**：7月27日傍晚在麦田腹部中枪（自杀或意外枪击，说法不一），负伤后走回旅馆。弟弟提奥闻讯赶来，梵高在其怀中于7月29日凌晨去世。\n- **意义**：当梵高被叔父召回、被表姐拒之门外、被亲属逼着在西恩与\"体面\"之间做抉择，他所期待的寻常人生便在此彻底落幕。唯有弟弟提奥按月寄来的汇款，成为他继续执笔的最后绳索\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1853 | 津德尔特 | 荷兰北布拉班特省津德尔特 | （年龄：0）出生于荷兰津德尔特。 |\n| 1869 | 海牙 | 荷兰海牙 | （年龄：16）进入海牙古皮尔画店工作，接触艺术商业。 |\n| 1873 | 伦敦 | 英国伦敦 | （年龄：20）调往伦敦分店，艺术视野大开，情感受挫。 |\n| 1876 |  |  | （年龄：23）被解雇，辗转英国和荷兰做教师、书店店员。 |\n| 1878 | 博里纳日矿区 | 比利时埃诺省蒙斯区博里纳日 | （年龄：25）前往比利时博里纳日矿区传教，决心投身艺术。 |\n| 1880 |  |  | （年龄：27）正式决定成为画家，前往布鲁塞尔学习（短暂学习，未列入重要地点）。 |\n| 1881 | 海牙 | 荷兰海牙 | （年龄：28）回到埃顿和海牙，向莫夫学画，与西恩同居。 |\n| 1885 |  |  | （年龄：32）父亲去世，创作《吃土豆的人》。 |\n| 1886 | 巴黎 | 法国巴黎
