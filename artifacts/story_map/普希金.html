  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

会思潮的影响。\n    - 因写作歌颂自由的诗歌，曾两次被沙皇政府**流放**（南俄、米哈伊洛夫斯科耶村），一生处于**专制政府的监视与迫害**之下。\n    - **重点**：1837年，因维护妻子名誉与法国保皇党人丹特斯**决斗身亡**，这一事件成为俄国社会与专制制度矛盾激化的标志性事件之一。\n- 核心要点：\n    - **重点**：普希金是**俄国民族文学**的真正奠基人，他结束了俄国文学对西欧的模仿，确立了**独立的民族风格**与**现实主义方向**。\n    - 他的作品广泛涉及**俄国历史**（如《鲍里斯·戈都诺夫》《上尉的女儿》）、**社会现实**与**人民生活**，具有强烈的**民族意识**与**历史深度**。\n    - **重点**：高尔基称他为“**俄国文学之祖**”，其创作成为后世所有俄国伟大作家（如果戈理、陀思妥耶夫斯基、托尔斯泰）的**共同源头**与**精神导师**。\n    - 其个人命运与创作，集中体现了俄国**贵族知识分子**在时代转型期的**探索、抗争与悲剧性**。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《假如生活欺骗了你》**（普希金诗作，中文译文）、**《致大海》**、《叶甫盖尼·奥涅金》（节选）、《我曾经爱过你》。\n- 核心要点：\n    - **重点**：**《假如生活欺骗了你》** 以劝慰口吻阐述了积极乐观的人生态度，语言平实而哲理深刻，是**哲理抒情诗**的典范。\n    - **重点**：**《致大海》** 将大海塑造为**自由精神**的象征，通过告别大海的抒情，表达了诗人对**反抗专制**、追求自由的坚定信念，运用了**象征**与**直抒胸臆**的手法。\n    - **《叶甫盖尼·奥涅金》** 塑造了俄国文学史上第一个“**多余人**”形象奥涅金，反映了19世纪初俄国贵族青年的**精神苦闷**与**社会疏离**。\n    - **重点**：普希金的诗歌语言**简洁、优美、富有音乐性**，他成功地将**民间口语**与**文学语言**融合，奠定了**俄国现代标准语**的基础。\n    - 其爱情诗（如《我曾经爱过你》）情感真挚、含蓄深沉，展现了**崇高而克制的爱**的境界。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：普希金生活在**俄国农奴制危机**日益加深、**欧洲启蒙思想**广泛传播的时代，其思想与创作深受**十二月党人**起义前后社会思潮的影响。\n    - 因写作歌颂自由的诗歌，曾两次被沙皇政府**流放**（南俄、米哈伊洛夫斯科耶村），一生处于**专制政府的监视与迫害**之下。\n    - **重点**：1837年，因维护妻子名誉与法国保皇党人丹特斯**决斗身亡**，这一事件成为俄国社会与专制制度矛盾激化的标志性事件之一。\n- 核心要点：\n    - **重点**：普希金是**俄国民族文学**的真正奠基人，他结束了俄国文学对西欧的模仿，确立了**独立的民族风格**与**现实主义方向**。\n    - 他的作品广泛涉及**俄国历史**（如《鲍里斯·戈都诺夫》《上尉的女儿》）、**社会现实**与**人民生活**，具有强烈的**民族意识**与**历史深度**。\n    - **重点**：高尔基称他为“**俄国文学之祖**”，其创作成为后世所有俄国伟大作家（如果戈理、陀思妥耶夫斯基、托尔斯泰）的**共同源头**与**精神导师**。\n    - 其个人命运与创作，集中体现了俄国**贵族知识分子**在时代转型期的**探索、抗争与悲剧性**。\n\n---", "workTexts": {"皇村回忆": "沉郁的夜的帷幕，悬挂在轻睡的天穹……", "致恰达耶夫": "我们正忍受着期待的折磨，在那神圣的缪斯面前……", "叶甫盖尼·奥涅金": "活得匆忙，来不及感受。", "叶甫盖尼": "活得匆忙，来不及感受。", "奥涅金": "活得匆忙，来不及感受。", "我曾经爱过你": "我曾经爱过你：爱情，也许，在我的心灵里还没有完全消亡。", "别尔金小说集·驿站长": "十四品文官，驿站的独裁者。", "别尔金小说集": "十四品文官，驿站的独裁者。", "驿站长": "十四品文官，驿站的独裁者。", "纪念碑": "我为自己建立了一座非人工的纪念碑，在人们走向那儿的路上，青草不再生长。", "致大海": "“再见吧，自由奔放的大海！这是我最后一次在你面前……”", "上尉的女儿": "意义：收集了大量创作素材，激发了新的灵感，为其后期散文创作（如《上尉的女儿》）积累了经验。", "自由颂": "| 1820 | | | （年龄 而哲理深刻，是哲理抒情诗的典范。"], "quote_policy": "preferred"}}, "markdown": "# 普希金\n\n## 人物档案\n\n### 基本信息\n- **姓名**：亚历山大·谢尔盖耶维奇·普希金\n- **时代**：俄罗斯帝国（19世纪上半叶）\n- **出生**：公元1799年6月6日，莫斯科（今俄罗斯莫斯科）\n- **去世**：公元1837年2月10日，圣彼得堡（今俄罗斯圣彼得堡）\n- **享年**：37岁（按周岁计算）\n- **主要身份**：诗人、作家、剧作家\n- **历史地位**：俄国现代文学的奠基人，被誉为“俄国文学之父”。\n- **主要成就**：创立了俄国现代文学语言；创作了诗体小说《叶甫盖尼·奥涅金》、历史剧《鲍里斯·戈都诺夫》、长篇小说《上尉的女儿》等不朽杰作；其作品深刻反映了俄国社会转型期的思想与矛盾。\n\n### 生平概述\n普希金出生于莫斯科一个没落的贵族家庭，自幼受到良好的法式教育与民间文学熏陶。他在皇村学校求学期间崭露诗才，毕业后进入彼得堡的外交部任职，同时积极投身文学创作，以其反专制、歌颂自由的诗歌闻名。因思想激进，他屡遭沙皇政府的流放与监视。他的创作生涯贯穿诗歌、小说、戏剧等多种体裁，将俄国文学提升至世界高度。最终，他因一场涉及妻子名誉的决斗而重伤去世，其早逝震动了整个俄国。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要集中在俄罗斯欧洲部分，从政治文化中心莫斯科、圣彼得堡，到南方流放地高加索、克里米亚，再到北方的幽禁地与著名的“波尔金诺之秋”所在地。\n- ⏱️ **时间跨度**：1799年 - 1837年（约37年）\n- 📍 **地理范围**：俄罗斯帝国核心区域（今俄罗斯、摩尔多瓦、乌克兰等地）。\n- 🌟 **重要节点数量**：10个\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：莫斯科\n- **时间**：1799年\n- **停留时间**：童年早期\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：出生于贵族家庭，童年由法国家庭教师和农奴保姆分别教导，接触了上流社会文化与民间故事。\n- **意义**：奶娘炉边的民间故事与法籍教师传授的欧洲经典在此交汇，织成一片丰沛而奇异的文化光谱。正是在这看似寻常的童年土壤里，宫廷的典雅韵律与民间的鲜活语汇悄然融合，为他日后将两种血脉熔于一炉的诗学抱负埋下最早的种子\n\n### 📍 重要地点：皇村（皇村学校）\n- **时间**：1811年 - 1817年\n- **停留时间**：6年\n- **地点**：皇村（今俄罗斯普希金市）\n- **事件**：进入皇村学校学习，期间创作了大量诗歌，并在1815年的公开考试上朗诵《皇村回忆》，一举成名。1814年，在《欧洲导报》发表第一首诗《致诗友》。\n- **意义**：接受了系统的古典教育，结识了未来十二月党人等进步青年，自由思想开始萌芽。\n- **名篇名句**：《皇村回忆》：“沉郁的夜的帷幕，悬挂在轻睡的天穹……”\n\n### 📍 重要地点：圣彼得堡（外交部任职与早期创作）\n- **时间**：1817年 - 1820年\n- **停留时间**：约3年\n- **地点**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：在外交部任职，同时成为文学团体“绿灯社”成员，创作了《自由颂》《致恰达耶夫》等充满反抗精神的诗歌。\n- **意义**：其自由思想诗歌广泛传播，引起沙皇政府的警觉与不满，为后续流放埋下伏笔。\n- **名篇名句**：《致恰达耶夫》：“我们正忍受着期待的折磨，在那神圣的缪斯面前……”\n\n### 📍 重要地点：基希讷乌（第一次流放）\n- **时间**：1820年 - 1823年\n- **停留时间**：约3年\n- **地点**：基希讷乌（今摩尔多瓦基希讷乌）\n- **事件**：因诗歌触怒当局，被“调任”至南俄殖民总督办公厅，实为流放。期间游历高加索和克里米亚，创作了长诗《高加索的俘虏》《巴赫切萨拉伊的泪泉》。\n- **意义**：南方的自然风光与浪漫气息深刻影响其创作风格，使其进入“浪漫主义”创作高峰。\n- **名篇名句**：此时期创作的诗歌包括《高加索的俘虏》《巴赫切萨拉伊的泪泉》等。\n\n### 📍 重要地点：敖德萨（第二次流放的开端）\n- **时间**：1823年 - 1824年\n- **停留时间**：约1年\n- **地点**：敖德萨（今乌克兰敖德萨）\n- **事件**：调任至敖德萨总督麾下，但因与总督关系恶化，并继续写作反专制诗歌，被革除公职。\n- **意义**：六年封闭的皇家学府生活在繁文缛节与宪兵窥伺的阴翳中度过，少年普希金在此被锻造成诗人，反叛的火焰却也愈燃愈烈。离开皇村并未迎来真正的自由，反而将他推入更遥远、更严酷的南方流放，命运的枷锁在此悄然收紧。\n\n### 📍 重要地点：米哈伊洛夫斯科耶村（幽禁与创作高峰）\n- **时间**：1824年 - 1826年\n- **停留时间**：约2年\n- **地点**：米哈伊洛夫斯科耶村（今俄罗斯普斯科夫州）\n- **事件**：被遣送至家族领地，由当地教会监视。期间深入研究俄国历史与民间文学，完成了诗体小说《叶甫盖尼·奥涅金》的核心章节、历史剧《鲍里斯·戈都诺夫》。\n- **意义**：在孤独中沉潜，创作思想与艺术手法臻于成熟，实现了从浪漫主义向现实主义的转变。\n- **名篇名句**：《叶甫盖尼·奥涅金》：“活得匆忙，来不及感受。”；《致大海》（创作于1824年）：“再见吧，自由奔放的大海！这是我最后一次在你面前……”\n\n### 📍 重要地点：莫斯科与圣彼得堡（重返与创作全盛期）\n- **时间**：1826年 - 1830年\n- **停留时间**：约4年\n- **地点**：莫斯科（今俄罗斯莫斯科）、圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：新沙皇尼古拉一世将其召回，表面上予以赦免，实则进行严密监视。他创作了《波尔塔瓦》《青铜骑士》等长诗。\n- **意义**：虽获自由身，但处于官方严密监控下，创作中的现实主义批判色彩愈发浓厚。\n\n### 📍 重要地点：高加索与克里米亚（随军旅行）\n- **时间**：1829年\n- **停留时间**：数月\n- **地点**：高加索地区（今俄罗斯南部）、克里米亚半岛（今乌克兰克里米亚自治共和国，主权争议地区）\n- **事件**：主动申请随俄国军队前往俄土战争前线，途经高加索，重游克里米亚。\n- **意义**：收集了大量创作素材，激发了新的灵感，为其后期散文创作（如《上尉的女儿》）积累了经验。\n- **名篇名句**：《我曾经爱过你》：“我曾经爱过你：爱情，也许，在我的心灵里还没有完全消亡。”\n\n### 📍 重要地点：波尔金诺（“波尔金诺之秋”）\n- **时间**：1830年秋\n- **停留时间**：约3个月\n- **地点**：波尔金诺村（今俄罗斯下诺夫哥罗德州）\n- **事件**：因故滞留家族领地，迎来了创作的空前爆发期，完成了《叶甫盖尼·奥涅金》最后两章、《别尔金小说集》（含《驿站长》等）、四个小悲剧及多首抒情诗。\n- **意义**：文学史上的奇迹时期，其创作在数量与质量上均达到巅峰，奠定了其俄国文坛无可争议的领袖地位。\n- **名篇名句**：《别尔金小说集·驿站长》：“十四品文官，驿站的独裁者。”\n\n### 🔴 去世地：圣彼得堡\n- **时间**：1837年2月10日\n- **停留时间**：生命最后阶段\n- **地点**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：因妻子受流言中伤，与法国流亡贵族丹特斯进行决斗，腹部受重伤，两天后去世。\n- **意义**：其悲剧性逝世引发了俄国社会的巨大震动，被视为专制制度对自由天才的扼杀，激发了更广泛的社会觉醒。\n- **名篇名句**：《纪念碑》：“我为自己建立了一座非人工的纪念碑，在人们走向那儿的路上，青草不再生长。”\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1799 | 莫斯科 | 俄罗斯莫斯科 | （年龄：0）出生于莫斯科。 |\n| 1811 | 皇村（皇村学校） | 俄罗斯普希金市 | （年龄：12）进入皇村学校学习。 |\n| 1814 |  |  | （年龄：15）在《欧洲导报》发表第一首诗《致诗友》。 |\n| 1817 | 圣彼得堡 | 俄罗斯圣彼得堡 | （年龄：18）皇村学校毕业，赴圣彼得堡外交部任职。 |\n| 1820 |  |  | （年龄：21）因《自由颂》等诗被流放南俄。 |\n| 1823 | 敖德萨（第二次流放的开端） | 乌克兰敖德萨 | （年龄：24）转至敖德萨，开始创作《叶甫盖尼·奥涅金》。 |\n| 1824 | 米哈伊洛夫斯科耶村（幽禁与创作高峰） | 俄罗斯普斯科夫州 | （年龄：25）被革职，遣送至米哈伊洛夫斯科耶村幽禁。 |\n| 1825 |  |  | （年龄：26）十二月党人起义失败，其友人多受牵连。 |\n| 1826 | 莫斯科 | 俄罗斯莫斯科 | （年龄：27）被沙皇尼古拉一世召回莫斯科，处于监视下。 |\n| 1829 |  |  | （年龄：30）前往高加索前线旅行。 |\n| 1830 | 波尔金诺（“波尔金诺之秋”） | 俄罗斯下诺夫哥罗德州 | （年龄：31）于波尔金诺村迎来创作大爆发（“波尔金诺之秋”）。 |\n| 1831 |  |  | （年龄：32）与娜塔莉亚·冈察洛娃结婚。 |\n| 1833 |  |  | （年龄：34）完成小说《上尉的女儿》，研究普加乔夫起义史。 |\n| 1836 |  |  | （年龄：37）创办《现代人》杂志；遭遇丹特斯纠缠与匿名诽谤信。 |\n| 1837 |  |  | （年龄：37）与丹特斯决斗，重伤去世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《假如生活欺骗了你》**（普希金诗作，中文译文）、**《致大海》**、《叶甫盖尼·奥涅金》（节选）、《我曾经爱过你》。\n- 核心要点：\n    - **重点**：**《假如生活欺骗了你》** 以劝慰口吻阐述了积极乐观的人生态度，语言平实而哲理深刻，是**哲理抒情诗**的典范。\n    - **重点**：**《致大海》** 将大海塑造为**自由精神**的象征，通过告别大海的抒情，表达了诗人对**反抗专制**、追求自由的坚定信念，运用了**象征**与**直抒胸臆**的手法。\n    - **《叶甫盖尼·奥涅金》** 塑造了俄国文学史上第一个“**多余人**”形象奥涅金，反映了19世纪初俄国贵族青年的**精神苦闷**与**社会疏离**。\n    - **重点**：普希金的诗歌语言**简洁、优美、富有音乐性**，他成功地将**民间口语**与**文学语言**融合，奠定了**俄国现代标准语**的基础。\n    - 其爱情诗（如《我曾经爱过你》）情感真挚、含蓄深沉，展现了**崇高而克制的爱**的境界。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：普希金生活在**俄国农奴制危机**日益加深、**欧洲启蒙思想**广泛传播的时代，其思想与创作深受**十二月党人**起义前后社会思潮的影响。\n    - 因写作歌颂自由的诗歌，曾两次被沙皇政府**流放**（南俄、米哈伊洛夫斯科耶村），一生处于**专制政府的监视与迫害**之下。\n    - **重点**：1837年，因维护妻子名誉与法国保皇党人丹特斯**决斗身亡**，这一事件成为俄国社会与专制制度矛盾激化的标志性事件之一。\n- 核心要点：\n    - **重点**：普希金是**俄国民族文学**的真正奠基人，他结束了俄国文学对西欧的模仿，确立了**独立的民族风格**与**现实主义方向**。\n    - 他的作品广泛涉及**俄国历史**（如《鲍里斯·戈都诺夫》《上尉的女儿》）、**社会现实**与**人民生活**，具有强烈的**民族意识**与**历史深度**。\n    - **重点**：高尔基称他为“**俄国文学之祖**”，其创作成为后世所有俄国伟大作家（如果戈理、陀思妥耶夫斯基、托尔斯泰）的**共同源头**与**精神导师**。\n    - 其个人命运与创作，集中体现了俄国**贵族知识分子**在时代转型期的**探索、抗争与悲剧性**。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：莫斯科 | 莫斯科 | 55.7558 | 37.6173 |\n| 重要地点：皇村（皇村学校） | 普希金市（原皇村） | 59.7167 | 30.4000 |\n| 重要地点：圣彼得堡（外交部任职与早期创作） | 圣彼得堡（市区） | 59.9343 | 30.3351 |\n| 重要地点：基希讷乌（第一次流放） | 基希讷乌 | 47.0105 | 28.8638 |\n| 重要地点：敖德萨（第二次流放的开端） | 敖德萨 | 46.4825 | 30.7233 |\n| 重要地点：米哈伊洛夫斯科耶村（幽禁与创作高峰） | 米哈伊洛夫斯科耶村（普斯科夫州） | 57.0500 | 28.9333 |\n| 重要地点：莫斯科与圣彼得堡（重返与创作全盛期） | 波尔金诺村（下诺夫哥罗德州） | 55.9833 | 43.2667 |\n| 重要地点：高加索与克里米亚（随军旅行） | 高加索地区（以弗拉季高加索为例） | 43.0248 | 44.6820 |\n| 重要地点：波尔金诺（“波尔金诺之秋”） | 辛菲罗波尔（克里米亚） | 44.9572 | 34.1108 |\n| 去世地：圣彼得堡 | 圣彼得堡（涅瓦大街决斗地点附近） | 59.9398 | 30.3146 |\n|---|---|---|\n| 莫斯科 | 55.7558 | 37.6173 |\n| 普希金市（原皇村） | 59.7167 | 30.4000 |\n| 圣彼得堡（市区） | 59.93
