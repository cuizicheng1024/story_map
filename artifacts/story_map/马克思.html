   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

形态", "aliases": [], "authors": [], "related_people": ["恩格斯", "马克思"], "source_pages": ["恩格斯", "马克思"], "era": "", "genre": "", "one_liner": "《德意志意识形态》：首次系统阐述历史唯物主义。", "summary": "《德意志意识形态》：首次系统阐述历史唯物主义。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "政治经济学批判": {"title": "政治经济学批判", "aliases": [], "authors": ["马克思"], "related_people": ["马克思"], "source_pages": ["马克思"], "era": "19世纪", "genre": "经济学著作", "one_liner": "马克思1859年出版的政治经济学著作，系统批判资产阶级政治经济学，阐述商品、货币与价值形态理论，为《资本论》写作奠定基础，并在序言中首次完整表述了历史唯物主义基本原理。", "summary": "| 1859 | | | （年龄：41）出版《政治经济学批判》 |", "quote": "人们在自己生活的社会生产中发生一定的、必然的、不以他们的意志为转移的关系，即同他们的物质生产力的一定发展阶段相适合的生产关系。", "quotes": ["人们在自己生活的社会生产中发生一定的、必然的、不以他们的意志为转移的关系，即同他们的物质生产力的一定发展阶段相适合的生产关系。", "不是人们的意识决定人们的存在，相反，是人们的社会存在决定人们的意识。"], "quote_policy": "preferred"}}, "markdown": "# 卡尔·马克思\n\n## 人物档案\n\n### 基本信息\n- **姓名**：卡尔·马克思\n- **时代**：19世纪\n- **出生**：公元1818年5月5日，特里尔（今德国莱茵兰-普法尔茨州特里尔市）\n- **去世**：公元1883年3月14日，伦敦（今英国伦敦）\n- **享年**：64岁\n- **主要身份**：思想家、哲学家、经济学家、社会学家、革命导师\n- **历史地位**：马克思主义创始人，国际共产主义运动的开创者。\n- **主要成就**：\n    1. 创立马克思主义哲学、政治经济学和科学社会主义理论体系。\n    2. 与恩格斯合著《共产党宣言》，为国际工人运动提供纲领。\n    3. 撰写《资本论》，深刻剖析资本主义经济运行规律。\n    4. 参与创建和领导第一国际（国际工人协会）。\n    5. 深刻影响了20世纪的世界历史进程与社会科学思想。\n\n### 生平概述\n马克思出生于普鲁士莱茵省一个律师家庭。青年时代先后在波恩大学和柏林大学求学，深受黑格尔哲学影响，并获得哲学博士学位（耶拿大学）。后投身新闻业，因激进言论被迫流亡巴黎、布鲁塞尔等地。在此期间，他完成了从唯心主义向唯物主义、从革命民主主义向共产主义的转变，并与恩格斯开始了终身合作。1848年，他们共同发表了《共产党宣言》。1849年起，马克思长期流亡并定居伦敦，在极端贫困和疾病困扰下，于大英博物馆进行了长达数十年的研究，最终撰写了不朽巨著《资本论》。他的一生是为无产阶级解放事业奋斗的一生。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从德国出发，辗转法国、比利时，最终在英国伦敦长期定居，足迹遍及西欧主要工业国家。\n- ⏱️ **时间跨度**：1818年 - 1883年，共计约64年。\n- 📍 **地理范围**：主要覆盖今德国、法国、比利时、英国等地区。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：特里尔\n- **时间**：公元1818年5月5日\n- **停留时间**：约17年（至1835年）\n- **地点**：特里尔（今德国莱茵兰-普法尔茨州特里尔市）\n- **事件**：出生于一个富裕的犹太裔律师家庭，在此度过童年并完成中学学业。\n- **意义**：特里尔曾为拿破仑治下之城，法兰西的平等理念与启蒙精神渗入少年马克思的骨髓。父亲海因里希崇尚理性，家中弥漫伏尔泰气息，悄然种下日后颠覆整个旧世界的种子\n\n### 📍 重要地点：波恩大学与柏林大学\n- **时间**：公元1835年 - 1841年\n- **停留时间**：约6年\n- **地点**：波恩（今德国北莱茵-威斯特法伦州波恩市）；柏林（今德国柏林）\n- **事件**：先在波恩大学学习法律，后转入柏林大学。在柏林期间，加入“青年黑格尔派”团体“博士俱乐部”，深入研究黑格尔哲学，并完成博士论文《德谟克利特的自然哲学和伊壁鸠鲁的自然哲学的差别》，后于耶拿大学获得哲学博士学位。\n- **意义**：从波恩的诗酒剑影到柏林的思想激荡，青年马克思在此完成精神蜕变。他加入博士俱乐部，在鲍威尔等人的论辩中脱离黑格尔正统，走向激进的青年黑格尔派，以博士论文初露批判锋芒\n\n### 📍 重要地点：科隆（《莱茵报》编辑部）\n- **时间**：公元1842年 - 1843年\n- **停留时间**：约1年\n- **地点**：科隆（今德国北莱茵-威斯特法伦州科隆市）\n- **事件**：担任《莱茵报》的撰稿人，后升任主编。在该报上发表了一系列批判普鲁士专制制度和书报检查令、维护贫苦农民物质利益的文章。\n- **意义**：首次将理论研究与现实社会政治经济问题相结合，促使他开始研究政治经济学。该报后被当局查封。\n\n### 📍 重要地点：巴黎\n- **时间**：公元1843年10月 - 1845年2月（第一次）；1848年3月 - 1849年（短暂返回）\n- **停留时间**：约1年半（第一次）\n- **地点**：巴黎（今法国巴黎）\n- **事件**：与燕妮结婚后流亡巴黎。在此创办《德法年鉴》，发表《〈黑格尔法哲学批判〉导言》和《论犹太人问题》，标志着其世界观的根本转变。期间与恩格斯会面并开始合作，共同撰写《神圣家族》。\n- **意义**：完成了向唯物主义和共产主义的转变，与恩格斯建立伟大友谊。后因从事革命活动被法国政府驱逐。\n\n### 📍 重要地点：布鲁塞尔\n- **时间**：公元1845年2月 - 1848年3月\n- **停留时间**：约3年\n- **地点**：布鲁塞尔（今比利时布鲁塞尔）\n- **事件**：再次被驱逐后流亡至此。与恩格斯合著《德意志意识形态》，系统阐述了历史唯物主义基本原理。加入并改组“正义者同盟”为“共产主义者同盟”，为其起草纲领《共产党宣言》。\n- **意义**：马克思主义理论体系基本形成，《共产党宣言》的发表标志着科学社会主义的诞生。\n\n### 📍 重要地点：伦敦（长期流亡与写作地）\n- **时间**：公元1849年8月 - 1883年3月\n- **停留时间**：约34年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：在此度过了生命最后也是最重要的阶段。长期在大英博物馆阅览室进行研究，生活极度贫困，依靠恩格斯资助。期间撰写并出版了《政治经济学批判》和《资本论》第一卷，并继续准备后几卷的手稿。领导了第一国际的活动。\n- **意义**：完成了其经济学说的构建，为国际工人运动提供了理论指导，伦敦成为其理论研究和革命活动的中心。\n\n### 📍 重要地点：曼彻斯特（恩格斯居所及考察）\n- **时间**：公元1845年夏（考察）；多次短期访问\n- **停留时间**：累计数月\n- **地点**：曼彻斯特（今英国曼彻斯特）\n- **事件**：1845年夏，与恩格斯一同到英国实地考察资本主义工业和工人阶级状况。此后也多次访问恩格斯。\n- **意义**：亲身观察了工业革命的中心，为其政治经济学研究提供了丰富的现实素材。\n\n### 🔴 去世地：伦敦\n- **时间**：公元1883年3月14日\n- **停留时间**：长期居住直至去世\n- **地点**：伦敦（今英国伦敦）\n- **事件**：在书桌前安详逝世。\n- **意义**：一颗伟大的头脑停止了思考，全世界无产阶级失去了一位导师。葬于伦敦海格特公墓。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1818 | 特里尔 | 德国莱茵兰-普法尔茨州特里尔市 | （年龄：0）出生于德国特里尔 |\n| 1835 |  |  | （年龄：17）中学毕业，进入波恩大学学习法律 |\n| 1836 |  |  | （年龄：18）转入柏林大学，加入“博士俱乐部” |\n| 1841 |  |  | （年龄：23）获耶拿大学哲学博士学位 |\n| 1842 |  |  | （年龄：24）担任《莱茵报》主编，开始批判普鲁士政府 |\n| 1843 | 巴黎 | 法国巴黎 | （年龄：25）与燕妮结婚；《莱茵报》被查封；流亡巴黎 |\n| 1844 | 巴黎 | 法国巴黎 | （年龄：26）创办《德法年鉴》；在巴黎与恩格斯会面并开始合作 |\n| 1845 | 布鲁塞尔 | 比利时布鲁塞尔 | （年龄：27）被法国驱逐，迁居布鲁塞尔；与恩格斯赴英国考察 |\n| 1846 |  |  | （年龄：28）与恩格斯建立共产主义通讯委员会 |\n| 1847 |  |  | （年龄：29）加入并改组“共产主义者同盟” |\n| 1848 | 伦敦 | 英国伦敦 | （年龄：30）《共产党宣言》在伦敦出版；返回德国参加革命 |\n| 1849 | 伦敦 | 英国伦敦 | （年龄：31）革命失败，被普鲁士驱逐，最终定居伦敦 |\n| 1859 |  |  | （年龄：41）出版《政治经济学批判》 |\n| 1864 |  |  | （年龄：46）参与创建第一国际（国际工人协会） |\n| 1867 |  |  | （年龄：49）《资本论》第一卷在汉堡出版 |\n| 1883 | 伦敦 | 英国伦敦 | （年龄：64）在伦敦逝世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《共产党宣言》（节选）**、**《资本论》（相关概念）**\n- 核心要点：\n    - **重点**：《共产党宣言》开篇“一个幽灵，共产主义的幽灵，在欧洲游荡”成为经典文学性表述，具有强大的**象征**与**号召力**。\n    - **重点**：文本体现了深刻的**历史唯物主义**观点，将历史发展归结为**阶级斗争**的历史。\n    - 语言风格**犀利**、**雄辩**，充满**革命激情**与**逻辑力量**。\n    - **重点**：《资本论》中关于“**商品拜物教**”的论述，是批判资本主义社会关系的重要**哲学隐喻**。\n    - 其著作整体上融合了**科学分析**与**革命檄文**的双重特质。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1848年《共产党宣言》的发表，标志着**马克思主义**的诞生，为国际工人运动提供了科学的**理论武器**。\n    - 19世纪40-50年代，马克思与恩格斯合著了《神圣家族》、《德意志意识形态》等，系统阐述了**历史唯物主义**。\n    - **重点**：1864年，马克思参与创建**第一国际**，并成为其实际领袖，推动了国际工人联合。\n    - 1867年，《资本论》第一卷出版，揭示了**剩余价值规律**，奠定了**政治经济学批判**的基础。\n- 核心要点：\n    - **重点**：马克思的思想诞生于**工业革命**后西欧社会矛盾激化、**工人阶级**作为独立政治力量登上历史舞台的时代背景。\n    - **重点**：其理论核心是**唯物史观**和**剩余价值学说**，分别从哲学和经济学层面论证了资本主义的必然灭亡和社会主义的必然胜利。\n    - 马克思不仅是学者，更是**革命家**，他的理论始终与**实践**紧密结合。\n    - **重点**：对马克思的评价需置于**国际共产主义运动**和**现代社会科学**发展的宏大视野中，他是影响人类历史进程的**千年思想家**之一。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 特里尔 | 49.75 | 6.64 |\n| 波恩 | 50.73 | 7.10 |\n| 柏林 | 52.52 | 13.41 |\n| 科隆 | 50.94 | 6.96 |\n| 巴黎 | 48.86 | 2.35 |\n| 布鲁塞尔 | 50.85 | 4.35 |\n| 伦敦 | 51.51 | -0.13 |\n| 曼彻斯特 | 53.48 | -2.24 |\n| 伦敦海格特公墓 | 51.5675 | -0.1469 |", "relatedGraph": {"center": {"id": "卡尔·马克思", "name": "卡尔·马克思", "file": "卡尔·马克思.html", "dynasty": "19世纪", "aliases": [], "birth_year": 1818, "death_year": 1883, "quote": "与恩格斯合著《共产党宣言》，为国际工人运动提供纲领。", "review": "与恩格斯合著《共产党宣言》，为国际工人运动提供纲领。", "foreign_name": "", "main_role_label": "", "birthplace": "特里尔（今德国莱茵兰-普法尔茨州特里尔市）", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "卡尔·马克思", "name": "卡尔·马克思", "file"             const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
