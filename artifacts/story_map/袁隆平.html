  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

otes": [], "quote_policy": "summary_only"}, "袁隆平论文选集": {"title": "袁隆平论文选集", "aliases": [], "authors": ["袁隆平"], "related_people": ["袁隆平"], "source_pages": ["袁隆平"], "era": "现代（中华人民共和国）", "genre": "", "one_liner": "名篇名句：《袁隆平论文选集》：水稻具有杂种优势现象，尤以籼粳亚种间杂种优势更为突出。", "summary": "名篇名句：《袁隆平论文选集》：水稻具有杂种优势现象，尤以籼粳亚种间杂种优势更为突出。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "喜看稻菽千重浪——记首届国家最高科技奖获得者袁隆平": {"title": "喜看稻菽千重浪——记首届国家最高科技奖获得者袁隆平", "aliases": [], "authors": ["沈英甲"], "related_people": ["袁隆平"], "source_pages": ["袁隆平"], "era": "现代（中华人民共和国）", "genre": "人物通讯", "one_liner": "人教版语文课文，以典型事例和细节描写，刻画首届国家最高科技奖获得者袁隆平在杂交水稻研究中的创新精神、实践品格与民生情怀，颂扬其对世界粮食安全的卓越贡献。", "summary": "袁隆平生于动荡年代，成长于新中国", "quote": "我做过一个梦，梦见水稻长得有高粱那么高，穗子像扫把那么长，颗粒像花生那么大，我和助手坐在稻穗下乘凉。", "quotes": ["我做过一个梦，梦见水稻长得有高粱那么高，穗子像扫把那么长，颗粒像花生那么大，我和助手坐在稻穗下乘凉。", "饥饿的威胁在退却。"], "quote_policy": "preferred"}}, "markdown": "# 袁隆平\n\n## 人物档案\n\n### 基本信息\n- **姓名**：袁隆平\n- **时代**：现代（中华人民共和国）\n- **出生**：公元1930年9月7日，北平（今北京市）\n- **去世**：公元2021年5月22日，长沙（今湖南省长沙市）\n- **享年**：90岁\n- **主要身份**：农业科学家、杂交水稻育种专家、中国工程院院士\n- **历史地位**：世界杂交水稻事业的开创者和引领者，为解决中国及世界粮食安全问题做出了卓越贡献。\n- **主要成就**：\n    1. 成功研究并推广应用**杂交水稻**技术，大幅提高水稻产量。\n    2. 提出并建立**水稻杂交优势利用**的理论和技术体系。\n    3. 获得**国家最高科学技术奖**、**共和国勋章**等崇高荣誉。\n    4. 为全球数十个国家培训技术人员，被誉为“**杂交水稻之父**”。\n\n### 生平概述\n袁隆平生于动荡年代，成长于新中国。他一生致力于农业科研，自20世纪60年代起，毅然投身于当时被视为世界性难题的**杂交水稻**研究。历经艰辛，于1973年成功实现三系配套，1976年起在全国大面积推广，使中国水稻产量实现飞跃。他淡泊名利，始终躬耕于田野，不断追求“禾下乘凉梦”与“杂交水稻覆盖全球梦”，其工作不仅深刻改变了中国的粮食面貌，也为世界粮食安全提供了中国方案。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：以中国南方为主要科研与生活基地，足迹遍及大江南北，并多次赴海外推广技术。\n- ⏱️ **时间跨度**：1930年 - 2021年，共计约90年。\n- 📍 **地理范围**：主要覆盖北京、湖北、湖南、重庆、四川、海南等地，以及亚洲、非洲、美洲多国。\n- 🌟 **重要节点数量**：核心地点13个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：北平\n- **时间**：1930年\n- **停留时间**：幼年时期（具体年限存疑）\n- **地点**：北平（今北京市）\n- **事件**：出生于一个知识分子家庭。\n- **意义**：1930年生于北平，幼年正值家国板荡，随父母辗转于天津、南京、武汉、重庆各地，颠沛流离间亲历饥馑与凋零，\"让天下人远离饥荒\"的稚嫩悲愿自此悄然种下\n\n### 📍 重要地点：重庆\n- **时间**：1936年-1949年（存疑，此间主要在重庆、武汉等地求学）\n- **停留时间**：约13年\n- **地点**：重庆（今重庆市）\n- **事件**：在重庆度过小学和中学时光，后考入**相辉学院**（后并入西南农学院）农学系。\n- **意义**：接受了系统的中小学教育，并确立了学农的志向，奠定了专业基础。\n\n### 📍 重要地点：武汉\n- **时间**：1940年代（具体时间存疑）\n- **停留时间**：数年\n- **地点**：武昌（今湖北省武汉市）\n- **事件**：曾随家人迁居，在此继续中学学业。\n- **意义**：沉甸甸的奖章与荣光，是对一位稻田守望者半生跋涉的加冕。回望来路，山城是他学术生命的起点——半个多世纪前种下的那颗水稻梦想，终于长成荫蔽天下的稻花，国家以最高礼遇致敬一位科学家朴素而伟大的良心\n\n### 📍 重要地点：北碚\n- **时间**：1949年-1953年\n- **停留时间**：4年\n- **地点**：北碚（今重庆市北碚区）\n- **事件**：进入**西南农学院**（现西南大学）农学系学习。\n- **意义**：沉甸甸的奖章与荣光，是对一位稻田守望者半生跋涉的加冕。回望来路，山城是他学术生命的起点——半个多世纪前种下的那颗水稻梦想，终于长成荫蔽天下的稻花，国家以最高礼遇致敬一位科学家朴素而伟大的良心\n\n### 📍 重要地点：安江\n- **时间**：1953年-1971年\n- **停留时间**：18年\n- **地点**：安江（今湖南省洪江市安江镇）\n- **事件**：毕业后分配至**湖南省安江农业学校**任教；开始**水稻雄性不孕性**研究；1964年提出利用水稻杂交优势的设想，并开始寻找雄性不育株；1966年发表关键论文《水稻的雄性不孕性》。\n- **意义**：科研生涯的起点和关键突破期，在极其艰苦的条件下开启了杂交水稻研究。\n\n### 📍 重要地点：长沙\n- **时间**：1971年-2021年（主要工作生活地）\n- **停留时间**：50年\n- **地点**：长沙（今湖南省长沙市）\n- **事件**：调至**湖南省农业科学院**工作；1973年成功实现**籼型杂交水稻“三系”配套**；1976年杂交水稻在全国大面积推广；后续在此领导团队进行超级杂交稻攻关，屡破世界纪录。\n- **意义**：科研指挥中心与家庭所在地，见证了杂交水稻从成功到辉煌的全过程。\n\n### 📍 重要地点：三亚\n- **时间**：1968年起，每年冬春季节\n- **停留时间**：累计数年\n- **地点**：三亚（今海南省三亚市）\n- **事件**：利用海南**南红农场**的热带气候进行**水稻加代育种**，加速研究进程；发现“**野败**”野生稻，为三系配套打开突破口。\n- **意义**：至关重要的育种基地，“野败”的发现是杂交水稻成功的决定性因素之一。\n- **名篇名句**：《袁隆平论文选集》：水稻具有杂种优势现象，尤以籼粳亚种间杂种优势更为突出。\n\n### 📍 重要地点：菲律宾洛斯巴尼奥斯\n- **时间**：1979年起，多次前往\n- **停留时间**：累计数月\n- **地点**：洛斯巴尼奥斯（今菲律宾拉古纳省）\n- **事件**：在**国际水稻研究所**进行学术交流与合作研究；培训来自发展中国家的农业技术人员。\n- **意义**：沉甸甸的奖章与荣光，是对一位稻田守望者半生跋涉的加冕。回望来路，山城是他学术生命的起点——半个多世纪前种下的那颗水稻梦想，终于长成荫蔽天下的稻花，国家以最高礼遇致敬一位科学家朴素而伟大的良心\n\n### 📍 重要地点：溆浦\n- **时间**：1975年\n- **停留时间**：数月\n- **地点**：溆浦（今湖南省怀化市溆浦县）\n- **事件**：进行杂交水稻大面积制种示范并获得成功。\n- **意义**：从全国劳模到特等发明奖，从改革先锋到国家最高荣誉，这些沉甸甸的光环背后，他最珍视的仍是稻田里那些握着他培育的新种、喜极而泣的乡间农人\n\n### 📍 重要地点：武汉（考察）\n- **时间**：2000年代后\n- **停留时间**：短期考察\n- **地点**：武汉（今湖北省武汉市）\n- **事件**：考察武汉大学等高校的科研合作项目。\n- **意义**：从全国劳模到特等发明奖，从改革先锋到国家最高荣誉，这些沉甸甸的光环背后，他最珍视的仍是稻田里那些握着他培育的新种、喜极而泣的乡间农人\n\n### 📍 重要地点：北京\n- **时间**：2000年后，不定期\n- **停留时间**：短期\n- **地点**：北京（今北京市）\n- **事件**：领取**国家最高科学技术奖**、**共和国勋章**等荣誉；参加重要国事活动与学术会议。\n- **意义**：抗战中少年袁隆平辗转来此，入中央大学附中与西南农学院。山城的饥馑与稻田，在他心中种下让苍生吃饱饭的夙愿。\"共和国勋章\"加身，他以一稻济世，赢回故土最深沉的敬意\n\n### 🔴 去世地：长沙\n- **时间**：2021年5月22日\n- **停留时间**：晚年直至逝世\n- **地点**：长沙（今湖南省长沙市）\n- **事件**：因多器官功能衰竭，在长沙逝世。\n- **意义**：生命终点，举国哀悼。其精神与事业在长沙（湖南省农业科学院等地）得以延续。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1930 | 北平 | 北京市 | （年龄：0岁）出生于北平。 |\n| 1949 |  |  | （年龄：19岁）考入相辉学院（西南农学院前身）农学系。 |\n| 1953 | 安江 | 湖南省洪江市安江镇 | （年龄：23岁）西南农学院毕业，分配至湖南安江农业学校任教。 |\n| 1960 |  |  | （年龄：30岁）开始进行水稻育种试验，立志解决粮食短缺问题。 |\n| 1964 |  |  | （年龄：34岁）正式开始水稻雄性不育研究，找到第一株雄性不育株。 |\n| 1966 |  |  | （年龄：36岁）发表《水稻的雄性不孕性》论文，奠定理论基础。 |\n| 1968 | 三亚 | 海南省三亚市 | （年龄：38岁）首次赴海南三亚进行育种试验。 |\n| 1970 |  |  | （年龄：40岁）在海南发现“野败”野生稻，为三系配套找到关键种质资源。 |\n| 1973 |  |  | （年龄：43岁）成功实现籼型杂交水稻“三系”配套。 |\n| 1976 |  |  | （年龄：46岁）杂交水稻在全国开始大面积推广种植。 |\n| 1995 |  |  | （年龄：65岁）当选中国工程院院士。 |\n| 1999 |  |  | （年龄：69岁）国家杂交水稻工程技术研究中心成立，任主任。 |\n| 2000 |  |  | （年龄：70岁）获得**国家最高科学技术奖**。 |\n| 2019 |  |  | （年龄：89岁）获授“**共和国勋章**”。 |\n| 2021 | 长沙 | 湖南省长沙市 | （年龄：90岁）在长沙逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《喜看稻菽千重浪——记首届国家最高科技奖获得者袁隆平》**（沈英甲）\n- 核心要点：\n    - **重点**：文章通过典型事例和细节描写，生动刻画了袁隆平作为科学家的**创新精神**、**实践品格**与**民生情怀**。\n    - **重点**：标题“喜看稻菽千重浪”化用毛泽东诗句，既描绘了丰收景象，也象征了袁隆平科研成果带来的巨大贡献。\n    - 文章结构清晰，以小标题形式组织材料，分别突出其**实事求是**、**敢于挑战权威**、**矢志不渝**等精神品质。\n    - **重点**：文中“**饥饿的威胁在退却**”等表述，直接点明了其工作的世界性意义。\n    - 人物语言与行动描写朴实而有力，如“**我做过一个梦，梦见水稻长得有高粱那么高，穗子像扫把那么长，颗粒像花生那么大，我和助手坐在稻穗下乘凉**”，形象展现其梦想。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：20世纪70年代，袁隆平成功培育出**籼型杂交水稻**，并大规模推广，为中国粮食安全做出历史性贡献。\n    - 他的研究是**第三次科技革命**中生物工程技术在农业领域应用的典范。\n    - **重点**：杂交水稻技术作为中国原创成果，被联合国粮农组织列为解决粮食短缺问题的首选技术，推广至全球数十个国家。\n    - 袁隆平获得**国家最高科学技术奖**、**共和国勋章**，体现了国家对科技工作者的最高礼遇。\n- 核心要点：\n    - **重点**：袁隆平的成就是**改革开放**后中国“**科学技术是第一生产力**”论断的生动体现。\n    - 他的工作直接回应了新中国成立后，特别是**人口大国如何解决吃饭问题**这一根本性挑战。\n    - **重点**：其成功离不开**国家支持**（如项目立项、团队组建）与**个人长期艰苦奋斗**（如常年奔波于试验田）的结合。\n    - **重点**：袁隆平被誉为“**杂交水稻之父**”，其科学精神（**创新、实践、坚持**）成为宝贵的社会财富。\n    - 他的生平是理解中国现代**农业科技发展**和**粮食政策**的一个重要窗口。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 北京市 | 39.9042 | 116.4074 |\n| 重庆市
