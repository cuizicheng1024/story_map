/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

source_pages": ["恩格斯", "马克思"], "era": "19世纪", "genre": "宣言", "one_liner": "马克思与恩格斯为共产主义者同盟起草的纲领，宣告了科学社会主义的诞生，系统阐述了阶级斗争学说与历史唯物主义，是国际工人运动的纲领性文献。", "summary": "2. 与恩格斯合著《共产党宣言》，为国际工人运动提供纲领。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "反杜林论": {"title": "反杜林论", "aliases": [], "authors": ["恩格斯"], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "19世纪", "genre": "论战性哲学著作", "one_liner": "恩格斯为批判杜林唯心主义与形而上学体系而撰写的论战性著作，系统阐述了马克思主义哲学、政治经济学和科学社会主义三大组成部分的基本原理。", "summary": "| 1878 | | | （年龄：58岁）完成《反杜林论》，系统阐述马克思主义三个组成部分。", "quote": "人们首先必须吃、喝、住、穿，然后才能从事政治、科学、艺术、宗教等等。", "quotes": ["人们首先必须吃、喝、住、穿，然后才能从事政治、科学、艺术、宗教等等。", "自由是在于根据对自然界的必然性的认识来支配我们自己和外部自然界。"], "quote_policy": "preferred"}, "家庭、私有制和国家的起源": {"title": "家庭、私有制和国家的起源", "aliases": [], "authors": ["恩格斯"], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "19世纪", "genre": "科学著作", "one_liner": "运用唯物史观系统考察人类早期社会史，揭示家庭、私有制与国家的起源及发展规律。", "summary": "名篇名句：《家庭、私有制和国家的起源》：用唯物史观分析人类早期社会", "quote": "国家是社会在一定发展阶段上的产物；国家是承认这个社会陷入了不可解决的自我矛盾，分裂为不可调和的对立面而又无力摆脱这些对立面。", "quotes": ["国家是社会在一定发展阶段上的产物；国家是承认这个社会陷入了不可解决的自我矛盾，分裂为不可调和的对立面而又无力摆脱这些对立面。", "家庭是一个能动的要素；它从来不是静止不动的，而是随着社会从较低阶段向较高阶段的发展，从较低的形式进到较高的形式。", "劳动愈不发展，劳动产品的数量、从而的社会财富愈受限制，社会制度就愈是在较大程度上受血族关系的支配。"], "quote_policy": "preferred"}, "资本论": {"title": "资本论", "aliases": [], "authors": ["恩格斯", "马克思"], "related_people": ["恩格斯", "马克思", "释迦牟尼"], "source_pages": ["恩格斯", "马克思", "释迦牟尼"], "era": "19世纪（工业革命与欧洲工人运动兴起时期）", "genre": "论说文", "one_liner": "整理出版马克思的《资本论》第二、三卷。", "summary": "整理出版马克思的《资本论》第二、三卷。", "quote": "撰写《共产党宣言》（与马克思合著）、《反杜林论》、《家庭、私有制和国家的起源》等奠基性著作；", "quotes": ["撰写《共产党宣言》（与马克思合著）、《反杜林论》、《家庭、私有制和国家的起源》等奠基性著作；", "青年时代先后在波恩大学和柏林大学求学，深受黑格尔哲学影响，并获得哲学博士学位（耶拿大学）。", "资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。"], "quote_policy": "preferred"}, "新莱茵报": {"title": "新莱茵报", "aliases": [], "authors": [], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "", "genre": "", "one_liner": "意义：当地的激荡学风与工人疾苦同时烙进了他的视野，他萌生以笔为剑、介入现实的志向。", "summary": "意义：当地的激荡学风与工人疾苦同时烙进了他的视野，他萌生以笔为剑、介入现实 典哲学的终结"], "authors": ["恩格斯"], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "19世纪", "genre": "哲学著作", "one_liner": "恩格斯系统梳理德国古典哲学从黑格尔到费尔巴哈的发展历程，批判费尔巴哈唯物主义的局限，阐明马克思主义哲学与黑格尔辩证法的批判继承关系。", "summary": "| 1886 | | | （年龄：66岁）发表《路德维希·费尔巴哈和德国古典哲学的终结》。", "quote": "在从笛卡儿到黑格尔和从霍布斯到费尔巴哈这一长时期内，真正推动哲学家前进的，主要是自然科学和工业的强大而日益迅猛的进步。", "quotes": ["在从笛卡儿到黑格尔和从霍布斯到费尔巴哈这一长时期内，真正推动哲学家前进的，主要是自然科学和工业的强大而日益迅猛的进步。", "凡是断定精神对自然界说来是本原的……组成唯心主义阵营；凡是认为自然界是本原的，则属于唯物主义的各种学派。", "我们大家都是费尔巴哈派。年轻时候我们也一度追随过他。"], "quote_policy": "preferred"}, "自然辩证法": {"title": "自然辩证法", "aliases": [], "authors": [], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "", "genre": "", "one_liner": "《自然辩证法》（未完成）。", "summary": "《自然辩证法》（未完成）。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "在马克思墓前的讲话": {"title": "在马克思墓前的讲话", "aliases": [], "authors": [], "related_people": ["恩格斯"], "source_pages": ["恩格斯"], "era": "", "genre": "", "one_liner": "重点：《在马克思墓前的讲话》 是悼词典范，高度概括了马克思一生的两大发现（唯物史观、剩余价值学说）和革命家身份。", "summary": "重点：《在马克思墓前的讲话》 是悼词典范，高度概括了马克思一生的两大发现（唯物史观、剩余价值学说）和革命家身份。", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 恩格斯\n\n## 人物档案\n\n### 基本信息\n- **姓名**：弗里德里希·恩格斯\n- **时代**：19世纪（工业革命与欧洲工人运动兴起时期）\n- **出生**：1820年11月28日，普鲁士王国巴门市（今德国伍珀塔尔）\n- **去世**：1895年8月5日，英国伦敦（今英国伦敦）\n- **享年**：74岁\n- **主要身份**：思想家、哲学家、革命家、教育家、军事理论家、社会学家\n- **历史地位**：马克思主义的创始人之一，国际无产阶级和劳动人民的伟大导师。\n- **主要成就**：与马克思共同创立科学社会主义理论体系；撰写《共产党宣言》（与马克思合著）、《反杜林论》、《家庭、私有制和国家的起源》等奠基性著作；长期在经济上支持马克思，并共同领导国际工人运动；整理出版马克思的《资本论》第二、三卷。\n\n### 生平概述\n恩格斯出生于德国莱茵省一个富有的工厂主家庭，早年通过商业活动深入了解资本主义社会现实。1844年在巴黎与马克思会见，开始了伟大的合作，共同改造世界观，创立了历史唯物主义和剩余价值学说。他们积极参与并指导了1848年欧洲革命，革命失败后，恩格斯长期在英国曼彻斯特从事商业活动，以资助马克思完成《资本论》。晚年，他整理出版了马克思的《资本论》第二、三卷，并继续撰写大量著作，指导欧美各国的社会主义运动，直至逝世。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍布德国、英国、法国、比利时等欧洲主要国家，核心活动区域在西欧。\n- ⏱️ **时间跨度**：1820年 - 1895年，共约75年。\n- 📍 **地理范围**：以德国莱茵兰为起点，以英国伦敦为终点，主要活动于德国、英国、法国巴黎及比利时布鲁塞尔。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：巴门市\n- **时间**：1820年\n- **停留时间**：约17年（至1837年）\n- **地点**：普鲁士王国巴门市（今德国伍珀塔尔）\n- **事件**：出生于纺织厂主家庭，完成中学学业。\n- **意义**：成长于早期工业化的环境，目睹了工人阶级的贫困，为其日后思想转变埋下伏笔。\n\n### 📍 重要地点：不来梅\n- **时间**：1838年 - 1841年\n- **停留时间**：约3年\n- **地点**：自由市不来梅（今德国不来梅）\n- **事件**：在一家贸易公司当实习生，开始接触青年黑格尔派思想，并发表政论文章。\n- **意义**：当地的激荡学风与工人疾苦同时烙进了他的视野，他萌生以笔为剑、介入现实的志向。这份少年时代在不来梅点燃的实践冲动，日后随马克思创办《新莱茵报》时彻底喷涌，成为指引革命风暴的火把\n\n### 📍 重要地点：柏林\n- **时间**：1841年 - 1842年\n- **停留时间**：约1年（含服兵役时间，具体起止日期待考）\n- **地点**：普鲁士王国柏林（今德国柏林）\n- **事件**：在柏林炮兵旅服兵役，同时旁听柏林大学课程，参与青年黑格尔派的“博士俱乐部”。\n- **意义**：当地的激荡学风与工人疾苦同时烙进了他的视野，他萌生以笔为剑、介入现实的志向。这份少年时代在不来梅点燃的实践冲动，日后随马克思创办《新莱茵报》时彻底喷涌，成为指引革命风暴的火把\n\n### 📍 重要地点：曼彻斯特（第一次）\n- **时间**：1842年 - 1844年\n- **停留时间**：约1年半\n- **地点**：英国曼彻斯特（今英国曼彻斯特）\n- **事件**：在其父入股的“欧门-恩格斯”棉纺厂办事处工作，深入考察英国工人阶级状况。\n- **意义**：完成了从唯心主义到唯物主义、从革命民主主义到共产主义的转变。开始为《莱茵报》撰稿。\n- **名篇名句**：《国民经济学批判大纲》：批判资产阶级政治经济学。\n\n### 📍 重要地点：巴黎\n- **时间**：1844年8月底 - 1845年初\n- **停留时间**：约半年\n- **地点**：法兰西王国巴黎（今法国巴黎）\n- **事件**：与马克思进行了历史性的会见，开始了共同的理论创作和革命活动。\n- **意义**：两人思想高度契合，合作撰写了《神圣家族》（1844年写成，1845年出版），标志着他们共同创立科学社会主义的开端。\n\n### 📍 重要地点：布鲁塞尔\n- **时间**：1845年 - 1848年\n- **停留时间**：约3年\n- **地点**：比利时布鲁塞尔（今比利时布鲁塞尔）\n- **事件**：与马克思共同建立共产主义通讯委员会，加入并改组正义者同盟为共产主义者同盟，共同撰写《德意志意识形态》、《共产党宣言》。\n- **意义**：马克思主义正式诞生之地，国际共产主义运动的组织基础在此奠定。\n- **名篇名句**：《共产党宣言》：“全世界无产者，联合起来！”；《德意志意识形态》：首次系统阐述历史唯物主义。\n\n### 📍 重要地点：科隆\n- **时间**：1848年 - 1849年\n- **停留时间**：约1年\n- **地点**：普鲁士王国科隆（今德国科隆）\n- **事件**：与马克思共同创办《新莱茵报》，作为机关报指导德国革命。\n- **意义**：商行煤油灯下，青年恩格斯将黑格尔辩证法投向现实，以犀利笔锋刺穿专制与教会的虚妄，这些早年积累的批判锋芒，终在1848年革命的疾风骤雨中淬炼成改造世界的实践武器\n\n### 📍 重要地点：曼彻斯特（第二次）\n- **时间**：1850年 - 1870年\n- **停留时间**：约20年\n- **地点**：英国曼彻斯特（今英国曼彻斯特）\n- **事件**：重返“欧门-恩格斯”公司工作，以经商收入长期资助马克思一家。同时进行广泛的理论研究，撰写大量军事评论和政论。\n- **意义**：为马克思创作《资本论》提供了至关重要的经济保障，自身也在军事学、语言学等领域取得卓越成就。\n- **名篇名句**：《德国的革命与反革命》：总结1848年革命经验。\n\n### 📍 重要地点：伦敦\n- **时间**：1870年 - 1895年\n- **停留时间**：约25年\n- **地点**：英国伦敦（今英国伦敦）\n- **事件**：移居伦敦，与马克思并肩工作。马克思逝世后，整理出版《资本论》第二、三卷，撰写《家庭、私有制和国家的起源》、《路德维希·费尔巴哈和德国古典哲学的终结》等，指导第二国际。\n- **意义**：生命最后阶段的理论创作中心，成为国际工人运动公认的顾问和导师。\n- **名篇名句**：《家庭、私有制和国家的起源》：用唯物史观分析人类早期社会；《自然辩证法》（未完成）。\n\n### 🔴 去世地：伦敦\n- **时间**：1895年8月5日\n- **停留时间**：定居于此直至去世\n- **地点**：英国伦敦（今英国伦敦）\n- **事件**：因食道癌在伦敦住所逝世。\n- **意义**：一颗伟大的心脏停止跳动，其思想遗产继续照亮世界无产阶级解放的道路。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1820 | 巴门市 | 德国伍珀塔尔 | （年龄：0岁）出生于普鲁士巴门市。 |\n| 1838 | 不来梅 | 德国不来梅 | （年龄：18岁）到不来梅经商，接触进步思想。 |\n| 1841 | 柏林 | 德国柏林 | （年龄：21岁）在柏林服兵役并旁听柏林大学课程。 |\n| 1842 | 曼彻斯特（第一次） | 英国曼彻斯特 | （年龄：22岁）前往英国曼彻斯特，深入考察工人阶级状况。 |\n| 1844 | 巴黎 | 法国巴黎 | （年龄：24岁）在巴黎与马克思会见，开始终身合作。 |\n| 1845 |  |  | （年龄：25岁）与马克思合著《神圣家族》（1844年写成，1845年出版）并开始撰写《德意志意识形态》。 |\n| 1847 |  |  | （年龄：27岁）与马克思加入并改组共产主义者同盟。 |\n| 1848 | 科隆 | 德国科隆 | （年龄：28岁）与马克思发表《共产党宣言》；在科隆创办《新莱茵报》。 |\n| 1850 | 曼彻斯特（第二次） | 英国曼彻斯特 | （年龄：30岁）重返曼彻斯特经商，以资助马克思。 |\n| 1867 |  |  | （年龄：47岁）马克思《资本论》第一卷出版，恩格斯协助校对。 |\n| 1870 | 伦敦 | 英国伦敦 | （年龄：50岁）移居伦敦，与马克思密切合作。 |\n| 1878 |  |  | （年龄：58岁）完成《反杜林论》，系统阐述马克思主义三个组成部分。 |\n| 1883 |  |  | （年龄：63岁）马克思逝世，承担整理其遗稿和领导国际工人运动的重任。 |\n| 1884 |  |  | （年龄：64岁）出版《家庭、私有制和国家的起源》。 |\n| 1886 |  |  | （年龄：66岁）发表《路德维希·费尔巴哈和德国古典哲学的终结》。 |\n| 1895 | 伦敦 | 英国伦敦 | （年龄：74岁）在伦敦逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《在马克思墓前的讲话》**（恩格斯著）、**《共产党宣言》**（节选）。\n- 核心要点：\n    - **重点**：**《在马克思墓前的讲话》** 是悼词典范，高度概括了马克思一生的两大发现（**唯物史观**、**剩余价值学说**）和革命家身份。\n    - 文章逻辑严密，采用**总分总**结构，情感深沉含蓄，体现了战友间的深厚情谊。\n    - **重点**：运用了**类比**（如达尔文发现有机界规律）和**讳饰**（“停止思想”、“永远地睡着了”）等修辞手法。\n    - **《共产党宣言》** 的语言富有鼓动性和战斗力，名句“**全世界无产者，联合起来！**”成为国际共运标志性口号。\n    - **重点**：**《共产党宣言》** 标志着**马克思主义**的诞生，其核心思想是**阶级斗争**学说和**无产阶级专政**理论。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - 1844年，恩格斯与马克思在巴黎会面，开始共同创立**科学社会主义**理论。\n    - 1847年，参与改组“正义者同盟”为“**共产主义者同盟**”。\n    - **重点**：1848年2月，**《共产党宣言》** 的发表，标志着马克思主义的诞生。\n    - 1864年，参与创建“**第一国际**”（国际工人协会）。\n    - **重点**：马克思逝世后，恩格斯承担了整理出版**《资本论》** 第二、三卷和指导国际工人运动（**第二国际**）的重任。\n- 核心要点：\n    - 恩格斯是马克思的**终身战友**和**思想合作者**，两人共同奠定了马克思主义理论体系。\n    - **重点**：恩格斯在**哲学**（《反杜林论》）、**军事理论**、**自然辩证法**等领域有独立且卓越的贡献，是**百科全书式**的思想家。\n    - 他长期从经济上支持马克思，被誉为“**第二提琴手**”，但其作用不可或缺。\n    - **重点**：恩格斯晚年对**资本主义新变化**（如股份公司、垄断）的观察，丰富和发展了马克思主义。\n    - 他始终站在**无产阶级**立场，其理论与实践紧密结合，是**国际共产主义运动**的杰出领袖。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 伍珀塔尔（巴门） | 51.2715 | 7.1872 |\n| 不来梅 | 53.0793 | 8.8017 |\n| 柏林 | 52.5200 | 13.4050 |\n| 曼彻斯特 | 53.4808 | -2.2426 |\n| 巴黎 | 48.8566 | 2.3522 |\n| 布鲁塞尔 | 50.8503 | 4.3517 |\n| 科隆 | 50.9375 | 6.9603 |\n| 伦敦 | 51.5074 | -0.1278 |", "relatedGraph": {"center": {"id": "恩格斯", "name": "恩格斯", "file": "恩格斯.html", "dynasty": "19世纪（工业革命与欧洲工人运动兴起时期）", "aliases": [], "birth_year": 1820, "death_year": 1895, "quote": "欧门-恩格斯", "review": "批判资产阶级政治经济学。", "foreign_name": "", "main_role_label": "思想家", "birthplace": "普鲁士王国巴门市", "birthplace_modern": "德国伍珀塔尔", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "恩格斯", "name": "恩格斯", "file": "恩格斯.html", "dynasty": "19世纪（工业革命与欧洲工人运动兴起时期）", "aliases": [], "birth_year": 1820, "death_year": 1895, "quote": "欧门-恩格斯", "review": "批判资产阶级政治经济学。", "foreign_name": "", "main_role_label": "思想家", "birthplace": "普鲁士王国巴门市", "birthplace_modern": "德国伍珀塔尔", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, {"id": "黑格尔", "name": "黑格尔", "file": "黑格尔.html", "dynasty": "近代（18世纪末至19世纪初）", "aliases": [], "birth_year": 1770, "death_year": 1831, "quote": "正题-反题-合题", "review": "", "foreign_name": "", "main_role_label": "哲学家", "birthplace": "符腾堡公国斯图加特", "birthplace_modern": "德国巴登-符腾堡州斯图加特市", "domain_tags": [], "has_story": true, "relationLabel": "师承", "sourceType": "bio", "confidence": 0.55, "isCenter": false}, {"id": "马克思", "name": "马克思", "file": "马克思.html", "dynasty": "19世纪", "aliases": [], "birth_year": 1818, "death_year": 1883, "quote": "青年黑格尔派", "review": "", "foreign_name": "", "main_role_label": "思想家", "birthplace": "特里尔", "birthplace_modern": "德国莱茵兰-普法尔茨州特里尔市", "domain_tags": [], "has_story": true, "relationLabel": "盟友", "sourceType": "bio", "confidence": 0.55, "isCenter": false}, {"id": "巴尔扎克", "name": "巴尔扎克", "file": "巴尔扎克.html", "dynasty": "法国波旁王朝复辟时期、七月王朝时期", "aliases": [], "birth_year": 1799, "death_year":
