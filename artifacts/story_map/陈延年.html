  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

},"workSummaries": {},"markdown": "# 陈延年\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：陈延年（又名遐延）\n- **时代**：清末至民国（中国近代）\n- **出生**：1898年，安徽省安庆府怀宁县（今安徽省安庆市）\n- **去世**：1927年，上海龙华（今上海市徐汇区龙华烈士陵园）\n- **享年**：29岁\n- **主要身份**：革命家、政治活动家、中国共产党早期领导人\n- **历史地位**：中国共产党早期杰出的无产阶级革命家，为党的建设和革命事业做出了重要贡献，是革命英烈的典范。\n- **主要成就**：参与创建旅欧中国少年共产党；领导广东区委工作，推动工农运动；参与领导省港大罢工；在上海坚持地下斗争，英勇就义。\n\n### 生平概述\n陈延年出生于清末一个知识分子家庭，是陈独秀长子。他成长于国家危难、社会剧变的时代，早年受到新思想影响。1920年初赴法勤工俭学，在实践中接受了马克思主义，成为坚定的共产主义战士。1924年回国后，他先后在广东、上海等地担任党的重要领导职务，深入工农群众，发展党的组织，领导革命斗争。他作风朴实，立场坚定，被誉为“开疆辟土的拖拉机”。1927年，蒋介石发动反革命政变后，陈延年在上海被捕，面对酷刑坚贞不屈，最终英勇牺牲，用生命践行了对革命事业的忠诚。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从安徽安庆出发，求学上海，远赴法国，归国后辗转广东、湖北、上海等地从事革命活动。\n- ⏱️ **时间跨度**：1898年—1927年，共29年。\n- 📍 **地理范围**：主要覆盖中国安徽、上海、广东、湖北及法国巴黎等地。\n- 🌟 **重要节点数量**：6个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：安徽省安庆府怀宁县\n- **公元纪年**：1898年\n- **停留时间**：童年及少年早期（约至1915年）\n- **位置**：安徽省安庆府怀宁县（今安徽省安庆市）\n- **事迹**：在此出生并度过童年，接受传统启蒙教育，后进入新式学堂。\n- **意义**：1898年陈延年生于安庆书香之家，父亲陈独秀的革命风骨与庭中满架书卷，滋养了他最初的精神底色。新思潮激荡的年代里，救亡的种子在少年心底悄然扎根，这片故土成为他日后远赴法兰西、以二十九岁青春殉于信仰的原点\n\n### 📍 重要地点：上海（震旦大学等）\n- **公元纪年**：1915年—1919年\n- **停留时间**：约4年\n- **位置**：上海法租界（主要位于今上海市黄浦区、徐汇区一带）\n- **事迹**：进入震旦大学学习法语，与弟弟陈乔年一起半工半读，生活清苦，接触并信仰无政府主义等新思潮。\n- **意义**：开阔眼界，接受现代教育和新思想洗礼，为赴法留学打下语言和思想基础。\n\n### 📍 重要地点：法国巴黎\n- **公元纪年**：1920年—1923年\n- **停留时间**：约3年\n- **位置**：法国巴黎及里昂等地\n- **事迹**：勤工俭学，深入工厂体验工人生活；参与组织“勤工俭学学会”；与赵世炎、周恩来等建立“旅欧中国少年共产党”（后改称旅欧中国共产主义青年团），并担任宣传部长；1922年加入法国共产党，后转入中国共产党；彻底转向马克思主义。\n- **意义**：思想发生根本性转变，从无政府主义者成长为坚定的共产主义者；参与创建党的早期海外组织，积累了革命活动经验。\n\n### 📍 重要地点：广东广州\n- **公元纪年**：1924年—1927年初\n- **停留时间**：约3年\n- **位置**：广东省广州市（今广州市越秀区）\n- **事迹**：回国后任社会主义青年团中央驻粤特派员；后任中共广东区委书记（相当于省委书记）；领导广东地区的工农运动，参与领导省港大罢工；大力发展党的组织，使广东区委成为当时全国党员人数最多、组织最严密的地方组织之一。\n- **意义**：革命生涯的高峰期，在此全面施展领导才能，将广东建设成为大革命的重要基地，其工作受到党中央高度评价。\n- **名篇名句**：无个人文学作品存世，但其革命实践和言论体现了“革命者只能站着死，绝不跪下生”的坚定信念。\n\n### 📍 重要地点：湖北武汉\n- **公元纪年**：1927年4月—5月\n- **停留时间**：约1个月\n- **位置**：湖北省武汉市（主要活动区域位于今武汉市武昌区、江岸区一带）\n- **事迹**：作为中共五大代表赴武汉参加会议，当选为中央委员、中央政治局候补委员；会后被任命为中共江苏省委书记（驻上海），但因上海形势险恶，暂留武汉工作。\n- **意义**：在党的最高领导机关担任职务，参与决定大革命紧急关头的方针策略。\n\n### 🔴 去世地：上海龙华\n- **公元纪年**：1927年6月—7月\n- **停留时间**：约一个月（被捕后关押至牺牲）\n- **位置**：上海龙华（今上海市徐汇区龙华烈士陵园）\n- **经过**：1927年6月，陈延年在上海被捕。他自称是受雇的炊事员，身份未暴露。但因叛徒出卖，身份暴露。面对酷刑，他坚贞不屈，未泄露党的任何机密。1927年7月4日，被国民党当局押赴刑场，刽子手喝令他跪下，他高声回应：“革命者光明磊落、视死如归，只有站着死，决不跪下！”最后被敌人乱刀残忍杀害，壮烈牺牲。\n- **意义**：生命的终点，也是其革命气节和崇高精神的永恒丰碑。他的牺牲激励了无数后来者。\n- **名篇名句**：就义时高呼：“革命者光明磊落、视死如归，只有站着死，决不跪下！”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1898 | 安徽省安庆府怀宁县 | 安徽省安庆市 | （年龄：0）出生于安徽省安庆府怀宁县。 |\n| 1915 | 上海（震旦大学等） | 上海法租界 | （年龄：17）离开家乡，赴上海求学，先后就读于法语补习学校、震旦大学。 |\n| 1919 |  |  | （年龄：21）参加五四运动；年底赴法国勤工俭学。 |\n| 1922 |  |  | （年龄：24）与赵世炎、周恩来等在巴黎发起成立“旅欧中国少年共产党”，任宣传部长；同年加入法国共产党，后转入中国共产党。 |\n| 1923 |  |  | （年龄：25）赴莫斯科东方大学学习（存疑/说法不一）。 |\n| 1924 |  |  | （年龄：26）回国，被派往广东工作，历任社会主义青年团中央驻粤特派员、中共广东区委秘书、组织部长、区委书记等职。 |\n| 1925 |  |  | （年龄：27）领导广东区委全力支持省港大罢工，发展广东工农运动。 |\n| 1927 | 上海龙华 | 上海市徐汇区龙华烈士陵园 | （年龄：29）4月，赴武汉参加中共五大，当选中央委员、中央政治局候补委员；会后被任命为中共江苏省委书记（驻上海）；6月在上海被捕；7月4日于上海龙华英勇就义。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n陈延年是大革命时期中国共产党在南方最重要的地方领导人之一。他领导的广东区委成功组织了广泛的工农群众运动，极大地巩固了广东革命根据地，为北伐战争提供了坚实的后方支持。他在上海牺牲时正值大革命失败后的白色恐怖时期，其坚贞不屈的英雄事迹，极大地鼓舞了处于低潮期的共产党人和革命群众的斗志。\n\n### 对后世的影响\n1.  **革命精神的象征**：陈延年“站着死”的英勇形象，成为共产党人坚守信仰、不怕牺牲的革命气节的永恒象征，被后世广泛传颂和学习。\n2.  **青年楷模**：作为早期青年革命家的杰出代表，他的人生选择和奋斗历程，激励着一代又一代中国青年投身于国家和民族的解放与发展事业。\n3.  **党史重要人物**：作为陈独秀之子，其独立奋斗、坚定信仰并最终为理想献身的经历，是中国共产党早期历史中一个独特而感人的篇章，丰富了党史研究的内涵。\n\n### 历史评价\n1.  毛泽东曾称赞陈延年是“党内不可多得的人才”，并评价其“的确是党的好儿子”。\n2.  周恩来对陈延年的工作能力和革命精神给予高度评价，称其“广东的党团结得很好，党内生活也搞得好，延年在这方面的贡献是很大的”。\n3.  董必武曾说：“延年是党内不可多得的政治家。”\n4.  后世史家普遍认为，陈延年是中国共产党早期卓越的组织者和实干家，其牺牲是党和革命事业的重大损失。\n\n---\n\n## 六、人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**大革命时期**（1924-1927），国共第一次合作。\n- **关键事件**：**旅欧中国少年共产党**的创建者之一；担任**中共广东区委书记**；领导**省港大罢工**；1927年在上海被捕牺牲。\n- **代表作品/思想**：无文学作品，其思想核心是**坚定的共产主义信仰**和**深入工农群众**的工作作风。\n- **常见易混点/对比点**：与父亲**陈独秀**（中共早期主要领导人，后犯右倾机会主义错误）的**关系与区别**；与弟弟**陈乔年**（同为革命烈士）的并称与共同经历。\n\n### 高中阶段\n- **时代背景**：**中国共产党创建初期**与**国民革命**；**马克思主义在中国的传播**与早期组织建设。\n- **关键事件**：从**无政府主义者**到**马克思主义者**的转变；参与**中共旅欧支部**的建立；在广东的**党组织建设**与**工农运动实践**；在**四一二反革命政变**后的白色恐怖中坚持斗争并牺牲。\n- **代表作品/思想**：其革命实践体现了早期共产党人**理论联系实际**、**密切联系群众**的优良作风。\n- **常见易混点/对比点**：**旅欧中国少年共产党**与国内**中国社会主义青年团**的关系；**中共广东区委**在大革命时期的特殊地位与贡献；**陈延年、赵世炎、周恩来**等在旅欧时期的革命活动。\n\n---\n\n## 七、初高中阶段考点\n\n### 初中阶段\n- 陈延年是**中国共产党早期领导人**之一，**陈独秀**的长子。\n- 他早年赴**法国勤工俭学**，在法国参与建立了**旅欧中国少年共产党**。\n- 回国后，他担任**中共广东区委书记**，领导了广东地区的革命斗争，支持了**省港大罢工**。\n- **1927年**，他在**上海**被国民党逮捕，英勇就义，展现了共产党人**视死如归**的革命精神。\n- （存疑/说法不一）其早年思想经历，部分教材可能简略提及他曾受无政府主义影响。\n\n### 高中阶段\n- 陈延年的思想转变历程是**马克思主义在中国早期传播**和**中国先进知识分子选择救国道路**的典型案例。\n- 他领导的**中共广东区委**是当时全国规模最大、工作最出色的地方党组织之一，为**巩固广东革命根据地**和支援**北伐战争**做出了重要贡献。\n- 他的牺牲是**大革命失败**和**国民党右派叛变革命**后，共产党人遭受残酷迫害的标志性事件之一。\n- 其革命实践体现了中国共产党早期**注重在工人和农民中发展组织、开展运动**的群众路线特点。\n- （存疑/说法不一）关于其在党内具体职务的称谓和权限范围，不同史料记载略有差异，但“广东区委主要领导人”的定位是明确的。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 安徽省安庆府怀宁县 | 安徽省安庆市 | 30.5333 | 117.0500 |\n| 上海（震旦大学等） | 上海市黄浦区、徐汇区 | 31.2304 | 121.4737 |\n| 法国巴黎 | 法国巴黎 | 48.8566 | 2.3522 |\n| 广东广州 | 广东省广州市越秀区 | 23.1291 | 113.2644 |\n| 湖北武汉 | 湖北省武汉市武昌区、江岸区 | 30.5928 | 114.3055 |\n| 上海龙华 | 上海市徐汇区龙华烈士陵园 | 31.1750 | 121.4450 |\n","relatedGraph": {"center": {"id": 476,"name": "陈延年","file": "陈延年.html","dynasty": "清末至民国（中国近代）","birth_year": 1898,"death_year": 1927,"time_year": 1904,"quote": "开疆辟土的拖拉机","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "politics","main_role_label": "革命家","birthplace": "安徽省安庆府怀宁县","birthplace_raw": "安徽省安庆府怀宁县今安徽省安庆市","birthplace_modern": "安徽省安庆市","birth_lat_wgs84": 30.5333,"birth_lng_wgs84": 117.05,"birth_lat": 30.5333,"birth_lng": 117.05,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["陈延年"],"search_tokens": ["陈延年","chenyannian","cyn"],"search_pinyin": ["chenyannian","cyn"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人物"},"nodes": [{"id": 476,"name":
