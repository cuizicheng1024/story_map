  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

人与海》获普利策奖（1953年），并助其获得诺贝尔文学奖（1954年）。\n    3. 塑造了众多“硬汉”形象，深刻影响了现代文学。\n    4. 其作品与人生经历成为美国“迷惘的一代”精神的象征。\n\n### 生平概述\n海明威生于美国伊利诺伊州奥克帕克，高中毕业后任记者，一战期间赴意大利前线担任救护车司机并负重伤。战后以记者身份常驻巴黎，投身“迷惘的一代”文学圈，发表《太阳照常升起》《永别了，武器》等名作。后定居佛罗里达州基韦斯特和古巴，期间赴非洲狩猎、西班牙内战前线报道，创作出《丧钟为谁而鸣》等作品。二战后移居古巴，完成巅峰之作《老人与海》。晚年健康恶化，最终在爱达荷州自杀身亡。他的一生充满冒险与传奇，其作品与个人经历共同构成了美国现代文学的重要篇章。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹从美国中西部出发，遍及一战意大利前线、战后巴黎、西班牙、非洲大陆、古巴及二战欧洲战场。\n- ⏱️ **时间跨度**：1899年 - 1961年（共62年）\n- 📍 **地理范围**：北美洲（美国中西部、东部、南部）、欧洲（法国、意大利、西班牙）、非洲（肯尼亚、坦桑尼亚等）、加勒比海地区（古巴）。\n- 🌟 **重要节点数量**：11个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：奥克帕克\n- **时间**：1899年\n- **停留时间**：约18年（至1917年高中毕业）\n- **地点**：奥克帕克（今美国伊利诺伊州奥克帕克）\n- **事件**：出生并成长于芝加哥郊区的富裕中产家庭，在严格的宗教氛围中度过童年，高中时开始为校报写作。\n- **意义**：形成了其性格中反叛与追求自由的底色，为其日后远离家乡、追寻冒险人生埋下伏笔。\n\n### 📍 重要地点：堪萨斯城\n- **时间**：1917年 - 1918年\n- **停留时间**：约1年\n- **地点**：堪萨斯城（今美国密苏里州堪萨斯城）\n- **事件**：高中毕业后拒绝上大学，在《堪萨斯城星报》担任记者。接受了严格的新闻写作训练，要求“使用短句”“用动词写作”。\n- **意义**：奠定了其简洁、明快、精准的写作风格基础，这种风格后来成为其文学标志。\n\n### 📍 重要地点：意大利前线（皮亚韦河等地）\n- **时间**：1918年 - 1919年\n- **停留时间**：约半年（实际作战时间）\n- **地点**：皮亚韦河前线（今意大利威尼托大区）\n- **事件**：加入美国红十字会救护队，在意大利前线驾驶救护车，遭迫击炮弹击中，身中两百余弹片，后在米兰医院疗伤并与护士相恋；亲身经历一战的残酷与创伤，成为“迷惘的一代”精神体验的核心来源。\n- **意义**：战争创伤与幻灭感成为其多部重要作品（如《永别了，武器》）的主题源泉。\n- **名篇名句**：《永别了，武器》：“世界杀害最善良的人，最温和的人，最勇敢的人，如果你不是这三类人，你迟早也会被杀害，不过它也不特别着急。”\n\n### 📍 重要地点：芝加哥\n- **时间**：1920年 - 1921年\n- **停留时间**：约1年\n- **地点**：芝加哥（今美国伊利诺伊州芝加哥）\n- **事件**：从欧洲归来后在此担任记者，并结识了第一任妻子哈德莉·理查森。\n- **意义**：完成了从战场到平民生活的过渡，并组建家庭，为前往欧洲做好了准备。\n\n### 📍 重要地点：巴黎\n- **时间**：1921年 - 1928年（主要居留期）\n- **停留时间**：断续居住约7年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：以《多伦多星报》驻欧记者身份携妻定居巴黎，融入格特鲁德·斯泰因、埃兹拉·庞德等人的文学圈子，开始严肃的文学创作，出版《三个故事和十首诗》《在我们的时代里》《太阳照常升起》《永别了，武器》（注：《永别了，武器》于1929年出版，但创作始于巴黎，完成于基韦斯特）。\n- **意义**：文学事业起飞的关键时期，形成了独特的文学风格，成为“迷惘的一代”代言人。\n- **名篇名句**：《太阳照常升起》：“你是一名流亡者。你已经和你生长的土地失去了联系。”\n\n### 📍 重要地点：基韦斯特\n- **时间**：1928年 - 1939年（主要居住期）\n- **停留时间**：断续居住约11年\n- **地点**：基韦斯特（今美国佛罗里达州基韦斯特）\n- **事件**：从巴黎移居至此，购置房产，热衷深海捕鱼、斗鸡和饮酒。在此完成了《午后之死》《非洲的青山》《有钱人和没钱人》等作品，并为西班牙内战报道做准备。\n- **意义**：美国时期的创作大本营，其“硬汉”生活方式和文学形象在此阶段得到充分展现。\n- **名篇名句**：《老人与海》：“一个人可以被毁灭，但不能被打败。”\n\n### 📍 重要地点：西班牙（马德里等地）\n- **时间**：1937年 - 1938年\n- **停留时间**：断续约一年多\n- **地点**：马德里（今西班牙马德里）\n- **事件**：作为战地记者报道西班牙内战，支持共和政府，与玛莎·盖尔霍恩相识相恋；深度参与反法西斯斗争，个人情感与政治立场紧密结合。这段经历成为《丧钟为谁而鸣》的创作素材。\n- **意义**：1917年，十八岁的海明威入职《堪萨斯城星报》，警局凶案与医院急诊成为他最初的写作素材。冷峻简练的笔法由此养成，更将这位旁观者推向亲历者——翌年奔赴欧洲，战争与正义成为贯穿一生的书写母题\n- **名篇名句**：《丧钟为谁而鸣》：“没有人是孤岛，每个人都是大陆的一片。”\n\n### 📍 重要地点：哈瓦那（瞭望山庄）\n- **时间**：1940年 - 1960年（断续主要居住地）\n- **停留时间**：约20年\n- **地点**：哈瓦那郊外（今古巴哈瓦那）\n- **事件**：与第三任妻子玛莎·盖尔霍恩购置“瞭望山庄”作为长期居所，在此经历了二战（曾改装游艇在加勒比海巡逻反潜）、创作《老人与海》、接待众多访客，并经历了古巴革命。\n- **意义**：人生中最稳定、最高产的创作时期，完成了其诺贝尔奖获奖作品，也是其“硬汉”生活方式（捕鱼、狩猎）的集中体现地。\n- **名篇名句**：《老人与海》：“现在不是去想缺少什么的时候，该想一想凭现有的东西你能做什么。”\n\n### 📍 重要地点：欧洲战场（诺曼底、巴黎等地）\n- **时间**：1944年\n- **停留时间**：约半年\n- **地点**：诺曼底（今法国诺曼底）\n- **事件**：二战期间再次作为战地记者赴欧，随美军参与诺曼底登陆，并组织非正规武装小队参与解放巴黎的战斗，此举引发争议。\n- **意义**：其冒险家与战士的公众形象达到顶峰，但也因逾越记者身份介入作战而受到军方调查。\n\n### 🔴 去世地：凯彻姆\n- **时间**：1961年7月2日\n- **停留时间**：晚年断续居住（1959年起定居）\n- **地点**：凯彻姆（今美国爱达荷州凯彻姆）\n- **事件**：因长期受高血压、肝病、抑郁症等多重疾病困扰，在爱达荷州凯彻姆的家中用猎枪自杀身亡；结束了充满传奇与痛苦的一生。\n- **意义**：其死亡方式与其笔下“在压力下保持优雅”的硬汉精神形成复杂映照，引发世人对英雄主义与生命脆弱的永恒思考。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1899 | 奥克帕克 | 美国伊利诺伊州奥克帕克 | （年龄：0）出生于美国伊利诺伊州奥克帕克。 |\n| 1917 | 堪萨斯城 | 美国密苏里州堪萨斯城 | （年龄：18）高中毕业，赴《堪萨斯城星报》任记者。 |\n| 1918 | 意大利前线（皮亚韦河等地） | 意大利威尼托大区 | （年龄：19）赴意大利前线任救护车司机，身受重伤。 |\n| 1920 | 芝加哥 | 美国伊利诺伊州芝加哥 | （年龄：21）返回美国，在芝加哥任记者，结识第一任妻子。 |\n| 1921 | 巴黎 | 法国巴黎 | （年龄：22）移居巴黎，开启文学创作生涯。 |\n| 1926 |  |  | （年龄：27）出版《太阳照常升起》，成名作。 |\n| 1929 |  |  | （年龄：30）出版《永别了，武器》。 |\n| 1928 | 巴黎 | 法国巴黎 | （年龄：29）离开巴黎，定居美国佛罗里达州基韦斯特。 |\n| 1937 | 西班牙（马德里等地） | 西班牙马德里 | （年龄：38）赴西班牙报道内战。 |\n| 1940 | 哈瓦那（瞭望山庄） | 古巴哈瓦那 | （年龄：41）出版《丧钟为谁而鸣》；定居古巴“瞭望山庄”。 |\n| 1944 |  |  | （年龄：45）作为战地记者赴欧洲报道二战。 |\n| 1952 |  |  | （年龄：53）《老人与海》发表于《生活》杂志。 |\n| 1953 |  |  | （年龄：54）《老人与海》获普利策奖。 |\n| 1954 |  |  | （年龄：55）获诺贝尔文学奖。 |\n| 1960 | 凯彻姆 | 美国爱达荷州凯彻姆 | （年龄：61）离开古巴，定居美国爱达荷州凯彻姆。 |\n| 1961 | 凯彻姆 | 美国爱达荷州凯彻姆 | （年龄：62）在凯彻姆家中自杀身亡。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《老人与海》**（节选）是其在中国语文教材中最常见的作品。\n- 核心要点：\n    - **冰山理论**的写作原则——文字简洁，八分之七的内涵藏于水下，留给读者想象。\n    - 塑造了“**硬汉精神**”的典范形象——桑地亚哥在压力下保持优雅风度，“一个人可以被毁灭，但不能被打败”。\n    - 象征手法的运用：**大海**象征人生舞台与挑战，**马林鱼**象征理想与追求，**鲨鱼**象征无法抗拒的破坏性力量。\n    - **存在主义**色彩：强调个体在面对虚无与失败时的尊严与行动价值。\n    - 语言风格极度**简洁、准确、有力**，多用动词和名词，少用形容词，形成独特的叙事节奏。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - 亲身参与**第一次世界大战**，并在意大利前线受重伤，是“**迷惘的一代**”作家中战争创伤体验最直接的代表之一。\n    - 作为记者深度介入**西班牙内战**和**第二次世界大战**，其经历与写作紧密关联20世纪上半叶的重大国际冲突。\n    - 1954年因“精通叙事艺术，突出地表现在近著《老人与海》之中”获得**诺贝尔文学奖**。\n- 核心要点：\n    - 其人生与作品是“**迷惘的一代**”精神的缩影——对传统价值幻灭，在战后漂泊中寻找意义。\n    - 文学史定位为**美国现代主义文学**巨匠，革新了小说叙事语言，对后世影响深远。\n    - 其公众形象——**冒险家、战士、硬汉**——与作家身份交织，成为美国20世纪文化偶像之一。\n    - 评价复杂性：既被赞颂为勇敢与坚韧的象征，其晚年病痛与自杀也引发了关于英雄主义脆弱面的讨论。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 奥克帕克（美国） | 41.8851 | -87.7845 |\n| 堪萨斯城（美国） | 39.0997 | -94.5786 |\n| 米兰（意大利） | 45.4642 | 9.1900 |\n| 巴黎（法国） | 48.8566 | 2.3522 |\n| 基韦斯特（美国） | 24.5551 | -81.7800 |\n| 马德里（西班牙） | 40.4168 | -3.7038 |\n| 哈瓦那（古巴） | 23.1136 | -82.3666 |\n| 诺曼底（法国，以奥马哈海滩为例） | 49.3722 | -0.8764 |\n| 凯彻姆（美国） | 43.6813 | -114.3628 |", "relatedGraph": {"center": {"id": "海明威", "name": "海明威", "file": "海明威.html", "dynasty": "20世纪", "aliases": [], "birth_year": 1899, "death_year": 1961, "quote": "世界杀害最善良的人，最温和的人，最勇敢的人，如果你不是这三类人，你迟早也会被杀害，不过它也不特别着急。", "review": "世界杀害最善良的人，最温和的人，最勇敢的人，如果你不是这三类人，你迟早也会被杀害，不过它也不特别着急。", "foreign_name": "", "main_role_label": "作家", "birthplace": "奥克帕克", "birthplace_modern": "美国伊利诺伊州奥克帕克", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "海明威", "name": "海明威", "file": "海明威.html", "dynasty": "20世纪", "aliases": [], "birth_year": 1899, "death_year": 1961, "quote": "世界杀害最善良的人，最温和的人，最勇敢的人，如果你不是这三类人，你迟早也会被杀害，不过它也不特别着急。", "review": "世界杀害最善良的人，最温和的人，最勇敢的人，如果你不是这三类人，你迟早也会被杀害，不过它也不特别着急。", "foreign_name": "", "main_role_label": "作家", "birthplace": "奥克帕克", "birthplace_modern": "美国伊利诺伊州奥克帕克", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter
