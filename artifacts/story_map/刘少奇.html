  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

说明\n- 🗺️ **行程概览**：从湖南乡村到莫斯科，从白区秘密斗争到延安、西柏坡的革命中心，再到北京参与建国与治国，最终蒙难于开封。\n- ⏱️ **时间跨度**：1898年 - 1969年，历经约71个年头（跨年计算）。\n- 📍 **地理范围**：主要覆盖湖南、莫斯科、天津、延安、西柏坡、北京、开封等地。\n- 🌟 **重要节点数量**：9个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：宁乡县\n- **时间**：1898年11月24日\n- **停留时间**：约15年\n- **地点**：宁乡县花明楼炭子冲（今湖南省长沙市宁乡市花明楼镇）\n- **事件**：出生并度过童年与少年时期，接受私塾和新式小学教育。\n- **意义**：在湖湘乡间的私塾里，他熟读四书五经，习得旧式文人的笔墨根底；然而佃户艰辛、家境中落的现实，让朴素的同情悄然扎根——日后那份对劳苦大众的深沉牵挂，正萌芽于这方水土\n\n### 📍 重要地点：长沙\n- **时间**：1913年 - 1920年\n- **停留时间**：约7年\n- **地点**：长沙（今湖南省长沙市）\n- **事件**：先后就读于宁乡驻省中学、湖南陆军讲武堂、长沙私立育才中学。五四运动前后接触新思想。\n- **意义**：十三岁入省城，他剪去辫子换上洋装，在新文化运动浪潮中如饥似渴地阅读进步书刊。五四风雷激荡街头，他与同学登台演说、查烧日货，第一次真切触摸到\"救国\"二字的滚烫温度\n\n### 📍 重要地点：莫斯科\n- **时间**：1921年\n- **停留时间**：约半年\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：进入莫斯科东方劳动者共产主义大学学习，同年转入中国共产党。\n- **意义**：系统学习马克思列宁主义，确立共产主义信仰，完成从爱国青年到职业革命家的转变。\n\n### 📍 重要地点：安源\n- **时间**：1922年 - 1925年\n- **停留时间**：断续约3年\n- **地点**：安源（今江西省萍乡市安源区）\n- **事件**：与李立三等领导安源路矿工人大罢工，取得胜利。后长期指导安源工人运动。\n- **意义**：展现了卓越的工运领导才能，安源成为当时全国工人运动的一面旗帜。\n- **名篇名句**：《安源路矿工人俱乐部简章》：俱乐部之宗旨为：保护工人的利益，减除工人的压迫与痛苦。\n\n### 📍 重要地点：天津/北平\n- **时间**：1936年春 - 1937年\n- **停留时间**：约1年\n- **地点**：天津、北平（今天津市、北京市）\n- **事件**：作为中共中央代表主持北方局工作，纠正白区工作中的“左”倾错误，巩固和发展了华北抗日民族统一战线。\n- **意义**：成功实践并丰富了党在白区工作的正确策略，被誉为“正确路线在白区工作中的代表”。\n- **名篇名句**：《关于过去白区工作给中央的一封信》：在形势与条件不利于我们的情况下，应当避免和敌人进行决定胜负的战斗。\n\n### 📍 重要地点：延安\n- **时间**：1942年底 - 1947年\n- **停留时间**：约4年\n- **地点**：延安（今陕西省延安市）\n- **事件**：返回延安，参与领导整风运动和大生产运动。在中共七大上作《关于修改党章的报告》，首次系统阐述毛泽东思想。\n- **意义**：成为党的核心领导成员之一，其理论贡献（对毛泽东思想的概括）被确立为党的指导思想。\n- **名篇名句**：《论共产党员的修养》：我们的党员，不但要在艰苦的、困难的以至失败的革命实践中来锻炼自己……；《论党》：毛泽东思想，就是马克思列宁主义的理论与中国革命的实践之统一的思想。\n\n### 📍 重要地点：西柏坡\n- **时间**：1947年 - 1949年\n- **停留时间**：约2年\n- **地点**：西柏坡（今河北省石家庄市平山县西柏坡镇）\n- **事件**：任中共中央工作委员会书记，主持全国土地会议，主持制定《中国土地法大纲》。参与指挥战略决战，筹划新中国建设。\n- **意义**：领导了彻底摧毁封建根基的土地改革运动，为解放战争的胜利提供了根本保障；参与擘画新中国的蓝图。\n\n### 📍 重要地点：北京\n- **时间**：1949年 - 1966年\n- **停留时间**：约17年\n- **地点**：北京（今北京市）\n- **事件**：参与开国大典。历任中央人民政府副主席、全国人大常委会委员长、中华人民共和国主席等职。主持制定一系列法律法规，探索社会主义建设道路。1950年，参与制定《中华人民共和国土地改革法》。\n- **意义**：作为党和国家的主要领导人之一，为确立社会主义基本制度、开展有计划的经济建设、探索适合国情的社会主义道路进行了不懈努力。\n- **名篇名句**：在七千人大会上的讲话：过去我们经常把缺点、错误和成绩，比之于一个指头和九个指头的关系……恐怕是三个指头和七个指头的关系。\n\n### 🔴 去世地：开封\n- **时间**：1969年10月 - 11月12日\n- **停留时间**：约1个月\n- **地点**：开封（今河南省开封市）\n- **事件**：在“文化大革命”中遭受残酷迫害，被强行从北京疏散至开封，于1969年11月12日在此地含冤病逝。\n- **意义**：生命的最后驿站，其悲剧性结局是“文化大革命”造成深重灾难的历史见证。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1898 | 宁乡县 | 湖南省长沙市宁乡市花明楼镇 | （年龄：0）出生于湖南宁乡炭子冲。 |\n| 1920 |  |  | （年龄：22岁）加入中国社会主义青年团。 |\n| 1921 | 莫斯科 | 俄罗斯莫斯科 | （年龄：23岁）赴莫斯科东方大学学习，转入中国共产党。 |\n| 1922 | 安源 | 江西省萍乡市安源区 | （年龄：24岁）从莫斯科回国，领导安源路矿工人大罢工。 |\n| 1925 |  |  | （年龄：27岁）当选为中华全国总工会副委员长。 |\n| 1927 |  |  | （年龄：29岁）在中共五大上当选为中央委员。 |\n| 1932 |  |  | （年龄：34岁）进入中央革命根据地，领导职工运动。 |\n| 1934 |  |  | （年龄：36岁）参加长征，在遵义会议上支持毛泽东的正确主张。 |\n| 1936 |  |  | （年龄：38岁）任中共中央代表，主持北方局工作。 |\n| 1938 |  |  | （年龄：40岁）任中共中央中原局书记，领导开创华中敌后抗日根据地。 |\n| 1943 | 延安 | 陕西省延安市 | （年龄：45岁）返回延安，任中共中央书记处书记和中央革命军事委员会副主席。 |\n| 1945 |  |  | （年龄：47岁）在中共七大上作《关于修改党章的报告》，当选为中央政治局委员、中央书记处书记。 |\n| 1947 |  |  | （年龄：49岁）任中共中央工作委员会书记，主持全国土地会议，主持制定《中国土地法大纲》。 |\n| 1949 |  |  | （年龄：51岁）当选为中央人民政府副主席。 |\n| 1950 |  |  | （年龄：52岁）参与制定《中华人民共和国土地改革法》。 |\n| 1954 |  |  | （年龄：56岁）当选为全国人大常委会委员长。 |\n| 1956 |  |  | （年龄：58岁）在中共八大上作政治报告，当选为中共中央副主席。 |\n| 1959 |  |  | （年龄：61岁）当选为中华人民共和国主席。 |\n| 1966 |  |  | （年龄：68岁）“文化大革命”开始后，受到错误批判和残酷迫害。 |\n| 1968 |  |  | （年龄：70岁）被错误地“永远开除出党”。 |\n| 1969 | 开封 | 河南省开封市 | （年龄：71岁）于11月12日在河南开封含冤逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《论共产党员的修养》**（节选）曾作为重要学习材料。\n- 核心要点：\n    - **重点**：**《论共产党员的修养》** 系统论述了共产党员在革命实践中的自我改造和锻炼问题，强调 **党性修养** 的极端重要性。\n    - 文章运用了大量 **中国古代修身思想** 的精华，将其与 **无产阶级世界观** 相结合，论述深入浅出。\n    - **重点**：提出了共产党员应以 **个人利益服从党的利益** 为最高原则，批判了形形色色的 **个人主义**。\n    - 阐述了 **理论学习** 与 **革命实践** 相结合的修养方法。\n    - **重点**：其文风 **逻辑严密**、**说理透彻**，是政论文的典范，体现了将马克思主义原理 **中国化**、**具体化** 的阐述能力。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**安源路矿工人大罢工**（1922年）的主要领导人之一，展现了早期 **工人运动** 的组织与斗争艺术。\n    - **白区工作正确路线的代表**：在土地革命战争时期，正确领导了党在国民党统治区的工作。\n    - **重点**：**中共七大** 上作 **《论党》** 的报告，对 **毛泽东思想** 的科学概念和体系作了完整概括和系统阐述。\n    - 主持制定 **《中国土地法大纲》**（1947年），推动了 **解放区土地改革** 的深入发展。\n    - **重点**：1959年当选为 **中华人民共和国主席**，1962年 **七千人大会** 上对“大跃进”以来的错误作了深刻反思。\n- 核心要点：\n    - **重点**：是 **中国工人运动** 的杰出领袖和 **党的白区工作** 正确策略的代表。\n    - **重点**：是 **毛泽东思想** 的主要贡献者和系统阐述者之一，为马克思主义 **中国化** 作出了重大理论贡献。\n    - 在 **社会主义建设道路的探索** 中，提出了许多富有创见的思想，如 **“两种劳动制度、两种教育制度”**。\n    - **重点**：其在 **“文化大革命”** 中的悲惨遭遇，是党和人民反思历史错误、最终实现 **拨乱反正** 的重要历史节点。\n    - 1980年中共十一届五中全会 **为其恢复名誉**，是 **实事求是** 思想路线的重大胜利。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 宁乡县 | 湖南省长沙市宁乡市花明楼镇 | 28.0150 | 112.4850 |\n| 长沙 | 湖南省长沙市 | 28.2282 | 112.9388 |\n| 莫斯科 | 俄罗斯莫斯科 | 55.7558 | 37.6173 |\n| 安源 | 江西省萍乡市安源区 | 27.6256 | 113.8559 |\n| 天津/北平 | 天津市 | 39.4942 | 116.8046 |\n| 延安 | 陕西省延安市 | 36.5854 | 109.4898 |\n| 西柏坡 | 河北省石家庄市平山县西柏坡镇 | 38.3410 | 113.9880 |\n| 北京 | 北京市 | 39.9042 | 116.4074 |\n| 开封 | 河南省开封市 | 34.7971 | 114.3076 |\n","relatedGraph":{"center":{"id":41,"name":"刘少奇","file":"刘少奇.html","dynasty":"近现代","birth_year":1898,"death_year":1969,"time_year":1940,"quote":"两种劳动制度、两种教育制度","review":"","aliases":["胡服"],"foreign_name":"","domain_tags":[],"main_role_band":"politics","main_role_label":"无产阶级革命家","birthplace":"宁乡县","birthplace_raw":"宁乡县今湖南省长沙市宁乡市","birthplace_modern":"湖南省长沙市宁乡市","birth_lat_wgs84":28.2282,"birth_lng_wgs84":112.9388,"birth_lat":28.2282,"birth_lng":112.9388,"birth_coord_system":"WGS84","has_story":1,"native_place":"","native_place_raw":"","native_place_modern":"","search_keys":["刘少奇","胡服"],"search_tokens":["刘少奇","胡服","liushaoqi","lsq","hufu","hf"],"search_pinyin":["liushaoqi","lsq","hufu","hf"],"is_foreign":0,"created_at":"2026-07-01 07:17:24","updated_at":"2026-07-01 07:17:24","isCenter":true,"relationLabel":"中心人物"},"nodes":[{"id":41,"name":"刘少奇","file":"刘少奇.html","dynasty":"近现代","birth_year":1898,"death_year":1969,"time_year":1940,"quote":"两种劳动制度、两种教育制度","review":"","aliases":["胡服"],"foreign_name":"","domain_tags":[],"main_role_band":"politics","main_role_label":"无产阶级革命家","birthpla
