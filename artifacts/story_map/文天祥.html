  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

y_only"}}, "markdown": "# 文天祥\n\n## 人物档案\n\n### 基本信息\n- **姓名**：文天祥\n- **时代**：南宋末期\n- **出生**：公元1236年，吉州庐陵（今江西省吉安市）（出生日期有六月初二和五月二日等说法，存疑）\n- **去世**：公元1283年，元大都（今北京市）\n- **享年**：47岁\n- **主要身份**：政治家、文学家、抗元名臣、民族英雄\n- **历史地位**：南宋末年坚持抗元的代表人物，以其崇高的气节和爱国精神被后世尊为民族英雄。\n- **主要成就**：\n    - 状元及第，以忠直敢言著称。\n    - 在南宋危亡之际组织义军，坚持抗元斗争。\n    - 被俘后拒不投降，从容就义，留下《正气歌》等不朽诗篇。\n    - 其“人生自古谁无死，留取丹心照汗青”的精神成为中华民族的宝贵财富。\n\n### 生平概述\n文天祥生于南宋末年，自幼仰慕忠烈，二十岁状元及第，因直言时弊屡遭贬斥。元军南侵，他于国家危难之际起兵勤王，官至右丞相。出使元营被扣押，后于镇江脱险，继续在东南沿海领导抗元斗争，兵败被俘。囚禁三年间，面对威逼利诱始终坚贞不屈，最终在元大都柴市从容就义。他的一生是爱国志士为国捐躯的壮烈写照，其诗文与人格光辉千古。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从江西出生地出发，辗转于南宋都城、东南沿海抗元战场，最终北上囚禁并就义于元大都。\n- ⏱️ **时间跨度**：公元1236年 - 1283年，共47年。\n- 📍 **地理范围**：主要覆盖今江西、浙江、江苏、福建、广东、北京等省市。\n- 🌟 **重要节点数量**：核心地点10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：吉州庐陵\n- **时间**：公元1236年\n- **停留时间**：青少年时期\n- **地点**：吉州庐陵（今江西省吉安市）\n- **事件**：出生于一个书香门第，自幼受到良好教育。\n- **意义**：塑造了他忠孝节义的思想基础，故乡的先贤如欧阳修、胡铨等成为其榜样。\n\n### 📍 重要地点：临安\n- **时间**：公元1256年\n- **停留时间**：科举及为官初期\n- **地点**：临安（今浙江省杭州市）\n- **事件**：年仅二十一岁，状元及第。因父丧守制，后入仕，因直言批评宦官董宋臣等，多次被贬或辞官。\n- **意义**：人生高光起点，展现了其刚直不阿的品格，也预示了其仕途的坎坷。\n\n### 📍 重要地点：瑞州\n- **时间**：约公元1270年-1273年\n- **停留时间**：数年\n- **地点**：瑞州（今江西省高安市）\n- **事件**：任江西提刑，后因得罪权臣贾似道再度被罢官。\n- **意义**：当最后的抗元旗号在岭海间飘落，所有始于临安的救国之路终于走到尽头。曾经的少年书生已蜕变为铁链缠身仍不跪的囚徒，临安城是他命运的起点，亦是一切悲歌的序章\n\n### 📍 重要地点：赣州\n- **时间**：公元1275年\n- **停留时间**：数月\n- **地点**：赣州（今江西省赣州市）\n- **事件**：闻元军渡江，奉诏起兵勤王，聚集义军万余人入卫临安。\n- **意义**：从文臣转向武将，投身抗元救亡的实际行动，是其军事生涯的起点。\n\n### 📍 重要地点：临安（第二次）\n- **时间**：公元1276年\n- **停留时间**：数月\n- **地点**：临安（今浙江省杭州市）\n- **事件**：临危受命，任右丞相兼枢密使，赴元营谈判被扣。南宋朝廷投降。\n- **意义**：当最后的抗元旗号在岭海间飘落，所有始于临安的救国之路终于走到尽头。曾经的少年书生已蜕变为铁链缠身仍不跪的囚徒，临安城是他命运的起点，亦是一切悲歌的序章\n\n### 📍 重要地点：镇江\n- **时间**：公元1276年\n- **停留时间**：短暂\n- **地点**：镇江（今江苏省镇江市）\n- **事件**：在被押解北上途中，于镇江乘夜逃脱。\n- **意义**：当最后的抗元旗号在岭海间飘落，所有始于临安的救国之路终于走到尽头。曾经的少年书生已蜕变为铁链缠身仍不跪的囚徒，临安城是他命运的起点，亦是一切悲歌的序章\n\n### 📍 重要地点：南剑州\n- **时间**：公元1276年-1277年\n- **停留时间**：约一年\n- **地点**：南剑州（今福建省南平市）\n- **事件**：脱险后至此，开府聚兵，重建抗元指挥中心，收复多处州县。\n- **意义**：当最后的抗元旗号在岭海间飘落，所有始于临安的救国之路终于走到尽头。曾经的少年书生已蜕变为铁链缠身仍不跪的囚徒，临安城是他命运的起点，亦是一切悲歌的序章\n\n### 📍 重要地点：五坡岭\n- **时间**：公元1278年\n- **停留时间**：被俘瞬间\n- **地点**：五坡岭（今广东省海丰县北）\n- **事件**：在率部转移途中，于五坡岭吃饭时遭元军突袭，兵败被俘。\n- **意义**：1276年正月，伯颜铁骑兵临城下，谢太后携幼帝奉表出降，繁华南宋国祚就此终结。文天祥以右丞相之尊入元营议和却被扣押，从力挽狂澜到身陷囹圄的命运转折，在这座他曾誓死守护的都城轰然铸定\n\n### 📍 重要地点：零丁洋\n- **时间**：公元1279年\n- **停留时间**：途经\n- **地点**：零丁洋（今广东省珠江口外，属珠海市海域）\n- **事件**：被元军押解过零丁洋，目睹南宋最后的行朝覆灭（崖山海战）。元将张弘范逼其写信招降张世杰，他写下《过零丁洋》诗以明志。\n- **意义**：创作了千古绝唱“人生自古谁无死，留取丹心照汗青”，标志着其精神境界的升华。\n\n### 🔴 去世地：元大都\n- **时间**：公元1283年\n- **停留时间**：约三年（囚禁）\n- **地点**：元大都（今北京市）\n- **事件**：被囚于兵马司土牢近三年，忽必烈亲自劝降，许以宰相高位，均遭严词拒绝。最终在柴市（今北京市东城区府学胡同西口，一说为菜市口，存疑）从容就义。\n- **意义**：以生命践行了“丹心照汗青”的誓言，其殉国之举震动天下，成为后世忠义精神的最高象征。\n- **名篇名句**：《正气歌》：天地有正气，杂然赋流形；《正气歌》：时穷节乃见，一一垂丹青。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1236 | 吉州庐陵 | 江西省吉安市 | （年龄：1岁）出生于吉州庐陵（今江西吉安）。 |\n| 1256 |  |  | （年龄：21岁）状元及第，因父丧返乡守制。 |\n| 1259 |  |  | （年龄：24岁）补授承事郎、签书宁海军节度判官厅公事，开始仕途。 |\n| 1275 | 赣州 | 江西省赣州市 | （年龄：40岁）于赣州起兵勤王，率义军入卫临安。 |\n| 1276 | 镇江 | 江苏省镇江市 | （年龄：41岁）任右丞相，赴元营谈判被扣；同年于镇江脱险。 |\n| 1276-1277 | 南剑州 | 福建省南平市 | （年龄：41-42岁）在福建南剑州开府，领导抗元，一度收复多处失地。 |\n| 1278 | 五坡岭 | 广东省海丰县北 | （年龄：43岁）在广东五坡岭兵败被俘。 |\n| 1279 | 零丁洋 | 广东省珠江口外，属珠海市海域 | （年龄：44岁）过零丁洋，作《过零丁洋》；目睹崖山之战，南宋灭亡。 |\n| 1279-1282 | 元大都 | 北京市 | （年龄：44-47岁）被囚于元大都，作《正气歌》，拒绝投降。 |\n| 1283 | 元大都 | 北京市 | （年龄：47岁）于元大都柴市从容就义。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《过零丁洋》**、**《正气歌》**（节选）\n- 核心要点：\n    - **重点**：**《过零丁洋》** 尾联“人生自古谁无死？留取丹心照汗青”是千古名句，集中体现了诗人**视死如归**的崇高气节和**忠贞爱国**的赤诚之心。\n    - **重点**：**《正气歌》** 通过列举历代忠臣义士的壮举，歌颂了充塞天地之间的“**正气**”，是诗人精神力量的集中宣言，也是其**坚贞不屈**人格的写照。\n    - 诗歌善用**比喻**和**典故**，如“山河破碎风飘絮，身世浮沉雨打萍”以自然景象喻国势与个人命运，形象沉痛。\n    - **情感线索**：从对个人身世飘零的慨叹（“辛苦遭逢起一经”），到对国家危亡的悲痛（“山河破碎”），最终升华为以死明志的决绝（“留取丹心”）。\n    - **风格**：诗风**慷慨悲壮**、**沉郁苍凉**，充满**浩然正气**，是爱国主义诗歌的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**南宋末年**，元军大举南下，文天祥是**主战派**的代表人物，组织**勤王**义军进行抵抗。\n    - 被俘后，面对元朝统治者的**威逼利诱**，始终**拒不投降**，体现了崇高的**民族气节**。\n    - **崖山海战**（1279年）标志着**南宋灭亡**，文天祥被俘后目睹此景，其抗争具有了为故国守节的悲壮色彩。\n- 核心要点：\n    - **重点**：文天祥与**陆秀夫**、**张世杰**并称为“**宋末三杰**”，是南宋抗元斗争最后的精神象征。\n    - **重点**：他的就义，使其从一位历史人物升华为**民族英雄**和**忠义精神**的文化符号，对后世（尤其是明清易代之际）产生了深远影响。\n    - **历史评价**：其事迹被载入正史《宋史》，历代统治者多加褒扬，以倡导**忠君爱国**的价值观。\n    - **重点**：其名言“**留取丹心照汗青**”超越了具体的历史语境，成为中华民族**爱国主义**和**牺牲精神**的永恒格言。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 吉州庐陵 | 江西省吉安市 | 27.1134 | 114.9927 |\n| 临安 | 浙江省杭州市 | 30.2741 | 120.1551 |\n| 瑞州 | 江西省高安市 | 28.4194 | 115.3753 |\n| 赣州 | 江西省赣州市 | 25.8318 | 114.9334 |\n| 临安（第二次） | 江苏省镇江市 | 32.1896 | 119.4253 |\n| 镇江 | 福建省南平市 | 26.6418 | 118.1776 |\n| 南剑州 | 广东省海丰县 | 22.9666 | 115.3328 |\n| 五坡岭 | 广东省珠江口外，属珠海市海域 | 22.1927 | 113.5539 |\n| 零丁洋 | 广东省珠海市（珠江口） | 22.2667 | 113.7500 |\n| 元大都 | 北京市（东城区） | 39.9289 | 116.4167 |\n", "relatedGraph": {"center": {"id": 188, "name": "文天祥", "file": "文天祥.html", "dynasty": "南宋末期", "birth_year": 1236, "death_year": 1283, "time_year": 1258, "quote": "人生自古谁无死，留取丹心照汗青", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "政治家", "birthplace": "吉州庐陵", "birthplace_raw": "吉州庐陵今江西省吉安市", "birthplace_modern": "江西省吉安市", "birth_lat_wgs84": 27.1134, "birth_lng_wgs84": 114.9927, "birth_lat": 27.1134, "birth_lng": 114.9927, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["文天祥"], "search_tokens": ["文天祥", "wentianxiang", "wtx"], "search_pinyin": ["wentianxiang", "wtx"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "isCenter": true, "relationLabel": "中心人物"}, "nodes": [{"id": 188, "name": "文天祥", "file": "文天祥.html", "dynasty": "南宋末期", "birth_year": 1236, "death_year": 1283, "time_year": 1258, "quote": "人生自古谁无死，留取丹心照汗青", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "政治家", "birthplace": "吉州庐陵", "birthplace_raw": "吉州庐陵今江西省吉安市", "birthplace_modern": "江西省吉安市", "birth_lat_wgs84": 27.1134, "birth_lng
