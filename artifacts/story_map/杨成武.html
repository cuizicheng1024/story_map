  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

，少年时期接受进步思想影响。\n- **意义**：闽西长汀的客家少年，十四岁便辞别父老投身革命洪流，从田间地头走向烽火前线。客家先民千年迁徙铸就的血性与韧劲，悄然塑造了这位未来将军的精神骨骼\n\n### 📍 重要地点：闽西苏区\n- **时间**：1929年-1934年\n- **停留时间**：约5年\n- **地点**：闽西（今福建省龙岩市）\n- **事件**：参加闽西农民暴动，加入中国工农红军，参与创建和保卫闽西苏区，参加中央苏区历次反“围剿”。\n- **意义**：从普通战士成长为团政治委员，经受了严峻的战争考验，坚定了革命信念。\n\n### 📍 重要地点：江西瑞金\n- **时间**：1931年-1934年（主要活动期间）\n- **停留时间**：断续驻扎\n- **地点**：瑞金（今江西省瑞金市）\n- **事件**：在红一军团任职，参加中华苏维埃共和国相关军事活动，聆听毛泽东等领导人指示。\n- **意义**：在中央苏区核心区域战斗和工作，接受了系统的革命教育和军事训练。\n\n### 📍 重要地点：长征路（湘江、遵义、大渡河）\n- **时间**：1934年10月-1935年10月\n- **停留时间**：行军途中\n- **地点**：湘江（今广西东北部）、遵义（今贵州省遵义市）、泸定桥（今四川省甘孜州泸定县）等\n- **事件**：率部血战湘江，参加遵义会议后的系列作战，参与飞夺泸定桥战斗（具体指挥角色存疑）。\n- **意义**：在长征最艰难的时刻，完成了保卫党中央和中央红军的关键任务，展现了卓越的指挥才能。\n- **名篇名句**：《忆长征》：描述了飞夺泸定桥的惊险与英勇。\n\n### 📍 重要地点：陕北吴起镇\n- **时间**：1935年10月\n- **停留时间**：短暂休整\n- **地点**：吴起镇（今陕西省延安市吴起县）\n- **事件**：随中央红军到达陕北，结束长征。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：陕西延安\n- **时间**：1937年-1938年（主要学习期间）\n- **停留时间**：约1年\n- **地点**：延安（今陕西省延安市）\n- **事件**：在抗日军政大学学习，聆听毛泽东等中央领导讲课，为奔赴抗日前线做准备。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：山西平型关\n- **时间**：1937年9月\n- **停留时间**：战斗期间\n- **地点**：平型关（今山西省大同市灵丘县）\n- **事件**：作为八路军第115师独立团团长，率部在腰站阻击日军，保障了平型关主战场的胜利。\n- **意义**：参与了全国抗战以来的第一个大胜仗，极大地鼓舞了全国军民的抗战信心。\n\n### 📍 重要地点：河北黄土岭\n- **时间**：1939年11月\n- **停留时间**：战斗期间\n- **地点**：黄土岭（今河北省保定市涞源县）\n- **事件**：指挥八路军晋察冀军区部队进行黄土岭伏击战，击毙日军独立混成第2旅团旅团长阿部规秀中将。\n- **意义**：这是抗战中八路军击毙的日军最高级别将领，沉重打击了日军的嚣张气焰，杨成武威名远扬。\n- **名篇名句**：《黄土岭战役》：详细记述了击毙“名将之花”的经过。\n\n### 📍 重要地点：河北张家口\n- **时间**：1945年8月-1946年10月（首次占领期间）\n- **停留时间**：约1年\n- **地点**：张家口（今河北省张家口市）\n- **事件**：率部解放张家口，并担任张家口卫戍司令员，后在此组织防御。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：河北石家庄\n- **时间**：1947年11月\n- **停留时间**：战役期间\n- **地点**：石家庄（今河北省石家庄市）\n- **事件**：参与指挥石家庄战役，此役是人民解放军首次攻克坚固设防的大城市。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：天津\n- **时间**：1949年1月\n- **停留时间**：战役期间\n- **地点**：天津（今天津市）\n- **事件**：作为平津战役前线指挥员之一，指挥部队参与解放天津的战斗。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：朝鲜战场\n- **时间**：1951年-1952年\n- **停留时间**：约1年\n- **地点**：朝鲜（具体地点存疑，可能涉及平安北道、平安南道等地区）\n- **事件**：任中国人民志愿军第20兵团司令员，率部参加秋季战术反击作战等。\n- **意义**：烽烟散尽，岁月静好。当这位开国上将的人生终章落笔，他戎马半生的精神根系却从未褪色——闽西的青山绿水间，那段客家少年投身革命的青春足音，至今仍清晰可闻\n\n### 📍 重要地点：北京（总参谋部）\n- **时间**：1954年-1965年（主要任职期间）\n- **停留时间**：约11年\n- **地点**：北京（今北京市）\n- **事件**：历任中国人民解放军副总参谋长、代总参谋长等职，参与军队现代化、正规化建设。\n- **意义**：2004年杨成武在北京辞世，享年九十一岁。从闽西少年到开国上将，他的一生与中国革命和军队现代化进程同步。\"能打硬仗、善打恶仗\"的军事遗产，至今仍在人民军队的血脉中传承\n\n### 📍 重要地点：北京（特殊时期）\n- **时间**：1966年-1976年（存疑，此期间经历复杂）\n- **停留时间**：存疑\n- **地点**：北京（今北京市）\n- **事件**：在特殊历史时期受到冲击，后复出工作（具体地点和职务变动存疑）。\n- **意义**：烽烟散尽，岁月静好。当这位开国上将的人生终章落笔，他戎马半生的精神根系却从未褪色——闽西的青山绿水间，那段客家少年投身革命的青春足音，至今仍清晰可闻\n\n### 🔴 去世地：北京\n- **时间**：2004年2月14日\n- **停留时间**：晚年长期居住\n- **地点**：北京（今北京市）\n- **事件**：因病医治无效逝世。\n- **意义**：1929年，十六岁的杨成武在长汀放下锄头拿起枪杆，加入红四军踏上革命征途。闽西的山风与硝烟，铸就了他最初的信仰，这片故土是他将星之路的起点\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1914 | 福建长汀 | 福建省龙岩市长汀县 | （年龄：0）出生于福建长汀 |\n| 1929 | 闽西苏区 | 福建省龙岩市 | （年龄：15）参加闽西农民暴动，加入中国工农红军 |\n| 1930 |  |  | （年龄：16）加入中国共产党 |\n| 1934-1935 | 长征路（湘江、遵义、大渡河） | 广西东北部 | （年龄：20-21）参加中央红军长征，参与飞夺泸定桥等战斗（具体指挥角色存疑） |\n| 1937 | 山西平型关 | 山西省大同市灵丘县 | （年龄：23）参加平型关战役（腰站阻击战） |\n| 1939 | 河北黄土岭 | 河北省保定市涞源县 | （年龄：25）指挥黄土岭战役，击毙日军阿部规秀中将 |\n| 1945 | 河北张家口 | 河北省张家口市 | （年龄：31）率部解放张家口 |\n| 1947 | 河北石家庄 | 河北省石家庄市 | （年龄：33）参与指挥石家庄战役 |\n| 1949 | 天津 | 天津市 | （年龄：35）参与指挥天津战役 |\n| 1951-1952 |  |  | （年龄：37-38）参加抗美援朝，任志愿军第20兵团司令员 |\n| 1954-1965 |  |  | （年龄：40-51）历任解放军副总参谋长、代总参谋长 |\n| 1955 |  |  | （年龄：41）被授予上将军衔 |\n| 2004 | 北京 | 北京市 | （年龄：90）在北京逝世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 相关课文篇目或阅读材料：**《飞夺泸定桥》**（通常为相关历史事件记述或杨成武回忆录节选，常见于历史或语文拓展阅读）、**《黄土岭战役》**（通常为相关历史事件记述或杨成武回忆录节选，常见于历史或语文拓展阅读）\n- 核心要点：\n    - **重点**：**《飞夺泸定桥》** 生动刻画了红军战士在极端恶劣条件下，昼夜兼程二百四十里，**夺桥**的英勇壮举，体现了**革命英雄主义**精神。（注：具体指挥角色存疑）\n    - **重点**：**《黄土岭战役》** 详细描述了**伏击战**的部署与过程，突出指挥员**杨成武**的**军事谋略**和八路军将士的**英勇顽强**。\n    - 作品中大量运用**细节描写**和**场景烘托**，渲染了战斗的紧张与残酷。\n    - 通过典型事件塑造了红军/八路军**集体英雄**的光辉形象。\n    - **重点**：这些篇章是进行**革命传统教育**和**爱国主义教育**的生动教材，展现了**人民军队**的优良作风。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**长征**中参与**飞夺泸定桥**，是确保中央红军跳出敌人包围圈的关键一仗。（注：具体指挥角色存疑）\n    - **重点**：**抗日战争**中指挥**黄土岭战役**，击毙日军中将**阿部规秀**，是敌后战场的重大胜利。\n    - **解放战争**中参与**石家庄战役**，这是人民解放军**首次攻克**坚固设防的大城市。\n    - 参与指挥**平津战役**中的**天津**战斗。\n    - **抗美援朝**战争中担任**志愿军兵团司令员**。\n- 核心要点：\n    - **重点**：杨成武是**中国人民解放军**从红军时期成长起来的**杰出军事指挥员**的代表之一。\n    - **重点**：其军事生涯贯穿**土地革命、抗日战争、解放战争、抗美援朝**，是**中国革命战争史**的亲历者和见证者。\n    - **重点**：在**抗日战争**的**敌后战场**，他指挥的战斗有力打击了日本侵略者，振奋了全国军民的**抗战信心**。\n    - 他的作战风格以**英勇果断**、**善于打硬仗**著称，为**人民军队**的战史增添了光辉篇章。\n    - 新中国成立后，他为**国防和军队现代化**建设作出了重要贡献。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 福建省龙岩市长汀县 | 25.8333 | 116.3167 |\n| 福建省龙岩市 | 25.0833 | 117.0333 |\n| 江西省瑞金市 | 25.8833 | 116.0333 |\n| 广西东北部 | 25.2742 | 110.2964 |\n| 贵州省遵义市 | 27.7000 | 106.9000 |\n| 四川省甘孜州泸定县 | 29.9167 | 102.2333 |\n| 陕西省延安市吴起县 | 36.9333 | 108.1833 |\n| 陕西省延安市 | 36.6000 | 109.4833 |\n| 山西省大同市灵丘县 | 39.4333 | 114.2333 |\n| 河北省保定市涞源县 | 39.3500 | 114.6833 |\n| 河北省张家口市 | 40.8000 | 114.9333 |\n| 河北省石家庄市 | 38.0500 | 114.5000 |\n| 天津市 | 39.1333 | 117.2000 |\n| 北京市 | 39.9000 | 116.4000 |\n","relatedGraph":{"center":{"id":240,"name":"杨成武","file":"杨成武.html","dynasty":"近现代（中华民国、中华人民共和国）","birth_year":1914,"death_year":2004,"time_year":1932,"quote":"杨成武，福建长汀人，1929年参加革命，1930年加入中国共产党","review":"","aliases":[],"foreign_name":"","domain_tags":[],"main_role_band":"military","main_role_label":"军事家","birthplace":"福建长汀","birthplace_raw":"福建长汀今福建省龙岩市长汀县","birthplace_modern":"福建省龙岩市长汀县","birth_lat_wgs84":25.8333,"birth_lng_wgs84":116.3167,"birth_lat":25.8333,"birth_lng":116.3167,"birth_coord_system":"WGS84","has_story":1,"native_place":"","native_place_raw":"","native_place_modern":"","search_keys":["杨成武"],"search_tokens":["杨成武","yangchengwu","ycw"],"search_pinyin":["yan
