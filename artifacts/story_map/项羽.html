  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

, "汉文帝", "汉武帝", "霍光", "狐偃", "贾谊", "老子", "刘邦", "齐桓公", "秦始皇", "司马迁", "宋襄公", "伍子胥", "项羽", "荀子", "重耳"], "era": "西汉", "genre": "散文", "one_liner": "班固的散文辞藻典雅，组织严密，与《史记》的疏荡雄奇风格形成对比，代表了汉代史传文学的另一种典范。", "summary": "班固的散文辞藻典雅，组织严密，与《史记》的疏荡雄奇风格形成对比，代表了汉代史传文学的另一种典范。", "quote": "司马迁生于史官世家，早年受学于董仲舒、孔安国，并壮游天下。", "quotes": ["司马迁生于史官世家，早年受学于董仲舒、孔安国，并壮游天下。", "其文学成就被誉为“史家之绝唱，无韵之离骚”。", "天下熙熙，皆为利来；天下攘攘，皆为利往。"], "quote_policy": "preferred"}}, "markdown": "# 项羽\n\n## 人物档案\n\n### 基本信息\n- **姓名**：项羽\n- **别名**：项籍、西楚霸王\n- **时代**：秦末汉初\n- **出生**：公元前232年（存疑），下相县（今江苏省宿迁市）。注：生年有公元前232年、公元前233年等不同说法。\n- **去世**：公元前202年，乌江（今安徽省马鞍山市和县乌江镇）\n- **享年**：30岁（注：按周岁计算，公元前232年至公元前202年为30年，生年存疑）\n- **主要身份**：军事家、政治家、反秦起义军领袖\n- **历史地位**：\n    - 秦亡后分封天下，自号“西楚霸王”。\n    - 中国历史上最为勇猛的军事统帅之一。\n- **主要成就**：\n    - 钜鹿之战歼灭秦军主力，奠定灭秦基础。\n    - 分封十八路诸侯，主导秦亡后政治格局。\n    - 个人武勇冠绝古今，被誉为“羽之神勇，千古无二”。\n\n### 生平概述\n项羽，名籍，字羽，楚国名将项燕之孙。秦末随叔父项梁于会稽郡起兵反秦。项梁战死后，他在钜鹿之战中破釜沉舟，大败秦军主力，威震诸侯。秦亡后，他自立为西楚霸王，分封诸侯，但因分封不公引发战乱。随后与汉王刘邦展开了长达四年的“楚汉战争”，虽屡战屡胜，但战略上逐渐失势。公元前202年，被刘邦大军围困于垓下，突围后于乌江边自刎而死，结束了其波澜壮阔而又充满悲剧色彩的一生。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从江东起兵，转战中原、关中，最终败亡于长江北岸。\n- ⏱️ **时间跨度**：公元前209年-公元前202年（起兵至败亡），共8年。\n- 📍 **地理范围**：覆盖今江苏、安徽、河南、河北、山东、陕西等省。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：下相县\n- **时间**：公元前232年（存疑）\n- **停留时间**：少年时期\n- **地点**：下相县（今江苏省宿迁市）\n- **事件**：出生于楚国贵族世家，祖父为楚国名将项燕。\n- **意义**：项氏世代为楚将，血脉中流淌着将门基因。秦末大乱之际，正是这份\"亡秦必楚\"的贵族底蕴，让项羽得以一呼百应，迅速成为反秦大旗下的领袖旗帜\n\n### 📍 重要地点：会稽郡\n- **时间**：公元前209年\n- **停留时间**：数月\n- **地点**：会稽郡治吴县（今江苏省苏州市）\n- **事件**：随叔父项梁在此杀死会稽郡守殷通，举兵反秦，得精兵八千。\n- **意义**：项梁项羽叔侄在会稽起兵后迅速整军经武，连败秦军。血战中项梁运筹帷幄、项羽冲锋陷阵的身影，让起义军士气大振，也让天下人初识了项氏将门后裔的赫赫威名\n\n### 📍 重要地点：东阿\n- **时间**：公元前208年\n- **停留时间**：短暂\n- **地点**：东阿（今山东省聊城市阳谷县阿城镇）\n- **事件**：与项梁率军在此大破秦将章邯，取得反秦初期的重大胜利。\n- **意义**：项梁项羽叔侄在会稽起兵后迅速整军经武，连败秦军。血战中项梁运筹帷幄、项羽冲锋陷阵的身影，让起义军士气大振，也让天下人初识了项氏将门后裔的赫赫威名\n\n### 📍 重要地点：定陶\n- **时间**：公元前208年\n- **停留时间**：短暂\n- **地点**：定陶（今山东省菏泽市定陶区）\n- **事件**：叔父项梁因轻敌在此被秦将章邯击败，兵败身死。\n- **意义**：垓下之围、四面楚歌，从会稽起兵的西楚霸王迎来了命运的终章。与虞姬诀别后率残部突围，至乌江畔因无颜见江东父老拔剑自刎，十年争霸终成绝响，英雄末路令千古扼腕\n\n### 📍 重要地点：新安\n- **时间**：公元前207年\n- **停留时间**：短暂\n- **地点**：新安（今河南省三门峡市渑池县）\n- **事件**：秦军投降后，因担心秦吏卒不服，于夜间坑杀秦降卒二十余万人。\n- **意义**：此举虽震慑了秦地，但也严重损害了项羽的政治声誉，为日后失关中民心埋下伏笔。\n\n### 📍 重要地点：咸阳\n- **时间**：公元前206年\n- **停留时间**：约一至两个月\n- **地点**：咸阳（今陕西省咸阳市）\n- **事件**：入关中，屠咸阳城，杀秦王子婴，烧秦宫室，火三月不灭。\n- **事件**：拒绝定都关中，说出“富贵不归故乡，如衣绣夜行”之语。\n- **意义**：项梁项羽叔侄在会稽起兵后迅速整军经武，连败秦军。血战中项梁运筹帷幄、项羽冲锋陷阵的身影，让起义军士气大振，也让天下人初识了项氏将门后裔的赫赫威名\n\n### 📍 重要地点：彭城\n- **时间**：公元前206年-公元前202年\n- **停留时间**：数年（作为都城）\n- **地点**：彭城（今江苏省徐州市）\n- **事件**：自立为西楚霸王，建都于此。后在此以三万精兵大破刘邦五十六万诸侯联军。\n- **意义**：垓下之围、四面楚歌，从会稽起兵的西楚霸王迎来了命运的终章。与虞姬诀别后率残部突围，至乌江畔因无颜见江东父老拔剑自刎，十年争霸终成绝响，英雄末路令千古扼腕\n\n### 📍 重要地点：荥阳\n- **时间**：公元前204年\n- **停留时间**：对峙数月\n- **地点**：荥阳（今河南省郑州市荥阳市）\n- **事件**：与刘邦在此长期对峙，曾围困刘邦于荥阳城，刘邦用计逃脱。\n- **意义**：项梁项羽叔侄在会稽起兵后迅速整军经武，连败秦军。血战中项梁运筹帷幄、项羽冲锋陷阵的身影，让起义军士气大振，也让天下人初识了项氏将门后裔的赫赫威名\n\n### 📍 重要地点：垓下\n- **时间**：公元前202年\n- **停留时间**：短暂\n- **地点**：垓下（今安徽省蚌埠市固镇县濠城镇垓下村，存疑）\n- **事件**：被刘邦、韩信大军围困，夜间闻四面楚歌，军心瓦解。与虞姬诀别，率八百骑突围。\n- **意义**：公元前209年，项羽随叔父项梁斩杀秦会稽郡守殷通，举旗反秦。郡衙阶前的鲜血，开启了他问鼎天下的序幕——二十四岁的楚贵族子弟就此踏入乱世洪流，再无归路可寻\n- **名篇名句**：《垓下歌》：“力拔山兮气盖世。时不利兮骓不逝。虞兮虞兮奈若何！”\n\n### 🔴 去世地：乌江\n- **时间**：公元前202年\n- **停留时间**：短暂\n- **地点**：乌江（今安徽省马鞍山市和县乌江镇）\n- **事件**：突围至乌江边，乌江亭长劝其渡江，项羽以“无颜见江东父老”为由拒绝，下马步战，杀汉军数百人后自刎而死。\n- **意义**：英雄末路，其宁死不屈的气节成为后世文学与艺术的重要题材，标志着楚汉战争的终结。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 公元前232年 | 下相县 | 江苏省宿迁市 | （年龄（按公元前232年出生计算，生年存疑）：0岁）生于下相县（今江苏宿迁）。 |\n| 公元前209年 | 会稽郡 | 江苏省苏州市 | （年龄（按公元前232年出生计算，生年存疑）：23岁）随项梁于会稽郡（今江苏苏州）起兵反秦。 |\n| 公元前208年 | 定陶 | 山东省菏泽市定陶区 | （年龄（按公元前232年出生计算，生年存疑）：24岁）叔父项梁战死于定陶（今山东定陶）。 |\n| 公元前207年 | 新安 | 河南省三门峡市渑池县 | （年龄（按公元前232年出生计算，生年存疑）：25岁）钜鹿之战，破釜沉舟大败秦军主力。于新安（今河南渑池）坑杀秦降卒。 |\n| 公元前206年 | 咸阳 | 陕西省咸阳市 | （年龄（按公元前232年出生计算，生年存疑）：26岁）入关中，屠咸阳（今陕西咸阳），分封诸侯，自立西楚霸王，都彭城（今江苏徐州）。 |\n| 公元前205年 | 彭城 | 江苏省徐州市 | （年龄（按公元前232年出生计算，生年存疑）：27岁）以精兵三万于彭城大破刘邦五十六万联军。 |\n| 公元前204年 | 荥阳 | 河南省郑州市荥阳市 | （年龄（按公元前232年出生计算，生年存疑）：28岁）与刘邦在荥阳（今河南荥阳）一带长期对峙。 |\n| 公元前202年 | 垓下 |  | （年龄（按公元前232年出生计算，生年存疑）：30岁）垓下（今安徽固镇）之战兵败，突围至乌江（今安徽和县）自刎身亡。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《垓下歌》**（选自《史记·项羽本纪》）\n- 核心要点：\n    - **重点**：诗歌以“**力拔山兮气盖世**”开篇，极度夸张地塑造了项羽**个人武力**的巅峰形象，与其最终的失败形成强烈反差。\n    - **重点**：“**时不利兮骓不逝**”一句，将失败归因于“**天时**”与命运，体现了项羽性格中**自负**与**宿命论**的矛盾。\n    - **重点**：末句“**虞兮虞兮奈若何**”，在英雄末路的悲歌中注入对**虞姬**的深情，展现了其**铁血柔情**的复杂人格，极具悲剧感染力。\n    - 诗歌语言质朴刚健，情感喷薄而出，是**楚声短歌**的代表作，生动刻画了英雄末路的典型场景。\n    - 该诗与《史记》中“**霸王别姬**”的叙事紧密结合，共同构成了中国文学史上一个经典的**悲剧意象**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**钜鹿之战**是秦末农民战争的转折性战役，项羽以少胜多，歼灭秦军主力，确立了其在各路义军中的**领袖地位**。\n    - **重点**：入关中后的**分封十八路诸侯**，是项羽主导下对秦亡后政治秩序的重建，但因分配不公（如将刘邦封于巴蜀），迅速引发了新的战乱。\n    - **鸿门宴**事件是楚汉相争的前奏，体现了项羽在政治上的**优柔寡断**与刘邦的**能屈能伸**。\n    - **垓下之战**是楚汉战争的最后决战，韩信运用**十面埋伏**战术，彻底击败项羽。\n- 核心要点：\n    - **重点**：项羽的历史形象是**悲剧英雄**的典型代表，其**个人能力**（武勇、军事才能）与**政治缺陷**（残暴、短视、不善用人）形成巨大反差。\n    - **重点**：司马迁在《史记》中将其列入专为皇帝设立的“**本纪**”，是对其历史地位（一度号令天下）的承认，也体现了对悲剧英雄的复杂情感。\n    - **重点**：楚汉战争的结局，被后世视为**刘邦**（善于用人、约法三章、据守关中）的**政治路线**对**项羽**（迷信武力、分封复古、烧杀失民心）的**军事路线**的胜利。\n    - “**破釜沉舟**”、“**四面楚歌**”、“**霸王别姬**”、“**无颜见江东父老**”等成语典故均源于其生平，已融入中华文化语汇。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：下相县 | 江苏省宿迁市 | 33.9630 | 118.2755 |\n| 重要地点：会稽郡 | 江苏省苏州市 | 31.2990 | 120.5853 |\n| 重要地点：东阿 | 山东省阳谷县阿城镇 | 36.1460 | 115.8160 |\n| 重要地点：定陶 | 山东省定陶区 | 35.0710 | 115.5690 |\n| 重要地点：新安 | 河南省渑池县 | 34.7670 | 111.7610 |\n| 重要地点：咸阳 | 陕西省咸阳市 | 34.3296 | 108.7086 |\n| 重要地点：彭城 | 江苏省徐州市 | 34.2044 | 117.2859 |\n| 重要地点：荥阳 | 河南省荥阳市 | 34.7870 | 113.3830 |\n| 重要地点：垓下 | 安徽省蚌埠市固镇县濠城镇垓下村 | 33.2260 | 117.4520 |\n| 去世地：乌江 | 安徽省和县乌江镇 | 31.7450 | 118.3650 |\n|---|---|---|\n| 江苏省宿迁市 | 33.9630 | 118.2755 |\n| 江苏省苏州市 | 31.2990 | 120.5853 |\n| 山东省阳谷县阿城镇 | 36.1460 | 115.8160 |\n| 山东省定陶区 | 35.0710 | 115.5690 |\n| 河南省渑池县 | 34.7670 | 111.7610 |\n| 陕西省咸阳市 | 34.3296 | 108.7086 |\n| 江苏省徐州市 | 34.2044 | 117.2859 |\n| 河南省荥阳市 | 34.7870 | 113.3830 |\n| 安徽省蚌埠市固镇县濠城镇垓下村 | 33.2260 | 117.4520 |\n| 安徽省和县乌江镇 | 31.7450 | 118.3650 |", "relatedGraph": {"center": {"id": 493, "name": "项羽", "file": "项羽.html", "dynasty":
