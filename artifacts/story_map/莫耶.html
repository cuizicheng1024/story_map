。1934年赴上海，投身左翼文艺运动。抗日战争全面爆发后，她于1937年奔赴延安，进入抗日军政大学学习，其革命热情与文艺才华在革命圣地得到升华。1938年，她创作了脍炙人口的《延安颂》歌词，成为歌颂延安精神的不朽经典。此后，她长期在军队从事宣传、编辑工作，历经抗日战争、解放战争，新中国成立后继续在文化宣传岗位上奉献。其一生是追求光明、以笔为枪的革命文艺工作者的缩影。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从闽南沿海（安溪、厦门）到文化中心（上海），再奔赴革命圣地（延安），后转战华北、西北，最终定居北京。\n- ⏱️ **时间跨度**：1918年—1986年，共计68年。\n- **地理范围**：主要覆盖福建、上海、陕西、河北、甘肃、北京等地。\n- 🌟 **重要节点数量**：约8个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：福建省安溪县\n- **公元纪年**：1918年\n- **停留时间**：幼年时期（约6年）\n- **位置**：安溪县（今福建省泉州市安溪县）\n- **事迹**：出生于当地开明士绅家庭，幼年接受了良好的家庭教育和传统文化熏陶。\n- **意义**：人生的起点，家庭环境为其后来追求进步与革命奠定了思想基础。\n\n### 📍 重要地点：厦门鼓浪屿\n- **公元纪年**：约1924年—1934年\n- **停留时间**：少年时期（约10年）\n- **位置**：鼓浪屿（今福建省厦门市思明区鼓浪屿）\n- **事迹**：随家迁居于此，就读于厦门女子师范学校，广泛阅读进步书刊，开始尝试写作，并以“椰子”为笔名发表作品。\n- **意义**：新思想启蒙之地，初步展露文学才华，形成了反封建、追求自由的意识。\n\n### 📍 重要地点：上海市\n- **公元纪年**：1934年—1937年\n- **停留时间**：约3年\n- **位置**：上海（今上海市）\n- **事迹**：在《女子月刊》任编辑，发表多篇小说、诗歌，积极投身左翼文化运动。抗日战争爆发后，参加上海救亡演剧队。\n- **意义**：正式登上现代文坛，接受了革命文艺的洗礼，完成了从文学青年到革命文艺战士的转变。\n\n### 📍 重要地点：延安\n- **公元纪年**：1937年—约1945年\n- **停留时间**：约8年\n- **位置**：延安（今陕西省延安市）\n- **事迹**：进入抗日军政大学学习，后任八路军一二〇师战斗剧社编剧、教员。1938年春，在延安的激情感召下创作《延安颂》（初名《歌颂延安》）歌词，由郑律成谱曲后传遍全国。期间创作了大量话剧、歌剧剧本及小说。\n- **意义**：人生的黄金时期与创作高峰。延安的革命实践是其艺术灵感的核心源泉，《延安颂》成为其一生最重要的标志，奠定了她在中国革命文艺史上的地位。\n\n### 📍 重要地点：河北省张家口市\n- **公元纪年**：解放战争时期（约1946年前后）\n- **停留时间**：短暂驻留\n- **位置**：张家口（今河北省张家口市）\n- **事迹**：随部队在华北地区开展宣传工作，参与创办报刊，进行战地报道和文艺创作。\n- **意义**：经历了从抗战到解放战争的转变，在战火中继续以笔为枪。\n\n### 📍 重要地点：甘肃省兰州市\n- **公元纪年**：约20世纪50年代至70年代（具体起止年份待考）\n- **停留时间**：约二十余年（具体起止年份待考）\n- **位置**：兰州（今甘肃省兰州市）\n- **事迹**：新中国成立后，随丈夫（军事干部）调往西北，在兰州军区及地方文化部门工作，曾任《甘肃日报》副总编辑等职，坚持写作。\n- **意义**：在西北地区长期工作生活，经历了新中国建设的各个时期，个人命运随之起伏。\n\n### 🔴 去世地：北京市\n- **公元纪年**：1986年\n- **停留时间**：晚年（调京具体时间待考）\n- **位置**：北京（今北京市）\n- **经过**：晚年在北京离休，1986年病逝。\n- **意义**：人生的终点。她在北京度过了生命最后阶段，其革命文艺遗产得到后人的纪念与研究。\n- **名篇名句**：《延安颂》：“夕阳辉耀着山头的塔塔影，月色映照着河边的流萤，春风吹遍了坦平的原野，群山结成了坚固的围屏。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1918 | 福建省安溪县 | 福建省泉州市安溪县 | （年龄：0岁）出生于福建省安溪县。 |\n| 约1924 | 厦门鼓浪屿 | 福建省厦门市思明区鼓浪屿 | （年龄：
