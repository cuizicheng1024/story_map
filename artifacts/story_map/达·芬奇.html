/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

伦萨\n- **时间**：约公元1466年 - 1482年\n- **停留时间**：约16年\n- **地点**：今意大利托斯卡纳大区佛罗伦萨（佛罗伦萨共和国佛罗伦萨）\n- **事件**：在安德烈·德尔·韦罗基奥的工坊学习绘画与雕塑；加入画家行会；创作《受胎告知》、《吉内薇拉·班琪》等早期作品。\n- **意义**：从米兰到罗马，从威尼斯到法兰西，每一次启程与归来都绕不开佛罗伦萨这座中转站。它是他与意大利故土之间一条剪不断的脐带，提醒着永远有一个未竟的归处\n- **名篇名句**：《基督受洗》：与老师韦罗基奥合作绘制，其中一位天使被认为出自达·芬奇之手。\n\n### 📍 重要地点：米兰\n- **时间**：公元1482年 - 1499年\n- **停留时间**：约17年\n- **地点**：今意大利伦巴第大区米兰（米兰公国米兰）\n- **事件**：服务于卢多维科·斯福尔扎公爵宫廷；创作《岩间圣母》、《最后的晚餐》；进行大量解剖学、水利工程、军事工程和飞行器研究。\n- **意义**：为市政厅设计升降闸桥与移动堡垒，演算笔记让他从画室走入工程领域。草图里的战车与弩炮虽多停留纸面，却揭示他把战争视为几何与力学延伸的独特视角\n- **名篇名句**：《最后的晚餐》：“你们中间有一个人要出卖我了。”\n\n### 📍 重要地点：威尼斯\n- **时间**：公元1500年初\n- **停留时间**：短暂访问，数月\n- **地点**：今意大利威尼托大区威尼斯（威尼斯共和国威尼斯）\n- **事件**：可能作为军事工程师，为威尼斯共和国提供抵御土耳其入侵的防御工事建议。\n- **意义**：为市政厅设计升降闸桥与移动堡垒，演算笔记让他从画室走入工程领域。草图里的战车与弩炮虽多停留纸面，却揭示他把战争视为几何与力学延伸的独特视角\n\n### 📍 重要地点：佛罗伦萨（第二次居留）\n- **时间**：公元1500年 - 1506年\n- **停留时间**：约6年\n- **地点**：今意大利托斯卡纳大区佛罗伦萨（佛罗伦萨共和国佛罗伦萨）\n- **事件**：为安农齐塔教堂绘制《圣母子与圣安妮》草图；受委托创作巨型壁画《安吉里之战》（未完成）；进行解剖学和鸟类飞行研究；开始绘制《蒙娜丽莎》。\n- **意义**：从米兰到罗马，从威尼斯到法兰西，每一次启程与归来都绕不开佛罗伦萨这座中转站。它是他与意大利故土之间一条剪不断的脐带，提醒着永远有一个未竟的归处基罗同场竞技，艺术上进入成熟期，科学探索持续深入。\n- **名篇名句**：《蒙娜丽莎》：“那微笑，被称为‘神秘的微笑’。”\n\n### 📍 重要地点：米兰（第二次居留）\n- **时间**：公元1506年 - 1513年\n- **停留时间**：约7年\n- **地点**：今意大利伦巴第大区米兰（法兰西王国控制的米兰公国米兰）\n- **事件**：受法国总督查尔斯·德·安布瓦斯庇护，继续科学研究；深入研究解剖学、几何学；创作《圣母子与圣安妮》、《施洗者圣约翰》。\n- **意义**：从米兰到罗马，从威尼斯到法兰西，每一次启程与归来都绕不开佛罗伦萨这座中转站。它是他与意大利故土之间一条剪不断的脐带，提醒着永远有一个未竟的归处\n\n### 📍 重要地点：罗马\n- **时间**：公元1513年 - 1516年\n- **停留时间**：约3年\n- **地点**：今意大利拉齐奥大区罗马（教皇国罗马）\n- **事件**：受朱利亚诺·德·美第奇庇护，居住在梵蒂冈的贝尔维德雷宫；主要进行科学研究和解剖学实验，绘画创作较少；与拉斐尔、米开朗基罗同时在罗马。\n- **意义**：从米兰到罗马，从威尼斯到法兰西，每一次启程与归来都绕不开佛罗伦萨这座中转站。它是他与意大利故土之间一条剪不断的脐带，提醒着永远有一个未竟的归处创作相对沉寂。\n\n### 📍 重要地点：帕尔马\n- **时间**：公元1514年秋\n- **停留时间**：短暂停留\n- **地点**：今意大利艾米利亚-罗马涅大区帕尔马（帕尔马公国帕尔马）\n- **事件**：在前往罗马或从罗马返回的途中可能在此停留。\n- **意义**：从米兰到罗马，从威尼斯到法兰西，每一次启程与归来都绕不开佛罗伦萨这座中转站。它是他与意大利故土之间一条剪不断的脐带，提醒着永远有一个未竟的归处\n\n### 🔴 去世地：昂布瓦斯克洛吕斯庄园\n- **时间**：公元1516年 - 1519年\n- **停留时间**：约3年\n- **地点**：今法国中央-卢瓦尔河谷大区昂布瓦斯（法兰西王国昂布瓦斯克洛吕斯庄园）\n- **事件**：受法王弗朗索瓦一世邀请，作为“国王首席画家、工程师和建筑师”居住于此；整理手稿；进行最后的科学研究；最终病逝。\n- **意义**：为市政厅设计升降闸桥与移动堡垒，演算笔记让他从画室走入工程领域。草图里的战车与弩炮虽多停留纸面，却揭示他把战争视为几何与力学延伸的独特视角过晚年，受到极高礼遇，其大量手稿得以保存。\n- **名篇名句**：无直接作品，但其手稿中写道：“一日充实，可以安睡；一生充实，可以无憾。”\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1452 | 芬奇镇 | 意大利托斯卡纳大区芬奇镇 | （年龄：0）出生于佛罗伦萨共和国芬奇镇。 |\n| 约1466 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | （年龄：约14）进入佛罗伦萨韦罗基奥工坊学徒。 |\n| 1472 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | （年龄：20）加入佛罗伦萨画家行会。 |\n| 1478 |  |  | （年龄：26）获得独立委托，开始职业生涯。 |\n| 1482 | 米兰 | 意大利伦巴第大区米兰 | （年龄：30）移居米兰，服务于斯福尔扎宫廷。 |\n| 1495-1498 |  |  | （年龄：43-46）创作《最后的晚餐》。 |\n| 1499 | 米兰 | 意大利伦巴第大区米兰 | （年龄：47）离开米兰，开始辗转。 |\n| 1500 | 威尼斯 | 意大利威尼托大区威尼斯 | （年龄：48）短暂访问威尼斯，后返回佛罗伦萨。 |\n| 1503-1506 |  |  | （年龄：51-54）开始创作《蒙娜丽莎》。 |\n| 1506 | 米兰（第二次居留） | 意大利伦巴第大区米兰 | （年龄：54）应法国总督之邀返回米兰。 |\n| 1513 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：61）移居罗马，居梵蒂冈。 |\n| 1516 |  |  | （年龄：64）应法王之邀移居法国昂布瓦斯。 |\n| 1519 |  |  | （年龄：67）在法国克洛吕斯庄园去世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《蒙娜丽莎》**（美术鉴赏）、**《最后的晚餐》**（美术鉴赏）\n- 核心要点：\n    - **重点**：**《蒙娜丽莎》** 的“**渐隐法**”（sfumato）技巧，创造了朦胧、神秘的视觉效果，尤其是嘴角和眼角的处理。\n    - **重点**：**《最后的晚餐》** 在构图上的**戏剧性瞬间**捕捉与**透视法**的完美运用，使画面具有强烈的空间纵深感和叙事张力。\n    - 达·芬奇的绘画体现了文艺复兴的**人文主义**精神，注重表现人物的**内心世界**和**情感**。\n    - 他坚持**直接观察自然**的原则，其画作中的光影、衣褶、背景都源于对现实的细致研究。\n    - **重点**：其艺术与科学紧密结合，例如通过**解剖学**研究来精确描绘人体结构与动态。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是**文艺复兴盛期**的代表人物，与米开朗基罗、拉斐尔并称“**文艺复兴三杰**”。\n    - 其生涯轨迹反映了当时意大利**城邦政治**的特点，艺术家依附于不同的宫廷和赞助人（如美第奇家族、斯福尔扎家族、法国国王）。\n    - **重点**：留下了大量未出版的**手稿**（如《阿伦德尔手稿》、《大西洋古抄本》），内容涵盖解剖、物理、工程、植物学等，体现了**跨学科**的“**通才**”（Uomo Universale）理想。\n- 核心要点：\n    - 达·芬奇的成就标志着**中世纪**向**近代**的思想过渡，其世界观基于**经验观察**和**理性分析**，而非纯粹的宗教教条。\n    - **重点**：他的科学探索（如流体力学、光学、解剖学）具有**前瞻性**，许多设计（如直升机、坦克草图）远超时代，但受限于当时的技术条件未能实现。\n    - **重点**：作为**艺术家**的身份最为公众熟知，但其**科学家**和**工程师**的贡献同样巨大，是**科学革命**的先驱之一。\n    - 他的人生诠释了文艺复兴的核心价值：对**知识**的无限渴求、对**美**的追求以及对**人类潜能**的信念。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 芬奇镇 | 43.7833 | 10.9236 |\n| 佛罗伦萨 | 43.7696 | 11.2558 |\n| 米兰 | 45.4642 | 9.1900 |\n| 威尼斯 | 45.4408 | 12.3155 |\n| 罗马 | 41.9028 | 1
