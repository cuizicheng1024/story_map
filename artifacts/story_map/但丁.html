/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

**中世纪晚期**，意大利**城邦**林立，**教权与皇权**斗争激烈。\n- **关键身份**：**意大利诗人**，文艺复兴的**先驱**。\n- **代表作品**：**《神曲》**（分为《地狱》、《炼狱》、《天堂》三部分）。\n- **核心思想**：作品表达了对**教会腐败**的批判和对**人文主义**精神的初步探索。\n- **历史地位**：被誉为“**中世纪的最后一位诗人，同时又是新时代的最初一位诗人**”。\n- **易混点**：但丁是**意大利**人，不是古希腊或古罗马人；《神曲》是**长篇叙事诗**，不是小说。\n\n### 高中阶段\n- **时代背景**：处于**中世纪向文艺复兴过渡**的关键时期，**资本主义萌芽**出现。\n- **关键事件**：因佛罗伦萨**政治斗争**被**终身流放**，在流亡中完成《神曲》。\n- **代表作品与思想**：\n    - 《神曲》：采用**中世纪梦幻文学**形式，结构严谨（三部曲，每部33歌，加序曲共100歌），运用**意大利俗语**创作，具有**人文主义**思想萌芽。\n    - 《论俗语》：论证**意大利俗语**作为文学语言的优越性。\n- **历史贡献**：**奠定意大利民族语言基础**；其作品标志着**人文主义思想**的觉醒，是**文艺复兴运动的先声**。\n- **对比点**：与彼特拉克、薄伽丘并称“**文学三杰**”，但丁更侧重于**宗教与哲学**的宏大叙事，彼特拉克更侧重于**个人情感与古典学术**，薄伽丘更侧重于**现实社会与市民生活**。\n\n---","examPoints": "### 初中阶段考点\n- 但丁的**国别**（意大利）和**时代**（中世纪晚期）。\n- 但丁的**代表作**《神曲》及其基本结构（三部分）。\n- 但丁被誉为“**中世纪的最后一位诗人，同时又是新时代的最初一位诗人**”的**原因**（承前启后）。\n- 但丁作品中体现的**人文主义思想萌芽**（如对教会腐败的批判）。\n- 但丁与**文艺复兴**运动的关系（先驱）。\n\n### 高中阶段考点\n- 但丁被流放的**政治背景**（佛罗伦萨归尔甫派内斗）。\n- 《神曲》的**艺术特色**（梦幻形式、三韵句、俗语创作）和**思想内涵**（批判与向往）。\n- 但丁在**意大利语言文学史**上的地位（奠基人）。\n- 但丁、彼特拉克、薄伽丘“**文学三杰**”的**各自特点与贡献**对比。\n- 但丁思想中**中世纪神学**与**近代人文主义**的**矛盾与融合**（存疑/说法不一，学界有不同侧重）。","workTexts": {"新生": "爱情与高贵的心灵互为依存。","神曲·地狱篇": "在人生的中途，我迷失在一个黑暗的森林之中。","神曲": "在人生的中途，我迷失在一个黑暗的森林之中。","地狱篇": "在人生的中途，我迷失在一个黑暗的森林之中。","神曲·地狱": "在人生的中途，我迷失在一个黑暗的森林之中。","地狱": "在人生的中途，我迷失在一个黑暗的森林之中。","神曲·炼狱篇": "我们从这里出去，重新看见了群星。","炼狱篇": "我们从这里出去，重新看见了群星。","神曲·炼狱": "我们从这里出去，重新看见了群星。","炼狱": "我们从这里出去，重新看见了群星。","神曲·天堂篇": "是爱也，动太阳而移群星。","天堂篇": "是爱也，动太阳而移群星。","神曲·天堂": "是爱也，动太阳而移群星。","天堂": "是爱也，动太阳而移群星。","论世界帝国": "政治思想：在《论世界帝国》中提出的政教分离、建立统一世俗帝国的思想，对后世政治哲学有深远影响。","论俗语": "《论俗语》：论证意大利俗语作为文学语言的优越性。"},"workSummaries": {"神曲": {"title": "神曲","aliases": [],"authors": ["但丁","但丁·阿利吉耶里"],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "中世纪晚期（意大利城邦时期）","genre": "长篇叙事诗","one_liner": "《神曲》是但丁在流放期间创作的长篇叙事诗，以梦幻文学形式记叙主人公游历地狱、炼狱、天堂三界的历程，深刻批判教会腐败，蕴含人文主义思想萌芽，奠定了意大利俗语的文学地位。","summary": "在人生的中途，我迷失在一个黑暗的森林之中。","quote": "但丁出生于佛罗伦萨一个没落的贵族家庭，生活在意大利城邦政治斗争激烈、教权与皇权冲突的时代。","quotes": ["但丁出生于佛罗伦萨一个没落的贵族家庭，生活在意大利城邦政治斗争激烈、教 ": [],"authors": [],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "","genre": "","one_liner": "政治思想：在《论世界帝国》中提出的政教分离、建立统一世俗帝国的思想，对后世政治哲学有深远影响。","summary": "政治思想：在《论世界帝国》中提出的政教分离、建立统一世俗帝国的思想，对后世政治哲学有深远影响。","quote": "","quotes": [],"quote_policy": "summary_only"},"但丁传": {"title": "但丁传","aliases": [],"authors": [],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "","genre": "传记","one_liner": "但丁出生于佛罗伦萨一个没落的贵族家庭，生活在意大利城邦政治斗争激烈、教权与皇权冲突的时代","summary": "但丁出生于佛罗伦萨一个没落的贵族家庭，生活在意大利城邦政治斗争激烈、教权与皇权冲突的时代","quote": "","quotes": [],"quote_policy": "summary_only"},"地狱": {"title": "地狱","aliases": [],"authors": [],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "","genre": "","one_liner": "在人生的中途，我迷失在一个黑暗的森林之中。","summary": "在人生的中途，我迷失在一个黑暗的森林之中。","quote": "","quotes": [],"quote_policy": "summary_only"},"炼狱": {"title": "炼狱","aliases": [],"authors": [],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "","genre": "","one_liner": "我们从这里出去，重新看见了群星。","summary": "我们从这里出去，重新看见了群星。","quote": "","quotes": [],"quote_policy": "summary_only"},"论俗语": {"title": "论俗语","aliases": [],"authors": [],"related_people": ["但丁"],"source_pages": ["但丁"],"era": "","genre": "","one_liner": "《论俗语》：论证意大利俗语作为文学语言的优越性。","summary": "《论俗语》：论证意大利俗语作为文学语言的优越性。","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 但丁·阿利吉耶里\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：但丁·阿利吉耶里（Dante Alighieri）\n- **外文名**：Dante Alighieri\n- **时代**：中世纪晚期（意大利城邦时期）\n- **出生**：1265年，佛罗伦萨（存疑，具体日期不详）\n- **去世**：1321年9月14日，拉文纳\n- **享年**：约56岁\n- **主要身份**：诗人、哲学家、政治家、语言学家\n- **历史地位**：意大利语文学的奠基人，欧洲文艺复兴的先驱，被誉为“中世纪的最后一位诗人，同时又是新时代的最初一位诗人”。\n- **主要成就**：创作史诗《神曲》；确立意大利俗语（托斯卡纳方言）为文学语言；其作品深刻影响了后世文学、哲学与神学思想。\n\n### 生平概述\n但丁出生于佛罗伦萨一个没落的贵族家庭，生活在意大利城邦政治斗争激烈、教权与皇权冲突的时代。他早年学习诗歌、哲学与神学，并积极参与佛罗伦萨的政治活动，属于支持教皇的归尔甫派中的白党。1302年，因政治斗争失败被终身流放。在长达近二十年的流亡生涯中，他辗转于意大利多个城市，最终在拉文纳完成了不朽巨著《神曲》。他的作品以托斯卡纳方言写成，不仅奠定了意大利民族语言的基础，更以其深邃的思想和艺术成就，标志着欧洲文学从中世纪向文艺复兴的过渡。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要覆盖意大利中北部，从出生地佛罗伦萨到流放地及最终安息地拉文纳。\n- ⏱️ **时间跨度**：1265年至1321年，共约56年。\n- 📍 **地理范围**：以意大利托斯卡纳地区为中心，北至维罗纳、拉文纳，南至罗马。\n- 🌟 **重要节点数量**：核心地点约8个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：佛罗伦萨\n- **公元纪年**：1265年\n- **停留时间**：约37年（至1302年流放前）\n- **位置**：佛罗伦萨（今意大利托斯卡纳大区佛罗伦萨市）\n- **事迹**：出生、成长、接受教育；与贝雅特丽齐相遇并产生深刻爱恋；积极参与城市政治，曾任佛罗伦萨行政官。\n- **意义**：塑造其早期思想、情感与政治立场的核心之地，也是其文学创作的灵感源泉和政治生涯的起点。\n\n### 📍 重要地点：博洛尼亚\n- **公元纪年**：约1285-1287年\n- **停留时间**：求学阶段，约2年\n- **位置**：博洛尼亚（今意大利艾米利亚-罗马涅大区博洛尼亚市）\n- **事迹**：在博洛尼亚大学学习修辞学、哲学等。\n- **意义**：暮年的栖身之所，他将流亡的孤愤、毕生的爱情与神学沉思熔铸于字里行间，写下《神曲》终章的吟唱，长眠于此，与诗同朽\n- **名篇名句**：《新生》： “爱情与高贵的心灵互为依存。”\n\n### 📍 重要地点：罗马\n- **公元纪年**：1300年（作为佛罗伦萨特使）\n- **停留时间**：短期出使\n- **位置**：罗马（今意大利拉齐奥大区罗马市）\n- **事迹**：作为佛罗伦萨白党特使，前往罗马觐见教皇卜尼法斯八世，试图调解党派冲突。\n- **意义**：暮年的栖身之所，他将流亡的孤愤、毕生的爱情与神学沉思熔铸于字里行间，写下《神曲》终章的吟唱，长眠于此，与诗同朽\n- **名篇名句**：《神曲·地狱篇》： “罗马，她曾把一切善都收归己有。”\n\n### 📍 重要地点：维罗纳\n- **公元纪年**：约1303-1304年\n- **停留时间**：流放初期，约1-2年\n- **位置**：维罗纳（今意大利威尼托大区维罗纳市）\n- **事迹**：流亡初期投奔斯卡拉家族（维罗纳领主），受到庇护。\n- **意义**：流亡生涯的第一个重要庇护所，使其得以在相对安定的环境中开始构思《神曲》。\n- **名篇名句**：《神曲·地狱篇》： “在人生的中途，我迷失在一个黑暗的森林之中。”\n\n### 📍 重要地点：卢尼贾纳/卡森蒂诺地区\n- **公元纪年**：约1306-1308年\n- **停留时间**：流亡中期，约2年\n- **位置**：卢尼贾纳（今意大利托斯卡纳大区马萨-卡拉拉省卢尼贾纳地区及阿雷佐省卡森蒂诺地区）\n- **事迹**：在马拉斯皮纳家族等贵族的庇护下生活，继续创作。\n- **意义**：在颠沛流离中坚持写作，完成了《神曲》中《地狱篇》和《炼狱篇》的大部分内容。\n- **名篇名句**：《神曲·炼狱篇》： “我们从这里出去，重新看见了群星。”\n\n### 📍 重要地点：拉文纳\n- **公元纪年**：约1318年至1321年\n- **停留时间**：生命最后约3年\n- **位置**：拉文纳（今意大利艾米利亚-罗马涅大区拉文纳市）\n- **事迹**：在拉文纳领主圭多·诺维洛·达·波伦塔的庇护下，度过相对平静的晚年，并在此完成了《神曲》的《天堂篇》。\n- **意义**：暮年的栖身之所，他将流亡的孤愤、毕生的爱情与神学沉思熔铸于字里行间，写下《神曲》终章的吟唱，长眠于此，与诗同朽\n- **名篇名句**：《神曲·天堂篇》： “是爱也，动太阳而移群星。”\n\n### 🔴 去世地：拉文纳\n- **公元纪年**：1321年9月14日\n- **停留时间**：最后约3年\n- **位置**：拉文纳（今意大利艾米利亚-罗马涅大区拉文纳市）\n- **经过**：在完成《神曲》后不久病逝，葬于拉文纳圣方济各教堂旁。\n- **意义**：其生命的终点，也是其文学遗产的最终完成地。佛罗伦萨后来多次要求归还其遗骨，均被拉文纳拒绝。\n- **名篇名句**：《神曲·天堂篇》： “是爱也，动太阳而移群星。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1265年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：0岁）出生于佛罗伦萨。 |\n| 约1274年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：9岁）初次遇见贝雅特丽齐，成为其一生的精神爱恋对象。 |\n| 约1285-1287年 | 博洛尼亚 | 意大利艾米利亚-罗马涅大区博洛尼亚市 | （年龄：20-22岁）在博洛尼亚大学学习。 |\n| 1289年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：24岁）参加佛罗伦萨军队，参与坎帕尔迪诺战役。 |\n| 1290年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：25岁）贝雅特丽齐去世，但丁陷入巨大悲痛，开始创作《新生》。 |\n| 1295年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：30岁）加入佛罗伦萨医药行会，获得从政资格。 |\n| 1300年 | 罗马 | 意大利拉齐奥大区罗马市 | （年龄：35岁）当选佛罗伦萨行政官；出使罗马。 |\n| 1302年 | 佛罗伦萨、罗马 | 意大利托斯卡纳大区佛罗伦萨市、意大利拉齐奥大区罗马市 | （年龄：37岁）被政敌以贪污等罪名判处终身流放，财产被没收。 |\n| 1304-1307年 | 维罗纳、卢尼贾纳 | 意大利威尼托大区维罗纳市、意大利托斯卡纳大区卢尼贾纳地区 | （年龄：39-42岁）流亡期间，开始创作《神曲》（《地狱篇》）。 |\n| 1310年 | 意大利中北部流亡地 | 意大利中北部诸城 | （年龄：45岁）欢迎神圣罗马帝国皇帝亨利七世南下意大利，寄望其统一意大利。 |\n| 1315年 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | （年龄：50岁）拒绝佛罗伦萨提出的以认罪忏悔换取赦免的条件。 |\n| 约1318年 | 拉文纳 | 意大利艾米利亚-罗马涅大区拉文纳市 | （年龄：53岁）定居拉文纳，受到领主庇护。 |\n| 1321年 | 拉文纳 | 意大利艾米利亚-罗马涅大区拉文纳市 | （年龄：56岁）在拉文纳完成《神曲》并去世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n但丁的作品，尤其是《神曲》，使用托斯卡纳方言创作，极大地提升了俗语的文学地位，挑战了拉丁语在文学和学术领域的垄断。他的政治思想（如政教分离）和人文主义倾向，为即将到来的文艺复兴运动埋下了思想种子。\n\n### 对后世的影响\n- **语言奠基**：其作品确立了托斯卡纳方言作为意大利文学语言和现代意大利语基础的地位。\n- **文学典范**：《神曲》成为欧洲文学史上里程碑式的作品，为后世诗歌、小说创作提供了结构和思想的范本。\n- **思想先驱**：其作品中蕴含的人文主义精神、对古典文化的推崇以及对教会腐败的批判，深刻影响了彼特拉克、薄伽丘等文艺复兴巨匠。\n- **政治思想**：在《论世界帝国》中提出的政教分离、建立统一世俗帝国的思想，对后世政治哲学有深远影响。\n\n### 历史评价\n1. **彼特拉克**：称但丁为“伟大的诗人”，并深受其影响。\n2. **薄伽丘**：撰写了《但丁传》，极力推崇但丁及其作品，称《神曲》为“神圣的喜剧”。\n3. **恩格斯**：评价但丁是“中世纪的最后一位诗人，同时又是新时代的最初一位诗人”。\n4. **现代学界**：普遍认为但丁是连接中世纪与文艺复兴的关键人物，其作品具有永恒的艺术与思想价值。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**中世纪晚期**，意大利**城邦**林立，**教权与皇权**斗争激烈。\n- **关键身份**：**意大利诗人**，文艺复兴的**先驱**。\n- **代表作品**：**《神曲》**（分为《地狱》、《炼狱》、《天堂》三部分）。\n- **核心思想**：作品表达了对**教会腐败**的批判和对**人文主义**精神的初步探索。\n- **历史地位**：被誉为“**中世纪的最后一位诗人，同时又是新时代的最初一位诗人**”。\n- **易混点**：但丁是**意大利**人，不是古希腊或古罗马人；《神曲》是**长篇叙事诗**，不是小说。\n\n### 高中阶段\n- **时代背景**：处于**中世纪向文艺复兴过渡**的关键时期，**资本主义萌芽**出现。\n- **关键事件**：因佛罗伦萨**政治斗争**被**终身流放**，在流亡中完成《神曲》。\n- **代表作品与思想**：\n    - 《神曲》：采用**中世纪梦幻文学**形式，结构严谨（三部曲，每部33歌，加序曲共100歌），运用**意大利俗语**创作，具有**人文主义**思想萌芽。\n    - 《论俗语》：论证**意大利俗语**作为文学语言的优越性。\n- **历史贡献**：**奠定意大利民族语言基础**；其作品标志着**人文主义思想**的觉醒，是**文艺复兴运动的先声**。\n- **对比点**：与彼特拉克、薄伽丘并称“**文学三杰**”，但丁更侧重于**宗教与哲学**的宏大叙事，彼特拉克更侧重于**个人情感与古典学术**，薄伽丘更侧重于**现实社会与市民生活**。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n- 但丁的**国别**（意大利）和**时代**（中世纪晚期）。\n- 但丁的**代表作**《神曲》及其基本结构（三部分）。\n- 但丁被誉为“**中世纪的最后一位诗人，同时又是新时代的最初一位诗人**”的**原因**（承前启后）。\n- 但丁作品中体现的**人文主义思想萌芽**（如对教会腐败的批判）。\n- 但丁与**文艺复兴**运动的关系（先驱）。\n\n### 高中阶段考点\n- 但丁被流放的**政治背景**（佛罗伦萨归尔甫派内斗）。\n- 《神曲》的**艺术特色**（梦幻形式、三韵句、俗语创作）和**思想内涵**（批判与向往）。\n- 但丁在**意大利语言文学史**上的地位（奠基人）。\n- 但丁、彼特拉克、薄伽丘“**文学三杰**”的**各自特点与贡献**对比。\n- 但丁思想中**中世纪神学**与**近代人文主义**的**矛盾与融合**（存疑/说法不一，学界有不同侧重）。\n\n## 地点坐标（人工校正）\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨市 | 43.7696 | 11.2558 |\n| 博洛尼亚 | 意大利艾米利亚-罗马涅大区博洛尼亚市 | 44.4949 | 11.3426 |\n| 罗马 | 意大利拉齐奥大区罗马市 | 41.9028 | 12.4964 |\n| 维罗纳 | 意大利威尼托大区维罗纳市 | 45.4384 | 10.9916 |\n| 卢尼贾纳 | 意大利托斯卡纳大区马萨-卡拉拉省卢尼贾纳地区 | 44.3167 | 9.9500 |\n| 拉文纳 | 意大利艾米利亚-罗马涅大区拉文纳市 | 44.4184 | 12.2035 |\n","relatedGraph": {"center": {"id": "但丁·阿利吉耶里","name": "但丁·阿利吉耶里","file": "但丁·阿利吉耶里.html","dynasty": "中世纪晚期（意大利城邦时期）","aliases": [],"birth_year": 1265,"death_year": 1321,"quote": "爱情与高贵的心灵互为依存。","review": "爱情与高贵的心灵互为依存。","foreign_name": "","main_role_label": "","birthplace": "佛罗伦萨","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},"nodes": [{"id": "但丁·阿利吉耶里","name": "但丁·阿利吉耶里","file": "但丁·阿利吉耶里.html","dynasty": "中世纪晚期（意大利城邦时期）","aliases": [],"birth_year": 1265,"death_year": 1321,"quote": "爱情与高贵的心灵互为依存。","review": "爱情与高贵的心灵互为依存。","foreign_name": "","main_role_label": "","birthplace": "佛罗伦萨","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},{"id": "但丁","name": "但丁","file": "但丁.html","dynasty": "中世纪晚期（意大利城邦时期）","aliases": [],"birth_year": 1265,"death_year": 1321,"quote": "中世纪的最后一位诗人，同时又是新时代的最初一位诗人","review": "","foreign_name": "Dante Alighieri","main_role_label": "诗人","birthplace": "佛罗伦萨","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "并称","sourceType": "markdown","confidence": null,"isCenter": false},{"id": "贞德","name": "贞德","file": "贞德.html","dynasty": "中世纪晚期（英法百年战争期间）","ali
