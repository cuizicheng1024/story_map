  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

es": [],"quote_policy": "summary_only"},"关羽传": {"title": "关羽传","aliases": [],"authors": [],"related_people": ["关羽"],"source_pages": ["关羽"],"era": "","genre": "传记","one_liner": "关羽，字云长，河东郡解县人，东汉末年群雄逐鹿之际的重要将领","summary": "关羽，字云长，河东郡解县人，东汉末年群雄逐鹿之际的重要将领","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 关羽\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：关羽（字云长）\n- **时代**：东汉末年\n- **出生**：约160年，河东郡解县（今山西省运城市盐湖区解州镇一带）\n- **去世**：219年（建安二十四年末），麦城（今湖北省宜昌市当阳市河溶镇一带）\n- **享年**：约六十岁（存疑）\n- **主要身份**：武将、蜀汉前将军、汉寿亭侯、后世武圣\n- **历史地位**：三国时期蜀汉名将，以忠义勇武闻名于世，被后世尊为“武圣”，与文圣孔子并称。\n- **主要成就**：随刘备起兵奠定蜀汉基业；斩颜良解白马之围，名震曹营；镇守荆州，独当一面；北伐襄樊，水淹七军擒于禁、斩庞德，威震华夏。\n\n### 生平概述\n关羽，字云长，河东郡解县人，东汉末年群雄逐鹿之际的重要将领。早年与刘备、张飞桃园结义（存疑/说法不一），起兵于涿郡，后辗转于公孙瓒、陶谦、曹操、袁绍等势力之间，始终追随刘备。建安五年（200年）斩颜良、解白马之围后，封汉寿亭侯，归刘备。赤壁之战后镇守荆州，北伐襄樊期间水淹七军，威震华夏。后因后方失陷、兵败麦城，于建安二十四年（219年）被擒遇害。其去世被普遍视为蜀汉由盛转衰的重要转折之一，也成为刘备后来发动夷陵之战的重要诱因。其忠义形象经《三国演义》、历代戏曲小说以及民间信仰不断升华，宋以后被尊为“武圣”，并逐渐演变为关帝、武财神与行业保护神，在中国及东亚华人社会中长期受到广泛祭祀与崇敬，成为中华文化中忠勇信义最具代表性的象征之一。\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：关羽一生足迹北至黄河流域，南抵长江中游荆襄一带，活动范围跨越今山西、河北、河南、湖北、江苏等地。\n- ⏱️ **时间跨度**：约160年到219年，约六十年。\n- 📍 **地理范围**：今山西、河北、河南、湖北、江苏等省份。\n- 🌟 **重要节点数量**：核心地点9处（含出生地与去世地）。\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：河东解县\n- **公元纪年**：约160年\n- **停留时间**：青少年时期约至184年\n- **位置**：古称河东郡解县（今山西省运城市盐湖区解州镇一带）\n- **事迹**：关羽出生于此地，早年在此成长，后因汉末动荡离乡。\n- **意义**：关羽的籍贯与文化根脉所在，今解州关帝庙即建于此地，成为后世纪念关羽的核心场所。\n\n### 📍 重要地点：涿郡\n- **公元纪年**：184年（中平元年）起\n- **停留时间**：起兵初期数年\n- **位置**：古称涿郡涿县（今河北省保定市涿州市）\n- **事迹**：黄巾起义爆发后，关羽与刘备、张飞在此聚义起兵（“桃园三结义”系《三国演义》演绎，史实存疑）。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步\n\n### 📍 重要地点：徐州\n- **公元纪年**：约194到195年（兴平元年至二年）\n- **停留时间**：约1到2年\n- **位置**：古称徐州（今江苏省徐州市一带）\n- **事迹**：刘备领徐州牧，关羽随从，参与镇压吕布等战事；后因吕布袭取徐州，刘备暂失立足之地。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步\n\n### 📍 重要地点：许都\n- **公元纪年**：约196到200年\n- **停留时间**：暂居数年\n- **位置**：古称许都（今河南省许昌市魏都区一带）\n- **事迹**：刘备被吕布击败后投曹操，关羽一度随刘备驻于许都；后刘备诛曹操未果，独自奔袭袁术，关羽被曹操所俘，受礼遇厚待。\n- **意义**：关羽短暂归属曹操阵营的阶段，为日后斩颜良立功、汉寿亭侯之封埋下伏笔。\n\n### 📍 重要地点：白马\n- **公元纪年**：200年（建安五年）\n- **停留时间**：战役期间短暂驻留\n- **位置**：古称白马（今河南省安阳市滑县一带）\n- **事迹**：官渡之战期间，关羽于白马之战中斩袁绍大将颜良，解白马之围，名震曹营。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步下的转折点，并因此受封汉寿亭侯。\n\n### 📍 重要地点：荆州\n- **公元纪年**：208年（建安十三年）起\n- **停留时间**：约十余年\n- **位置**：古称荆州（治所今湖北省荆州市一带）\n- **事迹**：赤壁之战后随刘备夺取荆州南部四郡；建安十六年至十九年，刘备入蜀，留关羽镇守荆州，独当一面。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步\n\n### 📍 重要地点：襄樊\n- **公元纪年**：219年（建安二十四年）\n- **停留时间**：北伐数月\n- **位置**：古称襄阳、樊城（今湖北省襄阳市襄城区、樊城区一带）\n- **事迹**：关羽北伐襄樊，水淹七军，擒于禁、斩庞德，威震华夏，一度威逼许都。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步\n\n### 🔴 去世地：麦城\n- **公元纪年**：219年（建安二十四年）冬\n- **停留时间**：兵败后短暂困守\n- **位置**：古称麦城（今湖北省宜昌市当阳市河溶镇一带）\n- **经过**：因后方江陵、公安失守，腹背受敌，败走麦城；后突围至临沮被擒，遂遇害身亡。\n- **意义**：黄巾烽火起，关羽随刘备在涿郡一带募义勇、投身讨贼的最早战事。刘备势力如孤舟颠簸，关羽的刀亦随之辗转，这是他由草莽武夫迈入天下视野的关键一步\n\n## 演义影响\n\n### ⚔️ 华容道义释曹操\n- **公元纪年**：208年（建安十三年）赤壁战后\n- **位置**：古称华容道（今湖北省荆州市监利市一带）\n- **事迹**：\"华容道义释曹操\"系《三国演义》演绎，史实存疑；但华容道作为曹操败退路线具历史背景。\n- **意义**：草色初绿的涿郡街头，关羽还是卖枣为生的微末少年，与刘备、张飞相遇于桃林。焚香结义的誓词立下\"生死与共\"的契约，这片土地成了他\"义绝\"形象最原初的注脚，也悄然铺陈了日后单骑千里、终不负约的命运\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约160年 | 河东郡解县 | 山西省运城市盐湖区解州镇一带 | 生于河东郡解县 |\n| 184年（中平元年） | 涿郡 | 河北省保定市涿州市 | 黄巾起义爆发，随刘备起兵于涿郡 |\n| 约194到195年 | 徐州 | 江苏省徐州市一带 | 刘备领徐州，关羽随从 |\n| 约196到200年 | 许都 | 河南省许昌市魏都区一带 | 暂归曹操，受礼遇 |\n| 200年（建安五年） | 白马 | 河南省安阳市滑县一带 | 斩颜良解白马之围，封汉寿亭侯，归刘备 |\n| 208年（建安十三年） | 荆州 | 湖北省荆州市一带 | 赤壁战后随刘备夺荆州南部四郡 |\n| 219年（建安二十四年） | 襄樊 | 湖北省襄阳市襄城区、樊城区一带 | 北伐襄樊，水淹七军，威震华夏 |\n| 219年（建安二十四年） | 麦城 | 湖北省宜昌市当阳市河溶镇一带 | 败走麦城，被擒遇害 |\n\n## 五、历史影响\n\n### 对当时的影响\n关羽镇守荆州期间，独挡曹、吴两面压力，水淹七军、擒于禁斩庞德，一度威震华夏，使曹操一度考虑迁都避其锋芒，是蜀汉政权鼎盛阶段的重要支柱。其败亡直接导致荆州易手、蜀汉丧失东大门，为蜀汉国力由盛转衰的关键转折。关羽之死又强烈刺激了刘备的政治与情感选择，成为其后发动对吴战争的重要催化因素之一，而夷陵之败进一步重创蜀汉元气，间接加速了蜀汉复兴汉室目标的破灭。\n\n### 对后世的影响\n- **忠义文化的象征**：关羽“义薄云天”的形象经《三国演义》及历代戏曲、小说渲染，成为中华文化中“忠、义、勇、信”的核心符号。\n- **武圣与关帝信仰**：自宋徽宗起不断追封，至明清时期尊崇极盛，成为中华社会最重要的武神之一，并在官方褒崇与民间祭祀互动中形成深远的关帝信仰传统。\n- **民间行业神崇拜**：关羽被奉为武财神、保护神，为商界、镖局、武馆所共同祭祀。\n- **跨地域文化传播**：关羽形象不仅在中国家喻户晓，在东亚尤其是海外华人社会中也广受尊崇，常见于庙宇、商铺与餐馆神龛之中。\n- **文学艺术题材**：关羽形象成为戏曲、小说、绘画、雕塑的经典母题，并不断被塑造成忠诚、荣誉与信义的化身。\n\n### 历史评价\n- 陈寿《三国志》评曰：“关羽、张飞皆称万人之敌，为世虎臣……然羽刚而自矜，飞暴而无恩，以短取败，理数之常也。”\n- 《三国演义》以“义绝”称之，塑造其忠义化身的经典形象。\n\n## 人教版教材知识点\n\n### 初中阶段\n- **三国鼎立局面**：了解东汉末年群雄割据，赤壁之战奠定三国基础。\n- **关羽与刘备集团**：知道关羽是蜀汉的重要将领，与刘备、张飞关系密切。\n- **荆州的战略地位**：理解荆州是三国争夺的地理要冲，关羽长期镇守此地。\n- **史实与演义区别**：区分《三国志》正史与《三国演义》文学演绎。\n\n### 高中阶段\n- **襄樊之战与荆州得失**：掌握219年北伐襄樊、水淹七军与败走麦城的历史链条。\n- **历史评价的双面性**：理解陈寿“刚而自矜”与后世“忠义无双”之间的张力。\n- **神化过程**：从汉寿亭侯到武圣，看官方意识形态与民间信仰互动。\n\n## 初高中阶段考点\n\n### 初中考点\n- **时代定位**：东汉末年，三国鼎立形成时期。\n- **核心身份**：蜀汉名将，刘备集团核心成员。\n- **历史结局**：219年败走麦城，被擒遇害。\n- **后世地位**：被尊为“武圣”。\n\n### 高中考点\n- **史料来源**：以《三国志·关羽传》及裴松之注为正史依据。\n- **战略分析**：关羽镇守荆州的得失及其对蜀汉的影响。\n- **文化形象**：正史关羽与文学关羽之间的差异。\n\n## 六、补充说明\n\n- 字“云长”、籍贯河东解县系《三国志》裴松之注引《江表传》《关羽传》综合说法，部分细节存争议。\n- 桃园三结义、温酒斩华雄、过五关斩六将、华容道义释曹操等事迹多为《三国演义》演绎，史实存疑。\n- “青龙偃月刀”“赤兔马”等形象主要见于小说，史书无确载。\n- “武圣”与“关帝”信仰主要为后世逐步形成，非东汉时之地位。\n\n## 地点坐标（人工校正）\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 河东解县 | 山西省运城市盐湖区解州镇一带 | 35.0274 | 111.0012 |\n| 涿郡 | 河北省保定市涿州市 | 39.4858 | 115.9734 |\n| 徐州 | 江苏省徐州市 | 34.2044 | 117.2858 |\n| 许都 | 河南省许昌市魏都区一带 | 34.0229 | 113.8220 |\n| 白马 | 河南省安阳市滑县白马一带 | 35.5764 | 114.5123 |\n| 华容道 | 湖北省荆州市监利市一带 | 29.8208 | 112.9042 |\n| 荆州 | 湖北省荆州市 | 30.3352 | 112.2419 |\n| 襄樊 | 湖北省襄阳市襄城区、樊城区一带 | 32.0099 | 112.1224 |\n| 麦城 | 湖北省宜昌市当阳市河溶镇一带 | 30.8199 | 111.7831 |\n","relatedGraph": {"center": {"id": 28,"name": "关羽","file": "关羽.html","dynasty": "东汉末年","birth_year": 160,"death_year": 220,"time_year": 190,"quote": "华容道义释曹操","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "military","main_role_label": "武将","birthplace": "河东郡解县","birthplace_raw": "河东郡解县今山西省运城市盐湖区解州镇一带","birthplace_modern": "山西省运城市盐湖区解州镇一带","birth_lat_wgs84": 35.027408,"birth_lng_wgs84": 111.001238,"birth_lat": 35.027408,"birth_lng": 111.001238,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": ""
