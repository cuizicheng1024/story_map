  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

中篇小说《李有才板话》中的著名章节，描写区干部老杨深入阎家山调查研究、推动农民翻身解放的故事，展现了解放区农村基层政权建设中的矛盾与斗争。", "summary": "赵树理出生于贫苦农民家庭，深受民间文艺熏陶", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 赵树理\n\n## 人物档案\n\n### 基本信息\n- **姓名**：赵树理\n- **时代**：中国现代（清末至新中国）\n- **出生**：公元1906年9月24日，山西省沁水县尉迟村（今山西省晋城市沁水县）\n- **去世**：公元1970年9月23日，北京市\n- **享年**：64岁\n- **主要身份**：作家、小说家、人民艺术家\n- **历史地位**：中国现代文学“山药蛋派”的开创者与代表人物，其作品深刻反映了中国农村的社会变革与农民生活。\n- **主要成就**：\n    1. 创立了具有鲜明民族化、大众化风格的“山药蛋派”文学流派。\n    2. 代表作《小二黑结婚》《李有才板话》等成为解放区文学的典范。\n    3. 长期致力于用农民喜闻乐见的语言和形式进行文学创作。\n    4. 对中国现代农村题材文学的发展产生了深远影响。\n\n### 生平概述\n赵树理出生于贫苦农民家庭，深受民间文艺熏陶。他经历了新文化运动、抗日战争、解放战争和新中国成立等重大历史时期。其文学生涯始于20世纪30年代，成熟于40年代的延安文艺座谈会后。他始终坚持深入农村生活，以通俗易懂、幽默风趣的语言，创作了大量反映农村阶级斗争、社会改革和农民思想转变的作品，被誉为描写中国农村的“铁笔”和“圣手”。他的作品真实记录了20世纪中国农村的巨大变迁。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要遍布山西、河南、河北及北京，核心活动区域在华北农村。\n- ⏱️ **时间跨度**：1906年 - 1970年，共计约64年。\n- 📍 **地理范围**：以故乡山西为起点，辐射至太行山区、华北平原，晚年定居北京。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：尉迟村\n- **时间**：1906年\n- **停留时间**：童年及少年时期（约14年）\n- **地点**：山西省沁水县尉迟村（今山西省晋城市沁水县嘉峰镇尉迟村）\n- **事件**：出生于贫农家庭，原名赵礼饱。自幼随祖父识字，接触上党梆子、民歌、鼓词等民间艺术。\n- **意义**：沁河岸畔的乡村岁月滋养了他——鼓书、社火、田间俚语，这些泥土里长出的记忆日后化作《小二黑结婚》里最鲜活的笔触，字字带着晋东南的烟火气\n\n### 📍 重要地点：长治\n- **时间**：1925年 - 1928年\n- **停留时间**：约3年\n- **地点**：山西省潞安府（今山西省长治市）\n- **事件**：考入山西省立第四师范学校（长治师范），开始接触新文学和五四新思想。\n- **意义**：接受了现代教育，思想发生重要转变，萌生了用文学改造社会的志向。\n\n### 📍 重要地点：太原\n- **时间**：1929年 - 1936年（期间多次往返）\n- **停留时间**：断续居住数年\n- **地点**：山西省太原府（今山西省太原市）\n- **事件**：因参与学生运动被开除、被捕。出狱后在此当过小学教员、职员，并开始尝试写作，创办《山西党讯》副刊。\n- **意义**：在动荡中坚持创作和编辑工作，早期作品在此发表，文学与革命思想进一步结合。\n\n### 📍 重要地点：阳城、沁水\n- **时间**：1937年 - 1939年\n- **停留时间**：约2年\n- **地点**：山西省阳城县、沁水县（今山西省晋城市阳城县、沁水县）\n- **事件**：抗战爆发后加入牺盟会，从事抗日宣传和基层工作，担任过区长。\n- **意义**：六十年代初他试图回归乡土、重续与土地的对话。风暴却猝然降临，这位把农民写得最真的人，最终因\"写不出歌颂之词\"而遭狂飙吞噬，一九七〇年含冤辞世\n\n### 📍 重要地点：长治（第二次重要停留）\n- **时间**：1940年 - 1942年\n- **停留时间**：约2年\n- **地点**：山西省长治县（今山西省长治市）\n- **事件**：在《黄河日报》（路东版）、《人民报》从事编辑工作，创作大量通俗文艺作品。\n- **意义**：六十年代初他试图回归乡土、重续与土地的对话。风暴却猝然降临，这位把农民写得最真的人，最终因\"写不出歌颂之词\"而遭狂飙吞噬，一九七〇年含冤辞世在根据地产生广泛影响。\n\n### 📍 重要地点：延安\n- **时间**：1943年5月 - 1945年\n- **停留时间**：约2年半\n- **地点**：陕西省延安府（今陕西省延安市）\n- **事件**：抵达延安。在毛泽东同志《在延安文艺座谈会上的讲话》精神指引下，创作出成名作《小二黑结婚》和《李有才板话》。\n- **意义**：创作进入黄金期，作品获得巨大成功，确立了其文学地位和“山药蛋派”的雏形。\n- **名篇名句**：《小二黑结婚》：“小二黑好比一枝花，可惜开在粪堆旁。”；《李有才板话》：“村长阎恒元，一手遮住天。”\n\n### 📍 重要地点：武安、邢台\n- **时间**：1946年 - 1948年\n- **停留时间**：约2年\n- **地点**：河北省武安县、邢台县（今河北省邯郸市武安市、邢台市）\n- **事件**：在晋冀鲁豫边区文联工作，主编《新大众》报。创作长篇小说《李家庄的变迁》。\n- **意义**：新中国成立后他执意回返长治乡野，想继续做蹲在田埂边为农民书写的\"文摊作家\"，岂料\"反右\"与\"文革\"的风暴接踵袭来，一支蘸满泥土的笔，最终被自己热爱的时代逼入绝境，1970年含冤辞世\n- **名篇名句**：《李家庄的变迁》：“这地方的老百姓，怕官怕得厉害。”\n\n### 📍 重要地点：北京\n- **时间**：1949年 - 1965年（主要居住时期）\n- **停留时间**：约16年\n- **地点**：北平/北京（今北京市）\n- **事件**：新中国成立后，历任《说说唱唱》主编、《人民文学》编委、中国曲艺家协会主席、中国作家协会理事等职。创作《登记》《锻炼锻炼》《三里湾》等作品。\n- **意义**：成为全国性文艺界领导人，但坚持深入北京郊区及山西农村体验生活，创作反映农业合作化等新时代问题的作品。\n- **名篇名句**：《登记》：“罗汉钱，金光闪，越看越爱越心酸。”；《锻炼锻炼》：“‘小腿疼’和‘吃不饱’这两个外号，比她们的学名还响亮。”\n\n### 📍 重要地点：太原（第二次重要停留）\n- **时间**：1965年 - 1966年\n- **停留时间**：约1年\n- **地点**：山西省太原市（今山西省太原市）\n- **事件**：调回山西，兼任晋城县委副书记，深入基层。\n- **意义**：新中国成立后他执意回返长治乡野，想继续做蹲在田埂边为农民书写的\"文摊作家\"，岂料\"反右\"与\"文革\"的风暴接踵袭来，一支蘸满泥土的笔，最终被自己热爱的时代逼入绝境，1970年含冤辞世\n\n### 🔴 去世地：北京\n- **时间**：1970年9月23日\n- **停留时间**：生命最后几年（1966-1970）\n- **地点**：北京（今北京市）\n- **事件**：在“文化大革命”中遭受残酷迫害，含冤去世。\n- **意义**：一位始终为农民写作的人民作家悲剧性地陨落。1978年获得平反。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1906 | 尉迟村 | 山西省晋城市沁水县嘉峰镇尉迟村 | （年龄：0）出生于山西沁水尉迟村。 |\n| 1925 | 长治 | 山西省长治市 | （年龄：19）考入长治山西省立第四师范学校。 |\n| 1929 | 太原 | 山西省太原市 | （年龄：23）因参与学运在太原被捕。 |\n| 1937 |  |  | （年龄：31）抗战爆发，加入牺盟会，投身抗日。 |\n| 1943 | 延安 | 陕西省延安市 | （年龄：37）抵达延安，创作《小二黑结婚》《李有才板话》。 |\n| 1946 |  |  | （年龄：40）在晋冀鲁豫边区工作，创作《李家庄的变迁》。 |\n| 1949 | 北京 | 北京市 | （年龄：43）新中国成立，定居北京，担任文艺界领导职务。 |\n| 1950 |  |  | （年龄：44）发表短篇小说《登记》。 |\n| 1955 |  |  | （年龄：49）创作长篇小说《三里湾》。 |\n| 1965 |  |  | （年龄：59）调回山西，兼任晋城县委副书记。 |\n| 1970 | 北京 | 北京市 | （年龄：64）9月23日于北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《小二黑结婚》**（节选）、**《李有才板话》**（节选）、《老杨同志》（节选自《李有才板话》）\n- 核心要点：\n    - **重点**：作品深刻体现了 **延安文艺座谈会讲话** 后解放区文学 **为工农兵服务** 的创作方向。\n    - **重点**：成功塑造了 **小二黑、小芹** 等新一代农民形象，以及 **二诸葛、三仙姑** 等落后农民的典型。\n    - **重点**：语言艺术极具特色，采用经过提炼的 **农民口语**，幽默风趣，通俗易懂，形成了 **“山药蛋派”** 的鲜明风格。\n    - 善于通过 **日常生活矛盾**（如婚姻自由、政权建设）反映农村社会变革的重大主题。\n    - 叙事结构借鉴了 **中国传统说唱文学** 和 **章回小说** 的手法，故事性强。\n    - 作品具有浓郁的 **山西乡土气息** 和地方色彩。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：赵树理是 **延安文艺座谈会讲话** 精神的杰出实践者，其创作方向代表了解放区文艺的新气象。\n    - 其作品是研究 **抗日根据地** 和 **解放区农村社会变革**（如减租减息、婚姻法、政权建设）的重要文学史料。\n    - **重点**：作为 **“山药蛋派”** 的创始人，他影响了马烽、西戎等一批山西作家，形成了当代文学史上重要的流派。\n- 核心要点：\n    - **重点**：赵树理的文学道路体现了 **知识分子与工农群众相结合** 的时代要求，他始终以 **“地摊文学家”** 自居。\n    - **重点**：他的创作核心是 **“问题小说”**，旨在通过文学作品揭示并推动解决农村实际工作中的问题。\n    - 其文学观强调 **民族形式** 与 **大众化**，反对脱离群众的“欧化”语言和形式。\n    - **重点**：他的人生与创作命运，折射出 **20世纪中国农村变迁** 与 **文艺政策演变** 的复杂互动关系。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 山西省晋城市沁水县嘉峰镇尉迟村 | 35.72 | 112.42 |\n| 山西省长治市 | 36.19 | 113.12 |\n| 山西省太原市 | 37.87 | 112.55 |\n| 山西省晋城市阳城县 | 35.49 | 112.43 |\n| 陕西省延安市 | 36.59 | 109.49 |\n| 河北省邯郸武安市 | 36.70 | 114.20 |\n| 河北省邯郸市武安市、邢台市 | 36.92 | 114.36 |\n| 河北省邢台市 | 37.07 | 114.50 |\n| 北京市 | 39.90 | 116.40 |\n", "relatedGraph": {"center": {"id": 426, "name": "赵树理", "file": "赵树理.html", "dynasty": "中国现代（清末至新中国）", "birth_year": 1906, "death_year": 1970, "time_year": 1908, "quote": "小二黑好比一枝花，可惜开在粪堆旁。", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "literature", "main_role_label": "作家", "birthplace": "山西省沁水县尉迟村", "birthplace_raw": "山西省沁水县尉迟村今山西省晋城市沁水县", "birthplace_modern": "山西省晋城市沁水县", "birth_lat_wgs84": 35.72, "birth_lng_wgs84": 112.42, "birth_lat": 35.72, "birth_lng": 112.42, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["赵树理"], "search_tokens": ["赵树理", "zhaoshuli", "zsl"], "search_pinyin": ["zhaoshuli", "zsl"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "isCenter": true, "relationLabel": "中心人物"}, "nodes": [{"id": 426, "name": "赵树理", "file":
