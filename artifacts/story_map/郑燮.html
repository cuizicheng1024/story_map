  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

Points": "### 初中阶段\n1.  **郑板桥**是清朝著名画家，为“**扬州八怪**”之一。\n2.  他擅长画**兰、竹、石**，尤其以画**竹**闻名。\n3.  他曾经当过**县令**，因为**开仓放粮**救济灾民而受到百姓爱戴。\n4.  他的名句“**衙斋卧听萧萧竹，疑是民间疾苦声**”体现了他关心百姓疾苦的思想感情。\n5.  他辞官后，在**扬州**以**卖画**为生。\n\n### 高中阶段\n1.  郑燮，号**板桥**，其艺术成就集中于**诗、书、画**“三绝”。\n2.  书法独创“**六分半书**”，将楷、隶、行、草熔于一炉，俗称“**乱石铺街**”体。\n3.  绘画理论强调“**师法自然**”与“**胸有成竹**”，反对单纯模仿。\n4.  其人生经历体现了**仕与隐**的矛盾，最终选择**职业画家**的道路，是**文人画商品化**的典型。\n5.  “**难得糊涂**”四字蕴含了深刻的处世智慧，是其思想的重要标签。（存疑/说法不一：此题字的具体创作背景和意图有多种解读）","workTexts": {"扬州": "画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。","秋葵石笋图": "牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。","潍县署中画竹呈年伯包大中丞括": "衙斋卧听萧萧竹，疑是民间疾苦声；些小吾曹州县吏，一枝一叶总关情。","新竹": "新竹高于旧竹枝，全凭老干为扶持。下年再有新生者，十丈龙孙绕凤池。","沁园春·恨": "花亦无知，月亦无聊，酒亦无灵。把夭桃斫断，煞他风景；鹦哥煮熟，佐我杯羹。焚砚烧书，椎琴裂画，毁尽文章抹尽名。荥阳郑，有慕歌家世，乞食风情。","沁园春": "花亦无知，月亦无聊，酒亦无灵。把夭桃斫断，煞他风景；鹦哥煮熟，佐我杯羹。焚砚烧书，椎琴裂画，毁尽文章抹尽名。荥阳郑，有慕歌家世，乞食风情。","恨": "花亦无知，月亦无聊，酒亦无灵。把夭桃斫断，煞他风景；鹦哥煮熟，佐我杯羹。焚砚烧书，椎琴裂画，毁尽文章抹尽名。荥阳郑，有慕歌家世，乞食风情。","板桥润格": "“扬州八怪”","乳母诗": "| 1722年 | | | （年龄：约30岁）乳母费氏卒，作《乳母诗》哀悼。","与杭世骏书": "| 1757年 | | | （年龄：65岁）游杭州，作《与杭世骏书》。","墨林今话": "“板桥道人……诗词书画皆旷世独立，自成一家。”","松轩随笔": "“板桥大令有三绝：曰画、曰诗、曰书。三绝之中有三真：曰真气、曰真意、曰真趣。”","**板桥家书**": "文学作品《板桥家书》真挚感人"},"workSummaries": {"扬州": {"title": "扬州","aliases": [],"authors": ["郑燮"],"related_people": ["郑燮"],"source_pages": ["郑燮"],"era": "清代（康熙、雍正、乾隆年间）","genre": "","one_liner": "画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。","summary": "画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。","quote": "画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。","quotes": ["画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。","千家养女先教曲，十里栽花算种田。","画舫乘春破晓烟，满城丝管拂榆钱。"],"quote_policy": "preferred"},"秋葵石笋图": {"title": "秋葵石笋图","aliases": [],"authors": ["郑燮"],"related_people": ["郑燮"],"source_pages": ["郑燮"],"era": "清代（康熙、雍正、乾隆年间）","genre": "","one_liner": "牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。","summary": "牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。","quote": "牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。","quotes": ["牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。","我亦终葵称进士，相随丹桂状元郎。","牡丹富贵号花王，芍药调和宰相祥。"],"quote_policy": "preferred"},"潍县署中画竹呈年伯包大中丞括": {"title": "潍县署中画竹呈年伯包大中丞括","aliases": [],"authors": ["郑燮"], es": [],"authors": [],"related_people": ["郑燮"],"source_pages": ["郑燮"],"era": "","genre": "书信/论说文","one_liner": "| 1757年 | | | （年龄：65岁）游杭州，作《与杭世骏书》。","summary": "| 1757年 | | | （年龄：65岁）游杭州，作《与杭世骏书》。","quote": "","quotes": [],"quote_policy": "summary_only"},"墨林今话": {"title": "墨林今话","aliases": [],"authors": [],"related_people": ["郑燮"],"source_pages": ["郑燮"],"era": "","genre": "","one_liner": "板桥道人……诗词书画皆旷世独立，自成一家。","summary": "板桥道人……诗词书画皆旷世独立，自成一家。","quote": "","quotes": [],"quote_policy": "summary_only"},"松轩随笔": {"title": "松轩随笔","aliases": [],"authors": [],"related_people": ["郑燮"],"source_pages": ["郑燮"],"era": "","genre": "","one_liner": "板桥大令有三绝：曰画、曰诗、曰书。三绝之中有三真：曰真气、曰真意、曰真趣。","summary": "板桥大令有三绝：曰画、曰诗、曰书。三绝之中有三真：曰真气、曰真意、曰真趣。","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 郑燮\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：郑燮（字克柔，号板桥，又号板桥居士、板桥道人）\n- **时代**：清代（康熙、雍正、乾隆年间）\n- **出生**：康熙三十二年（1693年），江苏兴化（今江苏省泰州市兴化市）\n- **去世**：乾隆三十年（1765年），江苏兴化（今江苏省泰州市兴化市）\n- **享年**：73岁（按传统虚岁计，周岁为72岁）\n- **主要身份**：画家、书法家、文学家、官员\n- **历史地位**：“扬州八怪”的代表人物，以诗、书、画“三绝”闻名于世，其艺术风格与人格精神对后世影响深远。\n- **主要成就**：开创“六分半书”；画兰竹石独具一格；诗文真挚风趣；为官清正爱民。\n\n### 生平概述\n郑燮生活在清代“康乾盛世”，出身于一个衰落的书香门第，早年生活贫困，靠卖画为生。他刻苦读书，于乾隆元年（1736年）考中进士。先后在山东范县、潍县担任知县长达十二年，期间勤政爱民，因开仓赈灾、救济饥民而得罪豪绅，最终“乞病归”。罢官后，他重返扬州，以卖画为生，直至终老。其人生轨迹体现了传统文人在仕隐之间的挣扎，其艺术创作则充满了对民生疾苦的关怀与对个性自由的追求。\n\n---\n\n**人生足迹地图说明**\n- 🗺️ **行程概览**：主要活动于江苏、山东两地，以扬州为中心，足迹北至山东，南归故里。\n- ⏱️ **时间跨度**：1693年—1765年，共73年。\n- 📍 **地理范围**：今江苏省（兴化、扬州、南京）、山东省（范县、潍县）等地。\n- 🌟 **重要节点数量**：约10个核心地点。\n\n---\n\n## 二、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：兴化\n- **公元纪年**：1693年—1712年左右\n- **停留时间**：约20年（青少年时期）\n- **位置**：兴化县（今江苏省泰州市兴化市）\n- **事迹**：出生于书香门第，但家道中落，幼年丧母，由乳母费氏抚养。早年在家乡读书、学画，生活清苦。\n- **意义**：那段清贫的少年岁月，丧母之痛与继母的慈爱交织，让他在灶火书卷间早早读懂民间疾苦。寒门学子的倔强与同情心，构成了他日后为官为艺的精神底色\n\n### 📍 重要地点：扬州（初次）\n- **公元纪年**：约1712年—1732年\n- **停留时间**：约20年（青年至中年）\n- **位置**：扬州府（今江苏省扬州市）\n- **事迹**：父亲去世后，为谋生首次来到扬州卖画。期间广交文友，诗画技艺渐长，但生活依然困顿，经历了“乞食山僧庙，缝衣歌妓家”的落魄岁月。\n- **意义**：乾隆三十年的寒冬，一代才子辞世于扬州寓所，魂归这片承载他半生荣辱与笔墨的土地。从此\"板桥\"二字，成了中国文人画史上反复追摹的精神坐标\n- **名篇名句**：《扬州》：“画舫乘春破晓烟，满城丝管拂榆钱。千家养女先教曲，十里栽花算种田。”\n\n### 📍 重要地点：焦山\n- **公元纪年**：雍正十年（1732年）前后\n- **停留时间**：数月（备考期间）\n- **位置**：焦山（今江苏省镇江市京口区）\n- **事迹**：为准备乡试，曾在此地潜心读书。\n- **意义**：科举道路上的重要准备阶段，于雍正十年（1732年）考中举人。\n\n### 📍 重要地点：北京\n- **公元纪年**：乾隆元年（1736年）\n- **停留时间**：短期\n- **位置**：顺天府（今北京市）\n- **事迹**：赴京参加会试，考中二甲第八十八名进士。\n- **意义**：乾隆三十年的寒冬，一代才子辞世于扬州寓所，魂归这片承载他半生荣辱与笔墨的土地。从此\"板桥\"二字，成了中国文人画史上反复追摹的精神坐标仕”的理想。\n- **名篇名句**：《秋葵石笋图》：“牡丹富贵号花王，芍药调和宰相祥。我亦终葵称进士，相随丹桂状元郎。”\n\n### 📍 重要地点：范县\n- **公元纪年**：乾隆七年（1742年）—乾隆十一年（1746年）\n- **停留时间**：约4年\n- **位置**：范县（清代属山东曹州府，治所在今山东省聊城市莘县古城镇（存疑）；今河南省濮阳市范县为另一地）\n- **事迹**：任范县知县。他体察民情，简化讼务。\n- **意义**：1765年深秋，七十三岁的板桥先生在扬州的萧萧竹叶声中走完了传奇一生。这位以\"难得糊涂\"名世的狂士，宦海半生、卖画半生，笔下兰竹在此惊艳士林，胸中块垒也在此化作烟云，最终魂归他用笔墨深爱的这座城——瘦西湖畔的月光，从此多了一笔永不褪色的墨香\n\n### 📍 重要地点：潍县\n- **公元纪年**：乾隆十一年（1746年）—乾隆十八年（1753年）\n- **停留时间**：约7年\n- **位置**：潍县（今山东省潍坊市）\n- **事迹**：调任潍县知县。遇大饥荒，他毅然开仓赈济，活人无数，并因此得罪上司和豪强。乾隆十八年，因请赈之事被诬告，遂辞官归去。\n- **意义**：为官生涯的顶点与终点，其爱民之举深得民心，“去官日，百姓痛哭遮留，家家画像以祀”。\n- **名篇名句**：《潍县署中画竹呈年伯包大中丞括》：“衙斋卧听萧萧竹，疑是民间疾苦声；些小吾曹州县吏，一枝一叶总关情。”（注：此诗为其在山东任知县期间所作，具体创作地点（范县或潍县）有不同说法。）\n\n### 📍 重要地点：扬州（再回）\n- **公元纪年**：乾隆十八年（1753年）—乾隆三十年（1765年）\n- **停留时间**：约12年（晚年）\n- **位置**：扬州府（今江苏省扬州市）\n- **事迹**：罢官后重返扬州，以卖画为生，声名大噪。与汪士慎、金农等画家交游，成为“扬州八怪”的核心人物。制定《板桥润格》，明码标价，成为文人职业化卖画的典范。\n- **意义**：艺术创作的巅峰时期，诗书画“三绝”风格完全成熟，名声达到顶峰。\n- **名篇名句**：《竹石》；《新竹》：“新竹高于旧竹枝，全凭老干为扶持。下年再有新生者，十丈龙孙绕凤池。”\n\n### 📍 重要地点：兴化（晚年隐居地）\n- **公元纪年**：约乾隆二十五年（1760年）后\n- **停留时间**：断续居住\n- **位置**：兴化县（今江苏省泰州市兴化市）\n- **事迹**：晚年常回兴化，筑“拥绿园”隐居，与故旧交游。\n- **意义**：乾隆三十年的寒冬，一代才子辞世于扬州寓所，魂归这片承载他半生荣辱与笔墨的土地。从此\"板桥\"二字，成了中国文人画史上反复追摹的精神坐标\n\n### 🔴 去世地：兴化\n- **公元纪年**：乾隆三十年（1765年）\n- **停留时间**：生命最后阶段\n- **位置**：兴化县（今江苏省泰州市兴化市）\n- **经过**：在家中病逝，葬于兴化城东管阮庄。\n- **意义**：从兴化负箧来此赴考那日起，他便与扬州结下不解之缘；中年宦海辗转范县潍县十二载，暮年卖画为生，乾隆三十年冬日悄然闭眼——这座城既是他笔墨的起点，也是魂归的终点\n- **名篇名句**：《沁园春·恨》：“花亦无知，月亦无聊，酒亦无灵。把夭桃斫断，煞他风景；鹦哥煮熟，佐我杯羹。焚砚烧书，椎琴裂画，毁尽文章抹尽名。荥阳郑，有慕歌家世，乞食风情。”\n\n---\n\n## 三、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1693年 | 兴化 | 江苏省泰州市兴化市 | （年龄：0岁）出生于江苏兴化。 |\n| 约1712年 | 扬州（初次） | 江苏省扬州市 | （年龄：约20岁）中秀才，为谋生首次赴扬州卖画。 |\n| 1722年 |  |  | （年龄：约30岁）乳母费氏卒，作《乳母诗》哀悼。 |\n| 1732年 |  |  | （年龄：约40岁）考中举人。 |\n| 1736年 |  |  | （年龄：44岁）考中进士。 |\n| 1742年 | 范县 | 范县；河南省濮阳市范县为另一地） | （年龄：50岁）赴山东任范县知县。 |\n| 1746年 | 潍县 | 山东省潍坊市 | （年龄：54岁）调任潍县知县。 |\n| 1748年 | 潍县 | 山东省潍坊市 | （年龄：56岁）潍县大饥，开仓赈济。 |\n| 1753年 | 潍县 | 山东省潍坊市 | （年龄：61岁）辞官离开潍县，重返扬州卖画。 |\n| 1757年 |  |  | （年龄：65岁）游杭州，作《与杭世骏书》。 |\n| 约1760年 | 兴化（晚年隐居地） | 江苏省泰州市兴化市 | （年龄：约68岁）回兴化隐居，筑拥绿园。 |\n| 1765年 | 兴化 | 江苏省泰州市兴化市 | （年龄：73岁）十二月十二日，卒于兴化。 |\n\n---\n\n## 四、历史影响\n\n### 对当时的影响\n郑燮以其离经叛道的艺术风格（“怪”）和清廉爱民的官员形象，在清代中期的文化与政治领域均产生了独特影响。在艺术上，他作为“扬州八怪”的旗帜，打破了当时画坛的摹古僵局，推动了艺术商品化与个性化发展；在为官任上，其爱民如子、刚直不阿的事迹在民间广为传颂，成为清官典范。\n\n### 对后世的影响\n- **艺术创新**：其“六分半书”和水墨写意花鸟画对后世海派及近现代画家如齐白石、徐悲鸿等产生了深远影响。\n- **人格典范**：“三绝诗书画，一官归去来”的人生轨迹，成为后世文人仰慕的“达则兼济天下，穷则独善其身”的完美典范。\n- **文化符号**：“难得糊涂”、“吃亏是福”等题字（其具体创作背景和意图有多种解读，存疑）蕴含的处世哲学，已融入中国民间文化，成为广泛流传的格言。\n- **文学价值**：其诗文家书语言朴实，感情真挚，具有很高的文学与史料价值。\n\n### 历史评价\n- **清代蒋宝龄《墨林今话》**：“板桥道人……诗词书画皆旷世独立，自成一家。”\n- **清代张维屏《松轩随笔》**：“板桥大令有三绝：曰画、曰诗、曰书。三绝之中有三真：曰真气、曰真意、曰真趣。”\n- **后世综合评价**：郑板桥是中国艺术史上一位极具人民性和个性的艺术家，他的艺术与人生高度统一，体现了中国传统知识分子的社会责任感与艺术独创精神。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：生活在**清朝**（康乾盛世）。\n- **关键事件**：**考中进士**，在山东做过**知县**，后因**开仓赈济**饥民得罪上司，**辞官卖画**。\n- **代表作品/思想**：以画**兰、竹、石**闻名，是“**扬州八怪**”的代表人物。名句“**衙斋卧听萧萧竹，疑是民间疾苦声**”体现了其关心民生的情怀。\n- **常见易混点/对比点**：注意区分“**扬州八怪**”并非八个人，而是一个艺术群体；其号“**板桥**”更为人熟知。\n\n### 高中阶段\n- **时代背景**：**清代中期**，商品经济发展，**扬州**因盐业成为经济文化中心。\n- **关键贡献**：在诗、书、画领域均取得很高成就，号称“**三绝**”；创造了介于楷隶之间的“**六分半书**”；艺术上主张“**眼中之竹**”、“**胸中之竹**”、“**手中之竹**”的创作三段论。\n- **代表作品/思想**：绘画代表作《**竹石图**》、《**兰竹芳馨图**》；文学作品《**板桥家书**》真挚感人；提出“**难得糊涂**”、“**吃亏是福**”的处世哲学。\n- **常见易混点/对比点**：与正统画派“**四王**”的摹古风格形成鲜明对比；其艺术市场化行为（明码标价卖画）与传统文人耻于言利的观念不同。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n1.  **郑板桥**是清朝著名画家，为“**扬州八怪**”之一。\n2.  他擅长画**兰、竹、石**，尤其以画**竹**闻名。\n3.  他曾经当过**县令**，因为**开仓放粮**救济灾民而受到百姓爱戴。\n4.  他的名句“**衙斋卧听萧萧竹，疑是民间疾苦声**”体现了他关心百姓疾苦的思想感情。\n5.  他辞官后，在**扬州**以**卖画**为生。\n\n### 高中阶段\n1.  郑燮，号**板桥**，其艺术成就集中于**诗、书、画**“三绝”。\n2.  书法独创“**六分半书**”，将楷、隶、行、草熔于一炉，俗称“**乱石铺街**”体。\n3.  绘画理论强调“**师法自然**”与“**胸有成竹**”，反对单纯模仿。\n4.  其人生经历体现了**仕与隐**的矛盾，最终选择**职业画家**的道路，是**文人画商品化**的典型。\n5.  “**难得糊涂**”四字蕴含了深刻的处世智慧，是其思想的重要标签。（存疑/说法不一：此题字的具体创作背景和意图有多种解读）\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |","relatedGraph": {"center": {"id": 439,"name": "郑燮","file": "郑燮.html","dynasty": "清代（康熙、雍正、乾隆年间）","birth_year": 1693,"death_year": 1765,"time_year": 1729,"quote": "乞食山僧庙，缝衣歌妓家","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "art","main_role_label": "画家","birthplace": "江苏兴化","birthplace_raw": "江苏兴化今江苏省泰州市兴化市","birthplace_modern": "江苏省泰州市兴化市","birth_lat_wgs84": 32.9139405225943,"birth_lng_wgs84": 119.84766754078126,"birth_lat": 32.9139405225943,"birth_lng": 119.84766754078126,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["郑燮"],"search_tokens": ["郑燮","zhengxie","zx"],"search_pinyin": ["zhengxie","zx"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人物"},"nodes": [{"id": 439,"name": "郑燮","file": "郑燮.html","dynasty": "清代（康熙、雍正、乾隆年间）","birth_year": 1693,"death_year": 1765,"time_year": 1729,"quote": "乞食山僧庙，缝衣歌妓家","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "art","main_role_label": "画家","birthplace": "江苏兴化","birthplace_raw": "江苏兴化今江苏省泰州市兴化市","birthplace_modern": "江苏省泰州市兴化市","birth_lat_wgs84": 32.9139405225943,"birth_lng_wgs84": 119.84766754078126,"birth_lat": 32.9139405225943,"birth_lng": 119.84766754078126,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["郑燮"],"search_tokens": ["郑燮","zhengxie","zx"],"search_pinyin": ["zhengxie","zx"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人物"},{"id": 352,"name": "纪昀","file": "纪昀.html","dynasty": "清代","birth_year": 1724,"deat
