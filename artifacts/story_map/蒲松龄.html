.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

地图说明\n- 🗺️ **行程概览**：一生主要活动于山东淄川、济南一带，青年时期曾南下江苏做幕宾。\n- ⏱️ **时间跨度**：公元1640年 - 公元1715年，共76年。\n- 📍 **地理范围**：主要覆盖今山东省中北部，一度延伸至江苏省中部。\n- 🌟 **重要节点数量**：9个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：蒲家庄\n- **时间**：公元1640年\n- **停留时间**：童年及青少年时期（约1640-1658年）\n- **地点**：古称般阳蒲家庄（今山东省淄博市淄川区蒲家庄）\n- **事件**：出生于一个渐趋没落的书香家庭。\n- **意义**：其故乡，一生大部分时间生活与创作的地方，也是《聊斋志异》故事的重要发源地。\n\n### 📍 重要地点：济南\n- **时间**：公元1658年起，多次往返\n- **停留时间**：断续停留，每次数日至数月不等\n- **地点**：古称济南府（今山东省济南市）\n- **事件**：首次参加童子试，以县、府、道三第一考中秀才，深得学使施闰章赏识。此后多次赴济南参加乡试，皆铩羽而归。\n- **意义**：科举得意与失意交织之地，见证了他人生最大的希望与最深的挫败。\n- **名篇名句**：《聊斋志异·叶生》：“魂从知己，竟忘死耶？”\n\n### 📍 重要地点：宝应县\n- **时间**：公元1670年 - 公元1671年\n- **停留时间**：约一年\n- **地点**：古称宝应（今江苏省扬州市宝应县）\n- **事件**：应同邑友人、时任宝应知县孙蕙之邀，南下做幕宾，代拟书启、文告。\n- **意义**：唯一一次远游，开阔了眼界，亲身接触了官场生态与民间疾苦，为其创作积累了素材。\n- **名篇名句**：《聊斋志异·梦狼》：“窃叹天下之官虎而吏狼者，比比也。”\n\n### 📍 重要地点：高邮州\n- **时间**：公元1671年\n- **停留时间**：数月\n- **地点**：古称高邮（今江苏省扬州市高邮市）\n- **事件**：随孙蕙调任，继续其幕宾生涯。\n- **意义**：康熙五十四年正月，蒲松龄在故宅聊斋中端坐而逝，身后尚有未定之稿；如今其故居与墓园辟为纪念馆，老槐石碑无言，向世人诉说着这位\"写鬼写妖高人一等\"的落魄才人传奇\n- **名篇名句**：《聊斋志异·王桂庵》：“闺中人望眼欲穿矣。”\n\n### 📍 重要地点：归乡（结束南游）\n- **时间**：公元1672年\n- **停留时间**：（此后长期居住）\n- **地点**：古称般阳蒲家庄（今山东省淄博市淄川区蒲家庄）\n- **事件**：辞幕归乡，结束南游。\n- **意义**：康熙五十四年正月，蒲松龄在故宅聊斋中端坐而逝，身后尚有未定之稿；如今其故居与墓园辟为纪念馆，老槐石碑无言，向世人诉说着这位\"写鬼写妖高人一等\"的落魄才人传奇\n\n### 📍 重要地点：济南（闲居）\n- **时间**：公元1678年\n- **停留时间**：数月\n- **地点**：古称济南府（今山东省济南市）\n- **事件**：应友人之邀，短暂客居济南，进行诗文唱和与创作。\n- **意义**：一七一五年，聊斋先生在此端坐而逝，享年七十六岁。身后《聊斋志异》经传抄刊刻终成志怪传奇之巅峰；故居与墓园今在松柏间静默伫立，供后人凭吊这位落第书生笔下的鬼狐花妖\n\n### 📍 重要地点：西铺村（毕家坐馆）\n- **时间**：约公元1679年 - 公元1710年\n- **停留时间**：约三十年\n- **地点**：古称西铺（今山东省淄博市周村区王村镇西铺村）\n- **事件**：受同邑名士毕际有之聘，设帐于其家“绰然堂”，教授毕家子弟。在此期间，创作并持续修订《聊斋志异》，同时撰写大量诗文俚曲。\n- **意义**：人生最重要的阶段，提供了稳定的生活来源和创作环境，《聊斋志异》在此基本定型。\n- **名篇名句**：《聊斋志异·促织》：“天子一跬步，皆关民命，不可忽也。”\n\n### 📍 重要地点：济南（再游）\n- **时间**：公元1690年、1704年等\n- **停留时间**：断续停留\n- **地点**：古称济南府（今山东省济南市）\n- **事件**：晚年数次重游济南，访友、观景、参加诗社活动。\n- **意义**：一七一五年，聊斋先生在此端坐而逝，享年七十六岁。身后《聊斋志异》经传抄刊刻终成志怪传奇之巅峰；故居与墓园今在松柏间静默伫立，供后人凭吊这位落第书生笔下的鬼狐花妖\n- **名篇名句**：《重建古历亭》诗：“大明湖上一徘徊，两岸垂柳荫绿苔。”\n\n### 📍 重要地点：蒲家庄（晚年归居）\n- **时间**：公元1711年 - 公元1715年\n- **停留时间**：晚年最后几年\n- **地点**：古称般阳蒲家庄（今山东省淄博市淄川区蒲家庄）\n- **事件**：结束在毕家的教书生涯，回归故里。71岁援例成为岁贡生。\n- **意义**：康熙五十四年正月，七十六岁的蒲松龄在淄川聊斋中悄然辞世，身后萧条，唯余半生心血《聊斋志异》传世。故居与蒲氏墓园今已成凭吊之所，青砖黛瓦间，犹似那盏伴主人笔耕半生的孤灯长明\n- **名篇名句**：《聊斋自志》：“集腋为裘，妄续幽冥之录；浮白载笔，仅成孤愤之书。”\n\n### 🔴 去世地：蒲家庄\n- **时间**：公元1715年正月二十二日\n- **停留时间**：终老\n- **地点**：古称般阳蒲家庄（今山东省淄博市淄川区蒲家庄）\n- **事件**：在故乡病逝。\n- **意义**：康熙五十四年正月，七十六岁的蒲松龄在淄川聊斋中悄然辞世，身后萧条，唯余半生心血《聊斋志异》传世。故居与蒲氏墓园今已成凭吊之所，青砖黛瓦间，犹似那盏伴主人笔耕半生的孤灯长明\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1640年 | 蒲家庄 | 山东省淄博市淄川区蒲家庄 | （年龄：1岁）出生于山东淄川蒲家庄。 |\n| 1658年 |  |  | （年龄：19岁）参加童子试，以县、府、道三第一考中秀才，名动一时。 |\n| 1670年 | 宝应县 | 江苏省扬州市宝应县 | （年龄：31岁）南下江苏宝应，做知县孙蕙的幕宾。 |\n| 1672年 | 归乡（结束南游） | 山东省淄博市淄川区蒲家庄 | （年龄：33岁）辞幕归乡，结束南游。 |\n| 约1679年 |  |  | （年龄：约40岁）开始在同邑毕际有家设帐教书，历时近四十年。 |\n| 1679年 | 西铺村（毕家坐馆） | 山东省淄博市周村区王村镇西铺村 | （年龄：40岁）在毕家坐馆期间，《聊斋志异》创作已具规模，撰写《聊斋自志》序言。 |\n| 1711年 |  |  | （年龄：72岁）援例成为岁贡生。 |\n| 1715年 | 蒲家庄 | 山东省淄博市淄川区蒲家庄 | （年龄：76岁）正月，病逝于蒲家庄。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《狼》**（选自《聊斋志异》）、**《山市》**（选自《聊斋志异》）\n- 核心要点：\n    - **重点**：**《狼》** 通过屠夫与两只狼斗智斗勇的故事，告诫人们对待像狼一样的恶势力，不能存有幻想，必须敢于斗争、善于斗争。\n    - **重点**：**《山市》** 生动描绘了“山中蜃景”这一奇妙的自然现象，展现了作者细致的观察力和丰富的想象力。\n    - **志怪小说**：作品多以狐鬼花妖为题材，借非现实的故事反映现实社会。\n    - **讽刺艺术**：故事往往蕴含对**科举制度**、**官场腐败**、**社会不公**的深刻讽刺。\n    - **人物塑造**：笔下的**花妖狐魅**大多具有人的性情，形象鲜活，感情真挚。\n    - **情节曲折**：故事结构精巧，**情节**跌宕起伏，引人入胜。\n    - **语言精炼**：文言**语言**简洁典雅，又生动传神，富有表现力。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：生活在**清代康熙**年间，亲身经历了**科举制度**的僵化与弊端，一生科场失意。\n    - 长期担任**私塾教师**（坐馆），属于下层知识分子，生活清贫。\n    - 其代表作**《聊斋志异》** 是中国古代文言短篇小说的最高峰。\n- 核心要点：\n    - **重点**：其人生经历是理解**清代知识分子**在**科举**与**仕途**困境中的典型样本。\n    - **重点**：**《聊斋志异》** 的创作动机源于“**孤愤**”，是个人怀才不遇与社会批判相结合的产物。\n    - **文学地位**：在中国文学史上，与**曹雪芹**（《红楼梦》）分别代表了古典小说文言与白话的最高成就。\n    - **时代背景**：其创作处于**清初**社会秩序恢复但矛盾依然尖锐的时期，作品反映了**底层民众**的苦难与愿望。\n    - **作品影响**：对后世小说、戏曲、影视创作产生了深远影响，是**世界文学宝库**中的瑰宝。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 山东省淄博市淄川区蒲家庄 | 36.65 | 117.97 |\n| 山东省济南市 | 36.65 | 116
