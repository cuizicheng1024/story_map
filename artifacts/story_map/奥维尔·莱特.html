.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

革命**的巅峰成就之一，是内燃机、轻质材料和精密机械技术结合的产物。\n    - **专利与商业**：莱特兄弟积极申请**飞机控制专利**，并与竞争对手（如格伦·柯蒂斯）进行了长期的法律斗争，反映了**知识产权**在现代工业中的重要性。\n    - **军事应用开端**：飞机很快被应用于**第一次世界大战**，从侦察发展到空战，彻底改变了战争形态。\n- 核心要点：\n    - **重点**：**时代背景**：19世纪末20世纪初，科技发明层出不穷，人类对突破自然限制充满热情，航空是当时最前沿的挑战之一。\n    - **重点**：**个人与时代**：莱特兄弟是**自学成才**的工程师，他们的成功证明了在**电气时代**，系统的科学方法比单纯的理论知识更能推动实用技术的突破。\n    - **重点**：**历史地位**：莱特兄弟被公认为**“飞机之父”**，他们的工作直接开启了**航空时代**，是人类交通史上的里程碑式人物。\n    - **全球影响**：飞行技术的传播迅速超越国界，促进了**全球化**进程，缩短了地理距离，对20世纪的**经济、文化、政治**交流产生了不可估量的影响。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：通常不涉及具体文学作品，但其**飞行探索精神**常作为科技类记叙文或人物传记的素材。\n- 核心要点：\n    - **重点**：**科学精神**——莱特兄弟的成功是**系统性实验**、**严谨记录**和**工程迭代**的典范，区别于单纯的冒险。\n    - **重点**：**创新方法**——从**仿生学**（观察鸟类）入手，结合**空气动力学**原理，体现了跨学科解决问题的能力。\n    - **协作与坚持**：兄弟二人的**密切合作**与面对多次失败和外界质疑时的**坚持不懈**，是成就事业的关键。\n    - **从梦想到现实**：将人类古老的**飞行梦想**转化为**可重复、可控制**的工程技术，标志着现代科技对自然的征服。\n    - **影响与遗产**：他们的发明不仅是一项技术突破，更**彻底改变了**人类的交通、战争、交流方式，重塑了20世纪的世界格局。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1903年12月17日**，莱特兄弟在**北卡罗来纳州基蒂霍克（杀魔山）**成功进行了**首次可控的动力飞行**，这是公认的现代航空史起点。\n    - **工业革命延伸**：飞机的发明是**第二次工业革命**的巅峰成就之一，是内燃机、轻质材料和精密机械技术结合的产物。\n    - **专利与商业**：莱特兄弟积极申请**飞机控制专利**，并与竞争对手（如格伦·柯蒂斯）进行了长期的法律斗争，反映了**知识产权**在现代工业中的重要性。\n    - **军事应用开端**：飞机很快被应用于**第一次世界大战**，从侦察发展到空战，彻底改变了战争形态。\n- 核心要点：\n    - **重点**：**时代背景**：19世纪末20世纪初，科技发明层出不穷，人类对突破自然限制充满热情，航空是当时最前沿的挑战之一。\n    - **重点**：**个人与时代**：莱特兄弟是**自学成才**的工程师，他们的成功证明了在**电气时代**，系统的科学方法比单纯的理论知识更能推动实用技术的突破。\n    - **重点**：**历史地位**：莱特兄弟被公认为**“飞机之父”**，他们的工作直接开启了**航空时代**，是人类交通史上的里程碑式人物。\n    - **全球影响**：飞行技术的传播迅速超越国界，促进了**全球化**进程，缩短了地理距离，对20世纪的**经济、文化、政治**交流产生了不可估量的影响。\n\n---", "workTexts": {}, "workSummaries": {}, "markdown": "# 奥维尔·莱特\n\n## 人物档案\n\n### 基本信息\n- **姓名**：奥维尔·莱特\n- **外文名**：Orville Wright\n- **时代**：19世纪末至20世纪中叶（美国）\n- **出生**：公元1871年8月19日，美国俄亥俄州代顿市\n- **去世**：公元1948年1月30日，美国俄亥俄州代顿市\n- **享年**：76岁（注：按周岁计算，因出生在8月，去世在1月，未满77周岁）\n- **主要身份**：发明家、航空先驱、飞机制造商\n- **历史地位**：与哥哥威尔伯·莱特共同发明了世界上第一架成功飞行的可控动力飞机，被誉为“飞机之父”之一。\n- **主要成就**：1. 实现人类首次可控、持续的动力飞行；2. 发明了飞机三轴姿态控制系统；3. 设计并制造了实用的飞机发动机和螺旋桨；4. 为现代航空工业奠定了基础。\n\n### 生平概述\n奥维尔·莱特与哥哥威尔伯·莱特是美国俄亥俄州的自行车制造商。他们凭借对机械的深刻理解和系统性的科学实验方法，从研究鸟类飞行和滑翔机入手，逐步攻克了飞行控制、升力和动力等核心难题。1903年12月17日，他们在北卡罗来纳州基蒂霍克（杀魔山）的沙丘上，成功驾驶“飞行者一号”完成了人类历史上首次可控的动力飞行，开启了航空时代。此后，他们不断改进飞机性能，并在欧洲和美国进行了公开演示，震惊世界，最终推动了飞机的实用化和商业化发展。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：以美国俄亥俄州代顿市为核心，为探索飞行真理而前往北卡罗来纳州进行实验，并远赴欧洲进行飞行演示的航空先驱之旅。\n- ⏱️ **时间跨度**：1871年 - 1948年（职业生涯约始于19世纪90年代）\n- 📍 **地理范围**：主要覆盖美国中东部（俄亥俄州、北卡罗来纳州、华盛顿特区）及欧洲（法国、德国等地）。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：代顿市\n- **时间**：公元1871年8月19日\n- **停留时间**：童年及青少年时期\n- **地点**：美国俄亥俄州代顿市\n- **事件**：出生于一个牧师家庭。童年时，父亲曾送给他们一个能飞的竹蜻蜓（或类似玩具），激发了兄弟俩对飞行终生的兴趣。（注：具体玩具类型及赠送时间存疑）\n- **意义**：那间弥漫着机油与铁屑味的小自行车铺，藏着莱特兄弟改写天空史的最初答案。从修车到造飞机，看似荒诞的跳跃，恰是从这间逼仄作坊里开始的\n\n### 📍 重要地点：里奇曼（童年居住地）\n- **时间**：公元1878年 - 1884年\n- **停留时间**：约6年\n- **地点**：美国印第安纳州里奇曼市\n- **事件**：在此居住期间，父亲可能再次带回能飞的玩具，兄弟俩尝试仿制但未成功，这促使他们开始思考飞行的原理。（注：具体事件细节存疑）\n- **意义**：晚年的奥维尔在此守护着兄弟俩留下的荣誉与专利，将首飞精神亲手传递给新一代的航空工程师，直到1948年那个冬天，他在仰望一生的天空下，安静地走完了与飞行纠缠的一生\n\n### 📍 重要地点：莱特自行车行（“莱特循环公司”）\n- **时间**：公元1892年 - 约1908年\n- **停留时间**：主要营业场所\n- **地点**：美国俄亥俄州代顿市西三街\n- **事件**：兄弟俩开设自行车销售与修理店，后来自行生产“莱特”牌自行车。自行车生意为他们提供了稳定的收入，并成为他们进行航空实验的机械加工车间和资金来源。\n- **意义**：航空事业的物质基础和工程实践基地，许多飞行器的部件在此制造。\n\n### 📍 重要地点：基蒂霍克试验场（首次飞行地）\n- **时间**：公元1900年、1901年、1902年、1903年\n- **停留时间**：每年秋季前往，持续数周\n- **地点**：美国北卡罗来纳州基蒂霍克（杀魔山）\n- **事件**：1900-1902年进行滑翔机飞行试验，验证了他们的飞行控制理论。1903年12月17日，驾驶“飞行者一号”完成了四次成功的动力飞行，最长一次持续了59秒，飞行距离约260米。\n- **意义**：从童年记忆到晚年归处，里奇曼始终是奥维尔生命的锚点。这里不仅见证了他与兄长合伙经营印刷所、自行车铺的起步岁月，更成为航空事业从家庭作坊走向产业化的精神根基。晚年的奥维尔在此回望一生，那些飞翔的梦想与失落，都化作了对这片土地深沉的眷恋\n- **名篇名句**：无特定名篇名句记载。\n\n### 📍 重要地点：霍夫曼草原（公开飞行演示）\n- **时间**：公元1904年 - 1905年\n- **停留时间**：多次前往进行试飞\n- **地点**：美国俄亥俄州霍夫曼草原（Huffman Prairie）\n- **事件**：在此进行了数百次飞行试验，对飞机进行重大改进。1905年，“飞行者三号”实现了完全可控的持续飞行，最长一次超过30分钟（一说39分钟），标志着飞机成为一种实用的交通工具。\n- **意义**：飞机从实验品走向实用化的关键地点。\n\n### 📍 重要地点：华盛顿特区（政府演示与专利斗争）\n- **时间**：公元1908年、1909年\n- **停留时间**：数次短期停留\n- **地点**：美国华盛顿特区\n- **事件**：1908年，奥维尔在美国陆军面前进行飞行演示，以争取军方合同。同时，与格伦·柯蒂斯等竞争者的专利纠纷在此进入法律程序。\n- **意义**：获得官方认可和商业合同的重要舞台，也是航空知识产权斗争的中心。\n\n### 📍 重要地点：勒芒（欧洲首飞与轰动）\n- **时间**：公元1908年8月 - 12月\n- **停留时间**：约4个月\n- **地点**：法国勒芒（Le Mans）\n- **事件**：威尔伯在此驾驶“莱特A型”飞机进行了震惊欧洲的公开飞行表演，打破了欧洲人对飞行纪录的怀疑，引发了欧洲的航空热潮。\n- **意义**：莱特兄弟的技术在欧洲获得无可争议的认可，奠定了其世界性声誉。\n- **名篇名句**：无特定名篇名句记载。\n\n### 📍 重要地点：柏林（欧洲巡回演示）\n- **时间**：公元1909年9月\n- **停留时间**：约1个月\n- **地点**：德国柏林（Berlin）\n- **事件**：在柏林坦佩尔霍夫进行飞行表演，吸引了包括德皇威廉二世在内的数十万观众，再次轰动欧洲。\n- **意义**：航空热潮席卷欧洲的又一高峰，进一步巩固了莱特兄弟的国际地位。\n\n### 📍 重要地点：代顿市（商业公司与晚年）\n- **时间**：公元1909年 - 1948年\n- **停留时间**：晚年主要居住地\n- **地点**：美国俄亥俄州代顿市\n- **事件**：1909年，兄弟俩成立了“莱特公司”，开始商业生产飞机。威尔伯于1912年在此地因伤寒早逝。奥维尔继续经营公司，并积极参与航空标准制定和法律诉讼，直至1948年去世。\n- **意义**：航空事业商业化和传承的基地，也是奥维尔的终老之地。\n\n### 🔴 去世地：代顿市\n- **时间**：公元1948年1月30日\n- **停留时间**：晚年长期居住\n- **地点**：美国俄亥俄州代顿市\n- **事件**：因心脏病发作在家中去世，葬于代顿市伍德兰公墓（坐标：39.7508, -84.1753）。\n- **意义**：一代航空先驱的终点，其遗产（包括飞机原型）被收藏于史密森尼学会等地，激励后世。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1871 | 代顿市 | 美国俄亥俄州代顿市 | （年龄：0）出生于美国俄亥俄州代顿市。 |\n| 1878 |  |  | （年龄：7）父亲赠送能飞的玩具，激发飞行兴趣。（注：具体时间及玩具类型存疑） |\n| 1892 | 代顿市 | 美国俄亥俄州代顿市 | （年龄：21）与哥哥威尔伯在代顿市开设“莱特循环公司”。 |\n| 1899 |  |  | （年龄：28）开始系统研究飞行，设计并测试双翼风筝，验证机翼扭曲控制原理。 |\n| 1900 | 基蒂霍克试验场（首次飞行地） | 美国北卡罗来纳州基蒂霍克 | （年龄：29）首次前往北卡罗来纳州基蒂霍克（杀魔山），测试载人滑翔机。 |\n| 1902 |  |  | （年龄：31）在基蒂霍克成功试飞新型滑翔机，完善了三轴控制系统。 |\n| 1903 |  |  | （年龄：32）12月17日，在基蒂霍克完成人类首次可控动力飞行。 |\n| 1905 | 霍夫曼草原（公开飞行演示） | 美国俄亥俄州霍夫曼草原 | （年龄：34）在霍夫曼草原驾驶“飞行者三号”实现完全实用的持续飞行。 |\n| 1908 | 勒芒（欧洲首飞与轰动） | 法国勒芒 | （年龄：37）威尔伯在法国勒芒、奥维尔在美国华盛顿进行轰动世界的公开飞行演示。 |\n| 1909 |  |  | （年龄：38）成立“莱特公司”；在欧洲多国巡回表演；获美国陆军首批飞机合同。 |\n| 1912 | 代顿市 | 美国俄亥俄州代顿市 | （年龄：41）哥哥威尔伯在代顿市因伤寒去世。 |\n| 1948 | 代顿市 | 美国俄亥俄州代顿市 | （年龄：76）在代顿市家中逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：通常不涉及具体文学作品，但其**飞行探索精神**常作为科技类记叙文或人物传记的素材。\n- 核心要点：\n    - **重点**：**科学精神**——莱特兄弟的成功是**系统性实验**、**严谨记录**和**工程迭代**的典范，区别于单纯的冒险。\n    - **重点**：**创新方法**——从**仿生学**（观察鸟类）入手，结合**空气动力学**原理，体现了跨学科解决问题的能力。\n    - **协作与坚持**：兄弟二人的**密切合作**与面对多次失败和外界质疑时的**坚持不懈**，是成就事业的关键。\n    - **从梦想到现实**：将人类古老的**飞行梦想**转化为**可重复、可控制**的工程技术，标志着现代科技对自然的征服。\n    - **影响与遗产**：他们的发明不仅是一项技术突破，更**彻底改变了**人类的交通、战争、交流方式，重塑了20世纪的世界格局。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1903年12月17日**，莱特兄弟在**北卡罗来纳州基蒂霍克（杀魔山）**成功进行了**首次可控的动力飞行**，这是公认的现代航空史起点。\n    - **工业革命延伸**：飞机的发明是**第二次工业革命**的巅峰成就之一，是内燃机、轻质材料和精密机械技术结合的产物。\n    - **专利与商业**：莱特兄弟积极申请**飞机控制专利**，并与竞争对手（如格伦·柯蒂斯）进行了长期的法律斗争，反映了**知识产权**在现代工业中的重要性。\n    - **军事应用开端**：飞机很快被应用于**第一次世界大战**，从侦察发展到空战，彻底改变了战争形态。\n- 核心要点：\n    - **重点**：**时代背景**：19世纪末20世纪初，科技发明层出不穷，人类对突破自然限制充满热情，航空是当时最前沿的挑战之一。\n    - **重点**：**个人与时代**：莱特兄弟是**自学成才**的工程师，他们的成功证明了在**电气时代**，系统的科学方法比单纯的理论知识更能推动实用技术的突破。\n    - **重点**：**历史地位**：莱特兄弟被公认为**“飞机之父”**，他们的工作直接开启了**航空时代**，是人类交通史上的里程碑式人物。\n    - **全球影响**：飞行技术的传播迅速超越国界，促进了**全球化**进程，缩短了地理距离，对20世纪的**经济、文化、政治**交流产生了不可估量的影响。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 美国俄亥俄州代顿市 | 39.7589 | -84.1916 |\n| 美国北卡罗来纳州基蒂霍克（杀魔山） | 36.0175 | -75.6675 |\n| 美国俄亥俄州霍夫曼草原 | 39.8083 | -84.0621 |\n| 法国勒芒 | 47.9960 | 0.1980 |\n| 德国柏林 | 52.5200 | 13.4050 |\n| 美国华盛顿特区 | 38.9072 | -77.0369 |\n| 美国印第安纳州里奇曼市 | 39.8289 | -84.8902 |\n| 美国俄亥俄州代顿市伍德兰公墓 | 39.7508 | -84.1753 |", "relatedGraph": {"center": {"id": 99, "name": "奥维尔·莱特", "file": "奥维尔·莱特.html", "dynasty": "19世纪末至20世纪中叶（美国）", "birth_year": 1871, "death_year": 1948, "time_year": 1891, "quote": "莱特循环公司", "review": "", "aliases": [], "foreign_name": "Orville Wright", "domain_tags": [], "main_role_band": "science", "main_role_label": "发明家", "birthplace": "美国俄亥俄州代顿市", "birthplace_raw": "美国俄亥俄州代顿市", "birthplace_modern": "", "birth_lat_wgs84": 39.7589, "birth_lng_wgs84": -84.1916, "birth_lat": 39.7589, "birth_lng": -84.1916, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["奥维尔·莱特", "Orville Wright", "Orville", "Wright"], "search_tokens": ["奥维尔莱特", "orvillewright", "orville", "wright", "aoweierlaite", "awelt"], "search_pinyin": ["aoweierlaite", "awelt"], "is_foreign": 1, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "i
