.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《岳阳楼记》**、**《渔家傲·秋思》**、《苏幕遮·怀旧》\n- 核心要点：\n    - **重点**：**《岳阳楼记》** 提出“先天下之忧而忧，后天下之乐而乐”的政治理想，成为千古名句，体现了作者崇高的**忧乐观**。\n    - **重点**：**《渔家傲·秋思》** 是边塞词名作，通过“浊酒一杯家万里”等意象，抒写了戍边将士的**思乡之情**与**报国之志**的矛盾，风格**苍凉悲壮**。\n    - **《岳阳楼记》** 运用**骈散结合**的句式，通过描绘洞庭湖的**阴晴景象**，引出“古仁人之心”的讨论，**借景抒情**，**议论精辟**。\n    - **重点**：**《岳阳楼记》** 中“不以物喜，不以己悲”体现了**豁达胸襟**，与“先忧后乐”思想共同构成了其人格精神的核心。\n    - **《渔家傲·秋思》** 中“千嶂里，长烟落日孤城闭”勾勒出边塞**苍凉荒僻**的景象，为抒情铺垫。\n    - **《苏幕遮·怀旧》** 中“明月楼高休独倚，酒入愁肠，化作相思泪”抒发了**羁旅乡愁**，情感深挚。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：北宋仁宗时期，与韩琦共同主持西北边防，有效抵御**西夏**进攻，时称“韩范”。\n    - **庆历新政**：公元1043年，任参知政事期间主导改革，核心内容包括**整顿吏治**、改革科举、发展农业、加强军备等。\n    - **重点**：**庆历新政**因触犯保守派官僚利益，遭到强烈反对，历时仅一年余即告失败，范仲淹被贬出朝。\n    - **重点**：创办**范氏义庄**，救济族人，开创中国非宗教性民间慈善组织先河。\n- 核心要点：\n    - **重点**：范仲淹是北宋**士大夫精神**的典范，其“先忧后乐”思想将儒家**以天下为己任**的入世情怀推向高峰。\n    - 他既是**文学家**，也是**实干家**，在政治、军事、教育、地方治理上均有建树，体现了**文武兼备**的才能。\n    - **重点**：**庆历新政**是北宋中期社会矛盾激化的产物，虽失败，但为后来的**王安石变法**提供了经验和舆论准备。\n    - 其一生**宦海沉浮**，因直言进谏多次被贬，但始终坚守**气节**，清廉自守，被后世尊为“本朝人物第一”。\n    - **重点**：范仲淹的**军事思想**（如“屯田久守”）和**改革主张**（如“精贡举”）对当时及后世产生了深远影响。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《岳阳楼记》**、**《渔家傲·秋思》**、《苏幕遮·怀旧》\n- 核心要点：\n    - **重点**：**《岳阳楼记》** 提出“先天下之忧而忧，后天下之乐而乐”的政治理想，成为千古名句，体现了作者崇高的**忧乐观**。\n    - **重点**：**《渔家傲·秋思》** 是边塞词名作，通过“浊酒一杯家万里”等意象，抒写了戍边将士的**思乡之情**与**报国之志**的矛盾，风格**苍凉悲壮**。\n    - **《岳阳楼记》** 运用**骈散结合**的句式，通过描绘洞庭湖的**阴晴景象**，引出“古仁人之心”的讨论，**借景抒情**，**议论精辟**。\n    - **重点**：**《岳阳楼记》** 中“不以物喜，不以己悲”体现了**豁达胸襟**，与“先忧后乐”思想共同构成了其人格精神的核心。\n    - **《渔家傲·秋思》** 中“千嶂里，长烟落日孤城闭”勾勒出边塞**苍凉荒僻**的景象，为抒情铺垫。\n    - **《苏幕遮·怀旧》** 中“明月楼高休独倚，酒入愁肠，化作相思泪”抒发了**羁旅乡愁**，情感深挚。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：北宋仁宗时期，与韩琦共同主持西北边防，有效抵御**西夏**进攻，时称“韩范”。\n    - **庆历新政**：公元1043年，任参知政事期间主导改革，核心内容包括**整顿吏治**、改革科举、发展农业、加强军备等。\n    - **重点**：**庆历新政**因触犯保守派官僚利益，遭到强烈反对，历时仅一年余即告失败，范仲淹被贬出朝。\n    - **重点**：创办**范氏义庄**，救济族人，开创中国非宗教性民间慈善组织先河。\n- 核心要点：\n    - **重点**：范仲淹 ，但为后来的王安石变法提供了范本。晚年外放地方，病逝于赴任途中。他一生践行儒家理想，其“先天下之忧而忧，后天下之乐而乐”的思想成为后世士大夫的精神标杆。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：一生宦游，足迹北至边塞（今陕西省北部，如延安市），南抵故乡（今江苏），西达关中（今陕西省中部，如咸阳市彬州市），东临海滨（如山东省滨州市），主要活动于北宋核心区域。\n- ⏱️ **时间跨度**：公元989年—1052年，共约64年。\n- 📍 **地理范围**：大致覆盖今山东、江苏、河南、陕西、浙江、安徽等省。\n- 🌟 **重要节点数量**：12个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：徐州\n- **时间**：公元989年（存疑）\n- **停留时间**：约2年\n- **地点**：徐州武宁军节度掌书记官舍（今江苏省徐州市）\n- **事件**：父范墉时任武宁军节度掌书记，范仲淹生于徐州官舍。（另有说法称生于真定府，待考）父早逝后，母谢氏改嫁长山朱文翰，范仲淹遂随母迁居淄州长山县（今山东邹平），改名朱说。\n- **意义**：范仲淹两岁丧父，随母改嫁朱氏，寄身长山醴泉寺寒窑苦读。\"划粥断齑\"的清贫岁月反复锤打着孤儿意志，这段冷暖自知的少年时光，悄然铸就了\"先忧后乐\"人格的最初底色\n\n### 📍 重要地点：应天府\n- **时间**：公元1011年—1015年\n- **停留时间**：约4年\n- **地点**：应天府（今河南省商丘市）\n- **事件**：进入应天府书院（南都学舍）刻苦攻读，“断齑画粥”的故事即源于此。大中祥符八年（1015年）及第，授广德军司理参军，迎母归养，恢复本姓。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点\n- **名篇名句**：《睢阳学舍书怀》：“瓢思颜子心还乐，琴遇钟君恨即销。”\n\n### 📍 重要地点：泰州\n- **时间**：约公元1021年—1024年\n- **停留时间**：约3年\n- **地点**：泰州（今江苏省泰州市）\n- **事件**：任泰州西溪盐仓监，主持修建捍海堰，后世称“范公堤”，惠及盐场与农田。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点\n\n### 📍 重要地点：开封府\n- **时间**：公元1028年—1029年；公元1033年—1036年\n- **停留时间**：累计约3年\n- **地点**：开封府（今河南省开封市）\n- **事件**：首次任秘阁校理；后任右司谏。因谏止仁宗率百官为刘太后贺寿，并上疏请太后还政，被贬为河中府通判。明道二年（1033年）回京任右司谏，又因谏阻废郭皇后，被贬知睦州（后改知饶州）。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点品格，也开启了其贬谪生涯。\n- **名篇名句**：《出守桐庐道中十绝》（其一）：“素心爱云水，此日东南行。”\n\n### 📍 重要地点：润州\n- **时间**：公元1037年—1038年\n- **停留时间**：约1年\n- **地点**：润州（今江苏省镇江市）\n- **事件**：因“废后之争”被贬知睦州后，改知苏州，因治水有功，调任润州。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点\n\n### 📍 重要地点：延州\n- **时间**：公元1040年—1041年\n- **停留时间**：约2年\n- **地点**：延州（今陕西省延安市）\n- **事件**：西夏元昊叛乱，范仲淹与韩琦并为陕西经略安抚副使，主持西北防务。他采取“屯田久守”策略，修筑城寨，提拔狄青、种世衡等将领，稳固了宋夏边境。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点\n- **名篇名句**：《渔家傲·秋思》：“浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。”\n\n### 📍 重要地点：邠州\n- **时间**：公元1043年\n- **停留时间**：数月\n- **地点**：邠州（今陕西省咸阳市彬州市）\n- **事件**：在西北前线，被召还朝，任枢密副使，旋即升任参知政事，主持“庆历新政”。\n- **意义**：庆历新政失败、屡经贬谪后，范仲淹已入暮年，应天府最后一任仍勤勉如初。他扶病理事、鞠躬尽瘁，将\"居庙堂之高则忧其民\"的信条贯穿到生命的最后，于将熄的烛火中仍燃着对苍生的不灭牵挂\n\n### 📍 重要地点：开封府（新政中心）\n- **时间**：公元1043年—1045年\n- **停留时间**：约2年\n- **地点**：开封府（今河南省开封市）\n- **事件**：任参知政事，上《答手诏条陈十事》，提出明黜陟、抑侥幸、精贡举、择官长等十项改革主张，史称“庆历新政”。因改革触动贵族官僚利益，遭遇强烈反对，最终失败，被罢相。\n- **意义**：北宋中期第一次有组织的政治改革尝试，虽败犹荣，为后世改革留下宝贵经验。\n\n### 📍 重要地点：邓州\n- **时间**：公元1046年—1049年\n- **停留时间**：约3年\n- **地点**：邓州（今河南省邓州市）\n- **事件**：新政失败后，自请外放，出知邓州。在此期间，应好友滕子京之请，写下千古名篇《岳阳楼记》。\n- **意义**：在应天书院苦读六载，写下震动学林的《粥论》，得晏殊激赏执掌教席，更于此金榜题名——这座书院，是他从寒门学子迈向庙堂清流的真正起点\n- **名篇名句**：《岳阳楼记》：“先天下之忧而忧，后天下之乐而乐。”\n\n### 📍 重要地点：杭州\n- **时间**：公元1049年—1051年\n- **停留时间**：约2年\n- **地点**：杭州（今浙江省杭州市）\n- **事件**：知杭州期间，遭遇饥荒。他采取以工代赈、兴修水利、鼓励举办龙舟赛事等措施，成功救灾并促进经济。\n- **意义**：庆历新政失败、屡经贬谪后，范仲淹已入暮年，应天府最后一任仍勤勉如初。他扶病理事、鞠躬尽瘁，将\"居庙堂之高则忧其民\"的信条贯穿到生命的最后，于将熄的烛火中仍燃着对苍生的不灭牵挂\n\n### 📍 重要地点：青州\n- **时间**：公元1051年—1052年\n- **停留时间**：约1年\n- **地点**：青州（今山东省潍坊市青州市）\n- **事件**：调任知青州，此时已病重。\n- **意义**：庆历新政黯然落幕后，范仲淹拖着病骨再启赴任之途，旧驿风沙吹满衣襟，孤灯残卷陪伴长途——那份对苍生沉甸甸的牵挂，他至死不肯卸下行囊\n\n### 🔴 去世地：徐州\n- **时间**：公元1052年\n- **停留时间**：途中病逝\n- **地点**：徐州（今江苏省徐州市）\n- **事件**：在赴任颍州途中，病逝于徐州。\n- **意义**：生命终点，朝廷赠兵部尚书，谥号“文正”，葬于洛阳（今河南省洛阳市伊川县）。其一生清廉，遗产仅“清风”而已。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 989年 | 徐州 | 江苏省徐州市 | （年龄：0岁）生于徐州武宁军节度掌书记官舍（存疑，另有真定府一说），父早逝后随母迁居淄州长山县。 |\n| 1011年 | 应天府 | 河南省商丘市 | （年龄：22岁）入读应天府书院，刻苦求学。 |\n| 1015年 |  |  | （年龄：26岁）进士及第，授广德军司理参军，复范姓。 |\n| 1021年 | 泰州 | 江苏省泰州市 | （年龄：32岁）任泰州西溪盐仓监，建议并主持修筑范公堤。 |\n| 1028年 |  |  | （年龄：39岁）任秘阁校理，因谏太后还政被贬河中府。 |\n| 1036年 |  |  | （年龄：47岁）因“废后之争”被贬，出知睦州（后改知饶州）。 |\n| 1040年 |  |  | （年龄：51岁）任陕西经略安抚副使，主持西北军务，改革边防。 |\n| 1043年 |  |  | （年龄：54岁）任参知政事，主持推行“庆历新政”。 |\n| 1045年 | 邠州 | 陕西省咸阳市彬州市 | （年龄：56岁）新政失败，罢相，出知邠州（今陕西省咸阳市彬州市），后改知邓州。 |\n| 1046年 | 邓州 | 河南省邓州市 | （年龄：57岁）知邓州，应滕子京之请撰写《岳阳楼记》。 |\n| 1049年 | 杭州 | 浙江省杭州市 | （年龄：60岁）知杭州，以工代赈救灾。 |\n| 1052年 | 徐州 | 江苏省徐州市 | （年龄：64岁）病逝于赴任颍州途中的徐州，谥“文正”。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《岳阳楼记》**、**《渔家傲·秋思》**、《苏幕遮·怀旧》\n- 核心要点：\n    - **重点**：**《岳阳楼记》** 提出“先天下之忧而忧，后天下之乐而乐”的政治理想，成为千古名句，体现了作者崇高的**忧乐观**。\n    - **重点**：**《渔家傲·秋思》** 是边塞词名作，通过“浊酒一杯家万里”等意象，抒写了戍边将士的**思乡之情**与**报国之志**的矛盾，风格**苍凉悲壮**。\n    - **《岳阳楼记》** 运用**骈散结合**的句式，通过描绘洞庭湖的**阴晴景象**，引出“古仁人之心”的讨论，**借景抒情**，**议论精辟**。\n    - **重点**：**《岳阳楼记》** 中“不以物喜，不以己悲”体现了**豁达胸襟**，与“先忧后乐”思想共同构成了其人格精神的核心。\n    - **《渔家傲·秋思》** 中“千嶂里，长烟落日孤城闭”勾勒出边塞**苍凉荒僻**的景象，为抒情铺垫。\n    - **《苏幕遮·怀旧》** 中“明月楼高休独倚，酒入愁肠，化作相思泪”抒发了**羁旅乡愁**，情感深挚。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：北宋仁宗时期，与韩琦共同主持西北边防，有效抵御**西夏**进攻，时称“韩范”。\n    - **庆历新政**：公元1043年，任参知政事期间主导改革，核心内容包括**整顿吏治**、改革科举、发展农业、加强军备等。\n    - **重点**：**庆历新政**因触犯保守派官僚利益，遭到强烈反对，历时仅一年余即告失败，范仲淹被贬出朝。\n    - **重点**：创办**范氏义庄**，救济族人，开创中国非宗教性民间慈善组织先河。\n- 核心要点：\n    - **重点**：范仲淹是北宋**士大夫精神**的典范，其“先忧后乐”思想将儒家**以天下为己任**的入世情怀推向高峰。\n    - 他既是**文学家**，也是**实干家**，在政治、军事、教育、地方治理上均有建树，体现了**文武兼备**的才能。\n    - **重点**：**庆历新政**是北宋中期社会矛盾激化的产物，虽失败，但为后来的**王安石变法**提供了经验和舆论准备。\n    - 其一生**宦海沉浮**，因直言进谏多次被贬，但始终坚守**气节**，清廉自守，被后世尊为“本朝人物第一”。\n    - **重点**：范仲淹的**军事思想**（如“屯田久守”）和**改革主张**（如“精贡举”）对当时及后世产生了深远影响。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 江苏省徐州市 | 34.2044 | 117.2859 |\n| 河北省石家庄市正定县 | 38.1489 | 114.5696 |\n| 河南省商丘市 | 34.4146 | 115.6567 |\n| 江苏省泰州市 | 32.4849 | 119.9152 |\n| 河南省开封市 | 34.7971 | 114.3075 |\n| 江苏省镇江市 | 32.1896 | 119.4253 |\n| 陕西省延安市 | 36.5854 | 109.4898 |\n| 陕西省咸阳市彬州市 | 35.0431 | 108.0817 |\n| 河南省邓州市 | 32.6878 | 112.0871 |\n| 浙江省杭州市 | 30.2741 | 120.1551 |\n| 山东省潍坊市青州市 | 36.6846 | 118.4796 |\n| 江苏省徐州市 | 34.2044 | 117.2859 |\n| 河南省洛阳市伊川县（范仲淹墓） | 34.4900 | 112.5100 |", "relatedGraph": {"center": {"id": 378, "name": "范仲淹", "file": "范仲淹.html", "dynasty": "北宋", "birth_year": 989, "death_year": 1052, "time_year": 1020, "quote": "先天下之忧而忧，后天下之乐而乐", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "政治家", "birthplace": "今河北省石家庄市正定县", "birthplace_raw": "今河北省石家庄市正定县", "birthplace_modern": "", "birth_lat_wgs84": 38.1489, "birth_lng_wgs84": 114.5696, "birth_lat": 38.1489, "birth_lng": 114.5696, "birth_coord_system": "WGS84",
