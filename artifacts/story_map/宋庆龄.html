.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

反孙中山的革命原则和政策的声明》，与国民党决裂；", "quotes": ["事件：发表《为抗议违反孙中山的革命原则和政策的声明》，与国民党决裂；", "我将踏着革命者的足迹继续前进……我在这条道路上决不回头。", "支持中国民权保障同盟。"], "quote_policy": "preferred"}, "儿童时代": {"title": "儿童时代", "aliases": [], "authors": ["宋庆龄"], "related_people": ["宋庆龄"], "source_pages": ["宋庆龄"], "era": "近现代", "genre": "", "one_liner": "儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。", "summary": "儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。", "quote": "《儿童时代》题词：“儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。", "quotes": ["《儿童时代》题词：“儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。", "《为抗议违反孙中山的革命原则和政策的声明》（节选）、《儿童时代》题词。", "儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。"], "quote_policy": "preferred"}}, "markdown": "# 宋庆龄\n\n## 人物档案\n\n### 基本信息\n- **姓名**：宋庆龄\n- **时代**：近现代\n- **出生**：公元1893年1月27日，上海（今上海市）\n- **去世**：公元1981年5月29日，北京（今北京市）\n- **享年**：88周岁（虚岁89岁）\n- **主要身份**：政治家、社会活动家、爱国主义者、国际和平战士\n- **历史地位**：伟大的爱国主义、民主主义、国际主义和共产主义战士，举世闻名的二十世纪伟大女性。\n- **主要成就**：\n    - 坚定维护孙中山的革命原则与新三民主义。\n    - 长期致力于抗日救亡与人民解放事业，创建保卫中国同盟。\n    - 为新中国的建立和建设，以及妇女儿童福利事业作出卓越贡献。\n    - 积极参与国际和平运动，荣获“加强国际和平”斯大林国际奖。\n\n### 生平概述\n宋庆龄出生于上海的牧师兼实业家宋耀如家庭，早年赴美接受教育。1915年她不顾家庭反对，与孙中山在日本结婚，成为其亲密战友和助手。孙中山逝世后，她坚决捍卫“联俄、联共、扶助农工”三大政策，与国民党右派决裂。抗日战争期间，她创建保卫中国同盟，为敌后战场募集大量物资。新中国成立后，她担任国家重要领导职务，将毕生精力献给了中国人民的解放事业、社会主义建设事业以及世界和平与人类进步事业。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从上海出发，足迹遍及日本、广州、武汉、重庆、香港及北京等地，后期多次出访海外。\n- ⏱️ **时间跨度**：1893年至1981年，共计约88年。\n- 📍 **地理范围**：主要覆盖中国华东、华南、华中、西南及华北地区，以及日本、欧洲、北美等地。\n- 🌟 **重要节点数量**：核心地点9个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：上海\n- **时间**：1893年\n- **停留时间**：童年及青少年时期（约14年）\n- **地点**：上海（今上海市）\n- **事件**：出生于一个接受西方教育的富裕家庭，在上海中西女塾读书。\n- **意义**：接受了最初的中西文化启蒙教育，为其后来赴美留学和形成进步思想奠定基础。\n\n### 📍 重要地点：美国（梅肯、波士顿等）\n- **时间**：1907年 - 1913年\n- **停留时间**：约6年\n- **地点**：美国佐治亚州梅肯市（今美国佐治亚州梅肯市）等\n- **事件**：进入威斯里安女子学院学习，主修文学与哲学。\n- **意义**：系统接受西方现代教育，密切关注祖国局势，在校刊上发表文章表达对祖国进步的向往。\n\n### 📍 重要地点：日本（东京）\n- **时间**：1914年 - 1915年\n- **停留时间**：约1年\n- **地点**：日本东京（今日本东京都）\n- **事件**：接替宋霭龄担任孙中山的英文秘书，1915年10月25日与孙中山结婚。成为孙中山革命事业的亲密伴侣和得力助手，协助处理大量机要通讯工作。\n- **意义**：人生轨迹发生根本性转变，从此坚定地投身于中国的民主革命事业。\n\n### 📍 重要地点：广州\n- **时间**：1917年、1923年-1924年等多次\n- **停留时间**：累计数年\n- **地点**：广州（今广东省广州市）\n- **事件**：随孙中山南下护法，参与筹备国民党一大，支持国共合作。\n- **意义**：见证了孙中山晚年革命思想的转变与“联俄、联共、扶助农工”三大政策的形成与确立。\n- **名篇名句**：《关于〈抗议违反孙中山的革命原则和政策的声明〉》：孙中山的三民主义与三大政策是“解决中国问题的唯一途径”。\n\n### 📍 重要地点：武汉\n- **时间**：1926年底 - 1927年\n- **停留时间**：约半年\n- **地点**：武汉（今湖北省武汉市）\n- **事件**：在国民政府迁都武汉后，与国民党左派及共产党人合作，坚持革命立场。参与发表《讨蒋通电》等抗议活动（具体联名者存疑）。\n- **意义**：战时她以早年留美积累的人脉为桥，奔走太平洋两岸发起国际募捐，将抗战真相送达白宫与国会，与战时首都的救济与统战相呼应，为统一战线争取最广泛的国际同情与援助\n\n### 📍 重要地点：上海（莫利爱路寓所）\n- **时间**：1927年 - 1937年\n- **停留时间**：约10年\n- **地点**：上海法租界莫利爱路29号（今上海市香山路7号孙中山故居）\n- **事件**：发表《为抗议违反孙中山的革命原则和政策的声明》，与国民党决裂；营救进步人士；支持中国民权保障同盟。\n- **意义**：在白色恐怖中独立高举孙中山的革命旗帜，成为国民党统治区内重要的民主与正义象征。\n- **名篇名句**：《为抗议违反孙中山的革命原则和政策的声明》：“我将踏着革命者的足迹继续前进……我在这条道路上决不回头。”\n\n### 📍 重要地点：苏联及欧洲\n- **时间**：1927年底 - 1928年\n- **停留时间**：约数月\n- **地点**：苏联莫斯科（今俄罗斯莫斯科）等地\n- **事件**：出访苏联及欧洲，寻求国际支持并考察社会。\n- **意义**：战时她以早年留美积累的人脉为桥，奔走太平洋两岸发起国际募捐，将抗战真相送达白宫与国会，与战时首都的救济与统战相呼应，为统一战线争取最广泛的国际同情与援助\n\n### 📍 重要地点：香港\n- **时间**：1938年 - 1941年\n- **停留时间**：约3年\n- **地点**：香港（今香港特别行政区）\n- **事件**：创建“保卫中国同盟”（“保盟”），任中央委员会主席。\n- **意义**：以此为基地，向国际社会宣传中国抗战真相，募集大量药品、物资和资金，重点支援中共领导的抗日根据地。\n\n### 📍 重要地点：重庆\n- **时间**：1941年底 - 1945年\n- **停留时间**：约4年\n- **地点**：重庆（今重庆市）\n- **事件**：太平洋战争爆发后由港抵渝，继续领导“保盟”工作，坚持团结抗战。\n- **意义**：战时她以早年留美积累的人脉为桥，奔走太平洋两岸发起国际募捐，将抗战真相送达白宫与国会，与战时首都的救济与统战相呼应，为统一战线争取最广泛的国际同情与援助时首都坚持开展救济与统战工作，维护国共合作抗日的大局。\n\n### 📍 重要地点：北京（建国后居所）\n- **时间**：1949年 - 1981年\n- **停留时间**：32年\n- **地点**：北京（今北京市）\n- **事件**：参加新政协筹备，当选中央人民政府副主席；后任国家副主席、名誉主席等职；投身社会主义建设与世界和平运动。\n- **意义**：作为国家重要领导人，参与缔造和建设新中国，致力于妇女儿童福利、文化教育及国际友好交流事业。\n- **名篇名句**：《儿童时代》题词：“儿童是我们的未来，是我们的希望，我们要把最宝贵的东西给予儿童。”\n\n### 🔴 去世地：北京\n- **时间**：1981年5月29日\n- **停留时间**：长期居住直至逝世\n- **地点**：北京（今北京市）\n- **事件**：因病在北京寓所逝世，被追授“中华人民共和国名誉主席”称号。\n- **意义**：走完了伟大、光荣的一生，安葬于上海万国公墓（今宋庆龄陵园）。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1893 | 上海 | 上海市 | （年龄：0岁）出生于上海。 |\n| 1907 | 美国（梅肯、波士顿等） | 美国佐治亚州梅肯市 | （年龄：14岁）赴美国留学。 |\n| 1913 | 日本（东京） | 日本东京都 | （年龄：20岁）学成归国，途中在日本短暂拜访孙中山。 |\n| 1915 | 日本（东京） | 日本东京都 | （年龄：22岁）与孙中山在日本结婚。 |\n| 1922 |  |  | （年龄：29岁）陈炯明叛变时，掩护孙中山撤离。 |\n| 1925 |  |  | （年龄：32岁）孙中山逝世，继承其遗志。 |\n| 1927 | 苏联及欧洲 | 俄罗斯莫斯科 | （年龄：34岁）发表声明抗议国民党右派，与蒋介石、汪精卫集团决裂；出访苏联及欧洲。 |\n| 1932 |  |  | （年龄：39岁）与蔡元培等发起成立中国民权保障同盟。 |\n| 1938 | 香港 | 香港特别行政区 | （年龄：45岁）在香港创建保卫中国同盟。 |\n| 1949 |  |  | （年龄：56岁）当选中央人民政府副主席。 |\n| 1951 |  |  | （年龄：58岁）获“加强国际和平”斯大林国际奖。 |\n| 1981 | 北京 | 北京市 | （年龄：88周岁（虚岁89岁））加入中国共产党；被授予中华人民共和国名誉主席称号；在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n\n### 语文（课文/词作）\n- 课文/词作：**《为抗议违反孙中山的革命原则和政策的声明》**（节选）、**《儿童时代》题词**。\n- 核心要点：\n    - **重点**：文章体现了宋庆龄**坚定捍卫孙中山新三民主义**和三大政策的革命原则。\n    - **重点**：其宣言与书信具有强烈的**政论性**与**战斗性**，语言犀利，逻辑严密。\n    - **重点**：作品中贯穿着深沉的**爱国主义**情怀与对人民命运的深切关怀。\n    - 文风**庄重典雅**，情感**真挚坚定**，展现了其作为政治家的远见与作为女性的坚韧。\n    - 常引用**孙中山遗训**作为理论武器，增强文章的说服力与历史厚重感。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：作为**孙中山**的夫人与战友，在孙中山逝世后成为其革命事业和政治遗产的重要捍卫者与阐释者。\n    - **重点**：抗日战争时期领导**保卫中国同盟**，成为连接国际反法西斯力量与中国抗战（尤其是敌后战场）的关键桥梁。\n    - 1949年出席**中国人民政治协商会议第一届全体会议**，参与新中国建国大业。\n- 核心要点：\n    - **重点**：其一生是**中国近现代革命史**的缩影，从旧民主主义革命走向新民主主义革命和社会主义革命。\n    - **重点**：她是**中国共产党**的亲密朋友，是**统一战线**工作的杰出典范。\n    - **重点**：在国际上享有崇高声誉，是**世界和平运动**的重要领袖之一。\n    - 她的立场与选择，体现了**爱国主义**精神超越党派与家族利益的至高境界。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 美国佐治亚州梅肯市 | 32.8407 | -83.6324 |\n| 俄罗斯莫斯科 | 55.7558 | 37.6173 |\n| 日本东京都 | 35.6762 | 139.6503 |\n| 广东省广州市 | 23.1291 | 113.2644 |\n| 湖北省武汉市 | 30.5928 | 114.3055 |\n| 上海市香山路7号（孙中山故居） | 31.2186 | 121.4681 |\n| 香港特别行政区 | 22.3193 | 114.1694 |\n| 重庆市 | 29.4316 | 106.9123 |\n| 北京市（后海北沿46号） | 39.9442 | 116.3833 |\n| 上海市宋庆龄陵园 | 31.1936 | 121.4074 |\n", "relatedGraph": {"center": {"id": 119, "name": "宋庆龄", "file": "宋庆龄.html", "dynasty": "近现代", "birth_year": 1893, "death_year": 1981, "time_year": 1946, "quote": "加强国际和平", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "政治家", "birthplace": "上海", "birthplace_raw": "上海今上海市", "birthplace_modern": "上海市", "birth_lat_wgs84": 31.2186, "birth_lng_wgs84": 121.4681, "birth_la
