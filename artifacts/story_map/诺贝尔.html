  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

842年—1850年（注：1850年离家游学，1853年返回）\n- **停留时间**：青少年时期（约8年，含后续返回）\n- **位置**：俄国圣彼得堡（今俄罗斯圣彼得堡）\n- **事迹**：随母亲和兄弟移居与父亲团聚。在家庭教师指导下学习，精通多国语言，并对化学产生浓厚兴趣。在父亲的工厂里学习机械和化学知识。1853年返回协助家族工厂参与克里米亚战争期间的军工生产。\n- **意义**：接受了全面的科学与人文教育，奠定了坚实的工程与化学基础，是其科学兴趣的摇篮。\n\n### 📍 重要地点：汉堡\n- **公元纪年**：1850年—1852年\n- **停留时间**：约2年\n- **位置**：德国汉堡\n- **事迹**：在父亲的安排下，首次独自远行，主要在此学习商业，并短暂游历欧美多国（如美国）。\n- **意义**：广袤的俄罗斯市场是诺贝尔商业版图的重要一翼，他在此设立代理机构、铺设专利网络，将炸药源源输往帝国辽阔的矿区与铁路工地，展现了超越同代人的全球化经营眼光\n\n### 📍 重要地点：巴黎\n- **公元纪年**：约1851年（首次短期游学）；1873年—1891年（主要居住期）\n- **停留时间**：首次短期游学；后期长期居住约18年\n- **位置**：法国巴黎\n- **事迹**：首次游学期间在著名化学家泰奥菲勒-朱尔·佩卢兹的私人实验室学习。后期在巴黎建立了自己的实验室和公司总部，在此进行了大量炸药研究，并度过了重要的商业与社交生涯。\n- **意义**：科学深造的关键地，也是其事业走向国际化的中心。在此地的生活塑造了他的国际主义视野。\n\n### 📍 重要地点：克里米亚半岛（今属俄罗斯/乌克兰争议地区，按当时历史背景为俄国领土）\n- **公元纪年**：1850年代中期\n- **停留时间**：约2-3年\n- **位置**：俄国克里米亚半岛（今属俄罗斯/乌克兰争议地区，按当时历史背景为俄国领土）\n- **事迹**：在克里米亚战争期间，协助父亲为俄国军队生产水雷和蒸汽机等军备，家族工厂一度繁荣。\n- **意义**：首次深度接触军工生产，积累了实践经验，也见证了家族企业的兴衰。\n\n### 📍 重要地点：克拉姆福尔斯\n- **公元纪年**：1860年代\n- **停留时间**：断续停留数年\n- **位置**：瑞典西诺尔兰省海讷桑德市克拉姆福尔斯\n- **事迹**：在此建立了自己的第一座硝化甘油炸药工厂。1864年，工厂发生严重爆炸事故，弟弟埃米尔等人遇难，此事对他打击巨大，也促使他决心研究更安全的炸药。\n- **意义**：广袤的俄罗斯市场是诺贝尔商业版图的重要一翼，他在此设立代理机构、铺设专利网络，将炸药源源输往帝国辽阔的矿区与铁路工地，展现了超越同代人的全球化经营眼光\n\n### 📍 重要地点：博福斯\n- **公元纪年**：1894年—1896年\n- **停留时间**：晚年约2年\n- **位置**：瑞典厄勒布鲁省卡尔斯库加市博福斯\n- **事迹**：收购了博福斯钢铁厂，并将其改造为现代化的炸药和军械制造中心。在此度过了生命最后的部分时光，并最终在此地（附近的别墅）起草了最终遗嘱。\n- **意义**：晚年事业的核心基地，也是其遗嘱（设立诺贝尔奖）的诞生地，具有极高的象征意义。\n\n### 📍 重要地点：美国（多地）\n- **公元纪年**：1850年代初（首次）；1860年代-1870年代（商务）\n- **停留时间**：多次短期商务旅行\n- **位置**：美国纽约州纽约市\n- **事迹**：早期游学；后期为推广其炸药专利和建立公司频繁赴美。\n- **意义**：广袤的俄罗斯市场是诺贝尔商业版图的重要一翼，他在此设立代理机构、铺设专利网络，将炸药源源输往帝国辽阔的矿区与铁路工地，展现了超越同代人的全球化经营眼光场和专利布局地，体现了其全球化的商业视野。\n\n### 🔴 去世地：圣雷莫\n- **公元纪年**：1896年12月10日\n- **停留时间**：晚年常居地（约1891年起）\n- **位置**：意大利利古里亚大区因佩里亚省圣雷莫市\n- **经过**：1896年12月10日，因脑溢血在圣雷莫的别墅逝世。\n- **意义**：生命终点。他选择在此度过晚年，部分原因是为了远离巴黎的喧嚣和复杂商业事务，专注于研究和写作。\n- **名篇名句**：无直接文学作品。其遗嘱是最重要的历史文件，核心句为：“我所留下的全部可变换为现金的财产，将以下列方式予以处理：这份资本由我的执行者投资于安全的证券方面，并将构成一种基金，其利息每年以奖金的形式，分配给那些在前一年里曾赋予人类最大利益的人。”\n\n---\n\n## 三、地点坐标\n\n| 现称 | 现代搜索地名 | 平奖是为了“洗白”其发明带来的战争灾难，但更多学者认为这反映了他真诚的忏悔与理想主义追求。\n","relatedGraph": {"center": {"id": "阿尔弗雷德·伯恩哈德·诺贝尔","name": "阿尔弗雷德·伯恩哈德·诺贝尔","file": "阿尔弗雷德·伯恩哈德·诺贝尔.html","dynasty": "19世纪（工业革命时期）","aliases": [],"birth_year": 1833,"death_year": 1896,"quote": "我所留下的全部可变换为现金的财产，将以下列方式予以处理：这份资本由我的执行者投资于安全的证券方面，并将构成一种基金，其利息每年以奖金的形式，分配给那些在前一年里曾赋予人类最大利益的人。","review": "我所留下的全部可变换为现金的财产，将以下列方式予以处理：这份资本由我的执行者投资于安全的证券方面，并将构成一种基金，其利息每年以奖金的形式，分配给那些在前一年里曾赋予人类最大利益的人。","foreign_name": "","main_role_label": "","birthplace": "瑞典斯德哥尔摩","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},"nodes": [{"id": "阿尔弗雷德·伯恩哈德·诺贝尔","name": "阿尔弗雷德·伯恩哈德·诺贝尔","file": "阿尔弗雷德·伯恩哈德·诺贝尔.html","dynasty": "19世纪（工业革命时期）","aliases": [],"birth_year": 1833,"death_year": 1896,"quote": "我所留下的全部可变换为现金的财产，将以下列方式予以处理：这份资本由我的执行者投资于安全的证券方面，并将构成一种基金，其利息每年以奖金的形式，分配给那些在前一年里曾赋予人类最大利益的人。","review": "我所留下的全部可变换为现金的财产，将以下列方式予以处理：这份资本由我的执行者投资于安全的证券方面，并将构成一种基金，其利息每年以奖金的形式，分配给那些在前一年里曾赋予人类最大利益的人。","foreign_name": "","main_role_label": "","birthplace": "瑞典斯德哥尔摩","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},{"id": "诺贝尔","name": "诺贝尔","file": "诺贝尔.html","dynasty": "19世纪（工业革命时期）","aliases": [],"birth_year": 1833,"death_year": 1896,"quote": "诺贝尔专利炸药","review": "","foreign_name": "","main_role_label": "化学家","birthplace": "瑞典斯德哥尔摩","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "宗亲","sourceType": "markdown","confidence": null,"isCenter": false},{"id": "麦克斯韦","name": "麦克斯韦","file": "麦克斯韦.html","dynasty": "19世纪（维多利亚时代）","aliases": [],"birth_year": 1831,"death_year": 1879,"quote": "麦克斯韦分布律","review": "","foreign_name": "","main_role_label": "物理学家","birthplace": "苏格兰爱丁堡","birthplace_modern": "英国苏格兰爱丁堡","domain_tags": [],"has_story": true,"relationLabel": "同时代人物","sourceType": "fallback","confidence": null,"isCenter": false},{"id": "马克思","name": "马克思","file": "马克思.html","dynasty": "19世纪","aliases": [],"birth_year": 1818
