  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

Name":"北平/北京","modernName":"北京市","lat":39.9042,"lng":116.4074,"coordSystem":"WGS84","type":"death","event":"担任政务院（国务院）总理兼外交部长，主持国家建设与外交工作；在“文革”中苦撑危局；因癌症逝世。","time":"1949年-1976年","duration":"27年","significance":"为新中国的内政外交、国防科技、文化教育等各项事业奠定了基础，其人格魅力成为国家道德的象征。","works":[],"quoteLines":[]}],"coordinateSystem":"WGS84","mapStyle":{"pathColor":"#1e40af","markers":{"normal":{"color":"#3498db"},"birth":{"color":"#2ecc71"},"death":{"color":"#e74c3c"}}},"textbookPoints":"### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---","examPoints":"### 考点\n### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---","workTexts":{"大江歌罢掉头东":"大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。","共同纲领":"事件：协助毛泽东指挥三大战役，参与筹备新中国成立事宜，主持起草《共同纲领》。","为江南死国难者志哀":"“皖南事变”"},"workSummaries":{"大江歌罢掉头东":{"title":"大江歌罢掉头东","aliases":[],"authors":["周恩来"],"related_people":["周恩来"],"source_pages":["周恩来"],"era":"中国近现代","genre":"","one_liner":"大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。","summary":"大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。","quote":"《大江歌罢掉头东》、《为江南死国难者志哀》（“千古奇冤，江南一叶…”）","quotes":["《大江歌罢掉头东》、《为江南死国难者志哀》（“千古奇冤，江南一叶…”）","大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。","大江歌罢掉头东，邃密群科济世穷。"],"quote_policy":"preferred"},"共同纲领":{"title":"共同纲领","aliases":[],"authors":[],"related_people":["周恩来"],"source_pages":["周恩来"],"era":"","genre":"","one_liner":"事件：协助毛泽东指挥三大战役，参与筹备新中国成立事宜，主持起草《共同纲领》。","summary":"事件：协助毛泽东指挥三大战役，参与筹备新中国成立事宜，主持起草《共同纲领》。","quote":"","quotes":[],"quote_policy":"summary_only"},"为江南死国难者志哀":{"title":"为江南死国难者志哀","aliases":[],"authors":[],"related_people":["周恩来"],"source_pages":["周恩来"],"era":"","genre":"","one_liner":"皖南事变","summary":"皖南事变","quote":"","quotes":[],"quote_policy":"summary_only"}},"markdown":"# 周恩来\n\n## 人物档案\n\n### 基本信息\n- **姓名**：周恩来\n- **时代**：中国近现代\n- **出生**：公元1898年3月5日，淮安府山阳县（今江苏省淮安市淮安区）\n- **去世**：公元1976年1月8日，北京市（今北京市）\n- **享年**：78岁\n- **主要身份**：革命家、政治家、军事家、外交家、中国共产党和中华人民共和国主要领导人之一\n- **历史地位**：中华人民共和国开国元勋，以卓越的政治智慧、外交才能和无私奉献精神著称的人民总理。\n- **主要成就**：\n    - 领导上海工人第三次武装起义并取得胜利。\n    - 推动西安事变和平解决，促成抗日民族统一战线形成。\n    - 代表中国共产党在重庆与国民党进行长期谈判与统战工作。\n    - 担任新中国总理兼外交部长，首次完整提出**和平共处五项原则**。\n    - 在极端困难条件下维持国家基本运转，保护了大批干部和知识分子。\n\n### 生平概述\n周恩来，字翔宇，祖籍浙江绍兴，生于江苏淮安。早年求学于沈阳、天津，后赴日本、欧洲留学，期间确立共产主义信仰。归国后，他投身中国革命，历任黄埔军校政治部主任、中共中央军委书记等职，参与领导上海工人武装起义、南昌起义等。在长征、抗日战争和解放战争中，他始终处于领导核心，负责统战、军事与情报工作。新中国成立后，他长期担任国务院总理兼外交部长，在内政外交上殚精竭虑，为国家建设与和平发展作出不可磨灭的贡献，深受人民爱戴。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从苏北淮安出发，求学东北、津门，留学日本与西欧，归国后辗转于广州、上海、武汉、江西、陕北、重庆、南京等地领导革命与建国事业，最终在北京工作直至逝世。\n- ⏱️ **时间跨度**：1898年 - 1976年，共78年。\n- 📍 **地理范围**：覆盖中国东部、中部、西南、西北及欧洲（法国、德国）。\n- 🌟 **重要节点数量**：16个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：淮安\n- **时间**：1898年\n- **停留时间**：约12年（1898-1910）\n- **地点**：淮安府山阳县（今江苏省淮安市淮安区）\n- **事件**：出生于一个由衰败的官宦家庭，在此度过童年，接受私塾启蒙教育。\n- **意义**：故乡的文化底蕴和家庭变故塑造了他早熟、坚毅的性格与“为中华之崛起而读书”的志向。\n\n### 📍 重要地点：沈阳\n- **时间**：1910年-1913年\n- **停留时间**：约3年\n- **地点**：奉天府（今辽宁省沈阳市）\n- **事件**：随伯父在沈阳东关模范学校读书，接触新式教育。\n- **意义**：开阔了眼界，目睹了民族危亡，立下“为中华之崛起而读书”的宏愿。\n\n### 📍 重要地点：天津\n- **时间**：1913年-1917年\n- **停留时间**：约4年\n- **地点**：天津（今天津市）\n- **事件**：入读南开学校，积极参与演说、戏剧等社会活动，组织“敬业乐群会”。\n- **意义**：内战阴云密布之际，他在谈判桌与战场之间辗转斡旋，以绵密的外交手腕与不屈的政治信念与国民党反复周旋，每一场谈判都是刀锋上的博弈，为中共赢得宝贵的政治空间与民心所向\n\n### 📍 重要地点：日本东京\n- **时间**：1917年-1919年\n- **停留时间**：约1年半\n- **地点**：东京府（今日本东京都）\n- **事件**：留学日本，考察日本社会，接触马克思主义思潮。\n- **意义**：思想发生重要转变，开始探索救国真理，但对日本军国主义保持清醒认识。\n- **名篇名句**：《大江歌罢掉头东》：“大江歌罢掉头东，邃密群科济世穷。面壁十年图破壁，难酬蹈海亦英雄。”（作于1917年东渡日本前）\n\n### 📍 重要地点：法国巴黎\n- **时间**：1920年-1924年\n- **停留时间**：约4年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：勤工俭学，与赵世炎等组织旅欧中国少年共产党，后转入中国共产党，担任中共旅欧支部负责人。\n- **意义**：确立共产主义信仰，从爱国青年转变为职业革命家，培养了国际视野和组织能力。\n\n### 📍 重要地点：德国柏林\n- **时间**：1922年-1924年（频繁往返于巴黎）\n- **停留时间**：断续停留\n- **地点**：柏林（今德国柏林）\n- **事件**：在德从事革命活动，发展组织。\n- **意义**：内战阴云密布之际，他在谈判桌与战场之间辗转斡旋，以绵密的外交手腕与不屈的政治信念与国民党反复周旋，每一场谈判都是刀锋上的博弈，为中共赢得宝贵的政治空间与民心所向\n\n### 📍 重要地点：广州\n- **时间**：1924年-1926年\n- **停留时间**：约2年\n- **地点**：广州府（今广东省广州市）\n- **事件**：任黄埔军校政治部主任，国民革命军第一军政治部主任，参与领导两次东征。\n- **意义**：抗战硝烟甫熄，国共在沈阳外围短兵相接。周恩来以谈判桌为阵地穿梭斡旋，于刀光剑影中力图弥合裂痕；当和谈大门最终关闭，他已为即将到来的决战备好了政治与舆论的双重筹码\n\n### 📍 重要地点：上海\n- **时间**：1926年-1927年（及此后多次秘密工作）\n- **停留时间**：断续停留\n- **地点**：上海（今上海市）\n- **事件**：领导上海工人第三次武装起义并取得胜利；“四一二”政变后转入地下，主持中央军委、特科工作。\n- **意义**：内战阴云密布之际，他在谈判桌与战场之间辗转斡旋，以绵密的外交手腕与不屈的政治信念与国民党反复周旋，每一场谈判都是刀锋上的博弈，为中共赢得宝贵的政治空间与民心所向\n\n### 📍 重要地点：武汉\n- **时间**：1927年\n- **停留时间**：数月\n- **地点**：武昌（今湖北省武汉市）\n- **事件**：出席中共五大，当选中央政治局委员；在汪精卫“分共”前夕部署应变。\n- **意义**：抗战硝烟甫熄，国共在沈阳外围短兵相接。周恩来以谈判桌为阵地穿梭斡旋，于刀光剑影中力图弥合裂痕；当和谈大门最终关闭，他已为即将到来的决战备好了政治与舆论的双重筹码\n\n### 📍 重要地点：江西瑞金\n- **时间**：1931年-1934年\n- **停留时间**：约3年\n- **地点**：瑞金县（今江西省瑞金市）\n- **事件**：进入中央苏区，任中共苏区中央局书记、中革军委副主席，参与指挥第四次反“围剿”。\n- **意义**：巩固了中央苏区，但后期在“左”倾路线影响下，未能阻止第五次反“围剿”失败。\n\n### 📍 重要地点：贵州遵义\n- **时间**：1935年\n- **停留时间**：短暂\n- **地点**：遵义县（今贵州省遵义市）\n- **事件**：出席遵义会议，支持毛泽东的正确主张，被确定为党内委托的对于指挥军事上下最后决心的负责者。\n- **意义**：在历史转折关头发挥了关键作用，确立了毛泽东在党和红军中的领导地位。\n\n### 📍 重要地点：陕西延安\n- **时间**：1937年-1947年（断续）\n- **停留时间**：约10年（主要在抗战时期）\n- **地点**：延安县（今陕西省延安市）\n- **事件**：代表中共中央长期驻重庆、南京进行谈判，但延安是其决策中心；参与领导整风运动和大生产运动。\n- **意义**：作为中共对外代表和内部核心领导人，在延安指挥了国统区的统战与地下工作。\n\n### 📍 重要地点：重庆\n- **时间**：1938年-1946年（断续）\n- **停留时间**：累计约7年\n- **地点**：巴县（今重庆市）\n- **事件**：任中共中央南方局书记，长期驻重庆，主持与国民党谈判，开展统战与文化界工作。\n- **意义**：内战阴云密布之际，他在谈判桌与战场之间辗转斡旋，以绵密的外交手腕与不屈的政治信念与国民党反复周旋，每一场谈判都是刀锋上的博弈，为中共赢得宝贵的政治空间与民心所向\n\n### 📍 重要地点：南京梅园新村\n- **时间**：1946年-1947年\n- **停留时间**：约10个月\n- **地点**：南京（今江苏省南京市）\n- **事件**：率中共代表团驻南京，与国民党进行最后阶段的和平谈判，揭露其内战阴谋。\n- **意义**：1946年春周恩来飞抵沈阳，在满目疮痍的东北工业重镇与国民党展开最后斡旋。停战协议墨迹未干便被撕毁，他在奔走与谈判中清醒预见：和平窗口即将关闭，全面内战的战火正从东北蔓延至全国\n\n### 📍 重要地点：河北西柏坡\n- **时间**：1948年-1949年\n- **停留时间**：约1年\n- **地点**：平山县西柏坡村（今河北省石家庄市平山县）\n- **事件**：协助毛泽东指挥三大战役，参与筹备新中国成立事宜，主持起草《共同纲领》。\n- **意义**：作为中央军委副主席兼代总参谋长，为解放战争胜利和新中国诞生做了大量具体工作。\n\n### 🔴 去世地：北京\n- **时间**：1949年-1976年\n- **停留时间**：27年\n- **地点**：北平/北京（今北京市）\n- **事件**：担任政务院（国务院）总理兼外交部长，主持国家建设与外交工作；在“文革”中苦撑危局；因癌症逝世。\n- **意义**：为新中国的内政外交、国防科技、文化教育等各项事业奠定了基础，其人格魅力成为国家道德的象征。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1898 | 淮安 | 江苏省淮安市淮安区 | （年龄：0）出生于江苏淮安。 |\n| 1910 | 沈阳 | 辽宁省沈阳市 | （年龄：12）随伯父赴沈阳读书。 |\n| 1913 | 天津 | 天津市 | （年龄：15）入天津南开学校学习。 |\n| 1917 |  |  | （年龄：19）赴日本留学。 |\n| 1919 | 天津 | 天津市 | （年龄：21）回天津，投身五四运动，组织觉悟社。 |\n| 1920 |  |  | （年龄：22）赴法国勤工俭学。 |\n| 1921 |  |  | （年龄：23）加入中国共产党。 |\n| 1924 |  |  | （年龄：26）回国，任黄埔军校政治部主任。 |\n| 1927 | 上海 | 上海市 | （年龄：29）领导上海工人第三次武装起义；参加南昌起义。 |\n| 1931 |  |  | （年龄：33）进入中央苏区，任苏区中央局书记。 |\n| 1935 | 贵州遵义 | 贵州省遵义市 | （年龄：37）出席遵义会议，支持毛泽东。 |\n| 1936 |  |  | （年龄：38）赴西安和平解决西安事变。 |\n| 1937 |  |  | （年龄：39）代表中共与国民党谈判合作抗日。 |\n| 1945 | 重庆 | 重庆市 | （年龄：47）陪同毛泽东赴重庆谈判。 |\n| 1949 |  |  | （年龄：51）当选政务院总理兼外交部长。 |\n| 1953 |  |  | （年龄：55）首次完整提出和平共处五项原则。 |\n| 1954 |  |  | （年龄：56）率团参加日内瓦会议。 |\n| 1972 |  |  | （年龄：74）推动中美关系正常化，接待尼克松访华。 |\n| 1976 | 北京 | 北京市 | （年龄：78）在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《大江歌罢掉头东》**、**《为江南死国难者志哀》**（“千古奇冤，江南一叶…”）\n- 核心要点：\n    - **重点**：**《大江歌罢掉头东》**集中体现了青年周恩来**救国济世**的宏伟抱负和**破壁而飞**的坚定决心。\n    - 诗歌意象雄浑，如“大江”、“破壁”，善用**典故**（“面壁”、“蹈海”），充满**浪漫主义**与**英雄主义**色彩。\n    - **重点**：**《为江南死国难者志哀》**是一首政治性极强的**挽诗**，以极其凝练和悲愤的语言，揭露了“皖南事变”的真相，表达了对国民党顽固派的强烈抗议和对新四军烈士的深切哀悼。\n    - 作品体现了周恩来作为政治家**犀利、果敢**的文风，以及将**文学创作**与**现实政治斗争**紧密结合的特点。\n    - **重点**：其诗作虽数量不多，但均与其**革命生涯**的关键节点紧密相连，是理解其**思想转变**与**政治立场**的重要文学材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西安事变**后，周恩来作为中共代表赴西安谈判，推动事变**和平解决**，成为扭转时局的关键，促成了**第二次国共合作**和**抗日民族统一战线**的初步形成。\n    - 长期担任中共中央**南方局**书记，在**重庆**主持工作，是抗战时期中共在国统区的**统战工作**与**秘密工作**的核心领导人。\n    - **重点**：新中国成立后，担任**国务院总理**长达27年，是国家行政体系的**主要构建者**和**日常运行**的核心负责人，并长期兼任**外交部长**。\n    - 1953年在接见印度代表团时，首次完整提出**和平共处五项原则**，成为新中国外交政策的基石和国际关系基本准则。\n    - **重点**：在“文化大革命”极端困难和复杂的情况下，**苦撑危局**，竭力维持国家经济、外交、国防等基本工作的运转，并保护了大批党内干部和民主人士、知识分子。\n- 核心要点：\n    - **重点**：周恩来是中国共产党**最早从事军事工作和军队政治工作**的领导人之一，其在**黄埔军校**和**上海工人武装起义**中的实践，为党的军事工作奠定了基础。\n    - 他是中国共产党**隐蔽战线**（特科）工作的**主要奠基人**之一，在白色恐怖下建立了党的情报、保卫系统。\n    - **重点**：在历史转折关头，如**遵义会议**，他支持毛泽东的正确主张，对确立毛泽东在全党的领导地位起到了**关键作用**。\n    - **重点**：其历史角色常被定位为**“辅佐型”领袖**，是毛泽东最重要的**政治搭档**和**政策执行者**，以**卓越的组织能力、协调艺术**和**无私的奉献精神**著称。\n    - 在**内政**上，他主持制定了多个五年计划，关注水利、粮食、尖端科技（如“两弹一星”）等具体国计民生问题；在**外交**上，他展现了**原则性与灵活性**相结合的高超技巧，极大提升了新中国的国际地位。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：淮安 | 江苏省淮安市淮安区 | 33.5026 | 119.1380 |\n| 重要地点：沈阳 | 辽宁省沈阳市 | 41.8057 | 123.4315 |\n| 重要地点：天津 | 天津市 | 39.0842 | 117.2009 |\n| 重要地点：日本东京 | 日本东京都 | 35.6828 | 139.7595 |\n| 重要地点：法国巴黎 | 法国巴黎 | 48.8566 | 2.3522 |\n| 重要地点：德国柏林 | 德国柏林 | 52.5200 | 13.4050 |\n| 重要地点：广州 | 广东省广州市 | 23.1291 | 113.2644 |\n| 重要地点：上海 | 上海市 | 31.2304 | 121.4737 |\n| 重要地点：武汉 | 湖北省武汉市 | 30.5928 | 114.3055 |\n| 重要地点：江西瑞金 | 江西省瑞金市 | 25.8856 | 116.0271 |\n| 重要地点：贵州遵义 | 贵州省遵义市 | 27.7254 | 106.9272 |\n| 重要地点：陕西延安 | 陕西省延安市 | 36.5853 | 109.4898 |\n| 重要地点：重庆 | 重庆市 | 29.4316 | 106.9123 |\n| 重要地点：南京梅园新村 | 江苏省南京市 | 32.0603 | 118.7969 |\n| 重要地点：河北西柏坡 | 河北省平山县西柏坡 | 38.3519 | 113.9875 |\n| 去世地：北京 | 北京市 | 39.9042 | 116.4074 |\n| --- | --- | --- |\n| 江苏省淮安市淮安区 | 33.5026 | 119.1380 |\n| 辽宁省沈阳市 | 41.8057 | 123.4315 |\n| 天津市 | 39.0842 | 117.2009 |\n| 日本东京都 | 35.6828 | 139.7595 |\n| 法国巴黎 | 48.8566 | 2.3522 |\n| 德国柏林 | 52.5200 | 13.4050 |\n| 广东省广州市 | 23.1291 | 113.2644 |\n| 上海市 | 31.2304 | 121.4737 |\n| 湖北省武汉市 | 30.5928 | 114.3055 |\n| 江西省瑞金市 | 25.8856 | 116.0271 |\n| 贵州省遵义市 | 27.7254 | 106.9272 |\n| 陕西省延安市 | 36.5853 | 109.4898 |\n| 重庆市 | 29.4316 | 106.9123 |\n| 江苏省南京市 | 32.0603 | 118.7969 |\n| 河北省平山县西柏坡 | 38.3519 | 113.9875 |\n| 北京市 | 39.9042 | 116.4074 |","relatedGraph":{"center":{"id":77,"name":"周恩来","file":"周恩来.html","dynasty":"中国近现代","birth_year":1898,"death_year":1976,"time_year":1944,"quote":"为中华之崛起而读书","review":"","aliases":[],"foreign_name":"","domain_tags":[],"main_role_band":"politics","main_role_lab
