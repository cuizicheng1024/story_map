.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

t":29.4316,"lng":106.9123,"coordSystem":"WGS84","type":"normal","event":"皖南事变后，在中共安排下撤离香港赴重庆；继续从事文艺界抗日统一战线工作；创作剧本《清明前后》。","time":"1941年-1946年","duration":"约5年","significance":"茅盾文学起步的摇篮，江南文脉浸润了他对社会的敏锐洞察。抗战军兴，他远赴战时首都主持《文艺阵地》，以笔为旗凝聚各地进步文艺工作者，将故乡文人的风骨化作抵御外侮的不灭火种","works":["清明前后","文艺阵地"],"quoteLines":[]},{"name":"北京","ancientName":"北平市/北京市","modernName":"北京市","lat":39.9042,"lng":116.4074,"coordSystem":"WGS84","type":"death","event":"新中国成立后，出任首任文化部部长、全国政协副主席等职；晚年撰写回忆录《我走过的道路》；1981年3月27日病逝。","time":"1949年-1981年","duration":"约32年","significance":"从政与文学活动并重，是新中国文化事业的主要奠基人和领导者之一。临终前捐献稿费设立茅盾文学奖。","works":["我走过的道路"],"quoteLines":["《白杨礼赞》：“难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？”"]}],"coordinateSystem":"WGS84","mapStyle":{"pathColor":"#1e40af","markers":{"normal":{"color":"#3498db"},"birth":{"color":"#2ecc71"},"death":{"color":"#e74c3c"}}},"textbookPoints":"### 语文（课文/词作）\n- 课文/词作：**《白杨礼赞》**、**《子夜》**（节选）、**《林家铺子》**（节选）、**《春蚕》**（节选）\n- 核心要点：\n    - **重点**：**《白杨礼赞》** 运用象征手法，以西北黄土高原上“参天耸立，不折不挠”的**白杨树**，象征中国共产党领导下的北方抗日军民质朴、坚强、力求上进的精神。\n    - **重点**：**《子夜》** 以20世纪30年代的上海为背景，通过民族资本家**吴荪甫**的悲剧命运，深刻揭示了在半殖民地半封建社会条件下，中国民族工业无法发展壮大的社会现实，是一部“社会分析小说”的典范。\n    - **《林家铺子》** 以江南小镇一家小商铺的倒闭过程，展现了“大鱼吃小鱼，小鱼吃虾米”的残酷社会现实，体现了作者对底层小商人命运的深切同情。\n    - **《春蚕》** 通过老通宝一家养蚕丰收却反而负债的悲剧，反映了“**丰收成灾**”的畸形社会现象，是“农村三部曲”中最著名的一部。\n    - 茅盾的小说善于将人物置于宏大的**社会背景**中，通过细腻的心理描写和典型环境中的典型人物，展现时代风貌，具有强烈的**现实主义**精神。\n    - **重点**：其散文（如《白杨礼赞》《风景谈》）常采用**托物言志**、**借景抒情**的手法，将深刻的思想内涵融入具体的形象描绘之中，语言精炼，富有感染力。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：茅盾是**五四新文化运动**的积极参与者，通过改革《小说月报》和发起**文学研究会**，倡导“为人生”的现实主义文学，反对“将文艺当作高兴时的游戏或失意时的消遣”。\n    - 他是**中国左翼作家联盟**（左联）的领导人之一，在20世纪30年代的上海，团结进步作家，与国民党文化“围剿”进行斗争。\n    - 抗战期间，他辗转于武汉、香港、新疆、延安、重庆等地，是**文艺界抗日统一战线**的重要组织者和实践者。\n    - **重点**：1949年后，茅盾出任中华人民共和国**第一任文化部部长**，长期主管国家文化事业，是新中国文化政策的重要制定者和执行者之一。\n- 核心要点：\n    - **重点**：茅盾的文学创作（尤其是《子夜》）是运用**马克思主义**观点分析中国社会的杰出范例，其作品具有鲜明的**社会剖析**色彩，是研究20世纪30年代中国社会经济状况的重要文学文本。\n    - 他的一生经历了从旧民主主义革命、新民主主义革命到社会主义建设的完整历程，其个人命运与中国近现代史的**重大转折**紧密相连。\n    - **重点**：茅盾在文学史上的地位，不仅在于其创作成就，还在于他作为**文学理论家**和**批评家**，对中国现代文学批评体系的建立和发展做出了开创性贡献。\n    - **重点**：他临终前捐献25万元稿费设立的**茅盾文学奖**，是中国具有最高荣誉的文学奖项之一，旨在鼓励优秀长篇小说创作，对中国当代文学的发展影响深远。\n\n---","examPoints":"### 考点\n### 语文（课文/词作）\n- 课文/词作：**《白杨礼赞》**、**《子夜》**（节选）、**《林家铺子》**（节选）、**《春蚕》**（节选）\n- 核心要点：\n    - **重点**：**《白杨礼赞》** 运用象征手法，以西北黄土高原上“参天耸立，不折不挠”的**白杨树**，象征中国共产党领导下的北方抗日军民质朴、坚强、力求上进的精神。\n    - **重点**：**《子夜》** 以20世纪30年代的上海为背景，通过民族资本家**吴荪甫**的悲剧命运，深刻揭示了在半殖民地半封建社会条件下，中国民族工业无法发展壮大的社会现实，是一部“社会分析小说”的典范。\n    - **《林家铺子》** 以江南小镇一家小商铺的倒闭过程，展现了“大鱼吃小鱼，小鱼吃虾米”的残酷社会现实，体现了作者对底层小商人命运的深切同情。\n    - **《春蚕》** 通过老通宝一家养蚕丰收却反而负债的悲剧，反映了“**丰收成灾**”的畸形社会现象，是“农村三部曲”中最著名的一部。\n    - 茅盾的小说善于将人物置于宏大的**社会背景**中，通过细腻的心理描写和典型环境中的典型人物，展现时代风貌，具有强烈的**现实主义**精神。\n    - **重点**：其散文（如《白杨礼赞》《风景谈》）常采用**托物言志**、**借景抒情**的手法，将深刻的思想内涵融入具体的形象描绘之中，语言精炼，富有感染力。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：茅盾是**五四新文化运动**的积极参与者，通过改革《小说月报》和发起**文学研究会**，倡导“为人生”的现实主义文学，反对“将文艺当作高兴时的游戏或失意时的消遣”。\n    - 他是**中国左翼作家联盟**（左联）的领导人之一，在20世纪30年代的上海，团结进步作家，与国民党文化“围剿”进行斗争。\n    - 抗战期间，他辗转于武汉、香港、新疆、延安、重庆等地，是**文艺界抗日统一战线**的重要组织者和实践者。\n    - **重点**：1949年后，茅盾出任中华人民共和国**第一任文化部部长**，长期主管国家文化事业，是新中国文化政策的重要制定者和执行者之一。\n- 核心要点：\n    - **重点**：茅盾的文学创作（尤其是《子夜》）是运用**马克思主义**观点分析中国社会的杰出范例，其作品具有鲜明的**社会剖析**色彩，是研究20世纪30年代中国社会经济状况的重要文学文本。\n    - 他的一生经历了从旧民主主义革命、新民主主义革命到社会主义建设的完整历程，其个人命运与中国近现代史的**重大转折**紧密相连。\n    - **重点**：茅盾在文学史上的地位，不仅在于其创作成就，还在于他作为**文学理论家**和**批评家**，对中国现代文学批评体系的建立和发展做出了开创性贡献。\n    - **重点**：他临终前捐献25万元稿费设立的**茅盾文学奖**，是中国具有最高荣誉的文学奖项之一，旨在鼓励优秀长篇小说创作，对中国当代文学的发展影响深远。\n\n---","workTexts":{"子夜":"太阳刚刚下了地平线。软风一阵一阵地吹上人面，怪痒痒的。","春蚕":"真是天也变了！","腐蚀":"我憎恨这黑暗的社会，我诅咒这无耻的阴谋！","风景谈":"自然是伟大的，人类是伟大的，然而充满了崇高精神的人类的活动，乃是伟大中之尤其伟大者！","白杨礼赞":"难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？","小说月报":"“将文艺当作高兴时的游戏或失意时的消遣的时候，现在已经过去了。”","民国日报":"事件：任中央军事政治学校武汉分校政治教官，并担任《民国日报》主笔。","文艺阵地":"事件：创办并主编《文艺阵地》杂志","幻灭":"| 1927 | | | （年龄：31）大革命失败后，开始小说创作，发表《幻灭》。","林家铺子":"“大鱼吃小鱼，小鱼吃虾米”"},"workSummaries":{"子夜":{"title":"子夜","aliases":[],"authors":["茅盾"],"related_people":["茅盾"],"source_p 岁\n- **主要身份**：作家、文学评论家、社会活动家\n- **历史地位**：中国现代著名作家、文学评论家，中国现代文学的先驱和巨匠之一，也是新中国第一任文化部部长。\n- **主要成就**：\n    1. 创作了《子夜》《林家铺子》《春蚕》等现实主义文学杰作。\n    2. 领导了左翼作家联盟，推动了中国革命文学的发展。\n    3. 作为文化部部长，为新中国文化事业的建设做出了重要贡献。\n    4. 其文学理论和批评著作对中国现代文学批评体系的建立影响深远。\n\n### 生平概述\n茅盾出生于浙江乌镇的书香门第，早年接受新式教育，后考入北京大学预科。毕业后进入上海商务印书馆工作，开始文学创作与翻译。五四新文化运动期间，他积极参与文学革命，倡导“为人生”的现实主义文学。大革命失败后，他以笔名“茅盾”发表小说《蚀》三部曲，轰动文坛。20世纪30年代，他创作了代表作《子夜》，深刻剖析了中国社会性质。抗战时期，他辗转于香港、延安、重庆等地（新疆等地经历存疑/待考），坚持抗日救亡的文化工作。新中国成立后，他担任首任文化部部长，晚年致力于回忆录《我走过的道路》的写作。他的一生贯穿了中国从旧民主主义革命到社会主义建设的多个重要历史阶段。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍布中国东部、中部及西南地区，从江南水乡到革命圣地，从战时首都到新中国首都。\n- ⏱️ **时间跨度**：1896年至1981年，共计约85年。\n- 📍 **地理范围**：主要覆盖浙江、上海、北京、湖北、香港、陕西、重庆等省市自治区。新疆、广西等地经历存疑/待考。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：乌镇\n- **时间**：1896年\n- **停留时间**：童年及少年时期（约13年）\n- **地点**：浙江省桐乡县乌镇（今浙江省嘉兴市桐乡市乌镇）\n- **事件**：出生于书香世家，接受传统启蒙教育，后入新式学堂读书。\n- **意义**：乌镇的水巷与运河，构成了茅盾最早的感官世界。镇上茶馆的说书声、外祖父家的万卷藏书、母亲教的古诗词，在他心中种下文学的胚芽。《子夜》的都市笔法与《春蚕》的乡土深情，追根溯源，皆孕育于这片水乡的温润与世俗\n\n### 📍 重要地点：杭州\n- **时间**：1909年-1913年\n- **停留时间**：约4年\n- **地点**：浙江省杭县（今浙江省杭州市）\n- **事件**：就读于浙江省立第三中学（今湖州中学）及安定中学。\n- **意义**：十六岁入杭州安定学堂，茅盾第一次走出桐乡。算学、理化、博物等新学科如清风拂面，让他朦胧意识到，时代的车轮已驶入一个与传统决裂的轨道\n\n### 📍 重要地点：北京\n- **时间**：1913年-1916年\n- **停留时间**：约3年\n- **地点**：京兆地方（今北京市）\n- **事件**：考入北京大学预科第一类（文法类）学习。\n- **意义**：十六岁入杭州安定学堂，茅盾第一次走出桐乡。算学、理化、博物等新学科如清风拂面，让他朦胧意识到，时代的车轮已驶入一个与传统决裂的轨道\n\n### 📍 重要地点：上海（商务印书馆）\n- **时间**：1916年-1926年\n- **停留时间**：约10年\n- **地点**：江苏省上海县（今上海市）\n- **事件**：进入商务印书馆编译所工作，从事编辑、翻译和文学评论；参与发起文学研究会；积极投身五四新文化运动。\n- **意义**：正式踏入中国文坛和出版界，成为新文学运动的重要倡导者和实践者。\n- **名篇名句**：《小说月报》改革宣言：“将文艺当作高兴时的游戏或失意时的消遣的时候，现在已经过去了。”\n\n### 📍 重要地点：武汉\n- **时间**：1926年底-1927年\n- **停留时间**：约半年\n- **地点**：湖北省武昌县（今湖北省武汉市武昌区）\n- **事件**：任中央军事政治学校武汉分校政治教官，并担任《民国日报》主笔。\n- **意义**：十六岁入杭州安定学堂，茅盾第一次走出桐乡。算学、理化、博物等新学科如清风拂面，让他朦胧意识到，时代的车轮已驶入一个与传统决裂的轨道文学创作提供了深刻素材。\n\n### 📍 重要地点：上海（创作高峰期）\n- **时间**：1927年-1937年\n- **停留时间**：约10年\n- **地点**：上海特别市（今上海市）\n- **事件**：以笔名“茅盾”发表《蚀》三部曲（《幻灭》《动摇》《追求》）；创作长篇小说《子夜》，短篇小说《林家铺子》《春蚕》等；参与发起中国左翼作家联盟。\n- **意义**：迎来了文学创作的第一个黄金时期，奠定了其在中国现代文学史上的巨匠地位。\n- **名篇名句**：《子夜》：“太阳刚刚下了地平线。软风一阵一阵地吹上人面，怪痒痒的。”；《春蚕》：“真是天也变了！”\n\n### 📍 重要地点：香港\n- **时间**：1938年-1941年（断续居留）\n- **停留时间**：累计约2年\n- **地点**：英属香港（今香港特别行政区）\n- **事件**：创办并主编《文艺阵地》杂志；发表长篇小说《腐蚀》。\n- **意义**：抗战军兴，茅盾在此团结流散各地的进步文艺工作者。他以主编刊物、组织笔会为手段，将离散的知识分子凝聚成抵抗的力量，在山河破碎之际守护着不屈的文化血脉动。\n- **名篇名句**：《腐蚀》：“我憎恨这黑暗的社会，我诅咒这无耻的阴谋！”\n\n### 📍 重要地点：延安\n- **时间**：1940年\n- **停留时间**：约5个月\n- **地点**：陕甘宁边区延安县（今陕西省延安市）\n- **事件**：应邀访问延安，在鲁迅艺术学院讲学；会见毛泽东等中共领导人。\n- **意义**：亲身感受了敌后抗日根据地的生机与活力，为其思想与创作注入了新因素。\n- **名篇名句**：《风景谈》：“自然是伟大的，人类是伟大的，然而充满了崇高精神的人类的活动，乃是伟大中之尤其伟大者！”\n\n### 📍 重要地点：重庆\n- **时间**：1941年-1946年\n- **停留时间**：约5年\n- **地点**：四川省重庆市（今重庆市）\n- **事件**：皖南事变后，在中共安排下撤离香港赴重庆；继续从事文艺界抗日统一战线工作；创作剧本《清明前后》。\n- **意义**：茅盾文学起步的摇篮，江南文脉浸润了他对社会的敏锐洞察。抗战军兴，他远赴战时首都主持《文艺阵地》，以笔为旗凝聚各地进步文艺工作者，将故乡文人的风骨化作抵御外侮的不灭火种\n\n### 🔴 去世地：北京\n- **时间**：1949年-1981年\n- **停留时间**：约32年\n- **地点**：北平市/北京市（今北京市）\n- **事件**：新中国成立后，出任首任文化部部长、全国政协副主席等职；晚年撰写回忆录《我走过的道路》；1981年3月27日病逝。\n- **意义**：从政与文学活动并重，是新中国文化事业的主要奠基人和领导者之一。临终前捐献稿费设立茅盾文学奖。\n- **名篇名句**：《白杨礼赞》：“难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？”\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1896 | 乌镇 | 浙江省嘉兴市桐乡市乌镇 | （年龄：0）出生于浙江乌镇。 |\n| 1913 | 北京 | 北京市 | （年龄：17）考入北京大学预科。 |\n| 1916 | 上海（商务印书馆） | 上海市 | （年龄：20）预科毕业，进入上海商务印书馆编译所工作。 |\n| 1920 |  |  | （年龄：24）接编并改革《小说月报》；参与发起文学研究会。 |\n| 1926 | 武汉 | 湖北省武汉市武昌区 | （年龄：30）赴武汉，任中央军事政治学校武汉分校政治教官。 |\n| 1927 |  |  | （年龄：31）大革命失败后，开始小说创作，发表《幻灭》。 |\n| 1930 | 上海（创作高峰期） | 上海市 | （年龄：34）在上海加入中国左翼作家联盟。 |\n| 1933 |  |  | （年龄：37）长篇小说《子夜》出版。 |\n| 1938 | 香港 | 香港特别行政区 | （年龄：42）在香港主编《文艺阵地》。 |\n| 1940 | 延安 | 陕西省延安市 | （年龄：44）访问延安，在鲁迅艺术学院讲学。 |\n| 1941 | 香港 | 香港特别行政区 | （年龄：45）皖南事变后，由香港转移至重庆。 |\n| 1946 |  |  | （年龄：50）抗战胜利后，曾赴苏联访问（存疑/待考）。 |\n| 1949 |  |  | （年龄：53）中华人民共和国成立，出任文化部部长。 |\n| 1964 |  |  | （年龄：68）免去文化部部长职务，改任全国政协副主席。 |\n| 1981 | 北京 | 北京市 | （年龄：85）3月27日于北京逝世。临终前捐献稿费设立茅盾文学奖。 |\n\n---\n\n## 人教版教材知识点\n\n### 语文（课文/词作）\n- 课文/词作：**《白杨礼赞》**、**《子夜》**（节选）、**《林家铺子》**（节选）、**《春蚕》**（节选）\n- 核心要点：\n    - **重点**：**《白杨礼赞》** 运用象征手法，以西北黄土高原上“参天耸立，不折不挠”的**白杨树**，象征中国共产党领导下的北方抗日军民质朴、坚强、力求上进的精神。\n    - **重点**：**《子夜》** 以20世纪30年代的上海为背景，通过民族资本家**吴荪甫**的悲剧命运，深刻揭示了在半殖民地半封建社会条件下，中国民族工业无法发展壮大的社会现实，是一部“社会分析小说”的典范。\n    - **《林家铺子》** 以江南小镇一家小商铺的倒闭过程，展现了“大鱼吃小鱼，小鱼吃虾米”的残酷社会现实，体现了作者对底层小商人命运的深切同情。\n    - **《春蚕》** 通过老通宝一家养蚕丰收却反而负债的悲剧，反映了“**丰收成灾**”的畸形社会现象，是“农村三部曲”中最著名的一部。\n    - 茅盾的小说善于将人物置于宏大的**社会背景**中，通过细腻的心理描写和典型环境中的典型人物，展现时代风貌，具有强烈的**现实主义**精神。\n    - **重点**：其散文（如《白杨礼赞》《风景谈》）常采用**托物言志**、**借景抒情**的手法，将深刻的思想内涵融入具体的形象描绘之中，语言精炼，富有感染力。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：茅盾是**五四新文化运动**的积极参与者，通过改革《小说月报》和发起**文学研究会**，倡导“为人生”的现实主义文学，反对“将文艺当作高兴时的游戏或失意时的消遣”。\n    - 他是**中国左翼作家联盟**（左联）的领导人之一，在20世纪30年代的上海，团结进步作家，与国民党文化“围剿”进行斗争。\n    - 抗战期间，他辗转于武汉、香港、新疆、延安、重庆等地，是**文艺界抗日统一战线**的重要组织者和实践者。\n    - **重点**：1949年后，茅盾出任中华人民共和国**第一任文化部部长**，长期主管国家文化事业，是新中国文化政策的重要制定者和执行者之一。\n- 核心要点：\n    - **重点**：茅盾的文学创作（尤其是《子夜》）是运用**马克思主义**观点分析中国社会的杰出范例，其作品具有鲜明的**社会剖析**色彩，是研究20世纪30年代中国社会经济状况的重要文学文本。\n    - 他的一生经历了从旧民主主义革命、新民主主义革命到社会主义建设的完整历程，其个人命运与中国近现代史的**重大转折**紧密相连。\n    - **重点**：茅盾在文学史上的地位，不仅在于其创作成就，还在于他作为**文学理论家**和**批评家**，对中国现代文学批评体系的建立和发展做出了开创性贡献。\n    - **重点**：他临终前捐献25万元稿费设立的**茅盾文学奖**，是中国具有最高荣誉的文学奖项之一，旨在鼓励优秀长篇小说创作，对中国当代文学的发展影响深远。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 浙江省嘉兴市桐乡市乌镇 | 30.7467 | 120.4853 |\n| 浙江省杭州市 | 30.2741 | 120.1551 |\n| 北京市 | 39.9042 | 116.4074 |\n| 上海市 | 31.2304 | 121.4737 |\n| 湖北省武汉市 | 30.5928 | 114.3055 |\n| 香港特别行政区 | 22.3193 | 114.1694 |\n| 陕西省延安市 | 36.5854 | 109.4898 |\n| 重庆市 | 29.4316 | 106.9123 |","relatedGraph":{"center":{"id":"茅盾","name":"茅盾","file":"茅盾.html","dynasty":"中国近现代（清末至中华人民共和国）","aliases":[],"birth_year":1896,"death_year":1981,"quote":"将文艺当作高兴时的游戏或失意时的消遣的时候，现在已经过去了。","review":"将文艺当作高兴时的游戏或失意时的消遣的时候，现在已经过去了。","foreign_name":"","main_role_label":"作家","birthplace":"浙江省桐乡县乌镇","birthplace_modern":"浙江省嘉兴市桐乡市乌镇","domain_tags":[],"has_story":true,"relationLabel":"中心人物","isCenter":true},"nodes":[{"id":"茅盾","name":"茅盾","file":"茅盾.html","dynasty":"中国近现代（清末至中华人民共和国）"
