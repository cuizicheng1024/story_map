  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

革命”**中地位的急剧上升与**“九一三事件”**。\n- **代表作品/思想**：教材可能提及但通常不展开其军事理论。其政治生涯与**“个人崇拜”**、**“接班人”**问题紧密关联。\n- **常见易混点/对比点**：**“九一三事件”**对“文化大革命”进程的影响（客观上促使人们反思）；与**“四人帮”**在“文革”中的角色异同；对其评价的**历史复杂性**（功与过）。\n\n---","examPoints": "### 初中阶段考点\n1.  **平型关大捷**的指挥者、意义（全国抗战以来第一个大胜利）。\n2.  **辽沈战役**（有时与淮海、平津战役并提）的指挥者、结果（解放东北全境）。\n3.  1955年被授予**元帅**军衔。\n4.  “文化大革命”中成为毛泽东的**接班人**并写入党章。\n5.  **“九一三事件”**（1971年）的概况及其标志着林彪反革命集团的覆灭。\n\n### 高中阶段考点\n1.  **红军时期**的主要职务（红一军团军团长）和经历（反“围剿”、长征）。\n2.  **解放战争时期**在东北战场的军事活动（从**东北民主联军**到**第四野战军**的发展）。\n3.  **辽沈战役**的战略意义（解放东北，使全国军事形势出现转折）。\n4.  **“九一三事件”**的深层原因（权力斗争、路线分歧）及其对“文化大革命”和毛泽东本人的重大影响。\n5.  对林彪的**历史评价**问题：需掌握官方结论（反革命集团主犯），同时理解其在革命战争年代的贡献，认识历史人物的复杂性。（存疑/说法不一：关于其早期具体战斗细节、苏联养伤期间活动、与毛泽东关系的具体演变过程等，学术界存在不同解读）。","workTexts": {"“571工程”纪要": "“《“571工程”"},"workSummaries": {"关于林彪反党集团反革命罪行的审查报告": {"title": "关于林彪反党集团反革命罪行的审查报告","aliases": [],"authors": [],"related_people": ["林彪"],"source_pages": ["林彪"],"era": "","genre": "","one_liner": "林彪，原名林育蓉，湖北黄冈人","summary": "林彪，原名林育蓉，湖北黄冈人","quote": "","quotes": [],"quote_policy": "summary_only"},"关于建国以来党的若干历史问题的决议": {"title": "关于建国以来党的若干历史问题的决议","aliases": [],"authors": [],"related_people": ["林彪","毛泽东"],"source_pages": ["林彪","毛泽东"],"era": "","genre": "","one_liner": "对毛泽东的历史评价，集中体现在中共十一届六中全会通过的《关于建国以来党的若干历史问题的决议》中，其功绩是第一位的，错误是第二位的。","summary": "对毛泽东的历史评价，集中体现在中共十一届六中全会通过的《关于建国以来党的若干历史问题的决议》中，其功绩是第一位的，错误是第二位的。","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 林彪\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：林彪，原名林育蓉\n- **时代**：现代中国\n- **出生**：1907年12月5日，湖北省黄冈县林家大湾（今湖北省黄冈市团风县）\n- **去世**：1971年9月13日，蒙古人民共和国温都尔汗（今蒙古国肯特省温都尔汗附近）\n- **享年**：64岁\n- **主要身份**：军事家、政治家、中华人民共和国元帅\n- **历史地位**：中国共产党历史上重要的军事领导人之一，在革命战争年代战功卓著，后成为党和国家的主要领导人之一，最终因政治问题身败名裂（官方定性为反革命集团主犯）。\n- **主要成就**：指挥平型关战役，取得全国抗战以来第一个大胜利；在解放战争中指挥辽沈战役、平津战役等重大战役，为解放全中国作出重要贡献；1955年被授予中华人民共和国元帅军衔。\n\n### 生平概述\n林彪，原名林育蓉，湖北黄冈人。早年投身学生运动，1925年加入中国共产党，同年进入黄埔军校学习。在土地革命战争时期，他迅速成长为红军的重要指挥员，参加了历次反“围剿”斗争和长征。抗日战争爆发后，任八路军第115师师长，指挥了著名的平型关战役。解放战争时期，他作为东北野战军（后改称第四野战军）司令员，指挥了辽沈、平津等战略性战役，为解放战争的胜利立下赫赫战功。新中国成立后，历任要职，在1959年后主持中央军委日常工作，地位显赫。“文化大革命”期间，其地位进一步上升，被确定为毛泽东的接班人并写入党章。1971年9月13日，在其策划的武装政变计划败露后，乘飞机外逃，途中坠机身亡于蒙古温都尔汗，史称“九一三事件”。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：足迹主要遍布中国中南、华南、华东、东北、华北地区，最终殒命于蒙古国。\n- ⏱️ **时间跨度**：1907年—1971年，共64年。\n- 📍 **地理范围**：中国湖北、广东、江西、福建、陕西、山西、东北三省、河北、北京等地，以及蒙古国。\n- 🌟 **重要节点数量**：核心地点约10个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 📍 出生地：湖北省黄冈县林家大湾\n- **公元纪年**：1907年\n- **停留时间**：童年及少年时期（约1907-1922年）\n- **位置**：湖北省黄冈县（今湖北省黄冈市团风县）回龙山镇林家大湾\n- **事迹**：在此度过童年，接受私塾启蒙教育，后进入浚新学校读书，开始接触新思想。\n- **意义**：湖广交界的寻常村落里，沉默的少年度过了最初的岁月。困顿的家境与战乱的底色悄然塑造了日后那个深居简出、城府极深的灵魂轮廓——此处虽无名，却是林彪性格底色的原产地\n\n### 📍 重要地点：武汉市\n- **公元纪年**：1922年—1925年\n- **停留时间**：约3年\n- **位置**：湖北省武汉市\n- **事迹**：进入武昌共进中学学习，积极参加学生爱国运动。1925年加入中国共产党，并受党组织派遣南下广州，考入黄埔军校。\n- **意义**：思想觉醒并加入中国共产党的关键转折点，由此走上职业革命道路。\n\n### 📍 重要地点：黄埔军校（广州）\n- **公元纪年**：1925年底—1926年\n- **停留时间**：约半年\n- **位置**：广东省广州市黄埔区长洲岛\n- **事迹**：作为黄埔军校第四期学员接受军事训练，系统学习军事理论，为其军事生涯奠定基础。\n- **意义**：军事生涯的起点，获得了正规军事教育背景，并建立了早期的军政人脉。\n\n### 📍 重要地点：井冈山及中央苏区\n- **公元纪年**：1928年—1934年\n- **停留时间**：约6年\n- **位置**：江西省吉安市井冈山市（井冈山）及以江西瑞金为中心的赣南、闽西苏区（中央革命根据地）\n- **事迹**：随朱德、陈毅部队上井冈山，历任营长、团长、纵队长、红四军军长、红一军团军团长等职，参加了中央苏区历次反“围剿”作战。\n- **意义**：在残酷的战争中迅速成长为红军高级指挥员，积累了丰富的游击战和运动战经验，成为毛泽东军事思想的坚定支持者和实践者。\n\n### 📍 重要地点：陕北（延安）\n- **公元纪年**：1935年10月—1937年8月\n- **停留时间**：约1年10个月\n- **位置**：陕西省延安市\n- **事迹**：长征到达陕北后，任中国人民抗日红军大学（后改称抗日军政大学）校长兼政委。\n- **意义**：在相对稳定的后方环境中，负责培养军事干部，并参与了党中央的高层决策。\n\n### 📍 重要地点：平型关（山西）\n- **公元纪年**：1937年9月\n- **停留时间**：战役期间\n- **位置**：山西省大同市灵丘县白崖台乡\n- **事迹**：作为八路军第115师师长，指挥了平型关战役，伏击日军板垣师团一部，取得大捷。\n- **意义**：取得了全国抗战以来的第一个大胜利，极大地振奋了全国军民的抗战信心，林彪也因此声名远播。\n\n### 📍 重要地点：东北地区\n- **公元纪年**：1945年—1948年\n- **停留时间**：约3年\n- **位置**：主要活动于哈尔滨、沈阳、长春等地\n- **事迹**：任东北人民自治军总司令、东北民主联军总司令、东北野战军司令员等职。指挥了三下江南四保临江、1947年夏季攻势、秋季攻势、冬季攻势，特别是1948年的辽沈战役，解放了全东北。\n- **意义**：军事生涯的巅峰时期，通过一系列战役将东北野战军打造成百万雄师，为解放战争的胜利奠定了坚实基础。\n\n### 📍 重要地点：北平/北京\n- **公元纪年**：1949年—1971年（主要居住地）\n- **停留时间**：约22年\n- **位置**：北平（1949年9月改称北京）\n- **事迹**：作为平津战役的主要指挥者之一，促成北平和平解放。建国后长期居住于此，历任中南军政委员会主席、国务院副总理、国防部部长、中共中央副主席等职。1959年庐山会议后主持中央军委日常工作。“文化大革命”中地位急剧上升，成为唯一的党中央副主席，并被写入党章确定为接班人。\n- **意义**：政治生涯的核心舞台，从功勋卓著的开国元帅走向权力顶峰，最终在此策划并实施了导致其覆灭的政治行动。\n\n### 📍 去世地：蒙古人民共和国温都尔汗\n- **公元纪年**：1971年9月13日\n- **停留时间**：生命最后时刻\n- **位置**：蒙古国肯特省温都尔汗（坠机具体地点为温都尔汗以西约60公里的苏布拉嘎盆地）\n- **经过**：1971年9月13日凌晨，在其策划武装政变、谋害毛泽东的计划（即“《“571工程”纪要》”）败露后，与妻子叶群、儿子林立果等乘坐256号三叉戟飞机仓皇出逃，途经蒙古国时飞机坠毁，机上人员全部死亡。\n- **意义**：生命的终点，也是其政治生涯的彻底终结。“九一三事件”震惊中外，对当时中国的政治格局产生了深远影响。\n- **名篇名句**：无直接相关作品。其政治生涯后期常被引用的关联文件为《“571工程”纪要》。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1907 | 湖北省黄冈县林家大湾 | 湖北省黄冈市团风县 | （年龄：0）出生于湖北黄冈林家大湾。 |\n| 1922 |  |  | （年龄：15）入武昌共进中学读书，开始接触进步思想。 |\n| 1925 | 黄埔军校（广州） | 广东省广州市黄埔区长洲岛 | （年龄：18）加入中国共产党；考入黄埔军校第四期。 |\n| 1927 |  |  | （年龄：20）参加南昌起义。 |\n| 1928 | 井冈山及中央苏区 |  | （年龄：21）随部队上井冈山，参与井冈山革命根据地斗争。 |\n| 1930 |  |  | （年龄：23）任红四军军长。 |\n| 1932 |  |  | （年龄：25）任红一军团军团长，成为红军主力指挥员。 |\n| 1934 |  |  | （年龄：27）参加中央红军长征。 |\n| 1936 |  |  | （年龄：29）任中国人民抗日红军大学校长。 |\n| 1937 | 平型关（山西） | 山西省大同市灵丘县白崖台乡 | （年龄：30）任八路军第115师师长；指挥平型关战役。 |\n| 1938 |  |  | （年龄：31）被阎锡山部哨兵误伤，赴苏联治疗，约1942年回国。 |\n| 1945 |  |  | （年龄：38）抗战胜利后赴东北，任东北人民自治军总司令。 |\n| 1948 |  |  | （年龄：41）指挥辽沈战役，解放东北全境。 |\n| 1949 |  |  | （年龄：42）指挥平津战役；率第四野战军南下。 |\n| 1955 |  |  | （年龄：48）被授予中华人民共和国元帅军衔。 |\n| 1959 |  |  | （年龄：52）任国防部部长，开始主持中央军委日常工作。 |\n| 1969 |  |  | （年龄：62）在中共九大上被选为中共中央副主席，并写入党章成为毛泽东接班人。 |\n| 1971 |  |  | （年龄：64）“九一三事件”爆发，乘飞机出逃，坠亡于蒙古温都尔汗。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n林彪在革命战争年代，特别是解放战争中，作为战略区的主要指挥员，其军事才能对加速战争进程起到了关键作用。建国后，尤其是在1959年之后，他主持军队工作，对军队建设和“突出政治”的风气产生了深远影响。“文化大革命”期间，他身居高位，其政治动向直接关联着国家最高权力的稳定与变动。“九一三事件”的发生，客观上成为“文化大革命”历史进程中的一个重要转折点，促使广大干部群众从个人崇拜的狂热中觉醒，开始对“文革”进行深刻反思，也对毛泽东本人造成了巨大冲击。\n\n### 对后世的影响\n1.  **军事思想遗产**：其在革命战争中总结的“六个战术原则”（如“三三制”、“四快一慢”等）成为解放军战术训练的重要内容，对现代军事指挥仍有研究价值。\n2.  **历史教训**：“九一三事件”作为中国当代史上的重大政治事件，成为研究“文化大革命”史、中共党史和国际冷战史的关键案例，为后世提供了关于权力监督、党内民主和政治生态建设的深刻教训。\n3.  **文化符号**：其人生轨迹的巨大反差（从战功赫赫的元帅到叛逃身亡的“反党集团”头目），使其成为一个复杂的历史符号，常被用于讨论历史人物的评价、功过与时代悲剧的关系。\n\n### 历史评价\n1.  **官方定性**：中共中央在1973年《关于林彪反党集团反革命罪行的审查报告》中将其定性为“资产阶级野心家、阴谋家、反革命两面派、叛徒、卖国贼”。1981年《关于建国以来党的若干历史问题的决议》延续了这一结论，指出“林彪、江青反革命集团是两个阴谋夺取最高权力的反革命集团”。\n2.  **军事贡献评价**：历史学界普遍承认其在革命战争年代，特别是解放战争中的卓越军事指挥才能和贡献，认为他是“能打仗”的将领。\n3.  **复杂性评价**：后世研究者倾向于将其人生分为前后两段进行评价，承认其前期革命功绩的同时，严厉批判其后期的政治野心和反革命行径，认为其悲剧是个人野心与特定历史条件结合的结果。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**北伐战争**、**土地革命战争**、**抗日战争**、**解放战争**。\n- **关键事件/贡献**：作为**黄埔军校**学生参加革命；在**井冈山革命根据地**时期担任红军指挥员；指挥**平型关大捷**，这是**全民族抗战以来中国军队取得的第一个大胜利**；作为**东北野战军**（四野）司令员，指挥**辽沈战役**等。\n- **代表作品/思想**：无。教材通常不涉及个人军事思想。\n- **常见易混点/对比点**：与**粟裕**（华东野战军）、**刘伯承**（中原野战军）等其他野战军指挥员进行战役贡献对比；**平型关战役**与**台儿庄战役**的性质（共产党军队 vs 国民党军队；敌后战场 vs 正面战场）对比。\n\n### 高中阶段\n- **时代背景**：**新民主主义革命**各个时期；**社会主义革命和建设**时期；**“文化大革命”**。\n- **关键事件/贡献**：**红军时期**的反“围剿”和**长征**；**解放战争**中**战略决战**（辽沈、淮海、平津）的指挥；1955年授衔**十大元帅**之一；**“文化大革命”**中地位的急剧上升与**“九一三事件”**。\n- **代表作品/思想**：教材可能提及但通常不展开其军事理论。其政治生涯与**“个人崇拜”**、**“接班人”**问题紧密关联。\n- **常见易混点/对比点**：**“九一三事件”**对“文化大革命”进程的影响（客观上促使人们反思）；与**“四人帮”**在“文革”中的角色异同；对其评价的**历史复杂性**（功与过）。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **平型关大捷**的指挥者、意义（全国抗战以来第一个大胜利）。\n2.  **辽沈战役**（有时与淮海、平津战役并提）的指挥者、结果（解放东北全境）。\n3.  1955年被授予**元帅**军衔。\n4.  “文化大革命”中成为毛泽东的**接班人**并写入党章。\n5.  **“九一三事件”**（1971年）的概况及其标志着林彪反革命集团的覆灭。\n\n### 高中阶段考点\n1.  **红军时期**的主要职务（红一军团军团长）和经历（反“围剿”、长征）。\n2.  **解放战争时期**在东北战场的军事活动（从**东北民主联军**到**第四野战军**的发展）。\n3.  **辽沈战役**的战略意义（解放东北，使全国军事形势出现转折）。\n4.  **“九一三事件”**的深层原因（权力斗争、路线分歧）及其对“文化大革命”和毛泽东本人的重大影响。\n5.  对林彪的**历史评价**问题：需掌握官方结论（反革命集团主犯），同时理解其在革命战争年代的贡献，认识历史人物的复杂性。（存疑/说法不一：关于其早期具体战斗细节、苏联养伤期间活动、与毛泽东关系的具体演变过程等，学术界存在不同解读）。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地 | 湖北省黄冈市团风县回龙山镇林家大湾 | 30.6333 | 114.9333 |\n| 湖北省黄冈市团风县 | 湖北省黄冈市团风县 | 30.6436 | 114.8724 |\n| 武汉市 | 湖北省武汉市 | 30.5928 | 114.3055 |\n| 黄埔军校 | 广东省广州市黄埔区长洲岛 | 23.0833 | 113.4167 |\n| 井冈山 | 江西省吉安市井冈山市 | 26.7481 | 114.1668 |\n| 延安 | 陕西省延安市 | 36.5854 | 109.4898 |\n| 平型关 | 山西省大同市灵丘县白崖台乡 | 39.3333 | 113.9167 |\n| 哈尔滨 | 黑龙江省哈尔滨市 | 45.7500 | 126.6500 |\n| 沈阳 | 辽宁省沈阳市 | 41.8057 | 123.4315 |\n| 长春 | 吉林省长春市 | 43.8171 | 125.3235 |\n| 北京 | 北京市 | 39.9042 | 11
