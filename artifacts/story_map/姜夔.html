  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

谐，是格律词派的典范。\n    - **重点**：**虚字传神**：擅长运用虚字（如“算”“又”“更”）勾勒意脉，使词意**灵动**而不板滞。\n    - **重点**：**寄托遥深**：个人身世飘零之感（如合肥情事）与家国之痛常**浑然交融**，含蓄蕴藉。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **一生布衣**：未获功名，是南宋中后期典型的**江湖清客**文人代表。\n    - **上《大乐议》**：1197年向朝廷进献音乐理论著作，是其试图以专业才能进入体制的尝试，但未果。\n    - **名流交游**：与**范成大**、**杨万里**、**辛弃疾**、**萧德藻**等当世大家均有交往唱和。\n    - **晚年困顿**：主要资助者张鉴去世后，生活陷入**贫病**，反映了依附型文人的生存困境。\n- 核心要点：\n    - **重点**：其人生轨迹反映了南宋**江南地区**文人交游网络与文化生态。\n    - **重点**：作为**全能型艺术家**（诗词、音乐、书法），其成就体现了宋代文人艺术修养的集成性。\n    - **江湖诗人群像**：姜夔是研究南宋中后期**江湖诗人**群体生活状态与创作特点的关键个案。\n    - **重点**：其词乐贡献（**自度曲**）是宋代音乐文学史不可或缺的一环，具有极高的艺术史价值。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《扬州慢·淮左名都》**（入选多种教材）、《暗香》（旧时月色）、《疏影》（苔枝缀玉）常作为拓展阅读。\n- 核心要点：\n    - **重点**：**清空骚雅**的词风，与辛弃疾的“豪放”并立，代表南宋词的另一种美学高度。\n    - **黍离之悲**：以《扬州慢》为代表，通过今昔对比，抒写对战争破坏的哀痛与对国势的忧虑。\n    - **冷香意象**：善用梅、荷等意象，营造**幽冷**、**清高**的意境，如“冷香飞上诗句”。\n    - **音律精严**：作为音乐家，其自度曲**格律谨严**，声韵和谐，是格律词派的典范。\n    - **重点**：**虚字传神**：擅长运用虚字（如“算”“又”“更”）勾勒意脉，使词意**灵动**而不板滞。\n    - **重点**：**寄托遥深**：个人身世飘零之感（如合肥情事）与家国之痛常**浑然交融**，含蓄蕴藉。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **一生布衣**：未获功名，是南宋中后期典型的**江湖清客**文人代表。\n    - **上《大乐议》**：1197年向朝廷进献音乐理论著作，是其试图以专业才能进入体制的尝试，但未果。\n    - **名流交游**：与**范成大**、**杨万里**、**辛弃疾**、**萧德藻**等当世大家均有交往唱和。\n    - **晚年困顿**：主要资助者张鉴去世后，生活陷入**贫病**，反映了依附型文人的生存困境。\n- 核心要点：\n    - **重点**：其人生轨迹反映了南宋**江南地区**文人交游网络与文化生态。\n    - **重点**：作为**全能型艺术家**（诗词、音乐、书法），其成就体现了宋代文人艺术修养的集成性。\n    - **江湖诗人群像**：姜夔是研究南宋中后期**江湖诗人**群体生活状态与创作特点的关键个案。\n    - **重点**：其词乐贡献（**自度曲**）是宋代音乐文学史不可或缺的一环，具有极高的艺术史价值。\n\n---", "workTexts": {"淡黄柳": "空城晓角，吹垂杨陌。马上单衣寒恻恻。", "鹧鸪天·元夕有所梦": "肥水东流无尽期，当初不合种相思。", "鹧鸪天": "肥水东流无尽期，当初不合种相思。", "元夕有所梦": "肥水东流无尽期，当初不合种相思。", "扬州慢": "过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。", "暗香": "旧时月色，算几番照我，梅边吹笛。", "疏影": "苔枝缀玉，有翠禽小小，枝上同宿。", "除夜自石湖归苕溪": "细草穿沙雪半销，吴宫烟冷水迢迢。", "踏莎行·自沔东来丁未元日至金陵江上感梦": "燕燕轻盈，莺莺娇软，分明又向华胥见。", "踏莎行": "燕燕轻盈，莺莺娇软，分明又向华胥见。", "自沔东来丁未元日至金陵江上感梦": "燕燕轻盈，莺莺娇软，分明又向华胥见。", "一萼红·人日登城有感": "古城阴，有官梅几许，红萼未宜簪。", "一萼红": "古城阴，有官梅几许，红萼未宜簪。", "人日登城有感": "古城阴，有官梅几许，红萼未宜簪。", "白石道人诗说": "3. 著《白石道人诗 n- **意义**：鄱阳是他的水乡起点。少年姜夔在这片浸润着南宋士族文化余韵的土地上诵读诗书，父亲姜噩的琴声与满室藏书是他最早的艺术胎教，奠定了他日后清雅脱俗的词骨与乐感\n\n### 📍 重要地点：沔州（汉阳）\n- **时间**：约1160年代\n- **停留时间**：数年\n- **地点**：古称沔州/汉阳（今湖北省武汉市汉阳区）\n- **事件**：父卒于汉阳任上（约1163年），遂依姊居于汉川县山中（今湖北省孝感市汉川市）。\n- **意义**：身后萧条，几至无以为葬。但这位一生未入仕途的布衣，终以典雅清空之词风、以自度曲的音律创制，把宋词最后的高峰稳稳立在了文学史的长河中，至今无人真正逾越\n\n### 📍 重要地点：合肥\n- **时间**：约1170年代-1180年代（多次游历）\n- **停留时间**：累计数年\n- **地点**：古称庐州合肥（今安徽省合肥市）\n- **事件**：青年时期多次客居合肥，与勾栏中琵琶姐妹结下情缘。\n- **意义**：此段情感经历成为其词中“合肥情事”的核心素材，影响其创作风格。\n- **名篇名句**：《淡黄柳》：“空城晓角，吹垂杨陌。马上单衣寒恻恻。”；《鹧鸪天·元夕有所梦》：“肥水东流无尽期，当初不合种相思。”\n\n### 📍 重要地点：扬州\n- **时间**：约1176年\n- **停留时间**：短期\n- **地点**：古称扬州（今江苏省扬州市）\n- **事件**：初过扬州，目睹战乱后萧条景象，创作名篇《扬州慢·淮左名都》。\n- **意义**：身后萧条至此落幕，棺椁难觅、遗稿散佚，靠友人搜集整理方勉强刊行，然而他创制的词谱、十七首自度曲却如江上明月清辉，照彻后世词坛数百年\n- **名篇名句**：《扬州慢》：“过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。”\n\n### 📍 重要地点：湖州（吴兴）\n- **时间**：约1176年-1180年代\n- **停留时间**：数年\n- **地点**：古称湖州/吴兴（今浙江省湖州市）\n- **事件**：经诗人萧德藻介绍，娶其侄女，并依萧氏居于苕溪白石洞天附近，自号“白石道人”。（注：定居湖州时间约1186年，可能与客居合肥时间有交叉）\n- **意义**：身后萧条，几至无以为葬。但这位一生未入仕途的布衣，终以典雅清空之词风、以自度曲的音律创制，把宋词最后的高峰稳稳立在了文学史的长河中，至今无人真正逾越\n\n### 📍 重要地点：苏州（吴郡）\n- **时间**：约1180年代-1190年代（多次拜访）\n- **停留时间**：短期居留\n- **地点**：古称平江/吴郡（今江苏省苏州市）\n- **事件**：多次拜访退隐名臣、诗人范成大，留下《暗香》《疏影》等咏梅名篇。\n- **意义**：身后萧条至此落幕，棺椁难觅、遗稿散佚，靠友人搜集整理方勉强刊行，然而他创制的词谱、十七首自度曲却如江上明月清辉，照彻后世词坛数百年\n- **名篇名句**：《暗香》：“旧时月色，算几番照我，梅边吹笛。”；《疏影》：“苔枝缀玉，有翠禽小小，枝上同宿。”\n\n### 📍 重要地点：临安（杭州）\n- **时间**：1197年\n- **停留时间**：短期\n- **地点**：古称临安（今浙江省杭州市）\n- **事件**：向朝廷进献《大乐议》《琴瑟考古图》，论雅乐，未被采纳。\n- **意义**：身后萧条，几至无以为葬。但这位一生未入仕途的布衣，终以典雅清空之词风、以自度曲的音律创制，把宋词最后的高峰稳稳立在了文学史的长河中，至今无人真正逾越\n- **名篇名句**：《除夜自石湖归苕溪》：“细草穿沙雪半销，吴宫烟冷水迢迢。”\n\n### 📍 重要地点：金陵（建康）\n- **时间**：约1190年代\n- **停留时间**：短期游历\n- **地点**：古称建康/金陵（今江苏省南京市）\n- **事件**：登临览胜，与友人交游。\n- **意义**：身后萧条，几至无以为葬。但这位一生未入仕途的布衣，终以典雅清空之词风、以自度曲的音律创制，把宋词最后的高峰稳稳立在了文学史的长河中，至今无人真正逾越\n- **名篇名句**：《踏莎行·自沔东来丁未元日至金陵江上感梦》：“燕燕轻盈，莺莺娇软，分明又向华胥见。”\n\n### 📍 重要地点：绍兴（越中）\n- **时间**：约1190年代-1200年代\n- **停留时间**：客居数年\n- **地点**：古称越州/绍兴（今浙江省绍兴市）\n- **事件**：长期客居于鉴湖之畔，得友人张鉴（张平甫）长期资助，生活相对安定。\n- **意义**：身后萧条，几至无以为葬。但这位一生未入仕途的布衣，终以典雅清空之词风、以自度曲的音律创制，把宋词最后的高峰稳稳立在了文学史的长河中，至今无人真正逾越\n- **名篇名句**：《一萼红·人日登城有感》：“古城阴，有官梅几许，红萼未宜簪。”\n\n### 📍 重要地点：杭州（晚年定居）\n- **时间**：约1200年代-1221年\n- **停留时间**：约十余年（存疑）\n- **地点**：古称临安（今浙江省杭州市）\n- **事件**：张鉴去世后（具体年份存疑，约在1200年代后），失去主要资助，生活陷入困顿。晚年多病，靠卖文及友人接济度日。\n- **意义**：身后萧条至此落幕，棺椁难觅、遗稿散佚，靠友人搜集整理方勉强刊行，然而他创制的词谱、十七首自度曲却如江上明月清辉，照彻后世词坛数百年\n\n### 🔴 去世地：杭州\n- **时间**：约公元1221年\n- **停留时间**：直至去世\n- **地点**：古称临安（今浙江省杭州市）\n- **事件**：贫病交加中逝世，无钱安葬，由友人资助，葬于钱塘门外西马塍。\n- **意义**：南宋词宗姜夔的终老之地。他漂泊半生为清客，晚年困顿汉阳，贫病而逝时棺椁赖友资助方得下葬。然而《扬州慢》的黍离之悲、《暗香》梅边孤韵，连同他整理的词乐工尺谱，却在此江城化作不灭回响\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1155年 | 出生地存疑 | 江西省上饶市鄱阳县 | （年龄：1岁）出生地存疑（一说饶州鄱阳，一说饶州德兴）。 |\n| 约1163年 | 沔州（汉阳） | 湖北省武汉市汉阳区 | （年龄：约8岁）父卒于汉阳任上（其父1160年中进士后赴任），随姊居汉川。 |\n| 约1176年 | 扬州 | 江苏省扬州市 | （年龄：约21岁）初过扬州，作《扬州慢》。（注：此后不久可能前往湖州定居） |\n| 约1176-1186年 | 合肥 | 安徽省合肥市 | （年龄：约21-31岁）多次客居合肥，结识琵琶女。（注：此时间段可能与定居湖州有交叉） |\n| 约1186年 | 合肥 | 安徽省合肥市 | （年龄：约31岁）经萧德藻介绍，娶其侄女，定居湖州。（注：此时间点可能与客居合肥末期有交叉） |\n| 1191年 | 苏州（吴郡） | 江苏省苏州市 | （年龄：约36岁）冬，冒雪访范成大于苏州，作《暗香》《疏影》。 |\n| 1197年 |  |  | （年龄：约42岁）向朝廷上《大乐议》，论雅乐。 |\n| 约1190年代-1200年代 | 绍兴（越中） | 浙江省绍兴市 | （年龄：约36-55岁）长期客居绍兴等地，得张鉴资助。 |\n| 1207年 |  |  | （年龄：约52岁）辛弃疾去世，有《汉宫春》次韵词悼念。 |\n| 约1200年代后（具体年份存疑） | 出生地存疑 | 江西省上饶市鄱阳县 | （年龄：约55岁以上（存疑））张鉴卒，失去主要资助，生活日困。（注：此事件发生于晚年定居杭州期间） |\n| 约1221年 | 杭州 | 浙江省杭州市 | （年龄：约66岁）卒于杭州，葬于西马塍。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《扬州慢·淮左名都》**（入选多种教材）、《暗香》（旧时月色）、《疏影》（苔枝缀玉）常作为拓展阅读。\n- 核心要点：\n    - **重点**：**清空骚雅**的词风，与辛弃疾的“豪放”并立，代表南宋词的另一种美学高度。\n    - **黍离之悲**：以《扬州慢》为代表，通过今昔对比，抒写对战争破坏的哀痛与对国势的忧虑。\n    - **冷香意象**：善用梅、荷等意象，营造**幽冷**、**清高**的意境，如“冷香飞上诗句”。\n    - **音律精严**：作为音乐家，其自度曲**格律谨严**，声韵和谐，是格律词派的典范。\n    - **重点**：**虚字传神**：擅长运用虚字（如“算”“又”“更”）勾勒意脉，使词意**灵动**而不板滞。\n    - **重点**：**寄托遥深**：个人身世飘零之感（如合肥情事）与家国之痛常**浑然交融**，含蓄蕴藉。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **一生布衣**：未获功名，是南宋中后期典型的**江湖清客**文人代表。\n    - **上《大乐议》**：1197年向朝廷进献音乐理论著作，是其试图以专业才能进入体制的尝试，但未果。\n    - **名流交游**：与**范成大**、**杨万里**、**辛弃疾**、**萧德藻**等当世大家均有交往唱和。\n    - **晚年困顿**：主要资助者张鉴去世后，生活陷入**贫病**，反映了依附型文人的生存困境。\n- 核心要点：\n    - **重点**：其人生轨
