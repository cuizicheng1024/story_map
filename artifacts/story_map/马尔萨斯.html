  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

**公元纪年**：1766年\n- **停留时间**：童年及青少年时期（约至1784年）\n- **位置**：今英国英格兰萨里郡沃金（Woking）\n- **事迹**：在此地出生并度过童年，接受父亲丹尼尔·马尔萨斯的家庭教育。\n- **意义**：塑造其早期思想，家庭沙龙常有学者到访，为其奠定了自由主义与启蒙思想的基础。\n\n### 📍 重要地点：剑桥大学耶稣学院（Jesus College, Cambridge）\n- **公元纪年**：1784年 - 1788年\n- **停留时间**：4年（大学求学阶段）\n- **位置**：今英国英格兰剑桥郡剑桥市\n- **事迹**：学习古典学、数学和神学，1788年以优异成绩毕业（第九位麦哲伦学者），同年被授予英国国教执事职。\n- **意义**：1793年当选院士后，马尔萨斯将大半生安顿于此。《人口原理》在此历经反复修订，多部再版亦由他在学院的烛光下完成。他虽最终病逝于巴斯，但耶稣学院才是他学术生命真正的归处\n\n### 📍 重要地点：奥尔伯里（Albury）\n- **公元纪年**：1788年 - 1804年\n- **停留时间**：约16年（担任助理牧师期间）\n- **位置**：今英国英格兰萨里郡奥尔伯里（Albury）\n- **事迹**：在父亲的安排下，担任附近教区的助理牧师，履行神职。在此期间，他深入思考人口问题，并于1798年在附近匿名发表《人口原理》第一版。\n- **意义**：这是他思想成熟和著作诞生的关键时期，乡村牧师的生活让他更直接地观察到贫困与人口问题。\n\n### 📍 重要地点：欧洲大陆（旅行考察）\n- **公元纪年**：1799年 - 1802年（间断性旅行）\n- **停留时间**：累计旅行时间约1-2年\n- **位置**：瑞典、挪威、芬兰、俄罗斯、法国、瑞士\n- **事迹**：为收集资料、验证其理论而进行的考察旅行。途中观察了各国的人口、农业和经济状况。\n- **意义**：丰富了其著作的实证材料，促使他大幅扩充《人口原理》，于1803年出版了内容详实的第二版。\n\n### 📍 重要地点：东印度公司海利伯里学院（Haileybury College）\n- **公元纪年**：1805年 - 1834年\n- **停留时间**：29年（直至去世）\n- **位置**：今英国英格兰赫特福德郡海利伯里（Haileybury）\n- **事迹**：1804年结婚。1805年被任命为该校历史、政治经济学和商业教授，这是英国首个政治经济学教授职位。他在此教学、研究，并持续修订《人口原理》（共出六版），参与了关于《谷物法》等经济政策的公开论战。\n- **意义**：这是他职业生涯的核心阶段，稳定的教职使他能系统阐述其经济与人口思想，培养了大批东印度公司职员，其学说得以广泛传播。\n\n### 📍 重要地点：巴斯（Bath）\n- **公元纪年**：1834年（晚年常居及去世地）\n- **停留时间**：晚年部分时间及最终时刻\n- **位置**：今英国英格兰萨默塞特郡巴斯市（Bath）\n- **经过**：1834年12月，马尔萨斯在拜访其妻位于巴斯附近的家族时，因病去世（死因存疑）。\n- **意义**：生命的终点，其遗体被安葬在巴斯修道院（Bath Abbey）的家族墓地。\n\n### 🔴 去世地：巴斯（Bath）\n- **公元纪年**：1834年12月29日\n- **停留时间**：去世前短暂时间\n- **位置**：今英国英格兰萨默塞特郡巴斯市（Bath）\n- **经过**：在巴斯因病去世（死因存疑）。\n- **意义**：1793年当选院士后，马尔萨斯将大半生安顿于此。《人口原理》在此历经反复修订，多部再版亦由他在学院的烛光下完成。他虽最终病逝于巴斯，但耶稣学院才是他学术生命真正的归处\n- **名篇名句**：《人口原理》：“人口，若不加抑制，会按几何级数增长；而生活资料仅按算术级数增长。”\n\n---\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 沃金（Woking） | 英国英格兰萨里郡沃金 | 51.319 | -0.559 |\n| 剑桥大学耶稣学院 | 英国英格兰剑桥郡剑桥市 | 52.206 | 0.121 |\n| 奥尔伯里（Albury） | 英国英格兰萨里郡奥尔伯里 | 51.219 | -0.498 |\n| 海利伯里学院（Haileybury College） | 英国英格兰赫特福德郡海利伯里 | 51.780 | -0.033 |\n| 巴斯（Bath） | 英国英格兰萨默塞特郡巴斯市 | 51.381 | -2.359 |\n## 生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1766 | 萨里郡沃金（Woking） | 英国英格兰萨里郡沃金 | （年龄：0）出生于萨里郡沃金。 |\n| 1784 | 剑桥大学耶稣学院（Jesus College, Cambridge） | 英国英格兰剑桥郡剑桥市 | （年龄：18）进入剑桥大学耶稣学院学习。 |\n| 1788 |  |  | （年龄：22）毕业于剑桥大学，被授予英国国教执事职，开始担任助理牧师。 |\n| 1798 |  |  | （年龄：32）匿名发表《人口原理》第一版，引发广泛关注与争议。 |\n| 1799-1802 |  |  | （年龄：33-36）游历北欧（瑞典、挪威、芬兰）、俄罗斯及西欧（法国、瑞士）等地，收集资料。 |\n| 1803 |  |  | （年龄：37）出版署名的《人口原理》第二版，内容大幅扩充。 |\n| 1804 |  |  | （年龄：38）结婚。 |\n| 1805 | 东印度公司海利伯里学院（Haileybury College） | 英国英格兰赫特福德郡海利伯里 | （年龄：39）被任命为东印度公司海利伯里学院历史与政治经济学教授。 |\n| 1820 |  |  | （年龄：54）出版《政治经济学原理》，阐述其经济观点。 |\n| 1824 |  |  | （年龄：58）当选为英国皇家学会会员。 |\n| 1834 | 巴斯（Bath） | 英国英格兰萨默塞特郡巴斯市 | （年龄：68）12月29日，在巴斯去世。 |\n\n---\n\n## 历史影响\n\n### 对当时的影响\n马尔萨斯的理论在当时极具争议性，他挑战了当时流行的乐观主义社会进步观（如威廉·葛德文的观点）。他的“人口原理”被保守主义者用来反对《济贫法》，认为救济穷人会刺激人口增长，加剧贫困。同时，他与大卫·李嘉图等古典经济学家的论辩，也推动了政治经济学作为一门学科的发展。他的理论直接影响了19世纪英国的社会政策辩论。\n\n### 对后世的影响\n- **人口学奠基**：被视为现代人口学的开创者，“马尔萨斯主义”成为研究人口与资源关系的基础理论框架。\n- **生物学启发**：其关于生存竞争和人口过剩的论述，直接启发了查尔斯·达尔文和阿尔弗雷德·华莱士，为自然选择理论的形成提供了关键思路（具体影响程度有不同学术观点）。\n- **经济学贡献**：作为古典政治经济学家之一，他对“供给过剩”可能性的讨论（与萨伊定律对立）影响了凯恩斯等后世经济学家。\n- **持续争议**：其理论在不同年代被反复讨论和重新诠释，从19世纪的社会改革争论到20世纪的“绿色革命”和当代的环境可持续性议题。\n\n### 历史评价\n- **负面评价**：被批评者（如卡莱尔、马克思）称为“冷酷的牧师”、“人口恶魔”，认为其理论为社会不公和忽视穷人苦难提供了借口。\n- **正面评价**：被赞誉为具有先见之明的学者，其关于资源有限性的警告在环境问题日益突出的今天重新获得重视。\n- **学术评价**：经济学家凯恩斯认为马尔萨斯是第一位剑桥经济学家，其关于有效需求不足的思考具有重要价值。历史学家普遍承认其理论的巨大影响力，无论赞同与否。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**英国工业革命**时期，社会贫富分化加剧，人口增长迅速。\n- **关键事件/贡献**：提出著名的**人口理论**，认为人口增长速度会超过生活资料增长速度。\n- **代表作品/思想**：**《人口原理》**（又名《人口论》）。\n- **常见易混点/对比点**：常与同时期的经济学家**亚当·斯密**、**大卫·李嘉图**一同被提及，但马尔萨斯主要关注**人口问题**，而非纯粹的财富增长或价值理论。\n\n### 高中阶段\n- **时代背景**：**工业资本主义**发展初期，古典政治经济学形成阶段，社会矛盾（如贫困、失业）显现。\n- **关键事件/贡献**：系统阐述“**两个级数**”理论（几何级数 vs 算术级数）；提出“**道德抑制**”概念；参与**《谷物法》** 存废的论战。\n- **代表作品/思想**：**《人口原理》**（多个版本）；《政治经济学原理》（其中反驳萨伊定律，认为存在生产过剩的可能）。\n- **常见易混点/对比点**：\n    - 与**葛德文**的“社会可无限完善”乐观论形成对立。\n    - 其人口理论是**新古典经济学**和**凯恩斯经济学**都曾批判或借鉴的对象。\n    - 对**达尔文进化论**的启发作用是一个重要的跨学科联系点（具体影响程度有不同学术观点）。\n    - “马尔萨斯陷阱”是理解前工业社会经济停滞的一个重要概念。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 马尔萨斯是哪国、哪个时期的学者？（英国，工业革命时期）\n- 他的代表作是什么？（《人口原理》/《人口论》）\n- 他最核心的观点是什么？（人口增长快于生活资料增长，会导致贫困）\n- 他的理论反映了工业革命带来的哪些社会问题？（人口激增、贫富分化、社会矛盾）\n\n### 高中阶段\n- 马尔萨斯人口理论中“两个级数”的具体内容是什么？\n- 什么是“马尔萨斯主义”和“马尔萨斯陷阱”？\n- 马尔萨斯与古典经济学家（如李嘉图）在理论上有何异同？\n- 如何评价马尔萨斯理论在历史上的影响及其在当代的意义？（需辩证分析）\n- 马尔萨斯的思想对达尔文的进化论产生了怎样的影响？（**存疑/说法不一**：具体影响程度和方式有不同学术观点，但启发关系被广泛承认）", "relatedGraph": {"center": {"id": "托马斯·罗伯特·马尔萨斯", "name": "托马斯·罗伯特·马尔萨斯", "file": "托马斯·罗伯特·马尔萨斯.html", "dynasty": "英国工业革命时期（乔治王朝至维多利亚时代初期）", "aliases": [], "birth_year": 1766, "death_year": 1834, "quote": "人口，若不加抑制，会按几何级数增长；而生活资料仅按算术级数增长。", "review": "人口，若不加抑制，会按几何级数增长；而生活资料仅按算术级数增长。", "foreign_name": "", "main_role_label": "", "birthplace": "英国英格兰萨里郡多尔金附近（Rookery）", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "托马斯·罗伯特·马尔萨斯", "name": "托马斯·罗伯特·马尔萨斯", "file": "托马斯·罗伯特·马尔萨斯.html", "dynasty": "英国工业革命时期（乔治王朝至维多利亚时代初期）", "aliases": [], "birth_year": 1766, "death_year": 1834, "quote": "人口，若不加抑制，会按几何级数增长；而生活资料仅按算术级数增长。", "review": "人口，若不加抑制，会按几何级数增长；而生活资料仅按算术级数增长。", "foreign_name": "", "main_role_label": "", "birthplace": "英国英格兰萨里郡多尔金附近（Rookery）", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, {"id": "马尔萨斯", "name": "马尔萨斯", "file": "马尔萨斯.html", "dynasty": "英国工业革命时期（乔治王朝至维多利亚时代初期）", "aliases": [], "birth_year": 1766, "death_year": 1834, "quote": "马尔萨斯人口理论", "review": "", "foreign_name": "", "main_role_label": "其他", "birthplace": "英国英格兰萨里郡多尔金附近", "birthplace_modern": "Rookery", "domain_tags": [], "has_story": true, "relationLabel": "宗亲", "sourceType": "markdown", "confidence": null, "isCenter": false}, {"id": "雪莱", "name": "雪莱", "file": "雪莱.html", "dynasty": "英国浪漫主义时期（18世纪末至19世纪初）", "aliases": [], "birth_year": 1792, "death_year": 1822, "quote": "如果冬天来了，春天还会远吗？", "review": "", "foreign_name": "", "main_role_label": "诗人", "birthplace":
