/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

markdown": "# 阿尔丰斯·都德\n\n## 人物档案\n\n### 基本信息\n- **姓名**：阿尔丰斯·都德\n- **外文名**：Alphonse Daudet\n- **时代**：19世纪（法国第二帝国与第三共和国时期）\n- **出生**：公元1840年5月13日，法国尼姆（今法国奥克西塔尼大区加尔省省会尼姆）\n- **去世**：公元1897年12月16日，法国巴黎（今法国法兰西岛大区巴黎市）\n- **享年**：57岁\n- **主要身份**：小说家、剧作家\n- **历史地位**：法国现实主义文学的重要代表，以描写普法战争的爱国主义短篇小说闻名于世。\n- **主要成就**：\n    1. 创作《最后一课》《柏林之围》等世界文学史上脍炙人口的爱国主义短篇小说。\n    2. 著有长篇小说《小东西》《达拉斯贡的达达兰》等，展现法国社会风貌。\n    3. 作为“五人聚餐会”成员，参与左拉、莫泊桑等作家的自然主义文学团体活动。\n\n### 生平概述\n都德生于法国南部尼姆一个破落商人家庭，童年在普罗旺斯度过，这段经历成为其日后创作的灵感源泉。1857年赴巴黎开始文学生涯。1870年普法战争爆发，他的军旅见闻催生了《磨坊书简》中的经典篇章，以含泪的微笑描绘了战争中的民族情感。他一生笔耕不辍，作品风格融合了幽默、讽刺与深情，既关注小人物的命运，也批判社会现实，是连接浪漫主义与自然主义的重要作家。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从法国南部尼姆、普罗旺斯地区出发，北上巴黎求学与成名，其间游历阿尔及利亚、英国、俄国等地。\n- ⏱️ **时间跨度**：1840年 - 1897年（共57年）\n- 📍 **地理范围**：主要覆盖法国南部、巴黎及周边地区，延伸至北非阿尔及利亚、英国伦敦、俄国圣彼得堡。\n- 🌟 **重要节点数量**：9个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 📍 出生地：尼姆\n- **时间**：1840年\n- **停留时间**：童年早期（约至1849年）\n- **地点**：法国尼姆（今法国奥克西塔尼大区加尔省省会尼姆）\n- **事件**：出生于一个丝绸作坊主家庭，后因家庭破产而生活陷入困顿。\n- **意义**：其童年记忆与法国南方的风土人情，构成了他文学创作中温暖而哀愁的底色。\n\n### 📍 重要地点：普罗旺斯地区（阿莱斯、普里瓦）\n- **时间**：19世纪40年代末至50年代中期\n- **停留时间**：约7-8年\n- **地点**：法国普罗旺斯地区阿莱斯、普里瓦（今法国奥克西塔尼大区加尔省阿莱斯、普里瓦）\n- **事件**：随家庭迁居，在此度过少年时光，感受浓郁的南方乡土气息。\n- **意义**：普罗旺斯的阳光、风车、葡萄园成为他日后《磨坊书简》的核心意象与故事背景。\n- **名篇名句**：《磨坊书简》：从磨坊的窗口望去，可以看见整个罗纳河谷……\n\n### 📍 重要地点：里昂\n- **时间**：19世纪50年代中期\n- **停留时间**：约1-2年\n- **地点**：法国里昂（今法国奥弗涅-罗纳-阿尔卑斯大区首府里昂）\n- **事件**：在里昂的中学就读，并开始尝试写作。\n- **意义**：1880年代后，都德的作品被大量译入俄文，托尔斯泰亲笔致信与他探讨小说技法，使阿莱斯与普里瓦所代表的南方意象在遥远的俄国读者心中复活；这片土地见证了一位法国作家与俄国文豪之间罕见的文学对话\n\n### 📍 重要地点：巴黎\n- **时间**：1857年 - 1897年（主要居住地）\n- **停留时间**：断续居住约40年\n- **地点**：法国巴黎（今法国法兰西岛大区巴黎市）\n- **事件**：1857年投奔兄长，在巴黎开始艰苦的文学创作生涯；1866年以《磨坊书简》成名；1870年参加普法战争；后成为文坛知名作家，常参与文学沙龙。\n- **意义**：巴黎是他文学事业的起点与中心，在此创作了绝大多数重要作品，并融入了以左拉为核心的文学圈子。\n- **名篇名句**：《最后一课》：只要牢牢记住他们的语言，就好像拿着一把打开监狱大门的钥匙。\n\n### 📍 重要地点：阿尔及尔\n- **时间**：1861年左右\n- **停留时间**：数月\n- **地点**：法属阿尔及利亚阿尔及尔（今阿尔及利亚民主人民共和国阿尔及尔）\n- **事件**：因健康原因前往北非疗养，并担任私人秘书。\n- **意义**：北非的异域风光为他提供了新的创作素材，也影响了其写作风格的某些方面。\n\n### 📍 重要地点：尚普罗塞（Champrosay）\n- **时间**：19世纪70年代至90年代\n- **停留时间**：夏季常居\n- **地点**：法国尚普罗塞（今法国埃松省）\n- **事件**：在巴黎郊外购置别墅，作为夏季避暑和写作的安静居所。\n- **意义**：1880年代后，都德的作品被大量译入俄文，托尔斯泰亲笔致信与他探讨小说技法，使阿莱斯与普里瓦所代表的南方意象在遥远的俄国读者心中复活；这片土地见证了一位法国作家与俄国文豪之间罕见的文学对话\n\n### 📍 重要地点：伦敦\n- **时间**：19世纪70-80年代\n- **停留时间**：短期访问\n- **地点**：英国伦敦（今英国英格兰大伦敦）\n- **事件**：进行文学旅行与访问。\n- **意义**：1880年代后，都德的作品被大量译入俄文，托尔斯泰亲笔致信与他探讨小说技法，使阿莱斯与普里瓦所代表的南方意象在遥远的俄国读者心中复活；这片土地见证了一位法国作家与俄国文豪之间罕见的文学对话\n\n### 📍 重要地点：圣彼得堡\n- **时间**：1886年\n- **停留时间**：数周\n- **地点**：俄国圣彼得堡（今俄罗斯联邦圣彼得堡市）\n- **事件**：应俄国文学界邀请访问，受到热烈欢迎。\n- **意义**：都德将阿莱斯与普里瓦的山色蝉声酿进《磨坊书简》，使普罗旺斯的方言与阳光凝结为持久的文学回响；与俄国文豪屠格涅夫的相知之交，更让这些南方故事远播俄国书桌，化作十九世纪末法俄文化交流的一座独特桥梁\n\n### 📍 去世地：巴黎\n- **时间**：1897年12月16日\n- **停留时间**：长期居住直至去世\n- **地点**：法国巴黎（今法国法兰西岛大区巴黎市）\n- **事件**：因长期患病，在巴黎的寓所中逝世。\n- **意义**：结束了其作为19世纪法国重要作家的一生，葬于巴黎拉雪兹神父公墓。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1840 | 尼姆 | 法国奥克西塔尼大区加尔省省会尼姆 | （年龄：0岁）出生于法国尼姆。 |\n| 约1849 | 普罗旺斯地区（阿莱斯、普里瓦） |  | （年龄：约9岁）随家庭迁居普罗旺斯地区。 |\n| 1857 | 巴黎 | 法国法兰西岛大区巴黎市 | （年龄：17岁）前往巴黎投奔兄长，开始独立谋生与写作。 |\n| 1861 | 阿尔及尔 | 阿尔及利亚民主人民共和国阿尔及尔 | （年龄：21岁）前往阿尔及尔疗养。 |\n| 1866 |  |  | （年龄：26岁）《磨坊书简》出版，一举成名。 |\n| 1868 |  |  | （年龄：28岁）长篇小说《小东西》出版，获得广泛声誉。 |\n| 1870 |  |  | （年龄：30岁）普法战争爆发，应征入伍，战争经历深刻影响其创作。 |\n| 约1870年代初（具体时间存疑） |  |  | （年龄：约30-33岁）创作以普法战争为背景的短篇小说《柏林之围》（创作时间存疑）。 |\n| 1873 |  |  | （年龄：33岁）短篇小说集《月曜故事集》出版，收录《最后一课》。 |\n| 1874 |  |  | （年龄：34岁）长篇小说《达拉斯贡的达达兰》首部出版，塑造了著名的喜剧人物形象。 |\n| 1886 | 圣彼得堡 | 俄罗斯联邦圣彼得堡市 | （年龄：46岁）访问俄国圣彼得堡。 |\n| 1897 | 巴黎 | 法国法兰西岛大区巴黎市 | （年龄：57岁）12月16日在巴黎逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《最后一课》**（又译《最后一课》）、**《柏林之围》**。\n- 核心要点：\n    - **重点**：**《最后一课》** 通过一个阿尔萨斯孩子的视角，描写了普法战争后法国被迫割让阿尔萨斯-洛林，学校禁教法语的最后一堂法语课，深刻表现了**爱国主义**与**民族情感**。\n    - **重点**：小说采用**第一人称**（小弗郎士）的**儿童视角**进行叙述，使故事显得格外真实、感人，增强了艺术感染力。\n    - **重点**：作品中对**韩麦尔先生**的刻画，尤其是他写下“法兰西万岁”并做手势宣布下课的场景，成为文学史上表现**民族气节**的经典画面。\n    - 小说以小见大，通过一堂课、一个小镇的变迁，反映了重大的历史事件与民族命运。\n    - **《柏林之围》** 则通过一个虚构的故事，将法军在普法战争中的惨败与一位老军人（儒夫上校）的爱国主义幻想交织，形成了强烈的**悲剧性反讽**效果。\n    - 都德的战争小说风格独特，常于悲愤中蕴含**温情**与**幽默**，被称为“含泪的微笑”。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：都德的创作高峰与**普法战争**（1870-1871）及其后果直接相关，这场战争导致法国割让**阿尔萨斯-洛林**，是其爱国主义小说的历史背景。\n    - 他是19世纪下半叶法国**现实主义文学**与**自然主义文学**潮流中的重要作家，与**左拉**、**莫泊桑**交往密切。\n    - 其作品反映了**法兰西第二帝国**至**第三共和国**初期法国社会的变迁，尤其是南方乡土社会与巴黎都市生活的对比。\n- 核心要点：\n    - **重点**：在文学史上，都德被定位为一位善于从日常生活中提炼诗意与情感的**现实主义作家**，其作品具有鲜明的**民族意识**与**人文关怀**。\n    - **重点**：**《最后一课》** 在中国等国家被长期选入语文教材，使其成为在中国知名度最高的法国作家之一，其作品成为进行**爱国主义教育**的经典文本。\n    - **重点**：他的创作题材广泛，既有反映**民族苦难**的严肃作品，也有讽刺资产阶级庸俗生活的喜剧（如《达拉斯贡的达达兰》），展现了多方面的才华。\n    - 都德的文学风格融合了**南方人的热情**、**细腻的观察力**与**温和的讽刺**，在法国文学史上独树一帜。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：尼姆 | 尼姆（法国） | 43.8367 | 4.3601 |\n| 重要地点：普罗旺斯地区（阿莱斯、普里瓦） | 阿莱斯（法国） | 44.1250 | 4.0810 |\n| 重要地点：里昂 | 里昂（法国） | 45.7640 | 4.8357 |\n| 重要地点：巴黎 | 巴黎（法国） | 48.8566 | 2.3522 |\n| 重要地点：阿尔及尔 | 阿尔及尔（阿尔及利亚） | 36.7538 | 3.0588 |\n| 重要地点：尚普罗塞（Champrosay） | 尚普罗塞（法国） | 48.7392 | 2.2828 |\n| 重要地点：伦敦 | 伦敦（英国） | 51.5074 | -0.1278 |\n| 重要地点：圣彼得堡 | 圣彼得堡（俄罗斯） | 59.9343 | 30.3351 |\n| 去世地：巴黎 | 拉雪兹神父公墓（巴黎） | 48.8613 | 2.3933 |\n| :--- | :--- | :--- |\n| 尼姆（法国） | 43.8367 | 4.3601 |\n| 阿莱斯（法国） | 44.1250 | 4.0810 |\n| 里昂（法国） | 45.7640 | 4.8357 |\n| 巴黎（法国） | 48.8566 | 2.3522 |\n| 阿尔及尔（阿尔及利亚） | 36.7538 | 3.0588 |\n| 尚普罗塞（法国） | 48.7392 | 2.2828 |\n| 伦敦（英国） | 51.5074 | -0.1278 |\n| 圣彼得堡（俄罗斯） | 59.9343 | 30.3351 |\n| 拉雪兹神父公墓（巴黎） | 48.8613 | 2.3933 |", "relatedGraph": {"center": {"id": "阿尔丰斯·都德", "name": "阿尔丰斯·都德", "file": "阿尔丰斯·都德.html", "dynasty": "19世纪（法国第二帝国与第三共和国时期）", "aliases": [], "birth_year": 1840, "death_year": 1897, "quote": "从磨坊的窗口望去，可以看见整个罗纳河谷……", "review": "从磨坊的窗口望去，可以看见整个罗纳河谷……", "foreign_name": "", "main_role_label": "", "birthplace": "法国尼姆（今法国奥克西塔尼大区加尔省省会尼姆）", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "阿尔丰斯·都德", "name": "阿尔丰斯·都德", "file": "阿尔丰斯·都德.html", "dynasty": "19世纪（法国第二帝国与第三共和国时期）", "aliases": [], "birth_year": 1840, "death_year": 1897, "quote": "从磨坊的窗口望去，可以看见整
