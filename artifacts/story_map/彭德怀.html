  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

 "quotes": [], "quote_policy": "summary_only"}, "给毛泽东的电报": {"title": "给毛泽东的电报", "aliases": [], "authors": ["彭德怀"], "related_people": ["彭德怀"], "source_pages": ["彭德怀"], "era": "近现代", "genre": "电报", "one_liner": "抗美援朝战争期间志愿军司令员彭德怀致毛泽东的军情电报，以质朴直接的语言如实报告前线极端艰苦条件，体现实事求是的品格与对战士的深切关怀。", "summary": "彭德怀，原名得华，出身湖南湘潭贫苦农家", "quote": "饥无粮，寒无衣。", "quotes": ["饥无粮，寒无衣。"], "quote_policy": "preferred"}}, "markdown": "# 彭德怀\n\n## 人物档案\n\n### 基本信息\n- **姓名**：彭德怀\n- **别名**：石穿、得华（原名）\n- **时代**：近现代\n- **出生**：公元1898年10月24日，湖南省湘潭县彭家围子\n- **去世**：公元1974年11月29日，北京市\n- **享年**：76岁\n- **主要身份**：军事家、政治家、中华人民共和国开国元帅\n- **历史地位**：中国共产党、中华人民共和国和中国人民解放军的卓越领导人之一，为新中国的建立与建设立下不朽功勋。\n- **主要成就**：领导平江起义，创建红五军；参与指挥长征，到达陕北；指挥八路军发动百团大战；指挥西北野战军解放大西北；担任中国人民志愿军司令员兼政治委员，指挥抗美援朝战争。\n\n### 生平概述\n彭德怀，原名得华，出身湖南湘潭贫苦农家。早年投身湘军，后加入中国共产党，于1928年领导平江起义，开创湘鄂赣革命根据地。在中央苏区反“围剿”和长征中屡建奇功。抗日战争时期，作为八路军副总指挥，指挥了著名的百团大战。解放战争时期，率西北野战军以弱胜强，解放大西北。新中国成立后，临危受命出任志愿军司令员，率部抗美援朝，保家卫国。后任国务院副总理兼国防部长等职。他一生耿直刚烈，为民请命，是深受人民爱戴的革命家和军事统帅。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及中国湖南、江西、陕西、山西、河北、北京、朝鲜等多地，从革命战争到国防建设。\n- ⏱️ **时间跨度**：1898年 - 1974年，共76年。\n- 📍 **地理范围**：主要覆盖中国中南、西北、华北地区，并延伸至朝鲜半岛。\n- 🌟 **重要节点数量**：12个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：湘潭县彭家围子\n- **时间**：1898年\n- **停留时间**：约16年\n- **地点**：湖南省湘潭县彭家围子\n- **事件**：出生于贫苦农民家庭，幼年读过两年私塾，后因丧母辍学，做过牧童、矿工。\n- **意义**：湘中乌石峰下贫苦窑工之子，幼丧慈母、备受继母冷眼，少年即入煤窑做童工，目睹矿工血泪。苦难在少年脊梁里铸就一副硬骨，也深埋下同情劳苦大众的悲悯底色\n\n### 📍 重要地点：湘军驻地（湖南多地）\n- **时间**：1916年 - 1922年\n- **停留时间**：约6年\n- **地点**：湖南省长沙市等地\n- **事件**：加入湘军，从二等兵做起，参与了护法战争等军阀混战。在军队中结识进步人士，开始接触革命思想。\n- **意义**：彭德怀十八岁入湘军，在湖南各地驻防六年间从列兵升至班长。旧军队的腐败令他痛心，救国救民的志向由此萌生，为日后的平江起义埋下伏笔\n\n### 📍 重要地点：陆军军官学校（湖南讲武堂）\n- **时间**：1922年 - 1923年\n- **停留时间**：约1年\n- **地点**：湖南省长沙市（湖南陆军讲武堂）\n- **事件**：考入湖南陆军军官讲武堂学习军事。\n- **意义**：接受了系统的军事理论教育，为日后卓越的军事指挥才能打下基础。\n\n### 📍 重要地点：平江\n- **时间**：1928年7月\n- **停留时间**：起义后不久即转移\n- **地点**：平江县（今湖南省岳阳市平江县）\n- **事件**：与滕代远、黄公略等发动和领导平江起义，成立中国工农红军第五军。\n- **意义**：标志着其正式成为红军的重要创建者之一，开辟了湘鄂赣革命根据地。\n\n### 📍 重要地点：井冈山与中央苏区\n- **时间**：1928年12月 - 1934年10月\n- **停留时间**：约6年\n- **地点**：井冈山（主体位于今江西省吉安市井冈山市，部分区域涉及湖南省株洲市炎陵县等地）；瑞金（今江西省瑞金市）\n- **事件**：率红五军上井冈山与朱毛红军会师。后在中央苏区历次反“围剿”中担任重要指挥职务，屡立战功。\n- **意义**：彭德怀十八岁入湘军，在湖南各地驻防六年间从列兵升至班长。旧军队的腐败令他痛心，救国救民的志向由此萌生，为日后的平江起义埋下伏笔\n\n### 📍 重要地点：陕北吴起镇\n- **时间**：1935年10月\n- **停留时间**：短暂\n- **地点**：吴起镇（今陕西省延安市吴起县）\n- **事件**：率红一方面军主力（陕甘支队）抵达此地，结束长征。\n- **意义**：彭德怀十八岁入湘军，在湖南各地驻防六年间从列兵升至班长。旧军队的腐败令他痛心，救国救民的志向由此萌生，为日后的平江起义埋下伏笔大本营奠基西北。\n\n### 📍 重要地点：太行山区（八路军总部）\n- **时间**：1937年 - 1943年\n- **停留时间**：约6年\n- **地点**：晋东南地区（指挥部曾设于今山西省长治市武乡县等地）\n- **事件**：任八路军副总司令，坐镇太行，指挥华北敌后抗战。1940年组织指挥了著名的百团大战。\n- **意义**：领导华北抗日根据地军民沉重打击了日军，坚定了全国抗战信心。\n- **相关记述（存疑）**：关于百团大战的动员讲话，有“这一仗必须打，打出八路军的威风，打出中国人民的志气！”等说法，但具体出处及原文存疑，现存多种版本。\n\n### 📍 重要地点：延安\n- **时间**：1943年 - 1947年\n- **停留时间**：约4年\n- **地点**：延安（今陕西省延安市）\n- **事件**：返回延安，参与中央领导工作。在延安整风运动、中共七大上发挥重要作用。1947年国民党军重点进攻陕北时，临危受命指挥西北野战军。\n- **意义**：在中央层面参与决策，并直接指挥了保卫延安的战役。\n\n### 📍 重要地点：朝鲜半岛（志愿军总部）\n- **时间**：1950年10月 - 1952年（主要指挥时期）\n- **停留时间**：约2年\n- **地点**：朝鲜民主主义人民共和国桧仓郡等地\n- **事件**：出任中国人民志愿军司令员兼政治委员，指挥志愿军入朝作战，连续发动五次战役，将以美国为首的“联合国军”打回三八线附近。\n- **意义**：赢得了抗美援朝战争的伟大胜利，捍卫了新中国安全，提高了中国的国际威望。\n- **相关记述（存疑）**：有电文提及前线“饥无粮，寒无衣”等困难状况，但具体电文内容及出处存疑，现存多种版本。\n\n### 📍 重要地点：北京（中南海）\n- **时间**：1952年 - 1959年\n- **停留时间**：约7年\n- **地点**：北京市（中南海）\n- **事件**：主持中央军委日常工作，任国务院副总理兼国防部长，致力于国防现代化和军队正规化建设。1959年在庐山会议上受到错误批判。\n- **意义**：彭德怀十八岁入湘军，在湖南各地驻防六年间从列兵升至班长。旧军队的腐败令他痛心，救国救民的志向由此萌生，为日后的平江起义埋下伏笔\n\n### 📍 重要地点：北京（吴家花园、监护地）\n- **时间**：1959年 - 1974年\n- **停留时间**：约15年\n- **地点**：北京市（挂甲屯吴家花园；后被监护地点）\n- **事件**：被免职后在北京西郊挂甲屯吴家花园学习、劳动。后遭长期监禁，身患重病。\n- **意义**：在逆境中仍坚持真理，心系国家和人民，度过了悲壮的晚年。\n\n### 🔴 去世地：北京\n- **时间**：1974年11月29日\n- **停留时间**：长期\n- **地点**：北京市\n- **事件**：因患直肠癌，在监护中病逝。\n- **意义**：一代元帅含冤逝世。1978年中共十一届三中全会为其平反昭雪，恢复名誉。骨灰安放于八宝山革命公墓。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1898 | 湘潭县彭家围子 | 湖南省湘潭县彭家围子 | （年龄：0）出生于湖南省湘潭县。 |\n| 1916 |  |  | （年龄：18）加入湘军。 |\n| 1922 | 陆军军官学校（湖南讲武堂） | 湖南省长沙市 | （年龄：24）考入湖南陆军讲武堂。 |\n| 1928 | 平江 | 湖南省岳阳市平江县 | （年龄：30）领导平江起义，加入中国共产党，创建红五军。率部上井冈山与朱毛红军会师。 |\n| 1934-1935 |  |  | （年龄：36-37）参加长征，率部到达陕北。 |\n| 1937-1945 |  |  | （年龄：39-47）任八路军副总司令，指挥华北抗战，组织百团大战。 |\n| 1947-1949 |  |  | （年龄：49-51）任西北野战军司令员，指挥解放大西北。 |\n| 1950-1953 |  |  | （年龄：52-55）任中国人民志愿军司令员兼政委，指挥抗美援朝战争。 |\n| 1954-1959 |  |  | （年龄：56-61）任国务院副总理兼国防部长，主持军委日常工作。 |\n| 1959 |  |  | （年龄：61）庐山会议后被免职。 |\n| 1974 | 北京 | 北京市 | （年龄：76）在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《百团大战》**（相关历史记述）、**《给毛泽东的电报》**（选段）\n- 核心要点：\n    - **重点**：相关记述中提及前线“饥无粮，寒无衣”等困难状况，以极其**质朴**、**直接**的语言，真实反映了前线极端艰苦的条件，体现了彭德怀**实事求是**、敢于直言的品格。\n    - **重点**：其文字风格**刚健质朴**，**不尚空谈**，具有强烈的**纪实性**和**感染力**，是革命现实主义文学的典型材料。\n    - 通过历史记述学习**百团大战**的**战略意义**：它是抗战期间中国军队主动出击日军的最大规模战役，**振奋**了全国军民的抗战信心。\n    - 体会彭德怀作为**军事统帅**的**担当精神**与对战士的**深厚感情**，其相关记述是**情感**与**事实**结合的典范。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1928年领导**平江起义**，是创建中国工农红军和开辟**湘鄂赣革命根据地**的关键事件之一。\n    - **重点**：抗日战争时期，作为**八路军**副总司令，指挥了**百团大战**，这是敌后战场由游击战向**运动战**转变的重要尝试，有力打击了日军的“囚笼政策”。\n    - **重点**：1950年出任**中国人民志愿军**司令员，指挥**抗美援朝**战争，取得伟大胜利，打出了国威军威。\n    - 1959年**庐山会议**，因对“大跃进”和人民公社化运动提出批评而遭到错误批判，是党史上的重大事件。\n- 核心要点：\n    - **重点**：彭德怀是**人民军队**的主要缔造者和领导人之一，其军事生涯贯穿**土地革命战争**、**抗日战争**、**解放战争**和**抗美援朝战争**，功勋卓著。\n    - **重点**：他一生**刚正不阿**，**实事求是**，敢于为民请命、坚持真理，体现了共产党人的**崇高品格**。\n    - **重点**：其历史命运与新中国成立后的**党内政治生活**、**社会主义建设道路的探索**紧密相关，1978年后的**平反**是拨乱反正的重要标志。\n    - 作为**国防部长**，他为新中国**国防现代化**和**军队正规化**建设作出了奠基性贡献。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：湘潭县彭家围子 | 湖南省湘潭县彭家围子 | 27.800 | 112.900 |\n| 重要地点：湘军驻地（湖南多地） | 湖南省长沙市（湖南陆军讲武堂旧址） | 28.230 | 112.940 |\n| 重要地点：陆军军官学校（湖南讲武堂） | 湖南省平江县 | 28.702 | 113.582 |\n| 重要地点：平江 | 江西省井冈山市 | 26.748 | 114.163 |\n| 重要地点：井冈山与中央苏区 | 江西省瑞金市 | 25.885 | 116.027 |\n| 重要地点：陕北吴起镇 | 陕西省延安市吴起县 | 36.927 | 108.176 |\n| 重要地点：太行山区（八路军总部） | 山西省武乡县（八路军总部旧址） | 36.833 | 112.865 |\n| 重要地点：延安 | 陕西省延安市 | 36.595 | 109.490 |\n| 重要地点：朝鲜半岛（志愿军总部） | 朝鲜桧仓郡（中国人民志愿军司令部旧址） | 39.033 | 126.283 |\n| 重要地点：北京（中南海） | 北京市（中南海） | 39.916 | 116.383 |\n| 重要地点：北京（吴家花园、监护地） | 北京市海淀区挂甲屯（吴家花园） | 39.993 | 116.293 |\n| 去世地：北京 | 北京市（八宝山革命公墓） | 39.908 | 116.238 |\n| :--- | :
