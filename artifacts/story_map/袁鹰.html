  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

1e40af","markers": {"normal": {"color": "#3498db"},"birth": {"color": "#2ecc71"},"death": {"color": "#e74c3c"}}},"textbookPoints": "### 初中阶段\n- **时代背景**：**新中国成立后**，社会主义建设时期。\n- **关键事件/贡献**：作为**当代著名散文家**，其作品被选入语文课本，是学生学习**托物言志**、**借景抒情**写作手法的重要范文。\n- **代表作品/思想**：**《白杨》**（通过赞美白杨树，歌颂**北方农民**、**哨兵**以及**中华民族朴质、坚强、力求上进的精神**）。\n- **常见易混点/对比点**：与**茅盾**的《白杨礼赞》对比（同写白杨，但时代背景、具体象征内涵和写作风格有差异）（存疑/说法不一）。\n\n### 高中阶段\n- **时代背景**：**20世纪中国社会变革**与**新中国文学发展**脉络。\n- **关键事件/贡献**：了解其作为**《人民日报》文艺部**重要编辑，在**当代文学史**上的组织与推动作用。\n- **代表作品/思想**：散文集**《风帆》**、**《秋水》**等，体会其散文**形散神聚**、**注重意境**的特点。\n- **常见易混点/对比点**：与**杨朔**、**刘白羽**等同时代散文家的风格对比（袁鹰风格更显**平实、亲切、含蓄**）（存疑/说法不一）。\n\n---","examPoints": "### 初中阶段考点\n1.  **文学常识**：袁鹰，当代作家、**儿童文学家**。原名田钟洛。\n2.  **课文理解**：《白杨》一文的**中心思想**（借物喻人，歌颂奉献精神）。\n3.  **写作手法**：识别并分析《白杨》中的**象征手法**（白杨象征北方军民）。\n4.  **语言赏析**：赏析《白杨》中描写白杨树外形和品格的**关键语句**。\n5.  **拓展对比**：（存疑/说法不一）与茅盾《白杨礼赞》在**写作目的**和**情感基调**上的异同。\n\n### 高中阶段考点\n1.  **文学史定位**：袁鹰在**中国当代散文史**上的地位与风格特点。\n2.  **作品风格**：概括其散文**清新、真挚、富有诗意**的整体风格。\n3.  **编辑贡献**：了解其在《人民日报》文艺部工作对**当代文学发展**的贡献。\n4.  **主题深化**：理解其作品中贯穿的**家国情怀**与**时代精神**。\n5.  **比较阅读**：（存疑/说法不一）将袁鹰的散文与**杨朔的“诗化散文”**、**刘白羽的“战歌体散文”**进行特点比较。","workTexts": {"白杨": "当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？","筏子": "黄河滚滚。即使这儿只是上游，还没有具有一泻千里的规模，但它那万马奔腾、浊浪排空的气概，完全足以使人胆惊心悸。","人民日报": "长期主持《人民日报》文艺部工作，培养了众多文学新人","井冈翠竹": "“井冈山的竹子，是革命的竹子！”","小兵的故事": "意义：他生于嘉定、卒于沪上，从童年书桌到百岁书房，这座城市完整地收容了他的一生。","白杨礼赞": "常见易混点/对比点：与茅盾的《白杨礼赞》对比（同写白杨，但时代背景、具体象征内涵和写作风格有差异）（存疑/说法不一）。"},"workSummaries": {"白杨": {"title": "白杨","aliases": [],"authors": ["袁鹰"],"related_people": ["袁鹰"],"source_pages": ["袁鹰"],"era": "现当代","genre": "散文","one_liner": "袁鹰创作的经典散文，借白杨树的朴质挺拔、坚强不屈象征北方农民、边疆哨兵及中华民族的奋进精神，是托物言志的散文典范。","summary": "当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？","quote": "当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？","quotes": ["当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征 苏淮安出生，至上海求学与初涉文坛，最终在北京长期工作与生活。\n- ⏱️ **时间跨度**：1924年—2023年，共计约99年。\n- 📍 **地理范围**：主要活动于江苏、上海、浙江、北京等地。\n- 🌟 **重要节点数量**：核心地点约7个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：淮安\n- **公元纪年**：1924年\n- **停留时间**：童年时期\n- **位置**：淮安（今江苏省淮安市）\n- **事迹**：在此度过童年，接受早期教育。\n- **意义**：生命的起点，江南水乡的文化氛围为其日后文学创作中的细腻情感奠定了基础。\n\n### 📍 重要地点：上海\n- **公元纪年**：1930年代末—1950年代初\n- **停留时间**：青少年及青年时期，约十余年\n- **位置**：上海（今上海市）\n- **事迹**：在上海读中学和大学（之江大学教育系）；参加抗日救亡学生运动；1945年加入中国共产党；开始以“袁鹰”等笔名发表作品；担任《世界晨报》《联合晚报》副刊编辑。\n- **意义**：其文学生涯的起点和革命思想的形成地，在此积累了丰富的编辑与创作经验。\n- **名篇名句**：此时期作品多反映国统区社会现实与青年心声。\n\n### 📍 重要地点：杭州\n- **公元纪年**：1940年代\n- **停留时间**：大学求学阶段（部分时间）\n- **位置**：杭州（今浙江省杭州市）\n- **事迹**：曾就读于之江大学（该校曾于杭州办学，具体就读地点存疑）。\n- **意义**：从意气风发的青年学子到白发皤然的老作家，袁鹰最终在这座与他人生深度缠绕的城市安然长眠，他留下的童话、诗篇与报人风骨，如黄浦江畔的春雨润物无声，却从未真正离去\n\n### 📍 重要地点：北京\n- **公元纪年**：1953年—2023年\n- **停留时间**：约70年\n- **位置**：北京（今北京市）\n- **事迹**：1953年调入《人民日报》社，长期主持文艺部工作；在此期间创作了《白杨》《筏子》《小站》《渡口》等大量经典散文与儿童文学作品；参与众多文学活动，担任中国作家协会理事等职。\n- **意义**：从意气风发的青年学子到白发皤然的老作家，袁鹰最终在这座与他人生深度缠绕的城市安然长眠，他留下的童话、诗篇与报人风骨，如黄浦江畔的春雨润物无声，却从未真正离去\n- **名篇名句**：《白杨》：“白杨树实在不是平凡的，我赞美白杨树！”；《筏子》：“黄河滚滚。即使这儿只是上游，还没有具有一泻千里的规模，但它那万马奔腾、浊浪排空的气概，完全足以使人胆惊心悸。”\n\n### 📍 重要地点：井冈山\n- **公元纪年**：1960年代\n- **停留时间**：短期访问、体验生活\n- **位置**：井冈山（今江西省吉安市井冈山市）\n- **事迹**：深入革命老区采访、体验生活。\n- **意义**：革命传统教育为其创作注入了新的主题与激情，写下了歌颂革命精神的篇章。\n- **名篇名句**：代表作品《井冈翠竹》常被引用的句子：“井冈山的竹子，是革命的竹子！”（具体引文存疑）。\n\n### 📍 重要地点：延安\n- **公元纪年**：1960年代\n- **停留时间**：短期访问\n- **位置**：延安（今陕西省延安市）\n- **事迹**：访问革命圣地，追寻红色足迹。\n- **意义**：从意气风发的青年学子到白发皤然的老作家，袁鹰最终在这座与他人生深度缠绕的城市安然长眠，他留下的童话、诗篇与报人风骨，如黄浦江畔的春雨润物无声，却从未真正离去\n\n### 🔴 去世地：北京\n- **公元纪年**：2023年9月1日\n- **停留时间**：晚年直至去世\n- **位置**：北京（今北京市）\n- **经过**：因病医治无效，在北京逝世。\n- **意义**：他生于嘉定、卒于沪上，从童年书桌到百岁书房，这座城市完整地收容了他的一生。《小兵的故事》在此间诞生，墨迹犹温的字里行间仍闪着他对少年们的温热目光\n- **名篇名句**：《白杨》：“当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就只觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1924 | 淮安 | 江苏省淮安市 | （年龄：0岁）出生于江苏淮安。 |\n| 1943 |  |  | （年龄：19岁）开始发表作品。 |\n| 1945 | 上海 | 上海市 | （年龄：21岁）加入中国共产党；在上海从事新闻编辑工作。 |\n| 1953 | 北京 | 北京市 | （年龄：29岁）调入北京《人民日报》社，任文艺部编辑、主任。 |\n| 1960年代初（约1961年） |  |  | （年龄：36岁）散文《白杨》发表，后成为经典课文（具体年份存疑）。 |\n| 1980年代 |  |  | （年龄：56-66岁）创作与文学活动高峰期，出版多部散文集、儿童文学集。 |\n| 1990年代后 |  |  | （年龄：66岁后）逐渐淡出一线工作，但仍笔耕不辍，整理出版文集。 |\n| 2023 | 北京 | 北京市 | （年龄：99岁）9月1日于北京逝世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n袁鹰作为《人民日报》文艺部的负责人之一，其编辑工作和创作实践对新中国成立后“十七年”及新时期初期的文学风貌，特别是散文与儿童文学的创作导向，产生了积极影响。他的作品以鲜明的时代性和优美的文学性，鼓舞和感染了广大读者，成为社会主义建设时期重要的文学声音。\n\n### 对后世的影响\n1.  **散文典范**：其散文作品，特别是入选教材的《白杨》等，成为学习状物抒情、托物言志写作手法的典范，影响了几代人的语文教育和审美趣味。\n2.  **儿童文学遗产**：创作了大量优秀的儿童文学作品，为中国儿童文学宝库增添了财富。\n3.  **编辑精神**：其作为资深编辑，扶持文学新人、严谨办刊的精神，为后来的文学工作者树立了榜样。\n\n### 历史评价\n1.  文学界评价其散文“感情真挚，诗意盎然，语言优美清新”。\n2.  被誉为“用散文为时代画像、为时代立传、为时代明德”的作家。\n3.  他的儿童文学作品“充满了对下一代的关爱与期望，富有教育意义和艺术感染力”。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**新中国成立后**，社会主义建设时期。\n- **关键事件/贡献**：作为**当代著名散文家**，其作品被选入语文课本，是学生学习**托物言志**、**借景抒情**写作手法的重要范文。\n- **代表作品/思想**：**《白杨》**（通过赞美白杨树，歌颂**北方农民**、**哨兵**以及**中华民族朴质、坚强、力求上进的精神**）。\n- **常见易混点/对比点**：与**茅盾**的《白杨礼赞》对比（同写白杨，但时代背景、具体象征内涵和写作风格有差异）（存疑/说法不一）。\n\n### 高中阶段\n- **时代背景**：**20世纪中国社会变革**与**新中国文学发展**脉络。\n- **关键事件/贡献**：了解其作为**《人民日报》文艺部**重要编辑，在**当代文学史**上的组织与推动作用。\n- **代表作品/思想**：散文集**《风帆》**、**《秋水》**等，体会其散文**形散神聚**、**注重意境**的特点。\n- **常见易混点/对比点**：与**杨朔**、**刘白羽**等同时代散文家的风格对比（袁鹰风格更显**平实、亲切、含蓄**）（存疑/说法不一）。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **文学常识**：袁鹰，当代作家、**儿童文学家**。原名田钟洛。\n2.  **课文理解**：《白杨》一文的**中心思想**（借物喻人，歌颂奉献精神）。\n3.  **写作手法**：识别并分析《白杨》中的**象征手法**（白杨象征北方军民）。\n4.  **语言赏析**：赏析《白杨》中描写白杨树外形和品格的**关键语句**。\n5.  **拓展对比**：（存疑/说法不一）与茅盾《白杨礼赞》在**写作目的**和**情感基调**上的异同。\n\n### 高中阶段考点\n1.  **文学史定位**：袁鹰在**中国当代散文史**上的地位与风格特点。\n2.  **作品风格**：概括其散文**清新、真挚、富有诗意**的整体风格。\n3.  **编辑贡献**：了解其在《人民日报》文艺部工作对**当代文学发展**的贡献。\n4.  **主题深化**：理解其作品中贯穿的**家国情怀**与**时代精神**。\n5.  **比较阅读**：（存疑/说法不一）将袁鹰的散文与**杨朔的“诗化散文”**、**刘白羽的“战歌体散文”**进行特点比较。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 淮安 | 江苏省淮安市 | 33.5975 | 119.0213 |\n| 上海 | 上海市 | 31.2304 | 121.4737 |\n| 杭州 | 浙江省杭州市 | 30.2741 | 120.1551 |\n| 北京 | 北京市 | 39.9
