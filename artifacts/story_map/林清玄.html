  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

*意义**：其文学创作中大量的自然意象、乡土情怀与朴素的生命观皆源于此段生活经历。\n\n### 📍 重要地点：台北（求学、工作与创作转型）\n- **时间**：约1970年代至1980年代中期\n- **停留时间**：约十余年\n- **地点**：台湾省台北市（今台湾台北市）\n- **事件**：考入世界新闻专科学校就读；毕业后进入《中国时报》、《工商时报》等媒体担任记者、主编；于1985年毅然辞去高薪工作，专心从事文学创作与佛法修行。\n- **意义**：从南部乡村进入都市，完成了知识体系的构建与职业身份的转变。新闻工作锻炼了他的观察与笔力，辞职专事写作是其人生的重要转折点，创作风格日趋成熟，禅意渐浓。\n- **名篇名句**：《温一壶月光下酒》：“传说在北极的人因为天寒地冻，一开口说话就结成冰雪，对方听不见，只好回家慢慢地烤来听。”\n\n### 📍 重要地点：美国（游学与写作）\n- **时间**：1980年代\n- **停留时间**：数月（具体待考）\n- **地点**：美国（具体城市待考）\n- **事件**：曾旅居美国进行短期的游学与写作。\n- **意义**：在异国文化环境中沉淀思考，深化了对东方文化与自身写作使命的认知。\n\n### 📍 重要地点：印度（佛教圣地旅行与修行）\n- **时间**：1990年代及之后多次\n- **停留时间**：多次短期旅行\n- **地点**：印度（如菩提伽耶、瓦拉纳西等地）\n- **事件**：多次前往印度佛教圣地旅行、静坐与修行，追寻佛陀足迹。\n- **意义**：亲身体验佛法源流，为其“菩提系列”等富含佛理的散文创作提供了深厚的实感与灵感。\n- **名篇名句**：《菩提系列》：“我们要轻轻的走路、用心的过活；我们要温和的呼吸、柔软的关怀；我们要深刻的思想、广大的慈悲。”\n\n### 📍 重要地点：日本京都\n- **时间**：1990年代及之后多次\n- **停留时间**：多次短期旅行\n- **地点**：日本京都（今日本京都府京都市）\n- **事件**：多次造访京都，体验日本禅寺文化、园林艺术与茶道。\n- **意义**：京都的禅意美学与其个人追求高度契合，成为其散文中经常出现的意境来源与写作背景。\n- **名篇名句**：《不闻，是一种清净》：“在我们不可把捉的尘世的运命中，我们不要管无情的背弃，我们不要管苦痛的创痕，只有维持一瓣香，在长夜的孤灯下，可以从陋室的胸中散发出来，也就够了。”\n\n### 📍 重要地点：台东（静修与写作）\n- **时间**：1990年代\n- **停留时间**：数年（具体待考）\n- **地点**：台湾省台东县（今台湾台东县）\n- **事件**：曾隐居于台东山区，过着简朴的修行与写作生活。\n- **意义**：远离尘嚣，回归山林，创作出一系列关于孤独、静思与内在探索的作品。\n\n### 📍 重要地点：中国大陆（巡回演讲与文化交流）\n- **时间**：2000年代至2010年代\n- **停留时间**：多次短期访问\n- **地点**：中国大陆（如北京、上海、杭州、厦门等）\n- **事件**：频繁受邀至大陆高校、书店、文化机构进行巡回演讲，与读者交流，其作品在大陆广泛出版。\n- **意义**：成为两岸文化交流的重要使者，其作品与思想在大陆新一代读者中产生巨大影响。\n\n### 📍 重要地点：高雄（故乡情怀与晚年关怀）\n- **时间**：贯穿一生，晚年尤甚\n- **停留时间**：多次返乡\n- **地点**：台湾省高雄市（今台湾高雄市）\n- **事件**：常回故乡演讲、参与文化活动，关心本土农业与教育。\n- **意义**：始终与出生地保持情感联结，其作品中对土地与人情的关怀在此得到延续和印证。\n\n### 📍 重要地点：台北阳明山（晚年居所）\n- **时间**：晚年\n- **停留时间**：数年\n- **地点**：台湾省台北市阳明山（今台湾台北市北投区、士林区交界）\n- **事件**：晚年居住于阳明山寓所，继续写作、会客、修行。\n- **意义**：在山林环抱的环境中度过创作晚期，直至离世。\n\n### 🔴 去世地：台北\n- **时间**：2019年1月23日\n- **停留时间**：晚年长期居住\n- **地点**：台湾省台北市（今台湾台北市）\n- **事件**：因心脏衰竭于台北逝世。\n- **意义**：一代散文大师的生命终点，其留下的文学与精神遗产继续滋养后世读者。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1953 | 高雄旗山 | 台湾高雄市旗山区 | （年龄：0岁）出生于台湾高雄旗山。 |\n| 1970 |  |  | （年龄：17岁）开始发表作品。 |\n| 约1971 | 台北 | 台湾台北市 | （年龄：约18岁）赴台北就读世界新闻专科学校。 |\n| 约1974 |  |  | （年龄：约21岁）毕业后进入《中国时报》任记者。 |\n| 1979 |  |  | （年龄：26岁）获《中国时报》文学奖散文首奖等。 |\n| 1985 |  |  | （年龄：32岁）辞去报社工作，专事写作。 |\n| 1980年代 | 美国（游学与写作） | 美国 | （年龄：30余岁）开始“菩提系列”创作；曾旅居美国。 |\n| 1990年代 | 印度（佛教圣地旅行与修行） | 印度 | （年龄：40余岁）多次前往印度、日本旅行与修行；隐居台东写作。 |\n| 2000年代 | 中国大陆（巡回演讲与文化交流） | 中国大陆 | （年龄：50余岁）开始频繁赴中国大陆巡回演讲。 |\n| 2019 | 台北 | 台湾台北市 | （年龄：65岁）于台北逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《和时间赛跑》**、**《桃花心木》**、**《百合花开》**（部分版本或课外读物）\n- 核心要点：\n    - **重点**：**《和时间赛跑》** 通过童年赛跑经历，阐释了**珍惜时间**、**与时间竞速**的积极人生观，语言朴素而富有感染力。\n    - **重点**：**《桃花心木》** 借树苗的生长喻人的成长，揭示了**在不确定中生活**才能培养独立自主、坚韧生命力的深刻哲理。\n    - **重点**：其散文善用**象征**与**托物言志**的手法，从平凡事物（如树木、花开）中发掘不平凡的生命启示。\n    - 文章主题常围绕**生命成长**、**时间哲思**、**逆境磨练**与**内心信念**展开。\n    - 语言风格**清新隽永**、**平易近人**，在娓娓道来中传递温暖与智慧。\n    - 作品中充满**禅意**与**东方哲学**色彩，引导读者向内观照，思考生命本质。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：林清玄是**台湾当代文学**发展历程中的代表性散文家，其创作高峰与台湾经济起飞、社会转型及文化多元发展时期重叠。\n    - **重点**：其作品在**1990年代至21世纪初**通过出版物广泛传播至**中国大陆及整个华语世界**，成为连接两岸读者情感与文化记忆的重要纽带。\n    - 他的写作与人生选择（如辞职、修行）体现了**现代知识分子**在商业社会中对**精神家园**与**心灵自由**的追寻。\n- 核心要点：\n    - **重点**：林清玄的散文被视为**通俗哲理散文**的典范，成功地将**佛学思想**与**日常生活**经验相融合，降低了哲思的门槛。\n    - **重点**：其作品在**华语青少年教育**领域影响深远，多篇散文入选教材，成为几代人关于**时间**、**成长**与**生命韧性**的启蒙读物。\n    - **重点**：他本人被视为**“生活禅”** 的倡导者与实践者，其人生轨迹与文字共同构成了一种**文化现象**，即通过文学实现个人修行与大众启蒙的结合。\n    - 从文学史角度看，他延续并现代化了**中国抒情散文**的传统，尤其在**台湾散文**的乡土书写与心灵书写两个维度上均有建树。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 高雄市旗山区 | 22.8897 | 120.4819 |\n| 台北市 | 25.0330 | 121.5654 |\n| 台北市（中正区，世新大学附近） | 25.0174 | 121.5398 |\n| 台北市（时报大楼旧址附近） | 25.0420 | 121.5350 |\n| 印度菩提伽耶 | 24.6952 | 84.9914 |\n| 日本京都市 | 35.0116 | 135.7681 |\n| 台东县 | 22.7583 | 121.1444 |\n| 北京市 | 39.9042 | 116.4074 |\n| 上海市 | 31.2304 | 121.4737 |\n| 杭州市 | 30.2741 | 120.1551 |\n| 高雄市（市区） | 22.6273 | 120.3014 |\n| 台北市阳明山（竹子湖） | 25.1746 | 121.5445 |\n| 台北市（逝世医院附近） | 25.0521 | 121.5310 |", "relatedGraph": {"center": {"id": 252, "
