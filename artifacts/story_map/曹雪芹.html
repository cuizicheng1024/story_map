  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

之作；以贾、史、王、薛四大家族兴衰为背景，深刻反映封建社会末期的社会现实；开创中国小说写实主义新高度，塑造了贾宝玉、林黛玉、薛宝钗等经典人物形象；精通诗、书、画，书中诗词曲赋多为原创，体现深厚文学功底；对中国后世文学、戏曲、影视、学术（红学）产生深远影响\n\n### 生平概述\n曹雪芹出身于清代内务府正白旗包衣世家，祖父曹寅、父辈曹頫相继担任江宁织造，家族煊赫数十年，与康熙南巡及宫廷关系密切。雍正六年（1728年）左右，其父曹頫因亏空获罪被革职抄家，曹家败落，少年曹雪芹随家人迁居北京，由锦衣玉食跌入困顿贫病。他在右翼宗学任职过，又曾流连京师西郊，以顽石自喻，\"披阅十载，增删五次\"，于1740年代开始撰写《红楼梦》。乾隆二十八年壬午除夕（1763年2月12日），贫病而卒，《石头记》未完。后程伟元、高鹗于1791年整理出版一百二十回本《红楼梦》，使这部巨著终成中国文学的不朽经典。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：由江南世家金陵故地，辗转到京畿西郊，最后贫病终老于北京\n- ⏱️ **时间跨度**：约1715年—约1763年，约48年\n- 📍 **地理范围**：主要分布于今江苏南京、北京及京郊地区\n- 🌟 **重要节点数量**：核心地点3处\n- 🚶 **总行程估算**：约 909 公里\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：南京江宁织造府\n- **公元纪年**：约1715年（康熙五十四年）\n- **停留时间**：少年时期约生活于此，至雍正六年（1728年）前后迁离，居住约十余年\n- **位置**：古称江宁织造府、金陵（今江苏省南京市玄武区大行宫一带）\n- **事迹**：出生并度过少年时代；亲历曹家三代四人主政江宁织造、接驾康熙南巡的盛况；雍正六年其父曹頫被革职抄家后，随家败落离此北上\n- **意义**：是其锦衣玉食生活与家族盛衰记忆的起点，为《红楼梦》中\"贾府\"描写提供原型\n\n### 📍 重要地点：北京\n- **公元纪年**：约1730年前后—约1763年\n- **停留时间**：约30余年，是其人生中后期主要居住与创作之地\n- **位置**：古称京师、北京（今北京市）\n- **事迹**：家败后随家人迁居北京，生活困顿；曾在右翼宗学任职，交往敦诚、敦敏等宗室诗人；开始构思并撰写《石头记》；晚年贫病交加，幼子夭折\n- **意义**：是其完成《红楼梦》创作、奠定文学地位的核心地理空间，也是贫病终老之所\n- **代表作品**：《红楼梦》（原名《石头记》）\n- **相关思想**：\"满纸荒唐言，一把辛酸泪。都道是作者痴，谁解其中味\"的创作宣言；\"女儿是水做的骨肉\"的平等观；以\"真事隐去、假语村言\"寄托家国身世之痛\n\n### 🔴 去世地：北京西郊\n- **公元纪年**：约1763年初（乾隆二十七年壬午除夕）\n- **停留时间**：晚年寓居此地约数载\n- **位置**：古称京师西郊（今北京市海淀区西山一带，传说居址有\"黄叶村\"等说法，存疑）\n- **经过**：乾隆二十七年壬午除夕（≈1763年初），贫病而卒，《石头记》未能定稿全帙；卒因另有幼子夭折忧伤过度等传说，缺第一手史料确证\n- **意义**：中国文学史上的\"未完\"之憾与文学圣地——《红楼梦》80回后原稿散佚，引发后世\"红学\"研究\n- **代表作品**：《红楼梦》（未完本80回手稿）\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1715年（康熙五十四年） | 江宁织造府 | 江苏省南京市 | 出生于江宁织造府 |\n| 约1728年（雍正六年） | 江宁 | 江苏省南京市 | 其父曹頫因亏空获罪被革职抄家，曹家败落 |\n| 约1730年前后 | 京师 | 北京市 | 随家人迁居北京，生活困顿 |\n| 约1740年代 | 京师西郊 | 北京市海淀区一带 | 在北京西郊开始撰写《石头记》（《红楼梦》） |\n| 约1763年初（乾隆二十七年壬午除夕） | 京师 | 北京市 | 病逝，《红楼梦》未完，后四十回一般认为由高鹗续作 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n《红楼梦》以贾、史、王、薛四大家族由盛而衰为线索，揭示封建社会末期礼教崩坏、阶级倾轧与家族崩溃的必然趋势，开创了中国小说\"写闺阁家庭、写日常真情\"的写实主义新格局。曹雪芹的悲剧意识、平等思想与诗化语言，突破了当时才子佳人小说的窠臼，对乾嘉之际的文坛风气和宗室文化都产生了强烈冲击。\n\n### 对后世的影响\n- **奠定中国小说写实主义高峰**：以\"真事隐去、假语村言\"的笔法，融合诗词曲赋、园林民俗、服饰饮食等百科知识，成为后世作家难以逾越的典范\n- **催生\"红学\"专门学问**：版本学、脂批学、探佚学、曹学、证史派等分支研究绵延二百余年，形成与\"敦煌学\"齐名的国际显学\n- **深刻影响戏曲、影视、绘画与民俗**：黛玉葬花、宝黛爱情、十二钗等母题被反复改编为京剧、越剧、电影、电视剧及绘画题材\n- **推动中国文学走向世界**：英、法、俄、日等语种译本众多，是20世纪以来海外汉学界译介最多、讨论最广的中国古典小说之一\n\n### 历史评价\n- 敦诚《寄怀曹雪芹（霑）》：\"爱君诗笔有奇气，直追昌谷破篱樊\"；\"知君诗胆昔如铁，堪与刀颖争寒光\"，赞其诗才与胆识\n- 脂砚斋在甲戌本《石头记》凡例评曰：\"字字看来皆是血，十年辛苦不寻常\"，慨叹其\"批阅十载，增删五次\"的呕心沥血\n- 近代王国维、胡适、鲁迅等从哲学、写实、悲剧等不同维度对其推崇备至：鲁迅评其\"敢于如实描写，并无讳饰\"，\"中国古典小说中写实主义的最高峰\"\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **清代**康乾盛世到衰世转折期——曹雪芹出身的织造世家，正值**\"康乾盛世\"由盛而衰**\n- 《红楼梦》是中国古代**长篇章回体小说**的代表作，又是中国古典**四大名著**之一\n- 教材常以\"**贾宝玉、林黛玉、薛宝钗**\"三人爱情悲剧串讲全书主题\n- 关键词：**封建家族衰亡、贾府、王熙凤\"凤辣子\"、刘姥姥进大观园**\n- 教材常选《**林黛玉进贾府**》或\"**香菱学诗**\"作为经典片段\n- 曹雪芹家世：**江宁织造、包衣世家、抄家败落**——为小说提供现实素材\n- 教材提示：《红楼梦》前八十回为曹雪芹所作，**后四十回一般认为是高鹗续作**（易混点）\n- 《红楼梦》以\"**真事隐（甄士隐）、假语存（贾雨村）**\"开篇，谐音寓意人物命名是重要艺术特色\n- 与**《三国演义》《水浒传》《西游记》**对比：前三部为世代累积型集体创作，《红楼梦》为**个人独立创作**\n\n### 高中阶段\n- 重点掌握曹雪芹**\"披阅十载，增删五次\"**的创作态度，理解现实主义文学的\"**写实与虚构**\"辩证关系\n- 教材专题\"**小说与人生**\"或\"**古典小说高峰**\"中，**贾宝玉\"通灵宝玉\"与林黛玉\"绛珠仙草\"**的前世神话结构（\"木石前盟\"）\n- 思想层面：曹雪芹借贾宝玉之口批判\"**男尊女卑**\"、推崇\"**真情至性**\"，具有早期**人文主义**色彩（注意：教材通常避免使用\"资产阶级\"等西方化标签）\n- 关键作品特征：**草蛇灰线、伏脉千里**的网状结构；**谐音寓意**的人物命名（甄士隐＝真事隐、贾雨村＝假语存等）\n- 代表性诗作与名句：**《葬花吟》\"花谢花飞花满天，红消香断有谁怜\"**；**《终身误》\"都道是金玉良姻，俺只念木石前盟\"**；**《好了歌》\"世人都晓神仙好，惟有功名忘不了\"**\n- 重要学术事件：**胡适《红楼梦考证》、俞平伯《红楼梦辨》**——现代\"新红学\"建立\n- 易混点：曹雪芹的**祖父曹寅**（曾任江宁织造，主持刊刻《全唐诗》）与**父亲曹頫**（被革职抄家）不可混淆辈分\n- \"**红学**\"一词出现于清末，20世纪发展为国际性显学，与\"**敦煌学**\"并称\n\n---\n\n## 初高中阶段考点\n\n### 初中考点\n- 《红楼梦》的作者、朝代、体裁（长篇章回体小说）\n- \"**四大古典名著**\"的作者及成书时代对比\n- 曹雪芹家世关键词：江宁织造、包衣、抄家\n- 经典人物：贾宝玉、林黛玉、薛宝钗、王熙凤、刘姥姥\n- 教材常考篇目：**\"林黛玉进贾府\"**（凤辣子出场、黛玉葬花等名场面）\n- 主题概括：家族衰亡悲剧 + 宝黛爱情悲剧\n- 简单理解\"前八十回\"与\"后四十回\"的作者差异\n\n### 高中考点\n- 曹雪芹生卒年争议（约1715—约1763年，存疑/说法不一）\n- 字、号、旗籍（**内务府正白旗包衣**）等细节\n- 《红楼梦》版本谱系：脂评本系统（甲戌、庚辰等）vs 程高刻本系统（程甲本、程乙本）\n- 重要诗句默写与赏析：**《葬花吟》\"花谢花飞花满天，红消香断有谁怜\"**；**《终身误》\"都道是金玉良姻，俺只念木石前盟\"**；**\"世事洞明皆学问，人情练达即文章\"**\n- 现实主义文学成就：人物塑造、网状结构、谐音寓意\n- \"红学\"两大流派：旧红学（索隐派）vs 新红学（胡适、俞平伯考证派）\n- 曹雪芹祖父曹寅 vs 父亲曹頫（辈分区别，存疑/说法不一）\n- 《红楼梦》后四十回续作者高鹗的争议（存疑/说法不一）\n- 世界文学视野中的地位：与西方写实主义、悲剧理论比较阅读\n\n## 地点坐标（人工校正）\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 南京江宁织造府 | 江苏省南京市玄武区大行宫一带 | 32.0415 | 118.7929 |\n| 北京 | 北京市 | 39.9042 | 116.4074 |\n| 北京西郊 | 北京市海淀区西山一带 | 39.9990 | 116.2470 |\n","relatedGraph": {"center": {"id": 204,"name": "曹雪芹","file": "曹雪芹.html","dynasty": "清代（康熙至乾隆时期）","birth_year": 1715,"death_year": 1763,"time_year": 1739,"quote": "敦诚《寄怀曹雪芹（霑）》：\"爱君诗笔有奇气，直追昌谷破篱樊\"；\"知君诗胆昔如铁，堪与刀颖争寒光\"，赞其诗才与胆识","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "literature","main_role_label": "小说家","birthplace": "江宁织造府","birthplace_raw": "江宁织造府今江苏省南京市","birthplace_modern": "江苏省南京市","birth_lat_wgs84": 32.0415,"birth_lng_wgs84": 118.7929,"birth_lat": 32.0415,"birth_lng": 118.7929,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["曹雪芹"],"search_tokens": ["曹雪芹","caoxueqin","cxq"],"search_pinyin": ["caoxueqin","cxq"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人物"},"nodes": [{"id": 204,"name": "曹雪芹","file": "曹雪芹.html","dynasty": "清代（康熙至乾隆时期）","birth_year": 1715,"death_year": 1763,"time_year": 1739,"quote": "敦诚《寄怀曹雪芹（霑）》：\"爱君诗笔有奇气，直追昌谷破篱樊\"；\"知君诗胆昔如铁，堪与刀颖争寒光\"，赞其诗才与胆识","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "literature","main_role_label": "小说家","birthplace": "江宁织造府","birthplace_raw": "江宁织造府今江苏省南京市","birthplace_modern": "江苏省南京市","birth_lat_wgs84": 32.0415,"birth_lng_wgs84": 118.7929,"birth_lat": 32.0415,"birth_lng": 118.7929,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["曹雪芹"],"search_tokens": ["曹雪芹","caoxueqin","cxq"],"search_pinyin": ["caoxueqin","cxq"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": t
