/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

巴黎的精神诊所与南方温泉城之间辗转求医。曾经犀利如刀的笔尖已随健康一起流失，1893年夏他在巴黎一家精神病院中以四十二岁之年孤独告别了文字与世界\n\n### 📍 重要地点：巴黎\n- **时间**：1869年-1870年（首次定居）\n- **停留时间**：约1年\n- **地点**：法国巴黎（今法国巴黎市）\n- **事件**：赴巴黎大学学习法律。\n- **意义**：晚年的莫泊桑被梅毒与精神病症反复纠缠，屡次回此故地寻求疗养；然而熟悉的悬崖海风已无力挽回他崩溃的健康，身心在绝望中持续滑落，最终于巴黎以悲剧方式离世\n\n### 📍 重要地点：普法战争战场（具体地点存疑）\n- **时间**：1870年-1871年\n- **停留时间**：约1年\n- **地点**：主要活动于法国北部（今阿尔萨斯-洛林大区及法兰西岛大区等地，具体地点存疑）\n- **事件**：应征入伍，参加普法战争。\n- **意义**：亲历战争的残酷与荒谬，成为其日后创作的重要主题，深刻影响其反战与人道主义思想。\n- **名篇名句**：《羊脂球》：以普法战争为背景，刻画了不同阶层人物的面目；《两个朋友》：讲述了战争中两个平民的悲剧。\n\n### 📍 重要地点：巴黎（海军部任职时期）\n- **时间**：1872年-1880年\n- **停留时间**：约8年\n- **地点**：法国巴黎（今法国巴黎市）\n- **事件**：在海军部担任小职员，同时师从福楼拜学习写作，结识左拉、屠格涅夫等作家。\n- **意义**：在福楼拜的严格指导下磨练写作技巧，积累了丰富的官场与都市生活经验，为其讽刺小市民和公务员生活的作品提供素材。\n- **名篇名句**：《项链》：讽刺了小资产阶级的虚荣心；《一家人》：描绘了公务员家庭的庸俗生活。\n\n### 📍 重要地点：土伦\n- **时间**：1870年代末（具体年份存疑）\n- **停留时间**：短暂\n- **地点**：法国南部土伦（今法国瓦尔省）\n- **事件**：海军部工作期间的出差或旅行。\n- **意义**：梅毒侵入神经系统后他神志日益昏乱，在巴黎的精神诊所与南方温泉城之间辗转求医。曾经犀利如刀的笔尖已随健康一起流失，1893年夏他在巴黎一家精神病院中以四十二岁之年孤独告别了文字与世界\n\n### 📍 重要地点：罗马（意大利）\n- **时间**：公元1881年\n- **停留时间**：数月\n- **地点**：意大利罗马（今意大利拉齐奥大区罗马市）\n- **事件**：作为获奖学金的旅行，游历意大利。\n- **意义**：梅毒侵入神经系统后他神志日益昏乱，在巴黎的精神诊所与南方温泉城之间辗转求医。曾经犀利如刀的笔尖已随健康一起流失，1893年夏他在巴黎一家精神病院中以四十二岁之年孤独告别了文字与世界\n\n### 📍 重要地点：戛纳\n- **时间**：1880年代后期至1890年代初（多次前往）\n- **停留时间**：断续居住\n- **地点**：法国南部戛纳（今法国阿尔卑斯滨海省）\n- **事件**：为疗养身体，多次前往蔚蓝海岸地区。\n- **意义**：晚年的莫泊桑被梅毒与精神病症反复纠缠，屡次回此故地寻求疗养；然而熟悉的悬崖海风已无力挽回他崩溃的健康，身心在绝望中持续滑落，最终于巴黎以悲剧方式离世\n\n### 🔴 去世地：帕西（巴黎）\n- **时间**：公元1893年\n- **停留时间**：生命最后数月\n- **地点**：法国巴黎帕西（今法国巴黎市十六区）\n- **事件**：因严重精神疾病被送入布朗什医生精神病院，并在此逝世。\n- **意义**：一代文学巨匠在与疾病的痛苦抗争中陨落，结束了短暂而辉煌的创作生涯。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1850 | 米洛美尼尔城堡 | 法国滨海塞纳省费康 | （年龄：0）出生于法国诺曼底米洛美尼尔城堡。 |\n| 1863 | 鲁昂 | 法国滨海塞纳省省会 | （年龄：13）进入鲁昂中学读书。 |\n| 1869 | 巴黎 | 法国巴黎市 | （年龄：19）赴巴黎学习法律。 |\n| 1870 |  |  | （年龄：20）普法战争爆发，应征入伍。 |\n| 1872 |  |  | （年龄：22）进入海军部任职，师从福楼拜。 |\n| 1880 |  |  | （年龄：30）发表《羊脂球》，一举成名。 |\n| 1883 |  |  | （年龄：33）出版长篇小说《一生》。 |\n| 1885 |  |  | （年龄：35）出版长篇小说《漂亮朋友》。 |\n| 1887 |  |  | （年龄：37）健康状况开始恶化，出现精
