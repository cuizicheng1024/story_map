/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

权。\n\n### 生平概述\n劳合·乔治出身威尔士平民，凭借律师身份与卓越辩才步入政坛。作为自由党激进派领袖，他在20世纪初主导了英国的社会福利改革，挑战上议院权威，被誉为“福利国家之父”。第一次世界大战爆发后，他于1916年出任首相，以非凡的组织与动员能力领导国家走向胜利。战后，他作为“三巨头”之一参加巴黎和会，对《凡尔赛和约》的制定起到关键作用，但其战后国内政治影响力逐渐衰退。他的一生贯穿了大英帝国从鼎盛到面临挑战的关键转型期。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从威尔士乡村到伦敦政治中心，足迹遍及英国主要城市，并作为战时领袖与和会主导者活跃于欧洲大陆。\n- ⏱️ **时间跨度**：1863年至1945年，共82年。\n- 📍 **地理范围**：以英国（特别是英格兰与威尔士）为核心，延伸至法国巴黎等欧洲政治中心。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：曼彻斯特\n- **时间**：1863年1月17日\n- **停留时间**：幼年短暂居住\n- **地点**：曼彻斯特（今英国英格兰曼彻斯特）\n- **事件**：出生于一个威尔士裔教师家庭。\n- **意义**：其出生地英格兰与成长地威尔士的双重背景，塑造了他兼具务实与激进、同情平民的政治品格。\n\n### 📍 重要地点：兰伊斯特威德（童年成长地）\n- **时间**：1864年-1880年代初\n- **停留时间**：约18年\n- **地点**：兰伊斯特威德（今英国威尔士锡尔迪金郡兰伊斯特威德）\n- **事件**：父亲早逝后，随母亲迁居威尔士舅舅家，在此成长并接受早期教育。\n- **意义**：威尔士的乡村环境与非国教文化氛围深刻影响了他的价值观，使其终身带有鲜明的威尔士身份认同与改革热情。\n\n### 📍 重要地点：卡马森（法律与政治起点）\n- **时间**：约1884年\n- **停留时间**：约6年\n- **地点**：卡马森（今英国威尔士卡马森郡卡马森）\n- **事件**：在此地取得律师资格，并建立自己的律师事务所；开始参与地方政治活动。\n- **意义**：为其提供了进入政坛的专业资本与地方声望，是他从法律界转向全国政治舞台的跳板。\n\n### 📍 重要地点：伦敦（议会与政治斗争中心）\n- **时间**：1890年至1922年（首相任期结束）为主要活跃期，此后断续居住\n- **停留时间**：断续居住数十年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：1890年当选卡马森选区议员，进入下议院；1905年12月首次入阁出任贸易委员会主席；在议会中以激进派和卓越辩才闻名；与保守党及上议院进行激烈斗争。\n- **意义**：其全国性政治生涯的核心舞台，在此推动了多项关键社会改革立法。\n\n### 📍 重要地点：伦敦（财政部与改革核心）\n- **时间**：1908年-1915年\n- **停留时间**：约7年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：1908年出任财政大臣；推出1909年“人民预算”，提议对土地和高收入者征税以资助社会福利，引发宪政危机；主导通过1911年《议会法》和《国民保险法》。\n- **意义**：这是他社会改革思想的集中实践期，从根本上改变了英国政府的社会角色，为现代福利国家奠基。\n\n### 📍 重要地点：伦敦（唐宁街10号，战时首相）\n- **时间**：1916年12月-1922年10月\n- **停留时间**：约6年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：1916年12月取代阿斯奎斯出任首相，组建战时联合政府；以高度集权的方式领导国家进行总体战，有效协调军事与经济资源。\n- **意义**：其强有力的领导对英国坚持并最终赢得一战起到了决定性作用，标志着其政治权力的顶峰。\n\n### 📍 重要地点：巴黎（凡尔赛和会）\n- **时间**：1919年\n- **停留时间**：数月\n- **地点**：巴黎（今法国巴黎）\n- **事件**：作为英国首席代表出席巴黎和会，与克列孟梭、威尔逊并称“三巨头”，主导了对德和约的谈判。\n- **意义**：参与塑造了一战后的国际秩序，其试图在惩罚德国与维持欧洲均势间寻求平衡的立场影响了《凡尔赛和约》的最终条款。\n\n### 📍 重要地点：戛纳（国际会议）\n- **时间**：1922年1月\n- **停留时间**：短暂\n- **地点**：戛纳（今法国戛纳）\n- **事件**：主持召开戛纳会议，试图重建与欧洲国家的经济合作，并邀请苏俄代表参会。\n- **意义**：反映了其战后力图通过经济合作稳定欧洲的外交思路，但会议因国内政治变局而成效有限。\n\n### 📍 重要地点：伦敦（政治生涯后期）\n- **时间**：1920年代-1930年代\n- **停留时间**：断续居住\n- **地点**：伦敦（今英国伦敦）\n- **事件**：1922年因保守党退出联合政府而辞去首相职务；此后作为自由党领袖（一度分裂）继续活跃于政坛，但影响力大减；对纳粹德国的崛起提出过警告。\n- **意义**：见证了其政治生涯的落幕与自由党的衰落，也体现了其作为资深政治家对国际局势的持续关注。\n\n### 🔴 去世地：兰伊斯特威德（逝世与归葬）\n- **时间**：1945年3月26日\n- **停留时间**：晚年长期居住\n- **地点**：兰伊斯特威德（今英国威尔士锡尔迪金郡兰伊斯特威德）\n- **事件**：在二战结束前夕于家乡的庄园逝世。\n- **意义**：始于威尔士，终于威尔士，完成了其从平民子弟到帝国首相的传奇人生循环，其葬礼在家乡举行。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1863 | 曼彻斯特 | 英国英格兰曼彻斯特 | （年龄：0岁）出生于曼彻斯特。 |\n| 1864 | 兰伊斯特威德（童年成长地） | 英国威尔士锡尔迪金郡兰伊斯特威德 | （年龄：1岁）随母亲迁居威尔士兰伊斯特威德。 |\n| 1884 | 卡马森（法律与政治起点） | 英国威尔士卡马森郡卡马森 | （年龄：21岁）在卡马森取得律师资格。 |\n| 1890 | 卡马森（法律与政治起点） | 英国威尔士卡马森郡卡马森 | （年龄：27岁）当选卡马森选区自由党议员，进入下议院。 |\n| 1905 |  |  | （年龄：42岁）入阁出任贸易委员会主席（1905年12月）。 |\n| 1908 |  |  | （年龄：45岁）出任财政大臣，提出“人民预算”。 |\n| 1909 |  |  | （年龄：46岁）“人民预算”遭上议院否决，引发宪政危机。 |\n| 1911 |  |  | （年龄：48岁）推动通过《议会法》（限制上议院权力）和《国民保险法》。 |\n| 1914 |  |  | （年龄：51岁）第一次世界大战爆发。 |\n| 1915 |  |  | （年龄：52岁）出任军需大臣，负责军备生产。 |\n| 1916 |  |  | （年龄：53岁）出任英国首相，领导战时联合政府。 |\n| 1918 |  |  | （年龄：55岁）领导英国赢得一战；推动通过《人民代表法》（扩大选举权）。 |\n| 1919 | 巴黎（凡尔赛和会） | 法国巴黎 | （年龄：56岁）代表英国出席巴黎和会，参与制定《凡尔赛和约》。 |\n| 1922 |  |  | （年龄：59岁）因保守党退出而辞去首相职务。 |\n| 1945 | 兰伊斯特威德（逝世与归葬） | 英国威尔士锡尔迪金郡兰伊斯特威德 | （年龄：82岁）于家乡兰伊斯特威德逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n（注：劳合·乔治作为外国历史人物，其作品与言论通常不直接进入语文课文，但其在历史文献中的演说与决策具有重要文学与修辞价值。）\n- 相关文献：**巴黎和会**相关历史文献、**战时演讲**（如动员演说）。\n- 核心要点：\n    - **重点**：其演说以**雄辩**、**煽动性**和**平民化语言**著称，善于运用比喻与情感号召，是研究**政治修辞学**的范例。\n    - **重点**：在推动社会改革时，常使用“**人民**”、“**正义**”、“**国家效率**”等**核心概念**构建话语体系，具有强烈的**进步主义**色彩。\n    - **重点**：巴黎和会期间的发言与备忘录，体现了在**理想主义**（威尔逊十四点原则）与**现实政治**（法国安全诉求）之间的**艰难平衡**。\n    - 其政治生涯的起伏，常被作为分析**个人能力**与**时代潮流**、**政党政治**复杂关系的案例。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**自由党**改革派核心人物，主导了20世纪初英国的**社会福利立法**（如国民保险），标志着**现代福利国家**的开端。\n    - **第一次世界大战**后期的英国**战时首相**，领导实施**征兵制**，高效组织国内经济，对协约国胜利起到关键作用。\n    - **巴黎和会**“三巨头”之一，是**凡尔赛体系**的主要构建者之一，其立场（如主张适度惩罚德国、索取赔款但避免过分削弱）影响了和约内容。\n    - 1918年
