  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {
  font-weight: 600;
  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {
  filter: saturate(1.08);
}
.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {
  transform: translateY(-1px);

   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */

  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

专利局，期间发表了包括狭义相对论在内的一系列颠覆性论文，引发物理学革命。此后，他辗转于布拉格、苏黎世和柏林的大学任教与研究，并完成了广义相对论。因纳粹势力崛起，他被迫移居美国，任职于普林斯顿高等研究院，直至逝世。他的一生贯穿两次世界大战，不仅是科学巨匠，也积极投身反战与和平运动，成为理性与人道主义的全球象征。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：足迹横跨欧洲（德国、瑞士、意大利、奥地利、捷克）与北美洲（美国），主要活动于学术中心。\n- ⏱️ **时间跨度**：1879年 - 1955年，共计76年。\n- 📍 **地理范围**：主要覆盖中欧（德语区）及美国东海岸。\n- 🌟 **重要节点数量**：约10个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：乌尔姆\n- **公元纪年**：1879年\n- **停留时间**：约1年（婴儿期）\n- **位置**：德意志帝国符腾堡王国乌尔姆市（今德国巴登-符腾堡州乌尔姆市）\n- **事迹**：在此出生。\n- **意义**：1879年3月14日，爱因斯坦诞生于多瑙河畔的乌尔姆。这座南方小城不会料到，襁褓中的犹太婴儿将在半个世纪后用E=mc²重塑人类对宇宙的理解，传奇从此悄然启程\n\n### 📍 重要地点：慕尼黑\n- **公元纪年**：1880年 - 1894年\n- **停留时间**：童年及青少年时期（约14年）\n- **位置**：德意志帝国巴伐利亚王国慕尼黑（今德国巴伐利亚州慕尼黑市）\n- **事迹**：在此接受小学和中学教育；对电磁现象产生浓厚兴趣；因厌恶德国军国主义教育，首次萌生放弃德国国籍的念头。\n- **意义**：世纪之交的巴伐利亚首府慕尼黑已是欧洲学术重镇。爱因斯坦虽以苏黎世、柏林为主舞台，却始终与这座城市保持呼吸——与慕尼黑大学的索末菲切磋量子理论、出入巴伐利亚科学院，让他紧扣欧洲物理学的最前沿脉搏。\n\n### 📍 重要地点：苏黎世（求学）\n- **公元纪年**：1896年 - 1900年\n- **停留时间**：大学时期（4年）\n- **位置**：瑞士联邦苏黎世（今瑞士苏黎世）\n- **事迹**：进入苏黎世联邦理工学院学习物理学和数学；与同学米列娃·马里奇相识相恋；学业上常因不循常规而与教授产生矛盾。\n- **意义**：巴伐利亚的科学心脏，索末菲等理论物理先驱聚集于此，与柏林、苏黎世构成世纪初欧洲物理的三角。爱因斯坦虽不在此任职，却与这里保持着频繁的学术通信与访问\n\n### 📍 重要地点：伯尔尼\n- **公元纪年**：1902年 - 1909年\n- **停留时间**：约7年\n- **位置**：瑞士联邦伯尔尼（今瑞士伯尔尼）\n- **事迹**：在伯尔尼联邦专利局担任三级技术员；与好友哈比希特、索洛文组成“奥林匹亚科学院”自学讨论；1905年（“奇迹年”）发表《论动体的电动力学》（狭义相对论）、《关于光的产生和转化的一个启发性观点》（光量子说）等四篇划时代论文。\n- **意义**：职业生涯初期，也是其科学创造力爆发的黄金时期，完成了从专利员到顶尖物理学家的蜕变。\n- **名篇名句**：《论动体的电动力学》：“……我们应当把时间的陈述理解为同时性事件的陈述。”；《关于光的产生和转化的一个启发性观点》：“……光的能量在空间中不是连续分布的。”\n\n### 📍 重要地点：布拉格\n- **公元纪年**：1911年 - 1912年\n- **停留时间**：约1年半\n- **位置**：奥匈帝国波希米亚王国布拉格（今捷克共和国布拉格）\n- **事迹**：任布拉格德意志大学理论物理学教授；首次计算光线经过太阳边缘的偏折角度，为广义相对论提供关键预言。\n- **意义**：首次获得教授职位，学术地位提升，广义相对论研究取得关键进展。\n\n### 📍 重要地点：柏林\n- **公元纪年**：1914年 - 1933年\n- **停留时间**：约19年\n- **位置**：德意志帝国/魏玛共和国柏林（今德国柏林）\n- **事迹**：任普鲁士科学院院士、柏林大学教授、威廉皇帝物理研究所所长；与第一任妻子离婚，与表姐爱尔莎结婚；1915年完成广义相对论；1919年日食观测证实其引力透镜预言，使其举世闻名；公开反对德国军国主义和纳粹主义。\n- **意义**：学术生涯的顶峰，完成了最伟大的科学成就（广义相对论），并成为具有巨大公共影响力的知识分子。此地也见证了他因政治环境被迫离开德国。\n- **名篇名句**：《广义相对论的基础》：“……物理定律必须具有这样的性质，它们对于无论以哪种方式运动着的参照系都是成立的。”\n\n### 📍 重要地点：莱顿\n- **公元纪年**：20世纪20年代（多次短期访问）\n- **停留时间**：短期访问讲学\n- **位置**：荷兰王国莱顿（今荷兰莱顿）\n- **事迹**：作为特邀教授访问莱顿大学，与好友、物理学家埃伦费斯特交流，并与洛伦兹、外尔等学者切磋。\n- **意义**：巴伐利亚的科学心脏，索末菲等理论物理先驱聚集于此，与柏林、苏黎世构成世纪初欧洲物理的三角。爱因斯坦虽不在此任职，却与这里保持着频繁的学术通信与访问\n\n### 📍 重要地点：普林斯顿\n- **公元纪年**：1933年 - 1955年\n- **停留时间**：晚年时期（22年）\n- **位置**：美国新泽西州普林斯顿（今美国新泽西州普林斯顿市）\n- **事迹**：受聘于新成立的普林斯顿高等研究院；致力于统一场论研究；二战期间致信罗斯福总统，促成“曼哈顿计划”，但本人未参与具体研究；战后积极倡导核武器控制与世界政府；1955年签署《罗素-爱因斯坦宣言》，呼吁和平利用科学。\n- **意义**：人生的最后驿站，远离欧洲战火，在相对宁静的环境中继续思考终极物理问题，并成为全球和平与人道主义的象征。\n- **名篇名句**：致罗斯福总统的信（1939年）：“……这种新的现象（指核裂变）也可用来制造炸弹，并且能够想象——尽管还不能确定——一种新型的威力极大的炸弹可以由此制造出来。”\n\n### 🔴 去世地：普林斯顿\n- **公元纪年**：1955年4月18日\n- **停留时间**：生命最后22年\n- **位置**：美国新泽西州普林斯顿（今美国新泽西州普林斯顿市）\n- **经过**：因腹主动脉瘤破裂逝世于普林斯顿医院。遵照其遗嘱，遗体火化，骨灰被秘密撒放，不立纪念碑，不举行公开葬礼。\n- **意义**：生命的终点。其简朴的葬礼和对身后事的安排，体现了他一生反对个人崇拜、追求精神自由的品格。\n- **名篇名句**：临终前（对护士，用德语）：“我已完成了我的份内事，现在该走了。”\n\n---\n\n## 四、地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 乌尔姆 | 德国巴登-符腾堡州乌尔姆市 | 48.401082 | 9.987608 |\n| 慕尼黑 | 德国巴伐利亚州慕尼黑市 | 48.137154 | 11.576124 |\n| 苏黎世（求学） | 瑞士苏黎世 | 47.376887 | 8.541694 |\n| 伯尔尼 | 瑞士伯尔尼 | 46.948091 | 7.447443 |\n| 布拉格 | 捷克布拉格 | 50.075539 | 14.437800 |\n| 柏林 | 德国柏林 | 52.520008 | 13.404954 |\n| 莱顿 | 荷兰南荷兰省莱顿 | 52.160114 | 4.497010 |\n| 普林斯顿 | 美国新泽西州普林斯顿市 | 40.343989 | -74.651448 |\n\n---\n\n## 五、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1879 | 乌尔姆 | 德国巴登-符腾堡州乌尔姆市 | （年龄：0）出生于德国乌尔姆。 |\n| 1896 | 苏黎世（求学） | 瑞士苏黎世 | （年龄：17）放弃德国国籍，进入苏黎世联邦理工学院学习。 |\n| 1900 | 苏黎世（求学） | 瑞士苏黎世 | （年龄：21）毕业，但未能获得助教职位。 |\n| 1902 | 伯尔尼 | 瑞士伯尔尼 | （年龄：23）受聘于伯尔尼专利局；“奥林匹亚科学院”成立。 |\n| 1905 | 伯尔尼 | 瑞士伯尔尼 | （年龄：26）“奇迹年”，发表狭义相对论、光量子说等四篇论文。 |\n| 1909 | 苏黎世（求学） | 瑞士苏黎世 | （年龄：30）离开专利局，首次获得苏黎世大学编外教授职位。 |\n| 1911 | 布拉格 | 捷克共和国布拉格 | （年龄：32）任布拉格德意志大学教授；首次计算光线偏折。 |\n| 1914 | 柏林 | 德国柏林 | （年龄：35）迁居柏林，任普鲁士科学院院士等职。 |\n| 1915 | 柏林 | 德国柏林 | （年龄：36）完成广义相对论。 |\n| 1919 | 柏林 | 德国柏林 | （年龄：40）日食观测证实广义相对论预言，名声大振；与米列娃离婚。 |\n| 1921 | 柏林 | 德国柏林 | （年龄：42）因光电效应定律获诺贝尔物理学奖。 |\n| 1933 | 普林斯顿 | 美国新泽西州普林斯顿市 | （年龄：54）因纳粹迫害移居美国，任职于普林斯顿高等研究院。 |\n| 1939 | 普林斯顿 | 美国新泽西州普林斯顿市 | （年龄：60）致信罗斯福总统，提醒美国重视核裂变相关军事风险。 |\n| 1952 | 普林斯顿 | 美国新泽西州普林斯顿市 | （年龄：73）以色列政府邀请其出任第二任总统，婉拒。 |\n| 1955 | 普林斯顿 | 美国新泽西州普林斯顿市 | （年龄：76）签署《罗素-爱因斯坦宣言》；4月18日在普林斯顿逝世。 |\n\n---\n\n## 六、历史影响\n\n### 对当时的影响\n爱因斯坦的相对论彻底颠覆了牛顿力学建立的绝对时空观，引发了物理学基础理论的革命，使他在20世纪初即成为科学界的泰斗。他的光量子假说为量子力学的建立开辟了道路。同时，作为一位具有强烈社会责任感的公共知识分子，他对两次世界大战、法西斯主义、种族迫害的鲜明反对态度，以及对核武器的警惕，深刻影响了当时的科学界舆论和国际和平运动。\n\n### 对后世的影响\n1. **科技发展**：相对论是现代宇宙学、天体物理学（如黑洞、引力波）、粒子物理学和全球卫星定位系统（GPS）的理论基石。\n2. **科学方法论**：其思想实验和追求理论统一性的方法，成为理论物理学研究的典范。\n3. **文化符号**：“爱因斯坦”成为“天才”的代名词，其形象（蓬乱白发、吐舌照片）和质能方程（E=mc²）成为流行文化标志。\n4. **科学家的社会责任**：树立了科学家关心人类命运、积极参与公共事务的榜样。\n\n### 历史评价\n1. **马克斯·普朗克**（量子论创始人）：“爱因斯坦的理论，将把我们关于物质结构和宇宙演化的全部观念引向一个新的方向。”\n2. **《时代》杂志**（1999年）：评选爱因斯坦为“20世纪风云人物”，称他“作为科学家、人道主义者以及原子时代一位不太可能的文化偶像，界定了我们这个世纪的创造性天才。”\n3. **杨振宁**（物理学家）：“20世纪物理学的三大贡献中，有两个半都是爱因斯坦的。”（指狭义相对论、广义相对论和量子力学的奠基工作）\n4. **罗素**（哲学家）：“爱因斯坦不仅是一位伟大的科学家，也是一位伟大的人……他具有战士的坚韧，又有艺术家的敏感与温柔。”\n\n---\n\n## 七、人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**第二次工业革命**后，科学技术迅猛发展；**两次世界大战**深刻影响世界格局。\n- **关键事件/贡献**：提出**狭义相对论**和**广义相对论**，改变了人类对**时间、空间、物质和引力**的认识；因解释**光电效应**获得**诺贝尔物理学奖**。\n- **代表作品/思想**：质能方程 **E=mc²**。\n- **常见易混点/对比点**：与**牛顿**经典力学体系的关系（继承与发展）；相对论与日常生活经验（低速下）的差异。\n\n### 高中阶段\n- **时代背景**：**经典物理学**危机（以太漂移实验、黑体辐射等）；**量子力学**的诞生与发展。\n- **关键事件/贡献**：1905年“**奇迹年**”的四篇论文；**光量子假说**（光的波粒二象性）对量子理论的贡献；**布朗运动**的理论解释；**广义相对论**预言（光线弯曲、引力红移、引力波）。\n- **代表作品/思想**：**《论动体的电动力学》**；**统一场论**的探索。\n- **常见易混点/对比点**：**狭义相对论**（惯性系、光速不变）与**广义相对论**（非惯性系、等效原理）的核心区别；爱因斯坦对**量子力学**的贡献（奠基）与对其**哥本哈根诠释**的质疑（“上帝不掷骰子”）。\n\n---\n\n## 八、初高中阶段考点\n\n### 初中阶段\n- 爱因斯坦是**20世纪最伟大的物理学家**之一。\n- 他最重要的理论是**相对论**，包括**狭义相对论**和**广义相对论**。\n- 他提出了著名的质能方程 **E=mc²**，揭示了质量和能量可以相互转换。\n- 他因在**光电效应**方面的研究获得**1921年诺贝尔物理学奖**。\n- 他是一位**和平主义者**，反对战争和法西斯主义。\n- （存疑/说法不一）关于他是否亲自参与**曼哈顿计划**（原子弹研制）：他本人并未参与，但其理论和上书罗斯福的信件是重要推动因素。\n\n### 高中阶段\n- **狭义相对论**的两个基本原理：**相对性原理**和**光速不变原理**。\n- **广义相对论**的核心思想：**等效原理**（引力与加速度等效）和**时空弯曲**（物质告诉时空如何弯曲，时空告诉物质如何运动）。\n- **光电效应**方程：**E_k = hν - W**，其中h是**普朗克常量**，ν是入射光频率，W是**逸出功**。该理论支持了**光的粒子性**。\n- 爱因斯坦对*
