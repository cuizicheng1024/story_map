  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

过“木棉”对“橡树”的内心独白，树立了一种独立平等、互相尊重、风雨同舟的**现代爱情观**。\n    - **重点**：《祖国啊，我亲爱的祖国》运用“破旧的老水车”、“熏黑的矿灯”等密集**意象**，将个人命运与祖国命运紧密相连，抒发了从迷惘到深思再到沸腾的**爱国情感**。\n    - **朦胧诗**的典型特征：注重自我内心情感的开掘，采用象征、隐喻、通感等手法，诗歌意义具有多义性和不确定性。\n    - **象征手法**的运用：如“橡树”象征男性的阳刚与独立，“木棉”象征女性的美丽与坚韧，共同构成理想的爱情人格。\n    - **对比与转折**：《祖国啊，我亲爱的祖国》中，将祖国的“贫困”、“悲哀”与“希望”、“沸腾”进行强烈对比，形成情感张力。\n    - **重点**：诗歌的**抒情主人公**形象鲜明，无论是追求爱情的女性，还是与祖国共命运的赤子，都体现了强烈的**主体意识**。\n    - **语言风格**：清新、柔婉中蕴含着刚毅与力量，善于将抽象的情感具象化。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：舒婷是**朦胧诗派**的代表诗人之一，该诗派兴起于20世纪70年代末，是对当时主流诗歌模式的一次重要突破。\n    - **重点**：其作品是**新时期文学**（指1976年“文革”结束后）复苏与转型的重要标志，反映了思想解放运动在文学领域的深化。\n    - **重点**：围绕其诗作的争论（如“懂与不懂”之争），是1980年代初**文艺界思想交锋**的一个缩影，推动了诗歌美学观念的解放。\n    - **重点**：她的创作历程，从早期充满抗争与理想的抒情，到后期趋于平和、哲思的散文写作，折射出**中国当代知识分子**的心路变迁。\n- 核心要点：\n    - **重点**：其创作高峰与中国的**改革开放**进程同步，诗歌中个人的觉醒与时代的解放相互呼应。\n    - **重点**：作为**朦胧诗**的代表，她与北岛、顾城等人一起，将中国新诗从政治附庸的地位拉回对**艺术本体**和**人**的关注。\n    - **重点**：其诗歌的核心主题是**人的价值**与**尊严**的呼唤，这在经历了个人崇拜与集体主义至上的年代后，具有振聋发聩的意义。\n    - **重点**：作品被选入**中学语文教材**，成为几代人共同的文学记忆，影响了广泛的社会审美与价值观。\n    - **重点**：作品被翻译成多种语言，是世界了解中国当代诗歌的一个窗口。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《致橡树》**、**《祖国啊，我亲爱的祖国》**、《双桅船》（节选或作为篇目提及）。\n- 核心要点：\n    - **重点**：《致橡树》通过“木棉”对“橡树”的内心独白，树立了一种独立平等、互相尊重、风雨同舟的**现代爱情观**。\n    - **重点**：《祖国啊，我亲爱的祖国》运用“破旧的老水车”、“熏黑的矿灯”等密集**意象**，将个人命运与祖国命运紧密相连，抒发了从迷惘到深思再到沸腾的**爱国情感**。\n    - **朦胧诗**的典型特征：注重自我内心情感的开掘，采用象征、隐喻、通感等手法，诗歌意义具有多义性和不确定性。\n    - **象征手法**的运用：如“橡树”象征男性的阳刚与独立，“木棉”象征女性的美丽与坚韧，共同构成理想的爱情人格。\n    - **对比与转折**：《祖国啊，我亲爱的祖国》中，将祖国的“贫困”、“悲哀”与“希望”、“沸腾”进行强烈对比，形成情感张力。\n    - **重点**：诗歌的**抒情主人公**形象鲜明，无论是追求爱情的女性，还是与祖国共命运的赤子，都体现了强烈的**主体意识**。\n    - **语言风格**：清新、柔婉中蕴含着刚毅与力量，善于将抽象的情感具象化。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：舒婷是**朦胧诗派**的代表诗人之一，该诗派兴起于20世纪70年代末，是对当时主流诗歌模式的一次重要突破。\n    - **重点**：其作品是**新时期文学**（指1976年“文革”结束后）复苏与转型的重要标志，反映了思想解放运动在文学领域的深化。\n    - **重点**：围绕其诗作的争论（如“懂与不懂”之争），是1980年代初**文艺界思想交锋**的一个缩影，推动了诗歌美学观念的解放。\n    - **重点**：她的创作历程，从早期充满抗争与理想的抒情，到后期趋于平和、哲思的散文写作，折射出**中国当代知识分子**的心路变迁。\n- 核心要点：\n    - **重点**：其创作高峰与中 童年时期\n- **地点**：福建泉州\n- **事件**：出生于一个普通家庭，度过童年。\n- **意义**：闽南厝角的屋檐下，舒婷自幼浸润于南音芗剧的余韵之中。母亲灯下诵读古诗的静谧、采茶女山歌的缭绕，将土地特有的温婉与坚韧悄然注入血脉，成为她日后诗行间缠绵而不失刚劲的最初底色\n\n### 📍 重要地点：厦门\n- **时间**：少年时期\n- **停留时间**：数年\n- **地点**：福建厦门\n- **事件**：随家庭移居厦门，完成部分学业。\n- **意义**：水泥厂粉尘与车床轰鸣中，舒婷把青春消耗在流水线上，却总在深夜昏灯下、凌晨工间休息的片刻，将涌动的诗句偷偷写在废纸背面。正是与重体力活相伴的日子，孕育了《致橡树》等早期代表作的雏形\n\n### 📍 重要地点：上杭县\n- **时间**：1969年-1972年\n- **停留时间**：约3年\n- **地点**：福建上杭县\n- **事件**：作为知识青年上山下乡，在乡村插队劳动。\n- **意义**：这段艰苦的岁月让她深刻体验了底层生活，为其后来诗歌中的人民性与反思精神奠定了基础。\n\n### 📍 重要地点：福州\n- **时间**：1972年-1970年代末\n- **停留时间**：约7年\n- **地点**：福建福州\n- **事件**：从上杭县返城后，先回厦门，后至福州，在福州当过多种临时工，如水泥工、挡车工、焊锡工等。约1975年起开始诗歌创作并结识福建本土文学圈友人，以“舒婷”为笔名发表诗作。\n- **意义**：搬运水泥的间隙，她偷偷写下那些后来震动诗坛的句子。《致橡树》的雏形与《祖国啊，我亲爱的祖国》的初稿，都诞生于1977年前后那个机油味弥漫的车间——一个知青用笔尖对抗命运最倔强的姿态\n\n### 📍 重要地点：北京\n- **时间**：1970年代末-1980年代\n- **停留时间**：多次短期居留\n- **地点**：北京\n- **事件**：参加《诗刊》组织的“青春诗会”（1980年）；作品在《今天》杂志发表后引发全国性讨论；参与一系列文学活动。\n- **意义**：作为朦胧诗争论的中心舞台，在这里其作品获得了全国性声誉，也承受了巨大的争议与压力。\n\n### 📍 重要地点：福州（福建省文联）\n- **时间**：1980年代至今\n- **停留时间**：长期\n- **地点**：福建福州\n- **事件**：调入福建省文联，成为专业作家。持续进行诗歌、散文创作，出版多部诗集与散文集。\n- **意义**：生活与创作的稳定基地，完成了从青年诗人到成熟作家的转变，后期作品风格更趋沉静、深邃。\n\n### 📍 重要地点：德国柏林（具体城市存疑）\n- **时间**：1990年代\n- **停留时间**：存疑（说法不一，有称数年）\n- **地点**：德国柏林（具体城市存疑）\n- **事件**：曾受邀在德国进行学术访问与写作。\n- **意义**：海外生活经历拓展了其文化视野，影响了其后期散文创作的题材与思考维度。\n\n### 📍 重要地点：武夷山\n- **时间**：多次\n- **停留时间**：短期\n- **地点**：福建武夷山\n- **事件**：参与文学活动或休憩。\n- **意义**：福建的自然与人文景观是其灵感的重要来源之一，武夷山的意象可能隐现于其部分作品中。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1952 | 泉州 | 福建泉州 | （年龄：0）出生于福建泉州。 |\n| 1969 | 上杭县 | 福建上杭县 | （年龄：17）赴福建上杭县插队落户。 |\n| 1972 | 上杭县 | 福建上杭县 | （年龄：20）从上杭县返城，先回厦门，后至福州，做过多种临时工。 |\n| 1975 |  |  | （年龄：23）开始在民间刊物发表诗作。 |\n| 1977 |  |  | （年龄：25）与诗人北岛通信，作品开始在《今天》杂志发表。 |\n| 1979 |  |  | （年龄：27）《致橡树》在《诗刊》发表，引起广泛关注。 |\n| 1980 |  |  | （年龄：28）参加《诗刊》“青春诗会”；《福建文学》围绕其诗作展开专题讨论。 |\n| 1981 |  |  | （年龄：29）发表《祖国啊，我亲爱的祖国》，获全国中青年诗人优秀新诗奖。 |\n| 1982 |  |  | （年龄：30）第一部诗集《双桅船》出版。 |\n| 1985 |  |  | （年龄：33）散文集《心烟》出版，创作重心部分转向散文。 |\n| 1990年代 |  |  | （年龄：40+）曾赴德国等地访问、写作（具体时长存疑
