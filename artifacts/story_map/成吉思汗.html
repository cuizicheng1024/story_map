  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

战与治国中多次发布约束滥杀、保护归附者与工匠的命令，后世常概括为“止杀令”；发动第一次西征，攻灭花剌子模、西辽等；为元朝的建立奠定基础\n\n### 生平概述\n成吉思汗，名铁木真，出身于蒙古高原的乞颜部，幼年丧父，经历部落仇杀与颠沛流离。12世纪末，他凭借军事才能与政治整合能力，先后击败塔塔儿、克烈、乃蛮等部，于1206年在斡难河源举行忽里勒台，被推举为大汗，尊号“成吉思汗”，建立大蒙古国，成为蒙古帝国的奠基者与首任大汗。此后推行千户制、怯薛军、驿站系统等制度，命畏兀儿人塔塔统阿创制蒙古文字，逐步建立起草原帝国的秩序框架；在法律与统治层面，他颁行《大札撒》，实行相对宽容的宗教政策，并在征战与治国过程中多次发布约束滥杀、安抚归附者、保护工匠与百姓生产的命令，后世常以“止杀令”概括这类措施。1219年起发动第一次西征，攻灭花剌子模，势力扩展至中亚，并客观上推动了横跨丝绸之路的贸易往来。1227年病逝于征夏途中，其后继者继续扩张，并为元朝建立奠定基础。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：自斡难河上游崛起，统一蒙古诸部，建国于斡难河源，西征至中亚，晚年南征西夏止于六盘山\n- ⏱️ **时间跨度**：约1162年—1227年，约65年\n- 📍 **地理范围**：蒙古高原、中亚（撒马尔罕等）、六盘山地区\n- 🌟 **重要节点数量**：核心地点6处\n- 🚶 **总行程估算**：约 8528 公里\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：漠北斡难河上游\n- **公元纪年**：约1162年（存疑）\n- **停留时间**：幼年时期，后随部族迁徙离开\n- **位置**：古称斡难河上游（今蒙古国肯特省达达勒苏木一带）\n- **事迹**：出生于蒙古乞颜部贵族也速该之家，幼名铁木真；约9岁时父亲被塔塔儿部毒杀，部族离散，随母亲诃额仑艰难度过少年时代\n- **意义**：约1162年，乞颜部首领也速该在蒙古高原某处营帐，为新生儿取名\"铁木真\"——那是仇敌塔塔儿人的名字，也是日后震碎欧亚的预兆。确切地点已湮没于风沙，但一切征服史的原点，就从这里开始\n\n### 📍 重要地点：克烈部王汗驻地（蒙古草原）\n- **公元纪年**：约12世纪80年代\n- **停留时间**：数年间，曾依附王汗\n- **位置**：古称蒙古草原克烈部驻地（今蒙古国中央省土拉河上游草原地带）\n- **事迹**：在与泰赤乌部对抗中投靠克烈部首领王汗，被收为义子；通过联姻与结盟，逐步积蓄实力\n- **意义**：1203年，铁木真与王汗决裂，合兰真沙陀之战击溃克烈部，王汗败亡。蒙古高原最后的旧秩序就此崩塌，帝国诞生的道路终于畅通——克烈王帐的废墟旁，一个新世界的第一缕晨光升起部\n\n### 📍 重要地点：斡难河源（建国大典之地）\n- **公元纪年**：1206年\n- **停留时间**：即位大典举行地\n- **位置**：古称斡难河源（今蒙古国肯特省布尔罕哈勒敦山麓）\n- **事迹**：统一蒙古各部后，在斡难河源头召开忽里勒台大会，被推举为大汗，尊号\"成吉思汗\"，建立大蒙古国\n- **意义**：少年铁木真曾寄身王汗帐下，以安达之谊共御草原风雨；不料1203年王汗听信谗言背盟夜袭，哈兰真沙陀一战几近全军覆没。绝处重生的铁木真收拢旧部、吞并克烈，三年后于斡难河畔竖起九旒白纛、建号成吉思汗——蒙古帝国序幕由此真正拉开\n\n### 📍 重要地点：哈拉和林地区\n- **公元纪年**：1220年前后\n- **停留时间**：西征前后蒙古高原中枢区域\n- **位置**：今蒙古国前杭爱省哈拉和林遗址一带\n- **事迹**：成吉思汗时期此地属于蒙古高原政治军事中枢区域；作为固定都城的哈拉和林主要由窝阔台时期营建。\n- **意义**：用于标示大蒙古国后期在蒙古高原的指挥中枢区域，避免把后来的都城建制完全前推到成吉思汗本人时期。\n\n### 📍 重要地点：撒马尔罕（中亚）\n- **公元纪年**：1219—1225年（第一次西征期间）\n- **停留时间**：西征途中攻取并驻军\n- **位置**：古称撒马尔罕（今乌兹别克斯坦撒马尔罕市）\n- **事迹**：第一次西征中攻取花剌子模都城撒马尔罕，迫使花剌子模算端（苏丹）摩诃末西逃；该城成为蒙古军控制中亚的重要据点\n- **意义**：蒙古铁骑踏入中亚腹地的标志性事件，开启蒙古对西域的大规模征服\n\n### 🔴 去世地：六盘山\n- **公元纪年**：1227年\n- **停留时间**：1227年夏避暑与南征指挥期间\n- **位置**：古称六盘山（今宁夏固原市泾源县六盘山一带）\n- **经过**：在亲征西夏途中，于六盘山驻营休整；据《元史》与《蒙古秘史》等记载，病逝于军中，留下“联宋攻金、先取西夏”等战略遗意\n- **意义**：成吉思汗生命的终点；其逝世后不久，西夏灭亡，蒙古继续南下攻金，为元朝统一奠基\n- **说明**：去世地与死因在不同史籍中略有差异（病死、坠马伤重等），存疑\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1162年 | 漠北斡难河上游 | 今蒙古国肯特省达达勒苏木一带 | 出生于蒙古乞颜部贵族之家，幼名铁木真 |\n| 约12世纪70—80年代 | 蒙古草原克烈部驻地 | 今蒙古国中央省土拉河上游草原地带 | 投靠克烈部王汗，逐步积蓄实力 |\n| 1189年 | 蒙古草原 | 蒙古高原 | 被推举为蒙古部汗 |\n| 1206年 | 斡难河源 | 今蒙古国肯特省布尔罕哈勒敦山麓 | 统一蒙古各部，称成吉思汗，建立大蒙古国 |\n| 1220年前后 | 哈拉和林 | 今蒙古国前杭爱省哈拉和林遗址 | 形成大蒙古国的重要政治中心 |\n| 1219—1225年 | 花剌子模、撒马尔罕 | 今乌兹别克斯坦撒马尔罕市 | 发动第一次西征，攻灭花剌子模 |\n| 1227年 | 六盘山 | 今宁夏固原市泾源县六盘山一带 | 病逝于南征西夏途中 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n成吉思汗统一蒙古高原，结束了各部长期混战的局面，奠定了大蒙古国的政治军事基础；通过西征将蒙古的势力范围迅速扩展至中亚，深刻改变了13世纪欧亚大陆的政治版图，对金朝、西夏、西辽、花剌子模等政权形成巨大冲击，为其后元朝的统一创造了前提。\n\n### 对后世的影响\n- **元朝建立基础**：成吉思汗的军事征服与政治整合，为其孙忽必烈建立元朝、统一全国奠定了版图与制度基础\n- **行省与军制雏形**：千户制、怯薛军等军政制度对后世蒙古诸汗国及元朝制度产生深远影响\n- **欧亚交流促进**：蒙古帝国的疆域横跨欧亚，在客观上促进了东西方贸易、科技与文化交流（如\"蒙古和平\"下的丝绸之路畅通）\n- **蒙古文化成型**：命塔塔统阿创制蒙古文字，使蒙古民族有了统一的书面文字，对后世蒙古文化的延续具有奠基意义\n- **统治秩序影响**：驿站、法令与安民护工措施共同构成蒙古帝国早期治理框架，“止杀令”式命令也常被后世视为其从单纯征服走向帝国治理的体现\n\n### 历史评价\n- 《元史·太祖本纪》载其\"深沉有大略，用兵如神\"——传统正史对其军事才能的肯定\n- 毛泽东《沁园春·雪》：\"一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。\"——对其武功的文学化概括与超越式评价\n- 近世学者多评价其为\"游牧世界帝国\"的缔造者，深刻塑造了13—14世纪欧亚大陆的政治格局\n- 其形象兼具统一者、征服者与帝国建制者三重面向；关于其军事扩张的残酷性与“止杀安民”措施的治理意义，后世评价长期并存且争议明显\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：12世纪末—13世纪初，蒙古高原各部混战，南宋与金朝对峙\n- **关键事件**：铁木真经历磨难后统一蒙古各部；1206年建立大蒙古国，称成吉思汗\n- **制度创设**：推行**千户制**、**怯薛军**，颁布**《大札撒》**\n- **文化贡献**：命塔塔统阿创制**蒙古文字**（使用回鹘字母拼写蒙古语）\n- **军事行动**：发动**第一次西征**，攻灭**花剌子模**\n- **历史地位**：被尊为蒙古族英雄；为**元朝建立**奠定基础\n- **易混点**：成吉思汗≠忽必烈；成吉思汗建立的是**大蒙古国**，**元朝**是其后忽必烈所建\n- **易混点**：铁木真（名）与成吉思汗（尊号）的关系\n\n### 高中阶段\n- **时代背景**：10—13世纪游牧文化与农耕文化的冲突与融合，蒙古帝国崛起\n- **关键事件**：1189年被推举为蒙古部汗；1206年斡难河源建国；1219—1225年第一次西征；1227年病逝\n- **制度创新**：**千户制**（将全体百姓划分为95个千户，取代旧氏族组织）、**怯薛军**（精锐禁卫军）\n- **法律文献**：**《大札撒》**——成吉思汗颁布的成文法典\n- **文化贡献**：**蒙古文字**的创制，提升了民族认同与行政效率\n- **交通治理**：驿站系统有助于军令传递、物资调度与跨区域统治\n- **治理措施**：注意区分成吉思汗的军事征服与其治国举措，后世常以“止杀令”概括其约束滥杀、保护归附人口与工匠的部分命令\n- **西征影响**：打通欧亚通道，客观上促进东西方文化交流；改变中亚、西亚政治版图\n- **历史意义**：游牧民族对农耕世界冲击的顶峰；为**元朝统一多民族国家**奠基\n- **易混点对比**：成吉思汗（1162—1227）建立的\"大蒙古国\" ≠ 忽必烈（1271—1294在位）建立的\"元朝\"\n- **争议点**：生年（约1162年/1155年等说法不一）、死因（病死/坠马/中毒等存疑）、出生地具体位置史料记载不一\n\n---\n\n## 初高中阶段考点\n\n### 初中考点\n- 写出成吉思汗的**本名**\n- 说出**1206年**成吉思汗建立大蒙古国的史实\n- 列举成吉思汗的两项**重要制度**（千户制、怯薛军）\n- 指出成吉思汗命人创制的**蒙古文字**及其意义\n- 简述成吉思汗**第一次西征**的对象与影响\n- 区分\"大蒙古国\"与\"元朝\"的建立者\n\n### 高中考点\n- 论述成吉思汗**统一蒙古各部**的过程与历史意义\n- 分析**千户制**对蒙古社会组织结构的重塑作用\n- 评述**《大札撒》**的法律地位与历史作用\n- 概述**第一次西征**（1219—1225）的背景、经过与后果\n- 辨析成吉思汗对**元朝建立**的奠基作用（与忽必烈的关系）\n- 评价成吉思汗在**游牧—农耕文明交融**中的历史地位\n- 注意：**生年**、**出生地**、**死因**等存疑/说法不一的问题，答题时需说明教材采用的主流说法\n\n## 地点坐标（手工校准）\n| 现称 | 现代搜索地名 | 纬度 | 经度 | 坐标系 |\n| --- | --- | --- | --- | --- |\n| 今蒙古国肯特省达达勒苏木一带 | 蒙古国肯特省达达勒苏木 | 49.033000 | 111.613000 | WGS84 |\n| 今蒙古国中央省土拉河上游草原地带 | 蒙古国中央省土拉河上游草原 | 47.800000 | 106.900000 | WGS84 |\n| 蒙古高原 | 蒙古国乌兰巴托周边高原地带 | 47.918000 | 106.917000 | WGS84 |\n| 今蒙古国肯特省布尔罕哈勒敦山麓 | 蒙古国肯特省布尔罕哈勒敦 | 48.150000 | 109.000000 | WGS84 |\n| 今蒙古国前杭爱省哈拉和林遗址 | 蒙古国前杭爱省哈拉和林遗址 | 47.197000 | 102.836000 | WGS84 |\n| 今乌兹别克斯坦撒马尔罕市 | 乌兹别克斯坦撒马尔罕市 | 39.654000 | 66.959000 | WGS84 |\n| 今宁夏固原市泾源县六盘山一带 | 宁夏固原市泾源县六盘山 | 35.626000 | 106.287000 | WGS84 |\n","relatedGraph": {"center": {"id": 183,"name": "成吉思汗","file": "成吉思汗.html","dynasty": "12世纪末—13世纪初（南宋、金朝对峙时期，蒙古崛起之际）","birth_year": 1162,"death_year": 1227,"time_year": 1194,"quote": "联宋攻金、先取西夏","review": "","aliases": ["铁木真","Temujin","GenghisKhan"],"foreign_name": "","domain_tags": [],"main_role_band": "politics","main_role_label": "蒙古乞颜部首领","birthplace": "漠北斡难河上游","birthplace_raw": "漠北斡难河上游今蒙古国肯特省达达勒苏木一带","birthplace_modern": "蒙古国肯特省达达勒苏木一带","birth_lat_wgs84": 49.033,"birth_lng_wgs84": 111.613,"birth_lat": 49.033,"birth_lng": 111.613,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["成吉思汗","铁木真","Temujin","GenghisKhan"],"search_tokens": ["成吉思汗","铁木真","temujin","genghiskhan","chengjisihan","cjsh","tiemuzhen","tmz"]
