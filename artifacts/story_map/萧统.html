  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

n- **文学集团**：萧统在**东宫**聚集了众多文学之士，形成了一个文学中心。\n- **人物特点**：以**仁德**、**好学**著称。\n- **易混点**：区分 **《文选》**（总集）与个人别集（如《昭明太子集》）。\n- **存疑点**：刘勰是否参与其文学集团，说法不一。\n\n### 高中阶段\n- **文学史地位**：萧统是**南朝文学**繁荣的重要推动者和组织者，《文选》的编纂标志着文学**自觉时代**的深化。\n- **《文选》价值**：其选文标准 **“事出于沉思，义归乎翰藻”** 强调了文学的艺术性和形式美，对后世**文学批评**影响深远。\n- **“文选学”**：唐代以后，研究《文选》成为一门专门学问，称为 **“文选学”**，科举考试亦多以其为参考。\n- **作品传承**：许多汉魏六朝的作家作品（如**《古诗十九首》**）主要通过《文选》得以保存和流传。\n- **时代关联**：萧统的文学活动与**刘勰《文心雕龙》**、**钟嵘《诗品》** 等同期文学理论巨著的出现，共同构成了南朝文学理论的高峰。\n- **历史影响**：其早逝对**梁朝政局**的后续发展（如侯景之乱前的继承问题）产生了一定影响。\n- **对比点**：与编纂《玉台新咏》的**徐陵**相比，萧统的《文选》选文更侧重典雅宏正，而非宫体艳情。\n\n---","examPoints": "面向教学使用，按“初中/高中”分别输出要点清单。\n\n### 初中阶段考点\n1.  **昭明太子**是南朝**梁**代的皇太子，名叫**萧统**。\n2.  他最重要的成就是主持编纂了《**昭明文选**》（简称《文选》）。\n3.  《文选》是中国现存最早的**诗文总集**。\n4.  萧统以**仁德好学**闻名。\n5.  他生活在**南朝**时期，当时的皇帝是他的父亲**梁武帝萧衍**。\n6.  （存疑）《文选》具体开始编纂的年份，教材通常不强调具体时间。\n7.  （存疑）刘勰是否参与其文学集团，说法不一。\n\n### 高中阶段考点\n1.  **萧统**的文学史贡献核心是编纂《**文选**》。\n2.  《文选》的选录标准体现了 **“文学自觉”** ，强调 **“翰藻”** （文采）。\n3.  《文选》对后世影响巨大，形成了专门的学问 **“文选学”**。\n4.  《文选》保存了大量**先秦至梁**的文学作品，如**《古诗十九首》**。\n5.  萧统的**东宫**是当时一个重要的**文学中心**。\n6.  需区分《文选》（总集）与作家个人别集（如《曹子建集》）。\n7.  （正史记载为落水得疾）关于萧统之死，正史（《梁书》、《南史》）记载为哀伤过度及游湖落水得疾而逝。后世或有其他演绎说法。\n8.  将萧统的文学活动置于**南朝文学**繁荣的背景下理解，与**刘勰**、**钟嵘**等并论。","workTexts": {"文选序": "事出于沉思，义归乎翰藻。","之宣城郡出新林浦向板桥": "江路西南永，归流东北骛。","逸民": "如垄生木，木有异心。","与朝歌令吴质书": "每念昔日南皮之游，诚不可忘。","挽歌诗": "含言言哽咽，挥涕涕流离。","文选": "“昭明”"},"workSummaries": {"文选": {"title": "文选","aliases": [],"authors": ["李密","萧统"],"related_people": ["李密","萧统"],"source_pages": ["李密","萧统"],"era": "三国蜀汉至西晋","genre": "诗文总集","one_liner": "中国现存最早的诗文总集，由萧统主持编纂，收录先秦至南朝梁代七百余篇诗文辞赋，奠定后世文学选本典范。","summary": "李密，字令伯，犍为武阳人","quote": "","quotes": [],"quote_policy": "summary_only"},"昭明文选": {"title": "昭明文选","aliases": [],"authors": ["萧统"],"related_people": ["萧统"],"source_pages": ["萧统"],"era": "南朝梁","genre": "诗文总集","one_liner": "中国现存最早的诗文总集，由萧统主持编纂，收录先秦至南朝梁代一百三十余位作者的诗文辞赋约七百余篇，是后世学习骈文与古典文学的经典范本。","summary": "萧统是梁武帝萧衍长子，于齐中兴元年（501年）生于襄阳，次年梁朝建立即被立为太子","quote": "","quotes": [],"quote_policy": "sum 立即被立为太子","summary": "萧统是梁武帝萧衍长子，于齐中兴元年（501年）生于襄阳，次年梁朝建立即被立为太子","quote": "","quotes": [],"quote_policy": "summary_only"},"南史": {"title": "南史","aliases": [],"authors": [],"related_people": ["萧统"],"source_pages": ["萧统"],"era": "","genre": "","one_liner": "萧统是梁武帝萧衍长子，于齐中兴元年（501年）生于襄阳，次年梁朝建立即被立为太子","summary": "萧统是梁武帝萧衍长子，于齐中兴元年（501年）生于襄阳，次年梁朝建立即被立为太子","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 萧统\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：萧统（字德施，小字维摩）\n- **时代**：南朝梁\n- **出生**：公元501年，襄阳（今湖北襄阳）\n- **去世**：公元531年，建康（今江苏南京）\n- **享年**：31岁\n- **主要身份**：文学家、皇太子\n- **历史地位**：南朝梁代文学的代表人物与组织者，编纂了中国现存最早的诗文总集《文选》。\n- **主要成就**：主持编纂《文选》（《昭明文选》）；聚集文学之士，推动梁代文学发展；个人文学创作，辑有《昭明太子集》。\n\n### 生平概述\n萧统是梁武帝萧衍长子，于齐中兴元年（501年）生于襄阳，次年梁朝建立即被立为太子。他自幼聪慧，仁德好学，未及弱冠便广纳文士（刘勰是否参与其文学集团，说法不一），于东宫编书论学。其最重要的成就是主持编纂了《文选》，收录先秦至梁代的诗文辞赋，成为后世文学学习的典范。他为人至孝仁厚，因母亲丁贵嫔去世哀伤过度而身体受损，又在游湖时落水受惊，于中大通三年（531年）病逝，谥号“昭明”。其短暂一生虽未及即位，却在文学史上留下了不朽的印记。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于南朝梁的核心区域，即长江中下游的湖北、江苏一带。\n- ⏱️ **时间跨度**：公元501年—531年，共31年。\n- 📍 **地理范围**：以建康（今江苏南京）为中心，东至今江苏省镇江市，西达荆州（今湖北荆州）。\n- 🌟 **重要节点数量**：6个\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：襄阳\n- **公元纪年**：公元501年\n- **停留时间**：约1年\n- **位置**：襄阳（今湖北省襄阳市）\n- **事迹**：在此出生。时值齐末战乱，其父萧衍在此起兵。\n- **意义**：501年，萧统降生于萧梁肇建之际，自幼被立为皇太子，承载着父亲萧衍延续帝王基业的深切期望，却未料这份厚望终成压垮他三十一岁短暂人生的沉重枷锁\n\n### 📍 重要地点：建康（东宫）\n- **公元纪年**：公元502年—531年\n- **停留时间**：约29年（主要成长与生活地）\n- **位置**：建康（今江苏省南京市）\n- **事迹**：被立为太子，居东宫；主持编纂《文选》；广纳文学之士，形成“东宫文学集团”；处理部分朝政。\n- **意义**：531年，年仅三十一岁的萧统在东宫病逝，未及承继大统便匆匆离去，梁武帝悲痛欲绝而废朝举哀，梁朝的政治格局与文坛走向自此黯然改写，一段最有可能成就盛世的文学君梦戛然而止\n- **名篇名句**：《文选序》：“事出于沉思，义归乎翰藻。”\n\n### 📍 重要地点：荆州\n- **公元纪年**：约公元520年代\n- **停留时间**：短期巡游或暂居\n- **位置**：荆州（今湖北省荆州市）\n- **事迹**：作为太子出巡或镇守，接触地方文化。\n- **意义**：公元531年萧统病逝于此，谥号\"昭明\"。这位未及登基的储君猝然离世，迫使梁武帝改立萧纲为嗣，文学格局随之剧变——他曾力避的宫体诗风，最终在他身后弥漫整个南朝文坛\n- **名篇名句**：《文选》收录谢朓《之宣城郡出新林浦向板桥》：“江路西南永，归流东北骛。”\n\n### 📍 重要地点：镇江（北固楼等地）\n- **公元纪年**：约公元520年代\n- **停留时间**：短期游历\n- **位置**：京口（今江苏省镇江市）\n- **事迹**：游览山水，与文士唱和。\n- **意义**：公元531年萧统病逝于此，谥号\"昭明\"。这位未及登基的储君猝然离世，迫使梁武帝改立萧纲为嗣，文学格局随之剧变——他曾力避的宫体诗风，最终在他身后弥漫整个南朝文坛\n- **名篇名句**：《文选》收录其父梁武帝《逸民》：“如垄生木，木有异心。”\n\n### 📍 重要地点：玄圃（园林）\n- **公元纪年**：公元520年代\n- **停留时间**：常居地之一\n- **位置**：建康东宫内（今江苏省南京市玄武区）\n- **事迹**：与文士在此讨论典籍，商榷古今，是《文选》编纂的重要工作场所。\n- **意义**：三十一岁的萧统在此走完人生，玄圃落水伤及肋骨、染疾而终。萧纲继立、储位易主，东宫文坛群龙无首，文风由典雅滑向绮靡浮艳，王朝的政治与文化格局在此被悄然改写\n- **名篇名句**：《文选》收录曹丕《与朝歌令吴质书》：“每念昔日南皮之游，诚不可忘。”\n\n### 🔴 去世地：建康\n- **公元纪年**：公元531年\n- **停留时间**：人生最后阶段\n- **位置**：建康（今江苏省南京市）\n- **经过**：因游湖后船翻落水，惊悸成疾，加之此前为母丧哀伤过度，身体羸弱，不久病逝于东宫。\n- **意义**：三十一岁的萧统在此走完人生，玄圃落水伤及肋骨、染疾而终。萧纲继立、储位易主，东宫文坛群龙无首，文风由典雅滑向绮靡浮艳，王朝的政治与文化格局在此被悄然改写\n- **名篇名句**：《文选》收录陆机《挽歌诗》：“含言言哽咽，挥涕涕流离。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 公元501年 | 襄阳 | 湖北省襄阳市 | （年龄：1岁）生于襄阳。 |\n| 公元502年 |  |  | （年龄：2岁）梁朝建立，被立为皇太子。 |\n| 公元515年 | 建康（东宫） | 江苏省南京市 | （年龄：15岁）于东宫加元服，开始参与部分政务。 |\n| 约公元520年 |  |  | （年龄：约20岁）始聚文学之士（刘勰是否参与，说法不一），着手编纂《文选》。 |\n| 公元526年 |  |  | （年龄：26岁）母丁贵嫔去世，哀伤过度，自此健康受损。 |\n| 公元531年 | 建康 | 江苏省南京市 | （年龄：31岁）游湖落水成疾，三月后病逝，谥“昭明”。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n萧统作为储君，以其仁德宽厚、礼贤下士的作风和卓越的文学组织能力，在梁武帝执政前期凝聚了一批优秀的文人学者，形成了繁荣的东宫文学中心，推动了梁代文学的兴盛。他的早逝，也间接导致了梁朝后期继承人问题的纷争。\n\n### 对后世的影响\n- **文学范式的确立**：主持编纂的《文选》是中国文学史上影响最为深远的诗文总集之一，确立了“文选学”，成为后世文人学习诗文的经典教材。\n- **文学批评的实践**：《文选》的选录标准（“事出于沉思，义归乎翰藻”）体现了对文学审美特性的自觉追求，对后世文学批评有重要启发。\n- **文化传承的贡献**：通过《文选》保存了大量先秦至梁代的优秀文学作品，许多作品赖此得以传世。\n\n### 历史评价\n- 《梁书》评价：“太子生而聪睿，三岁受《孝经》、《论语》，五岁遍读五经，悉能讽诵。……太子美姿貌，善举止。读书数行并下，过目皆忆。”\n- 唐代李善：“《文选》者，孝敬之准式，人伦之师友。”\n- 后世学者多尊其为“昭明太子”，肯定其在文献整理与文学传承上的不朽功绩。\n\n---\n\n## 人教版教材知识点\n从初高中教材视角，梳理人物在教材叙述中常见的核心史实节点/作品与关键词。\n\n### 初中阶段\n- **时代背景**：**南朝**时期，**梁朝**建立，社会相对安定，文化繁荣。\n- **关键人物**：**昭明太子萧统**，梁武帝**萧衍**长子。\n- **主要贡献**：主持编纂了中国现存最早的诗文总集 **《文选》**（又称 **《昭明文选》**）。\n- **《文选》内容**：收录了从先秦到**南朝梁**代的诗文辞赋，是学习**骈文**和古典文学的重要范本。\n- **文学集团**：萧统在**东宫**聚集了众多文学之士，形成了一个文学中心。\n- **人物特点**：以**仁德**、**好学**著称。\n- **易混点**：区分 **《文选》**（总集）与个人别集（如《昭明太子集》）。\n- **存疑点**：刘勰是否参与其文学集团，说法不一。\n\n### 高中阶段\n- **文学史地位**：萧统是**南朝文学**繁荣的重要推动者和组织者，《文选》的编纂标志着文学**自觉时代**的深化。\n- **《文选》价值**：其选文标准 **“事出于沉思，义归乎翰藻”** 强调了文学的艺术性和形式美，对后世**文学批评**影响深远。\n- **“文选学”**：唐代以后，研究《文选》成为一门专门学问，称为 **“文选学”**，科举考试亦多以其为参考。\n- **作品传承**：许多汉魏六朝的作家作品（如**《古诗十九首》**）主要通过《文选》得以保存和流传。\n- **时代关联**：萧统的文学活动与**刘勰《文心雕龙》**、**钟嵘《诗品》** 等同期文学理论巨著的出现，共同构成了南朝文学理论的高峰。\n- **历史影响**：其早逝对**梁朝政局**的后续发展（如侯景之乱前的继承问题）产生了一定影响。\n- **对比点**：与编纂《玉台新咏》的**徐陵**相比，萧统的《文选》选文更侧重典雅宏正，而非宫体艳情。\n\n---\n\n## 初高中阶段考点\n面向教学使用，按“初中/高中”分别输出要点清单。\n\n### 初中阶段考点\n1.  **昭明太子**是南朝**梁**代的皇太子，名叫**萧统**。\n2.  他最重要的成就是主持编纂了《**昭明文选**》（简称《文选》）。\n3.  《文选》是中国现存最早的**诗文总集**。\n4.  萧统以**仁德好学**闻名。\n5.  他生活在**南朝**时期，当时的皇帝是他的父亲**梁武帝萧衍**。\n6.  （存疑）《文选》具体开始编纂的年份，教材通常不强调具体时间。\n7.  （存疑）刘勰是否参与其文学集团，说法不一。\n\n### 高中阶段考点\n1.  **萧统**的文学史贡献核心是编纂《**文选**》。\n2.  《文选》的选录标准体现了 **“文学自觉”** ，强调 **“翰藻”** （文采）。\n3.  《文选》对后世影响巨大，形成了专门的学问 **“文选学”**。\n4.  《文选》保存了大量**先秦至梁**的文学作品，如**《古诗十九首》**。\n5.  萧统的**东宫**是当时一个重要的**文学中心**。\n6.  需区分《文选》（总集）与作家个人别集（如《曹子建集》）。\n7.  （正史记载为落水得疾）关于萧统之死，正史（《梁书》、《南史》）记载为哀伤过度及游湖落水得疾而逝。后世或有其他演绎说法。\n8.  将萧统的文学活动置于**南朝文学**繁荣的背景下理解，与**刘勰**、**钟嵘**等并论。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 襄阳 | 湖北省襄阳市 | 32.01 | 112.14 |\n| 建康（东宫） | 江苏省南京市 | 32.06 | 118.80 |\n| 荆州 | 湖北省荆州市 | 30.33 | 112.24 |\n| 镇江（北固楼等地） | 江苏省镇江市 | 32.20 | 119.45 |\n| 玄圃（园林） | 江苏省南京市玄武区 | 32.07 | 118.82 |\n| 建康 | 江苏省南京市 | 32.06 | 118.80 |\n","relatedGraph": {"center": {"id": 390,"name": "萧统","file": "萧统.html","dynasty": "南朝梁","birth_year": 501,"death_year": 531,"time_year": 516,"quote": "东宫文学集团","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "science","main_role_label": "文学家","birthplace": "襄阳","birthplace_raw": "襄阳今湖北襄阳","birthplace_modern": "湖北襄阳","birth_lat_wgs84": 32.01,"birth_lng_wgs84": 112.14,"birth_lat": 32.01,"birth_lng": 112.14,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["萧统"],"search_tokens": ["萧统","xiaotong","xt"],"search_pinyin": ["xiaotong","xt"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人
