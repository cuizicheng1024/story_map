   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

元首、第二次世界大战发动者\n- **历史地位**：纳粹德国的独裁统治者，第二次世界大战的发动者，对犹太人等群体实施种族灭绝的主要责任人。\n- **关键政治节点**：（注：以下指其政治生涯中的关键节点与行动，非正面评价）\n    1. 通过政治运作成为德国国家社会主义工人党（纳粹党）领袖。\n    2. 1933年被任命为德国总理，随后建立纳粹独裁政权。\n    3. 推行大规模重整军备计划，打破《凡尔赛条约》束缚。\n    4. 发动第二次世界大战，初期在欧洲取得重大军事胜利。\n    5. 建立并维持了以种族主义为核心的极权统治体系。\n- **主要成就**：（注：以下为历史事实的客观记录，非价值肯定）\n    1. 通过大规模公共工程和军备生产，短期内显著降低了德国的失业率。\n    2. 推动德国经济从大萧条中恢复，实现了快速的工业化与军事现代化。\n    3. 其发动的战争与种族灭绝政策最终导致了纳粹德国的覆灭，深刻改变了20世纪世界格局。\n\n### 生平概述\n阿道夫·希特勒出生于奥匈帝国边境小镇，早年于维也纳流浪的经历塑造了其极端民族主义思想。第一次世界大战中作为德国士兵的经历使其对《凡尔赛条约》充满仇恨。战后，他加入并改造了纳粹党，利用《凡尔赛条约》带来的民族屈辱感、经济危机和政治动荡，通过煽动性演说和政治阴谋于1933年攫取德国最高权力。执政后，他迅速消灭异己，建立一党专政，推行反犹政策，并系统性地扩军备战。1939年入侵波兰，引发第二次世界大战。战争初期德军横扫欧洲，但1941年入侵苏联及对美宣战导致战局逆转。1945年，盟军攻入柏林，希特勒在总理府地下室自杀身亡。其统治给欧洲和世界带来了空前浩劫。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从奥地利边境小镇，经慕尼黑、维也纳、一战西线战场，到德国政治中心柏林，并延伸至被占领的欧洲多地。\n- ⏱️ **时间跨度**：1889年-1945年，共56年。\n- 📍 **地理范围**：主要覆盖今奥地利、德国、比利时、法国、波兰及前苏联部分地区。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：布劳瑙\n- **时间**：1889年4月20日\n- **停留时间**：幼年（约3年）\n- **地点**：布劳瑙（今奥地利上奥地利州布劳瑙）\n- **事件**：出生于一个奥地利海关职员家庭。\n- **意义**：1889年4月20日生于布劳瑙镇，这座与德国仅一河之隔的边境小城成了他命运的起点。奥地利身份在日后成为政治神话中一笔被反复涂抹的底色，既被刻意否认又被巧妙利用，伴随他直至终局\n\n### 📍 重要地点：林茨与莱昂丁\n- **时间**：1898年-1905年\n- **停留时间**：约7年\n- **地点**：林茨、莱昂丁（今奥地利上奥地利州）\n- **事件**：在林茨上学，成绩不佳，对艺术产生浓厚兴趣。后随家人迁至莱昂丁。\n- **意义**：形成对德意志民族主义的初步认同，学业失败促使其立志成为艺术家。\n\n### 📍 重要地点：维也纳\n- **时间**：1907年-1913年\n- **停留时间**：约6年\n- **地点**：维也纳（今奥地利维也纳）\n- **事件**：报考维也纳艺术学院两次被拒。父母双亡后，一度流浪，寄居收容所，靠卖画明信片为生。广泛阅读并吸收了当时维也纳的极端民族主义和反犹主义思想。\n- **意义**：人生低谷与思想成型的关键时期，奠定了其种族主义、反犹主义和对哈布斯堡王朝的斯拉夫化的憎恶。\n\n### 📍 重要地点：慕尼黑\n- **时间**：1913年-1914年（战前）\n- **停留时间**：约1年\n- **地点**：慕尼黑（今德国巴伐利亚州慕尼黑）\n- **事件**：为逃避奥匈帝国兵役迁居慕尼黑，继续以卖画为生。\n- **意义**：1945年4月30日，柏林帝国总理府地下掩体中，随着一声枪响，一个独裁者的生命走到终点。十二年第三帝国梦碎，欧洲满目疮痍，而他至死未能再见到童年梦想中的林茨\n\n### 📍 重要地点：第一次世界大战西线战场\n- **时间**：1914年-1918年\n- **停留时间**：约4年\n- **地点**：西线战场（如比利时伊普尔、法国索姆河等地）\n- **事件**：主动加入巴伐利亚预备步兵团，作为传令兵参战，曾参加伊普尔战役、索姆河战役等，两次负伤，获一级铁十字勋章。\n- **意义**：战争经历强化了其对军国主义的信仰，并为其提供了“前线战士”的政治资本。战败的消息令他深感震惊和屈辱。\n\n### 📍 重要地点：慕尼黑（政治发迹地）\n- **时间**：1919年-1923年\n- **停留时间**：约4年\n- **地点**：慕尼黑（今德国巴伐利亚州慕尼黑）\n- **事件**：加入德国工人党（后改组为纳粹党），成为其领袖。发表激烈演说，组织冲锋队。1923年发动“啤酒馆暴动”失败被捕。\n- **意义**：正式踏入政坛，确立其煽动型领袖地位。在狱中口述《我的奋斗》，系统阐述其思想。\n\n### 📍 重要地点：柏林（掌权与统治）\n- **时间**：1933年-1945年\n- **停留时间**：约12年\n- **地点**：柏林（今德国柏林）\n- **事件**：1933年1月被任命为总理。通过“国会纵火案”等事件巩固权力，成为“元首”。在柏林策划并发动第二次世界大战。战争后期坐镇柏林总理府地堡指挥。\n- **意义**：纳粹德国的权力心脏，其独裁统治、战争决策和种族灭绝政策的指挥中心。\n- **名篇名句**：1939年国会演讲：“无论何时，我只看见一个目标：无情地消灭那些应对这场战争负责的人。”\n\n### 📍 重要地点：贝希特斯加登（贝格霍夫）\n- **时间**：1928年起频繁居住\n- **停留时间**：累计数年\n- **地点**：贝希特斯加登（今德国巴伐利亚州贝希特斯加登）\n- **事件**：在此地的别墅“贝格霍夫”度过大量时间，接见国内外政要，策划重大政治军事决策。\n- **意义**：他梦想凯旋归乡的终点，化作野心彻底破碎的注脚。曾许诺以征服者姿态重回多瑙河畔安度余生，帝国崩塌后此愿化为永远无法抵达的幻梦，唯余莱昂丁父母孤坟\n\n### 📍 重要地点：狼穴（东普鲁士大本营）\n- **时间**：1941年-1944年\n- **停留时间**：约800多天\n- **地点**：拉斯滕堡附近（今波兰瓦尔米亚-马祖里省肯琴附近）\n- **事件**：作为东线战场的主要指挥所，在此指挥对苏作战。1944年7月20日在此遭遇刺杀未遂。\n- **意义**：第二次世界大战期间使用时间最长的元首大本营，见证了苏德战争的转折。\n- **名篇名句**：（刺杀事件后广播讲话）“一小撮野心勃勃、不负责任的同时又是愚蠢的军官……”\n\n### 📍 重要地点：纽伦堡\n- **时间**：1927年起定期举行\n- **停留时间**：累计数周\n- **地点**：纽伦堡（今德国巴伐利亚州纽伦堡）\n- **事件**：纳粹党在此举行大规模党代会，是宣传纳粹意识形态和展示组织力量的核心场合。\n- **意义**：1945年4月30日，柏林帝国总理府地下掩体中，随着一声枪响，一个独裁者的生命走到终点。十二年第三帝国梦碎，欧洲满目疮痍，而他至死未能再见到童年梦想中的林茨\n\n### 📍 重要地点：鹰巢\n- **时间**：1939年后\n- **停留时间**：不定期\n- **地点**：贝希特斯加登附近（今德国巴伐利亚州贝希特斯加登）\n- **事件**：作为元首的避难所和接待贵宾的场所，建于山顶，视野开阔。\n- **意义**：1945年4月30日，柏林帝国总理府地下掩体中，随着一声枪响，一个独裁者的生命走到终点。十二年第三帝国梦碎，欧洲满目疮痍，而他至死未能再见到童年梦想中的林茨\n\n### 🔴 去世地：柏林（元首地堡）\n- **时间**：1945年4月30日\n- **停留时间**：约105天（最后阶段）\n- **地点**：柏林（今德国柏林）\n- **事件**：在苏联红军攻入柏林市中心之际，于总理府地下掩体内与爱娃·布劳恩结婚，随后双双自杀。\n- **意义**：他梦想凯旋归乡的终点，化作野心彻底破碎的注脚。曾许诺以征服者姿态重回多瑙河畔安度余生，帝国崩塌后此愿化为永远无法抵达的幻梦，唯余莱昂丁父母孤坟\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1889 | 布劳瑙 | 奥地利上奥地利州布劳瑙 | （年龄：0）出生于奥地利布劳瑙。 |\n| 1907 | 维也纳 | 奥地利维也纳 | （年龄：18）报考维也纳艺术学院失败，母亲去世（父亲已于1903年去世）。 |\n| 1913 | 慕尼黑 | 德国巴伐利亚州慕尼黑 | （年龄：24）移居德国慕尼黑。 |\n| 1914 |  |  | （年龄：25）第一次世界大战爆发，加入德军参战。 |\n| 1919 |  |  | （年龄：30）加入德国工人党（纳粹党前身）。 |\n| 1923 |  |  | （年龄：34）发动啤酒馆暴动失败，被捕入狱，狱中口述《我的奋斗》。 |\n| 1933 |  |  | （年龄：44）被任命为德国总理。 |\n| 1934 |  |  | （年龄：45）成为
