  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

ated_people": ["荀彧"], "source_pages": ["荀彧"], "era": "西晋", "genre": "传记", "one_liner": "荀彧出身颍川荀氏，少有才名", "summary": "荀彧出身颍川荀氏，少有才名", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "资治通鉴": {"title": "资治通鉴", "aliases": [], "authors": ["郭子仪", "司马光", "朱温"], "related_people": ["法正", "顾颉刚", "郭子仪", "霍光", "司马光", "太平公主", "唐高宗", "王仙芝", "荀彧", "朱温"], "source_pages": ["法正", "顾颉刚", "郭子仪", "霍光", "司马光", "太平公主", "唐高宗", "王仙芝", "荀彧", "朱温"], "era": "唐朝", "genre": "编年体通史", "one_liner": "中国第一部编年体通史巨著，上起战国下迄五代，共294卷，以史为鉴，为帝王治国理政提供借鉴。", "summary": "| 1958 | | | （年龄：65）主持标点《资治通鉴》工作完成。", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 荀彧\n\n## 人物档案\n\n### 基本信息\n- **姓名**：荀彧\n- **时代**：东汉末年\n- **出生**：公元163年，颍川颍阴（今河南省许昌市）\n- **去世**：公元212年，寿春（今安徽省淮南市寿县）（死因存疑：一说忧病而卒，一说服毒自尽）\n- **享年**：49岁（虚岁50）\n- **主要身份**：政治家、战略家\n- **历史地位**：曹操统一北方的首席谋臣和功臣，被誉为“王佐之才”。\n- **主要成就**：为曹操规划统一北方的军事战略蓝图；劝说曹操迎奉汉献帝，取得政治主动权；为曹操举荐了大量人才（如荀攸、郭嘉、陈群等，司马懿举荐之说存疑）；在后方稳固根基，保障前线供给。\n\n### 生平概述\n荀彧出身颍川荀氏，少有才名。东汉末年，约公元184年举孝廉（具体年份存疑），任守宫令，后弃官归乡。率宗族避难冀州，被袁绍待为上宾，后料袁绍不能成大事，于初平二年（公元191年）投奔曹操。他被曹操称为“吾之子房”，是曹操集团的核心谋主，在战略规划、政治建制、人才举荐等方面贡献卓著。官至侍中、尚书令，居中持重十余年。晚年因反对曹操晋封魏公，两人关系产生裂痕，于随征孙权途中病逝于寿春（死因存疑：一说忧病而卒，一说服毒自尽）。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于中原地区，足迹遍及河南、河北、山东、安徽等地。\n- ⏱️ **时间跨度**：约公元163年-212年，总跨度约50年。\n- 📍 **地理范围**：以豫州（颍川）、司隶（洛阳）、冀州、兖州、豫州（许都）、扬州（寿春）为核心区域。\n- 🌟 **重要节点数量**：8个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：颍阴\n- **时间**：公元163年\n- **停留时间**：青少年时期\n- **地点**：颍川颍阴（今河南省许昌市）\n- **事件**：出生于颍川郡著名的士族荀氏家族，少年时即被名士何颙认为有“王佐才”。\n- **意义**：颍川荀氏的百年门第，浸润出荀彧洞察人心的政治直觉。他于乱世中举荐郭嘉、荀攸，靠的正是这份士族血脉中的识人之明。家族声望是他行走天下的通行证，也为日后辅佐曹操作了最深的注脚\n\n### 📍 重要地点：洛阳\n- **时间**：约公元184年-189年\n- **停留时间**：数年\n- **地点**：司隶河南尹洛阳（今河南省洛阳市）\n- **事件**：被举孝廉，拜守宫令。目睹董卓之乱，预感天下将大乱。\n- **意义**：初入仕途，积累中央任职经验；亲身经历汉末中央政权崩坏，为其战略眼光提供现实依据。\n\n### 📍 重要地点：冀州（邺城）\n- **时间**：约公元189年-191年\n- **停留时间**：约2年\n- **地点**：冀州（治所邺城，今河北省临漳县）\n- **事件**：率宗族离开颍川，北上冀州避难。袁绍待为上宾。\n- **意义**：在北方最大割据势力袁绍处观察时局，最终做出改变历史走向的抉择——弃袁投曹。\n\n### 📍 重要地点：东阿\n- **时间**：公元191年-192年（主要事件发生于公元194年）\n- **停留时间**：约1年\n- **地点**：兖州东阿（今山东省聊城市东阿县）\n- **事件**：投奔曹操后，被任命为司马，参与军事。曹操征讨陶谦时（兴平元年，公元194年），荀彧与程昱共保兖州三城，成功抵御吕布、张邈的叛乱。\n- **意义**：在曹操集团初创期立下保全根基的大功，证明了其临危不乱的镇守能力。\n\n### 📍 重要地点：鄄城\n- **时间**：公元192年-196年\n- **停留时间**：约4年\n- **地点**：兖州鄄城（今山东省菏泽市鄄城县）\n- **事件**：作为曹操在兖州时期的重要谋士和留守负责人，主持后方事务。\n- **意义**：荀彧被调离许都随军南下，名为倚重，实为疏远之始。这位为曹操运筹二十年的王佐之才，终因曹操欲进爵魏公而心碎，郁郁病逝于军途。一代贤相，殒落于猜忌的暗影之中\n\n### 📍 重要地点：许都\n- **时间**：公元196年-212年\n- **停留时间**：16年\n- **地点**：豫州颍川郡许县（今河南省许昌市建安区）\n- **事件**：公元196年，力劝曹操迎奉汉献帝都许，自此“挟天子以令诸侯”。长期担任尚书令，居中持重，总理朝政，为曹操前方征战提供人才、粮草和战略谋划。期间举荐大量人才，提出“深根固本以制天下”等战略。晚年因反对曹操晋封魏公，渐被疏远。\n- **意义**：其政治生涯的顶峰与转折点。在此地奠定了曹操集团的政治合法性，也在此地因政治理想与曹操产生根本分歧。\n\n### 📍 重要地点：谯县\n- **时间**：公元212年（随军途中）\n- **停留时间**：短暂\n- **地点**：豫州沛国谯县（今安徽省亳州市）\n- **事件**：建安十七年，曹操南征孙权，荀彧以侍中、光禄大夫身份随军。\n- **意义**：荀彧因反对曹操进封魏公，被迫离开许都、辗转至此。一生以匡扶汉室为志的王佐之才，在曹操所赐的空食盒前读懂了杀意，于旧都残照中郁郁而终，二十余年君臣之谊，至此彻底决裂\n\n### 🔴 去世地：寿春\n- **时间**：公元212年\n- **停留时间**：短暂\n- **地点**：扬州九江郡寿春（今安徽省淮南市寿县）\n- **事件**：随军至寿春，曹操馈赠食物，荀彧发现是空盒（一说），于是饮药自尽（存疑，亦有忧病而卒之说）。\n- **意义**：生命与政治生涯的终点，象征其“汉臣”理想与现实政治的悲剧性冲突。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 公元163年 | 颍阴 | 河南省许昌市 | （年龄：0岁）出生于颍川颍阴。 |\n| 约公元184年 | 洛阳 | 河南省洛阳市 | （年龄：约21岁）举孝廉，任守宫令（具体年份存疑）。 |\n| 公元189年 | 颍阴 | 河南省许昌市 | （年龄：约26岁）弃官归乡，预见董卓之乱。 |\n| 约公元189-191年 | 冀州（邺城） | 河北省临漳县 | （年龄：约26-28岁）率宗族北上冀州，依附袁绍。 |\n| 公元191年 | 东阿 | 山东省聊城市东阿县 | （年龄：28岁）离开袁绍，投奔曹操，被任为司马。 |\n| 公元194年 | 东阿 | 山东省聊城市东阿县 | （年龄：31岁）曹操征陶谦，荀彧与程昱共保兖州，击退吕布。 |\n| 公元196年 | 许县（后为许都） | 河南省许昌市建安区 | （年龄：33岁）力主迎汉献帝都许，任侍中、尚书令。 |\n| 公元200年 | 许都 | 河南省许昌市建安区 | （年龄：37岁）官渡之战期间，镇守许都，为曹操分析形势，坚定其信心。 |\n| 公元203年 | 许都 | 河南省许昌市建安区 | （年龄：40岁）曹操上表请封荀彧为万岁亭侯。 |\n| 公元207年 | 许都 | 河南省许昌市建安区 | （年龄：44岁）曹操欲表荀彧为三公，荀彧辞让。 |\n| 公元212年 | 寿春 | 安徽省淮南市寿县 | （年龄：49岁）反对曹操晋封魏公。随军南征，于寿春去世（死因存疑）。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《三国志·荀彧传》**（节选）、**《资治通鉴》**（相关段落）常作为文言文阅读或历史背景材料出现。\n- 核心要点：\n    - **重点**：**“王佐之才”** 的评价，体现了荀彧在政治与战略上的卓越能力。\n    - **重点**：**“迎奉天子”** 的建言，是理解曹操集团政治策略的关键事件。\n    - **重点**：**“深根固本”** 的战略思想，强调巩固后方、发展生产的重要性。\n    - 人物形象塑造：
