  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

：1936年**西安事变**（双十二事变）的发动者与主导者之一。\n    - 1931年**九一八事变**中，作为东北最高军政长官，执行了**不抵抗政策**。\n    - 事变后被**长期软禁**，是其个人命运的重大转折。\n- 核心要点：\n    - **重点**：**西安事变**是其一生最重要的历史贡献，直接促成了**第二次国共合作**和**全民族抗战**局面的形成。\n    - **历史评价**：中国官方定性为“**民族英雄**”、“**千古功臣**”（周恩来评）。\n    - **时代背景**：其活动贯穿**北洋军阀**、**南京国民政府**、**抗日战争**、**国共内战**及**两岸对峙**等重大历史阶段。\n    - **重点**：其人生是**中国近现代史**复杂性与**个人在历史洪流中抉择**的典型缩影。\n    - **功过讨论**：对**九一八事变**的处理是其历史评价中主要的**争议点**。\n\n---","workTexts":{},"workSummaries":{},"markdown":"# 张学良\n\n## 人物档案\n\n### 基本信息\n- **姓名**：张学良\n- **时代**：近现代（中华民国、中华人民共和国）\n- **出生**：公元1901年6月3日，出生地为奉天省台安县（今辽宁省鞍山市台安县）。\n- **去世**：公元2001年10月14日，美国夏威夷州檀香山\n- **享年**：101岁（按中国传统虚岁计算，周岁为100岁）\n- **主要身份**：军事将领、政治人物、爱国将领\n- **历史地位**：“西安事变”的和平解决者，为抗日民族统一战线的形成作出关键贡献的民族功臣。\n- **主要成就**：1. 东北易帜，促成国家形式上的统一；2. 发动“西安事变”，逼蒋抗日，扭转时局；3. 主政东北期间，推行新政，发展经济与教育。\n\n### 生平概述\n张学良，字汉卿，号毅庵，奉系军阀首领张作霖长子。他少年得志，早年毕业于东三省陆军讲武堂，随后在奉军中历练晋升。1928年其父在皇姑屯事件中被日军炸死后，他继任东北保安军总司令，同年宣布东北易帜，服从南京国民政府，促成全国形式统一。1931年“九一八事变”中，他执行不抵抗政策，致使东北沦陷，备受争议。1936年12月12日，他与杨虎城发动“西安事变”，扣押蒋介石，要求停止内战、联共抗日。事变和平解决后，他亲自护送蒋介石回南京，随即被扣留，开始了长达半个多世纪的软禁生涯，先后被辗转囚禁于中国大陆多地及台湾，直至1990年才逐渐恢复自由，晚年定居美国夏威夷。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从中国东北的权力中心出发，历经华中、西南的囚禁之地，最终远赴太平洋彼岸的晚年栖所。\n- ⏱️ **时间跨度**：1901年 - 2001年，共计约100年。\n- 📍 **地理范围**：中国东北、华中、西南、台湾地区及美国夏威夷。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：辽宁台安\n- **时间**：1901年\n- **停留时间**：幼年时期\n- **地点**：奉天省台安县（今辽宁省鞍山市台安县）\n- **事件**：出生于地方军事强人张作霖家中。\n- **意义**：作为“少帅”的起点，其出身决定了他早年的人生轨迹与奉系集团的命运紧密相连。\n\n### 📍 重要地点：沈阳（奉天）\n- **时间**：1920年代 - 1931年\n- **停留时间**：约11年\n- **地点**：奉天（今辽宁省沈阳市）\n- **事件**：主政东北，宣布“东北易帜”，处决杨宇霆、常荫槐，建设东北军，经历“九一八事变”。\n- **意义**：其政治、军事生涯的顶点与转折点。在此完成权力交接，实现国家统一，也在此遭遇人生最大挫折（失地）与争议。\n- **名篇名句**：（无文学作品，但有重要言论）“我是中国人！”\n\n### 📍 重要地点：皇姑屯\n- **时间**：1928年6月4日\n- **停留时间**：事件发生地\n- **地点**：奉天省沈阳市皇姑屯（今辽宁省沈阳市皇姑区）\n- **事件**：其父张作霖所乘火车被日本关东军预埋的炸药炸毁，张作霖重伤身亡。\n- **意义**：直接促使张学良加速东北易帜进程，成为其人生与东北政局的关键转折事件。\n\n### 📍 重要地点：南京\n- **时间**：1930年（短期访问）；1936年12月（被扣留起点）\n- **停留时间**：短期访问；后被长期扣留的起点\n- **地点**：首都南京（今江苏省南京市）\n- **事件**：1930年赴南京出席国民党三届四中全会，获蒋介石任命为中华民国陆海空军副司令，并与蒋介石结为兄弟；1936年西安事变后护送蒋介石至此，旋即被扣押审判。\n- **意义**：象征其与国民党中央政府关系的顶峰与终结。从座上宾到阶下囚的戏剧性转变发生地。\n\n### 📍 重要地点：西安\n- **时间**：1935年底 - 1936年12月\n- **停留时间**：约1年\n- **地点**：长安/西安（今陕西省西安市）\n- **事件**：任西北“剿总”副总司令，与杨虎城合作，发动“西安事变”。\n- **意义**：其一生最重要的历史功绩发生地。西安事变的和平解决，结束了十年内战，促成了第二次国共合作。\n- **名篇名句**：（事变相关言论）“我们绝不是反对蒋委员长个人，是反对蒋委员长的主张和办法。”\n\n### 📍 重要地点：奉化溪口\n- **时间**：1937年初\n- **停留时间**：数月\n- **地点**：浙江省奉化县溪口镇（今浙江省宁波市奉化区溪口镇）\n- **事件**：西安事变后，被蒋介石带回其故乡软禁于雪窦山等地。\n- **意义**：暮年囚徒终于盼来迟到的自由，半个世纪的软禁在九十年代初走向终点。当白发老人重获出行之权，那位发动西安事变的少帅传奇也随之走入历史深处，徒留后人一声长叹\n\n### 📍 重要地点：贵州修文（阳明洞）\n- **时间**：1938年 - 1941年\n- **停留时间**：约3年\n- **地点**：贵州省修文县龙场（今贵州省贵阳市修文县）\n- **事件**：被转移至贵州，囚禁于王阳明曾悟道的“阳明洞”。\n- **意义**：在困顿中开始研读明史、圣经，并受王阳明心学影响，思想发生深刻变化。\n\n### 📍 重要地点：台湾新竹（井上温泉）\n- **时间**：1946年 - 1957年\n- **停留时间**：约11年\n- **地点**：新竹县井上温泉（今台湾省新竹县五峰乡清泉）\n- **事件**：被秘密押送至台湾，继续在偏远山区被软禁。\n- **意义**：暮年囚徒终于盼来迟到的自由，半个世纪的软禁在九十年代初走向终点。当白发老人重获出行之权，那位发动西安事变的少帅传奇也随之走入历史深处，徒留后人一声长叹\n\n### 📍 重要地点：台北北投\n- **时间**：约1960年 - 1990年\n- **停留时间**：约30年\n- **地点**：台北市北投区\n- **事件**：软禁地点迁至台北郊区，生活条件有所改善，可有限接触外界。\n- **意义**：皇姑屯枪响惊醒少帅，是他登台与失守的故都；漫长软禁后半程，奉天成为他默然老去的栖所。1990年春风解冻，半生幽禁终解除，他重新闻到故土自由的空气\n\n### 🔴 去世地：檀香山\n- **时间**：1995年 - 2001年\n- **停留时间**：约6年\n- **地点**：美国夏威夷州檀香山市\n- **事件**：移居美国，安度晚年，最终在此病逝。\n- **意义**：传奇人生的终点，远离故土与政治漩涡，在太平洋的岛屿上走完世纪人生。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1901 | 辽宁台安 | 辽宁省鞍山市台安县 | （年龄：0岁）出生于奉天省台安县（今辽宁省鞍山市台安县）。 |\n| 1919 |  |  | （年龄：18岁）入东三省陆军讲武堂学习。 |\n| 1928 | 皇姑屯 | 辽宁省沈阳市皇姑区 | （年龄：27岁）父亲张作霖在皇姑屯被炸身亡，继任东北保安军总司令；年底宣布“东北易帜”。 |\n| 1930 | 南京 | 江苏省南京市 | （年龄：29岁）赴南京，获蒋介石任命为中华民国陆海空军副司令。 |\n| 1931 |  |  | （年龄：30岁）“九一八事变”爆发，执行不抵抗命令，东北沦陷。 |\n| 1933 |  |  | （年龄：32岁）下野赴欧洲考察。 |\n| 1934 |  |  | （年龄：33岁）回国，任鄂豫皖三省“剿总”副司令。 |\n| 1935 |  |  | （年龄：34岁）任西北“剿总”副司令，代行总司令职务。 |\n| 1936 | 南京 | 江苏省南京市 | （年龄：35岁）12月12日，与杨虎城发动“西安事变”；25日护送蒋介石回南京后被扣留。 |\n| 1937 |  |  | （年龄：36岁）被军事法庭判处十年有期徒刑，后获“特赦”但仍交军事委员会“管束”，开始辗转囚禁。 |\n| 1938 | 贵州修文（阳明洞） | 贵州省贵阳市修文县 | （年龄：37岁）被转移至贵州修文阳明洞囚禁。 |\n| 1946 | 台湾新竹（井上温泉） | 台湾省新竹县五峰乡清泉
