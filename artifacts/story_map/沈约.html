  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

or": "#2ecc71"},"death": {"color": "#e74c3c"}}},"textbookPoints": "### 初中阶段\n- **南北朝**时期文学家与**史学家**，代表人物之一。\n- 主持撰修**《宋书》**百卷，是**二十四史**中《宋书》的署名作者。\n- 经历**宋、齐、梁**三朝更迭，是南朝士族政治的代表人物。\n- 提出**\"四声\"**（**平、上、去、入**）之说，是**音韵学**史上的重要突破。\n- 倡导**\"永明体\"**诗歌革新，与**谢朓**等共同推动近体诗格律化。\n- **易混点**：沈约（南朝）≠ 沈括（北宋，《梦溪笔谈》作者），二人时代相差数百年。\n- **易混点**：《宋书》记**刘宋**（南朝）历史，与**北宋**赵匡胤所建之\"宋\"无关。\n\n### 高中阶段\n- **南北朝文学**部分常作为**律诗格律形成**的关键过渡人物出现。\n- **\"四声八病\"**说是**古代汉语声调**与**诗歌格律理论**的核心概念。\n- **\"永明体\"**是**古体诗向近体诗**过渡的重要诗歌流派。\n- 沈约与**谢朓、王融、范云**等并称\"**竟陵八友**\"或\"永明诗人\"。\n- **《宋书》**为纪传体**断代史**，含本纪、志、列传，体例影响后世正史。\n- **历史评价角度**：教材常引其\"**一代词宗，韵学之祖**\"之誉，作为南朝文学繁荣的标志。\n- **易混点**：沈约是**\"四声\"说的最早系统提出者**这一观点存疑/说法不一，部分学者认为四声之发现可能更早。\n- **易混点**：《四声谱》**已佚**，其具体内容赖**《文镜秘府论》**等后世文献转引。\n\n---","examPoints": "### 初中考点\n- 沈约所处的**朝代**：**南朝**（宋、齐、梁）。\n- 沈约的**主要身份**：**史学家、文学家、音韵学家**。\n- 沈约主持撰写的**史书**：**《宋书》**（百卷，二十四史之一）。\n- 沈约的**音韵学贡献**：明确区分**平、上、去、入四声**。\n- 沈约与谁共同倡导**\"永明体\"**：与**谢朓**等。\n- 沈约封爵：**建昌县侯**。\n- 易混点：**沈约**（南朝）≠ **沈括**（北宋）。\n\n### 高中考点\n- **\"四声八病\"说**的具体内容：四声指**平声、上声、去声、入声**；八病指**平头、上尾、蜂腰、鹤膝、大韵、小韵、旁纽、正纽**等诗病。\n- **\"永明体\"**诗歌的**艺术特点**：注重声律对偶，**五言诗**为主，向**近体诗**过渡。\n- **《宋书》**的**体例**与**史学价值**：纪传体断代史，含八志（《律历志》《乐志》《天文志》等），保留大量珍贵史料。\n- 沈约在**南朝文学革新**中的**地位**：**承上启下**，上承**魏晋风骨**，下启**唐诗格律**。\n- 沈约**历仕三朝**所反映的**南朝士族**与**皇权**关系。\n- 存疑点：**四声之发现**是否最早由沈约系统提出，学界**说法不一**。\n- 存疑点：**生卒年**有441—513年与**卒年存疑**的不同说法。\n- 存疑点：**《四声谱》**已佚，其内容主要靠**《文镜秘府论》**等转引。","workTexts": {"四声谱": "“四声”","宋书": "又奉齐末之命主持撰修《宋书》一百卷","八咏诗": "“八景诗”","梁书·沈约传": "“该悉旧章，博物洽闻”\n“用事虽多，而不为繁”","梁书": "“该悉旧章，博物洽闻”\n“用事虽多，而不为繁”","沈约传": "“该悉旧章，博物洽闻”\n“用事虽多，而不为繁”","颜氏家训": "“声律之学”\n“专求于数”","后村诗话": "“永明诗派”","梦溪笔谈": "易混点：沈约（南朝）≠ 沈括（北宋，《梦溪笔谈》作者），二人时代相差数百年。"},"workSummaries": {"宋书": {"title": "宋书","aliases": [],"authors": ["沈约"],"related_people": ["沈约"],"source_pages": ["沈约"],"era": "南北朝（南朝宋、齐、梁）","genre": "断代史","one_liner": "《宋书》是沈约主持撰修的纪传体断代史，全书一百卷，系统记载南朝刘宋一代史事，为二十四史之一，体例严整。","summary": "又奉齐末之命主持撰修《宋书》一百卷","quote": "首创\"四声\"之说，撰《四声谱》（已佚）；","quotes": ["首创\"四声\"之说，撰《四声 ","one_liner": "《天文志》是纪传体断代史《汉书》中的一篇，系统记述上古至西汉的天文星象、日月五行星运行、彗星流陨等天象及其与人事的关联，由班昭续写补成，使《汉书》终成完璧。","summary": "班昭出身儒学世家与史学门第，其父班彪、长兄班固均为著名史学家","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 沈约\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：沈约（字休文）\n- **时代**：南北朝（南朝宋、齐、梁）\n- **出生**：441年（宋文帝元嘉十八年），生于吴兴武康（今浙江省湖州市德清县一带）\n- **去世**：513年（梁武帝天监十二年或十三年），卒于建康（今江苏省南京市）\n- **享年**：约七十三岁（存疑/说法不一）\n- **主要身份**：史学家、文学家、音韵学家、政治家\n- **历史地位**：一代词宗，韵学之祖，南朝\"永明体\"诗歌革新与近体诗格律化的关键奠基人。\n- **主要成就**：主持撰修《宋书》一百卷；首创\"四声\"之说，撰《四声谱》（已佚）；提出\"八病\"之说，奠定近体诗格律基础；与谢朓等共创\"永明体\"；历仕宋、齐、梁三朝，官至尚书仆射，封建昌县侯。\n\n### 生平概述\n沈约出身吴兴武康世家，少时孤贫而笃志好学，以文章名世。早年入刘宋朝廷，历官著作郎、尚书度支郎等职；入齐后受到文惠太子萧长懋与竟陵王萧子良礼遇，与谢朓、王融等游处，倡\"永明体\"诗歌。齐末受命撰《宋书》，又佐萧衍代齐，建立梁朝，受封建昌县侯，位至尚书仆射。其一生横跨宋齐易代与齐梁禅代，身历多次政治剧变而能始终居高位，体现南朝士族在门阀与皇权之间的典型生存策略。在学术上，他区分平上去入四声，又倡\"八病\"之说，深刻影响此后律诗之形成，《宋书》亦为传世重要断代史。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：以江南为重心，出身吴兴，宦游与终老皆在建康。\n- ⏱️ **时间跨度**：约441年—513年（前后约72年）\n- 📍 **地理范围**：今浙江湖州（吴兴武康）、江苏南京（建康）\n- 🌟 **重要节点数量**：核心地点约6处\n- 🚶 **总行程估算**：约 203 公里\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：吴兴武康\n- **公元纪年**：441年（元嘉十八年）\n- **停留时间**：少年时期在此成长，后入仕离乡\n- **位置**：吴兴武康（今浙江省湖州市德清县一带）\n- **事迹**：沈约出身吴兴沈氏，少时家贫，孤苦力学，博览群书，为日后文史之学奠基。\n- **意义**：籍贯与家族根基所在；其文学与音韵学造诣与江南文化传统密切相关。\n\n### 📍 重要地点：建康\n- **公元纪年**：宋孝武帝大明年间（约5世纪60年代）起\n- **停留时间**：自入仕起，主要仕宦与著述皆在此地，断续居住数十年\n- **位置**：建康（今江苏省南京市）\n- **事迹**：历官著作郎、尚书度支郎、国子祭酒等，参与朝堂文书与礼乐议论；又奉齐末之命主持撰修《宋书》一百卷；梁初受封建昌县侯，位列台辅。\n- **意义**：政治与学术活动的中心；《宋书》及《四声谱》等关键著作的主要撰写地。\n- **代表作品**：《宋书》（主持撰修）、《四声谱》（已佚）、《别范安成》（相关思想：抒写老友离别之怅惘，为永明体代表作之一）\n\n### 📍 重要地点：东府\n- **公元纪年**：梁武帝天监初年（约502年—513年之间）\n- **停留时间**：任尚书仆射前后居此\n- **位置**：东府（古称东府城，位于今江苏省南京市境内）\n- **事迹**：沈约以尚书仆射之尊，佐梁武帝处理朝政，位居中枢。\n- **意义**：自孤贫入仕至终老台城，沈约历宋齐梁三朝、官至三公，却始终以著述为命。在建康，他修《宋书》、创永明体、撰《四声谱》，为南朝文化留下难以绕开的丰碑——此地是他全部政治抱负与文学理想的最终归宿\n- **相关思想**：\"四声八病\"之说在此期间系统提出，为近体诗格律之先声。\n\n### 📍 重要地点：竟陵王府\n- **公元纪年**：齐永明年间（约483年—493年）\n- **停留时间**：齐武帝、竟陵王当国时期\n- **位置**：建康竟陵王府（今江苏省南京市境内）\n- **事迹**：与谢朓、王融、范云、萧琛、任昉等同游竟陵王萧子良西邸，共倡\"永明体\"，以四声制韵，诗歌渐趋格律化。\n- **意义**：自孤贫入仕至终老台城，沈约历宋齐梁三朝、官至三公，却始终以著述为命。在建康，他修《宋书》、创永明体、撰《四声谱》，为南朝文化留下难以绕开的丰碑——此地是他全部政治抱负与文学理想的最终归宿领袖。\n- **代表作品**：永明体诗作（与谢朓等唱和）\n\n### 📍 重要地点：南徐州（侨置）\n- **公元纪年**：刘宋末年\n- **停留时间**：宋末任职期间\n- **位置**：南徐州（侨置，治所在今江苏省镇江市一带，说法不一）\n- **事迹**：沈约曾任南徐州从事、记室参军等职，辗转为官。\n- **意义**：自孤贫入仕至终老台城，沈约历宋齐梁三朝、官至三公，却始终以著述为命。在建康，他修《宋书》、创永明体、撰《四声谱》，为南朝文化留下难以绕开的丰碑——此地是他全部政治抱负与文学理想的最终归宿\n\n### 🔴 去世地：建康\n- **公元纪年**：513年（梁武帝天监十二年或十三年）\n- **停留时间**：晚年长期居此，至终\n- **位置**：建康（今江苏省南京市）\n- **经过**：沈约晚年屡有去志而未能获准，忧惧成疾，最终卒于建康官邸（一说卒于东府）。\n- **意义**：沈约一生宦海沉浮与文心所系之地。从刘宋寒门起步，历齐入梁位至尚书仆射，更在此独创四声八病之说、独力撰成《宋书》百卷。台城数度朝堂惊涛，锤炼出一代文臣隐忍而深沉的风骨\n- **代表作品**：《八咏诗》（相关思想：以赋为诗，分题八咏，多写登临感秋之情，对后世\"八景诗\"传统有影响）\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 441年（元嘉十八年） | 吴兴武康 | 浙江湖州德清一带 | 生于吴兴武康沈氏 |\n| 宋孝武帝大明年间 | 建康 | 江苏南京 | 历官著作郎、尚书度支郎等 |\n| 宋顺帝升明年间 | 建康 | 江苏南京 | 奉命主持撰修《宋书》 |\n| 齐永明年间 | 建康 | 江苏南京 | 与谢朓等倡\"永明体\"，提出四声八病之说 |\n| 502年（齐和帝中兴二年） | 建康 | 江苏南京 | 助萧衍代齐，建立梁朝，受封建昌县侯 |\n| 梁武帝天监初年 | 东府 | 江苏南京 | 任尚书仆射，居东府 |\n| 513年（天监十二年或十三年） | 建康 | 江苏南京 | 卒于建康 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n沈约在齐梁之际兼具宰辅与文宗双重身份，其政治地位使其文学主张得以迅速推行。他以\"四声八病\"之说革新诗坛，与谢朓等共同推动永明体形成，使诗歌创作从古体向近体过渡成为时代风潮；其《宋书》又以\"一代之史\"的形式确立了南朝断代史的范式。\n\n### 对后世的影响\n- **格律诗奠基**：四声八病之说为初唐沈佺期、宋之问及唐人律诗格律之滥觞。\n- **断代史范式**：《宋书》体例严整，与《南齐书》《魏书》并列，为后世修史所取法。\n- **音韵学传统**：明确区分平上去入，开启后世等韵学与中古音研究之先河。\n- **文学集团模式**：竟陵王西邸文人群体被视为后世文学集团之雏形。\n\n### 历史评价\n- **《梁书·沈约传》**：称其\"该悉旧章，博物洽闻\"，然又记其\"用事虽多，而不为繁\"与\"贪荣慕势\"之失。\n- **颜之推《颜氏家训》**：指出沈约\"声律之学\"虽启后世，然\"专求于数\"，亦有所批评。\n- **刘克庄《后村诗话》**：以沈约为\"永明诗派\"领袖，肯定其承上启下之功。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **南北朝**时期文学家与**史学家**，代表人物之一。\n- 主持撰修**《宋书》**百卷，是**二十四史**中《宋书》的署名作者。\n- 经历**宋、齐、梁**三朝更迭，是南朝士族政治的代表人物。\n- 提出**\"四声\"**（**平、上、去、入**）之说，是**音韵学**史上的重要突破。\n- 倡导**\"永明体\"**诗歌革新，与**谢朓**等共同推动近体诗格律化。\n- **易混点**：沈约（南朝）≠ 沈括（北宋，《梦溪笔谈》作者），二人时代相差数百年。\n- **易混点**：《宋书》记**刘宋**（南朝）历史，与**北宋**赵匡胤所建之\"宋\"无关。\n\n### 高中阶段\n- **南北朝文学**部分常作为**律诗格律形成**的关键过渡人物出现。\n- **\"四声八病\"**说是**古代汉语声调**与**诗歌格律理论**的核心概念。\n- **\"永明体\"**是**古体诗向近体诗**过渡的重要诗歌流派。\n- 沈约与**谢朓、王融、范云**等并称\"**竟陵八友**\"或\"永明诗人\"。\n- **《宋书》**为纪传体**断代史**，含本纪、志、列传，体例影响后世正史。\n- **历史评价角度**：教材常引其\"**一代词宗，韵学之祖**\"之誉，作为南朝文学繁荣的标志。\n- **易混点**：沈约是**\"四声\"说的最早系统提出者**这一观点存疑/说法不一，部分学者认为四声之发现可能更早。\n- **易混点**：《四声谱》**已佚**，其具体内容赖**《文镜秘府论》**等后世文献转引。\n\n---\n\n## 初高中阶段考点\n\n### 初中考点\n- 沈约所处的**朝代**：**南朝**（宋、齐、梁）。\n- 沈约的**主要身份**：**史学家、文学家、音韵学家**。\n- 沈约主持撰写的**史书**：**《宋书》**（百卷，二十四史之一）。\n- 沈约的**音韵学贡献**：明确区分**平、上、去、入四声**。\n- 沈约与谁共同倡导**\"永明体\"**：与**谢朓**等。\n- 沈约封爵：**建昌县侯**。\n- 易混点：**沈约**（南朝）≠ **沈括**（北宋）。\n\n### 高中考点\n- **\"四声八病\"说**的具体内容：四声指**平声、上声、去声、入声**；八病指**平头、上尾、蜂腰、鹤膝、大韵、小韵、旁纽、正纽**等诗病。\n- **\"永明体\"**诗歌的**艺术特点**：注重声律对偶，**五言诗**为主，向**近体诗**过渡。\n- **《宋书》**的**体例**与**史学价值**：纪传体断代史，含八志（《律历志》《乐志》《天文志》等），保留大量珍贵史料。\n- 沈约在**南朝文学革新**中的**地位**：**承上启下**，上承**魏晋风骨**，下启**唐诗格律**。\n- 沈约**历仕三朝**所反映的**南朝士族**与**皇权**关系。\n- 存疑点：**四声之发现**是否最早由沈约系统提出，学界**说法不一**。\n- 存疑点：**生卒年**有441—513年与**卒年存疑**的不同说法。\n- 存疑点：**《四声谱》**已佚，其内容主要靠**《文镜秘府论》**等转引。\n\n## 地点坐标（人工校正）\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 吴兴武康 | 浙江省湖州市德清县一带 | 30.5449 | 119.9728 |\n| 建康 | 江苏省南京市 | 32.0603 | 118.7969 |\n| 东府 | 江苏省南京市秦淮河东府城遗址一带 | 32.0280 | 118.8020 |\n| 竟陵王府 | 江苏省南京市建康城旧址一带 | 32.0480 | 118.7820 |\n| 南徐州（侨置） | 江苏省镇江市一带 | 32.1880 | 119.4250 |\n","relatedGraph": {"center": {"id": 289,"name": "沈约","file": "沈约.html","dynasty": "南北朝（南朝宋、齐、梁）","birth_year": 441,"death_year": 513,"time_year": 477,"quote": "*《梁书·沈约传》：称其\"该悉旧章，博物洽闻\"，然又记其\"用事虽多，而不为繁\"与\"贪荣慕势\"之失。","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "academic","main_role_label": "史学家","birthplace": "吴兴武康","birthplace_raw": "吴兴武康今浙江省湖州市德清县一带","birthplace_modern": "浙江省湖州市德清县一带","birth_lat_wgs84": 30.5449,"birth_lng_wgs84": 119.9728,"birth_lat": 30.5449,"birth_lng": 119.9728,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["沈约"],"search_tokens": ["沈约","shenyue","sy"],"search_pinyin": ["shenyue","sy"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true
