  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

ary": "屠格涅夫出生于一个富裕的贵族家庭，在莫斯科和圣彼得堡接受教育，后赴柏林深造", "quote": "七月里的一个好天气，从清早起天上就一丝云彩也没有；微风轻拂，吹动着道路两旁的尖尖的、成熟的麦穗。", "quotes": ["七月里的一个好天气，从清早起天上就一丝云彩也没有；微风轻拂，吹动着道路两旁的尖尖的、成熟的麦穗。", "你们好啊，你们这些好孩子们！你们为什么这样早起来呢？——跨上马去吧，小伙子们！", "《父与子》（节选）、《猎人笔记》（节选，如《白净草原》）、《门槛》（散文诗）"], "quote_policy": "preferred"}}, "markdown": "# 屠格涅夫\n\n## 人物档案\n\n### 基本信息\n- **姓名**：伊凡·谢尔盖耶维奇·屠格涅夫\n- **时代**：19世纪俄国（沙皇俄国时期）\n- **出生**：公元1818年11月9日，奥廖尔省斯帕斯克耶-卢托维诺沃（今属俄罗斯奥廖尔州奥廖尔市辖区）\n- **去世**：公元1883年9月3日，法国布吉瓦尔（今法国法兰西岛大区伊夫林省）\n- **享年**：64岁（周岁，去世时未过65岁生日）\n- **主要身份**：作家、诗人、剧作家\n- **历史地位**：俄国批判现实主义文学的杰出代表，对俄国乃至世界文学产生深远影响。\n- **主要成就**：创作了包括《罗亭》、《父与子》、《烟》、《处女地》等在内的系列长篇小说，被誉为“俄国社会生活百科全书”；其作品《猎人笔记》的发表与传播，客观上为俄国1861年农奴制改革做了舆论准备；塑造了俄国文学史上经典的“多余人”与“新人”形象；散文诗开创了俄国文学新体裁。\n\n### 生平概述\n屠格涅夫出生于一个富裕的贵族家庭，在莫斯科和圣彼得堡接受教育，后赴柏林深造。他深受西欧启蒙思想影响，毕生关注俄国社会变革。其文学生涯以特写集《猎人笔记》成名，因揭露农奴制弊端一度遭拘禁。他长期旅居西欧，与福楼拜、左拉等作家交往密切，成为沟通俄国与西欧文学的桥梁。他的六部长篇小说精准刻画了俄国社会转型期不同阶层人物的命运与心理，晚年以优美的散文诗总结一生思考，最终在法国病逝。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及俄国欧洲部分核心城市，并长期旅居法国、德国、英国、意大利等西欧国家。\n- ⏱️ **时间跨度**：1818年至1883年，共计约65年。\n- 📍 **地理范围**：以俄国莫斯科、圣彼得堡为中心，辐射至西欧主要文化都市。\n- 🌟 **重要节点数量**：核心地点10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：斯帕斯克耶-卢托维诺沃庄园\n- **时间**：1818年\n- **停留时间**：童年及青少年时期常居于此\n- **地点**：奥廖尔省斯帕斯克耶-卢托维诺沃（今属俄罗斯奥廖尔州奥廖尔市辖区）\n- **事件**：出生于当地一个贵族庄园。\n- **意义**：庄园生活是其了解俄国乡村与农奴制的最初窗口，为《猎人笔记》提供了大量素材。\n\n### 📍 重要地点：莫斯科\n- **时间**：1827年-1833年\n- **停留时间**：约6年\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：随家庭迁居，在寄宿学校学习，后考入莫斯科大学语文系。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：圣彼得堡\n- **时间**：1834年-1838年\n- **停留时间**：约4年\n- **地点**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：转入圣彼得堡大学哲学系学习，开始文学习作。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：柏林\n- **时间**：约1838年-1841年（具体时间存疑）\n- **停留时间**：约2-3年\n- **地点**：柏林（今德国柏林）\n- **事件**：在柏林大学攻读哲学与古典文学，结识斯坦凯维奇等俄国知识分子。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：巴黎\n- **时间**：1840年代-1850年代多次旅居\n- **停留时间**：多次旅居，累计数年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：结识法国作家梅里美、乔治·桑等；1848年目睹法国二月革命。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：斯帕斯克耶-卢托维诺沃庄园（软禁时期）\n- **时间**：1850年代初期\n- **停留时间**：约1年半（因《猎人笔记》事件被拘禁后）\n- **地点**：奥廖尔省斯帕斯克耶-卢托维诺沃（今属俄罗斯奥廖尔州奥廖尔市辖区）\n- **事件**：在母亲庄园内被软禁，期间创作了中篇小说《木木》。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：伦敦\n- **时间**：1860年代初期（具体年份存疑）\n- **停留时间**：数月\n- **地点**：伦敦（今英国伦敦）\n- **事件**：与赫尔岑等俄国流亡革命者交往。\n- **意义**：童年与少年在此度过，母亲的严苛与德语家庭教师塑造了他的双重文化基因。在莫斯科大学短暂求学时，他已与别林斯基周围的进步青年为伍，诗作里开始萌生对农奴命运的深切同情\n\n### 📍 重要地点：巴登-巴登\n- **时间**：1860年代中期\n- **停留时间**：数年\n- **地点**：巴登-巴登（今德国巴登-符腾堡州）\n- **事件**：在此居住并创作，与著名歌唱家维亚尔多一家比邻。\n- **意义**：晚年的屠格涅夫将地中海游历的余温化为笔底诗篇。《散文诗》里关于爱、死亡与故土的低语在莫斯科文人圈传诵——那是他向死而生的时刻，《门槛》《俄罗斯语言》等名篇皆诞生于此际\n\n### 📍 重要地点：罗马\n- **时间**：1870年代\n- **停留时间**：多次短期居住\n- **地点**：罗马（今意大利罗马）\n- **事件**：在意大利旅行、休养并进行创作。\n- **意义**：晚年的屠格涅夫将地中海游历的余温化为笔底诗篇。《散文诗》里关于爱、死亡与故土的低语在莫斯科文人圈传诵——那是他向死而生的时刻，《门槛》《俄罗斯语言》等名篇皆诞生于此际\n\n### 🔴 去世地：布吉瓦尔\n- **时间**：1883年\n- **停留时间**：晚年主要居所\n- **地点**：法国布吉瓦尔（今法国法兰西岛大区伊夫林省）\n- **事件**：因脊椎癌在此病逝。\n- **意义**：客死异乡，遗体后运回俄国圣彼得堡安葬，象征其一生在俄国与西欧之间的精神纽带。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1818 | 斯帕斯克耶-卢托维诺沃庄园 | 属俄罗斯奥廖尔州奥廖尔市辖区 | （年龄：0）出生于奥廖尔省斯帕斯克耶-卢托维诺沃庄园 |\n| 1827 | 莫斯科 | 俄罗斯莫斯科 | （年龄：9）随家迁居莫斯科，开始接受正规教育 |\n| 1833 | 莫斯科 | 俄罗斯莫斯科 | （年龄：15）考入莫斯科大学语文系 |\n| 1834 | 圣彼得堡 | 俄罗斯圣彼得堡 | （年龄：16）转入圣彼得堡大学哲学系 |\n| 1838 | 柏林 | 德国柏林 | （年龄：20）赴德国柏林大学留学（时间存疑） |\n| 1841 | 柏林 | 德国柏林 | （年龄：23）结束柏林学业（时间存疑），返回俄国，开始文学创作 |\n| 1843 |  |  | （年龄：25）发表长诗《帕拉莎》，结识别林斯基 |\n| 1847 |  |  | （年龄：29）在《现代人》杂志发表《猎人笔记》首篇 |\n| 1852 |  |  | （年龄：34）因撰文悼念果戈里被拘禁，期间创作《木木》 |\n| 1855 |  |  | （年龄：37）发表第一部长篇小说《罗亭》 |\n| 1860 |  |  | （年龄：42）发表代表作《父与子》，引起巨大争论 |\n| 1863 | 巴登-巴登 | 德国巴登-符腾堡州 | （年龄：45）定居德国巴登-巴登 |\n| 1867 |  |  | （年龄：49）发表长篇小说《烟》 |\n| 1877 |  |  | （年龄：59）发表最后一部长篇小说《处女地》 |\n| 1878 |  |  | （年龄：60）开始创作《散文诗》 |\n| 1883 | 布吉瓦尔 | 法国法兰西岛大区伊夫林省 | （年龄：64）在法国布吉瓦尔病逝 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《父与子》**（节选）、**《猎人笔记》**（节选，如《白净草原》）、《门槛》（散文诗）\n- 核心要点：\n    - **重点**：塑造了“**多余人**”（如罗亭）与“**新人**”（如巴扎罗夫）两大经典文学形象系列。\n    - **重点**：作品深刻反映了俄国**农奴制改革**前后的社会矛盾与思想冲突。\n    - **重点**：擅长细腻的**心理描写**与自然景物描写，风格**抒情**而富有诗意。\n    - 其小说结构严谨，情节集中，人物形象鲜明，是**俄国现实主义**的典范。\n    - 《猎人笔记》以特写形式，从人道主义角度展现了农民的疾苦与才华。\n    - 《父与子》中“父辈”与“子辈”的冲突，象征着自由主义与**虚无主义**的思想交锋。\n    - 晚年《散文诗》短小精悍，融合了哲理、抒情与叙事，是其一生思想的结晶。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：其作品《猎人笔记》的发表与传播，客观上为俄国**1861年农奴制改革**做了舆论准备。\n    - 与别林斯基、赫尔岑等革命民主主义者交往密切，但政治立场更倾向于温和的**自由主义**与**西欧派**。\n    - **重点**：长期旅居西欧的经历，使他成为19世纪下半叶**俄国与西欧文化交流**的关键人物。\n- 核心要点：\n    - **重点**：其创作生涯贯穿了俄国从**尼古拉一世**到**亚历山大三世**时期的社会剧烈转型期。\n    - **重点**：他笔下人物的思想困境（如“多余人”的无力感），精准反映了俄国**贵族阶级**在历史变革中的彷徨与没落。\n    - 他与陀思妥耶夫斯基、托尔斯泰并称为俄国文学三巨头，但艺术风格与思想路径各不相同。\n    - 他反对农奴制，但不赞成暴力革命，主张通过教育和渐进改良实现社会进步。\n    - 其葬礼在俄国举行并引发巨大社会反响，成为一场表达对专制政府不满的政治示威。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 俄罗斯奥廖尔 | 52.9686 | 36.0703 |\n| 俄罗斯莫斯科 | 55.7558 | 37.6173 |\n| 俄罗斯圣彼得堡 | 59.9343 | 30.3351 |\n| 德国柏林 | 52.5200 | 13.4050 |\n| 法国巴黎 | 48.8566 | 2.3522 |\n| 英国伦敦 | 51.5074 | -0.1278 |\n| 德国巴登-巴登 | 48.7610 | 8.2390 |\n| 意大利罗马 | 41.9028 | 12.4964 |\n| 法国布吉瓦尔 | 48.8667 | 2.1333 |", "relatedGraph": {"center": {"id": "屠格涅夫", "name": "屠格涅夫", "file": "屠格涅夫.html", "dynasty": "19世纪俄国（沙皇俄国时期）", "aliases": [], "birth_year": 1818, "death_year": 1883, "quote": "俄国社会生活百科全书", "review": "其作品《猎人笔记》的发表与传播，客观上为俄国1861年农奴制改革做了舆论准备", "foreign_name": "", "main_role_label": "作家", "birthplace": "奥廖尔省斯帕斯克耶-卢托维诺沃", "birthplace_modern": "属俄罗斯奥廖尔州奥廖尔市辖区", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "屠格涅夫", "name": "屠格涅夫", "file": "屠格涅夫.html", "dynasty": "19世纪俄国（沙皇俄国时期）", "aliases": [], "birth_year": 1818, "death_year": 1883, "quote": "俄国社会生活百科全书", "review": "其作品《猎人笔记》的发表与传播，客观上为俄国1861年农奴制改革做了舆论准备", "foreign_name": "", "main_role_label": "作家", "birthplace": "奥廖尔省斯帕斯克耶-卢托维诺沃", "birthplace_modern": "属俄罗斯奥廖尔州奥廖尔市辖区", "domain_ta
