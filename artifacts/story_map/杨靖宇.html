.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

ly"}},"markdown": "# 杨靖宇\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：马尚德，字骥生，曾用名张贯一、杨靖宇\n- **时代**：抗日战争时期（中华民国）\n- **出生**：1905年2月13日，河南省确山县李湾村（今河南省驻马店市确山县）\n- **去世**：1940年2月23日，吉林省濛江县三道崴子（今吉林省白山市靖宇县三道崴子）\n- **享年**：35岁（虚岁）\n- **主要身份**：抗日名将、东北抗日联军主要创建者和领导人\n- **历史地位**：中国共产党优秀党员，无产阶级革命家、军事家，东北抗日联军的杰出代表，著名抗日民族英雄。\n- **主要成就**：领导东北抗日武装斗争，沉重打击日本侵略者；创建并指挥东北抗日联军第一军，在极端艰苦的环境下坚持抗战；以身殉国，展现了崇高的民族气节。\n\n### 生平概述\n杨靖宇生于清末，早年投身革命，1927年加入中国共产党。大革命失败后，他在河南领导农民运动。1929年奉命赴东北，先后担任东北反日总会会长、中共哈尔滨市委书记、东北抗日联军第一军军长兼政委等职。在日伪军残酷“讨伐”和严密封锁下，他领导抗联部队在长白山区浴血奋战，建立了稳固的抗日游击根据地。1939年秋冬，抗联处境极端恶化，他率部与敌周旋，直至孤身奋战，于1940年2月壮烈牺牲。其一生是为民族独立和人民解放不懈奋斗的一生。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从河南确山到东北辽宁、吉林、黑龙江，主要活动于长白山区抗日游击区。\n- ⏱️ **时间跨度**：1927年（投身革命）至1940年（牺牲），约13年。\n- 📍 **地理范围**：主要覆盖今河南、辽宁、吉林、黑龙江等省。\n- 🌟 **重要节点数量**：8个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：河南省确山县李湾村\n- **公元纪年**：1905年—1923年\n- **停留时间**：童年及少年时期\n- **位置**：古称确山县（今河南省驻马店市确山县）\n- **事迹**：在此度过童年，接受启蒙教育，目睹旧社会的黑暗与农民的苦难。\n- **意义**：贫寒的少年时光里，他亲眼目睹乡邻受地主盘剥的苦难，那些饥寒交迫的身影在心底种下第一颗火种。朴素的同情在岁月中悄然发酵，最终长成撼动白山黑水的参天大树——阶级的感情，从来不是书本里能学来的\n\n### 📍 重要地点：河南省开封市\n- **公元纪年**：1923年—1926年\n- **停留时间**：求学约3年\n- **位置**：古称开封府（今河南省开封市）\n- **事迹**：考入河南省立开封纺染工业学校，开始接触马克思主义，参与学生运动。\n- **意义**：1940年2月23日濛江郊外，子弹穿透最后的胸膛，38岁的身躯倒在他深爱的东北土地上。敌人剖开他的腹部，竟只发现棉絮、树皮和草根——那一刻，整个侵华日军都陷入沉默。他是至死不倒的民族脊梁\n\n### 📍 重要地点：河南省确山县\n- **公元纪年**：1927年—1928年\n- **停留时间**：约1年\n- **位置**：古称确山县（今河南省驻马店市确山县）\n- **事迹**：领导确山农民起义，建立确山县临时治安委员会；组织刘店秋收起义，成立确山县农民革命军。\n- **意义**：1940年2月23日濛江郊外，子弹穿透最后的胸膛，38岁的身躯倒在他深爱的东北土地上。敌人剖开他的腹部，竟只发现棉絮、树皮和草根——那一刻，整个侵华日军都陷入沉默。他是至死不倒的民族脊梁\n\n### 📍 重要地点：奉天（沈阳）\n- **公元纪年**：1929年\n- **停留时间**：数月\n- **位置**：古称奉天（今辽宁省沈阳市）\n- **事迹**：任中共抚顺特别支部书记，领导工人运动。曾被捕入狱，遭受酷刑但坚贞不屈。\n- **意义**：1940年2月23日濛江郊外，子弹穿透最后的胸膛，38岁的身躯倒在他深爱的东北土地上。敌人剖开他的腹部，竟只发现棉絮、树皮和草根——那一刻，整个侵华日军都陷入沉默。他是至死不倒的民族脊梁\n\n### 📍 重要地点：哈尔滨\n- **公元纪年**：1931年—1932年\n- **停留时间**：约1年\n- **位置**：古称滨江（今黑龙江省哈尔滨市）\n- **事迹**：任中共哈尔滨市委书记、东北反日总会会长，领导抗日救亡运动，组织工人、学生支援义勇军。\n- **意义**：1940年2月23日濛江郊外，子弹穿透最后的胸膛，38岁的身躯倒在他深爱的东北土地上。敌人剖开他的腹部，竟只发现棉絮、树皮和草根——那一刻，整个侵华日军都陷入沉默。他是至死不倒的民族脊梁\n\n### 📍 重要地点：磐石、濛江等长白山区\n- **公元纪年**：1933年—1939年\n- **停留时间**：约7年\n- **位置**：古称磐石县、濛江县（今吉林省磐石市及白山市靖宇县一带）\n- **事迹**：改编并领导南满游击队，创建东北人民革命军第一军（后改编为东北抗日联军第一军），任军长兼政委。指挥了多次著名战斗，如奇袭老岭隧道工程、袭击敌军据点等。在极端艰苦的“冰天雪地、弹尽粮绝”条件下坚持游击战争。\n- **意义**：1940年早春他倒在林海雪原之中。敌人剖腹验尸时惊见其胃中只有棉絮、树皮和草根——这位抗联第一路军总司令以血肉之躯殉国的事迹，自此化作中华民族面对外侮时永不屈服的永恒丰碑\n- **名篇名句**：（无文学作品，其豪言壮语广为流传）“头颅不惜抛掉，鲜血可以喷洒，而中华民族的独立自由是不能动摇的。”\n\n### 📍 重要地点：吉林省濛江县（今靖宇县）\n- **公元纪年**：1940年初\n- **停留时间**：最后约2个月\n- **位置**：古称濛江县（今吉林省白山市靖宇县）\n- **事迹**：在部队严重减员、叛徒出卖、被敌重兵围困的绝境下，率部与敌周旋。\n- **意义**：1940年早春他倒在林海雪原之中。敌人剖腹验尸时惊见其胃中只有棉絮、树皮和草根——这位抗联第一路军总司令以血肉之躯殉国的事迹，自此化作中华民族面对外侮时永不屈服的永恒丰碑\n\n### 🔴 去世地：吉林省濛江县三道崴子\n- **公元纪年**：1940年2月23日\n- **停留时间**：生命的最后时刻\n- **位置**：古称濛江县三道崴子（今吉林省白山市靖宇县三道崴子）\n- **经过**：在断粮五天、孤身一人的情况下，被日伪“讨伐队”包围。他倚靠大树，双手持枪，战斗到最后一息，壮烈殉国。敌人剖开他的腹部，发现胃里只有草根、树皮和棉絮，无一粒粮食。\n- **意义**：杨靖宇青年负笈之地，1923年于省立第一甲种农业学校苦读，进步书刊如星火入心。救国之志自这座中原古城悄然启程，终在白山黑水间化作棉絮果腹、孤身战至最后一息的悲壮绝响\n- **名篇名句**：（事迹本身即为不朽篇章）“胃里只有草根、树皮和棉絮。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1905 | 河南省确山县李湾村 | 河南省驻马店市确山县 | （年龄：0）出生于河南省确山县李湾村。 |\n| 1923 |  |  | （年龄：18）考入河南省立开封纺染工业学校，开始接触进步思想。 |\n| 1926 |  |  | （年龄：21-22）加入中国共产主义青年团。 |\n| 1927 |  |  | （年龄：22）加入中国共产党；领导确山农民起义，建立革命武装。 |\n| 1928 |  |  | （年龄：23）在开封、洛阳等地从事地下工作，三次被捕。 |\n| 1929 |  |  | （年龄：24）奉命赴东北，任中共抚顺特别支部书记，领导工人运动。 |\n| 1931 | 哈尔滨 | 黑龙江省哈尔滨市 | （年龄：26）“九一八”事变后，积极参与抗日救亡，任中共哈尔滨市委书记。 |\n| 1932 |  |  | （年龄：27）任中共满洲省委军委代理书记，开始全面领导军事工作。 |\n| 1933 |  |  | （年龄：28）任中国工农红军第三十二军南满游击队政委，创建磐石抗日根据地。 |\n| 1934 |  |  | （年龄：29）当选中华苏维埃共和国中央执行委员；任东北人民革命军第一军军长兼政委。 |\n| 1936 |  |  | （年龄：31）任东北抗日联军第一军军长兼政委，后任第一路军总司令兼政委。 |\n| 1937 |  |  | （年龄：32）“七七事变”后，率部在东南满地区主动出击，配合全国抗战。 |\n| 1938 |  |  | （年龄：33）组织部队西征，试图与关内联系，受挫后转入长白山密林坚持斗争。 |\n| 1939 |  |  | （年龄：34）面临日伪军大规模“讨伐”，处境日益艰难，部队损失严重。 |\n| 1940 |  |  | （年龄：35）2月23日，在吉林濛江三道崴子壮烈牺牲。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n杨靖宇领导的东北抗日联军，在敌后战场独立奋战，牵制了数十万日伪军，有力地支援了全国的抗日战争。他的英勇事迹通过共产国际的报道传遍世界，极大地鼓舞了全国人民的抗战士气，彰显了中华民族决不屈服的抵抗精神。\n\n### 对后世的影响\n- **民族精神的象征**：杨靖宇成为中国人民不畏强暴、英勇抗争的杰出代表，是爱国主义和革命英雄主义教育的永恒典范。\n- **革命传统教育的典范**：其坚定的理想信念、艰苦卓绝的斗争精神和对党无限忠诚的品质，是中国共产党革命传统教育的重要内容。\n- **军事斗争艺术的案例**：其在极端劣势条件下开展游击战争的战略战术，为后世军事研究提供了宝贵案例。\n\n### 历史评价\n1.  **毛泽东**：“有名的义勇军领袖杨靖宇……坚决抗日，艰苦奋斗的战绩，是人所共知的。”（《毛泽东选集》）\n2.  **周恩来**：“头颅可断腹可剖，烈忾难消志不磨。碧血青蒿两千古，于今赤旗满山河。”（题词）\n3.  **后世评价**：中国共产党优秀党员，伟大的抗日民族英雄。他的一生是革命的一生，战斗的一生，光辉的一生。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**九一八事变**后，日本侵占中国东北，中华民族面临严重危机。\n- **关键事件**：**东北抗日联军**在极其艰苦的条件下坚持抗战；**杨靖宇**是其主要领导人之一。\n- **代表精神**：体现了**英勇顽强、不怕牺牲**的抗战精神。\n- **常见易混点/对比点**：与**八路军、新四军**（主要在关内敌后战场）活动区域和隶属关系不同；是**敌后战场**的重要组成部分。\n\n### 高中阶段\n- **时代背景**：**全民族抗战**时期，中国共产党领导的**敌后战场**成为抗日主战场之一。\n- **关键贡献**：领导**东北抗日联军**，在日伪统治核心区开展游击战争，战略上配合了正面战场。\n- **思想与精神**：体现了中国共产党人**坚定的理想信念**和**顽强的斗争意志**；是**抗战精神**的杰出体现。\n- **历史意义**：其斗争是**中国共产党领导的抗日武装斗争**的重要篇章，彰显了**中华民族的凝聚力和反抗外来侵略的决心**。\n- **对比点**：与**国民党正面战场**的作战方式、区域形成互补；其面临的**极端困难环境**（孤悬敌后、严寒、断粮）在抗战中尤为突出。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 杨靖宇是**东北抗日联军**的主要领导人。\n- 他在**长白山区**领导抗日游击战争。\n- 最终在**吉林濛江**壮烈牺牲，体现了**崇高的民族气节**。\n- 其事迹是**中国人民抗日战争**中**敌后抗战**的典型例证。\n- （存疑/说法不一）关于其早期在河南领导农民起义的具体细节，教材通常简略提及。\n\n### 高中阶段\n- 杨靖宇领导的**东北抗日联军**，是**中国共产党**领导下的一支重要抗日武装。\n- 其活动区域在**东北**，属于**敌后战场**，战略上**牵制了大量日伪军**。\n- 牺牲时的惨烈状况（胃中无粮）是诠释**抗战艰苦性**和**英雄气节**的经典史实。\n- 其历史地位：**著名的抗日民族英雄**，**中国共产党优秀党员的杰出代表**。\n- （存疑/说法不一）关于抗联后期与苏联的关系、部队具体编制变化等细节，学术研究有不同表述。\n\n---\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 河南省确山县李湾村 | 河南省驻马店市确山县 | 32.823292 | 114.010967 |\n| 河南省开封市 | 河南省开封市 | 34.798963 | 114.308423 |\n| 河南省确山县 | 河南省驻马店市确山县 | 32.823292 | 114.010967 |\n| 奉天（沈阳） | 辽宁省沈阳市 | 41.675224 | 123.458631 |\n| 哈尔滨 | 黑龙江省哈尔滨市 | 45.800999 | 126.529010 |\n| 磐石、濛江等长白山区 | 吉林省磐石市 | 43.070278 | 126.148056 |\n| 吉林省濛江县（今靖宇县） | 吉林省白山市靖宇县 | 42.386659 | 126.807639 |\n| 吉林省濛江县三道崴子 | 吉林省白山市靖宇县三道崴子 | 42.383000 | 126.813000 |\n","relatedGraph": {"center": {"id": "杨靖宇","name": "杨靖宇","file": "杨靖宇.html","dynasty": "抗日战争时期（中华民国）","aliases": [],"birth_year": 1905,"death_year": 1940,"quote": "冰天雪地、弹尽粮绝","review": "有名的义勇军领袖杨靖宇……坚决抗日，艰苦奋斗的战绩，是人所共知的。","foreign_name
