.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

**：约1040年\n- **停留时间**：短暂居留\n- **位置**：楚州山阳县（今江苏淮安市淮安区）\n- **事迹**：因父苏耆去世，扶柩南下，曾途经此地（此行程为基于丁忧返乡路线的合理推断，存疑）。\n- **意义**：自此再往南，便是苏州沧浪亭。他生命的最后十年终老于此，亲自筑亭、种竹、养鱼，八百余首遗作凝结成一座后世凭吊的诗碑，沧浪之水至今映照着这位北宋贬谪诗人不甘沉沦的孤影\n\n### 📍 重要地点：汴京（开封）\n- **公元纪年**：1042-1044年\n- **停留时间**：多次往返，累计数年\n- **位置**：东京开封府（今河南开封）\n- **事迹**：在朝任大理评事、集贤校理等职；与欧阳修、梅尧臣等诗文唱和，成为诗文革新运动核心；因支持范仲淹改革，屡次上书言事；1044年因“进奏院事件”被诬陷，在此被捕下狱。\n- **意义**：庆历新政失败、遭劾削籍后，他携家南下途经蒙城。曾经的县治已物是人非，而江南的山温水软正徐徐铺展在前，以无言的清丽抚慰一颗被朝廷辜负的诗心\n\n### 📍 重要地点：湖州\n- **公元纪年**：1045年\n- **停留时间**：短暂羁旅\n- **位置**：湖州（今浙江湖州）\n- **事迹**：被削职为民后，离京南下，曾途经或短暂游历湖州。\n- **意义**：自此再往南，便是苏州沧浪亭。他生命的最后十年终老于此，亲自筑亭、种竹、养鱼，八百余首遗作凝结成一座后世凭吊的诗碑，沧浪之水至今映照着这位北宋贬谪诗人不甘沉沦的孤影\n\n### 📍 重要地点：苏州\n- **公元纪年**：1045年—1048年\n- **停留时间**：约3年\n- **位置**：平江府苏州（今江苏苏州）\n- **事迹**：在此购得五代孙承祐池馆废地，修筑“沧浪亭”，并写下著名散文《沧浪亭记》；在此度过人生最后三年，创作了大量诗文。\n- **意义**：其人生最后的归宿与文学创作的巅峰之地，“沧浪亭”成为其精神象征。\n- **名篇名句**：《沧浪亭记》：“形骸既适则神不烦，观听无邪则道以明”；《淮中晚泊犊头》：“晚泊孤舟古祠下，满川风雨看潮生”。\n\n### 🔴 去世地：苏州\n- **公元纪年**：1048年\n- **停留时间**：定居直至去世\n- **位置**：平江府苏州（今江苏苏州）\n- **经过**：在苏州度过三年贬谪生涯后，朝廷复其官职，任湖州长史。然未及赴任，便因病在苏州去世。\n- **意义**：一场旧纸公钱案将他从汴京朝堂击落至此，亦是他从壮志未酬走向诗酒终老的转折地。筑沧浪亭以寄郁勃之气，把庆历革新失败后的郁愤尽数倾入诗文，亭畔水石低吟至今，仍在诉说这位早逝天才未竟的悲歌\n- **名篇名句**：《过苏州》：“绿杨白鹭俱自得，近水远山皆有情”。\n\n---\n\n## 四、地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 开封（汴京） | 河南省开封市 | 34.798963 | 114.308423 |\n| 蒙城 | 安徽省亳州市蒙城县 | 33.267491 | 116.559233 |\n| 长垣 | 河南省新乡市长垣市 | 35.202229 | 114.663282 |\n| 山阳（楚州）（存疑） | 江苏省淮安市淮安区 | 33.532405 | 119.162281 |\n| 湖州 | 浙江省湖州市 | 30.896222 | 120.082010 |\n| 苏州 | 江苏省苏州市 | 31.311123 | 120.621288 |\n## 五、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1008年 | 开封 | 河南开封 | （年龄：1岁）生于开封。 |\n| 青少年时期 | 汴京（开封） | 河南开封 | 以父荫补太庙斋郎，在汴京读书。 |\n| 1034年 | 蒙城 | 安徽蒙城 | （年龄：27岁）考中进士，授蒙城县令。 |\n| 约1038年 | 长垣 | 河南长垣 | （年龄：约31岁）调任长垣县令。 |\n| 约1040年 |  |  | （年龄：约33岁）父亲苏耆去世，丁忧。 |\n| 1042年 |  |  | （年龄：34岁）服除回京，任大理评事。 |\n| 1043年 |  |  | （年龄：35岁）范仲淹推行“庆历新政”，苏舜钦大力支持，上书言事。 |\n| 1044年 |  |  | （年龄：36岁）因“进奏院祠神”事被政敌诬陷，以“监守自盗”罪削籍为民。 |\n| 1045年 | 苏州 | 江苏苏州 | （年龄：38岁）离京南下，旅居苏州，修筑沧浪亭。 |\n| 1045-1048年 | 苏州 | 江苏苏州 | （年龄：38-41岁）隐居苏州沧浪亭，潜心诗文创作。 |\n| 1048年 | 苏州 | 江苏苏州 | （年龄：41岁）复官为湖州长史，未赴任，病逝于苏州。 |\n\n---\n\n## 六、历史影响\n\n### 对当时的影响\n苏舜钦是北宋诗文革新运动的中坚力量。他的诗歌创作实践，有力地抨击了当时流行的西昆体浮艳诗风，主张诗歌应反映现实、干预社会。他在政治上积极参与“庆历新政”，其遭遇深刻反映了北宋中期改革派与保守派的激烈斗争，是“庆历新政”失败的一个标志性事件。\n\n### 对后世的影响\n1.  **文学革新**：其诗歌题材广泛，风格豪健奔放，与梅尧臣共同开创了宋诗的新局面，为后来的王安石、苏轼等人奠定了基础。\n2.  **散文典范**：《沧浪亭记》等散文情景交融，哲理深刻，成为宋代散文的名篇。\n3.  **精神象征**：“沧浪亭”及其相关诗文，成为后世文人表达逆境中坚守人格、寄情山水的文化符号。\n\n### 历史评价\n1.  **欧阳修**：“子美笔力豪隽，以超迈横绝为奇。”（《六一诗话》）\n2.  **《宋史》**：“舜钦慷慨有大志，状貌怪伟。”“当天圣中，学者为文多病偶对，独舜钦与河南穆修好为古文歌诗，一时豪俊多从之游。”\n3.  **后世定位**：被视为北宋中期承前启后的关键文学家，其人生悲剧与文学成就共同构成了一个立体的历史形象。\n\n---\n\n## 七、人教版教材知识点\n\n### 初中阶段\n- **时代背景**：生活在**北宋中期**，社会矛盾逐渐显露。\n- **关键事件**：因支持**范仲淹**改革而被贬，是**庆历新政**失败的亲历者。\n- **代表作品**：教材可能选录其写景抒情诗，如**《淮中晚泊犊头》**。\n- **关键词**：**诗文革新运动**、**苏梅**（与梅尧臣并称）。\n- **常见易混点**：注意区分**苏舜钦**与**苏轼**，两人虽同姓且均为宋代文学家，但时代、成就和风格不同。\n\n### 高中阶段\n- **时代背景**：北宋**积贫积弱**、**内忧外患**局面下的士大夫改革浪潮。\n- **关键贡献**：作为**诗文革新运动**的早期核心成员，反对**西昆体**的形式主义诗风。\n- **代表思想**：文学主张**“文以载道”**，强调诗歌的**社会功能**和**现实关怀**。\n- **代表作品**：散文**《沧浪亭记》**体现了其贬谪后的心境与哲学思考；诗歌风格**豪放雄健**。\n- **对比点**：与**梅尧臣**并称“苏梅”，但苏诗更显**奔放**，梅诗更显**古淡**；其政治遭遇与**欧阳修**、**范仲淹**紧密相连。\n\n---\n\n## 八、初高中阶段考点\n\n### 初中阶段\n- 北宋文学家，与梅尧臣并称“**苏梅**”。\n- 支持**范仲淹**领导的**庆历新政**。\n- 代表诗作《**淮中晚泊犊头**》的意境与情感。\n- **沧浪亭**的建造者（联系其人生转折）。\n\n### 高中阶段\n- **北宋诗文革新运动**的先驱之一，反对**西昆体**。\n- 其政治生涯是**庆历新政**始末的一个缩影（**进奏院事件**）。\n- 散文《**沧浪亭记**》的思想内涵与艺术特色。\n- 诗歌风格：**豪犷雄放**，题材多涉及时政、民生。\n- 文学史地位：承**柳开**、**穆修**之后，启**欧阳修**、**王安石**、**苏轼**之先。\n- **存疑/说法不一**：关于其被诬陷的具体细节，史料记载略有出入，但“监守自盗”罪名系政敌构陷是共识。\n\n## 人教版教材知识点\n\n### 语文（课文/词作）\n- 课文/词作：存疑\n- 核心要点：存疑\n\n### 历史（史实/人物定位）\n- 关键史实：存疑\n- 核心要点：存疑\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |","relatedGraph": {"center": {"id": 373,"name": "苏舜钦","file": "苏舜钦.html","dynasty": "北宋","birth_year": 1008,"death_year": 1048,"time_year": 1028,"quote": "形骸既适则神不烦，观听无邪则道以明","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "literature","main_role_label": "诗人","birthpl
