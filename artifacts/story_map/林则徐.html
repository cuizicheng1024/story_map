  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

ummary": "意义：在此与家人告别，写下名篇《赴戍登程口占示家人》，表达了以身许国的情怀。", "quote": "力微任重久神疲，再竭衰庸定不支。", "quotes": ["力微任重久神疲，再竭衰庸定不支。", "苟利国家生死以，岂因祸福避趋之；"], "quote_policy": "preferred"}}, "markdown": "# 林则徐\n\n## 人物档案\n\n### 基本信息\n- **姓名**：林则徐\n- **时代**：清朝（乾隆至道光年间）\n- **出生**：公元1785年3月30日，侯官（今福建省福州市）\n- **去世**：公元1850年11月22日，普宁（今广东省普宁市）\n- **享年**：65岁\n- **主要身份**：政治家、思想家、民族英雄、诗人\n- **历史地位**：中国近代开眼看世界第一人，坚决维护国家主权的禁烟英雄。\n- **主要成就**：主持**虎门销烟**；整顿漕运、兴修水利；组织翻译外文书报，编译《四洲志》；在新疆兴办水利、推广“坎儿井”和纺车。\n\n### 生平概述\n林则徐生于清乾隆末年，历经嘉庆、道光两朝。他为官清正，体恤民情，在地方兴利除弊，政绩卓著。道光年间，受命为钦差大臣赴广东禁烟，于1839年主持**虎门销烟**，成为**鸦片战争**的导火索。战争爆发后遭诬陷革职，流放新疆。在疆期间仍致力开发建设。后被重新起用，于赴任广西途中病逝。他身处中国近代史开端，是主张抵抗侵略、学习西方的先驱。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及东南沿海、中原腹地、西北边疆，从福建至北京，再南下广东禁烟，后西行至新疆伊犁，最终卒于广东。\n- ⏱️ **时间跨度**：公元1785年 - 1850年，共计65年。\n- 📍 **地理范围**：覆盖今福建、浙江、江苏、湖北、河南、广东、陕西、甘肃、新疆等省区。\n- 🌟 **重要节点数量**：12个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：福州\n- **时间**：公元1785年\n- **停留时间**：青少年时期（约20年）\n- **地点**：侯官（今福建省福州市）\n- **事件**：出生于贫寒的私塾教师家庭，自幼聪颖好学。\n- **意义**：少年林则徐于闽中私塾发蒙，受教于名儒，浸润程朱理学，立下\"经世致用\"之志，这一思想底色贯穿其日后为官从政始终\n\n### 📍 重要地点：北京\n- **时间**：公元1811年\n- **停留时间**：数月\n- **地点**：北京（今北京市）\n- **事件**：考中进士，步入仕途。\n- **意义**：咸丰急召入京赴任，这位六十六岁老臣抱病星驰，从福建故里启程北上，终因积劳病殁于潮州途中。噩耗传至紫禁城，朝野震惊——一个敢于\"开眼看世界\"的重臣就此陨落，恰似帝国中兴希望的最后破灭\n\n### 📍 重要地点：杭州\n- **时间**：公元1823年-1824年\n- **停留时间**：约1年\n- **地点**：杭州（今浙江省杭州市）\n- **事件**：任江苏按察使，整顿吏治，平反冤狱，被誉为“林青天”。\n- **意义**：赴任广西途中病逝于潮州普宁，一代重臣就此陨落，犹怀\"苟利国家生死以\"之志未遂，标志着清王朝最后脊梁的崩塌\n\n### 📍 重要地点：武昌\n- **时间**：公元1830年-1832年\n- **停留时间**：约2年\n- **地点**：武昌（今湖北省武汉市武昌区）\n- **事件**：任湖北布政使、河南布政使，后调任东河河道总督，治理黄河、运河。\n- **意义**：咸丰急召入京赴任，这位六十六岁老臣抱病星驰，从福建故里启程北上，终因积劳病殁于潮州途中。噩耗传至紫禁城，朝野震惊——一个敢于\"开眼看世界\"的重臣就此陨落，恰似帝国中兴希望的最后破灭\n\n### 📍 重要地点：广州\n- **时间**：公元1839年3月-1840年10月\n- **停留时间**：约1年半\n- **地点**：广州（今广东省广州市）\n- **事件**：以钦差大臣身份主持禁烟，迫使外商交出鸦片，在**虎门海滩当众销毁**；组织翻译西方资料，编成《四洲志》。\n- **意义**：**虎门销烟**是其一生事业的顶点，标志着中国禁毒斗争的坚定决心；开近代中国学习西方之先河。\n\n### 📍 重要地点：镇海\n- **时间**：公元1841年5月-6月\n- **停留时间**：约1个月\n- **地点**：镇海（今浙江省宁波市镇海区）\n- **事件**：被革职后，暂留浙江镇海军营协办事务，研究防御工事和新式大炮。\n- **意义**：咸丰急召入京赴任，这位六十六岁老臣抱病星驰，从福建故里启程北上，终因积劳病殁于潮州途中。噩耗传至紫禁城，朝野震惊——一个敢于\"开眼看世界\"的重臣就此陨落，恰似帝国中兴希望的最后破灭\n\n### 📍 重要地点：西安\n- **时间**：公元1842年\n- **停留时间**：约2个月\n- **地点**：西安（今陕西省西安市）\n- **事件**：流放新疆途中，因病滞留西安调理。\n- **意义**：在此与家人告别，写下名篇《赴戍登程口占示家人》，表达了以身许国的情怀。\n- **名篇名句**：《赴戍登程口占示家人》：苟利国家生死以，岂因祸福避趋之；力微任重久神疲，再竭衰庸定不支。\n\n### 📍 重要地点：伊犁\n- **时间**：公元1842年12月-1845年12月\n- **停留时间**：约3年\n- **地点**：伊犁（今新疆维吾尔自治区伊犁哈萨克自治州）\n- **事件**：以待罪之身效力赎罪，实地勘察，倡导兴修水利，推广“坎儿井”（当地人称“林公井”）和内地纺车（“林公车”）。\n- **意义**：赴任广西途中病逝于潮州普宁，一代重臣就此陨落，犹怀\"苟利国家生死以\"之志未遂，标志着清王朝最后脊梁的崩塌\n\n### 📍 重要地点：哈密\n- **时间**：公元1845年\n- **停留时间**：数月\n- **地点**：哈密（今新疆维吾尔自治区哈密市）\n- **事件**：奉命勘察南疆垦荒事宜，行程三万里，查勘田地。\n- **意义**：赴任广西途中病逝于潮州普宁，一代重臣就此陨落，犹怀\"苟利国家生死以\"之志未遂，标志着清王朝最后脊梁的崩塌\n\n### 📍 重要地点：西安\n- **时间**：公元1846年-1847年\n- **停留时间**：约1年\n- **地点**：西安（今陕西省西安市）\n- **事件**：被重新起用后，任陕西巡抚，后调任云贵总督。\n- **意义**：赴任广西途中病逝于潮州普宁，一代重臣就此陨落，犹怀\"苟利国家生死以\"之志未遂，标志着清王朝最后脊梁的崩塌\n\n### 📍 重要地点：昆明\n- **时间**：公元1847年-1849年\n- **停留时间**：约2年\n- **地点**：昆明（今云南省昆明市）\n- **事件**：任云贵总督，处理汉回民族矛盾，整顿矿务。\n- **意义**：赴任广西途中病逝于潮州普宁，一代重臣就此陨落，犹怀\"苟利国家生死以\"之志未遂，标志着清王朝最后脊梁的崩塌\n\n### 🔴 去世地：普宁\n- **时间**：公元1850年11月\n- **停留时间**：数日\n- **地点**：普宁（今广东省普宁市）\n- **事件**：在赴任钦差大臣、前往广西镇压太平天国途中，病逝于普宁行馆。\n- **意义**：咸丰元年深秋，六十五岁的林则徐正是从此地领命南行，意图将太平天国扼杀于襁褓之中。这位以虎门销烟震烁古今的民族英雄，最终却病逝于潮州道中，未及履任便与世长辞，留下清廷一声沉重的叹息，也标志着一个重臣时代的黯然收场\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1785年 | 福州 | 福建省福州市 | （年龄：0岁）出生于福建侯官。 |\n| 1811年 |  |  | （年龄：26岁）考中进士，入翰林院。 |\n| 1823年 |  |  | （年龄：38岁）任江苏按察使，获称“林青天”。 |\n| 1832年 |  |  | （年龄：47岁）任东河河道总督，治理黄河。 |\n| 1837年 |  |  | （年龄：52岁）升任湖广总督，厉行禁烟。 |\n| 1839年 |  |  | （年龄：54岁）受命钦差大臣，赴广东禁烟，主持**虎门销烟**。 |\n| 1840年 |  |  | （年龄：55岁）鸦片战争爆发，遭诬陷革职。 |\n| 1842年 | 伊犁 | 新疆维吾尔自治区伊犁哈萨克自治州 | （年龄：57岁）流放新疆伊犁。 |\n| 1845年 |  |  | （年龄：60岁）被重新起用，署理陕甘总督。 |\n| 1847年 |  |  | （年龄：62岁）任云贵总督。 |\n| 1850年 | 普宁 | 广东省普宁市 | （年龄：65岁）受命钦差大臣，赴广西途中病逝于广东普宁。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《赴戍登程口占示家人》**（节选）\n- 核心要点：\n    - **重点**：名句“**苟利国家生死以，岂因祸福避趋之**”集中体现了其**爱国主义**精神和**无私奉献**的高尚品格。\n    - 诗歌背景与**鸦片战争**及个人**流放**遭遇紧密相关，是理解其心境的关键。\n    - 语言质朴而情感深沉，展现了传统士大夫的**家国情怀**。\n    - **重点**：诗中“**谪居正是君恩厚，养拙刚于戍卒宜**”等句，表面是自谦自责，实则蕴含了对时局的无奈与忧愤。\n    - 作为历史人物的文学创作，是了解林则徐**个人情感**与**政治境遇**的一手材料。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：领导了**虎门销烟**（1839年），这是中国近代史上反对**帝国主义**侵略的标志性事件。\n    - 受命为**钦差大臣**赴广东禁烟，是**道光帝**支持下的重大国家行动。\n    - **鸦片战争**爆发后被革职，后被**流放伊犁**，反映了清廷内部的**妥协派**得势。\n    - 在新疆兴修水利，推广生产技术，体现了**经世致用**的务实思想。\n    - **重点**：组织编译《四洲志》，被誉为“**开眼看世界的第一人**”，开启了近代中国学习西方的思潮。\n- 核心要点：\n    - **重点**：林则徐是**中国近代史**开端时期的关键人物，其禁烟与抗英活动标志着中国**反侵略斗争**的开始。\n    - 他的遭遇深刻反映了**封建统治**的腐朽与**闭关锁国**政策的恶果。\n    - **重点**：其历史地位超越了个人荣辱，成为中华民族不屈不挠、勇于抗争的**民族精神**象征。\n    - 他主张了解西方、学习西方技术，是**洋务运动**思想的先声。\n    - **重点**：对林则徐的评价，历来是理解**近代中国**如何应对内外危机的一个重要切入点。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 福州 | 福建省福州市 | 26.0745 | 119.2965 |\n| 北京 | 北京市 | 39.9042 | 116.4074 |\n| 杭州 | 浙江省杭州市 | 30.2741 | 120.1551 |\n| 武昌 | 湖北省武汉市 | 30.5928 | 114.3055 |\n| 广州 | 广东省广州市 | 23.1291 | 113.2644 |\n| 镇海 | 浙江省宁波市镇海区 | 29.9487 | 121.7134 |\n| 西安 | 陕西省西安市 | 34.3416 | 108.9398 |\n| 伊犁 | 新疆维吾尔自治区伊犁哈萨克自治州 | 43.9168 | 81.3246 |\n| 哈密 | 新疆伊宁市 | 43.9120 | 81.2770 |\n| 西安 | 新疆哈密市 | 42.8333 | 93.5167 |\n| 昆明 | 云南省昆明市 | 25.0389 | 102.7183 |\n| 普宁 | 广东省普宁市 | 23.2973 | 116.1656 |\n", "relatedGraph": {"center": {"id": 248, "name": "林则徐", "file": "林则徐.html", "dynasty": "清朝（乾隆至道光年间）", "birth_year": 1785, "death_year": 1850, "time_year": 1818, "quote": "苟利国家生死以，岂因祸福避趋之", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "政治家", "birthplace": "侯官", "birthplace_raw": "侯官今福建省福州市", "birthplace_modern": "福建省福州市", "birth_lat_wgs84": 26.0745, "birth_lng_wgs84": 119.2965, "birth_lat": 26.0745, "birth_lng": 119.2965, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["林则徐"], "search_tokens": ["林则徐", "linzexu", "lzx"], "search_pinyin": ["linzexu", "lzx"], "is_foreign": 0, "created_at": "2026-07-01
