  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

1919年\n- **停留时间**：约2年\n- **地点**：云南昆明（今云南省昆明市）\n- **事件**：入云南陆军讲武堂学习，毕业后加入孙中山领导的援闽粤军，正式开始军事生涯。\n- **意义**：二十岁的客家青年负笈春城，踏入云南讲武堂的炮术与战术课堂，同窗朱德的革命火种亦在此点燃，自此戎马一生，再未解鞍\n\n### 📍 重要地点：广州\n- **时间**：1920年代 - 1927年（多次往返）\n- **停留时间**：累计数年\n- **地点**：广东广州（今广东省广州市）\n- **事件**：参与筹建黄埔军校，任教授部副主任；参加东征和北伐；1927年7月秘密加入中国共产党；同年12月参与领导广州起义。\n- **意义**：军事才能崭露头角，完成了从旧军人到共产主义战士的转变，并直接参与了武装反抗国民党反动派的斗争。\n\n### 📍 重要地点：江西瑞金\n- **时间**：1931年 - 1934年\n- **停留时间**：约3年\n- **地点**：江西瑞金（今江西省瑞金市）\n- **事件**：进入中央苏区，历任中央革命军事委员会委员兼总参谋部部长、红一方面军参谋长等职，参与指挥反“围剿”作战。\n- **意义**：二十岁的客家青年负笈春城，踏入云南讲武堂的炮术与战术课堂，同窗朱德的革命火种亦在此点燃，自此戎马一生，再未解鞍\n\n### 📍 重要地点：长征路（关键节点：四川懋功、巴西）\n- **时间**：1934年 - 1936年（关键事件发生于1935年）\n- **停留时间**：约两年（1934-1936）\n- **地点**：途经多省，关键地点如四川懋功（今四川省小金县）、巴西（今四川省若尔盖县巴西乡）\n- **事件**：在懋功与红四方面军会师后，坚决拥护中央北上方针；在巴西地区，及时向中央报告了张国焘企图危害中央的密电，为党中央和红军脱离险境作出重大贡献。\n- **意义**：在党和红军面临分裂的危急关头，表现出坚定的党性原则和非凡的胆识，为革命立下大功。\n\n### 📍 重要地点：陕西延安\n- **时间**：1937年 - 1941年（主要时期）\n- **停留时间**：约4年\n- **地点**：陕西延安（今陕西省延安市）\n- **事件**：任中共中央军事委员会参谋长，协助毛泽东处理军务；参与创办军事学院；开展统战工作。\n- **意义**：在抗日战争的指挥中枢工作，为八路军、新四军的发展壮大和敌后抗战的开展出谋划策。\n- **名篇名句**：《重读毛主席〈论持久战〉》：“百万倭奴压海陬，神州沉陆使人愁。内行内战资强虏，敌后敌前费运筹。唱罢凯歌来灞上，集中全力破石头。一篇持久重新读，眼底吴钩看不休。”\n\n### 📍 重要地点：湖北武汉\n- **时间**：1938年\n- **停留时间**：数月\n- **地点**：湖北武汉（今湖北省武汉市）\n- **事件**：任中共中央长江局委员，在武汉八路军办事处开展工作，从事抗日民族统一战线事务。\n- **意义**：在抗战初期的重要城市，广泛团结各界人士，扩大了中国共产党的影响。\n\n### 📍 重要地点：北平（和谈）\n- **时间**：1949年\n- **停留时间**：数月\n- **地点**：北平（今北京市）\n- **事件**：作为中共代表团成员，参加与南京国民党政府的和平谈判；谈判破裂后，参与接管北平。\n- **意义**：二十岁的客家青年负笈春城，踏入云南讲武堂的炮术与战术课堂，同窗朱德的革命火种亦在此点燃，自此戎马一生，再未解鞍\n\n### 📍 重要地点：北京（建国后）\n- **时间**：1949年 - 1986年\n- **停留时间**：37年\n- **地点**：北京（今北京市）\n- **事件**：历任华南分局第一书记、广东省人民政府主席兼广州市市长、国防部部长、中共中央副主席、中共中央政治局常委、全国人大常委会委员长、中央军委副主席等职。1976年10月，在粉碎“四人帮”的斗争中起了决定性作用。晚年推动改革开放和军队现代化建设。\n- **意义**：作为党和国家的主要领导人之一，在社会主义革命、建设和改革开放各个时期都作出了卓越贡献，尤其在历史转折关头发挥了关键作用。\n- **名篇名句**：《远望》：“忧患元元忆逝翁，红旗缥缈没遥空。昏鸦三匝迷枯树，回雁兼程溯旧踪。赤道雕弓能射虎，椰林匕首敢屠龙。景升父子皆豚犬，旋转还凭革命功。”（1965年秋写于大连棒棰岛，后广为流传）；《八十书怀》：“八十毋劳论废兴，长征接力有来人。导师创业垂千古，侪辈跟随愧望尘。亿万愚公齐破立，五洲权霸共沉沦。老夫喜作黄昏颂，满目青山夕照明。”\n\n### 🔴 去世地：北京\n- **时间**：1986年10月22日\n- **停留时间**：晚年长期居住\n- **地点**：北京（今北京市）\n- **事件**：因病逝世。\n- **意义**：二十岁的客家青年负笈春城，踏入云南讲武堂的炮术与战术课堂，同窗朱德的革命火种亦在此点燃，自此戎马一生，再未解鞍了光辉的一生，他的逝世是党和国家的重大损失。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1897 | 广东梅县 | 广东省梅州市梅县区 | （年龄（周岁）：0）出生于广东梅县。 |\n| 1917 |  |  | （年龄（周岁）：20）入云南陆军讲武堂学习。 |\n| 1920 |  |  | （年龄（周岁）：23）讲武堂毕业后，追随孙中山从事革命活动。 |\n| 1924 |  |  | （年龄（周岁）：27）参与筹建黄埔军校，任教授部副主任。 |\n| 1926 |  |  | （年龄（周岁）：29）参加北伐战争，任国民革命军新编第二师师长。 |\n| 1927 | 广州 | 广东省广州市 | （年龄（周岁）：30）7月秘密加入中国共产党；12月参与领导广州起义。 |\n| 1931 |  |  | （年龄（周岁）：34）进入中央苏区，任中央革命军事委员会总参谋部部长。 |\n| 1934 | 长征路（关键节点：四川懋功、巴西） | 四川省小金县 | （年龄（周岁）：37）参加长征，任军委第一纵队司令员。 |\n| 1935 | 长征路（关键节点：四川懋功、巴西） | 四川省小金县 | （年龄（周岁）：38）长征途中，在巴西地区及时报告张国焘密电，维护中央权威。 |\n| 1936 |  |  | （年龄（周岁）：39）协助周恩来和平解决西安事变。 |\n| 1937 |  |  | （年龄（周岁）：40）任中共中央军事委员会参谋长，驻延安。 |\n| 1941 |  |  | （年龄（周岁）：44）任中央军委军事教育委员会委员兼军事学院副院长。 |\n| 1945 |  |  | （年龄（周岁）：48）当选为中共中央委员。 |\n| 1947 |  |  | （年龄（周岁）：50）任中共中央后方委员会书记。 |\n| 1949 | 北平（和谈） | 北京市 | （年龄（周岁）：52）参加国共北平和谈；后任中共中央华南分局第一书记。 |\n| 1954 |  |  | （年龄（周岁）：57）任人民革命军事委员会副主席、国防委员会副主席。 |\n| 1955 |  |  | （年龄（周岁）：58）被授予中华人民共和国元帅军衔。 |\n| 1958 |  |  | （年龄（周岁）：61）任军事科学院院长兼政治委员。 |\n| 1966 |  |  | （年龄（周岁）：69）任中共中央书记处书记、中央军委副主席。 |\n| 1971 |  |  | （年龄（周岁）：74）主持中央军委日常工作。 |\n| 1975 |  |  | （年龄（周岁）：78）任国防部部长。 |\n| 1976 |  |  | （年龄（周岁）：79）10月，在粉碎“四人帮”的斗争中起决定性作用。 |\n| 1978 |  |  | （年龄（周岁）：81）当选为全国人大常委会委员长。 |\n| 1986 | 北京 | 北京市 | （年龄（周岁）：89）10月22日在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《远望》**、**《八十书怀》**、《重读毛主席〈论持久战〉》\n- 核心要点：\n    - **重点**：诗歌常体现**革命乐观主义**精神和**老骥伏枥**的豪情，如“老夫喜作黄昏颂，满目青山夕照明”。\n    - **重点**：作品具有鲜明的**政治抒情诗**特点，紧密结合**时代风云**与个人革命经历。\n    - 善用**传统诗词格律**表达现代革命内容，实现了**旧体诗**与**新意境**的融合。\n    - **意象**雄浑，如“红旗”、“青山”、“夕照”，富有象征意义。\n    - **重点**：《远望》一诗在特定历史时期被广泛传诵，体现了对国际共产主义运动形势的深刻观察与**革命信念**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：参与**黄埔军校**创建与早期国民革命，是第一次国共合作的亲历者。\n    - **重点**：在**长征**途中，为维护党和红军的团结、揭露张国焘分裂阴谋作出**关键贡献**。\n    - 参与领导**广州起义**，是中共早期武装斗争的重要领导人。\n    - 协助**周恩来**和平解决**西安事变**，推动抗日民族统一战线形成。\n    - **重点**
