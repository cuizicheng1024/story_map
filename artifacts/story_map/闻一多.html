  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

庄子》、《楚辞》研究中取得卓越成就；3. 创作《红烛》、《死水》等经典诗集；4. 抗战期间投身民主运动，成为昆明民主运动的旗帜。\n\n### 生平概述\n闻一多生于清末，成长于民国初年。早年就读于清华学校，后赴美留学学习美术与文学。归国后，他先后在多所大学任教，致力于古典文学研究与新诗创作，是新月诗派的理论奠基人之一。抗战爆发后，随校南迁至昆明，在艰苦的环境中坚持学术研究与教学。后期，面对国民党的独裁统治，他毅然走出书斋，投身争取民主与和平的斗争，最终在1946年于昆明遭国民党特务暗杀，以身殉国，其牺牲深刻激励了国统区的民主运动。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从湖北浠水出发，求学于北京，留学美国，执教于青岛、清华，最终南迁至昆明并在此殉难。\n- ⏱️ **时间跨度**：公元1899年 - 公元1946年（约47年）\n- 📍 **地理范围**：中国湖北、北京、山东、江苏、云南等地，以及美国。\n- 🌟 **重要节点数量**：9个\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：浠水\n- **时间**：1899年\n- **停留时间**：约13年\n- **地点**：湖北省黄州府蕲水县（今湖北省黄冈市浠水县）\n- **事件**：出生于书香门第，幼年在家乡接受传统启蒙教育。\n- **意义**：少年闻一多沉潜于旧学之中，经史子集的浸润让他对古典世界有了最初的体认，这份厚重的家学渊源如同深埋地下的根脉，日后长出参天的诗学与学术之树\n\n### 📍 重要地点：北京（清华学校）\n- **时间**：1912年 - 1922年\n- **停留时间**：约10年\n- **地点**：京师（今北京市）\n- **事件**：考入清华学校（清华大学前身），开始接受现代教育，积极参与文学社团活动，发表诗文，展现领导才能。\n- **意义**：清华孕育了他的学识与风骨，这份精神底色贯穿了他的一生——当他在昆明街头倒在特务枪口之下，便以鲜血为那个时代写下最沉重的注脚，成为后世知识分子心中永恒的灯塔\n\n### 📍 重要地点：美国（芝加哥、科罗拉多、纽约）\n- **时间**：1922年 - 1925年\n- **停留时间**：约3年\n- **地点**：美利坚合众国（今美国伊利诺伊州芝加哥市、科罗拉多州、纽约州纽约市等地）\n- **事件**：先后在芝加哥艺术学院、科罗拉多大学、纽约艺术学院学习美术与文学，深受西方文化影响，同时感受到民族歧视，激发强烈民族情感。\n- **意义**：从清华园出发的少年，终在昆明倒在了特务的枪口之下。1946年7月15日最后一次讲演拍案而起，将书生的笔墨化作投向独裁的投枪。他以鲜血兑现了五四时代立下的誓言，让母校的草木至今仍回荡着不屈的回声\n- **名篇名句**：《太阳吟》：太阳啊，刺得我心痛的太阳！；《忆菊》：我要赞美我祖国的花！我要赞美我如花的祖国！\n\n### 📍 重要地点：南京（国立第四中山大学）\n- **时间**：1927年 - 1928年\n- **停留时间**：约1年\n- **地点**：南京（今江苏省南京市）\n- **事件**：短暂任职于国立第四中山大学（后更名为中央大学），并参与编辑《新月》杂志。\n- **意义**：从清华园出发的少年，终在昆明倒在了特务的枪口之下。1946年7月15日最后一次讲演拍案而起，将书生的笔墨化作投向独裁的投枪。他以鲜血兑现了五四时代立下的誓言，让母校的草木至今仍回荡着不屈的回声\n\n### 📍 重要地点：青岛（国立青岛大学）\n- **时间**：1930年 - 1932年\n- **停留时间**：约2年\n- **地点**：胶澳商埠（今山东省青岛市）\n- **事件**：任国立青岛大学（今山东大学前身）文学院院长兼中文系主任，潜心学术研究，创作进入高峰期。\n- **意义**：清华不仅是诗人的精神摇篮，更见证他从书斋走向广场的心路蜕变；他后来以生命兑现的民主誓言，根脉正深植于五四时期的清华岁月，使这片校园至今仍燃烧着不灭的精神火焰\n- **名篇名句**：《死水》：这是一沟绝望的死水，清风吹不起半点漪沦。\n\n### 📍 重要地点：北京（清华大学）\n- **时间**：1932年 - 1937年\n- **停留时间**：约5年\n- **地点**：北平（今北京市）\n- **事件**：回到母校清华大学任中文系教授，全力投入《周易》、《诗经》等古籍研究，过着“何妨一下楼”的学者生活。\n- **意义**：清华孕育了他的学识与风骨，这份精神底色贯穿了他的一生——当他在昆明街头倒在特务枪口之下，便以鲜血为那个时代写下最沉重的注脚，成为后世知识分子心中永恒的灯塔\n\n### 📍 重要地点：长沙（临时大学）\n- **时间**：1937年 - 1938年\n- **停留时间**：约半年\n- **地点**：长沙府（今湖南省长沙市）\n- **事件**：抗战爆发后，随清华大学南迁至长沙，参与组建国立临时大学（西南联大前身）。\n- **意义**：清华孕育了他的学识与风骨，这份精神底色贯穿了他的一生——当他在昆明街头倒在特务枪口之下，便以鲜血为那个时代写下最沉重的注脚，成为后世知识分子心中永恒的灯塔\n\n### 📍 重要地点：昆明（西南联合大学）\n- **时间**：1938年 - 1946年\n- **停留时间**：约8年\n- **地点**：云南府（今云南省昆明市）\n- **事件**：随校迁至昆明，在西南联合大学任教。前期埋首学术，后期因现实刺激，积极投身民主运动，发表大量抨击时政的演说。\n- **意义**：清华孕育了他的学识与风骨，这份精神底色贯穿了他的一生——当他在昆明街头倒在特务枪口之下，便以鲜血为那个时代写下最沉重的注脚，成为后世知识分子心中永恒的灯塔\n- **名篇名句**：《最后一次讲演》：我们不怕死，我们有牺牲的精神！我们随时像李先生一样，前脚跨出大门，后脚就不准备再跨进大门！\n\n### 🔴 去世地：昆明（西仓坡）\n- **时间**：1946年7月15日\n- **停留时间**：殉难地\n- **地点**：云南府（今云南省昆明市五华区西仓坡）\n- **事件**：在参加李公朴追悼会并发表著名讲演后，于返家途中遭国民党特务暗杀，壮烈牺牲。\n- **意义**：清华不仅是诗人的精神摇篮，更见证他从书斋走向广场的心路蜕变；他后来以生命兑现的民主誓言，根脉正深植于五四时期的清华岁月，使这片校园至今仍燃烧着不灭的精神火焰\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1899 | 浠水 | 湖北省黄冈市浠水县 | （年龄：0）出生于湖北浠水。 |\n| 1912 | 北京（清华学校） | 北京市 | （年龄：13）考入北京清华学校。 |\n| 1919 |  |  | （年龄：20）参与五四运动，开始新诗创作。 |\n| 1922 | 美国（芝加哥、科罗拉多、纽约） |  | （年龄：23）赴美留学，先后入芝加哥艺术学院等校。 |\n| 1925 |  |  | （年龄：26）回国，经历求职与适应期（具体地点待考）。 |\n| 1928 |  |  | （年龄：29）诗集《死水》出版。 |\n| 1930 | 青岛（国立青岛大学） | 山东省青岛市 | （年龄：31）任国立青岛大学文学院院长。 |\n| 1932 | 北京（清华大学） | 北京市 | （年龄：33）任清华大学中文系教授，潜心古籍研究。 |\n| 1937 | 长沙（临时大学） | 湖南省长沙市 | （年龄：38）抗战爆发，南迁至长沙临时大学。 |\n| 1938 | 昆明（西南联合大学） | 云南省昆明市 | （年龄：39）抵达昆明，任教于西南联合大学。 |\n| 1944 |  |  | （年龄：45）加入中国民主同盟，投身民主运动。 |\n| 1946 | 昆明（西南联合大学） | 云南省昆明市 | （年龄：46）在昆明发表《最后一次讲演》后遭暗杀，壮烈牺牲。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《最后一次讲演》**、**《死水》**、《红烛》（序诗）\n- 核心要点：\n    - **重点**：**《最后一次讲演》** 以强烈的爱憎情感和口语化的语言，展现了其**拍案而起**的斗士形象，是**演讲词**的典范。\n    - **重点**：**《死水》** 运用**象征**手法，以“一沟绝望的死水”象征腐败的旧中国，体现了其**“三美”**（音乐美、绘画美、建筑美）诗歌主张。\n    - **《红烛》** 序诗化用“蜡炬成灰泪始干”的**典故**，歌颂奉献精神，奠定了其诗集**爱国主义**的情感基调。\n    - **重点**：其诗歌风格经历了从**浪漫主义**的直抒胸臆到**象征主义**的含蓄深沉的转变。\n    - 作品中充满强烈的**爱国主义**情感和对黑暗现实的**批判**精神。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**西南联大**时期，从专注学术的学者转变为**民主同盟**的领导人，是**昆明民主运动**的核心人物。\n    - **李公朴、闻一多血案**（**“李闻惨案**”）是国民党镇压民主运动的标志性事件，震惊全国。\n    - **重点**：其牺牲发生于**国共内战**全面爆发前夕，极大地教育了民众，推动了**第二条战线**的形成。\n- 核心要点：\n    - **重点**：闻一多是**中国现代知识分子**的典范，体现了从“学者”到“**民主战士**”的转变历程。\n    - 其人生轨迹反映了**抗日战争**与**解放战争**时期中国知识分子的道路选择与命运。\n    - **重点**：毛泽东曾高度赞扬闻一多“**拍案而起**，横眉怒对国民党的手枪，宁可倒下去，不愿屈服”的**骨气**（出自毛泽东《别了，司徒雷登》）。\n    - 他兼具**诗人**的激情、**学者**的严谨与**革命者**的勇气，是**爱国主义**精神的杰出代表。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 湖北省黄冈市浠水县 | 30.4518 | 115.2622 |\n| 北京市海淀区清华大学 | 40.0033 | 116.3267 |\n| 美国伊利诺伊州芝加哥市 | 41.8781 | -87.6298 |\n| 江苏省南京市 | 32.0603 | 118.7969 |\n| 山东省青岛市 | 36.0671 | 120.3826 |\n| 北京市 | 39.9042 | 116.4074 |\n| 湖南省长沙市 | 28.2280 | 112.9388 |\n| 云南省昆明市西南联大旧址 | 25.0565 | 102.7083 |\n| 云南省昆明市西仓坡（殉难地） | 25.0453 | 102.7005 |\n| 云南省昆明市 | 25.0389 | 102.7183 |", "relatedGraph": {"center": {"id": 456, "name": "闻一多", "file": "闻一多.html", "dynasty": "清末至中华民国", "birth_year": 1899, "death_year": 1946, "time_year": 1905, "quote": "一沟绝望的死水", "review": "", "aliases": ["闻家骅", "闻友三", "闻亦多", "闻骅", "家骅"], "foreign_name": "", "domain_tags": [], "main_role_band": "literature", "main_role_label": "诗人", "birthplace": "湖北省黄州府蕲水县", "birthplace_raw": "湖北省黄州府蕲水县今湖北省黄冈市浠水县", "birthplace_modern": "湖北省黄冈市浠水县", "birth_lat_wgs84": 30.4518, "birth_lng_wgs84": 115.2622, "birth_lat": 30.4518, "birth_lng": 115.2622, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["闻一多", "闻家骅", "闻友三", "闻亦多", "闻骅", "家骅"], "search_tokens": ["闻一多", "闻家骅", "闻友三", "闻亦多", "闻骅", "家骅", "wenyiduo", "wyd", "wenjiahua", "wjh", "wenyousan", "wys", "wenhua", "wh", "jiahua", "jh"], "search_pinyin": ["wenyiduo", "wyd", "wenjiahua", "wjh", "wenyousan", "wys", "wenhua", "wh", "jiahua", "jh"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "isCenter": true, "relationLabel": "中心人物"}, "nodes": [{"id": 456, "name": "闻一多", "file": "闻一多.html", "dynasty": "清末至中华民国", "birth_year": 1899, "death_year": 1946, "time_year": 1905, "quote": "一沟绝望的死水", "review": "", "aliases": ["闻家骅", "闻友
