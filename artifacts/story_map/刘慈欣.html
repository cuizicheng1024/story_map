  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

6月。\n- **意义**：1963年生于京城，襁褓中便随父辈辗转迁徙，终落晋东煤城。漂泊的童年让他在烟尘与沟壑间过早触摸到现实的粗粝，这段毫不起眼的起点，却悄然埋下一颗向星空眺望的种子\n\n### 📍 重要地点：山西阳泉（成长地）\n- **时间**：约公元1966年-1981年\n- **停留时间**：约15年\n- **地点**：阳泉（今山西省阳泉市）\n- **事件**：随家人迁居至此，度过童年与少年时代，在阳泉一中就读。\n- **意义**：工矿子弟的生活环境为其提供了观察工业社会与集体生活的独特视角，成为其早期科幻小说（如《地火》）的重要背景来源。\n\n### 📍 重要地点：华北水利水电学院（求学地）\n- **时间**：公元1981年-1985年\n- **停留时间**：4年\n- **地点**：华北水利水电学院（今华北水利水电大学，主校区位于河南省郑州市）\n- **事件**：就读于水电工程系。\n- **意义**：接受系统的工科教育，为其科幻创作中严谨的技术细节描写奠定了基础。\n\n### 📍 重要地点：娘子关电厂（工作与创作核心期）\n- **时间**：公元1985年-2009年\n- **停留时间**：约24年\n- **地点**：娘子关电厂（位于山西省阳泉市平定县娘子关镇）\n- **事件**：毕业后分配至此，任计算机工程师。在此期间完成了绝大多数重要作品的创作，包括《流浪地球》、《三体》前两部等。\n- **意义**：稳定而封闭的环境提供了充裕的创作时间，电厂生活也深刻影响了其作品中关于技术、生存与集体主义的思考。**重点**：这是他创作生涯的黄金时期，奠定了其在中国科幻界的核心地位。\n\n### 📍 重要地点：成都（科幻活动中心）\n- **时间**：多次，主要集中于21世纪初\n- **停留时间**：短期（参加笔会、颁奖）\n- **地点**：成都（今四川省成都市）\n- **事件**：多次参加《科幻世界》杂志社举办的笔会、银河奖颁奖典礼等活动。\n- **意义**：与编辑、同行交流的重要平台，其许多作品首发于《科幻世界》，成都可视为其科幻事业的“精神主场”之一。\n\n### 📍 重要地点：美国斯波坎（雨果奖领奖地）\n- **时间**：公元2015年8月\n- **停留时间**：短期\n- **地点**：斯波坎（今美国华盛顿州斯波坎市）\n- **事件**：出席第73届世界科幻大会，凭借《三体》第一部英译本获得雨果奖最佳长篇小说奖。\n- **意义**：**重点**：标志着中国科幻首次获得世界最高荣誉，是其个人生涯和中国科幻史的巅峰时刻。\n\n### 📍 重要地点：山西省作家协会（现工作地）\n- **时间**：公元2009年至今\n- **停留时间**：长期\n- **地点**：太原（今山西省太原市）\n- **事件**：从娘子关电厂调入山西省作家协会，成为专业作家。\n- **意义**：生活与工作重心转移至省会，拥有了更广阔的平台进行创作与文化交流。\n\n### 📍 重要地点：《流浪地球》电影拍摄相关地（文化影响节点）\n- **时间**：公元2017年-2019年\n- **停留时间**：不定期\n- **地点**：青岛东方影都等（今山东省青岛市）\n- **事件**：作为原著作者与监制，参与电影《流浪地球》的制作过程。\n- **意义**：其作品成功实现影视化转化，开创中国科幻电影新纪元，使其影响力从文学圈扩展至大众文化领域。\n\n### 🔴 现居地：太原\n- **时间**：公元2009年至今\n- **停留时间**：长期居住中\n- **地点**：太原（今山西省太原市）\n- **事件**：在此生活、创作，接待访客，进行公共活动。\n- **意义**：当前的人生与创作中心。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1963年 | 北京 | 中国北京市 | （年龄：0岁）出生于1963年6月，出生地北京。 |\n| 约1966年 | 山西阳泉（成长地） | 山西省阳泉市 | （年龄：约3岁）随家人迁居山西阳泉。 |\n| 1981年 | 华北水利水电学院（求学地） | 华北水利水电大学，主校区位于河南省郑州市 | （年龄：18岁）考入华北水利水电学院（今华北水利水电大学）。 |\n| 1985年 | 娘子关电厂（工作与创作核心期） | 娘子关电厂 | （年龄：22岁）大学毕业，分配至山西娘子关电厂任计算机工程师。 |\n| 约1989年 |  |  | （年龄：约26岁）开始创作首部长篇小说《超新星纪元》（具体创作周期存疑）。 |\n| 1999年 |  |  | （年龄：36岁）在《科幻世界》发表《鲸歌》、《微观尽头》等短篇，开始崭露头角。 |\n| 2000年 |  |  | （年龄：37岁）发表《流浪地球》，获中国科幻银河奖特等奖。 |\n| 2006年 |  |  | （年龄：43岁）在《科幻世界》开始连载《三体》第一部。 |\n| 2008年 |  |  | （年龄：45岁）出版《三体II：黑暗森林》。 |\n| 2010年 |  |  | （年龄：47岁）出版《三体III：死神永生》，系列完结。 |\n| 2015年 |  |  | （年龄：52岁）**重点**：《三体》获第73届雨果奖最佳长篇小说奖。 |\n| 2019年 |  |  | （年龄：56岁）电影《流浪地球》上映，担任原著及监制，获巨大成功。 |\n| 2023年 |  |  | （年龄：60岁）持续进行文学创作与公共活动。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《带上她的眼睛》**（入选人教版初中语文教材）、**《微纪元》**（节选）等。\n- 核心要点：\n    - **重点**：作品常体现 **“硬科幻”** 特征，注重科学逻辑与技术细节的严谨推演。\n    - 善于构建极端 **“思想实验”** 情境，如地心探险、太阳灾变、宇宙文明生存竞争等，探讨人性和文明本质。\n    - **重点**：叙事风格冷静、客观，甚至带有 **“冷酷”** 的理性色彩，与宏大悲壮的 **“崇高感”** 并存。\n    - 意象独特，常将 **“工业美学”**（如发动机、空间站）与宇宙的浩瀚荒凉结合，形成独特审美。\n    - **重点**：主题深刻，常涉及 **“生存与道德”**、**“技术与人文”**、**“个体与集体”**、**“文明的延续”** 等终极命题。\n    - 善用 **“悬念”** 和 **“揭秘”** 结构，在科幻设定中融入侦探小说般的阅读快感。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：是中国 **“新生代科幻”** 的代表作家和集大成者，其创作历程与中国科幻文学从边缘走向主流、从国内走向世界的进程同步。\n    - 其作品 **《三体》** 的成功，被视为中国 **“文化自信”** 在科幻领域的体现，引发了全球范围内的讨论与研究。\n    - **重点**：以工程师的背景进行创作，其成功打破了作家必须来自文科领域的传统认知，激励了众多理工科背景的创作者。\n- 核心要点：\n    - **重点**：其创作高峰期（20世纪90年代至21世纪10年代）正值中国 **“改革开放”** 深入、科技迅猛发展、社会思想活跃的时代，作品呼应了国人对科技、未来和宇宙的想象与关切。\n    - 立场客观，作品超越简单的 **“乐观”** 或 **“悲观”** 二元论，呈现对文明发展复杂性的深刻洞察。\n    - **重点**：国际影响力巨大，被视为继鲁迅、老舍等之后，又一位具有世界级影响力的中国作家，其作品成为外界了解中国现代思想与想象力的重要窗口。\n    - 功过评价：被赞誉为将中国科幻提升至 **“世界水平”** 的旗帜性人物；其作品中关于 **“黑暗森林”** 法则等设定也引发了关于宇宙伦理的哲学争论。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 北京 | 北京市 | 39.904200 | 116.407400 |\n| 山西阳泉（成长地） | 山西省阳泉市 | 37.857100 | 113.580300 |\n| 华北水利水电学院（求学地） | 河南省郑州市华北水利水电大学 | 34.780500 | 113.792600 |\n| 娘子关电厂（工作与创作核心期） | 山西省阳泉市平定县娘子关镇娘子关电厂 | 37.963100 | 113.855600 |\n| 成都（科幻活动中心） | 四川省成都市 | 30.572800 | 104.066800 |\n| 美国斯波坎（雨果奖领奖地） | 美国华盛顿州斯波坎市 | 47.658800 | -117.426000 |\n| 山西省作家协会（现工作地） | 山西省太原市 | 37.870600 | 112.548900 |\n| 《流浪地球》电影拍摄相关地（文化影响节点） | 山东省青岛市东方影都 | 35.960700 | 120.223800 |\n| 现居地：太原 | 山西省太原市 | 37.870600 | 112.548900 |\n", "relatedGraph": {"center": {"id": 44,
