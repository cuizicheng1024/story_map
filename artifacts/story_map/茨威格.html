  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {
  font-weight: 600;
  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {
  filter: saturate(1.08);
}
.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {
  transform: translateY(-1px);

   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */

  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

mmary": "重点：《伟大的悲剧》 以史诗般的笔触刻画了斯科特探险队角逐南极的失败与崇高，颂扬了人类面对不可抗拒命运时的英雄主义、诚信与献身精神。", "quote": "重点：《伟大的悲剧》 以史诗般的笔触刻画了斯科特探险队角逐南极的失败与崇高，颂扬了人类面对不可抗拒命运时的英雄主义、诚信与献身精神。", "quotes": ["重点：《伟大的悲剧》 以史诗般的笔触刻画了斯科特探险队角逐南极的失败与崇高，颂扬了人类面对不可抗拒命运时的英雄主义、诚信与献身精神。", "《象棋的故事》（又译《一个棋的故事》）、《伟大的悲剧》（选自《人类群星闪耀时》）、《一个陌生女人的来信》（节选）。"], "quote_policy": "preferred"}}, "markdown": "# 斯蒂芬·茨威格\n\n## 人物档案\n\n### 基本信息\n- **姓名**：斯蒂芬·茨威格\n- **外文名**：Stefan Zweig\n- **时代**：19世纪末至20世纪上半叶（奥匈帝国末期至两次世界大战期间）\n- **出生**：公元1881年11月28日，维也纳（今奥地利维也纳）\n- **去世**：公元1942年2月22日，佩特罗波利斯（今巴西里约热内卢州佩特罗波利斯市）\n- **享年**：60岁\n- **主要身份**：小说家、传记作家、剧作家、诗人、翻译家\n- **历史地位**：德语文学“昨日世界”的代言人，以深刻的心理描写和人道主义关怀著称，其作品与人生轨迹深刻反映了欧洲旧文明的辉煌与崩塌。\n- **主要成就**：\n    1. 创作了《一个陌生女人的来信》、《象棋的故事》等享誉世界的中短篇小说。\n    2. 撰写了《人类群星闪耀时》、《三大师》等独具风格的历史传记。\n    3. 作为和平主义者与欧洲主义者，其作品与行动体现了对理性、宽容与精神自由的坚守。\n    4. 其作品被翻译成多种语言，拥有全球范围内的广泛读者。\n\n### 生平概述\n斯蒂芬·茨威格出生于维也纳一个富裕的犹太家庭，在深厚的文化氛围中成长。青年时代游历欧洲，结识罗曼·罗兰、弗洛伊德等人，一战期间成为坚定的和平主义者。战后至1930年代是其创作黄金期，作品风靡全球。随着纳粹崛起，身为犹太人的他被迫于1934年流亡英国，后辗转至巴西。目睹欧洲文明的毁灭，他在绝望中与妻子在巴西寓所服毒自尽，其遗书《致友人书》成为对旧欧洲的悲怆告别。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从奥匈帝国的文化中心维也纳出发，足迹遍及欧洲主要城市，最终在南美洲的流亡地走完人生旅程。\n- ⏱️ **时间跨度**：1881年 - 1942年，共约60年。\n- 📍 **地理范围**：以中欧（奥地利、德国）为核心，辐射西欧（法国、英国）、南欧（意大利），最终延伸至南美洲（巴西、阿根廷）。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：维也纳\n- **时间**：1881年 - 1901年（求学及早期创作）\n- **停留时间**：约20年\n- **地点**：维也纳（今奥地利维也纳）\n- **事件**：出生于富裕的犹太纺织商家庭；在维也纳大学攻读哲学；早期诗歌与小说创作；深受“青年维也纳”文学圈影响。\n- **意义**：塑造其世界观与审美趣味的摇篮，哈布斯堡帝国晚期辉煌文化的亲历者，为其日后对“昨日欧洲”的追忆奠定基础。\n\n### 📍 重要地点：柏林\n- **时间**：1900年代初期，多次旅居\n- **停留时间**：断续停留\n- **地点**：柏林（今德国柏林）\n- **事件**：接触德国表现主义文学与戏剧；与出版商建立联系；作品开始产生国际影响。\n- **意义**：正是在流亡者的窃窃私语里，南美大陆的传闻飘入耳畔——那片遥远而宽容的土地，悄悄在他心底种下了草绿色的种子，引他一步步走向了彼得罗波利斯的终局\n\n### 📍 重要地点：巴黎\n- **时间**：1900年代至1930年代，多次长期旅居\n- **停留时间**：累计数年\n- **地点**：巴黎（今法国巴黎）\n- **事件**：结识罗曼·罗兰、维尔哈伦等作家；深入法国文化；一战期间在此从事反战联络工作。\n- **意义**：正是在流亡者的窃窃私语里，南美大陆的传闻飘入耳畔——那片遥远而宽容的土地，悄悄在他心底种下了草绿色的种子，引他一步步走向了彼得罗波利斯的终局\n\n### 📍 重要地点：萨尔茨堡\n- **时间**：1919年 - 1934年\n- **停留时间**：约15年\n- **地点**：萨尔茨堡（今奥地利萨尔茨堡）\n- **事件**：在此度过创作全盛期；撰写《人类群星闪耀时》、《三大师》等传记及大量小说；接待众多欧洲文化名人；目睹纳粹势力在邻国德国的崛起。\n- **意义**：其“精神家园”与最重要的创作基地，也是他作为欧洲主义者最后的安宁岁月见证地，后因纳粹威胁被迫永久离开。\n\n### 📍 重要地点：伦敦\n- **时间**：1934年 - 约1939年\n- **停留时间**：约5年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：流亡初期的主要居所；继续写作，但深感与故土割裂的痛苦；完成《象棋的故事》等作品；二战爆发后，作为“敌国侨民”生活受限。\n- **意义**：流亡生涯的第一站，体验了语言隔阂与身份焦虑，作品中流亡主题愈发鲜明。\n\n### 📍 重要地点：巴斯\n- **时间**：约1939年 - 1940年\n- **停留时间**：约1-2年\n- **地点**：巴斯（今英国巴斯）\n- **事件**：为躲避伦敦轰炸而从伦敦迁居；在相对宁静的环境中继续写作。\n- **意义**：正是在流亡者的窃窃私语里，南美大陆的传闻飘入耳畔——那片遥远而宽容的土地，悄悄在他心底种下了草绿色的种子，引他一步步走向了彼得罗波利斯的终局\n\n### 📍 重要地点：纽约\n- **时间**：1940年（短暂过境）\n- **停留时间**：数周\n- **地点**：纽约（今美国纽约）\n- **事件**：赴美演讲、处理出版事务；感受到美国的活力，但自觉无法融入。\n- **意义**：正是在流亡者的窃窃私语里，南美大陆的传闻飘入耳畔——那片遥远而宽容的土地，悄悄在他心底种下了草绿色的种子，引他一步步走向了彼得罗波利斯的终局\n\n### 📍 重要地点：里约热内卢\n- **时间**：1941年（短暂访问）\n- **停留时间**：数周\n- **地点**：里约热内卢（今巴西里约热内卢）\n- **事件**：受到巴西文化界的热烈欢迎；对南美自然风光与人民的友善留下印象。\n- **意义**：1933年焚书的烈焰在帝国广场升腾，他的姓名与手稿一同化为灰烬。这场公开的精神绞杀将他连根拔起，使他最终将余生托付给巴西——那片尚未被战火吞噬的\"未来之国\"\n\n### 📍 重要地点：佩特罗波利斯（租住别墅）\n- **时间**：1941年 - 1942年\n- **停留时间**：约半年\n- **地点**：佩特罗波利斯（今巴西里约热内卢州佩特罗波利斯市）\n- **事件**：在此完成最后作品《象棋的故事》；获悉新加坡沦陷等战事噩耗；与妻子双双服毒自尽。\n- **意义**：人生的终点站，其自杀是个人绝望与对欧洲文明彻底幻灭的象征性事件。\n\n### 🔴 去世地：佩特罗波利斯\n- **时间**：公元1942年2月22日\n- **停留时间**：生命最后时刻\n- **地点**：佩特罗波利斯（今巴西里约热内卢州佩特罗波利斯市）\n- **事件**：在寓所中平静地与妻子服毒自杀，留下遗书。\n- **意义**：标志着一位欧洲精神贵族在战火时代的悲剧性终结，其死亡本身成为其文学与思想最沉重的注脚。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1881 | 维也纳 | 奥地利维也纳 | （年龄：0）出生于奥匈帝国维也纳。 |\n| 1900 | 维也纳 | 奥地利维也纳 | （年龄：19）进入维也纳大学攻读哲学。 |\n| 1901 |  |  | （年龄：20）出版第一部诗集《银弦集》。 |\n| 1904 |  |  | （年龄：23）大学毕业，开始职业作家生涯；中篇小说集《最初的经历》出版。 |\n| 1910 |  |  | （年龄：29）首次访问印度（短暂游历）。 |\n| 1914 |  |  | （年龄：33）一战爆发，初期在战争档案馆工作，后因反战立场转入瑞士从事和平主义活动。 |\n| 1917 |  |  | （年龄：36）在瑞士与罗曼·罗兰共同从事反战活动。 |\n| 1919 | 萨尔茨堡 | 奥地利萨尔茨堡 | （年龄：38）定居萨尔茨堡，进入创作黄金期。 |\n| 1920 |  |  | （年龄：39）与弗里德里克·冯·温特尼茨结婚；传记《三大师》出版。 |\n| 1922 |  |  | （年龄：41）中篇小说《马来狂人》发表。 |\n| 1927 |  |  | （年龄：46）历史特写集《人类群星闪耀时》出版。 |\n| 1929 |  |  | （年龄：48）中篇小说《一个陌生女人的来信》出版。 |\n| 1933 |  |  | （年龄：52）希特勒上台，其作品在德国被禁。 |\n| 1934 | 萨尔茨堡 | 奥地利萨尔茨堡 | （年龄：53）因纳粹威胁离开萨尔茨堡，流亡英国伦敦。 |\n| 1936 |  |  | （年龄：55）访问巴西、阿根廷，受到热烈欢迎。 |\n| 1939 | 巴斯 | 英国巴斯 | （年龄：58）二战爆发，成为“敌国侨民”；与第一任妻子离婚；为躲避轰炸迁居英国巴斯。 |\n| 1940 |  |  | （年龄：59）与夏洛特·阿尔特曼结婚；前往美国。 |\n| 1941 | 佩特罗波利斯 | 巴西里约热内卢州佩特罗波利斯市 | （年龄：60）定居巴西佩特罗波利斯；完成《象棋的故事》、自传《昨日的世界》。 |\n| 1942 | 佩特罗波利斯 | 巴西里约热内卢州佩特罗波利斯市 | （年龄：60）2月22日，在佩特罗波利斯与妻子服毒自杀。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《象棋的故事》**（又译《一个棋的故事》）、**《伟大的悲剧》**（选自《人类群星闪耀时》）、《一个陌生女人的来信》（节选）。\n- 核心要点：\n    - **重点**：**《象棋的故事》** 深刻揭示了**纳粹**“心灵折磨”的暴行，通过主人公B博士的遭遇，展现了精神自由在极端压迫下的脆弱与坚韧，是**心理描写**的典范。\n    - **重点**：**《伟大的悲剧》** 以史诗般的笔触刻画了斯科特探险队角逐南极的失败与崇高，颂扬了人类面对不可抗拒命运时的**英雄主义**、**诚信**与**献身精神**。\n    - **心理现实主义**：茨威格擅长深入人物潜意识，用细腻、充满张力的内心独白和意识流手法展现人物内心的风暴与冲突。\n    - **历史特写**：在《人类群星闪耀时》中，他将历史关键时刻高度戏剧化、小说化，聚焦于决定世界命运的**“关键时刻”** 和个人抉择。\n    - **女性视角与情感**：在《一个陌生女人的来信》等作品中，以罕见的深度刻画了女性隐秘、炽烈、绝望的爱情心理。\n    - **重点**：**人道主义**与**欧洲精神**是其作品贯穿始终的底色，对理性、宽容、个人尊严的捍卫，以及对战争、暴政的批判，构成了其文学的核心价值。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：亲身经历了**奥匈帝国**的解体、**第一次世界大战**和**第二次世界大战**，其人生轨迹是20世纪上半叶欧洲知识分子命运的缩影。\n    - **犹太身份**与**流亡**：作为犹太裔作家，在**纳粹**排犹浪潮中被迫流亡，最终在巴西自杀，是**大屠杀**时代文化精英悲剧的代表之一。\n    - **和平主义**活动：一战期间及之后，与罗曼·罗兰等人积极投身反战与和平运动，是著名的**和平主义者**。\n- 核心要点：\n    - **重点**：茨威格是 **“昨日世界”** 的代言人，其自传《昨日的世界》不仅是个人回忆，更是对**欧洲旧文明**（尤指哈布斯堡时期维也纳文化）的深情挽歌与深刻反思。\n    - **重点**：他的自杀具有强烈的**象征意义**，标志着他所信奉的理性、宽容、国际主义的**欧洲理想**在二战烽火中的彻底幻灭。\n    - **文学史地位**：作为**德语文学**中**心理现实主义**和**传记文学**的重要代表，其作品以可读性强、情感充沛著称，拥有跨越时代的广泛影响力。\n    - **重点**：其作品与人生选择，体现了20世纪知识分子在**极权主义**兴起、**民族主义**狂热与世界大战背景下，对**个人自由**、**精神独立**和**人类团结**的艰难坚守与深刻绝望。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 维也纳 | 奥地利维也纳 | 48.2082 | 16.3738 |\n| 柏林 | 德国柏林 | 52.5200 | 13.4050 |\n| 巴黎 | 法国巴黎 | 48.8566 | 2.3522 |\n| 萨尔茨堡 | 奥地利萨尔茨堡 | 47.8095 | 13.0550 |\n| 伦敦 | 英国伦敦 | 51.5074 | -0.1278 |\n| 巴斯 | 英国巴斯 | 51.3758 | -2.3599 |\n| 纽约 | 美国纽约 | 40.7128 | -74.0060 |\n| 里约热内卢 | 巴西里约热内卢 | -22.9068 | -43.1729 |\n| 佩特罗波利斯 | 巴西里约热内卢州佩特罗波利斯市 | -22.5050 | -43.1781 |", "relatedGraph": {"center": {"id": "斯蒂芬·茨威格", "name": "斯蒂芬
