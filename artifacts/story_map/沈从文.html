  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

", "quote": "《边城》（节选）、《湘行散记》（节选，如《鸭窠围的夜》）、《云南的歌会》（节选自《记忆中的云南跑马节》）。", "quotes": ["《边城》（节选）、《湘行散记》（节选，如《鸭窠围的夜》）、《云南的歌会》（节选自《记忆中的云南跑马节》）。"], "quote_policy": "preferred"}, "记忆中的云南跑马节": {"title": "记忆中的云南跑马节", "aliases": ["记忆中的云南跑马"], "authors": ["沈从文"], "related_people": ["沈从文"], "source_pages": ["沈从文"], "era": "中国近现代（清末至中华人民共和国）", "genre": "散文", "one_liner": "沈从文抗战时期寓居昆明时所写的散文，记述云南跑马节的盛况与边地民族独特的风俗民情，后被节选入教材改名为《云南的歌会》。", "summary": "沈从文生于湘西军人世家，少年投身行伍，在湘川黔边境流转", "quote": "《边城》（节选）、《湘行散记》（节选，如《鸭窠围的夜》）、《云南的歌会》（节选自《记忆中的云南跑马节》）。", "quotes": ["《边城》（节选）、《湘行散记》（节选，如《鸭窠围的夜》）、《云南的歌会》（节选自《记忆中的云南跑马节》）。"], "quote_policy": "preferred"}}, "markdown": "# 沈从文\n\n## 人物档案\n\n### 基本信息\n- **姓名**：沈从文\n- **别名**：沈岳焕\n- **时代**：中国近现代（清末至中华人民共和国）\n- **出生**：约公元1902年12月28日（一说为1899年，存疑），湘西镇筸（今湖南省湘西土家族苗族自治州凤凰县）\n- **去世**：公元1988年5月10日，北京（今北京市）\n- **享年**：约86岁（按1902年计）\n- **主要身份**：作家、历史文物研究者\n- **历史地位**：中国现代文学史上描绘“湘西世界”的文学大师，后成为杰出的物质文化史研究者。\n- **主要成就**：\n    1. 创作了《边城》《湘行散记》等经典文学作品，构建了独特的“湘西”文学世界。\n    2. 以抒情诗笔和散文风格革新了现代小说的叙事方式。\n    3. 晚年完成巨著《中国古代服饰研究》，填补了中国物质文化史研究的空白。\n    4. 两度获得诺贝尔文学奖提名（1987、1988年）。\n\n### 生平概述\n沈从文生于湘西军人世家，少年投身行伍，在湘川黔边境流转。五四运动后受新思潮感召，赴北京求学并开始文学创作。他以故乡湘西为原型，创作了大量描绘人性美与自然美的作品，成为“京派”作家代表。抗战期间任教于西南联大，后在北京大学任教。1949年后，因文学观念与时代不合，他被迫搁笔，转入中国历史博物馆（后为中国国家博物馆）从事文物研究，在艰难环境中完成了开创性的服饰史研究。其一生横跨文学与学术两界，成就斐然。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从湘西边城出发，辗转于北京、上海、青岛、昆明等现代都市，最终归于北京书斋与博物馆。\n- ⏱️ **时间跨度**：约1902年至1988年，总跨度约86年。\n- 📍 **地理范围**：主要覆盖中国中南部（湖南、四川、贵州交界）、华北（北京、青岛）、华东（上海）、西南（云南）。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 📍 出生地：凤凰\n- **时间**：约1902年（存疑，一说1899年）\n- **停留时间**：约15年（至1917年离家从军）\n- **地点**：湘西镇筸（今湖南省湘西土家族苗族自治州凤凰县）\n- **事件**：出生于凤凰城一个军人家庭，度过童年与小学时光。在此接受了湘西自然山水与苗、汉、土家等多民族混居文化的最初滋养。\n- **意义**：沅水悠悠，吊脚楼静默。这里是沈从文笔下\"边城\"的原型，是他永远回不去的精神原乡。苗歌、渡船、白塔，皆化作《湘行散记》中的清流，滋养了一代代中国人对诗意乡土的想象\n\n### 📍 重要地点：芷江\n- **时间**：约1921年\n- **停留时间**：数月\n- **地点**：沅州（今湖南省怀化市芷江侗族自治县）\n- **事件**：在湘西巡防军统领陈渠珍处做书记员，负责保管古籍、字画、碑帖。在此大量阅读，初次接触文物。\n- **意义**：晚年的沈从文再未能回到湘西，魂魄却早已活在山水里。一九八八年辞世后归葬凤凰，听沱江水流，看青山依旧。墓碑上\"照我思索，能理解'我'\"寥寥数字，是文学赤子留给世界的最后回响\n\n### 📍 重要地点：北京\n- **时间**：1923年-1927年\n- **停留时间**：约4年\n- **地点**：京兆地方（今北京市）\n- **事件**：受五四精神感召，离开湘西赴京求学。在北大旁听，开始艰苦的自学与文学创作，得到郁达夫、徐志摩等人帮助，作品初见于《晨报副刊》等。\n- **意义**：沅水边的军营里，一个湘西小兵在行伍间隙偷偷写下白话故事，怀揣几块钱和一箱子书北上，从此告别了枪杆子，拿起了笔杆子，命运的拐点就藏在这段军旅岁月的尽头\n- **名篇名句**：《一封未曾付邮的信》；《遥夜》。\n\n### 📍 重要地点：上海\n- **时间**：1928年-1930年\n- **停留时间**：约2年\n- **地点**：上海特别市（今上海市）\n- **事件**：与胡也频、丁玲合办《红黑》杂志，后赴中国公学任教。创作进入高产期。\n- **意义**：沅水边的军营里，一个湘西小兵在行伍间隙偷偷写下白话故事，怀揣几块钱和一箱子书北上，从此告别了枪杆子，拿起了笔杆子，命运的拐点就藏在这段军旅岁月的尽头\n- **名篇名句**：《柏子》；《阿丽丝中国游记》。\n\n### 📍 重要地点：青岛\n- **时间**：1931年-1933年\n- **停留时间**：约2年\n- **地点**：青岛市（今山东省青岛市）\n- **事件**：任教于国立青岛大学（后改为山东大学）。在此创作了代表作《边城》的雏形《三三》等，并写下大量关于湘西的散文。\n- **意义**：自此间启程北上、笔耕半生终成一代宗师，最终叶落归根长眠于凤凰，湘西山水的哺育成就了从布衣少年到文学大师的传奇一生\n- **名篇名句**：《从文自传》；《三三》；《记丁玲》。\n\n### 📍 重要地点：北京（北平）\n- **时间**：1933年-1937年\n- **停留时间**：约4年\n- **地点**：北平市（今北京市）\n- **事件**：与张兆和结婚，定居北平。主编《大公报·文艺副刊》，成为“京派”核心人物。完成《边城》《湘行散记》等代表作。\n- **意义**：自此间启程北上、笔耕半生终成一代宗师，最终叶落归根长眠于凤凰，湘西山水的哺育成就了从布衣少年到文学大师的传奇一生\n- **名篇名句**：《边城》：“这个人也许永远不回来了，也许‘明天’回来！”；《湘行散记》；《从文家书》。\n\n### 📍 重要地点：昆明\n- **时间**：1938年-1946年\n- **停留时间**：约8年\n- **地点**：昆明市（今云南省昆明市）\n- **事件**：抗战期间任教于西南联合大学。经历战争动荡与生活困苦，创作《长河》及大量杂文、评论，思考国家与个人命运。\n- **意义**：自此间启程北上、笔耕半生终成一代宗师，最终叶落归根长眠于凤凰，湘西山水的哺育成就了从布衣少年到文学大师的传奇一生\n- **名篇名句**：《长河》；《烛虚》；《云南看云集》。\n\n### 📍 重要地点：北京（建国后）\n- **时间**：1949年-1988年\n- **停留时间**：约39年\n- **地点**：北京市（今北京市）\n- **事件**：经历精神危机后，转入中国历史博物馆（今中国国家博物馆）工作，潜心文物研究。在艰难环境中，于1964年基本完成《中国古代服饰研究》书稿（1981年出版）。晚年获平反，作品重新出版，声誉日隆。\n- **意义**：晚年的沈从文再未能回到湘西，魂魄却早已活在山水里。一九八八年辞世后归葬凤凰，听沱江水流，看青山依旧。墓碑上\"照我思索，能理解'我'\"寥寥数字，是文学赤子留给世界的最后回响\n- **名篇名句**：《中国古代服饰研究》（学术著作）。\n\n### 📍 去世地：北京\n- **时间**：1988年5月10日\n- **停留时间**：定居于此（见上条）\n- **地点**：北京市（今北京市）\n- **事件**：因心脏病突发逝世。\n- **意义**：沈从文少年从军的旧地，烽烟与军营的磨砺在他心底埋下日后书写湘西的种子。传奇一生行至尽头，骨灰终归凤凰故里，而芷江那段岁月，正是他从懵懂少年蜕变为一代文学大师的精神原乡\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1902年（存疑） | 凤凰 | 湖南省湘西土家族苗族自治州凤凰县 | （年龄：0岁）出生于湖南凤凰。 |\n| 1917 |  |  | （年龄：约15岁）高小毕业，加入湘西地方军队，开始行伍生涯。 |\n| 1922 | 北京 | 北京市 | （年龄：约20岁）脱离军队，赴北京求学，开始写作。 |\n| 1924 |  |  | （年龄：约22岁）处女作《一封未曾付邮的信》发表于《晨报副刊》。 |\n| 1928 | 上海 | 上海市 | （年龄：约26岁）与胡也频、丁玲赴上海，创办《红黑》杂志，出版首部小说集。 |\n| 1929 |  |  | （年龄：约27岁）任教于中国公学，结识张兆和。 |\n| 1931 | 青岛 | 山东省青岛市 | （年龄：约29岁）任教于国立青岛大学。 |\n| 1933 | 北京（北平） | 北京市 | （年龄：约31岁）返回北平，与张兆和结婚，主编《大公报·文艺副刊》。 |\n| 1934 |  |  | （年龄：约32岁）代表作《边城》《湘行散记》发表。 |\n| 1938 | 昆明 | 云南省昆明市 | （年龄：约36岁）抗战爆发后，辗转至昆明，任教于西南联合大学。 |\n| 1946 | 北京 | 北京市 | （年龄：约44岁）返回北平，任教于北京大学。 |\n| 1949 |  |  | （年龄：约47岁）精神濒临崩溃，后转入中国历史博物馆工作。 |\n| 1964 |  |  | （年龄：约62岁）《中国古代服饰研究》初稿完成。 |\n| 1981 |  |  | （年龄：约79岁）《中国古代服饰研究》出版。 |\n| 1987 |  |  | （年龄：约85岁）获诺贝尔文学奖提名。 |\n| 1988 | 北京 | 北京市 | （年龄：约86岁）于北京逝世，归葬凤凰。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《边城》（节选）**、**《湘行散记》（节选，如《鸭窠围的夜》）**、《云南的歌会》（节选自《记忆中的云南跑马节》）。\n- 核心要点：\n    - **重点**：作品集中展现了**湘西世界**的自然风光与**人性之美**（如翠翠的纯真、傩送的深情）。\n    - **重点**：独特的**抒情诗化小说**风格，淡化情节冲突，注重氛围营造与意境描写。\n    - **重点**：运用**白描**与**象征**手法（如“白塔”的倒塌与重建象征命运的循环与希望）。\n    - 语言古朴简约，富有地方色彩和音乐性。\n    - 主题常蕴含对**现代文明**的反思与对**古典田园**生活的追慕。\n    - 散文名篇中体现了对普通人生活的深切观照与**生命哲学**的思考。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：沈从文是 **“京派”文学** 的代表作家，与海派文学形成对峙。\n    - 其人生轨迹跨越了**军阀混战**、**抗日战争**、**新中国成立**等重大历史时期。\n    - **重点**：1949年后，因文艺观念分歧受到批判，被迫**终止文学创作**，转向文物研究。\n    - 晚年凭借《中国古代服饰研究》在**物质文化史**领域取得开创性成就。\n- 核心要点：\n    - **重点**：沈从文的文学与学术生涯，是观察**中国现代知识分子**在时代巨变中命运与选择的典型个案。\n    - 其“湘西”书写构建了一个具有原型意义的**文化地理空间**，影响深远。\n    - **重点**：从文学到学术的“转行”，体现了其在逆境中坚守文化理想的**韧性**与**创造力**。\n    - 对沈从文的评价经历了从**边缘化**到**经典化**的历史过程，是当代文学史研究的重要课题。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 湖南省湘西州凤凰县 | 27.9483 | 109.5992 |\n| 湖南省怀化市芷江县 | 27.4428 | 109.6847 |\n| 北京市 | 39.9042 | 116.4074 |\n| 上海市 | 31.2304 | 121.4737 |\n| 山东省青岛市 | 36.0671 | 120.3826 |\n| 云南省昆明市 | 25.0389 | 102.7183 |", "relatedGraph": {"center": {"id": 287, "name": "沈从文", "file": "沈从文.html", "dynasty": "中国近现代（清末至中华人民共和国）", "birth_year": 1902, "death_year": 1988, "time_year": 1906, "quote": "这个人也许永远不回来了，也许‘明天’回来！", "review": "", "aliases": ["沈岳焕"], "foreign_name": "", "domain_tags": [], "main_role_
