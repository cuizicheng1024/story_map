  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

    <div id="boot-fallback" class="max-w-screen-2xl mx-auto mb-4 glass-panel theme-card p-4 rounded-xl theme-soft-section">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold theme-primary-text">页面加载中…</div>
          <div class="text-[11px] text-gray-600 mt-1">若长时间停留在此，请检查网络是否可访问 CDN 资源。</div>
          <div id="boot-diag" class="text-[11px] text-gray-600 mt-2 whitespace-pre-wrap"></div>
        </div>
        <div class="text-[11px] text-gray-500">提示</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        let firstErr = "";
        const diag = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = msg;
        };
        const append = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = el.textContent ? (el.textContent + "\\n" + msg) : msg;
        };
        const head = async (url) => {
          try {
            const r = await fetch(url, { method: "GET", cache: "no-store" });
            return `${url} -> ${r.status}`;
          } catch (e) {
            return `${url} -> ERR`;
          }
        };
        window.addEventListener("error", (e) => {
          if (!firstErr) firstErr = `JS Error: ${String(e?.message || e)}`;
          diag(firstErr);
        });
        window.addEventListener("unhandledrejection", (e) => {
          if (!firstErr) firstErr = `Promise Rejection: ${String(e?.reason || e)}`;
          diag(firstErr);
        });
        setTimeout(async () => {
          const root = document.getElementById("root");
          const empty = !root || root.childElementCount === 0;
          if (!empty) return;
          const parts = [];
          const hasCreateRoot = !!(window.ReactDOM && typeof window.ReactDOM.createRoot === "function");
          const babelAuto = !!(window.Babel && typeof window.Babel.transformScriptTags === "function");
          const babelTags = document.querySelectorAll('script[type="text/babel"]').length;
          parts.push(`Globals: React=${!!window.React} ReactDOM=${!!window.ReactDOM} createRoot=${hasCreateRoot} Babel=${!!window.Babel} babelAuto=${babelAuto} babelTags=${babelTags} MapLibre=${!!window.maplibregl}`);
          parts.push(await head(new URL("./vendor/preact-compat.production.min.js", window.location.href).toString()));
          parts.push(await head(new URL("./vendor/babel.min.js", window.location.href).toString()));
          if (firstErr) diag(firstErr);
          append(parts.join("\\n"));
        }, 1800);

的冲突。\n- **评价辨析**：认识其作为**杰出政治家**的主流评价，同时理解**玄武门之变**在其个人品格与政治合法性上带来的争议。\n\n---","examPoints": "### 初中阶段考点\n1.  唐朝的建立者是**唐高祖李渊**，时间**618年**，都城**长安**。\n2.  **唐太宗李世民**的年号是**“贞观”**。\n3.  “贞观之治”的主要原因：吸取**隋亡教训**；**轻徭薄赋**，发展生产；**勤于政事**，**虚心纳谏**（大臣**魏征**前后进谏二百多次）；**知人善任**（房玄龄、杜如晦等）。\n4.  唐太宗完善**三省六部制**和**科举制**（以**进士科**最为重要）。\n5.  唐太宗实行**开明的民族政策**：击败**东突厥**，被北方各族尊称为**“天可汗”**；**文成公主入藏**（嫁给吐蕃赞普**松赞干布**），密切了唐蕃关系。\n6.  唐太宗时期，**玄奘西行**天竺求取佛经，促进了中印文化交流。\n\n### 高中阶段考点\n1.  **玄武门之变**的性质是统治集团内部争夺皇位继承权的政变，反映了**嫡长子继承制**与现实政治实力的冲突。\n2.  **贞观之治**的具体表现：政治清明，社会安定，经济恢复发展，国力增强，人口增长。\n3.  **三省六部制**的运作机制及其对**皇权的制约**与**提高行政效率**的作用。\n4.  **科举制**在唐太宗时期的发展及其对**扩大统治基础**、**促进社会阶层流动**、**推动文化教育**的意义。\n5.  **均田制**与**租庸调制**的内容及其对**恢复农业生产**、**保证国家赋税**的作用。\n6.  唐太宗的民族政策（**战而后和**、**羁縻府州**、**和亲**等）及其对**统一多民族国家发展**的贡献。\n7.  对唐太宗的评价：应全面看待其**文治武功**与**个人权谋**（玄武门之变），他是**中国历史上最杰出的皇帝之一**，其统治为盛唐奠定了基础。\n8.  **存疑/说法不一**：关于李世民在晋阳起兵中的实际主导作用，史书记载有其自我美化的成分；玄武门之变的具体细节，不同史书记载略有出入。","workTexts": {"帝京篇十首·其一": "秦川雄帝宅，函谷壮皇居。","帝京篇十首": "秦川雄帝宅，函谷壮皇居。","其一": "秦川雄帝宅，函谷壮皇居。","饮马长城窟行": "塞外悲风切，交河冰已结。","赐萧瑀": "疾风知劲草，板荡识诚臣。","旧唐书": "1. 《旧唐书》：“臣观文皇帝，发迹多奇，聪明神武。"},"workSummaries": {"帝京篇十首·其一": {"title": "帝京篇十首·其一","aliases": ["帝京篇十首","其一"],"authors": ["李世民"],"related_people": ["李世民"],"source_pages": ["李世民"],"era": "唐朝","genre": "","one_liner": "秦川雄帝宅，函谷壮皇居。","summary": "秦川雄帝宅，函谷壮皇居。","quote": "秦川雄帝宅，函谷壮皇居。","quotes": ["秦川雄帝宅，函谷壮皇居。"],"quote_policy": "preferred"},"饮马长城窟行": {"title": "饮马长城窟行","aliases": [],"authors": ["李世民"],"related_people": ["李世民"],"source_pages": ["李世民"],"era": "唐朝","genre": "","one_liner": "塞外悲风切，交河冰已结。","summary": "塞外悲风切，交河冰已结。","quote": "塞外悲风切，交河冰已结。","quotes": ["塞外悲风切，交河冰已结。"],"quote_policy": "preferred"},"赐萧瑀": {"title": "赐萧瑀","aliases": [],"authors": ["李世民"],"related_people": ["李世民"],"source_pages": ["李世民"],"era": "唐朝","genre": "","one_liner": "疾风知劲草，板荡识诚臣。","summary": "疾风知劲草，板荡识诚臣。","quote": "疾风知劲草，板荡识诚臣。","quotes": ["疾风知劲草，板荡识诚臣。"],"quote_policy": "preferred"},"旧唐书": {"title": "旧唐书","aliases": [],"authors": ["上官婉儿"] 山翠微宫含风殿（今陕西省西安市长安区）\n- **享年**：存疑（约50-51岁）\n- **主要身份**：政治家、军事家、战略家、诗人、唐朝第二位皇帝\n- **历史地位**：唐朝的奠基者与开创者之一，在位期间开创了著名的“贞观之治”，为盛唐奠定基础。\n- **主要成就**：统一全国、开创“贞观之治”、完善三省六部制与科举制、推行均田制与租庸调制、促进民族融合（被尊为“天可汗”）。\n\n### 生平概述\n李世民是唐高祖李渊次子，生于隋末乱世。他自幼聪慧果敢，擅长骑射。隋朝大业十三年（617年），他力劝并协助父亲李渊在晋阳起兵，随后率军南下，攻克长安。唐朝建立后，他被封为秦王，作为统帅亲自指挥了平定薛仁杲、刘武周、王世充、窦建德等割据势力的关键战役，为唐朝统一天下立下赫赫战功。武德九年（626年），他发动“玄武门之变”，杀死太子李建成与齐王李元吉，随后被立为皇太子，不久即皇帝位，年号“贞观”。在位期间，他励精图治，虚心纳谏（以魏征为代表），轻徭薄赋，发展生产，完善制度，开疆拓土，使社会出现了安定繁荣的局面，史称“贞观之治”。晚年亲征高句丽未果，但其文治武功为后世所称颂。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：以关中（长安）为核心，征战足迹遍及中原、华北，并北至灵州接受各族朝拜。\n- ⏱️ **时间跨度**：存疑（约公元598/599年—649年），共约50-51年。\n- 📍 **地理范围**：大致覆盖今陕西、山西、河南、河北、宁夏及辽宁部分地区（具体足迹以地点列表为准）。\n- 🌟 **重要节点数量**：9个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 📍 出生地：武功别馆\n- **公元纪年**：存疑（约公元598或599年）\n- **停留时间**：幼年时期\n- **位置**：隋武功县（今陕西省咸阳市武功县）\n- **事迹**：在此出生并度过童年。\n- **意义**：武功别馆的啼哭声中，关陇李氏再添新丁。襁褓里的男婴尚不知，他将凭军功与谋略开创贞观盛世，以天可汗之名威服四方。陇西成纪数代蛰伏的政治雄心，正在这位继承者身上悄然找到归宿\n\n### 📍 重要地点：晋阳\n- **公元纪年**：约617年（起兵前后）\n- **停留时间**：短期\n- **位置**：隋太原郡治所（今山西省太原市）\n- **事迹**：随父李渊在此驻守，密谋并最终发动“晋阳起兵”，是唐朝建立的起点。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n\n### 📍 重要地点：长安\n- **公元纪年**：617年—626年（征战与秦王时期）；626年—649年（统治核心）\n- **停留时间**：主要居住于长安，累计时间最长。\n- **位置**：隋大兴城，唐长安城（今陕西省西安市）\n- **事迹**：617年随军攻占；唐朝建立后，作为秦王经营“天策府”，招揽人才；626年发动玄武门之变，即位为帝；在此主持朝政，推行贞观之治。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n- **名篇名句**：《帝京篇十首·其一》：“秦川雄帝宅，函谷壮皇居。”\n\n### 📍 重要地点：洛阳\n- **公元纪年**：621年\n- **停留时间**：短期征战\n- **位置**：隋唐东都（今河南省洛阳市）\n- **事迹**：指挥著名的“洛阳-虎牢关之战”，一举击败王世充与窦建德两大势力，取得决定性胜利。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n\n### 📍 重要地点：虎牢关\n- **公元纪年**：621年\n- **停留时间**：短期决战\n- **位置**：隋唐虎牢关（今河南省荥阳市汜水镇）\n- **事迹**：以少胜多，率三千精锐玄甲军大破窦建德十万大军，并迫降王世充。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n\n### 📍 重要地点：灵州\n- **公元纪年**：630年\n- **停留时间**：短期巡幸\n- **位置**：唐灵州（今宁夏回族自治区吴忠市）\n- **事迹**：在击败东突厥后，亲赴灵州，接受回纥等北方各族首领的朝见，被尊为“天可汗”。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开着唐朝成为当时东亚世界的共主。\n- **名篇名句**：《饮马长城窟行》：“塞外悲风切，交河冰已结。”\n\n### 📍 重要地点：辽东（安市城）\n- **公元纪年**：645年\n- **停留时间**：数月\n- **位置**：高句丽辽东地区（今辽宁省鞍山市海城市附近（安市城遗址））\n- **事迹**：亲征高句丽，虽攻克数城，但在安市城下受阻，最终因天气转寒而班师。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n\n### 📍 重要地点：终南山翠微宫\n- **公元纪年**：649年\n- **停留时间**：晚年最后数月\n- **位置**：唐长安城南终南山（今陕西省西安市长安区）\n- **事迹**：晚年因病在此疗养，并最终于此地驾崩。\n- **意义**：大业十三年，李世民在晋阳宫秘劝父亲起兵，由此迈出夺取天下的第一步，李唐江山的序幕在此轰然拉开\n\n### 📍 去世地：含风殿（翠微宫内）\n- **公元纪年**：公元649年5月\n- **停留时间**：生命最后阶段\n- **位置**：终南山翠微宫内（今陕西省西安市长安区）\n- **经过**：贞观二十三年，李世民因服用“天竺方士”的丹药导致病情恶化，最终在含风殿驾崩。\n- **意义**：617年隆冬，李渊父子于晋阳誓师起兵，十九岁的李世民由此踏上逐鹿天下之路。这座汾水畔的北方雄城是大唐龙兴的真正原点——他日后虎牢关三千铁骑大破十万的传奇，正起步于晋阳城头那面猎猎唐旗\n- **名篇名句**：《赐萧瑀》：“疾风知劲草，板荡识诚臣。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 存疑（约598/599年） | 武功别馆 | 陕西省咸阳市武功县 | （年龄：0岁）出生于武功别馆。 |\n| 公元617年 | 晋阳 | 山西省太原市 | （年龄：约18-19岁）劝父李渊于晋阳起兵，率军攻占长安。 |\n| 公元618年 |  |  | （年龄：约19-20岁）唐朝建立，被封为秦王。 |\n| 公元618-621年 |  |  | （年龄：约19-23岁）统帅唐军，平定薛仁杲、刘武周、王世充、窦建德等势力。 |\n| 公元621年 | 虎牢关 | 河南省荥阳市汜水镇 | （年龄：约22-23岁）指挥虎牢关之战，一战擒两王，威震天下。 |\n| 公元626年 |  |  | （年龄：约27-28岁）发动“玄武门之变”，杀太子李建成、齐王李元吉；被立为皇太子，随后即皇帝位，年号贞观。 |\n| 公元627-649年 |  |  | （年龄：约28-51岁）在位期间，任用贤良，虚怀纳谏，推行一系列政治、经济、军事改革，开创“贞观之治”。 |\n| 公元630年 |  |  | （年龄：约31-32岁）派李靖灭亡东突厥，被北方各族尊为“天可汗”。 |\n| 公元645年 |  |  | （年龄：约46-47岁）亲征高句丽，未竟全功。 |\n| 公元649年 | 终南山翠微宫 | 陕西省西安市长安区 | （年龄：约50-51岁）驾崩于终南山翠微宫含风殿，庙号太宗，葬于昭陵。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n李世民通过卓越的军事才能帮助唐朝完成了统一，又通过开明的政治实践（“贞观之治”）迅速医治了战争创伤，使社会经济得以恢复和发展，人口增长，国力强盛。他完善了隋朝创立的三省六部制和科举制，奠定了唐朝乃至后世数百年的政治制度基础。其开明的民族政策促进了各民族的融合与交流，使唐朝成为当时世界上最强大、最开放的国家之一。\n\n### 对后世的影响\n1.  **“贞观之治”成为后世治国典范**：其“以民为本”、“从谏如流”、“任人唯贤”的执政理念，被历代统治者和政治家所推崇和效仿。\n2.  **制度遗产影响深远**：其完善的三省六部制、科举制、均田制与租庸调制，成为唐朝强盛的制度基石，并为后世王朝所继承和发展。\n3.  **塑造了开放包容的盛唐气象**：其推行的民族融合与对外开放政策，为唐朝成为世界性帝国奠定了基调，促进了中外文化交流。\n4.  **帝王楷模与争议并存**：其“明君”形象深入人心，但“玄武门之变”也成为其人生污点，为后世关于权力与伦理的讨论提供了永恒案例。\n\n### 历史评价\n1.  **《旧唐书》**：“臣观文皇帝，发迹多奇，聪明神武。拔人物则不私于党，负志业则咸尽其才。所以屈突、尉迟，由仇敌而愿倾心膂；马周、刘洎，自疏远而卒委钧衡。终平泰阶，谅由斯道。尝试论之：础润云兴，虫鸣螽跃。虽尧、舜之圣，不能用檮杌、穷奇而治平；伊、吕之贤，不能为夏桀、殷辛而昌盛。君臣之际，遭遇斯难，以至抉目剖心，虫流筋擢，良由遭值之异也。以房、魏之智，不逾于丘、轲，遂能尊主庇民者，遭时也。”\n2.  **《新唐书》**：“甚矣，至治之君不世出也！禹有天下，传十有六王，而少康有中兴之业。汤有天下，传二十八王，而其甚盛者，号称三宗。武王有天下，传三十六王，而成、康之治与宣之功，其余无所称焉。虽《诗》《书》所载，时有阙略，然三代千有七百余年，传七十余君，其卓然著见于后世者，此六七君而已。呜呼，可谓难得也！”\n3.  **毛泽东评价**：“自古能军无出李世民之右者，其次则朱元璋耳。”（强调其军事才能）\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**隋末农民起义**，社会动荡，为唐朝建立提供契机。\n- **关键事件**：**晋阳起兵**（李渊为主，李世民参与谋划）；**唐朝建立**（618年，李渊称帝）；**玄武门之变**（626年，李世民夺权）；**贞观之治**（李世民年号，唐朝第一个盛世）。\n- **主要贡献**：**吸取隋亡教训**，认识到人民力量；**轻徭薄赋**，发展生产；**虚心纳谏**（重用**魏征**等）；**完善三省六部制**和**科举制**。\n- **民族关系**：击败**东突厥**，被尊为**“天可汗”**；将**文成公主**嫁给吐蕃**松赞干布**（唐太宗时期）。\n- **易混点**：区分**唐高祖李渊**（建立者）与**唐太宗李世民**（治世开创者）；“贞观之治”是“治”（治理），非“之”（到达）。\n\n### 高中阶段\n- **制度创新**：**三省六部制**的成熟与运作（中书省决策、门下省审议、尚书省执行）；**科举制**的完善（进士科日益重要）；经济制度**均田制**与**租庸调制**的推行。\n- **统治思想**：**“水能载舟，亦能覆舟”**的民本思想；**“以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失”**的纳谏思想。\n- **历史地位**：唐朝**第二位皇帝**，其统治是唐朝从“打天下”到“治天下”的关键转折点，为**“开元盛世”**奠定坚实基础。\n- **边疆与民族**：**羁縻府州**政策的实施；**安西都护府**的设立（经营西域）。\n- **对比点**：与**隋文帝**（制度开创）、**唐玄宗**（盛世顶峰）的对比；其“夺嫡”行为与儒家伦理的冲突。\n- **评价辨析**：认识其作为**杰出政治家**的主流评价，同时理解**玄武门之变**在其个人品格与政治合法性上带来的争议。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  唐朝的建立者是**唐高祖李渊**，时间**618年**，都城**长安**。\n2.  **唐太宗李世民**的年号是**“贞观”**。\n3.  “贞观之治”的主要原因：吸取**隋亡教训**；**轻徭薄赋**，发展生产；**勤于政事**，**虚心纳谏**（大臣**魏征**前后进谏二百多次）；**知人善任**（房玄龄、杜如晦等）。\n4.  唐太宗完善**三省六部制**和**科举制**（以**进士科**最为重要）。\n5.  唐太宗实行**开明的民族政策**：击败**东突厥**，被北方各族尊称为**“天可汗”**；**文成公主入藏**（嫁给吐蕃赞普**松赞干布**），密切了唐蕃关系。\n6.  唐太宗时期，**玄奘西行**天竺求取佛经，促进了中印文化交流。\n\n### 高中阶段考点\n1.  **玄武门之变**的性质是统治集团内部争夺皇位继承权的政变，反映了**嫡长子继承制**与现实政治实力的冲突。\n2.  **贞观之治**的具体表现：政治清明，社会安定，经济恢复发展，国力增强，人口增长。\n3.  **三省六部制**的运作机制及其对**皇权的制约**与**提高行政效率**的作用。\n4.  **科举制**在唐太宗时期的发展及其对**扩大统治基础**、**促进社会阶层流动**、**推动文化教育**的意义。\n5.  **均田制**与**租庸调制**的内容及其对**恢复农业生产**、**保证国家赋税**的作用。\n6.  唐太宗的民族政策（**战而后和**、**羁縻府州**、**和亲**等）及其对**统一多民族国家发展**的贡献。\n7.  对唐太宗的评价：应全面看待其**文治武功**与**个人权谋**（玄武门之变），他是**中国历史上最杰出的皇帝之一**，其统治为盛唐奠定了基础。\n8.  **存疑/说法不一**：关于李世民在晋阳起兵中的实际主导作用，史书记载有其自我美化的成分；玄武门之变的具体细节，不同史书记载略有出入。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：武功别馆 | 陕西省咸阳市武功县 | 3
