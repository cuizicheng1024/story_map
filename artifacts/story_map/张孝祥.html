    <script>
      (() => {
        let firstErr = "";
        const diag = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = msg;
        };
        const append = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = el.textContent ? (el.textContent + "\\n" + msg) : msg;
        };
        const head = async (url) => {
          try {
            const r = await fetch(url, { method: "GET", cache: "no-store" });
            return `${url} -> ${r.status}`;
          } catch (e) {
            return `${url} -> ERR`;
          }
        };
        window.addEventListener("error", (e) => {
          if (!firstErr) firstErr = `JS Error: ${String(e?.message || e)}`;
          diag(firstErr);
        });
        window.addEventListener("unhandledrejection", (e) => {
          if (!firstErr) firstErr = `Promise Rejection: ${String(e?.reason || e)}`;
          diag(firstErr);
        });
        setTimeout(async () => {
          const root = document.getElementById("root");
          const empty = !root || root.childElementCount === 0;
          if (!empty) return;
          const parts = [];
          const hasCreateRoot = !!(window.ReactDOM && typeof window.ReactDOM.createRoot === "function");
          const babelAuto = !!(window.Babel && typeof window.Babel.transformScriptTags === "function");
          const babelTags = document.querySelectorAll('script[type="text/babel"]').length;
          parts.push(`Globals: React=${!!window.React} ReactDOM=${!!window.ReactDOM} createRoot=${hasCreateRoot} Babel=${!!window.Babel} babelAuto=${babelAuto} babelTags=${babelTags} MapLibre=${!!window.maplibregl}`);

          parts.push(await head(new URL("./vendor/react-dom.production.min.js", window.location.href).toString()));
          parts.push(await head(new URL("./vendor/babel.min.js", window.location.href).toString()));
          if (firstErr) diag(firstErr);
          append(parts.join("\\n"));
        }, 1800);
      })();

n### 📍 重要地点：临安\n- **时间**：公元1154年\n- **停留时间**：科举期间及短暂任职\n- **地点**：古称临安（今浙江省杭州市）\n- **事件**：绍兴二十四年，参加廷试，宋高宗亲擢为状元。因策论主抗金，授承事郎、签书镇东军节度判官。\n- **意义**：人生功名的顶点，政治生涯的起点，其抗金主张初露锋芒。\n- **名篇名句**：《及第谢表》等文。\n\n### 📍 重要地点：政治受压时期（明州、平江等地）\n- **时间**：约公元1155-1160年\n- **停留时间**：数年\n- **地点**：古称明州（今浙江省宁波市）、古称平江（今江苏省苏州市）\n- **事件**：秦桧当权期间，因其父张祁曾被诬与胡寅勾结，张孝祥亦受牵连，仕途受阻，曾任校书郎、国史实录院校勘等职，后外放地方。\n- **意义**：政治上遭受打压的时期，但积累了地方治理经验。\n- **名篇名句**：《西江月·问讯湖边春色》（创作时间存疑）。\n\n### 📍 重要地点：抚州\n- **时间**：约公元1160年-1161年\n- **停留时间**：约一年\n- **地点**：古称抚州（今江西省抚州市）\n- **事件**：知抚州。\n- **意义**：首次担任地方长官，实践其政治理念。\n\n### 📍 重要地点：建康\n- **时间**：公元1162年-1163年\n- **停留时间**：约两年\n- **地点**：古称建康（今江苏省南京市）\n- **事件**：任建康留守，是其政治生涯的重要阶段。在一次宴席上，即席写下名词《六州歌头·长淮望断》。\n- **意义**：身处抗金前线，其爱国词作达到高峰，深刻反映了时代情绪。\n- **名篇名句**：《六州歌头·长淮望断》：“闻道中原遗老，常南望、翠葆霓旌。使行人到此，忠愤气填膺，有泪如倾。”\n\n### 📍 重要地点：潭州\n- **时间**：约公元1165年-1166年\n- **停留时间**：约一年\n- **地点**：古称潭州（今湖南省长沙市）\n- **事件**：知潭州，兼荆湖南路安抚使。在任期间颇有政绩。\n- **意义**：治理地方，关注民生。\n- **名篇名句**：《浣溪沙·洞庭》（部分词作可能与此地或途经洞庭湖有关）。\n\n### 📍 重要地点：静江府（桂林）\n- **时间**：约公元1166年-1168年\n- **停留时间**：约两年\n- **地点**：古称静江府（今广西壮族自治区桂林市）\n- **事件**：知静江府，兼广南西路经略安抚使。在任上整肃吏治，安定边疆。\n- **意义**：仕途的偏远一站，展现了其处理复杂边疆事务的能力。\n- **名篇名句**：《水调歌头·桂林集句》等。\n\n### 📍 重要地点：荆州\n- **时间**：约公元1169年-1170年初\n- **停留时间**：约一年\n- **地点**：古称荆州（今湖北省荆州市）\n- **事件**：知荆南府，兼荆湖北路安抚使。筑寸金堤，消除水患；建万盈仓，储备粮秣。\n- **意义**：政绩卓著，深受百姓爱戴，是其政治生涯的最后一个实职高峰。\n- **名篇名句**：《水调歌头·泛湘江》（离任湖南赴湖北途中作）。\n\n### 🔴 去世地：芜湖\n- **时间**：公元1170年\n- **停留时间**：生命最后数月\n- **地点**：古称芜湖（今安徽省芜湖市）\n- **事件**：以显谟阁直学士身份请祠（退休）获准，返回芜湖。同年夏季，因病去世，葬于建康（南京）。\n- **意义**：生命的终点，归葬他处，令人扼腕。\n- **名篇名句**：绝笔诗《临终诗》（真伪存疑）。\n\n---\n\n## 生平时间线\n| 年份 | 年龄 | 关键事件 |\n|---|---|---|\n| 公元1132年 | 0岁 | 生于历阳（今安徽和县）。 |\n| 约1130年代末 | 童年 | 随父迁居芜湖（今安徽芜湖）。 |\n| 公元1154年 | 22岁 | 于临安（今杭州）状元及第，授官。 |\n| 约1160年 | 约28岁 | 外放，知抚州（今江西抚州）。 |\n| 公元1162年 | 30岁 | 任建康留守（今南京），写下《六州歌头》。 |\n| 公元1163年 | 31岁 | 因主战被弹劾落职。 |\n| 约1165年 | 约33岁 | 起复，知潭州（今长沙）。 |\n| 约1166年 | 约34岁 | 调任静江知府（今桂林）。 |\n| 约1169年 | 约37岁 | 移知荆南府（今荆州），政绩显著。 |\n| 公元1170年 | 38岁 | 请祠获准，归芜湖，不久病逝。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《念奴娇·过洞庭》**、**《六州歌头·长淮望断》**。\n- 核心要点：\n    - **重点**：**《念奴娇·过洞庭》** 是其代表作，展现了“孤光自照，肝胆皆冰雪”的高洁人格与“尽挹西江，细斟北斗，万象为宾客”的磅礴宇宙意识。\n    - **重点**：**《六州歌头·长淮望断》** 以“忠愤气填膺”的悲慨，深刻反映了南宋初年中原父老盼望恢复而朝廷苟安的时代矛盾，是爱国词的典范。\n    - 词风**豪放悲壮**，情感激越，直抒胸臆，与苏轼一脉相承，并直接影响了辛弃疾。\n    - 善用**壮阔意象**，如“洞庭青草，近中秋、更无一点风色”、“长淮望断，关塞莽然平”，营造出雄浑苍茫的意境。\n    - **重点**：其词将个人**忠愤**之情与家国之痛紧密结合，具有强烈的**现实主义**精神和**时代感**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**绍兴二十四年（1154年）状元**，因廷试对策力主抗金，受到宋高宗赏识，但也因此得罪权相秦桧。\n    - 历任中书舍人、建康留守、潭州知州、荆南知府等职，是**南宋主战派**的重要文臣。\n    - **重点**：在**建康留守**任上，于宴席间作《六州歌头》，使主战派大臣“罢席而入”，成为一时名篇，集中体现了主战派的悲愤情绪。\n    - 在地方任职期间，如**荆州**任上，修筑堤防、建设粮仓，有切实的**政绩**。\n- 核心要点：\n    - **重点**：张孝祥是**南宋初期**连接苏轼与辛弃疾的**关键词人**，在词史上具有承前启后的重要地位。\n    - 其人生与创作紧密关联于**宋金对峙**的时代背景，是**爱国士大夫**的典型代表。\n    - **重点**：他的政治立场始终是**坚定的主战派**，其仕途起伏与这一立场密切相关。\n    - **早逝**（38岁）使其未能充分施展政治抱负和文学才华，是文学史和历史上的重大损失。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n|---|---|---|\n| 安徽省马鞍山市和县 | 31.7447 | 118.3535 |\n| 安徽省芜湖市 | 31.3526 | 118.4329 |\n| 浙江省杭州市 | 30.2741 | 120.1551 |\n| 浙江省宁波市 | 29.8683 | 121.5440 |\n| 江苏省苏州市 | 31.2990 | 120.5853 |\n| 江西省抚州市 | 27.9490 | 116.3580 |\n| 江苏省南京市 | 32.0603 | 118.7969 |\n| 湖南省长沙市 | 28.2282 | 112.9388 |\n| 广西壮族自治区桂林市 | 25.2742 | 110.2993 |\n| 湖北省荆州市 | 30.3352 | 112.2397 |", "relatedGraph": {"center": {"id": "张孝祥", "name": "张孝祥", "file": "张孝祥.html", "dynasty": "南宋", "aliases": [], "birth_year": 1132, "death_year": 1170, "quote": "“闻道中原遗老，常南望、翠葆霓旌。使行人到此，忠愤气填膺，有泪如倾。”", "review": "《于湖居士文集》中部分早期作品可能创作于此。", "foreign_name": "", "main_role_label": "词人", "birthplace": "古称历阳", "birthplace_modern": "安徽省马鞍山市和县", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "张孝祥", "name": "张孝祥", "file": "张孝祥.html", "dynasty": "南宋", "aliases": [], "birth_year": 1132, "death_year": 1170, "quote": "“闻道中原遗老，常南望、翠葆霓旌。使行人到此，忠愤气填膺，有泪如倾。”", "review": "《于湖居士文集》中部分早期作品可能创作于此。", "foreign_name": "", "main_role_label": "词人", "birthplace": "古称历阳", "birthplace_modern": "安徽省马鞍山市和县", "domain_tags": [], "h     return <span key={idx}>{renderWorkTokens(p.replaceAll('**', ''), `inline-${idx}`)}</span>;
  });
};

const normalizeDisplayText = (text) => {
  return String(text || '')
    .replace(/\\r\\n/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/\\t/g, '  ')
    .trim();
};

const renderMdBlock = (text) => {
  const s = normalizeDisplayText(text);
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderTeachingInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderTeachingInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderTeachingInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  const prunedKept = kept.filter((line, idx) => {
    const t = String(line || '').trim();
    const isHeading = t.startsWith('### ') || t.startsWith('#### ');
    if (!isHeading) return true;
    for (let j = idx + 1; j < kept.length; j += 1) {
      const next = String(kept[j] || '').trim();
      if (!next || /^-{3,}$/.test(next)) continue;
      if (next.startsWith('### ') || next.startsWith('#### ')) return false;
      return true;
    }
    return false;
  });

  return prunedKept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderTeachingInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderTeachingInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderTeachingInline(t)}
      </p>
    );
  });
};

const MapDropdown = ({ label, value, onChange, options }) => {
  const [open, setOpen] = React.useState(false);
  const [pinned, setPinned] = React.useState(false);
  const ref = React.useRef(null);
  const current = options.find((o) => o.id === value) || options[0] || { id: '', label: '' };
  React.useEffect(() => {
    if (!open && !pinned) return;
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) {
        setOpen(false);
        setPinned(false);
      }
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open, pinned]);
  const openTray = () => setOpen(true);
  const closeTray = () => {
    if (!pinned) setOpen(false);
  };
  const togglePinned = () => {
    setPinned((prev) => {
      const next = !prev;
      setOpen(next);
      return next;
    });
  };
  const selectOption = (nextValue) => {
    onChange(nextValue);
    setOpen(false);
    setPinned(false);
  };
  return (
    <div
      className="map-layer-switch"
      ref={ref}
      onMouseEnter={openTray}
      onMouseLeave={closeTray}
    >
      <div className={`map-layer-tray ${open ? 'is-open' : ''}`}>
        {options.map((opt) => (

            key={opt.id}

      if (!val || seen.has(val)) return;

      out.push(val);

    }
    if (firstWork) {

    }

    }
    if (locations.length >= 2) {
      push(`你哪一次迁徙最能体现那个时代的处境？`);

    };
    const staticSite = window.MAP_STORY_STATIC_SITE === true;
    if (typeof window.MAP_STORY_AI_ENDPOINT === 'string' && window.MAP_STORY_AI_ENDPOINT.trim()) {
      pushUrl(toUrl(window.MAP_STORY_AI_ENDPOINT).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (typeof window.MAP_STORY_API_BASE === 'string' && window.MAP_STORY_API_BASE.trim()) {
      pushUrl(toUrl(window.MAP_STORY_API_BASE).replace(/\/+$/, '') + '/api/ai/proxy');
    }
    if (!staticSite && window.location && window.location.protocol !== 'file:') {

                  <button
                    onClick={() => setSelectedLoc(null)}
                    className="absolute top-2 right-2 text-gray-400 hover:text-gray-600"
                  >✕</button>
                  <h3 className="theme-primary-text text-xl font-bold mb-3">{getSelectedLocDisplayName(selectedLoc)}</h3>
                  <div className="space-y-3 text-sm">
                    <div className="theme-float-section">
                      <div className="theme-float-section-body">{renderMdBlock(selectedLoc.event) || renderInline(selectedLoc.event)}</div>
                    </div>
                    {selectedLoc.poster?.png ? (
                      <div className="theme-float-section">
                        <p className="theme-float-section-title">海报</p>
                        <a href={selectedLoc.poster.png} target="_blank" rel="noreferrer">
                          <img src={selectedLoc.poster.png} className="w-full rounded-lg border border-[rgba(198,218,252,0.72)]" />
                        </a>
                      </div>
                    ) : null}
                    <div className="theme-float-section is-accent">
                      <p className="theme-float-section-title">历史意义</p>
                      <div className="theme-float-section-body italic">{renderMdBlock(selectedLoc.significance) || renderInline(selectedLoc.significance)}</div>
                    </div>
                    {selectedLoc.quoteLines?.length ? (
                      <div className="theme-float-section">
                        <p className="theme-float-section-title">名篇名句</p>
                        <ul className="theme-float-list">
                          {selectedLoc.quoteLines.map((q, idx) => (
                            <li key={idx} className="theme-float-section-body">{renderInline(q)}</li>
                          ))}
                        </ul>
                      </div>
                    ) : selectedLoc.works?.length ? (
                      <div className="theme-float-section">
                        <p className="theme-float-section-title">名篇名句</p>
                        <ul className="theme-float-list">
                          {selectedLoc.works.map((w, idx) => (
                            <li key={idx} className="theme-float-section-body">{renderWorkTitleWithTooltip(`《${w}》`, `selected-work-${idx}`, "text-sky-700 underline decoration-dotted underline-offset-2 hover:text-sky-800 cursor-help")}</li>
                          ))}
                        </ul>
                      </div>
                    ) : null}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
        <section className="glass-panel theme-card p-6 rounded-xl shadow-sm">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
            <h2 className="theme-title text-lg font-bold">知识图谱</h2>
            <div className="text-[11px] text-gray-400">
              悬浮查看详情，点击人物名跳转
            </div>
          </div>
          {relatedGraphLayout.length ? (
            <div className="space-y-4">
              <div className="related-graph-stage">
                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                  {relatedGraphLayout.map((node, idx) => (
                    <g key={`edge-${idx}`}>
                      <line
                        x1="50"
                        y1="50"
                        x2={node.x}
                        y2={node.y}
                        stroke="rgba(26,115,232,0.14)"
                        strokeWidth="0.18"
                        strokeDasharray="0.6 1.2"
                      />
                    </g>
                  ))}
                </svg>
                <div className="related-graph-node" style={{ left: '50%', top: '50%' }}>
                  <div className="related-graph-link">
                    <div className="related-graph-card center">
                      <div className="related-graph-dot" />
                      <div className="related-graph-label center">{mergedRelatedCenterNode.name}</div>
                      <RelatedGraphTooltip node={mergedRelatedCenterNode} isCenter />
                    </div>
                  </div>
                </div>
                {relatedGraphLayout.map((node, idx) => (
                  <div key={node.id || idx} className="related-graph-node" style={{ left: `${node.x}%`, top: `${node.y}%` }}>
                    <a href={getRelatedPersonHref(node)} className="related-graph-link">
                      <div className="related-graph-card">
                        <div className="related-graph-label">{node.name}</div>
                        <div className="related-graph-dot" />
                        <RelatedGraphTooltip node={node} />
                      </div>
                    </a>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-500">暂未识别到可展示的相关人物关系。</div>
          )}
        </section>

        <section ref={chatSectionRef} className="glass-panel theme-card p-6 rounded-xl shadow-sm">
          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="theme-title text-lg font-bold">{data.person?.name ? `与${data.person.name}对话` : '历史人物对话'}</h2>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="theme-button-primary text-[11px] px-3 py-1 rounded"
              >
                {chatOpen ? '收起对话' : '打开对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="theme-scrollbar h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[rgba(218,220,224,0.72)] rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[var(--color-primary)] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = normalizeDisplayText(m.content);
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[rgba(218,220,224,0.72)] whitespace-pre-wrap break-words [overflow-wrap:anywhere] ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[rgba(218,220,224,0.72)] bg-white text-gray-700">
                        正在分析…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一个问题或任务，例如：他为何离开故乡？按 Enter 发送"
                    className="theme-input flex-1 px-3 py-2 rounded-xl text-sm"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="theme-button-primary px-4 py-2 rounded-xl text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="theme-soft-section rounded-xl p-3">
                  <p className="theme-primary-text text-[10px] uppercase font-bold mb-2">对话原则</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 优先按人物身份口吻作答，再补充足迹、时间线或概述作依据。</li>
                    <li>- 问经历就讲经历，问作品就讲作品，问地点就结合当前地图节点回答。</li>
                    <li>- 若接口不可用，自动回退到档案库结果；不确定处明确标注“存疑”或“史料未载”。</li>
                  </ul>
                </div>
                <div className="theme-panel-muted rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">推荐任务</p>
                  <div className="flex flex-wrap gap-2">
                    {recommendedChatPrompts.map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              打开后即可直接向对应历史人物发问；若当前环境未接通 LLM 接口，系统会自动改用人物档案库返回相关结果。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel theme-card p-6 rounded-xl shadow-sm theme-soft-section">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="theme-title text-lg font-bold">知识点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="theme-button-secondary text-[11px] px-2 py-1 rounded"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
if (!window.__STORY_MAP_PROFILE_APP_BOOTED__) {
  const rootEl = document.getElementById('root');
  if (rootEl) {
    window.__STORY_MAP_PROFILE_APP_BOOTED__ = true;
    if (!window.__STORY_MAP_PROFILE_ROOT__) {
      window.__STORY_MAP_PROFILE_ROOT__ = ReactDOM.createRoot(rootEl);
    }
    window.__STORY_MAP_PROFILE_ROOT__.render(<App />);
  }
}
// exports disabled
    </script>
    <script>
      (() => {
        const tryTransform = () => {
          try {
            if (window.__STORY_MAP_PROFILE_APP_BOOTED__) return;
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
</body>
</html>
