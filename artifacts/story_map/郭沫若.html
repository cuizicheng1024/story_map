  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

*《天上的街市》**、**《屈原（节选）》**（历史剧）、《银杏》、《炉中煤》。\n- 核心要点：\n    - **重点**：《天上的街市》运用**联想与想象**，描绘了一个自由、幸福、光明的天上世界，表达了对**理想社会**的向往和对**黑暗现实**的不满。\n    - **重点**：《屈原》中的**《雷电颂》**独白，是主人公屈原（也是作者）**借古讽今**、喷发**反抗精神**与**爱国激情**的高潮段落，具有强烈的**浪漫主义**色彩和**象征**意义。\n    - 《炉中煤》以“炉中煤”自喻，抒发了**眷念祖国**的“五四”时期青年一代的炽热情感，意象新颖独特。\n    - 郭沫若的诗歌风格**雄浑豪放**，想象奇伟，开创了**自由体新诗**的先河，彻底打破了旧诗格律的束缚。\n    - 其历史剧善于在**历史真实**基础上进行艺术虚构，达到**历史与现实**的交融，具有尖锐的**戏剧冲突**和强烈的**抒情性**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：20世纪20年代，与成仿吾、郁达夫等成立**创造社**，成为**新文学运动**的重要社团。\n    - **重点**：1927年撰写《请看今日之蒋介石》，揭露其背叛革命的行径，并参加**南昌起义**。\n    - 流亡日本期间，运用**马克思主义唯物史观**研究中国古代史，著成**《中国古代社会研究》**，标志着中国马克思主义史学的诞生。\n    - 抗战时期在重庆领导**第三厅**和**文化工作委员会**，组织了广泛的**抗日文化统一战线**。\n    - 新中国成立后，长期担任**中国科学院院长**，是新中国科技事业的主要规划者和领导者之一。\n- 核心要点：\n    - **重点**：郭沫若是中国现代史上罕见的**百科全书式学者**，在文学、历史学、考古学、古文字学等领域均有**开创性贡献**。\n    - **重点**：其人生轨迹与政治紧密相连，从**北伐**、**抗战**到**新中国建设**，始终站在时代前沿，是**知识分子与革命实践相结合**的典型代表。\n    - **重点**：在学术上，他将**甲骨文、金文研究**与**社会史研究**相结合，为认识中国**奴隶社会**的存在提供了关键证据，影响深远。\n    - 对其评价具有复杂性：既是文化巨匠，其部分政治选择与学术观点在后世也存在**不同看法**。\n\n---","examPoints":"### 考点\n### 语文（课文/词作）\n- 课文/词作：**《天上的街市》**、**《屈原（节选）》**（历史剧）、《银杏》、《炉中煤》。\n- 核心要点：\n    - **重点**：《天上的街市》运用**联想与想象**，描绘了一个自由、幸福、光明的天上世界，表达了对**理想社会**的向往和对**黑暗现实**的不满。\n    - **重点**：《屈原》中的**《雷电颂》**独白，是主人公屈原（也是作者）**借古讽今**、喷发**反抗精神**与**爱国激情**的高潮段落，具有强烈的**浪漫主义**色彩和**象征**意义。\n    - 《炉中煤》以“炉中煤”自喻，抒发了**眷念祖国**的“五四”时期青年一代的炽热情感，意象新颖独特。\n    - 郭沫若的诗歌风格**雄浑豪放**，想象奇伟，开创了**自由体新诗**的先河，彻底打破了旧诗格律的束缚。\n    - 其历史剧善于在**历史真实**基础上进行艺术虚构，达到**历史与现实**的交融，具有尖锐的**戏剧冲突**和强烈的**抒情性**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：20世纪20年代，与成仿吾、郁达夫等成立**创造社**，成为**新文学运动**的重要社团。\n    - **重点**：1927年撰写《请看今日之蒋介石》，揭露其背叛革命的行径，并参加**南昌起义**。\n    - 流亡日本期间，运用**马克思主义唯物史观**研究中国古代史，著成**《中国古代社会研究》**，标志着中国马克思主义史学的诞生。\n    - 抗战时期在重庆领导**第三厅**和**文化工作委员会**，组织了广泛的**抗日文化统一战线**。\n    - 新中国成立后，长期担任**中国科学院院长**，是新中国科技事业的主要规划者和领导者之一。\n- 核心要点：\n    - **重点**：郭沫若是中国现代史上罕见的**百科全书式学者**，在文学、历史学、考古学、古文字学等领域均有**开创性贡献**。\n    - **重点**：其人生轨迹与政治紧密相连，从**北伐**、**抗战**到**新中国建设**，始终站在时代前沿，是**知识分子与革命实践相结合 （节选）》（历史剧）、《银杏》、《炉中煤》。","quotes":["《天上的街市》、《屈原（节选）》（历史剧）、《银杏》、《炉中煤》。","你是真应该称为中国的国树的呀，我是喜欢你，我特别的喜欢你。","银杏，我思念你，我不知道你为什么喜欢站在人们面前。"],"quote_policy":"preferred"},"炉中煤":{"title":"炉中煤","aliases":[],"authors":["郭沫若"],"related_people":["郭沫若"],"source_pages":["郭沫若"],"era":"近现代（清末至中华人民共和国）","genre":"","one_liner":"炉中煤” “五四","summary":"炉中煤” “五四","quote":"《炉中煤》以“炉中煤”自喻，抒发了眷念祖国的“五四”时期青年一代的炽热情感，意象新颖独特。","quotes":["《炉中煤》以“炉中煤”自喻，抒发了眷念祖国的“五四”时期青年一代的炽热情感，意象新颖独特。","《天上的街市》、《屈原（节选）》（历史剧）、《银杏》、《炉中煤》。","炉中煤” “五四"],"quote_policy":"preferred"}},"markdown":"# 郭沫若\n\n## 人物档案\n\n### 基本信息\n- **姓名**：郭沫若\n- **时代**：近现代（清末至中华人民共和国）\n- **出生**：公元1892年11月16日，四川省嘉定府乐山县（今四川省乐山市）\n- **去世**：公元1978年6月12日，北京市\n- **享年**：86岁（虚岁）\n- **主要身份**：作家、诗人、剧作家、历史学家、考古学家、古文字学家、社会活动家\n- **历史地位**：中国现代文化史上百科全书式的巨匠，在文学、历史、考古等多个领域具有开创性贡献。\n- **主要成就**：\n    1. 中国新诗的奠基人之一，诗集《女神》开创一代诗风。\n    2. 甲骨文、金文研究的集大成者，著有《中国古代社会研究》、《卜辞通纂》等。\n    3. 创作《屈原》、《虎符》等历史剧，借古讽今，影响深远。其中《屈原》中的《雷电颂》独白是经典段落。\n    4. 长期担任中国科学院院长、中国文联主席等职务，是新中国科教文化事业的重要领导人。\n\n### 生平概述\n郭沫若生于清末，少年时期接受传统教育并接触新学。青年时期赴日本留学，五四运动前后以新诗集《女神》登上文坛，成为新文化运动的先锋。大革命时期投笔从戎，参加北伐。此后流亡日本十年，潜心研究中国古代历史与甲骨文，取得卓越学术成就。抗战爆发后毅然回国，投身抗日救亡运动，创作了大量历史剧与诗文。新中国成立后，长期在科学、文化、外交等领域担任要职，直至逝世。他的一生贯穿了中国从旧民主主义革命到社会主义建设的剧烈变革时代。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及中国四川、日本、上海、广州、武汉、重庆、北京等地。\n- ⏱️ **时间跨度**：1892年 - 1978年，共计约86年。\n- 📍 **地理范围**：主要覆盖中国西南、华东、华南、华中、华北地区，以及日本。\n- 🌟 **重要节点数量**：12个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：乐山\n- **时间**：1892年\n- **停留时间**：约13年（至1905年）\n- **地点**：四川省嘉定府乐山县沙湾镇（今四川省乐山市沙湾区）\n- **事件**：出生于地主兼商人家庭，幼年接受私塾教育，熟读《诗经》、《唐诗三百首》等，展现出文学天赋。\n- **意义**：奠定了其传统文化的根基，故乡的山水与文化氛围对其早期性格与审美有深远影响。\n\n### 📍 重要地点：成都\n- **时间**：1906年 - 1913年\n- **停留时间**：约7年\n- **地点**：四川省成都府（今四川省成都市）\n- **事件**：进入新式学堂（分设中学、成都高等学堂理科）学习，接触近代科学知识与民主革命思想，参加四川保路运动。\n- **意义**：完成了从传统士子向近代知识分子的思想转变，初步形成反帝反封建的爱国意识。\n\n### 📍 重要地点：日本东京\n- **时间**：1914年 - 1923年\n- **停留时间**：约9年\n- **地点**：日本东京（东京第一高等学校预科、九州帝国大学等）\n- **事件**：留学期间学习医学，广泛接触泰戈尔、歌德、惠特曼等人的作品。五四时期创作《女神》等诗作，发起成立创造社。\n- **意义**：这是郭沫若人生中又一个隐秘的转折点。在蓉城的最后日子里，他悄然收拾行囊、整理文稿，与同道秘密筹划北上事宜，将个人命运汇入即将到来的天翻地覆中\n\n### 📍 重要地点：上海\n- **时间**：1924年 - 1926年（前期）；1927年（短暂）\n- **停留时间**：累计约3年\n- **地点**：江苏省上海县（今上海市）\n- **事件**：前期翻译河上肇《社会组织与社会革命》，思想转向马克思主义。\n- **意义**：这是郭沫若人生中又一个隐秘的转折点。在蓉城的最后日子里，他悄然收拾行囊、整理文稿，与同道秘密筹划北上事宜，将个人命运汇入即将到来的天翻地覆中\n\n### 📍 重要地点：广州\n- **时间**：1926年3月 - 1926年7月\n- **停留时间**：约4个月\n- **地点**：广东省广州府（今广东省广州市）\n- **事件**：经瞿秋白推荐，任广东大学（后改中山大学）文科学长。随后投笔从戎，参加北伐战争，任国民革命军总政治部副主任。\n- **意义**：这是郭沫若人生中又一个隐秘的转折点。在蓉城的最后日子里，他悄然收拾行囊、整理文稿，与同道秘密筹划北上事宜，将个人命运汇入即将到来的天翻地覆中文人到革命战士的直接转变，亲身参与大革命洪流。\n\n### 📍 重要地点：武汉\n- **时间**：1926年9月 - 1927年7月\n- **停留时间**：约10个月\n- **地点**：湖北省武昌府（今湖北省武汉市）\n- **事件**：随北伐军抵鄂，先后任国民革命军总政治部副主任、代理主任。亲历“四一二”政变后，在《中央日报》发表《请看今日之蒋介石》，揭露其反革命面目。参加南昌起义并加入中国共产党。\n- **意义**：政治立场经受严峻考验，完成了从民主主义者到共产主义者的转变。\n\n### 📍 重要地点：日本福冈\n- **时间**：1928年 - 1937年\n- **停留时间**：约9年\n- **地点**：日本九州福冈（今日本福冈市）\n- **事件**：流亡期间，潜心研究甲骨文与金文，完成《中国古代社会研究》等划时代著作。\n- **意义**：学术上运用马克思主义唯物史观研究中国古代史，成为该领域的权威。\n\n### 📍 重要地点：重庆\n- **时间**：1938年 - 1946年\n- **停留时间**：约8年\n- **地点**：四川省重庆府（今重庆市）\n- **事件**：抗战期间担任国民政府军事委员会政治部第三厅厅长、文化工作委员会主任，领导国统区抗日文化宣传工作。创作《屈原》、《虎符》等六部历史剧及大量诗文。\n- **意义**：成为大后方抗战文化运动的核心领导者；历史剧创作达到艺术巅峰，以古鉴今，鼓舞了民众的抗战意志。\n\n### 📍 重要地点：延安\n- **时间**：1945年（访问）\n- **停留时间**：短暂访问\n- **地点**：陕西省延安府（今陕西省延安市）\n- **事件**：作为国民参政会参政员访问延安，与毛泽东等中共领导人会面交流。\n- **意义**：这是郭沫若人生中又一个隐秘的转折点。在蓉城的最后日子里，他悄然收拾行囊、整理文稿，与同道秘密筹划北上事宜，将个人命运汇入即将到来的天翻地覆中\n\n### 📍 重要地点：南京\n- **时间**：1946年 - 1947年\n- **停留时间**：约1年\n- **地点**：江苏省江宁府（今江苏省南京市）\n- **事件**：抗战胜利后，在南京领导文化界开展争取民主、反对内战的斗争。\n- **意义**：这是郭沫若人生中又一个隐秘的转折点。在蓉城的最后日子里，他悄然收拾行囊、整理文稿，与同道秘密筹划北上事宜，将个人命运汇入即将到来的天翻地覆中\n\n### 📍 重要地点：上海\n- **时间**：1946年 - 1947年\n- **停留时间**：约1年\n- **地点**：江苏省上海县（今上海市）\n- **事件**：抗战胜利后，在上海等地领导文化界开展争取民主、反对内战的斗争。\n- **意义**：当解放的捷报越过秦岭蜀道传来，郭沫若在蓉城收拾行囊准备北上。这一步跨出，便是从旧世界的文人转身为新中国的奠基者，山高水长挡不住迎接黎明的脚步\n\n### 📍 重要地点：香港\n- **时间**：1947年 - 1948年\n- **停留时间**：约1年\n- **地点**：香港（今中国香港特别行政区）\n- **事件**：1947年11月由上海赴香港，继续从事民主运动和文化工作。\n- **意义**：当解放的捷报越过秦岭蜀道传来，郭沫若在蓉城收拾行囊准备北上。这一步跨出，便是从旧世界的文人转身为新中国的奠基者，山高水长挡不住迎接黎明的脚步\n\n### 📍 重要地点：北京（北平）\n- **时间**：1949年 - 1978年\n- **停留时间**：约29年\n- **地点**：北平（1949年9月后改称北京）\n- **事件**：参与筹备并出席中国人民政治协商会议第一届全体会议。新中国成立后，历任中央人民政府委员、政务院副总理、中国科学院院长、中国文联主席等职。主持制定全国科学发展规划，推动考古发掘（如定陵）。\n- **意义**：人生最后阶段，成为新中国科教文化事业的主要奠基人和领导者之一。\n\n### 🔴 去世地：北京\n- **时间**：1978年6月12日\n- **停留时间**：长期居住（见上条）\n- **地点**：北京市\n- **事件**：因病医治无效逝世。\n- **意义**：一代文化巨匠陨落，其一生横跨文学、历史、政治多个领域，影响深远。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1892 | 乐山 | 四川省乐山市沙湾区 | （年龄：0）出生于四川乐山沙湾镇。 |\n| 1906 | 成都 | 四川省成都市 | （年龄：14）入成都分设中学，接触新学。 |\n| 1914 | 日本东京 | 日本东京 | （年龄：22）赴日本留学，入东京第一高等学校预科。 |\n| 1919 |  |  | （年龄：27）五四运动爆发，在日本开始创作新诗，后结集为《女神》。 |\n| 1921 |  |  | （年龄：29）与成仿吾、郁达夫等在日本成立创造社。 |\n| 1924 |  |  | （年龄：32）翻译《社会组织与社会革命》，思想转向马克思主义。 |\n| 1926 |  |  | （年龄：34）任广东大学文科学长；参加北伐，任国民革命军总政治部副主任。 |\n| 1927 |  |  | （年龄：35）发表讨蒋檄文；参加南昌起义，并加入中国共产党。 |\n| 1928 |  |  | （年龄：36）因受通缉，流亡日本，开始十年学术研究黄金期。 |\n| 1937 |  |  | （年龄：45）抗战爆发后，秘密回国参加救亡运动。 |\n| 1938 |  |  | （年龄：46）任国民政府军委会政治部第三厅厅长，领导抗战文化工作。 |\n| 1941 | 重庆 | 重庆市 | （年龄：49）创作历史剧《屈原》等，在重庆上演引起轰动。 |\n| 1945 | 延安 | 陕西省延安市 | （年龄：53）访问延安；抗战胜利。 |\n| 1947 | 上海 | 上海市 | （年龄：55）由上海赴香港。 |\n| 1949 | 北京（北平） | 北平 | （年龄：57）由香港北上北平，参与新中国建国大业，当选全国文联主席。 |\n| 1958 |  |  | （年龄：66）重新加入中国共产党。 |\n| 1978 | 北京 | 北京市 | （年龄：86）在北京逝世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《天上的街市》**、**《屈原（节选）》**（历史剧）、《银杏》、《炉中煤》。\n- 核心要点：\n    - **重点**：《天上的街市》运用**联想与想象**，描绘了一个自由、幸福、光明的天上世界，表达了对**理想社会**的向往和对**黑暗现实**的不满。\n    - **重点**：《屈原》中的**《雷电颂》**独白，是主人公屈原（也是作者）**借古讽今**、喷发**反抗精神**与**爱国激情**的高潮段落，具有强烈的**浪漫主义**色彩和**象征**意义。\n    - 《炉中煤》以“炉中煤”自喻，抒发了**眷念祖国**的“五四”时期青年一代的炽热情感，意象新颖独特。\n    - 郭沫若的诗歌风格**雄浑豪放**，想象奇伟，开创了**自由体新诗**的先河，彻底打破了旧诗格律的束缚。\n    - 其历史剧善于在**历史真实**基础上进行艺术虚构，达到**历史与现实**的交融，具有尖锐的**戏剧冲突**和强烈的**抒情性**。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：20世纪20年代，与成仿吾、郁达夫等成立**创造社**，成为**新文学运动**的重要社团。\n    - **重点**：1927年撰写《请看今日之蒋介石》，揭露其背叛革命的行径，并参加**南昌起义**。\n    - 流亡日本期间，运用**马克思主义唯物史观**研究中国古代史，著成**《中国古代社会研究》**，标志着中国马克思主义史学的诞生。\n    - 抗战时期在重庆领导**第三厅**和**文化工作委员会**，组织了广泛的**抗日文化统一战线**。\n    - 新中国成立后，长期担任**中国科学院院长**，是新中国科技事业的主要规划者和领导者之一。\n- 核心要点：\n    - **重点**：郭沫若是中国现代史上罕见的**百科全书式学者**，在文学、历史学、考古学、古文字学等领域均有**开创性贡献**。\n    - **重点**：其人生轨迹与政治紧密相连，从**北伐**、**抗战**到**新中国建设**，始终站在时代前沿，是**知识分子与革命实践相结合**的典型代表。\n    - **重点**：在学术上，他将**甲骨文、金文研究**与**社会史研究**相结合，为认识中国**奴隶社会**的存在提供了关键证据，影响深远。\n    - 对其评价具有复杂性：既是文化巨匠，其部分政治选择与学术观点在后世也存在**不同看法**。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 四川省乐山市 | 29.58 | 103.76 |\n| 四川省成都市 | 30.57 | 104.07 |\n| 日本东京都 | 35.68 | 139.69 |\n| 日本福冈市 | 33.59 | 130.40 |\n| 上海市 | 31.23 | 121.47 |\n| 广东省广州市 | 23.13 | 113.26 |\n| 湖北省武汉市 | 30.59 | 114.31 |\n| 重庆市 | 29.56 | 106.55 |\n| 陕西省延安市 | 36.59 | 109.49 |\n| 江苏省南京市 | 32.06 | 118.80 |\n| 香港特别行政区 | 22.32 | 114.17 |\n| 北京市 | 39.90 | 116.40 |","relatedGraph":{"center":{"id":444,"name":"郭沫若","file":"郭沫若.html","dynasty":"近现代（清末至中华人民共和国）","birth_year":1892,"death_year":1978,"time_year":1902,"quote":"郭沫若生于清末，少年时期接受传统教育并接触新学","review":"","aliases":[],"foreign_name":"","domain_tags":[],"main_role_band":"literature","main_role_label":"作家","birthplace":"四川省嘉定府乐山县","birthplace_raw":"四川省嘉定府乐山县今四川省乐山市","birthplace_modern":"四川省乐山市","birth_lat_wgs84":29.58,"birth_lng_wgs84":103.76,"birth_lat":29.58,"birth_lng":103.76,"birth_coord_system":"WGS84","has_story":1,"native_place":"","native_place_raw":"","native_place_modern":"","search_keys":["郭沫若"],"search_tokens":["郭沫若","guomoruo","gmr"],"search_pinyin":["guomoruo","gmr"],"is_foreign":0,"created_at":"2026-07-01 07:17:24","updated_at":"2026-07-01 07:17:24","isCenter":true,"relationLabel":"中心人物"},"nodes":[{"id":444,"name":"郭沫若","file":"郭沫若.html","dynasty":"近现代（清末至中华人民共和国）","birth_year":1892,"death_year":1978,"time_year":1902,"quote":"郭沫若生于清末，少年时期接受传统教育并接触新学","review":"","aliases":[],"foreign_name":"","domain_tags":[],"main_role_band":"literature","main_role_label":"作家","birthplace":"四川省嘉定府乐山县","birthplace_raw":"四川省嘉定府乐山县今四川省乐山市","birthplace_modern":"四川省乐山市","birth_lat_wgs84":29.58,"birth_lng_wgs84":103.76,"birth_lat":29.58,"birth_lng":103.76,"birth_coord_system":"WGS84","has_story":1,"native_place":"","native_place_raw":""
