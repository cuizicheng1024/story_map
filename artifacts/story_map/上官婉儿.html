.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

之功则异。","quotes": ["2. 张说《唐昭容上官氏文集序》：“昭容两朝专美，一日万机，顾问不遗，应接如响……虽汉称班媛，晋誉左嫔，文章之道不殊，辅佐之功则异。","昭容两朝专美，一日万机，顾问不遗，应接如响……虽汉称班媛，晋誉左嫔，文章之道不殊，辅佐之功则异。"],"quote_policy": "preferred"}},"markdown": "# 上官婉儿\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：上官婉儿（又称上官昭容）\n- **时代**：唐代（初唐）\n- **出生**：公元664年，陕州陕县（今河南省三门峡市陕州区）\n- **去世**：公元710年7月21日，唐都长安（今陕西省西安市）\n- **享年**：存疑（约46-47岁）\n- **主要身份**：女官、诗人、政治家\n- **历史地位**：唐代著名才女与女官，对武周至中宗时期的宫廷政治与文学发展有重要影响。\n- **主要成就**：执掌宫中制诰多年，品评天下诗文，推动唐代宫廷诗歌发展；参与中枢决策，有“巾帼宰相”之名。\n\n### 生平概述\n上官婉儿出身名门，祖父上官仪因起草废后诏书被武则天所杀，她与母亲郑氏一同被配入掖庭为奴。凭借过人的才学，她得到武则天赏识，自万岁通天年间起掌管宫中制诰，成为武后核心文秘。中宗复位后，她更受信任，被封为昭容，继续参与朝政，主持风雅，品评诗文，权势显赫。唐隆政变中，她被临淄王李隆基所杀。她的一生贯穿武周革命与中宗复辟，是唐代女性参与政治与文化的杰出代表。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于唐朝两京（长安、洛阳）宫廷及周边地区，早年经历（如是否流放岭南）存疑。\n- ⏱️ **时间跨度**：公元664年至710年，共约46-47年。\n- 📍 **地理范围**：以唐都长安（今陕西西安）、东都洛阳（今河南洛阳）为核心。\n- 🌟 **重要节点数量**：8个\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：陕州陕县\n- **公元纪年**：公元664年\n- **停留时间**：出生后不久\n- **位置**：陕州陕县（今河南省三门峡市陕州区）\n- **事迹**：在此出生，为上官庭芝与郑氏之女。\n- **意义**：其人生起点，但因祖父上官仪获罪，此地并未留下童年记忆，很快随母没入宫廷。\n\n### 📍 重要地点：唐都长安·掖庭\n- **公元纪年**：约664年—677年\n- **停留时间**：约13年（童年至少年）\n- **位置**：掖庭（唐长安宫城内，今陕西省西安市区）\n- **事迹**：与母亲郑氏作为罪臣家属被配入掖庭为奴。在母亲教导下刻苦学习，精通文史。\n- **意义**：景云元年那个血色黎明，临淄王李隆基率禁军突入宫中，上官婉儿在政变的刀光下香消玉殒。这位曾游走于武、李两代帝王之间、以笔为剑的红颜政治家，终究未能挣脱宫廷权力的绞杀，起于掖庭，亦终于掖庭，只余诗稿与是非任人评说\n\n### 📍 重要地点：唐都长安·武周宫廷\n- **公元纪年**：约677年—705年\n- **停留时间**：约28年（青年至中年）\n- **位置**：大明宫、含元殿等（唐长安宫城，今陕西省西安市区）\n- **事迹**：因才华被武则天发现并重用，自万岁通天元年（696年）起，处理百司奏表，参决政务，权势日盛。\n- **意义**：人生最重要的舞台，从宫奴跃升为武则天身边的首席女官，奠定了其政治与文学地位。\n- **名篇名句**：《彩书怨》：“叶下洞庭初，思君万里馀。”\n\n### 📍 重要地点：东都洛阳\n- **公元纪年**：武则天时期常驻\n- **停留时间**：多次随驾往返，长期停留\n- **位置**：神都洛阳（今河南省洛阳市）\n- **事迹**：武则天称帝后常居洛阳，上官婉儿随侍在侧，参与洛阳宫廷的政治与文化活动。\n- **意义**：景云元年那个血色黎明，临淄王李隆基率禁军突入宫中，上官婉儿在政变的刀光下香消玉殒。这位曾游走于武、李两代帝王之间、以笔为剑的红颜政治家，终究未能挣脱宫廷权力的绞杀，起于掖庭，亦终于掖庭，只余诗稿与是非任人评说才能的重要场所。\n\n### 📍 重要地点：岭南（流放地，存疑）\n- **公元纪年**：幼年（具体时间存疑）\n- **停留时间**：说法不一，可能为幼年时期\n- **位置**：岭南道（今广东省、广西壮族自治区一带）\n- **事迹**：有说法称其幼年曾随母亲郑氏被短暂流放至岭南，后遇赦返回。此段经历史载不详，具体细节存疑。\n- **意义**：她曾以为自己能在韦后与太平之间从容周旋，却在710年政变的刀光中看清了棋局的残酷——那个替帝王执笔、搅动半部朝堂的才女，最终倒在自己最熟悉的宫墙之下，腕下才情化作政变夜里的最后一抹殷红\n\n### 📍 重要地点：唐都长安·昭文馆\n- **公元纪年**：705年—710年（中宗时期）\n- **停留时间**：约5年\n- **位置**：昭文馆（唐长安宫城内，今陕西省西安市区）\n- **事迹**：中宗复位后，被封为昭容，仍掌制命。她建议扩大书馆，增设学士，主持风雅，代朝廷品评天下诗文。\n- **意义**：其文学事业的巅峰，成为当时文坛的实际领袖，引领了“上官体”诗风的流行（存疑，‘上官体’通常指其祖父上官仪的诗风，婉儿是否形成独立风格说法不一）。\n- **名篇名句**：《奉和圣制立春日侍宴内殿出翦彩花应制》：“密叶因裁吐，新花逐翦舒。”\n\n### 📍 重要地点：唐都长安·唐隆政变现场\n- **公元纪年**：公元710年7月21日\n- **停留时间**：政变当夜\n- **位置**：唐长安宫城（今陕西省西安市区）\n- **事迹**：韦后之乱中，临淄王李隆基起兵。上官婉儿执烛率宫人迎接，并出示与太平公主所拟遗诏草稿以示拥立相王（睿宗），但仍被李隆基斩于旗下。\n- **意义**：她曾以为自己能在韦后与太平之间从容周旋，却在710年政变的刀光中看清了棋局的残酷——那个替帝王执笔、搅动半部朝堂的才女，最终倒在自己最熟悉的宫墙之下，腕下才情化作政变夜里的最后一抹殷红戛然而止。\n\n### 🔴 去世地：唐都长安\n- **公元纪年**：公元710年7月21日\n- **停留时间**：政变当夜\n- **位置**：唐都长安（今陕西省西安市）\n- **经过**：在唐隆政变中，被李隆基下令处死。\n- **意义**：其政治生命的终结地。死后，唐玄宗（李隆基）曾令收集其诗文，编成文集二十卷，令张说作序，可见对其文学成就的认可。\n- **名篇名句**：《驾幸新丰温泉宫献诗三首》其一：“三冬季月景龙年，万乘观风出灞川。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 664年 | 陕州陕县 | 河南省三门峡市陕州区 | （年龄：0岁）出生于陕州陕县。 |\n| 664年 | 唐都长安·掖庭 | 掖庭 | （年龄：0岁）祖父上官仪、父亲上官庭芝被杀，与母亲郑氏没入掖庭为奴。 |\n| 约677年 | 唐都长安·掖庭、宫廷 | 陕西省西安市 | （年龄：约13岁）因才华被武则天发现，免去奴婢身份，开始掌管宫中诏命。 |\n| 696年 | 神都洛阳 | 河南省洛阳市 | （年龄：32岁）正式受命处理百司奏表，参决政务，权势日重。 |\n| 705年 | 神都洛阳 | 河南省洛阳市 | （年龄：41岁）神龙政变，武则天退位，中宗复辟。被封为昭容，继续掌管制诰，主持文坛。 |\n| 709年 | 唐都长安·昭文馆 | 陕西省西安市 | （年龄：45岁）建议中宗扩大书馆，增设学士，品评天下诗文，推动宫廷文学繁荣。 |\n| 710年7月 | 唐都长安宫城 | 陕西省西安市 | （年龄：46岁）唐隆政变爆发，被李隆基斩杀于长安宫中。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n在武则天至唐中宗时期，上官婉儿长期执掌宫廷机要，实际参与中枢决策，其政治影响力远超一般女官。同时，她以“称量天下”的文学权威身份，主持风雅，品评诗文，极大地影响了当时的文坛风气和诗歌创作走向，是连接宫廷与文坛的关键人物。\n\n### 对后世的影响\n- **文学贡献**：其诗作虽多佚失，但存世之作及她主持的诗歌活动，对盛唐诗歌的繁荣有铺垫作用，“上官体”在初唐诗坛占有一席之地（存疑，‘上官体’通常指其祖父上官仪的诗风，婉儿是否形成独立风格说法不一）。\n- **女性参政典范**：作为历史上少数以才学长期深度参与朝政的女性，她的经历成为后世探讨唐代女性地位与政治参与的重要案例。\n- **文化符号**：其才情与悲剧命运，成为文学艺术创作（如影视、小说）的常见题材，形象深入人心。\n\n### 历史评价\n1.  **《旧唐书》评价**：“（婉儿）自通天以来，内掌诏命，掞丽可观……然其评品人才，文章取舍，颇为当时所称。”\n2.  **张说《唐昭容上官氏文集序》**：“昭容两朝专美，一日万机，顾问不遗，应接如响……虽汉称班媛，晋誉左嫔，文章之道不殊，辅佐之功则异。”\n3.  **后世争议**：对其评价历来褒贬不一。赞者称其才华绝世，有政治智慧；贬者则视其为弄权祸水，依附韦后集团。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：生活在**唐朝**（武则天至唐中宗时期），是**中国古代历史上唯一的女皇帝**武则天统治的时代。\n- **关键身份**：**女官**、**诗人**。是武则天和唐中宗时期的重要政治人物。\n- **主要贡献**：**掌管宫中制诰**（起草诏令），**品评天下诗文**，对唐代宫廷文学发展有推动作用。\n- **代表作品**：教材可能提及《彩书怨》等诗作，体现其才情。\n- **常见易混点**：注意区分她与**武则天**（皇帝）、**太平公主**（公主）的身份和关系。她是**臣子**，非皇室成员。\n\n### 高中阶段\n- **政治角色**：在**武周政权**和**唐中宗朝廷**中担任核心秘书角色，有“**巾帼宰相**”之称，实际参与**中枢决策**。\n- **文学影响**：其主持的诗歌品评活动，影响了**初唐诗风**，是**宫廷诗**发展的重要推动者。\n- **历史事件**：与**神龙政变**（武则天退位）、**唐隆政变**（韦后之乱）密切相关，最终死于后者。\n- **历史评价**：教材可能引用《旧唐书》等史料，引导学生辩证看待其**政治才能**与**历史功过**。\n- **对比点**：可与**班昭**（东汉女史学家）、**武则天**等历史杰出女性进行对比，分析不同年代女性发挥影响力的途径与局限。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n- 上官婉儿所处的**朝代**（唐朝）及**主要活跃时期**（武则天、唐中宗时期）。\n- 她的**核心身份**：**女官**、**诗人**。\n- 她的**主要事迹**：**掌管诏命**、**品评诗文**。\n- 她与**武则天**的关系：受到武则天**赏识和重用**。\n- 她的**结局**：在**唐隆政变**中被杀。\n\n### 高中阶段考点\n- 上官婉儿在**武周至中宗时期政治格局**中的作用与地位。\n- 她对**唐代宫廷文学**（尤其是初唐诗歌）发展的具体影响。\n- **“上官体”** 的特点及其在文学史上的位置（存疑，教材可能不深入）。\n- 结合史料（如《旧唐书》），分析对她的**历史评价**为何存在争议。\n- 作为案例，用于理解**唐代女性的社会地位**与**参政可能性**。\n\n## 地点坐标（人工校正）\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 陕州陕县 | 河南省三门峡市陕州区 | 34.7833 | 111.1033 |\n| 唐都长安·掖庭 | 陕西省西安市 | 34.2666 | 108.9542 |\n| 唐都长安·武周宫廷 | 陕西省西安市 | 34.2666 | 108.9542 |\n| 东都洛阳 | 河南省洛阳市 | 34.6197 | 112.4540 |\n| 岭南（流放地，存疑） | 广东省广州市及岭南地区 | 23.1291 | 113.2644 |\n| 唐都长安·昭文馆 | 陕西省西安市 | 34.2666 | 108.9542 |\n| 唐都长安·唐隆政变现场 | 陕西省西安市 | 34.2666 | 108.9542 |\n| 唐都长安 | 陕西省西安市 | 34.2666 | 108.9542 |\n","relatedGraph": {"center": {"id": 2,"name": "上官婉儿","file": "上官婉儿.html","dynasty": "唐代（初唐）","birth_year": 664,"death_year": 710,"time_year": 687,"quote": "叶下洞庭初，思君万里馀。","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "literature","main_role_label": "诗人","birthplace": "陕州陕县","birthplace_raw": "陕州陕县今河南省三门峡市陕州区","birthplace_modern": "河南省三门峡市陕州区","birth_lat_wgs84": 34.7833,"birth_lng_wgs84": 111.1033,"birth_lat": 34.7833,"birth_lng": 111.1033,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["上官婉儿"],"search_tokens": ["上官婉儿"
