  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {
  font-weight: 600;
  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {
  filter: saturate(1.08);
}
.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {
  transform: translateY(-1px);

   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */

  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

"genre": "短篇小说集", "one_liner": "高尔基于1898年出版的早期短篇小说与特写合集，收录《切尔卡什》《二十六个和一个》等代表作，以底层流浪者和劳动者的视角揭露社会黑暗，轰动俄国文坛。", "summary": "| 1898 | | | （年龄：30）《特写与短篇小说集》出版，轰动俄国文坛。", "quote": "", "quotes": [], "quote_policy": "preferred"}, "不合时宜的思想": {"title": "不合时宜的思想", "aliases": [], "authors": [], "related_people": ["高尔基"], "source_pages": ["高尔基"], "era": "", "genre": "", "one_liner": "战时共产主义", "summary": "战时共产主义", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 高尔基\n\n## 人物档案\n\n### 基本信息\n- **姓名**：马克西姆·高尔基\n- **时代**：俄罗斯帝国末期至苏联初期\n- **出生**：公元1868年，诺夫哥罗德省下诺夫哥罗德（今俄罗斯下诺夫哥罗德）（出生具体日期存疑，有3月16日、28日等说法）\n- **去世**：公元1936年，莫斯科（今俄罗斯莫斯科）\n- **享年**：68岁\n- **主要身份**：作家、诗人、政论家、社会活动家\n- **历史地位**：社会主义现实文学的奠基人，被誉为“无产阶级艺术最杰出的代表”。\n- **主要成就**：\n    1. 创作了《母亲》、自传体三部曲（《童年》、《在人间》、《我的大学》）等划时代作品，深刻描绘了俄国社会底层生活与革命觉醒。\n    2. 其散文诗《海燕》成为革命浪漫主义的象征。\n    3. 对苏联文学的发展产生了巨大而深远的影响。\n    4. 积极参与社会活动，是苏联作家协会的组织者和第一任主席。\n\n### 生平概述\n高尔基出生于一个木工家庭，幼年丧父，童年在外祖父家度过，饱尝人间艰辛。他当过学徒、搬运工、面包师，足迹遍及俄国南部，通过自学和丰富的生活阅历走上文学创作道路。19世纪90年代开始发表作品，逐渐成名。他积极投身革命，1905年与列宁会面（具体时间和地点存疑），后多次流亡国外。十月革命后，他一度对新政权的某些政策持保留态度，但最终成为苏联文学界的领袖。他的作品深刻反映了俄国社会的巨变，开创了社会主义现实主义的文学范式。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从伏尔加河畔的童年流浪，到高加索、克里米亚的漂泊，再到莫斯科的定居与国际流亡，最终回归并终老于莫斯科。\n- ⏱️ **时间跨度**：1868年 - 1936年，共约68年。\n- 📍 **地理范围**：主要覆盖俄罗斯欧洲部分（伏尔加河流域、高加索、莫斯科、圣彼得堡），以及意大利卡普里岛等地。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：下诺夫哥罗德\n- **时间**：公元1868年\n- **停留时间**：约4年（后随家庭迁徙）\n- **地点**：诺夫哥罗德省下诺夫哥罗德（今俄罗斯下诺夫哥罗德）\n- **事件**：出生于一个细木工家庭。父亲早逝后，被寄养在外祖父家。\n- **意义**：1868年阿列克谢·彼什科夫生于下诺夫哥罗德，父亲早逝后随母亲寄居外祖父家，那些充满鞭打与哀哭的日子，被他日后揉进《童年》里，成为刺穿虚伪的锋利刀刃\n\n### 📍 重要地点：外祖父家（童年）\n- **时间**：约1871年 - 1878年\n- **停留时间**：约7年\n- **地点**：下诺夫哥罗德市（今俄罗斯下诺夫哥罗德）\n- **事件**：在外祖父染坊生活，目睹家庭暴力与底层市民的愚昧、苦难，但得到外祖母的关爱与民间文学滋养。\n- **意义**：形成了对俄国社会底层最初、最深刻的认知，是其人道主义思想与文学灵感的源泉。\n- **名篇名句**：《童年》：“在她没来之前，我仿佛是躲在黑暗中睡觉，但她一出现，就把我叫醒了，把我领到光明的地方。”\n\n### 📍 重要地点：喀山\n- **时间**：约1884年 - 1888年\n- **停留时间**：约4年\n- **地点**：喀山省喀山（今俄罗斯鞑靼斯坦共和国喀山）\n- **事件**：来到喀山，本想上大学，但梦想破灭。做过面包师、搬运工，接触革命青年，阅读大量书籍，参加秘密集会。\n- **意义**：思想启蒙的关键时期，开始自觉探索社会出路，尝试自杀未遂（存疑），后被救赎。\n- **名篇名句**：《我的大学》：“我读的书越多，就越使我接近世界，越觉得生活的意义更加重要。”\n\n### 📍 重要地点：第聂伯罗彼得罗夫斯克/流浪时期\n- **时间**：约1888年 - 1892年\n- **停留时间**：数年，地点多变\n- **地点**：主要在察里津（今俄罗斯伏尔加格勒）和第聂伯罗彼得罗夫斯克（今乌克兰第聂伯罗）等地活动。（注：此时期活动范围广，坐标以主要活动地察里津/伏尔加格勒为准）\n- **事件**：在伏尔加河畔、顿河草原、高加索地区流浪，做过铁路守夜人、杂工等，广泛接触社会各阶层。\n- **意义**：积累了无与伦比的生活素材，深刻体验了“在人间”的酸甜苦辣，为其现实主义创作奠定了坚实基础。\n- **名篇名句**：《在人间》：“生活条件越是困难，我就觉得自己越发坚强。”\n\n### 📍 重要地点：第比利斯\n- **时间**：约1891年 - 1892年\n- **停留时间**：约1年\n- **地点**：第比利斯省第比利斯（今格鲁吉亚第比利斯）\n- **事件**：在铁路工作，结识革命者卡柳日内，并在其鼓励下开始文学创作。1892年，在《高加索日报》上发表第一篇短篇小说《马卡尔·楚德拉》。\n- **意义**：1936年猝死于莫斯科郊外戈尔基村，官方称病逝，猜疑至今未散，万民空巷送行的国葬仪式上，红色文坛最高旗帜终于倒下，一个时代随之落幕\n- **名篇名句**：《马卡尔·楚德拉》：“人啊，你当自强不息！”\n\n### 📍 重要地点：萨马拉/下诺夫哥罗德（成名期）\n- **时间**：1895年 - 1900年\n- **停留时间**：约5年\n- **地点**：萨马拉省萨马拉（今俄罗斯萨马拉）及下诺夫哥罗德。（注：此时期在两地均有活动，坐标以主要活动地萨马拉为准）\n- **事件**：在萨马拉成为报社编辑，发表大量作品，包括《切尔卡什》、《二十六个和一个》等，轰动俄国文坛。与托尔斯泰、契诃夫等文学巨匠交往。\n- **意义**：1936年猝死于莫斯科郊外戈尔基村，官方称病逝，猜疑至今未散，万民空巷送行的国葬仪式上，红色文坛最高旗帜终于倒下，一个时代随之落幕，作品被广泛传播和讨论。\n- **名篇名句**：《二十六个和一个》：“我们二十六个人，是二十六架机器。”\n\n### 📍 重要地点：圣彼得堡\n- **时间**：1901年 - 1905年（主要活动期）\n- **停留时间**：断续居住数年\n- **地点**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：参与革命运动，创作《海燕》、《小市民》、《底层》等剧本。1901年因《海燕》被捕。1905年革命期间，积极组织力量，并首次与列宁会面。\n- **意义**：童年在卡希林家染坊旁的屈辱与饥寒，成为高尔基笔下俄罗斯底层最真实的底色。这段在暴虐与温情间撕裂的岁月，让他日后以《海燕》振臂高呼，铸就了革命文学的不朽旗帜\n- **名篇名句**：《海燕》：“让暴风雨来得更猛烈些吧！”\n\n### 📍 重要地点：卡普里岛（流亡）\n- **时间**：1906年 - 1913年\n- **停留时间**：约7年\n- **地点**：意大利卡普里岛（今意大利卡普里）\n- **事件**：因革命失败流亡国外。在此创作了最重要的长篇小说《母亲》以及《夏天》、《奥古洛夫镇》等作品。与列宁保持书信联系并多次会面。\n- **意义**：童年在卡希林家染坊旁的屈辱与饥寒，成为高尔基笔下俄罗斯底层最真实的底色。这段在暴虐与温情间撕裂的岁月，让他日后以《海燕》振臂高呼，铸就了革命文学的不朽旗帜\n- **名篇名句**：《母亲》：“真理是用血海也扑灭不了的。”\n\n### 📍 重要地点：莫斯科（晚年）\n- **时间**：1921年 - 1933年（主要阶段）\n- **停留时间**：约12年\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：在列宁的劝说和安排下出国疗养。1928年首次回国受到盛大欢迎，此后每年回国一次。1931年最终回国定居。主持苏联作家协会工作，创作《克里姆·萨姆金的一生》等。\n- **意义**：1936年猝死于莫斯科郊外戈尔基村，官方称病逝，猜疑至今未散，万民空巷送行的国葬仪式上，红色文坛最高旗帜终于倒下，一个时代随之落幕\n\n### 🔴 去世地：莫斯科\n- **时间**：公元1936年\n- **停留时间**：定居于此直至去世\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：在莫斯科郊外的高尔克村逝世。其死因在后世有被谋害的猜测（存疑）。\n- **意义**：伏尔加河畔的商人宅院里，少年高尔基亲历暴虐与虔诚的撕裂，鞭影与祈祷烙印成他最初的文学记忆。《童年》《在人间》《我的大学》三部曲的灵魂，正是从这座阴暗的屋檐下破土萌芽\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1868 | 下诺夫哥罗德 | 俄罗斯下诺夫哥罗德 | （年龄：0）出生于下诺夫哥罗德。 |\n| 1871 | 外祖父家（童年） | 俄罗斯下诺夫哥罗德 | （年龄：3）父亲去世，被寄养在外祖父家。 |\n| 1878 | 外祖父家（童年） | 俄罗斯下诺夫哥罗德 | （年龄：10）外祖父家破产，开始“在人间”谋生。 |\n| 1884 | 喀山 | 俄罗斯鞑靼斯坦共和国喀山 | （年龄：16）前往喀山，梦想上大学，进入“社会大学”。 |\n| 1887 | 喀山 | 俄罗斯鞑靼斯坦共和国喀山 | （年龄：19）在喀山尝试自杀未遂（存疑）。 |\n| 1888-1892 |  |  | （年龄：20-24）在南俄及高加索地区流浪，从事各种底层工作。 |\n| 1892 | 第比利斯 | 格鲁吉亚第比利斯 | （年龄：24）在第比利斯发表处女作《马卡尔·楚德拉》，启用笔名。 |\n| 1895 |  |  | （年龄：27）在萨马拉成为报社编辑，作品开始引起广泛关注。 |\n| 1898 |  |  | （年龄：30）《特写与短篇小说集》出版，轰动俄国文坛。 |\n| 1901 |  |  | （年龄：33）发表《海燕》，因革命活动被捕。 |\n| 1902 |  |  | （年龄：34）当选为俄罗斯科学院名誉院士，后被沙皇当局取消。 |\n| 1905 | 莫斯科 | 俄罗斯莫斯科 | （年龄：37）参与莫斯科十二月起义，首次会见列宁。 |\n| 1906 | 卡普里岛（流亡） | 意大利卡普里 | （年龄：38）流亡美国，后定居意大利卡普里岛，创作《母亲》。 |\n| 1913 | 卡普里岛（流亡） | 意大利卡普里 | （年龄：45）结束第一次长期流亡，返回俄国。 |\n| 1921 |  |  | （年龄：53）再次出国疗养，主要在德国和意大利。 |\n| 1928 |  |  | （年龄：60）首次从国外回到苏联，受到盛大欢迎。 |\n| 1932 |  |  | （年龄：64）最终回国定居，被授予“列宁勋章”。 |\n| 1934 |  |  | （年龄：66）主持第一次全苏作家代表大会，当选作协主席。 |\n| 1936 | 莫斯科 | 俄罗斯莫斯科 | （年龄：68）在莫斯科逝世，葬于红场。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《海燕》**、**《童年》**（节选）、**《在人间》**（节选）、**《母亲》**（节选）\n- 核心要点：\n    - **重点**：**《海燕》** 是运用**象征手法**的典范，海燕象征**无产阶级革命先驱**，暴风雨象征**席卷一切的革命浪潮**，海鸥、海鸭等象征**害怕革命的资产阶级**。\n    - **重点**：自传体三部曲（**《童年》《在人间》《我的大学》**）以**第一人称**叙述，展现了阿廖沙在**苦难中成长**的历程，具有深刻的**社会批判性**和**人道主义关怀**。\n    - **重点**：高尔基的文学创作确立了**社会主义现实主义**的基本原则，即要求艺术描写与**历史具体性**和用**社会主义精神**教育劳动人民相结合。\n    - 作品语言生动，富有激情，尤其擅长刻画**底层人民**的群像和复杂心理。\n    - 《海燕》中**“让暴风雨来得更猛烈些吧！”** 成为呼唤革命的经典**名句**，充满**革命浪漫主义**激情。\n    - 《母亲》中的尼洛夫娜形象，展现了普通群众在革命影响下的**觉醒过程**，是文学史上第一个**自觉的无产阶级革命者**形象。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：高尔基是**俄国无产阶级文学**的奠基人，其活动与创作紧密联系着**1905年革命**、**十月革命**和**苏联初期**的文化建设。\n    - **重点**：他与**列宁**有着长期而复杂的友谊与思想交流，其政治立场在革命前后有所变化，曾对“战时共产主义”政策提出批评（《不合时宜的思想》）。\n    - 他是**苏联作家协会**的首任主席，对苏联文学的组织化、官方化起到了关键作用。\n- 核心要点：\n    - **重点**：高尔基的人生轨迹是**俄国社会巨变**的缩影，从**沙皇专制**到**社会主义革命**，他的思想与创作始终回应着时代的核心命题。\n    - **
