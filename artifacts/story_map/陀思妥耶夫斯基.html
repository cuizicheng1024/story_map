  min-height: 0;
}
.journey-timeline-column {
  overflow: hidden;
}
.journey-map-column {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);

}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {

  z-index: 1;

}
.journey-shell.is-exporting {

}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {

}
.map-3d-control-button {

  min-height: 32px;
}
.map-floating-controls {

}
.map-floating-controls > * {

}
.map-control-stack {

}
.map-control-cluster {

.map-layer-switch {

}
.map-layer-trigger {

  min-width: 68px;

.map-bottom-button {

  min-width: 68px;

  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));

  padding-left: 0;
  padding-right: 0;

.map-layer-trigger:hover,

.map-bottom-button.is-accent-export:hover {

  .journey-main-row {
    display: flex;

.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,

.glass-panel {
  background: rgba(255, 255, 255, 0.84);

.desc-clamp {

.narrative-watch-link:hover,

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

家庭，早年生活曾有放纵阶段，后在高加索服役期间开始文学创作", "quote": "", "quotes": [], "quote_policy": "preferred"}, "赌徒": {"title": "赌徒", "aliases": [], "authors": [], "related_people": ["陀思妥耶夫斯基"], "source_pages": ["陀思妥耶夫斯基"], "era": "", "genre": "", "one_liner": "口述《赌徒》给速记员安娜·斯尼特金娜（后来成为第二任妻子）。", "summary": "口述《赌徒》给速记员安娜·斯尼特金娜（后来成为第二任妻子）。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "公民": {"title": "公民", "aliases": [], "authors": [], "related_people": ["陀思妥耶夫斯基"], "source_pages": ["陀思妥耶夫斯基"], "era": "19世纪俄罗斯帝国", "genre": "期刊", "one_liner": "| 1873-1874 | | | （年龄：52-53）主编《公民》杂志", "summary": "| 1873-1874 | | | （年龄：52-53）主编《公民》杂志", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "作家日记": {"title": "作家日记", "aliases": [], "authors": [], "related_people": ["陀思妥耶夫斯基"], "source_pages": ["陀思妥耶夫斯基"], "era": "", "genre": "散文", "one_liner": "| 1875-1876 | | | （年龄：54-55）创办《作家日记》月刊，获得巨大社会反响。", "summary": "| 1875-1876 | | | （年龄：54-55）创办《作家日记》月刊，获得巨大社会反响。", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 陀思妥耶夫斯基\n\n## 人物档案\n\n### 基本信息\n- **姓名**：费奥多尔·米哈伊洛维奇·陀思妥耶夫斯基（Фёдор Михайлович Достоевский）\n- **时代**：俄罗斯帝国（19世纪）\n- **出生**：1821年11月11日，俄罗斯帝国莫斯科\n- **去世**：1881年2月9日，俄罗斯帝国圣彼得堡\n- **享年**：59岁（按周岁计算）\n- **主要身份**：作家、思想家、哲学家、记者\n- **历史地位**：俄国文学黄金时代的核心巨匠，世界文学史上最具影响力的心理描写大师之一。\n- **主要成就**：开创心理现实主义文学；创作《罪与罚》《卡拉马佐夫兄弟》《白痴》《群魔》等不朽名著；深刻探讨人性、信仰、自由与苦难等哲学命题。\n\n### 生平概述\n陀思妥耶夫斯基出生于莫斯科一个医生家庭，早年丧母，性格敏感。在圣彼得堡接受军事工程教育，但立志文学。1849年因参与彼得拉舍夫斯基小组的空想社会主义活动被沙皇政府逮捕，经历假死刑后改判苦役，在西伯利亚度过十年（四年苦役，六年兵役）。流放彻底改变了他的思想，从西欧派转向斯拉夫派，笃信东正教与俄国人民的救赎力量。返回彼得堡后，他以惊人的毅力在债务、赌博和癫痫的困扰中坚持创作，通过《时代》杂志传播其“土壤派”思想。晚年凭借《卡拉马佐夫兄弟》达到艺术与思想的巅峰，其作品对人类灵魂深渊的洞察，预示了现代主义与存在主义哲学，影响深远。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：莫斯科\n- **公元纪年**：1821年 - 1837年\n- **停留时间**：约16年\n- **位置**：莫斯科（今俄罗斯莫斯科）\n- **事迹**：在此度过童年与少年时代；在父亲工作的贫民医院环境中，初次接触社会底层与苦难；母亲于1837年去世，同年被送往圣彼得堡求学。\n- **意义**：塑造了其早期对痛苦与同情的敏感，为其文学中对“被侮辱与被损害者”的关注埋下伏笔。\n\n### 📍 重要地点：圣彼得堡军事工程学校\n- **公元纪年**：1838年 - 1843年\n- **停留时间**：约5年\n- **位置**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事迹**：遵从父命学习军事工程；广泛阅读普希金、果戈理、巴尔扎克等文学作品；1843年毕业后曾短暂任职于工程局，但很快辞职专事文学。\n- **意义**：完成了工程学教育，但坚定了文学志向；城市生活为其早期作品提供了素材。\n\n### 📍 重要地点：圣彼得堡（早期文学活动）\n- **公元纪年**：1844年 - 1849年\n- **停留时间**：约5年\n- **位置**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事迹**：发表处女作《穷人》（1846年），一举成名，被誉为“新的果戈理”；后陆续发表《双重人格》《女房东》等作品；参与彼得拉舍夫斯基小组的激进思想讨论。\n- **意义**：开启作家生涯，初步形成其关注小人物、心理分裂的创作主题；政治活动导致人生重大转折。\n- **名篇名句**：《穷人》：“我是个小人物，但我的心也是肉长的。”\n\n### 📍 重要地点：鄂木斯克监狱\n- **公元纪年**：1850年 - 1854年\n- **停留时间**：4年苦役\n- **位置**：鄂木斯克要塞监狱（今俄罗斯鄂木斯克州鄂木斯克市）\n- **事迹**：作为政治犯服苦役；在极端残酷的环境中与刑事犯共同生活；大量阅读《圣经》，思想发生根本转变，从社会主义转向宗教与民族主义。\n- **意义**：人生最黑暗也最关键的时期，“苦难净化灵魂”的思想在此孕育；为其后期创作提供了无尽的素材与精神深度。\n- **名篇名句**：《死屋手记》：“我只担心一件事：我怕我配不上自己所受的苦难。”\n\n### 📍 重要地点：塞米巴拉金斯克\n- **公元纪年**：1854年 - 1859年\n- **停留时间**：约5年（兵役期及退役后）\n- **位置**：塞米巴拉金斯克（今哈萨克斯坦塞米伊，旧称塞米巴拉金斯克）\n- **事迹**：以列兵身份服役，后晋升为准尉；结识第一任妻子玛丽亚·伊萨耶娃；恢复写作，发表《斯捷潘奇科沃村及其居民》《舅舅的梦》等；1859年获准返回欧洲俄罗斯地区。\n- **意义**：流放生涯的延续与结束；重新开始文学创作，为全面复出做准备；个人生活经历波折。\n\n### 📍 重要地点：圣彼得堡（后期创作与巅峰）\n- **公元纪年**：1859年 - 1881年（除短暂旅居欧洲外）\n- **停留时间**：约20年\n- **位置**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事迹**：与兄长创办《时代》《纪事》杂志，宣扬“土壤派”思想；创作井喷，完成《被侮辱与被损害的》《死屋手记》《地下室手记》《罪与罚》《白痴》《群魔》《少年》《卡拉马佐夫兄弟》等全部重要长篇小说；陷入赌博与债务危机；1880年发表著名的普希金演说；1881年病逝。\n- **意义**：生命最后阶段，也是其文学成就的顶峰所在地；在这里，他将个人苦难升华为对全人类精神困境的探索，奠定了其世界文学巨匠的地位。\n- **名篇名句**：《罪与罚》：“我只想证明一件事，就是，那时魔鬼引诱我，后来又告诉我，说我没有权利走那条路，因为我不过是个虱子，和所有其余的人一样。”；《卡拉马佐夫兄弟》：“爱具体的人，不要爱抽象的人。要爱生活，甚于爱生活的意义。”\n\n### 🔴 去世地：圣彼得堡\n- **公元纪年**：1881年2月9日\n- **停留时间**：人生最后阶段（见上条）\n- **位置**：圣彼得堡（今俄罗斯圣彼得堡）\n- **经过**：因家族遗传的肺气肿加重，导致肺部动脉破裂去世。葬礼引发巨大社会反响，数万人自发送行。\n- **意义**：生命与创作的终点。他的去世标志着俄国文学一个时代的结束，但其思想与艺术影响力在此后百年持续发酵，成为世界文化遗产。\n- **名篇名句**：《卡拉马佐夫兄弟》：“首先应该善良，其次要诚实，最后永远不要相互遗忘。”\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 莫斯科 | 俄罗斯莫斯科 | 55.625578 | 37.606392 |\n| 圣彼得堡军事工程学校 | 俄罗斯圣彼得堡 | 59.941944 | 30.298889 |\n| 圣彼得堡（早期文学活动） | 俄罗斯圣彼得堡 | 59.941944 | 30.298889 |\n| 鄂木斯克监狱 | 俄罗斯鄂木斯克州鄂木斯克市 | 28.177571 | 112.997239 |\n| 塞米巴拉金斯克 | 哈萨克斯坦塞米伊 | 36.318766 | 101.407970 |\n| 圣彼得堡（后期创作与巅峰） | 俄罗斯圣彼得堡 | 59.941944 | 30.298889 |\n| 圣彼得堡 | 俄罗斯圣彼得堡 | 59.941944 | 30.298889 |\n## 生
