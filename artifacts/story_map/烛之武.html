  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

全了郑国。其事迹展现了个人智慧在特定历史条件下的巨大作用。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于郑国都城（今河南新郑）及周边，关键行程为夜间出城赴秦营游说。\n- ⏱️ **时间跨度**：生卒年不详，主要事迹集中于公元前630年（郑文公四十三年）。\n- 📍 **地理范围**：核心在郑国（今河南中部），外交活动涉及秦国（今陕西中部）势力范围。\n- 🌟 **重要节点数量**：核心地点数量 6 个\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：郑国（具体地点不详）\n- **时间**：春秋中期，具体年份存疑\n- **停留时间**：早年\n- **地点**：郑国（今河南省新郑市）\n- **事件**：出生于郑国，成长并长期生活于此。\n- **意义**：史书未载烛之武出身何处，恰是这模糊的来处塑造了他对郑国不可选择的归属。半生郁结于怀才不遇，正因无处可退，才在故土之上默默等一个被看见的契机\n\n### 📍 重要地点：郑国都城（新郑）\n- **时间**：青壮年时期\n- **停留时间**：数十年\n- **地点**：郑国都城新郑（今河南省新郑市）\n- **事件**：担任郑国圉正（养马官），后为大夫，但长期未得重用，处于“壮士不遇”的状态。\n- **意义**：其政治生涯的主要舞台，也是其怀才不遇、观察列国形势的长期居所。\n\n### 📍 重要地点：郑国都城（临危受命）\n- **时间**：公元前630年\n- **停留时间**：事件发生前夕\n- **地点**：郑国都城新郑（今河南省新郑市）\n- **事件**：秦、晋联军围郑，郑国危殆。佚之狐向郑文公举荐烛之武，郑文公诚恳道歉并请求其出使。\n- **意义**：烛之武的生卒已无从查考，他的形象永远定格在那个说退秦师的清晨。城墙、灯火、白发，是留给后世最完整的剪影——一位被埋没的老臣，于暮年完成最绚烂的一击，从此不朽\n\n### 📍 重要地点：郑国城墙（夜缒而出）\n- **时间**：公元前630年，夜晚\n- **停留时间**：短暂\n- **地点**：郑国都城城墙处（今河南省新郑市）\n- **事件**：烛之武在夜间被人用绳子从城墙上放下去，秘密前往秦军营地。\n- **意义**：烛之武的生卒已无从查考，他的形象永远定格在那个说退秦师的清晨。城墙、灯火、白发，是留给后世最完整的剪影——一位被埋没的老臣，于暮年完成最绚烂的一击，从此不朽端，体现了任务的危险性与隐秘性，场面极具画面感。\n\n### 📍 重要地点：秦军营地\n- **时间**：公元前630年，夜间\n- **停留时间**：短暂（一次会谈）\n- **地点**：秦军围郑营地（约在今河南省新郑市周边，具体地点不详）\n- **事件**：面见秦穆公，陈说灭郑之害（“邻之厚，君之薄也”）与存郑之利（“以为东道主，行李之往来，共其乏困”）。\n- **意义**：烛之武的生卒已无从查考，他的形象永远定格在那个说退秦师的清晨。城墙、灯火、白发，是留给后世最完整的剪影——一位被埋没的老臣，于暮年完成最绚烂的一击，从此不朽\n\n### 🔴 去世地：郑国（具体地点不详）\n- **时间**：春秋后期，具体年份存疑\n- **停留时间**：晚年\n- **地点**：郑国（今河南省新郑市一带）\n- **事件**：退秦师后事迹不载，应在郑国安度晚年。\n- **意义**：这座他大半生默默无闻、被国君冷落的老城，却成全了他人生最耀眼的高光。危亡之际，缒城而出的白发老臣以三寸之舌说退秦伯，一言而解邦国之围，自此\"烛之武退秦\"便成了这座古都最厚重的历史注脚\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 生年不详 | 郑国都城（新郑） | 河南省新郑市 | （人生阶段：早年）生于郑国，成长于郑国都城新郑。 |\n| 壮年时期 | 郑国（具体地点不详） | 河南省新郑市 | （人生阶段：壮年）任郑国圉正，后为大夫，长期未受重用。 |\n| 公元前630年（事件前夕） | 郑国都城（临危受命） | 河南省新郑市 | （人生阶段：晚年）秦晋围郑，经佚之狐举荐，临危受命。 |\n| 公元前630年（事件当日） | 郑国（具体地点不详） | 河南省新郑市 | （人生阶段：晚年）夜缒出城，面见秦穆公，成功说退秦师，解郑国之围。 |\n| 公元前630年后 | 郑国（具体地点不详） |  | （人生阶段：晚年）事迹不载，推断在郑国生活直至去世。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《烛之武退秦师》**（选自《左传》）\n- 核心要点：\n    - **重点**：**说理艺术**——烛之武的说辞是全文核心，逻辑严密，层层递进，从亡郑无益于秦、存郑有益于秦，到挑拨秦晋关系，最终打动秦君。\n    - **重点**：**人物形象**——塑造了一个**深明大义**、**临危不惧**、**机智善辩**的**爱国志士**形象，尤其突出其“不计前嫌”的胸怀与“老骥伏枥”的担当。\n    - **叙事详略**——文章详于“说辞”而略于战争，体现了《左传》**重辞令、重人物**的叙事特点。\n    - **外交辞令**——学习古代外交场合中，如何**委婉陈词**、**晓以利害**、**以情动人**的语言技巧。\n    - **重点**：**关键虚词与句式**——文中“以其无礼于晋”、“焉用亡郑以陪邻”、“夫晋，何厌之有”等句子，是掌握**文言虚词**（以、焉、之、夫）和**特殊句式**（状语后置、宾语前置）的经典范例。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**秦晋围郑**——发生在公元前630年，是春秋中期**大国争霸**（晋文公、秦穆公）背景下的一次重要军事行动。\n    - **烛之武退秦**——一次成功的**外交斡旋**，避免了战争，是**春秋无义战**背景下罕见的以智取胜案例。\n    - **秦晋之隙**——此事件暴露了秦晋联盟的内在矛盾，为后来两国**崤之战**等冲突埋下伏笔。\n- 核心要点：\n    - **重点**：**春秋时代特征**——事件体现了**礼崩乐坏**、**诸侯争霸**、**外交活动频繁**的时代特点。\n    - **小国生存之道**——郑国作为夹在大国之间的小国，其存亡深刻反映了**地缘政治**的残酷与**外交智慧**的重要性。\n    - **重点**：**人物历史评价**——烛之武被视为**辩士**与**爱国者**的典范，其成功在于**审时度势**与**换位思考**（站在秦国立场分析）。\n    - **重点**：**《左传》的史学与文学价值**——此篇是《左传》中**记言**艺术的杰出代表，通过人物对话推动情节、刻画性格，兼具**历史真实性**与**文学感染力**。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 河南省新郑市（郑国都城） | 34.3956 | 113.7416 |\n| 河南省新郑市（郑国城墙遗址区域） | 34.3960 | 113.7400 |\n| 陕西省凤翔县（秦都雍城，秦穆公势力中心） | 34.5233 | 107.3933 |", "relatedGraph": {"center": {"id": 298, "name": "烛之武", "file": "烛之武.html", "dynasty": "春秋时期（东周）", "birth_year": -630, "death_year": null, "time_year": -630, "quote": "不战而屈人之兵", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "外交家", "birthplace": "推断为郑国", "birthplace_raw": "推断为郑国今河南省新郑市", "birthplace_modern": "河南省新郑市", "birth_lat_wgs84": 34.3956, "birth_lng_wgs84": 113.7416, "birth_lat": 34.3956, "birth_lng": 113.7416, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["烛之武"], "search_tokens": ["烛之武", "zhuzhiwu", "zzw"], "search_pinyin": ["zhuzhiwu", "zzw"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "isCenter": true, "relationLabel": "中心人物"}, "nodes": [{"id"
