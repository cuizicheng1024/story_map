/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

利亚时代的城市》）是理解工业革命后英国城市化进程、工人阶级形成与生活状况的重要学术背景。","quote": "","quotes": [],"quote_policy": "preferred"},"英国社会史": {"title": "英国社会史","aliases": [],"authors": ["阿萨·勃里格斯"],"related_people": ["阿萨·勃里格斯"],"source_pages": ["阿萨·勃里格斯"],"era": "20世纪","genre": "历史著作","one_liner": "系统梳理英国从工业革命到现代福利国家社会变迁的通史性社会史著作，聚焦城市化进程、工人阶级形成与普通民众日常生活。","summary": "历史不仅是伟人的传记，更是无数普通人日常生活的总和。","quote": "勃里格斯的研究重心从传统的政治史转向社会史、城市史和工人阶级生活史，通过《维多利亚时代的城市》、《英国社会史》等著作，极大地拓宽了历史学的视野。","quotes": ["勃里格斯的研究重心从传统的政治史转向社会史、城市史和工人阶级生活史，通过《维多利亚时代的城市》、《英国社会史》等著作，极大地拓宽了历史学的视野。","他成长于两次世界大战之间，在剑桥大学悉尼·苏塞克斯学院接受教育，其学术生涯与英国战后社会重建与变革紧密相连。","历史不仅是伟人的传记，更是无数普通人日常生活的总和。"],"quote_policy": "preferred"},"泰晤士报": {"title": "泰晤士报","aliases": [],"authors": [],"related_people": ["阿萨·勃里格斯"],"source_pages": ["阿萨·勃里格斯"],"era": "","genre": "","one_liner": "一位不知疲倦的学者和教育家，他教会了英国人如何理解他们自己的社会过去。","summary": "一位不知疲倦的学者和教育家，他教会了英国人如何理解他们自己的社会过去。","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 阿萨·勃里格斯\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：阿萨·勃里格斯（Asa Briggs, Baron Briggs）\n- **时代**：20世纪\n- **出生**：1921年5月7日，英国西约克郡基斯利（今英国英格兰西约克郡基斯利）\n- **去世**：2016年3月15日，英国东萨塞克斯郡刘易斯（今英国英格兰东萨塞克斯郡刘易斯）\n- **享年**：94岁\n- **主要身份**：历史学家、社会史学家、教育家、作家\n- **历史地位**：20世纪英国社会史研究的奠基人之一，尤其以对维多利亚时代和工人阶级历史的研究闻名。\n- **主要成就**：开创英国社会史研究新范式；系统研究维多利亚时代社会；推动英国高等教育改革；撰写多部权威历史著作。\n\n### 生平概述\n阿萨·勃里格斯是二战后英国最具影响力的历史学家之一。他成长于两次世界大战之间，在剑桥大学悉尼·苏塞克斯学院接受教育，其学术生涯与英国战后社会重建与变革紧密相连。勃里格斯的研究重心从传统的政治史转向社会史、城市史和工人阶级生活史，通过《维多利亚时代的城市》、《英国社会史》等著作，极大地拓宽了历史学的视野。他不仅是一位多产的学者，还积极参与公共事务与教育管理，曾任萨塞克斯大学副校长、牛津大学伍斯特学院院长等职，对英国高等教育现代化产生了深远影响。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于英国英格兰地区，学术足迹遍及欧美。\n- ⏱️ **时间跨度**：1921年 - 2016年，共94年。\n- 📍 **地理范围**：以英格兰为核心，涉及约克郡、伦敦、牛津、萨塞克斯等地。\n- 🌟 **重要节点数量**：核心地点约8个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：基斯利（Keighley）\n- **公元纪年**：1921年\n- **停留时间**：童年及青少年时期（约至1939年）\n- **位置**：约克郡西区基斯利（今英国英格兰西约克郡基斯利）\n- **事迹**：在此成长，接受早期教育，对约克郡的地方工业与社区生活有切身体会。\n- **意义**：塑造了其对英国地方社会与工人阶级生活的最初兴趣，为其日后研究提供了感性认识。\n\n### 📍 重要地点：剑桥（Cambridge）\n- **公元纪年**：1939年 - 1941年；1944年 - 1945年\n- **停留时间**：本科求学及短暂研究时期\n- **位置**：剑桥大学（今英国英格兰剑桥郡剑桥市）\n- **事迹**：在悉尼·苏塞克斯学院攻读历史；二战期间曾中断学业从事情报工作（布莱切利园），战后返校完成学业并获博士学位。\n- **意义**：奠定了其深厚的史学功底，并接触到了当时前沿的学术思想与研究方法。\n\n### 📍 重要地点：布莱切利园（Bletchley Park）\n- **公元纪年**：约1941年 - 1944年\n- **停留时间**：约3年\n- **位置**：白金汉郡布莱切利园（今英国英格兰白金汉郡布莱切利）\n- **事迹**：二战期间在此从事情报密码分析工作。\n- **意义**：这段经历使其亲历了现代科技与国家组织的结合，影响了其后来对技术与社会关系的研究视角。\n\n### 📍 重要地点：牛津（Oxford）\n- **公元纪年**：1945年 - 1955年\n- **停留时间**：约10年\n- **位置**：牛津大学沃德姆学院（今英国英格兰牛津郡牛津市）\n- **事迹**：担任研究员及讲师，开始其学术生涯，出版早期重要著作。\n- **意义**：在学术重镇确立了自己的研究方向，完成了从博士生到独立学者的转变。\n\n### 📍 重要地点：利兹（Leeds）\n- **公元纪年**：1955年 - 1961年\n- **停留时间**：约6年\n- **位置**：利兹大学（今英国英格兰西约克郡利兹市）\n- **事迹**：担任利兹大学首位近代史教授，深入研究维多利亚时代社会。\n- **意义**：在此期间完成了其关于维多利亚时代研究的多部关键著作，学术声誉日隆。\n\n### 📍 重要地点：萨塞克斯大学（University of Sussex）\n- **公元纪年**：1961年 - 1976年\n- **停留时间**：约15年\n- **位置**：萨塞克斯大学（今英国英格兰东萨塞克斯郡布莱顿-霍夫法尔默（Falmer））\n- **事迹**：担任社会研究学院首任院长，后任大学副校长（1967-1976）。参与创建这所新型大学，实践其跨学科教育理念。\n- **意义**：将其教育理念付诸实践，对英国战后高等教育改革产生了直接影响，是其公共生涯的高峰之一。\n\n### 📍 重要地点：牛津大学伍斯特学院（Worcester College, Oxford）\n- **公元纪年**：1976年 - 1991年\n- **停留时间**：约15年\n- **位置**：牛津大学伍斯特学院（今英国英格兰牛津郡牛津市）\n- **事迹**：担任学院院长（Provost）。继续从事写作、研究与公共演讲。\n- **意义**：回归牛津，作为学术领袖继续发挥影响力，并完成了多部总结性著作。\n\n### 🔴 去世地：刘易斯（Lewes）\n- **公元纪年**：2016年3月15日\n- **停留时间**：晚年居住地\n- **位置**：东萨塞克斯郡刘易斯（今英国英格兰东萨塞克斯郡刘易斯）\n- **经过**：在此地平静去世。\n- **意义**：其学术与人生的终点，与他长期工作生活的萨塞克斯地区紧密相连。\n- **名篇名句**：《英国社会史》：“历史不仅是伟人的传记，更是无数普通人日常生活的总和。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1921 | 基斯利（Keighley） | 英国英格兰西约克郡基斯利 | （年龄：0）出生于英国约克郡基斯利。 |\n| 1939 | 剑桥（Cambridge） | 英国英格兰剑桥郡剑桥市 | （年龄：18）进入剑桥大学悉尼·苏塞克斯学院学习历史。 |\n| 约1941 | 布莱切利园（Bletchley Park） | 英国英格兰白金汉郡布莱切利 | （年龄：约20）二战中断学业，被招募至布莱切利园从事情报密码分析工作。 |\n| 1944 | 剑桥（Cambridge） | 英国英格兰剑桥郡剑桥市 | （年龄：23）返回剑桥大学继续学业。 |\n| 1945 | 剑桥（Cambridge） | 英国英格兰剑桥郡剑桥市 | （年龄：24）获剑桥大学博士学位；成为牛津大学沃德姆学院研究员。 |\n| 1955 | 利兹（Leeds） | 英国英格兰西约克郡利兹市 | （年龄：34）出任利兹大学近代史教授。 |\n| 1961 | 萨塞克斯大学（University of Sussex） | 英国英格兰东萨塞克斯郡布莱顿-霍夫法尔默（Falmer | （年龄：40）出任新成立的萨塞克斯大学社会研究学院首任院长。 |\n| 1967 | 萨塞克斯大学（University of Sussex） | 英国英格兰东萨塞克斯郡布莱顿-霍夫法尔默（Falmer | （年龄：46）升任萨塞克斯大学副校长。 |\n| 1976 | 牛津大学伍斯特学院（Worcester College, Oxford） | 英国英格兰牛津郡牛津市 | （年龄：55）辞去副校长职务，出任牛津大学伍斯特学院院长（Provost）。 |\n| 1991 |  |  | （年龄：70）从伍斯特学院院长职位退休。 |\n| 2016 | 刘易斯（Lewes） | 英国英格兰东萨塞克斯郡刘易斯 | （年龄：94）在英国刘易斯去世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n阿萨·勃里格斯是二战后英国史学“从下往上看”转向的关键推动者。他将历史研究的焦点从政治精英扩展到普通民众、城市社区和工人阶级，其著作和教学影响了整整一代历史学者。同时，作为萨塞克斯大学的领导者，他积极推动打破学科壁垒的“学术群”（School of Studies）模式，对英国乃至世界的高等教育改革产生了示范效应。\n\n### 对后世的影响\n- **拓宽史学领域**：其社会史、城市史研究为后来的文化史、日常生活史研究奠定了坚实基础。\n- **跨学科方法论**：倡导历史学与社会学、经济学等学科结合的方法，成为当代史学研究的主流范式之一。\n- **公共史学典范**：通过大量通俗历史著作和媒体节目，成功将学术研究转化为公众知识，树立了公共史学家的典范。\n- **高等教育遗产**：其在萨塞克斯大学的教育改革理念，持续影响着研究型大学的跨学科课程设置。\n\n### 历史评价\n- 被誉为“英国社会史的教父”。\n- 同时代史学家G.M.特里维廉称其作品“为英国历史画布增添了不可或缺的底色”。\n- 《泰晤士报》讣告评价他：“一位不知疲倦的学者和教育家，他教会了英国人如何理解他们自己的社会过去。”\n\n---\n\n## 人教版教材知识点\n（注：阿萨·勃里格斯作为现代英国历史学家，其人其作并非中国初高中历史教材的直接内容。以下知识点是基于其学术贡献与教材中相关历史概念的关联性进行的梳理。）\n\n### 初中阶段\n- **工业革命的社会影响**：勃里格斯的研究（如《维多利亚时代的城市》）是理解**工业革命**后英国**城市化进程**、**工人阶级形成**与生活状况的重要学术背景。\n- **历史研究视角**：其“社会史”视角可作为理解“**人民群众是历史创造者**”这一唯物史观观点的具体学术案例。\n- **关键词关联**：**维多利亚时代**、**城市化**、**阶级分化**。\n\n### 高中阶段\n- **史学方法论**：勃里格斯是**社会史**学派的代表人物，其研究体现了历史学关注**社会结构**、**日常生活**和**底层民众**的转向。\n- **现代史学发展**：可作为了解20世纪中叶以后**西方史学**从传统政治史、外交史向社会史、文化史**多元化发展**的个案。\n- **英国现代化历程**：其著作系统梳理了英国从**工业社会**到**福利国家**的社会变迁脉络，是理解**英国现代化道路**的重要参考。\n- **易混/对比点**：与传统**政治史**（如辉格史观）研究重点的区别；与**年鉴学派**在关注社会整体历史上有共通之处，但地域和具体方法不同。\n\n---\n\n## 初高中阶段考点\n（注：阿萨·勃里格斯本人并非中国历史课程的直接考点。以下考点是基于其研究领域与课程标准可能涉及内容的关联性提示。）\n\n### 初中阶段\n- **核心关联考点**：**第一次工业革命**的影响（社会结构变化、城市问题）。\n- **可能联系**：在分析工业革命的负面影响（如贫富差距、城市病）时，可提及勃里格斯等社会史学家的研究为我们提供了丰富细节。\n- **存疑/说法不一**：其具体学术观点不作为考核要求。\n\n### 高中阶段\n- **核心关联考点**：**史学理论与方法**（选修内容）、**世界史现代化进程**。\n- **可能联系**：\n    1.  在探讨**历史研究的视角与方法**时，可将其作为**社会史**研究的范例。\n    2.  在学习**英国政治经济发展**时，其关于社会层面的研究可作为深化理解的补充材料。\n- **存疑/说法不一**：其学术思想体系复杂，中学阶段无需掌握细节，仅作了解史学发展趋势的背景知识。\n\n---\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 基斯利（Keighley） | 英国英格兰西约克郡基斯利 | 53.867780 | -1.
