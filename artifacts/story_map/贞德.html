  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

的评价需置于**中世纪晚期**的语境中，理解**君权神授**观念、**异端审判**的残酷性以及**女性社会地位**的局限。\n    - 她与**查理七世**的关系复杂，既有相互利用，也存在后期的疏离，反映了王权对“神启”人物的矛盾态度。\n    - **重点**：贞德的遗产超越国界，成为**世界历史上**关于勇气、信仰与领导力的永恒案例，被不同文化和意识形态不断重新诠释。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：贞德本人无文学作品传世，但其事迹是西方文学艺术的重要题材，如**萧伯纳**的戏剧《**圣女贞德**》、**马克·吐温**的传记《**贞德传**》等。在中文语境中，常作为**爱国主义**、**信仰力量**与**女性英雄**的典范被引述。\n- 核心要点：\n    - **重点**：贞德形象的核心是**信仰驱动**的**民族英雄**，其故事体现了个人信念与国家命运的深刻联结。\n    - **重点**：她的事迹常被用来诠释**牺牲精神**与**殉道者**形象，具有强烈的悲剧色彩和道德感召力。\n    - **重点**：作为**女性领袖**，她在男性主导的军事和政治领域取得非凡成就，是**性别角色突破**的历史案例。\n    - 其审判与平反过程，反映了**中世纪宗教法庭**的运作、**政治与宗教**的复杂关系。\n    - “奥尔良少女”已成为法国文化中一个特定的**象征符号**，代表希望、勇气与救赎。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：贞德活跃于**英法百年战争**（1337-1453年）后期，她的出现是战争从法国劣势转向优势的**关键转折点**。\n    - 她成功实践了“**解奥尔良之围**”和“**促成兰斯加冕**”两大战略目标，直接巩固了**查理七世**的统治合法性。\n    - **重点**：她的**被捕与审判**（1431年）是英格兰及其盟友为打击法国士气而精心策划的政治-宗教事件，审判程序充满争议。\n    - 1456年的**平反**与1920年的**封圣**，完成了其从民族英雄到宗教圣人的形象升华。\n- 核心要点：\n    - **重点**：贞德是**法国民族意识觉醒**的重要催化剂，她的牺牲将一场王朝战争部分转化为**民族解放战争**。\n    - 她的成功依赖于当时法国社会普遍的**宗教虔诚**与对“天命”的信仰，她巧妙地将个人使命与**王权正统**诉求结合。\n    - **重点**：对贞德的评价需置于**中世纪晚期**的语境中，理解**君权神授**观念、**异端审判**的残酷性以及**女性社会地位**的局限。\n    - 她与**查理七世**的关系复杂，既有相互利用，也存在后期的疏离，反映了王权对“神启”人物的矛盾态度。\n    - **重点**：贞德的遗产超越国界，成为**世界历史上**关于勇气、信仰与领导力的永恒案例，被不同文化和意识形态不断重新诠释。\n\n---", "workTexts": {}, "workSummaries": {}, "markdown": "# 贞德\n\n## 人物档案\n\n### 基本信息\n- **姓名**：贞德（法语：Jeanne d'Arc，英语：Joan of Arc）\n- **时代**：中世纪晚期（英法百年战争期间）\n- **出生**：约公元1412年，古称栋雷米拉皮塞勒（今法国大东部大区默兹省栋雷米拉皮塞勒）\n- **去世**：公元1431年5月30日，古称鲁昂（今法国诺曼底大区滨海塞纳省鲁昂）\n- **享年**：约19岁\n- **主要身份**：军事家、民族英雄、天主教圣人\n- **历史地位**：法国民族精神的象征，在英法百年战争中扭转战局的关键人物。\n- **主要成就**：率军解除奥尔良之围；在帕提战役中取得决定性胜利；拥戴查理七世在兰斯加冕；其牺牲激发了法国民族意识，最终推动战争走向胜利。\n\n### 生平概述\n贞德出生于法国东部一个普通的农家。在英法百年战争后期，法国北部大部分领土被英格兰及其勃艮第盟友占领，王室衰微。约16岁时，贞德声称得到大天使米迦勒等圣徒的启示，命她率军解救法国，并护送王储查理至兰斯加冕。她克服重重阻碍，获准面见查理，并被授予军权。1429年，她成功解奥尔良之围，取得一系列军事胜利，扭转了战争局势，随后护送查理七世在兰斯完成加冕礼，奠定了其王权的合法性。1430年，贞德在贡比涅被勃艮第人俘虏，后被出售给英格兰。1431年，她在鲁昂被英格兰当局以异端和女巫罪名审判并处以火刑。1456年，教宗法庭重审此案，为贞德平反。1920年，天主教会册封其为圣人。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从法国东北部的故乡出发，穿越卢瓦尔河谷，抵达兰斯加冕，最终在诺曼底的鲁昂牺牲。\n- ⏱️ **时间跨度**：约1412年 - 1431年（约19年）\n- 📍 **地理范围**：主要活动于法国中北部，包括洛林、香槟、卢瓦尔河谷、法兰西岛及诺曼底地区。\n- 🌟 **重要节点数量**：10个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：栋雷米\n- **时间**：约1412年\n- **停留时间**：约14年\n- **地点**：古称栋雷米拉皮塞勒（今法国大东部大区默兹省栋雷米拉皮塞勒）\n- **事件**：贞德在此度过童年与青少年时期，成长于百年战争的动荡环境中。\n- **意义**：在洛林边境的多姆雷米村，钟楼下的祈祷与田野间的牧歌交织成她少女时代的底色，百年战争的硝烟烧毁了邻村的麦田，也在她心中早早埋下了救国的火种与不可动摇的宗教虔诚\n\n### 📍 重要地点：沃库勒尔\n- **时间**：1428年\n- **停留时间**：数周\n- **地点**：古称沃库勒尔（今法国大东部大区默兹省沃库勒尔）\n- **事件**：首次尝试说服当地驻军指挥官罗贝尔·德·博德里库尔，请求前往希农面见王储。\n- **意义**：然而正是从这座城门迈出的每一步，将她一步步送入命运的罗网——从奥尔良的凯旋到贡比涅城下的陷落，从法兰西的救星沦为卢昂火刑柱上的囚徒，勃艮第人最终以金币将她售予英格兰\n\n### 📍 重要地点：希农\n- **时间**：1429年2月-3月\n- **停留时间**：约一个月\n- **地点**：古称希农（今法国中央-卢瓦尔河谷大区安德尔-卢瓦尔省希农）\n- **事件**：面见王储查理（未来的查理七世），并通过了初步的背景审查和神学质询。\n- **意义**：见证着贞德命运弧线的两端。1429年她从这里出征，走向兰斯加冕与贡比涅的黄昏。1430年5月被俘后，这位让法兰西重燃希望的少女被转售英格兰，魂断鲁昂火刑台。起点处的荣耀，燃为终局的灰烬\n\n### 📍 重要地点：奥尔良\n- **时间**：1429年4月-5月\n- **停留时间**：约十天（主要作战期）\n- **地点**：古称奥尔良（今法国中央-卢瓦尔河谷大区卢瓦雷省奥尔良）\n- **事件**：率领法军解除英格兰军队对奥尔良长达七个月的围困，身先士卒，多次负伤。\n- **意义**：取得“奥尔良奇迹”般的胜利，成为百年战争的重大转折点，贞德因此被尊称为“奥尔良少女”。\n\n### 📍 重要地点：帕提\n- **时间**：1429年6月18日\n- **停留时间**：一日\n- **地点**：古称帕提（今法国中央-卢瓦尔河谷大区卢瓦雷省帕提）\n- **事件**：指挥了一场经典的突袭战，几乎全歼了由英格兰名将约翰·法斯托夫率领的援军。\n- **意义**：帕提战役是贞德军事指挥艺术的巅峰体现，扫清了通往兰斯的道路。\n\n### 📍 重要地点：兰斯\n- **时间**：1429年7月\n- **停留时间**：数日\n- **地点**：古称兰斯（今法国大东部大区马恩省兰斯）\n- **事件**：护送查理七世进入兰斯大教堂，并举行加冕典礼。\n- **意义**：完成了她“神谕”使命的核心部分，使查理七世的王权获得传统合法性，极大鼓舞了法国士气。\n\n### 📍 重要地点：巴黎城下\n- **时间**：1429年9月\n- **停留时间**：数日\n- **地点**：古称巴黎（今法国法兰西岛大区巴黎）\n- **事件**：率军进攻被英格兰和勃艮第控制的巴黎，在进攻圣奥诺雷门时受重伤。\n- **意义**：进攻失败，是其军事生涯的首次重大挫折，也标志着查理七世对其支持开始动摇。\n\n### 📍 重要地点：贡比涅\n- **时间**：1430年5月\n- **停留时间**：数日\n- **地点**：古称贡比涅（今法国上法兰西大区瓦兹省贡比涅）\n- **事件**：在贡比涅城外与勃艮第军队作战时，因殿后掩护撤退，城门提前关闭，被勃艮第军队俘虏。\n- **意义**：见证着贞德命运弧线的两端。1429年她从这里出征，走向兰斯加冕与贡比涅的黄昏。1430年5月被俘后，这位让法兰西重燃希望的少女被转售英格兰，魂断鲁昂火刑台。起点处的荣耀，燃为终局的灰烬\n\n### 📍 重要地点：鲁昂（审判与囚禁）\n- **时间**：1430年底-1431年5月\n- **停留时间**：约六个月\n- **地点**：古称鲁昂（今法国诺曼底大区滨海塞纳省鲁昂）\n- **事件**：被英格兰当局控制的宗教法庭以“异端”、“女巫”、“着男装”等罪名进行长达数月的审判。最终拒绝放弃“神谕”，被判处火刑。\n- **意义**：其审判过程充满政治操控，牺牲使其成为殉道者与永恒的民族象征。\n\n### 🔴 去世地：鲁昂旧市场广场\n- **时间**：1431年5月30日\n- **停留时间**：一日\n- **地点**：古称鲁昂旧市场（今法国诺曼底大区滨海塞纳省鲁昂老集市广场）\n- **事件**：被公开处以火刑，骨灰被撒入塞纳河。\n- **意义**：壮烈牺牲，年仅约19岁。她的死激发了法国更强烈的民族反抗情绪，最终推动法国在1453年赢得百年战争的胜利。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1412年 | 栋雷米 | 法国大东部大区默兹省栋雷米拉皮塞勒 | （年龄：0岁）出生于法国栋雷米 |\n| 约1425年 | 栋雷米 | 法国大东部大区默兹省栋雷米拉皮塞勒 | （年龄：约13岁）开始声称听到圣徒的“声音” |\n| 1428年 | 沃库勒尔 | 法国大东部大区默兹省沃库勒尔 | （年龄：约16岁）前往沃库勒尔，首次请求面见王储 |\n| 1429年2月 | 希农 | 法国中央-卢瓦尔河谷大区安德尔-卢瓦尔省希农 | （年龄：约17岁）在希农面见王储查理 |\n| 1429年4月-5月 | 奥尔良 | 法国中央-卢瓦尔河谷大区卢瓦雷省奥尔良 | （年龄：约17岁）解奥尔良之围 |\n| 1429年6月 | 帕提 | 法国中央-卢瓦尔河谷大区卢瓦雷省帕提 | （年龄：约17岁）赢得帕提战役大捷 |\n| 1429年7月 | 兰斯 | 法国大东部大区马恩省兰斯 | （年龄：约17岁）护送查理七世于兰斯加冕 |\n| 1429年9月 | 巴黎城下 | 法国法兰西岛大区巴黎 | （年龄：约17岁）进攻巴黎失败 |\n| 1430年5月 | 贡比涅 | 法国上法兰西大区瓦兹省贡比涅 | （年龄：约18岁）在贡比涅被勃艮第人俘虏 |\n| 1431年1月-5月 | 鲁昂（审判与囚禁） | 法国诺曼底大区滨海塞纳省鲁昂 | （年龄：约19岁）在鲁昂受审 |\n| 1431年5月30日 | 鲁昂（审判与囚禁） | 法国诺曼底大区滨海塞纳省鲁昂 | （年龄：约19岁）在鲁昂被处以火刑 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：贞德本人无文学作品传世，但其事迹是西方文学艺术的重要题材，如**萧伯纳**的戏剧《**圣女贞德**》、**马克·吐温**的传记《**贞德传**》等。在中文语境中，常作为**爱国主义**、**信仰力量**与**女性英雄**的典范被引述。\n- 核心要点：\n    - **重点**：贞德形象的核心是**信仰驱动**的**民族英雄**，其故事体现了个人信念与国家命运的深刻联结。\n    - **重点**：她的事迹常被用来诠释**牺牲精神**与**殉道者**形象，具有强烈的悲剧色彩和道德感召力。\n    - **重点**：作为**女性领袖**，她在男性主导的军事和政治领域取得非凡成就，是**性别角色突破**的历史案例。\n    - 其审判与平反过程，反映了**中世纪宗教法庭**的运作、**政治与宗教**的复杂关系。\n    - “奥尔良少女”已成为法国文化中一个特定的**象征符号**，代表希望、勇气与救赎。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：贞德活跃于**英法百年战争**（1337-1453年）后期，她的出现是战争从法国劣势转向优势的**关键转折点**。\n    - 她成功实践了“**解奥尔良之围**”和“**促成兰斯加冕**”两大战略目标，直接巩固了**查理七世**的统治合法性。\n    - **重点**：她的**被捕与审判**（1431年）是英格兰及其盟友为打击法国士气而精心策划的政治-宗教事件，审判程序充满争议。\n    - 1456年的**平反**与1920年的**封圣**，完成了其从民族英雄到宗教圣人的形象升华。\n- 核心要点：\n    - **重点**：贞德是**法国民族意识觉醒**的重要催化剂，她的牺牲将一场王朝战争部分转化为**民族解放战争**。\n    - 她的成功依赖于当时法国社会普遍的**宗教虔诚**与对“天命”的信仰，她巧妙地将个人使命与**王权正统**诉求结合。\n    - **重点**：对贞德的评价需置于**中世纪晚期**的语境中，理解**君权神授**观念、**异端审判**的残酷性以及**女性社会地位**的局限。\n    - 她与**查理七世**的关系复杂，既有相互利用，也存在后期的疏离，反映了王权对“神启”人物的矛盾态度。\
