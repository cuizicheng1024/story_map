  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

 "era": "19世纪末至20世纪初（俄罗斯帝国晚期、第一次世界大战、苏维埃俄国初期）", "genre": "", "one_liner": "事件：被流放至西伯利亚。", "summary": "事件：被流放至西伯利亚。", "quote": "期间与克鲁普斯卡娅结婚，并开始撰写《俄国资本主义的发展》等理论著作。", "quotes": ["期间与克鲁普斯卡娅结婚，并开始撰写《俄国资本主义的发展》等理论著作。", "事件：被流放至西伯利亚。"], "quote_policy": "preferred"}, "前进报": {"title": "前进报", "aliases": [], "authors": [], "related_people": ["列宁"], "source_pages": ["列宁"], "era": "", "genre": "", "one_liner": "事件：与孟什维克进行激烈的理论斗争，创办布尔什维克机关报《前进报》。", "summary": "事件：与孟什维克进行激烈的理论斗争，创办布尔什维克机关报《前进报》。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "真理报": {"title": "真理报", "aliases": [], "authors": [], "related_people": ["列宁", "斯大林"], "source_pages": ["列宁", "斯大林"], "era": "", "genre": "", "one_liner": "事件：二月革命后从流放地返回，参与编辑《真理报》，进入布尔什维克党中央核心层，参与领导十月革命武装起义。", "summary": "事件：二月革命后从流放地返回，参与编辑《真理报》，进入布尔什维克党中央核心层，参与领导十月革命武装起义。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "四月提纲": {"title": "四月提纲", "aliases": [], "authors": ["列宁"], "related_people": ["列宁"], "source_pages": ["列宁"], "era": "20世纪初（1917年）", "genre": "政治提纲", "one_liner": "列宁于1917年俄国二月革命后发表的纲领性政治文献，提出从资产阶级民主革命向社会主义革命过渡的路线，主张一切政权归苏维埃、不给临时政府任何支持。", "summary": "| 1917 | 彼得格勒 | 俄罗斯圣彼得堡 | （年龄：47）二月革命后回国，发表《四月提纲》", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "国家与革命": {"title": "国家与革命", "aliases": [], "authors": ["列宁"], "related_people": ["列宁"], "source_pages": ["列宁"], "era": "20世纪初（1917年）", "genre": "政治理论著作", "one_liner": "列宁于1917年俄国革命前夕撰写的经典马克思主义理论著作，系统阐述了马克思主义国家学说，论证无产阶级革命必须打碎旧的国家机器，并最终使国家走向自行消亡。", "summary": "列宁出生于俄国辛比尔斯克一个知识分子家庭，青年时期因兄长被沙皇处决而走上革命道路", "quote": "国家是阶级矛盾不可调和的产物和表现。在阶级矛盾客观上达到不能调和的地方、时候和程度，便产生国家。", "quotes": ["国家是阶级矛盾不可调和的产物和表现。在阶级矛盾客观上达到不能调和的地方、时候和程度，便产生国家。", "工人阶级不能简单地掌握现成的国家机器，并运用它来达到自己的目的。"], "quote_policy": "preferred"}}, "markdown": "# 列宁\n\n## 人物档案\n\n### 基本信息\n- **姓名**：弗拉基米尔·伊里奇·乌里扬诺夫（列宁）\n- **时代**：19世纪末至20世纪初（俄罗斯帝国晚期、第一次世界大战、苏维埃俄国初期）\n- **出生**：1870年4月22日，辛比尔斯克（今俄罗斯乌里扬诺夫斯克）\n- **去世**：1924年1月21日，高尔基村（今俄罗斯莫斯科州）\n- **享年**：54岁\n- **主要身份**：革命家、政治家、思想家、布尔什维克党领袖、苏维埃国家缔造者\n- **历史地位**：世界上第一个社会主义国家——苏联的主要缔造者，国际无产阶级革命的伟大导师。\n- **主要成就**：\n    1. 创立并领导布尔什维克党，为无产阶级革命提供了组织基础。\n    2. 发展了马克思主义，形成**列宁主义**，提出**帝国主义论**和关于社会主义可能在一国首先胜利的理论。\n    3. 成功领导**十月革命**，建立世界上第一个社会主义国家。\n    4. 领导苏维埃政权度过国内战争和外国武装干涉时期，巩固了新生政权。\n    5. 为探索社会主义建设道路进行了初步实践（**战时共产主义**、**新经济政策**）。\n\n### 生平概述\n列宁出生于俄国辛比尔斯克一个知识分子家庭，青年时期因兄长被沙皇处决而走上革命道路。他早年参与马克思主义小组活动，后被流放。流亡欧洲期间，他创办《火星报》，著书立说，系统阐述无产阶级革命理论，为布尔什维克派的形成奠定了基础。第一次世界大战爆发后，他提出“变帝国主义战争为国内战争”的口号。1917年，他领导布尔什维克党发动**十月革命**，推翻临时政府，建立苏维埃政权。随后，他领导国家应对了残酷的国内战争和外国干涉，战后推行**新经济政策**以恢复经济。1924年因病逝世。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从俄国伏尔加河流域出发，足迹遍及沙俄欧洲部分主要城市，并长期流亡西欧，最终在革命胜利后定都莫斯科。\n- ⏱️ **时间跨度**：1870年 - 1924年，共54年。\n- 📍 **地理范围**：主要覆盖今俄罗斯、芬兰、波兰、德国、英国、瑞士等国。\n- 🌟 **重要节点数量**：13个核心地点\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：辛比尔斯克\n- **时间**：1870年 - 1887年\n- **停留时间**：约17年\n- **地点**：辛比尔斯克（今俄罗斯乌里扬诺夫斯克）\n- **事件**：出生并度过童年与中学时代。1887年，其兄亚历山大因参与刺杀沙皇亚历山大三世被处死，此事对他产生巨大冲击。\n- **意义**：塑造了其早期思想，兄长的牺牲促使他深刻思考俄国革命的道路，并最终转向马克思主义。\n\n### 📍 重要地点：喀山\n- **时间**：1887年 - 1889年\n- **停留时间**：约2年\n- **地点**：喀山（今俄罗斯鞑靼斯坦共和国喀山）\n- **事件**：进入喀山大学法律系学习，因参加学生革命运动被开除。开始接触并研究马克思主义。\n- **意义**：正式踏上革命生涯的起点，从一名激进学生转变为初步的马克思主义者。\n\n### 📍 重要地点：萨马拉\n- **时间**：1889年 - 1893年\n- **停留时间**：约4年\n- **地点**：萨马拉（今俄罗斯萨马拉）\n- **事件**：以校外生资格通过彼得堡大学法律系考试。在当地组织了第一个马克思主义小组，开始进行社会调查和革命宣传。\n- **意义**：完成了从马克思主义学习者到地方组织者的转变，积累了早期革命实践经验。\n\n### 📍 重要地点：圣彼得堡\n- **时间**：1893年 - 1897年\n- **停留时间**：约4年\n- **地点**：圣彼得堡（今俄罗斯圣彼得堡）\n- **事件**：成为首都马克思主义者的核心人物，创立“工人阶级解放斗争协会”。1895年底被捕。\n- **意义**：从地方活动家成长为全国性工人运动的领袖，其组织工作为后来的政党奠定了基础。\n\n### 📍 重要地点：舒申斯克\n- **时间**：1897年 - 1900年\n- **停留时间**：约3年\n- **地点**：舒申斯克（今俄罗斯克拉斯诺亚尔斯克边疆区）\n- **事件**：被流放至西伯利亚。期间与克鲁普斯卡娅结婚，并开始撰写《俄国资本主义的发展》等理论著作。\n- **意义**：在流放地系统地构建了其关于俄国革命的理论框架，思想趋于成熟。\n\n### 📍 重要地点：慕尼黑\n- **时间**：1900年 - 1902年\n- **停留时间**：约2年\n- **地点**：慕尼黑（今德国巴伐利亚州慕尼黑）\n- **事件**：流亡国外，与普列汉诺夫等人合作创办全俄政治报《火星报》。\n- **意义**：通过《火星报》建立了全国性的革命宣传和组织网络，为建党做了思想与干部准备。\n\n### 📍 重要地点：伦敦\n- **时间**：1902年 - 1903年\n- **停留时间**：约1年\n- **地点**：伦敦（今英国伦敦）\n- **事件**：参与筹备并出席俄国社会民主工党第二次代表大会。会上，其派别（布尔什维克）与马尔托夫派（孟什维克）分裂。\n- **意义**：标志着**布尔什维克**作为一个独立政治派别的正式诞生，列宁成为其公认领袖。\n\n### 📍 重要地点：日内瓦\n- **时间**：1903年 - 1905年（首次流亡期）\n- **停留时间**：约2年\n- **地点**：日内瓦（今瑞士日内瓦州日内瓦）\n- **事件**：与孟什维克进行激烈的理论斗争，创办布尔什维克机关报《前进报》。\n- **意义**：巩固了布尔什维克的思想阵地，系统批判了孟什维克的机会主义路线。\n\n### 📍 重要地点：克拉科夫\n- **时间**：1912年 - 1914年\n- **停留时间**：约2年\n- **地点**：克拉科夫（当时属奥匈帝国，今波兰小波兰省克拉科夫）\n- **事件**：为更靠近俄国国内革命运动而移居此地，指导《真理报》工作和杜马中社会民主党党团的活动。\n- **意义**：在第一次世界大战前夕直接遥控指挥国内革命斗争，加强了布尔什维克的组织影响力。\n\n### 📍 重要地点：芬兰波尔卡拉\n- **时间**：1917年9月 - 1917年10月\n- **停留时间**：约1个月\n- **地点**：波尔卡拉（今芬兰乌西马省波尔卡拉）\n- **事件**：为躲避临时政府追捕而隐藏于此，与党中央保持密切联系，最终批准了武装起义计划。\n- **意义**：十月革命前夜的秘密指挥所，为发动**十月革命**做出了最后决策。\n\n### 📍 重要地点：彼得格勒\n- **时间**：1917年11月（俄历10月）\n- **停留时间**：数日（关键时期）\n- **地点**：彼得格勒（今俄罗斯圣彼得堡）\n- **事件**：在斯莫尔尼宫总体领导**十月革命**，推翻临时政府。在全俄工兵代表苏维埃第二次代表大会上宣布政权归苏维埃。\n- **意义**：革命取得决定性胜利的地点，世界上第一个社会主义国家在此宣告诞生。\n\n### 📍 重要地点：莫斯科\n- **时间**：1918年 - 1923年\n- **停留时间**：约5年\n- **地点**：莫斯科（今俄罗斯莫斯科）\n- **事件**：苏维埃政府迁都于此。领导应对国内战争和外国武装干涉，实行**战时共产主义**政策。1922年正式成立苏联。晚年口授了被称为“遗嘱”的信件，对党的建设、国家机关改革和民族问题提出了重要建议。\n- **意义**：作为新生苏维埃国家的首都，是列宁执政、探索社会主义建设道路（如**新经济政策**）的核心舞台。\n\n### 🔴 去世地：高尔基村（莫斯科州）\n- **时间**：1923年 - 1924年1月21日\n- **停留时间**：约1年\n- **地点**：高尔基村（今俄罗斯莫斯科州）\n- **事件**：因健康状况恶化在此疗养，期间于1922-1923年三次中风，最终逝世。\n- **意义**：列宁生命的终点。其逝世引发全国乃至世界无产阶级的哀悼，其思想和遗产被后续领导人继承与发展。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1870 | 辛比尔斯克 | 俄罗斯乌里扬诺夫斯克 | （年龄：0）出生于辛比尔斯克 |\n| 1887 | 喀山 | 俄罗斯鞑靼斯坦共和国喀山 | （年龄：17）兄长被处决；进入喀山大学，旋即因革命活动被开除 |\n| 1893 | 圣彼得堡 | 俄罗斯圣彼得堡 | （年龄：23）移居圣彼得堡，成为当地马克思主义者领袖 |\n| 1895 | 圣彼得堡 | 俄罗斯圣彼得堡 | （年龄：25）创立“工人阶级解放斗争协会”；年底被捕 |\n| 1897 | 舒申斯克 | 俄罗斯克拉斯诺亚尔斯克边疆区舒申斯克 | （年龄：27）被流放西伯利亚三年 |\n| 1900 | 慕尼黑 | 德国慕尼黑 | （年龄：30）流亡国外，创办《火星报》 |\n| 1903 | 伦敦 | 英国伦敦 | （年龄：33）俄国社会民主工党二大，布尔什维克派形成 |\n| 1905 | 圣彼得堡、日内瓦 | 俄罗斯圣彼得堡、瑞士日内瓦 | （年龄：35）返回俄国领导革命，革命失败后再次流亡 |\n| 1912 | 克拉科夫 | 克拉科夫 | （年龄：42）移居克拉科夫，指导国内《真理报》和杜马党团工作 |\n| 1914 | 伯尔尼、苏黎世 | 瑞士伯尔尼、苏黎世 | （年龄：44）一战爆发，提出“变帝国主义战争为国内战争” |\n| 1917 | 彼得格勒 | 俄罗斯圣彼得堡 | （年龄：47）二月革命后回国，发表《四月提纲》；领导**十月革命**胜利 |\n| 1918 | 莫斯科 | 俄罗斯莫斯科 | （年龄：48）领导苏俄应对国内战争；迁都莫斯科 |\n| 1921 | 莫斯科 | 俄罗斯莫斯科 | （年龄：51）推行**新经济政策**，取代**战时共产主义** |\n| 1922 | 莫斯科 | 俄罗斯莫斯科 | （年龄：52）苏维埃社会主义共和国联盟（苏联）正式成立 |\n| 1924 | 高尔基村（莫斯科州） | 俄罗斯莫斯科州 | （年龄：54）在高尔基村（莫斯科州）逝世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：列宁的著作在语文教材中较少作为文学作品出现，但其理论文章如《**国家与革命**》节选可能在历史或政治相关读本中被引用。\n- 核心要点：\n    - **重点**：其文章以**逻辑严密**、**论证有力**著称，善于运用**辩证唯物主义**分析现实问题。\n    - **重点**：语言风格**犀利明快**，具有极强的**鼓动性**和**战斗性**，服务于革命宣传目的。\n    - 在论述中常引用和批判性发展**马克思**、**恩格斯**的观点，体现了**理论联系实际**的学风。\n    - 其著作是理解**列宁主义**和**十月革命**意识形态基础的一手文献。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：1917年领导**布尔什维克党**发动**十月革命**，推翻资产阶级临时政府，建立**苏维埃政权**。\n    - **重点**：提出《**四月提纲**》，为革命指明了从资产阶级民主革命向**社会主义革命**过渡的方向。\n    - 在一战期间提出“**变帝国主义战争为国内战争**”的策略口号。\n    - 1921年推行**新经济政策**，利用商品货币关系恢复和发展经济，是对社会主义建设道路的重要探索。\n- 核心要点：\n    - **重点**：列宁是**帝国主义**和**无产阶级革命时代**的马克思主义者，其理论与实践将马克思主义推进到**列宁主义**阶段。\n    - **重点**：其领导的**十月革命**是人类历史上第一次取得胜利的**社会主义革命**，打破了资本主义世界体系，开辟了人类历史新纪元。\n    - **重点**：他是**苏联**的缔造者和第一代领导核心，其关于**党的建设**、**国家学说**和**民族问题**的理论对20世纪国际共产主义运动产生了深远影响。\n    - 对其评价需置于具体历史语境中，既肯定其**开创性贡献**，也需认识其实践的**历史局限性**与后续引发的复杂争议。\n\n---\n\n## 地点坐标（人工校正）\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 乌里扬诺夫斯克（辛比尔斯克） | 54.3142 | 48.4031 |\n| 喀山 | 55.7963 | 49.1082 |\n| 萨马拉 | 53.1959 | 50.1002 |\n| 圣彼得堡（曾用名彼得格勒） | 59.9343 | 30.3351 |\n| 舒申斯克 | 53.3350 | 91.9550 |\n| 慕尼黑 | 48.1351 | 11.5820 |\n| 伦敦 | 51.5074 | -0.1278 |\n| 日内瓦 | 46.2044 | 6.1432 |\n| 克拉科夫 | 50.0647 | 19.9450 |\n| 波尔卡拉（芬兰） | 60.2934 | 24.6651 |\n| 莫斯科 | 55.7558 | 37.6173 |\n| 高尔基村（莫斯科州） | 55.7167 | 37.1833 |\n", "relatedGraph": {"center": {"id": "列宁", "name": "列宁", "file": "列宁.html", "dynasty": "19世纪末至20世纪初（俄罗斯帝国晚期、第一次世界大战、苏维埃俄国初期）", "aliases": [], "birth_year": 1870, "death_year": 1924, "quote": "变帝国主义战争为国内战争", "review": "变帝国主义战争为国内战争", "foreign_name": "", "main_role_label": "革命家", "birthplace": "辛比尔斯克", "birthplace_modern": "俄罗斯乌里扬诺夫斯克", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "列宁", "name": "列宁", "file": "列宁.html", "dynasty": "19世纪末至20世纪初（俄罗
