  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

s": [], "related_people": ["闻一多", "徐志摩"], "source_pages": ["闻一多", "徐志摩"], "era": "清末民国", "genre": "文学杂志", "one_liner": "事件：短暂任职于国立第四中山大学（后更名为中央大学），并参与编辑《新月》杂志。", "summary": "事件：短暂任职于国立第四中山大学（后更名为中央大学），并参与编辑《新月》杂志。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "晨报副镌·诗镌": {"title": "晨报副镌·诗镌", "aliases": ["晨报副镌", "诗镌"], "authors": [], "related_people": ["徐志摩"], "source_pages": ["徐志摩"], "era": "清末民国", "genre": "文学副刊", "one_liner": "《晨报副镌》旗下的新诗专栏，由徐志摩主编，倡导新诗格律化，集中刊发了新月派诗人探索新诗音节、韵律与形式美的作品，是新月派早期的重要文学阵地。", "summary": "主编《晨报副镌·诗镌》，倡导新诗格律化。", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "沙扬娜拉": {"title": "沙扬娜拉", "aliases": [], "authors": ["徐志摩"], "related_people": ["徐志摩"], "source_pages": ["徐志摩"], "era": "清末民国", "genre": "", "one_liner": "徐志摩，原名章垿，字槱森，留学美国时改名志摩", "summary": "徐志摩，原名章垿，字槱森，留学美国时改名志摩", "quote": "《再别康桥》、《偶然》、《沙扬娜拉》（其一）。", "quotes": ["《再别康桥》、《偶然》、《沙扬娜拉》（其一）。"], "quote_policy": "preferred"}}, "markdown": "# 徐志摩\n\n## 人物档案\n\n### 基本信息\n- **姓名**：徐志摩\n- **时代**：清末民国\n- **出生**：公元1897年1月15日，浙江海宁硖石（今浙江省嘉兴市海宁市硖石街道）\n- **去世**：公元1931年11月19日，山东济南长清县开山（今山东省济南市长清区崮云湖街道）\n- **享年**：34岁\n- **主要身份**：诗人、散文家、翻译家、教授\n- **历史地位**：中国现代著名诗人，新月派代表人物，其诗歌与散文对中国新文学发展有重要影响。\n- **主要成就**：\n    1. 创作了《再别康桥》《偶然》等脍炙人口的新诗，推动了中国新诗的格律化探索。\n    2. 作为**新月社**及后期**新月派**的核心人物，组织文学活动，主编《新月》月刊。\n    3. 散文创作独具一格，情感真挚，文笔华丽。\n    4. 翻译了大量西方文学作品，促进了中西文化交流。\n\n### 生平概述\n徐志摩，原名章垿，字槱森，留学美国时改名志摩。他出生于富商之家，早年接受传统教育，后入北京大学、上海沪江大学学习。1918年赴美留学，1920年获哥伦比亚大学硕士学位后转赴英国，在剑桥大学深受西方浪漫主义诗歌熏陶，确立了文学志向。1922年回国后，他成为**新月社**的发起人之一，并在北京、上海等地多所大学任教，主编《晨报副镌·诗镌》《新月》月刊，倡导新诗格律化。其诗歌情感浓烈，意象新颖，语言华美。1931年11月19日，因搭乘邮政飞机遭遇空难而不幸逝世。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：足迹遍及中国浙江、北京、上海、南京及英国、美国等地，以文学活动与教育生涯为主线。\n- ⏱️ **时间跨度**：公元1897年至1931年，共34年。\n- 📍 **地理范围**：主要覆盖中国华东、华北地区，以及英国剑桥、美国纽约等地。\n- 🌟 **重要节点数量**：10个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：浙江海宁硖石\n- **时间**：1897年\n- **停留时间**：约16年（至1913年左右）\n- **地点**：浙江海宁硖石（今浙江省嘉兴市海宁市硖石街道）\n- **事件**：出生于当地富商家庭，幼年接受传统私塾教育，后入杭州府中学堂（今杭州高级中学前身）学习。\n- **意义**：江南水乡的文化氛围与优渥家境为其奠定了传统文化基础与开阔眼界。\n\n### 📍 重要地点：北京\n- **时间**：1915年-1918年\n- **停留时间**：约3年\n- **地点**：京师（今北京市）\n- **事件**：入读北京大学法科（后未完成），广泛接触新思想与新文化运动人物。\n- **意义**：1931年秋重返北平讲学，他欲在学术与创作间寻得最后的平衡。然而十一月十九日，一架邮政小飞机在济南撞向山崖，三十五岁的诗魂永远定格于云端\n\n### 📍 重要地点：美国（克拉克大学、哥伦比亚大学）\n- **时间**：1918年-1920年\n- **停留时间**：约2年\n- **地点**：美国马萨诸塞州伍斯特市、纽约市（今美国马萨诸塞州伍斯特市、纽约州纽约市）\n- **事件**：先在克拉克大学学习银行学，后入哥伦比亚大学攻读政治学硕士。\n- **意义**：1931年秋重返北平讲学，他欲在学术与创作间寻得最后的平衡。然而十一月十九日，一架邮政小飞机在济南撞向山崖，三十五岁的诗魂永远定格于云端\n\n### 📍 重要地点：英国剑桥\n- **时间**：1920年-1922年\n- **停留时间**：约2年\n- **地点**：剑桥（今英国剑桥郡剑桥市）\n- **事件**：以特别生身份入剑桥大学国王学院，深受英国浪漫主义诗歌影响，开始大量创作新诗。\n- **意义**：**人生与文学的转折点**。康桥的自然与人文环境激发其诗情，奠定了其浪漫主义诗风。名篇《再别康桥》即源于此段经历（创作时间存疑）。\n- **名篇名句**：《再别康桥》：“轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。”\n\n### 📍 重要地点：上海\n- **时间**：1922年-1924年（初期主要活动时间）\n- **停留时间**：断续居住数年\n- **地点**：松江府上海县（今上海市）\n- **事件**：回国后在上海、南京等地从事文化活动，与胡适、闻一多等人交往密切，筹备**新月社**。\n- **意义**：1931年秋重返北平讲学，他欲在学术与创作间寻得最后的平衡。然而十一月十九日，一架邮政小飞机在济南撞向山崖，三十五岁的诗魂永远定格于云端编辑、创作与社交的黄金时期。\n\n### 📍 重要地点：北京（新月社时期）\n- **时间**：1924年-1927年\n- **停留时间**：约3年\n- **地点**：京兆地方（今北京市）\n- **事件**：在北京大学等校任教；与胡适、闻一多、梁实秋等人正式创办**新月社**；印度诗人泰戈尔访华，任翻译；主编《晨报副镌·诗镌》，倡导新诗格律化。\n- **意义**：成为**新月派**核心，其文学活动与诗歌理论对当时诗坛产生重大影响。\n- **名篇名句**：《偶然》：“我是天空里的一片云，偶尔投影在你的波心。”\n\n### 📍 重要地点：上海（主编《新月》时期）\n- **时间**：1927年-1930年\n- **停留时间**：约3年\n- **地点**：淞沪特别市（今上海市）\n- **事件**：在上海光华大学、南京中央大学任教；与友人创办新月书店，主编《新月》月刊。\n- **意义**：1931年秋重返北平讲学，他欲在学术与创作间寻得最后的平衡。然而十一月十九日，一架邮政小飞机在济南撞向山崖，三十五岁的诗魂永远定格于云端\n\n### 📍 重要地点：南京\n- **时间**：1928年-1930年（间断）\n- **停留时间**：断续授课\n- **地点**：江宁（今江苏省南京市）\n- **事件**：在国立中央大学（今南京大学前身）兼任教授。\n- **意义**：1931年秋重返北平讲学，他欲在学术与创作间寻得最后的平衡。然而十一月十九日，一架邮政小飞机在济南撞向山崖，三十五岁的诗魂永远定格于云端\n\n### 📍 重要地点：北京（重返北大）\n- **时间**：1931年\n- **停留时间**：约半年\n- **地点**：北平（今北京市）\n- **事件**：辞去上海教职，重返北京大学英文系任教，并兼任女子大学教授。\n- **意义**：1931年秋，他应北大、清华之聘辞别沪上，欲在这座与林徽因初遇的故都重拾讲席、续写诗行。不料十一月十九日搭\"济南号\"邮机北上途中遇雾撞山，三十五岁的灵魂骤然定格于归程云海，\"轻轻的我走了\"竟一语成谶\n\n### 🔴 去世地：山东济南长清县开山\n- **时间**：1931年11月19日\n- **停留时间**：罹难处\n- **地点**：山东济南长清县开山（今山东省济南市长清区崮云湖街道）\n- **事件**：搭乘中国航空公司“济南号”邮政飞机由南京飞往北平，因大雾触山坠毁，机上人员全部遇难。\n- **意义**：**意外早逝**，是中国文坛的重大损失，其浪漫传奇的一生戛然而止。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1897 | 浙江海宁硖石 | 浙江省嘉兴市海宁市硖石街道 | （年龄：0）出生于浙江海宁硖石。 |\n| 1915 | 北京 | 北京市 | （年龄：18）入北京大学学习。 |\n| 1918 | 美国（克拉克大学、哥伦比亚大学） |  | （年龄：21）赴美国留学，入克拉克大学。 |\n| 1920 | 英国剑桥 | 英国剑桥郡剑桥市 | （年龄：23）获哥伦比亚大学硕士，转赴英国剑桥大学。 |\n| 1922 |  |  | （年龄：25）结束留学回国，开始新诗创作与文学活动。 |\n| 1924 | 北京（新月社时期） | 北京市 | （年龄：27）与友人在北京创办**新月社**；印度诗人泰戈尔访华，任翻译。 |\n| 1925 |  |  | （年龄：28）主编《晨报副镌·诗镌》。 |\n| 1926 |  |  | （年龄：29）与陆小曼结婚。 |\n| 1927 | 上海（主编《新月》时期） | 上海市 | （年龄：30）南下上海，筹备新月书店，主编《新月》月刊。 |\n| 1928 | 英国剑桥 | 英国剑桥郡剑桥市 | （年龄：31）可能重访剑桥（存疑）。《再别康桥》等诗作的创作时间存在不同说法（存疑）。 |\n| 1931 | 北京（重返北大） | 北京市 | （年龄：34）重返北京大学任教；11月19日，因飞机失事遇难。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《再别康桥》**、**《偶然》**、《沙扬娜拉》（其一）。\n- 核心要点：\n    - **重点**：**《再别康桥》** 以“云彩”、“金柳”、“柔波”、“青荇”等**意象**，构建了一个宁静、柔美的意境，表达了对康桥的无限眷恋与离别时的淡淡哀愁。\n    - **重点**：诗歌体现了**新月派**“三美”（**音乐美**、**绘画美**、**建筑美**）主张，**《再别康桥》** 在音节、韵律和诗行排列上堪称典范。\n    - **重点**：**《偶然》** 运用“云”与“波心”的**比喻**，表达了对人生际遇中短暂而美丽相遇的哲思，情感含蓄而深刻。\n    - 诗人善于将主观情感融入客观景物，达到“情景交融”的艺术效果。\n    - 语言**华美**、**轻柔**，富有流动感，形成了独特的“志摩式”浪漫诗风。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**新月社**（1924年）及后期**新月派**的核心组织者与代表诗人，该流派是**中国新诗发展史**上的重要一环。\n    - 曾留学**英美**，深受西方浪漫主义及**剑桥**文化影响，是当时知识分子“西学东渐”的典型代表之一。\n    - 主编《晨报副镌·诗镌》、《新月》月刊，是**自由主义文人**群体的重要舆论阵地。\n- 核心要点：\n    - **重点**：其人生与创作处于**五四新文化运动**之后，中国社会与文学剧烈转型的**民国时期**。\n    - **重点**：作为**资产阶级知识分子**，其文学主张与政治立场倾向于**自由主义**与**精英文化**，与左翼文学存在一定分歧。\n    - 其早逝（**空难**）被赋予了传奇色彩，成为现代文学史上一个令人扼腕的符号。\n    - **重点**：在文学史上，他被定位为**新月派**的**代表诗人**，其作品与活动集中体现了该流派的艺术追求与历史贡献。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 出生地：浙江海宁硖石 | 浙江省嘉兴市海宁市硖石街道 | 30.527 | 120.685 |\n| 重要地点：北京 | 北京市东城区（原北京大学旧址附近） | 39.928 | 116.403 |\n| 重要地点：美国（克拉克大学、哥伦比亚大学） | 美国马萨诸塞州伍斯特市 | 42.263 | -71.802 |\n| 重要地点：英国剑桥 | 英国剑桥郡剑桥市 | 52.205 | 0.122 |\n| 重要地点：上海 | 上海市黄浦区（原上海县旧址附近） | 31.231 | 121.477 |\n| 重要地点：北京（新月社时期） | 北京市西城区（原新月社活动区域） | 39.925 | 116.384 |\n| 重要地点：上海（主编《新月》时期） | 上海市徐汇区（原光华大学旧址附近） | 31.193 | 121.437 |\n| 重要地
