  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

重要领导职务。\n- **主要成就**：\n    - 创作了《哦，香雪》《没有纽扣的红衬衫》《玫瑰门》《笨花》等大量优秀文学作品。\n    - 多次获得全国优秀短篇、中篇小说奖，其作品被译成多种文字。\n    - 曾担任中国作家协会主席、中国文联主席，为推动中国文学艺术事业发展做出贡献。\n\n### 生平概述\n铁凝，1957年生于北京，后随父母到河北。1975年高中毕业后赴河北省博野县农村插队，开始文学创作。她的早期作品以清新风格关注普通人生活与心灵成长，如《哦，香雪》。八十年代后，其创作转向对女性命运、家族历史及社会变迁的深刻剖析，代表作《玫瑰门》《大浴女》等展现了深厚的人文关怀与叙事功力。她长期在河北省文联、作协工作，后进入中国作协领导层，其人生轨迹与中国当代文学发展紧密相连。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于北京、河北省（保定、石家庄等地），后期常驻北京。\n- ⏱️ **时间跨度**：1957年至今，跨度超过60年。\n- 📍 **地理范围**：以京津冀地区为核心。\n- 🌟 **重要节点数量**：核心地点数量9个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：北京\n- **时间**：1957年9月\n- **停留时间**：童年早期\n- **地点**：北京\n- **事件**：出生于一个艺术家庭，父亲是画家，母亲是声乐教授。\n- **意义**：画家父亲的画案与母亲的琴声之间，她自幼浸泡在色彩与旋律里。颜料的气息、素描纸的纹理悄然入梦，塑造了她日后小说中那种可以触摸的画面感——文字在她笔下，从来不只是冰冷的符号\n\n### 📍 重要地点：河北省保定市（随父母居住）\n- **时间**：1960年代-1975年\n- **停留时间**：约10年\n- **地点**：河北省保定市\n- **事件**：在此度过小学和中学时代，经历了特殊历史时期。\n- **意义**：在河北农村与最普通的农民同吃同住的日子里，那些关于饥饿、坚韧与温情的记忆，后来化作《哦，香雪》《麦秸垛》中令人动容的细节——她文学的根，扎在了最深的土里\n\n### 📍 重要地点：河北省保定市博野县（插队地点）\n- **时间**：1975年-1979年\n- **停留时间**：约4年\n- **地点**：河北省保定市博野县\n- **事件**：高中毕业后作为知青下乡插队。\n- **意义**：在河北农村与最普通的农民同吃同住的日子里，那些关于饥饿、坚韧与温情的记忆，后来化作《哦，香雪》《麦秸垛》中令人动容的细节——她文学的根，扎在了最深的土里\n\n### 📍 重要地点：河北省保定地区文化局\n- **时间**：1979年-1980年\n- **停留时间**：约1年\n- **地点**：河北省保定市\n- **事件**：插队结束后，进入该单位工作，任小说编辑。1980年，短篇小说《灶火的故事》引起关注。\n- **意义**：在保定古城的寻常巷陌与乡野车间间穿行采风，她将目光扎进最真实的人间烟火——北方小城的柴米油盐、工厂女工的喜怒哀乐，都化作她日后笔下那些温热而粗粝的故事\n\n### 📍 重要地点：河北省保定地区文联《花山》编辑部\n- **时间**：1980年-1984年\n- **停留时间**：约4年\n- **地点**：河北省保定市\n- **事件**：担任文学期刊编辑。\n- **意义**：在编辑岗位上接触大量文学作品与作者，同时坚持创作，发表了《哦，香雪》等成名作。\n\n### 📍 重要地点：河北省文联\n- **时间**：1984年-1990年代\n- **停留时间**：多年\n- **地点**：河北省石家庄市\n- **事件**：调入省文联，先后任省作协副主席、主席等职。\n- **意义**：在河北农村与最普通的农民同吃同住的日子里，那些关于饥饿、坚韧与温情的记忆，后来化作《哦，香雪》《麦秸垛》中令人动容的细节——她文学的根，扎在了最深的土里\n\n### 📍 重要地点：河北省石家庄市正定县（挂职县委副书记）\n- **时间**：1980年代中期\n- **停留时间**：约一年\n- **地点**：河北省石家庄市正定县\n- **事件**：挂职体验生活。\n- **意义**：在保定古城的寻常巷陌与乡野车间间穿行采风，她将目光扎进最真实的人间烟火——北方小城的柴米油盐、工厂女工的喜怒哀乐，都化作她日后笔下那些温热而粗粝的故事\n\n### 📍 重要地点：中国作家协会（北京）\n- **时间**：1996年-2006年（任副主席），2006年-2016年（任主席）\n- **停留时间**：长期\n- **地点**：北京市\n- **事件**：1996年起担任中国作协副主席，2006年当选中国作协主席，成为新中国成立以来首位女性作协主席。\n- **意义**：从地方作家成为全国文学界的领军人物，组织领导中国文学事业发展。\n\n### 📍 重要地点：中国文学艺术界联合会（北京）\n- **时间**：2016年至今\n- **停留时间**：至今\n- **地点**：北京市\n- **事件**：2016年当选中国文联主席。\n- **意义**：职责范围从文学拓展至整个文艺领域，承担更重要的文化领导工作。\n\n### 🔴 现居地/重要活动地：北京\n- **时间**：2006年至今\n- **停留时间**：长期\n- **地点**：北京\n- **事件**：在中国作协、文联工作，继续文学创作与社会活动。\n- **意义**：作为其职业生涯后期的主要工作与生活地，是当代中国文学的重要决策中心之一。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1957 | 北京 | 北京 | （年龄：0岁）出生于北京。 |\n| 1975 |  |  | （年龄：18岁）高中毕业，赴河北省博野县插队，开始写作。 |\n| 1979 |  |  | （年龄：22岁）插队结束，进入河北保定地区文化局工作。 |\n| 1980 |  |  | （年龄：23岁）短篇小说《灶火的故事》引起关注。 |\n| 1982 |  |  | （年龄：25岁）短篇小说《哦，香雪》发表，获全国优秀短篇小说奖，一举成名。 |\n| 1984 | 河北省文联 | 河北省石家庄市 | （年龄：27岁）调入河北省文联，任专业作家；小说《没有纽扣的红衬衫》发表。 |\n| 1988 |  |  | （年龄：31岁）长篇小说《玫瑰门》出版，标志其创作的重要转型。 |\n| 1996 | 中国作家协会（北京） | 北京市 | （年龄：39岁）当选中国作家协会副主席。 |\n| 2006 | 中国作家协会（北京） | 北京市 | （年龄：49岁）当选中国作家协会主席（连任至2016年）。 |\n| 2016 | 中国文学艺术界联合会（北京） | 北京市 | （年龄：59岁）当选中国文学艺术界联合会主席。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《哦，香雪》**（节选常作为课文）、**《没有纽扣的红衬衫》**（相关章节或介绍曾被选入教材或作为课外读物推荐）\n- 核心要点：\n    - **重点**：**《哦，香雪》** 以一列火车开进深山小站为引子，细腻刻画了以**香雪**为代表的山村少女对现代文明的朦胧向往与自尊自爱的纯洁心灵。\n    - **重点**：作品善于通过**细节描写**（如香雪换铅笔盒）和**心理描写**来展现人物内心世界，风格**清新、诗意**。\n    - **象征手法**：火车、铅笔盒等物品具有丰富的**象征意义**，代表了外部世界、知识与尊严。\n    - **主题思想**：赞美了人性之美、青春之美，以及在时代变迁中人们对美好生活的质朴追求。\n    - **重点**：铁凝早期作品常聚焦于**普通人的日常生活**，发掘其中蕴含的**诗意与哲理**，形成了独特的“诗化小说”风格。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：铁凝是**新时期文学**（改革开放后）的代表作家之一，其创作历程贯穿了中国社会改革开放的多个阶段。\n    - 1980年代，她的作品如《哦，香雪》反映了改革开放初期社会思想的复苏与人们对新生活的渴望。\n    - **重点**：2006年，铁凝当选**中国作家协会主席**，是该职位历史上首位女性，标志着女性在中国文坛领导地位的确立。\n- 核心要点：\n    - **重点**：铁凝的文学创作与个人经历紧密相连，从**知青**到**专业作家**再到**文坛领袖**，其轨迹是当代中国知识分子成长路径的典型缩影。\n    - **重点**：其作品主题经历了从**诗意青春**到**女性命运**、**家族历史**的深化，展现了对**人性**、**历史**与**社会**的持续思考。\n    - **重点**：作为**中国文联主席**、**中国作协主席**，她在当代中国**文艺政策**的制定与实施、文学队伍的培养与组织方面扮演着关键角色。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 北京（出生/现居地） | 39.9042 | 116.4074 |\n| 河北省保定市（成长地） | 38.8739 | 11
