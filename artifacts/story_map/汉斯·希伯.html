.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

早年投身工人运动并加入德国共产党。他对中国革命抱有深切同情，于1925年首次来到中国，在北伐军中从事翻译和政治工作。大革命失败后返回欧洲，但始终关注中国局势。1932年再度来华，以笔为枪，撰写大量文章揭露日本侵略，报道中国军民的英勇抵抗。抗日战争全面爆发后，他毅然奔赴延安，后深入华中、山东敌后抗日根据地，与八路军、新四军将士一同生活、战斗。1941年秋，在山东沂蒙山区反“扫荡”作战中，他持枪与日寇搏斗，壮烈牺牲于大青山，用生命践行了国际主义精神。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从欧洲（波兰、德国）到中国，足迹遍及中国华东、华中多个省份的国统区、沦陷区和抗日根据地。\n- ⏱️ **时间跨度**：约1897/1900年—1941年，总计约41-44年。\n- 📍 **地理范围**：欧洲（奥匈帝国/波兰、德国）；中国（上海、南京、武汉、西安、延安、皖南、苏北、山东等地）。\n- 🌟 **重要节点数量**：核心地点约8个。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：克拉科夫（Kraków）\n- **公元纪年**：约1897年或1900年（存疑）\n- **停留时间**：童年及青少年时期\n- **位置**：奥匈帝国克拉科夫（今波兰克拉科夫）\n- **事迹**：在此成长并接受早期教育，深受当时欧洲工人运动和民族思潮影响。\n- **意义**：1941年深秋，山东沂蒙的大青山上，子弹穿透他的胸膛。一位欧洲犹太记者，将生命永远留在了中国抗日最前线；墓碑无国界，鲜血为\"国际主义\"作了最沉重的注脚\n\n### 柏林\n- **公元纪年**：1920年代中期前\n- **停留时间**：大学学习及早期工作阶段\n- **位置**：德国柏林\n- **事迹**：在大学学习并加入德国共产党，参与工人运动和理论宣传工作。\n- **意义**：1941年深秋，山东沂蒙的大青山上，子弹穿透他的胸膛。一位欧洲犹太记者，将生命永远留在了中国抗日最前线；墓碑无国界，鲜血为\"国际主义\"作了最沉重的注脚\n\n### 上海\n- **公元纪年**：1925-1927年，1932-1934年，1938年等多次往返\n- **停留时间**：累计数年\n- **位置**：中国上海\n- **事迹**：首次来华后在此工作；1932年后以此为基地，为《大美晚报》、《太平洋事务》等撰稿，分析远东局势，组织马克思主义学习小组，与宋庆龄、鲁迅等进步人士交往。\n- **意义**：1941年深秋，日军合围中他倒在苏北连村的芦苇滩上，笔筒里还插着未完的稿件。国际主义者的碧血渗入盐阜大地，化作一座永不被遗忘的丰碑\n- **名篇名句**：《从广州到上海：1925-1927年的中国革命》；《中国革命的现阶段》。\n\n### 武汉\n- **公元纪年**：1926-1927年\n- **停留时间**：数月\n- **位置**：中国湖北武汉\n- **事迹**：北伐战争期间，在国民革命军总政治部担任翻译，亲历大革命高潮。\n- **意义**：1941年深秋，山东沂蒙的大青山上，子弹穿透他的胸膛。一位欧洲犹太记者，将生命永远留在了中国抗日最前线；墓碑无国界，鲜血为\"国际主义\"作了最沉重的注脚\n\n### 延安\n- **公元纪年**：1938年春\n- **停留时间**：短暂访问\n- **位置**：中国陕西延安\n- **事迹**：访问中共中央所在地，会见毛泽东等领导人，深入了解中国共产党的抗战政策和敌后战场情况。\n- **意义**：1941年深秋，山东沂蒙的大青山上，子弹穿透他的胸膛。一位欧洲犹太记者，将生命永远留在了中国抗日最前线；墓碑无国界，鲜血为\"国际主义\"作了最沉重的注脚\n- **名篇名句**：《抗战中的中国：与毛泽东的谈话》。\n\n### 皖南（新四军军部）\n- **公元纪年**：1939年\n- **停留时间**：数月\n- **位置**：中国安徽省泾县（云岭）\n- **事迹**：访问新四军军部，采访叶挺、项英等将领，深入部队和民众中采访。\n- **意义**：1941年深秋，日军合围中他倒在苏北连村的芦苇滩上，笔筒里还插着未完的稿件。国际主义者的碧血渗入盐阜大地，化作一座永不被遗忘的丰碑\n- **名篇名句**：《长江三角洲的游击战》；《重访新四军占领区》。\n\n### 苏北（盐城）\n- **公元纪年**：1941年5月-秋\n- **停留时间**：约半年\n- **位置**：中国江苏省盐城市\n- **事迹**：皖南事变后，毅然前往苏北抗日根据地，采访刘少奇、陈毅等，报道新四军的重建和坚持抗战的情况。\n- **意义**：1941年深秋，山东沂蒙的大青山上，子弹穿透他的胸膛。一位欧洲犹太记者，将生命永远留在了中国抗日最前线；墓碑无国界，鲜血为\"国际主义\"作了最沉重的注脚\n- **名篇名句**：《重访新四军占领区》。\n\n### 🔴 去世地：大青山\n- **公元纪年**：1941年11月30日\n- **停留时间**：牺牲当日\n- **位置**：中国山东省沂南县大青山\n- **经过**：1941年秋，随八路军第115师部队在沂蒙山区进行反“扫荡”作战。11月30日，在大青山地区与日军遭遇，突围战斗中，他拒绝先撤退，持枪与敌战斗，不幸中弹牺牲。\n- **意义**：1941年深秋，日军合围中他倒在苏北连村的芦苇滩上，笔筒里还插着未完的稿件。国际主义者的碧血渗入盐阜大地，化作一座永不被遗忘的丰碑其国际主义精神的永恒丰碑。\n- **名篇名句**：《无声的战斗》（牺牲前撰写的战地通讯）。\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1897年或1900年（存疑） | 克拉科夫（Kraków） | 波兰克拉科夫 | （年龄：0岁）出生于奥匈帝国克拉科夫（今属波兰）。 |\n| 1920年代中期 |  |  | （年龄：约28岁）在德国加入德国共产党，从事记者和写作工作。 |\n| 1925年 |  |  | （年龄：约28岁）首次抵达中国上海，随后赴广州。 |\n| 1926-1927年 |  |  | （年龄：约29-30岁）在武汉参加北伐军政治部工作。 |\n| 1927年 |  |  | （年龄：约30岁）大革命失败后，离开中国返回欧洲。 |\n| 1932年 |  |  | （年龄：约35岁）再次来到中国上海，以记者身份积极报道和分析中国局势。 |\n| 1934年 |  |  | （年龄：约37岁）一度离华，但持续关注并撰文支持中国抗战。 |\n| 1938年春 |  |  | （年龄：约41岁）访问延安，会见毛泽东。 |\n| 1939年 |  |  | （年龄：约42岁）访问皖南新四军军部。 |\n| 1941年5月 |  |  | （年龄：约44岁）穿越重重封锁，抵达苏北盐城新四军抗日根据地。 |\n| 1941年秋 |  |  | （年龄：约44岁）从苏北进入山东抗日根据地，随八路军行动。 |\n| 1941年11月30日 | 大青山 | 中国山东省沂南县大青山 | （年龄：44岁）在山东沂蒙山区大青山反“扫荡”突围战中壮烈牺牲。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n汉斯·希伯是抗日战争时期少数深入敌后根据地、并与军民共同战斗的西方记者之一。他的文章和著作以亲身经历为依据，客观、真实地向国际社会报道了中国共产党领导下的抗日武装和根据地的艰苦斗争，有力地驳斥了国民党的污蔑和国际上的不实传言，极大地鼓舞了根据地军民的士气。他的牺牲本身，就是对中国人民抗日事业最有力的支持和声援。\n\n### 对后世的影响\n- **国际主义精神的象征**：他被视为中国人民的伟大朋友和国际主义战士的典范，其事迹被载入中国革命史册，成为中外友谊和共同反抗法西斯主义的象征。\n- **历史研究的珍贵资料**：他的著作和战地报道，为后世研究中国抗日战争史，特别是中共敌后抗战史，提供了来自第三方的、珍贵的一手史料。\n- **中德友谊的桥梁**：他的故事在中德两国都得到纪念，成为连接两国人民友谊的重要历史纽带。\n\n### 历史评价\n- 毛泽东、朱德等联名挽词：“为国际主义奔走欧亚，为抗击日寇血染沂蒙。”\n- 《大众日报》社论称其为“在山东抗日战场上牺牲的唯一的国际友人”。\n- 后世史家评价：他是一位“用笔和枪同时战斗”的真正战士，其生命轨迹体现了20世纪国际共产主义运动和反法西斯斗争中超越国界的理想主义与牺牲精神。\n\n---\n\n## 人教版教材知识点\n从初高中教材视角，汉斯·希伯通常作为**中国抗日战争**得到**国际援助**和**世界反法西斯统一战线**的典型案例出现。\n\n### 初中阶段\n- **时代背景**：**第二次世界大战**，世界**反法西斯战争**，中国**抗日战争**。\n- **关键事件/贡献**：**国际友人**支援中国抗战；深入**敌后抗日根据地**（如山东根据地）采访报道；在**大青山突围战**中牺牲。\n- **代表作品/思想**：其报道是向世界宣传**中国共产党敌后抗战**的重要窗口。\n- **常见易混点/对比点**：与白求恩（加拿大）、柯棣华（印度）等其他来华支援抗战的国际友人并列记忆，但希伯的独特身份是**记者**和**作家**。\n\n### 高中阶段\n- **时代背景**：**世界反法西斯统一战线**的形成与发展；中国抗战的**两个战场**（正面战场与敌后战场）。\n- **关键事件/贡献**：作为**德国共产党员**和记者，其行动体现了**无产阶级国际主义**；其报道活动是**对外宣传**和**争取国际舆论支持**的重要部分；牺牲于**沂蒙山区**反“扫荡”，是**中共山东抗日根据地**艰苦斗争的缩影。\n- **代表作品/思想**：《长江三角洲的游击战》、《重访新四军占领区》等作品，是研究**新四军**和**华中抗日根据地**的重要史料。\n- **常见易混点/对比点**：与埃德加·斯诺（美国，《红星照耀中国》）对比，两者都是通过报道向世界介绍中国共产党的外国记者，但斯诺主要报道**陕北苏区**，希伯则深入**华中、华东敌后战场**，并最终牺牲在战场上。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 汉斯·希伯是来自**德国**的记者和**国际主义战士**。\n- 他于**抗日战争**时期来到中国，支援中国人民的抗战事业。\n- 他多次深入**敌后抗日根据地**进行采访和报道。\n- 1941年，在**山东省**的**大青山**战斗中，为中国人民的解放事业英勇牺牲。\n- 他是中国人民的伟大朋友，体现了崇高的**国际主义精神**。\n\n### 高中阶段\n- 汉斯·希伯是**德国共产党**党员，其行动具有鲜明的**无产阶级国际主义**色彩。\n- 他的记者生涯和报道重点，反映了**中国共产党**在抗战时期**对外宣传**和**争取国际同情与支持**的努力。\n- 他牺牲的**大青山战斗**，是抗战相持阶段**日军对敌后抗日根据地进行残酷“扫荡”**，以及根据地军民进行**艰苦反“扫荡”斗争**的典型事例。\n- （存疑/说法不一）关于其出生年份，有1897年和1900年两种主要说法，教材通常采用其中一种或模糊处理。\n- 他的事迹常与**白求恩**、**柯棣华**等国际友人并列，作为**世界反法西斯统一战线**和**中国抗战赢得国际支持**的例证。\n\n---\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 克拉科夫 | 波兰克拉科夫 | 50.062 | 19.938 |\n| 柏林 | 德国柏林 | 52.516667 | 13.383333 |\n| 上海 | 中国上海 | 31.232467 | 121.469144 |\n| 武汉 | 中国湖北武汉 | 30.595765 | 114.299125 |\n| 延安 | 中国陕西延安 | 36.649990 | 109.489287 |\n| 皖南 | 中国安徽泾县（云岭） | 30.653315 | 118.224093 |\n| 苏北（盐城） | 中国江苏盐城 | 33.349613 | 120.157684 |\n| 大青山 | 中国山东沂南县大青山 | 35.550110 | 118.459544 |\n","relatedGraph": {"center": {"id": 280,"name": "汉斯·希伯","file": "汉斯·希伯.html","dynasty": "20世纪上半叶（经历两次世界大战）","birth_year": 1897,"death_year": 1941,"time_year": 1926,"quote": "身穿八路军军装的外国记者","review": "","aliases": [],"foreign_name": "Hans Shippe","domain_tags": [],"main_role_band": "literature","main_role_label": "作家","birthplace": "奥匈帝国克拉科夫","birthplace_raw": "奥匈帝国克拉科夫今波兰克拉科夫","birthplace_modern": "波兰克拉科夫","birth_lat_wgs84": 50.062,"birth_lng_wgs84": 19.938,"birth_lat": 50.062,"birth_lng": 19.938,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["汉斯·希伯"],"search_tokens": ["汉斯希伯","hansixibo","hsxb"],"search_pinyin": ["hansixib
