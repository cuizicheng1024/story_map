.map-segment-arrow {
  position: relative;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.map-segment-arrow::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(218, 220, 224, 0.84);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(6px);
}
.map-segment-arrow svg {
  position: relative;
  width: 22px;
  height: 22px;
}
.map-segment-arrow-rotor {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
}
.map-endpoint-marker {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
}
.map-endpoint-marker.is-passed {
  opacity: 0.82;
}
.map-endpoint-marker.is-active {
  filter: saturate(1.04);
  box-shadow: 0 0 0 8px var(--endpoint-soft);
}
.map-endpoint-marker svg {
  width: 44px;
  height: 44px;
  filter: drop-shadow(0 12px 22px var(--endpoint-soft));
}
.map-point-core {
  position: relative;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.94);
  background: var(--point-color, var(--color-primary));
  box-shadow: 0 10px 22px var(--point-soft, rgba(26, 115, 232, 0.18));
  cursor: pointer;
  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;
  contain: layout style paint;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.map-point-core.is-index-only {
  opacity: 0;
  box-shadow: none;
  pointer-events: none;
}
.map-point-core::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: var(--point-soft, rgba(26, 115, 232, 0.18));
  opacity: 0;
  transform: scale(0.84);
  transition: transform 180ms ease, opacity 180ms ease;
}
.map-point-core.is-passed {
  opacity: 0.82;
}
.map-point-core.is-active {
  border-color: rgba(255, 255, 255, 1);
  box-shadow: 0 12px 24px var(--point-soft-strong, rgba(26, 115, 232, 0.3));
}
.map-point-core.is-active::after {
  opacity: 1;
  transform: scale(1);
}
.map-index-badge-shell {
  pointer-events: auto;
}
.map-index-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(244,247,251,0.95) 100%);
  border: 1px solid var(--badge-border, rgba(148,163,184,0.28));
  box-shadow: 0 6px 16px var(--badge-shadow, rgba(15,23,42,0.12));
  color: var(--badge-text, #0f172a);
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(255,255,255,0.92);
  transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease, border-color 180ms ease;
}
.map-index-badge::before {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  top: 2px;
  height: 38%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.16) 100%);
  pointer-events: none;
}
.map-index-badge.is-passed {
  opacity: 0.86;
}
.map-index-badge.is-active {
  transform: translateY(-0.5px);
  box-shadow: 0 10px 22px var(--badge-shadow-strong, rgba(59,130,246,0.18));
}
.map-pulse-marker {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 2px solid var(--pulse-color, rgba(26, 115, 232, 0.92));
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;
  animation: map-pulse-ring 950ms ease-out forwards;
  pointer-events: none;
}
.selected-point-pin {
  width: 26px;
  height: 36px;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.16));
}
.selected-point-pin img,
.selected-point-pin svg {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes map-pulse-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.92;
  }
  100% {
    transform: scale(4.8);
    opacity: 0;
  }
}
/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}
.story-marker {
  position: relative;
  width: 72px;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-serif);
  --marker-color: var(--color-primary);
  --marker-soft: rgba(26, 115, 232, 0.16);
  --marker-soft-strong: rgba(26, 115, 232, 0.28);
}
/* O4: keyboard accessibility for markers. When tabbed to, surface a
   high-contrast focus ring so keyboard users can locate the active
   element. */
.story-marker:focus { outline: none; }
.story-marker:focus-visible .story-marker-ring {
  outline: 3px solid rgba(26, 115, 232, 0.55);
  outline-offset: 4px;
  border-radius: 50%;
}
.story-marker-ring {
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 34px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 3px solid var(--marker-color);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 10px 26px var(--marker-soft-strong);
  opacity: 0;
  pointer-events: none;
}
.story-marker-core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding-bottom: 1px;
}
.story-marker-badge {
  min-width: 38px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--marker-color);
  border: 1px solid rgba(198, 218, 252, 0.56);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease, border-color 200ms ease, opacity 200ms ease;
  white-space: nowrap;
}
.story-marker-tail {
  width: 2px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(52, 168, 83, 0.92), rgba(255, 255, 255, 0));
  opacity: 0.72;
}
.story-marker.is-active .story-marker-ring {
  opacity: 1;
  animation: story-marker-pulse 1.8s ease-out infinite;
}
/* UX4: lift and gently scale the active marker so the user can spot the
   focused point in their peripheral vision without searching. */
.story-marker-dot,
.story-marker-badge {
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 220ms ease;
}
.story-marker.is-active .story-marker-dot,
.story-marker.is-active .story-marker-badge {
  transform: translateY(-2px) scale(1.08);
}
.story-marker-dot {
  display: none;
}
.story-marker:hover .story-marker-badge,
.story-marker:hover .story-marker-dot {
  transform: translateY(-1px);
}
.story-marker:hover .story-marker-dot {
  box-shadow: 0 10px 22px var(--marker-soft-strong);
}
.story-marker.is-start .story-marker-badge {
  background: rgba(240, 249, 255, 0.98);
  border-color: rgba(26, 115, 232, 0.28);
  color: var(--color-primary);
}
.story-marker.is-end .story-marker-badge {
  background: rgba(249, 244, 244, 0.98);
  border-color: rgba(139, 100, 103, 0.24);
  color: #7d5659;
}
.story-marker.is-passed .story-marker-badge,
.story-marker.is-passed .story-marker-dot,
.story-marker.is-passed .story-marker-tail {
  opacity: 0.78;
}
.story-marker.is-active .story-marker-badge {
  background: var(--marker-color);
  color: #fff;
  border-color: var(--marker-color);
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 10px 20px var(--marker-soft-strong);
}
.story-marker.is-active .story-marker-dot {
  transform: scale(1.16);
  box-shadow: 0 10px 22px var(--marker-soft-strong);
  z-index: 10;
}
@keyframes story-marker-pulse {
  0% { transform: scale(0.55); opacity: 0.95; }
  100% { transform: scale(3.1); opacity: 0; }
}

在东方大学任教。\n- **意义**：完成了向坚定马克思主义者的转变，积累了丰富的国际共运经验，为其回国后担任领导工作奠定理论与实践基础。\n- **名篇名句**：《赤都心史》：“‘我’不是旧时代之孝子顺孙，而是‘新时代’的活泼稚儿。”\n\n### 📍 重要地点：上海\n- **公元纪年**：1923年—1934年（期间多次往返，核心活动时期）\n- **停留时间**：累计约10年（非连续）\n- **位置**：今上海市\n- **事迹**：主编《新青年》《前锋》，参与编辑《向导》；参与国民党改组工作；主持上海大学教务；大革命失败后主持中央工作；1931年后与鲁迅共同领导左翼文化运动，从事文学创作与翻译。\n- **意义**：其政治生涯与文化生涯的核心舞台，既是党的理论宣传中心，也是左翼文化运动的堡垒。\n- **名篇名句**：《赤潮曲》：“赤潮澎湃，晓霞飞涌，惊醒了，五千余年的沉梦。”\n\n### 📍 重要地点：瑞金（中央苏区）\n- **公元纪年**：1934年2月—1934年10月\n- **停留时间**：约8个月\n- **位置**：今江西省瑞金市\n- **事迹**：任中华苏维埃共和国中央政府教育人民委员、苏维埃大学校长等职；主管苏区文化教育工作。\n- **意义**：在革命政权中心实践其文化教育理念，是其革命生涯中直接参与根据地建设的阶段。\n\n### 🔴 去世地：长汀\n- **公元纪年**：1935年2月—1935年6月18日\n- **停留时间**：约4个月（被俘至牺牲）\n- **位置**：今福建省龙岩市长汀县\n- **经过**：1935年2月在转移途中于福建长汀县被捕，身份暴露后，拒绝国民党当局的劝降，于6月18日在长汀罗汉岭从容就义。\n- **意义**：一九一九年孤身北上，于北大旁听席上初识马克思主义，在《晨报》笔墨间褪去旧式文人外壳。李大钊的指引让他从悲悯文士彻底转向革命者。此后颠沛中锻造的意志与坦然赴死的从容，都可追溯回他在古都最初觉醒的时刻\n- **名篇名句**：《多余的话》：“这世界对于我仍然是非常美丽的。……但是，永别了，美丽的世界！”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1899 | 常州 | 江苏省常州市 | （年龄：0）出生于江苏常州（今江苏省常州市）。 |\n| 1916 |  |  | （年龄：17）母亲去世，家庭离散，赴无锡任教。 |\n| 1917 | 北京 | 北京市 | （年龄：18）考入北京俄文专修馆学习。 |\n| 1919 |  |  | （年龄：20）参与领导五四运动。 |\n| 1920 |  |  | （年龄：21）以《晨报》记者身份赴苏俄考察。 |\n| 1922 | 莫斯科 | 俄罗斯联邦莫斯科 | （年龄：23）在莫斯科加入中国共产党（存疑/说法不一，一说1921年，一说1922年）。 |\n| 1923 |  |  | （年龄：24）回国，参与筹备中共三大，主编党的理论刊物。 |\n| 1924 | 上海 | 上海市 | （年龄：25）参与国民党一大，推动国共合作；任上海大学教务长。 |\n| 1927 |  |  | （年龄：28）大革命失败后，主持召开“八七会议”，当选临时中央政治局常委，主持中央工作。 |\n| 1928 | 莫斯科 | 俄罗斯联邦莫斯科 | （年龄：29）赴莫斯科参加中共六大，当选中央政治局委员；驻共产国际。 |\n| 1930 |  |  | （年龄：31）回国，主持召开中共六届三中全会，纠正“立三路线”。 |\n| 1931 |  |  | （年龄：32）遭王明等人排挤，被解除中央领导职务；与鲁迅合作领导左翼文化运动。 |\n| 1934 | 瑞金（中央苏区） | 江西省瑞金市 | （年龄：35）进入中央苏区瑞金（今江西省瑞金市），任教育人民委员。 |\n| 1935 | 长汀 | 福建省龙岩市长汀县 | （年龄：36）2月被捕，6月18日在福建长汀（今福建省龙岩市长汀县）英勇就义。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n瞿秋白在党的理论建设、宣传鼓动和文化战线上发挥了不可替代的作用。他在大革命失败后的危急关头主持“八七会议”，实现了党的战略方针的根本转变。在被排挤出政治核心后，他转向文化领域，领导左翼文化运动，粉碎了国民党的文化“围剿”，在思想文化战线上巩固了革命阵地。\n\n### 对后世的影响\n- **理论贡献**：作为系统译介马克思主义文艺理论到中国的第一人，为中国无产阶级文艺理论奠定了基础。\n- **文学遗产**：其散文、杂文、诗歌创作具有开创性，是现代文学史上的重要篇章。\n- **精神象征**：其《多余的话》所展现的坦诚自剖与最终的坚贞不屈，塑造了一个有血有肉、理想崇高的革命者形象，成为共产党人精神谱系的重要组成部分。\n- **文化先驱**：在汉字拉丁化、大众语运动等方面亦有探索之功。\n\n### 历史评价\n- 中国共产党官方评价：“瞿秋白同志是中国共产党早期的主要领导人之一，伟大的马克思主义者，卓越的无产阶级革命家、理论家和宣传家，中国的革命文学事业的奠基者之一。”\n- 鲁迅评语：“人生得一知己足矣，斯世当以同怀视之。”（赠瞿秋白联语）\n- 后世学者评价：他是“书生革命家”的典型，其一生体现了中国传统文人气质与现代革命信仰的深刻结合。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**五四运动**、**中国共产党成立**、**第一次国共合作**、**大革命失败**。\n- **关键事件**：作为**五四运动**的积极参与者；赴**苏俄**考察，成为早期党员；参与**国民党一大**，推动**国共合作**；主持**八七会议**，会议确立了**土地革命**和**武装反抗国民党反动派**的总方针。\n- **代表作品/思想**：早期报告文学《**饿乡纪程**》《**赤都心史**》；翻译《**国际歌**》歌词。\n- **常见易混点/对比点**：与**陈独秀**在**大革命**后期错误的关系；**八七会议**的主要内容和历史意义。\n\n### 高中阶段\n- **时代背景**：**马克思主义在中国的传播**、**共产国际**与中国革命的关系、**土地革命战争**兴起、**左翼文化运动**。\n- **关键事件**：系统考察并认同**苏俄革命模式**；在党内早期理论宣传中的核心作用；**六届四中全会**后被**王明**“左”倾教条主义集团排挤；与**鲁迅**共同领导**中国左翼作家联盟**（左联）。\n- **代表作品/思想**：《**赤潮曲**》；《**多余的话**》（对其一生的反思，需辩证看待）；关于**文艺大众化**的理论主张。\n- **常见易混点/对比点**：**“左联”** 的性质与贡献；其在**中共六大**至**遵义会议**前党内路线斗争中的角色与处境；《**多余的话**》的历史评价争议。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 瞿秋白是**五四运动**的积极分子。\n- 他是以记者身份最早系统报道**苏俄革命**的中国人之一。\n- 他是**中国共产党**早期重要领导人。\n- 他主持了**八七会议**，会议确定了**土地革命**和**武装反抗国民党反动派**的总方针。\n- 他是**国际歌**中文译词的重要完成者。\n- 1935年在福建**长汀**英勇就义。\n\n### 高中阶段\n- 瞿秋白对**马克思主义中国化**早期理论探索的贡献（尤其在文艺理论方面）。\n- 他在**第一次国共合作**中的具体工作（如参与国民党改组、上海大学工作）。\n- 他在**土地革命战争**初期（1927-1931）主持中央工作期间的功过（存疑/说法不一，需结合党史评价）。\n- 他被**王明**路线排挤后，在**左翼文化运动**中与**鲁迅**的合作及其文化成就。\n- 《**多余的话**》所反映的革命者内心世界与历史评价问题（存疑/说法不一，需辩证分析）。\n- 他作为**无产阶级革命家**和**文学家**的双重身份及其历史地位。\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 常州 | 江苏省常州市 | 31.8119 | 119.9741 |\n| 北京 | 北京市 | 39.9042 | 116.4074 |\n| 莫斯科 | 俄罗斯联邦莫斯科 | 55.7558 | 37.6173 |\n| 上海 | 上海市 | 31.2304 | 121.4737 |\n| 瑞金（中央苏区） | 江西省瑞金市 | 25.8853 | 116.0271 |\n| 长汀 | 福建省龙岩市长汀县 | 25.8333 | 116.3333 |\n","relatedGraph": {"center": {"id": 337,"name": "瞿秋白","file": "瞿秋白.html","dynasty": "中国近现代（中华民国时期）","birth_year": 1899,"death_year": 1935,"time_year": 1924,"quote": "我总想为大家辟一条光明的路。","review": "","aliases": [],"foreign_name": "","domain_tag
