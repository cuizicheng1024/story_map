  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

的最初火种\n\n### 📍 重要地点：耒阳\n- **时间**：1928年\n- **停留时间**：短暂\n- **地点**：湖南耒阳（今湖南省衡阳市耒阳市）\n- **事件**：参加湘南起义，随起义部队上井冈山。\n- **意义**：晚年魂归耒阳，杨得志与昔日战友长眠于这片他为之奋斗终身的红土地。他用一生书写的革命精神和军事遗产，在耒阳的山水间永远回荡，激励后人不断前行\n\n### 📍 重要地点：井冈山\n- **时间**：1928年 - 1929年\n- **停留时间**：约1年\n- **地点**：井冈山（今江西省吉安市井冈山市）\n- **事件**：在红四军中历任排长、连长，参加井冈山革命根据地的斗争。\n- **意义**：晚年魂归耒阳，杨得志与昔日战友长眠于这片他为之奋斗终身的红土地。他用一生书写的革命精神和军事遗产，在耒阳的山水间永远回荡，激励后人不断前行争的锻炼，学习了毛泽东、朱德的军事思想。\n\n### 📍 重要地点：瑞金\n- **时间**：1930年 - 1934年（在中央苏区历任团长等职，具体任职时间存疑）\n- **停留时间**：约4年\n- **地点**：瑞金（今江西省赣州市瑞金市）\n- **事件**：在中央苏区历任团长等职，参加中央苏区历次反“围剿”作战。\n- **意义**：这片承载着杨得志革命初心与青春热血的土地，是他从农民之子走向共和国上将的起点。无论后来走过多远的山河，这里始终是他灵魂的原乡，他未竟的革命精神与军事遗产也在这片红土地里永远留存\n\n### 📍 重要地点：大渡河（安顺场）\n- **时间**：1935年\n- **停留时间**：短暂\n- **地点**：大渡河安顺场渡口（今四川省雅安市石棉县）\n- **事件**：长征中率红一团强渡大渡河，为红军主力打开北上通路。\n- **意义**：完成了长征中具有决定性意义的战斗任务，展现了卓越的指挥才能。\n- **名篇名句**：《杨得志回忆录》：详细记述了强渡大渡河的惊险过程。\n\n### 📍 重要地点：冀鲁豫边区\n- **时间**：1938年 - 1944年\n- **停留时间**：约6年\n- **地点**：冀鲁豫边区（主要活动区域包括今河北省南部、山东省西部、河南省北部，中心区域大致位于今河南省濮阳市辖区）\n- **事件**：任八路军冀鲁豫军区司令员，领导军民坚持平原游击战争，巩固和扩大了抗日根据地。\n- **意义**：独当一面，成为重要的战略区军事主官，为抗日战争胜利作出贡献。\n- **名篇名句**：《杨得志回忆录》：记述了在冀鲁豫地区开展游击战和根据地建设的经历。\n\n### 📍 重要地点：清风店\n- **时间**：1947年\n- **停留时间**：短暂\n- **地点**：清风店（今河北省定州市清风店镇）\n- **事件**：参与指挥清风店战役，歼灭国民党军主力一部。\n- **意义**：此役与随后的石家庄战役，开创了人民解放军夺取坚固设防大城市的先例。\n\n### 📍 重要地点：朝鲜\n- **时间**：1951年 - 1952年（参加抗美援朝，具体月份存疑）\n- **停留时间**：约1年（存疑）\n- **地点**：朝鲜（主要作战区域）\n- **事件**：任中国人民志愿军副司令员，参与指挥作战，后兼任志愿军第十九兵团司令员，指挥了上甘岭战役等重要战斗。\n- **意义**：晚年魂归耒阳，杨得志与昔日战友长眠于这片他为之奋斗终身的红土地。他用一生书写的革命精神和军事遗产，在耒阳的山水间永远回荡，激励后人不断前行\n- **名篇名句**：《杨得志回忆录》：详细回忆了上甘岭战役的指挥过程。\n\n### 📍 重要地点：济南\n- **时间**：1955年 - 1969年（主要任期）\n- **停留时间**：约14年\n- **地点**：济南（今山东省济南市）\n- **事件**：任济南军区司令员，致力于部队的现代化、正规化建设。\n- **意义**：晚年魂归耒阳，杨得志与昔日战友长眠于这片他为之奋斗终身的红土地。他用一生书写的革命精神和军事遗产，在耒阳的山水间永远回荡，激励后人不断前行作，巩固了国防。\n\n### 🔴 去世地：北京\n- **时间**：1994年\n- **停留时间**：晚年长期居住\n- **地点**：北京（今北京市）\n- **事件**：逝世。\n- **意义**：这片承载着杨得志革命初心与青春热血的土地，是他从农民之子走向共和国上将的起点。无论后来走过多远的山河，这里始终是他灵魂的原乡，他未竟的革命精神与军事遗产也在这片红土地里永远留存\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |
