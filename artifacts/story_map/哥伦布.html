  overflow: hidden;
  isolation: isolate;
}
.journey-pane-resizer {
  position: relative;
  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {
  font-weight: 600;
  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {
  filter: saturate(1.08);
}
.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {
  transform: translateY(-1px);

   disorders or distract users who have explicitly opted out. */

  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {

    transition: none !important;

}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }

   without committing to selection. */
.story-marker:hover .story-marker-badge {

/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */

  visibility: hidden;
  pointer-events: none;

   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

殖民扩张中的紧密结合。\n\n---","examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：哥伦布本人无文学作品传世，但其**航海日志**和写给西班牙王室的**信件**是重要的历史文献，常被节选作为了解其航行见闻和动机的材料。\n- 核心要点：\n    - **重点**：文献中体现了强烈的**宗教传播**动机，常将航行描述为“为上帝和国王陛下效力”。\n    - **重点**：对美洲“新世界”的**描述**充满了欧洲中心的想象，如将土著称为“印第安人”（Indians），误认为其土地是印度附近。\n    - 其文字记录了早期欧洲人对美洲**自然环境**（如植被、动物）和**原住民**的初步观察。\n    - **重点**：文献也暴露了其**殖民意图**，如对黄金的渴望和对占领土地的宣告。\n    - 风格上兼具**纪实性**与**宣传性**，旨在向资助者汇报成果并争取更多支持。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1492年**，在西班牙王室资助下，哥伦布船队抵达美洲，这一事件被传统史观视为“**地理大发现**”的标志性事件。\n    - 他至死坚信自己到达的是**亚洲**，其航行促进了“**地圆说**”的实践验证。\n    - **重点**：他的航行引发了“**哥伦布大交换**”，导致了旧大陆与新大陆之间**物种**（如马铃薯、玉米传入欧亚，马、牛传入美洲）、**疾病**（如天花传入美洲）和**文化**的全球性交流。\n    - 他担任过新发现土地的**总督**，但其殖民管理引发争议，最终被撤职。\n- 核心要点：\n    - **重点**：哥伦布是**欧洲大航海时代**的代表人物，其成功得益于当时的**航海技术**进步、**地圆说**知识传播以及欧洲对**东方财富**的渴望。\n    - **重点**：从**全球史**视角看，哥伦布航行是**世界历史**从分散走向整体的关键转折点之一。\n    - 对其评价存在**巨大争议**：传统观点颂扬其勇气与开拓精神；现代观点则批判其航行开启了**欧洲殖民主义**，给美洲原住民带来了**灾难性后果**（疾病、奴役、文化毁灭）。\n    - **重点**：他的活动体现了**国家支持**（西班牙王室）与**个人野心**（寻求财富、荣誉和封地）在早期殖民扩张中的紧密结合。\n\n---","workTexts": {},"workSummaries": {"圣塔菲协定": {"title": "圣塔菲协定","aliases": [],"authors": [],"related_people": ["哥伦布"],"source_pages": ["哥伦布"],"era": "","genre": "","one_liner": "哥伦布生于热那亚，后移居葡萄牙","summary": "哥伦布生于热那亚，后移居葡萄牙","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 哥伦布\n\n## 人物档案\n\n### 基本信息\n- **姓名**：克里斯托弗·哥伦布\n- **时代**：15世纪末至16世纪初（欧洲大航海时代）\n- **出生**：公元1451年，古称热那亚共和国（今意大利利古里亚大区热那亚）（具体日期存疑）\n- **去世**：公元1506年5月20日，古称卡斯蒂利亚王国巴利亚多利德（今西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德）\n- **享年**：存疑（约54-55岁，因具体出生日期不详）\n- **主要身份**：航海家、探险家、殖民者\n- **历史地位**：欧洲大航海时代的先驱，其航行开启了欧洲对美洲大陆的持续探索与殖民进程。\n- **主要成就**：1. 完成首次横渡大西洋的航行（1492年）；2. “发现”美洲新大陆（对欧洲而言）；3. 开辟了从欧洲到美洲的新航路；4. 促成欧洲与美洲之间持续的物种、文化与人口交流（哥伦布大交换）。\n\n### 生平概述\n哥伦布生于热那亚，后移居葡萄牙。他坚信地圆说，并计划向西航行到达亚洲。在葡萄牙王室拒绝其计划后，他转而寻求西班牙（卡斯蒂利亚）伊莎贝拉一世女王的支持。1492年，他率领船队从西班牙出发，横渡大西洋，抵达了他认为的“印度”，实则为美洲的巴哈马群岛。此后，他又进行了三次西航，到达了加勒比海诸岛及中美洲沿岸。他的航行虽未实现到达亚洲的初衷，却意外地为欧洲打开了通往美洲的大门，深刻改变了世界历史的进程。晚年，他在争议与失意中于西班牙去世。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：从地中海到大西洋，横跨欧洲与美洲大陆。\n- ⏱️ **时间跨度**：约1470年代至1506年，总跨度约30余年。\n- 📍 **地理范围**：覆盖今意大利、葡萄牙、西班牙、加那利群岛、巴哈马群岛、古巴、海地、牙买加、中美洲沿岸等地。\n- 🌟 **重要节点数量**：10个核心地点（含出生地、去世地及安葬地）。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：热那亚\n- **时间**：约公元1451年\n- **停留时间**：青少年时期（约20年）\n- **地点**：古称热那亚共和国（今意大利利古里亚大区热那亚）\n- **事件**：出生并成长于一个纺织工家庭，早年可能参与过海上贸易。\n- **意义**：地中海的盐风与父亲的羊毛账本，养大了热那亚港的织布工之子。罗盘针在指尖转动，东方香料的渴望与商人的精明一道被装入行囊，向西远航的野心就此在他血液里悄然生根\n\n### 📍 重要地点：里斯本\n- **时间**：约1476年-1485年\n- **停留时间**：约9年\n- **地点**：古称葡萄牙王国里斯本（今葡萄牙里斯本大区里斯本）\n- **事件**：移居当时欧洲的航海中心，学习航海知识、地图绘制，并参与了前往非洲等地的航行。在此期间形成了西航亚洲的构想。约1485年离开葡萄牙，前往西班牙寻求支持。\n- **意义**：大航海时代的心脏，海图与水手闲谈喂养了一个外乡人的野心。为热那亚同乡绘制地图的岁月里，西航构想悄然成胚，却因马拉诺血统遭若昂二世冷遇，他带着这颗种子转向了卡斯蒂利亚宫廷\n\n### 📍 重要地点：帕洛斯-德拉弗龙特拉\n- **时间**：1492年8月3日出发\n- **停留时间**：出发港，短暂停留\n- **地点**：古称卡斯蒂利亚王国帕洛斯港（今西班牙安达卢西亚自治区韦尔瓦省帕洛斯-德拉弗龙特拉）\n- **事件**：率领“圣玛丽亚号”、“平塔号”和“尼尼亚号”三艘帆船从这里启航，开始第一次西航。\n- **意义**：大航海时代的心脏，海图与水手闲谈喂养了一个外乡人的野心。为热那亚同乡绘制地图的岁月里，西航构想悄然成胚，却因马拉诺血统遭若昂二世冷遇，他带着这颗种子转向了卡斯蒂利亚宫廷\n\n### 📍 重要地点：加那利群岛（戈梅拉岛）\n- **时间**：1492年9月\n- **停留时间**：约1个月\n- **地点**：古称加那利群岛（今西班牙加那利群岛戈梅拉岛）\n- **事件**：船队在此进行最后的休整和补给，修理船只。\n- **意义**：十五年间，他在这里娶妻生子、绘制海图、聆听大西洋的传说。里斯本是哥伦布从地中海渔民蜕变为大西洋冒险家的熔炉，也是他一次次向王室陈情却屡屡碰壁的失意之城\n\n### 📍 重要地点：圣萨尔瓦多岛（华特林岛）\n- **时间**：1492年10月12日\n- **停留时间**：数日\n- **地点**：古称瓜纳哈尼岛（今巴哈马国圣萨尔瓦多岛/华特林岛）\n- **事件**：船队首次登陆美洲土地，与当地泰诺人接触。哥伦布宣布为西班牙国王占领此地，并误以为到达了亚洲的印度附近岛屿。\n- **意义**：十五年间，他在这里娶妻生子、绘制海图、聆听大西洋的传说。里斯本是哥伦布从地中海渔民蜕变为大西洋冒险家的熔炉，也是他一次次向王室陈情却屡屡碰壁的失意之城\n\n### 📍 重要地点：古巴岛（东北海岸）\n- **时间**：1492年10月末-11月\n- **停留时间**：约一个月\n- **地点**：古称胡安娜岛（今古巴岛东北部）\n- **事件**：沿古巴海岸探索，坚信这是亚洲大陆（可能是中国或日本的一部分）。派遣使团寻找内陆的“可汗”宫殿。\n- **意义**：他最终在这座城市合上航海日志，身后留下四个世纪的争议与荣光。银匠塔的钟声日日敲响，纪念着一位从未真正停泊的水手——棺椁虽静，历史的潮汐却从未止息\n\n### 📍 重要地点：伊斯帕尼奥拉岛（海地岛）\n- **时间**：1492年12月-1493年1月（首次航行）；后续航行多次返回\n- **停留时间**：首次停留数周，后建立殖民据点\n- **地点**：古称伊斯帕尼奥拉岛（今海地与多米尼加共和国所在岛屿，首次登陆点约在今海地角附近）\n- **事件**：在圣诞日，“圣玛丽亚号”在此搁浅。哥伦布利用船材建立了欧洲在美洲的第一个定居点“拉纳维达德”。后因与土著冲突，据点被毁。\n- **意义**：西班牙在美洲的第一个永久定居尝试的起点，也是后续殖民扩张的基地。\n\n### 📍 重要地点：委内瑞拉沿岸（南美大陆）\n- **时间**：1498年8月（第三次航行）\n- **停留时间**：短暂登陆\n- **地点**：古称帕里亚半岛（今委内瑞拉苏克雷州帕里亚半岛，具体登陆点存疑）\n- **事件**：首次踏上南美大陆，观察到奥里诺科河淡水入海，推测存在巨大陆地。\n- **意义**：贝伦塔旁的发现者纪念碑上，哥伦布昂立船首，与恩里克王子、达·伽马一同凝视大海。这位意大利人虽长眠于塞维利亚，但葡人从未忘记——他的航海之梦正是从这片港湾启航\n\n### 📍 重要地点：牙买加岛\n- **时间**：1503年6月-1504年6月（第四次航行期间）\n- **停留时间**：约一年\n- **地点**：古称牙买加岛（今牙买加）\n- **事件**：因船只严重损毁，哥伦布与船员被困于此长达一年，依靠与土著交易和月食预言维持生存，最终获救。\n- **意义**：哥伦布航海生涯中最艰难困顿的时期之一，显示了其探险活动的巨大风险。\n\n### 🔴 去世地：巴利亚多利德\n- **时间**：公元1506年5月20日\n- **停留时间**：晚年大部分时间\n- **地点**：古称卡斯蒂利亚王国巴利亚多利德（今西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德）\n- **事件**：在健康状况不佳和未获国王兑现承诺的沮丧中去世。\n- **意义**：一代航海探险家的终点，其遗产（地理发现权与利益）在此后数十年间由其继承人与西班牙王室反复诉讼争夺。\n\n### 📍 安葬地：塞维利亚\n- **时间**：最初安葬于巴利亚多利德，后迁葬\n- **性质**：永久安葬地\n- **地点**：古称卡斯蒂利亚王国塞维利亚（今西班牙安达卢西亚自治区塞维利亚）\n- **事件**：哥伦布的遗骨最初安葬于巴利亚多利德，后迁至塞维利亚大教堂。\n- **意义**：贝伦塔旁的发现者纪念碑上，哥伦布昂立船首，与恩里克王子、达·伽马一同凝视大海。这位意大利人虽长眠于塞维利亚，但葡人从未忘记——他的航海之梦正是从这片港湾启航\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约1451年 | 热那亚 | 意大利利古里亚大区热那亚 | （年龄：0岁）出生于热那亚 |\n| 约1476年 | 里斯本 | 葡萄牙里斯本大区里斯本 | （年龄：约25岁）移居葡萄牙里斯本 |\n| 1485年 |  |  | （年龄：约34岁）离开葡萄牙，前往西班牙寻求支持 |\n| 1492年 |  |  | （年龄：约41岁）获西班牙女王支持；4月签订《圣塔菲协定》；8月3日首次西航出发；10月12日抵达美洲 |\n| 1493年 |  |  | （年龄：约42岁）3月返回西班牙，受到隆重欢迎；9月率领庞大船队开始第二次航行 |\n| 1498年 | 委内瑞拉沿岸（南美大陆） |  | （年龄：约47岁）进行第三次航行，首次踏上南美大陆（今委内瑞拉沿岸） |\n| 1502年 |  |  | （年龄：约51岁）开始第四次航行，探索中美洲沿岸 |\n| 1504年 |  |  | （年龄：约53岁）第四次航行结束，返回西班牙 |\n| 1506年 | 巴利亚多利德 | 西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德 | （年龄：约54-55岁）5月20日在巴利亚多利德去世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：哥伦布本人无文学作品传世，但其**航海日志**和写给西班牙王室的**信件**是重要的历史文献，常被节选作为了解其航行见闻和动机的材料。\n- 核心要点：\n    - **重点**：文献中体现了强烈的**宗教传播**动机，常将航行描述为“为上帝和国王陛下效力”。\n    - **重点**：对美洲“新世界”的**描述**充满了欧洲中心的想象，如将土著称为“印第安人”（Indians），误认为其土地是印度附近。\n    - 其文字记录了早期欧洲人对美洲**自然环境**（如植被、动物）和**原住民**的初步观察。\n    - **重点**：文献也暴露了其**殖民意图**，如对黄金的渴望和对占领土地的宣告。\n    - 风格上兼具**纪实性**与**宣传性**，旨在向资助者汇报成果并争取更多支持。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1492年**，在西班牙王室资助下，哥伦布船队抵达美洲，这一事件被传统史观视为“**地理大发现**”的标志性事件。\n    - 他至死坚信自己到达的是**亚洲**，其航行促进了“**地圆说**”的实践验证。\n    - **重点**：他的航行引发了“**哥伦布大交换**”，导致了旧大陆与新大陆之间**物种**（如马铃薯、玉米传入欧亚，马、牛传入美洲）、**疾病**（如天花传入美洲）和**文化**的全球性交流。\n    - 他担任过新发现土地的**总督**，但其殖民管理引发争议，最终被撤职。\n- 核心要点：\n    - **重点**：哥伦布是**欧洲大航海时代**的代表人物，其成功得益于当时的**航海技术**进步、**地圆说**知识传播以及欧洲对**东方财富**的渴望。\n    - **重点**：从**全球史**视角看，哥伦布航行是**世界历史**从分散走向整体的关键转折点之一。\n    - 对其评价存在**巨大争议**：传统观点颂扬其勇气与开拓精神；现代观点则批判其航行开启了**欧洲殖民主义**，给美洲原住民带来了**灾难性后果**（疾病、奴役、文化毁灭）。\n    - **重点**：他的活动体现了**国家支持**（西班牙王室）与**个人野心**（寻求财富、荣誉和封地）在早期殖民扩张中的紧密结合。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 热那亚，意大利 | 44.4056 | 8.9463 |\n| 里斯本，葡萄牙 | 38.7223 | -9.1393 |\n| 帕洛斯-德拉弗龙特拉，西班牙 | 37.2333 | -6.9333 |\n| 戈梅拉岛，加那利群岛，西班牙 | 28.1000 | -17.2000 |\n| 圣萨尔瓦多岛，巴哈马 | 24.0500 | -74.5333 |\n| 古巴岛东北部（近似坐标），古巴 | 21.5000 | -77.0000 |\n| 海地角，海地 | 19.7578 | -72.2042 |\n| 牙买加岛，牙买加 | 18.4333 | -77.2000 |\n| 巴利亚多利德，西班牙 | 41.6523 | -4.7245 |\n| 塞维利亚，西班牙（哥伦布安葬地） | 37.3891 | -5.9845 |","relatedGraph": {"center": {"id": "哥伦布","name": "哥伦布","file": "哥伦布.html","dynasty": "15世纪末至16世纪初（欧洲大航海时代）","aliases": [],"birth_year": 1451,"death_year": 1506,"quote": "为上帝和国王陛下效力","review": "","foreign_name": "","main_role_label": "其他","birthplace": "古称热那亚共和国","birthplace_modern": "意大利利古里亚大区热那亚","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},"nodes": [{"id": "哥伦布","name": "哥伦布","file": "哥伦布.html","dynasty": "15世纪末至16世纪初（欧洲大航海时代）","aliases": [],"birth_year": 1451,"death_year": 1506,"quote": "为上帝和国王陛下效力","review": "","foreign_name": "","main_role_label": "其他","birthplace": "古称热那亚共和国","birthplace_modern": "意大利利古里亚大区热那亚","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},{"id": "麦哲伦","name": "麦哲伦","file": "麦哲伦.html","dynasty": "地理大发现时代（15世纪末-16世纪初）","aliases": [],"birth_year": 1480,"death_year": 1521,"quote": "麦哲伦出生于葡萄牙，早年曾参与葡萄牙对东方的殖民探险","review": "","foreign_name": "","main_role_label": "其他","birthplace": "葡萄牙王国波尔图","birthplace_modern": "葡萄牙波尔图","domain_tags": [],"has_story": true,"relationLabel": "同时代人物","sourceType": "fallback","confidence": null,"isCenter": false},{"id": "马丁·路德","name": "马丁·路德","file": "马丁·路德.html","dynasty": "16世纪欧洲（德意志地区，神圣罗马帝
