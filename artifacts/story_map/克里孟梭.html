/* UX3: skeleton shimmer for the title placeholder while tiles are

   retrigger paint on parent cards. */

  color: transparent;

  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}

  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }

    transition: none !important;

   line-blur on hover/select; combined with the will-change from P4 it

  visibility: hidden;

   line — the route markers alone convey direction. */

  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}

  .map-segment-arrow { display: none; }
}

点（按时间顺序）\n### 🟢 出生地：穆耶龙昂帕雷\n- **时间**：1841年\n- **停留时间**：童年及青少年时期（约18年）\n- **地点**：穆耶龙昂帕雷（今法国卢瓦尔河地区大区旺代省）\n- **事件**：出生于一个具有共和思想的医生家庭，父亲本杰明·克里孟梭对他影响深远。\n- **意义**：父亲坚定的共和信念与旺代浓烈的保皇土壤形成剧烈撕扯，少年克里孟梭自幼便将共和视作信仰、将教权视作死敌——这成为他日后政治生命的底色\n\n### 📍 重要地点：南特\n- **时间**：约1858-1860年\n- **停留时间**：约2年\n- **地点**：南特（今法国卢瓦尔河地区大区大西洋卢瓦尔省省会）\n- **事件**：在此接受中学教育。\n- **意义**：南特任上的铁腕镇压，让他首次尝到执政的滋味——罢工者闻风丧胆，政敌噤若寒蝉，这段经历为他日后主掌战时法国埋下最关键的预演\n\n### 📍 重要地点：巴黎（学医时期）\n- **时间**：1860-1865年\n- **停留时间**：约5年\n- **地点**：巴黎（今法国法兰西岛大区巴黎市）\n- **事件**：在巴黎大学攻读医学，同时积极参与反对拿破仑三世第二帝国的政治活动，创办激进报刊。\n- **意义**：南特任上的铁腕镇压，让他首次尝到执政的滋味——罢工者闻风丧胆，政敌噤若寒蝉，这段经历为他日后主掌战时法国埋下最关键的预演展现了其政治锋芒与新闻才能。\n\n### 📍 重要地点：美国（流亡与婚姻）\n- **时间**：1865-1869年\n- **停留时间**：约4年\n- **地点**：主要活动于美国纽约州纽约市及康涅狄格州（今美国纽约州、康涅狄格州）\n- **事件**：因政治原因短暂移居美国，以教授法语和绘画为生。婚姻具体时间说法不一，待考。\n- **意义**：体验了不同的政治与社会环境，婚姻生活对其早期思想产生一定影响。\n\n### 📍 重要地点：巴黎（蒙马特区长时期）\n- **时间**：1870年代至20世纪初\n- **停留时间**：长期居住\n- **地点**：巴黎（今法国法兰西岛大区巴黎市）\n- **事件**：第三共和国成立后回国，1871年当选巴黎蒙马特区区长，后长期担任国民议会议员。以激烈的演说和无情的质询闻名，获得“老虎”绰号。创办《正义报》，成为激进共和派核心人物。\n- **意义**：南特任上的铁腕镇压，让他首次尝到执政的滋味——罢工者闻风丧胆，政敌噤若寒蝉，这段经历为他日后主掌战时法国埋下最关键的预演\n\n### 📍 重要地点：巴黎（首次总理任期）\n- **时间**：1906-1909年\n- **停留时间**：约3年\n- **地点**：巴黎（马提尼翁宫，总理府）（今法国法兰西岛大区巴黎市）\n- **事件**：出任内政部长，后成为总理。任内强硬镇压矿工罢工，处理政教分离后续事宜。\n- **意义**：1876年当选南特工人区议员，克雷孟梭的政坛利爪首露于此。他以凌厉辩锋猛攻麦克马洪的保守秩序，\"老虎\"之号由此传开。与工人并肩捍卫共和的历练，悄然铸就他日后率法国赢得大战的铁血意志\n\n### 📍 重要地点：巴黎（战时总理任期）\n- **时间**：1917-1920年\n- **停留时间**：约3年\n- **地点**：巴黎（马提尼翁宫及战争指挥中心）（今法国法兰西岛大区巴黎市）\n- **事件**：1917年11月，在法军士气低落、国内厌战情绪蔓延时出任总理兼陆军部长。亲赴前线鼓舞士气，整合协约国指挥权，坚持“战争至上”原则，最终领导法国取得胜利。\n- **意义**：其政治生涯的巅峰，被誉为“胜利之父”，在法国历史上留下深刻印记。\n\n### 📍 重要地点：凡尔赛（巴黎和会）\n- **时间**：1919年\n- **停留时间**：约数月\n- **地点**：凡尔赛（今法国法兰西岛大区伊夫林省凡尔赛市）\n- **事件**：作为法国首席代表出席巴黎和会，力主严厉制裁德国，主导《凡尔赛和约》的签订。\n- **意义**：主导了战后欧洲新秩序的构建，其强硬立场深刻影响了《凡尔赛和约》的内容。\n\n### 🔴 去世地：巴黎（晚年）\n- **时间**：1929年\n- **停留时间**：晚年长期居住\n- **地点**：巴黎（今法国法兰西岛大区巴黎市）\n- **事件**：退出政坛后隐居巴黎，从事写作，直至去世。法国为其举行了国葬。\n- **意义**：一代政治强人的生命终点，其遗产（尤其是对德强硬政策）持续影响法国乃至欧洲政治。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1841 | 穆耶
