  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

*1913年**，泰戈尔因诗集《吉檀迦利》获得**诺贝尔文学奖**，成为首位获此殊荣的亚洲人，标志着东方文学获得世界性认可。\n    - **重点**：他创作的歌曲《**人民的意志**》于1950年被定为**印度共和国国歌**。\n    - 1919年，因**阿姆利则惨案**，愤而放弃英国政府授予的**爵士**封号，展现其反殖民立场。\n    - 1924年访问中国，是近代**中印文化交流**的重要事件。\n    - 创办**圣地尼克坦国际大学**，倡导东西方文化融合的教育模式。\n- 核心要点：\n    - **重点**：泰戈尔是**印度文艺复兴**（又称“孟加拉文艺复兴”）的杰出代表，其活动与成就紧密关联于**印度民族意识觉醒**的时代背景。\n    - **重点**：他的思想与创作具有鲜明的**国际主义**和**人道主义**色彩，反对狭隘的民族主义与战争，致力于促进**人类精神团结**。\n    - **重点**：作为**殖民地知识分子**的典范，他既深刻批判西方殖民主义与物质主义，又积极吸收西方人文思想，致力于在传统与现代、东方与西方之间寻找平衡。\n    - 其文学与社会活动，使他成为**印度现代文化**的象征和**亚洲文化自信**的重要代表人物。\n    - 他的世界观融合了印度教**吠檀多哲学**、伊斯兰**苏菲主义**以及西方**浪漫主义**与**人文主义**思想。\n\n---", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《金色花》**（散文诗）、**《告别》**（散文诗，常与《金色花》合为《散文诗两首》）、**《吉檀迦利》**（节选）、**《飞鸟集》**（节选诗句）。\n- 核心要点：\n    - **重点**：**《金色花》** 以儿童视角和奇特的想象，通过“变成一朵金色花”与母亲嬉戏的描写，表达了对**母爱**的依恋与歌颂，体现了人与神、自然与人的和谐。\n    - **重点**：作品充满浓郁的**抒情性**和**哲理性**，善于捕捉自然界的细微意象（如花、鸟、云、溪流）来寄托深邃的思想。\n    - **重点**：风格清新隽永，语言**质朴**而**优美**，具有**泛神论**的色彩，将神置于自然与日常生活中加以颂扬。\n    - 常见主题包括对**童真**、**自然**、**生命**、**爱**与**自由**的赞美。\n    - 艺术手法上，大量运用**象征**、**比喻**和**拟人**，营造出宁静、神秘而又充满生机的意境。\n    - 其诗歌体现了**印度传统文化**的深厚底蕴与对**人类普遍精神价值**的追求。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1913年**，泰戈尔因诗集《吉檀迦利》获得**诺贝尔文学奖**，成为首位获此殊荣的亚洲人，标志着东方文学获得世界性认可。\n    - **重点**：他创作的歌曲《**人民的意志**》于1950年被定为**印度共和国国歌**。\n    - 1919年，因**阿姆利则惨案**，愤而放弃英国政府授予的**爵士**封号，展现其反殖民立场。\n    - 1924年访问中国，是近代**中印文化交流**的重要事件。\n    - 创办**圣地尼克坦国际大学**，倡导东西方文化融合的教育模式。\n- 核心要点：\n    - **重点**：泰戈尔是**印度文艺复兴**（又称“孟加拉文艺复兴”）的杰出代表，其活动与成就紧密关联于**印度民族意识觉醒**的时代背景。\n    - **重点**：他的思想与创作具有鲜明的**国际主义**和**人道主义**色彩，反对狭隘的民族主义与战争，致力于促进**人类精神团结**。\n    - **重点**：作为**殖民地知识分子**的典范，他既深刻批判西方殖民主义与物质主义，又积极吸收西方人文思想，致力于在传统与现代、东方与西方之间寻找平衡。\n    - 其文学与社会活动，使他成为**印度现代文化**的象征和**亚洲文化自信**的重要代表人物。\n    - 他的世界观融合了印度教**吠檀多哲学**、伊斯兰**苏菲主义**以及西方**浪漫主义**与**人文主义**思想。\n\n---", "workTexts": {"吉檀迦利": "你是什么人，读者，百年后读着我的诗？", "飞鸟集": "世界以痛吻我，要我报之以歌。", "你创造的道路": "我旅行的时间很长，旅途也是很长的。", "金色花": "“变成一朵金色花”", "**人民的意志**": "重点：他创作的歌曲《人民的意志》于1950年被定为印度共和国国歌。"}, "workSummaries": {"吉檀迦利": {"titl 期（19世纪末至20世纪上半叶）\n- **出生**：公元1861年5月7日，加尔各答（今印度西孟加拉邦加尔各答市）\n- **去世**：公元1941年8月7日，加尔各答（今印度西孟加拉邦加尔各答市）\n- **享年**：80岁\n- **主要身份**：诗人、作家、哲学家、社会活动家、艺术家、作曲家\n- **历史地位**：亚洲首位诺贝尔文学奖得主，印度近现代文学与文化的奠基人之一。\n- **主要成就**：\n    1. 1913年凭借诗集《吉檀迦利》成为首位获得诺贝尔文学奖的亚洲人。\n    2. 创作了包括诗歌、小说、戏剧、歌曲在内的大量作品，其创作的歌曲《人民的意志》和《 Amar Sonar Bangla》（《金色的孟加拉》）被分别定为印度和孟加拉国国歌。\n    3. 创办了圣地尼克坦国际大学（后发展为世界大学），实践其教育理想。\n    4. 在音乐与绘画领域亦有卓越成就，其画作具有独特风格。\n    5. 积极参与印度民族独立运动与国际反战和平运动。\n    6. 1915年获英国爵士封号（后于1919年放弃）。\n\n### 生平概述\n泰戈尔出生于加尔各答一个富有的启蒙思想家庭，自幼显露文学才华。他生活在印度民族意识觉醒与英国殖民统治深化的矛盾时代，其作品融合了印度古典哲学、西方人文主义与对自然的深邃感悟，充满了对神、生命、爱与自由的歌颂。他不仅是一位多产的文学巨匠，更是一位积极的社会改革者与教育家，通过创办学校、环球旅行与讲学，致力于东西方文化交流与人类精神和谐。他的足迹遍布亚洲、欧洲与美洲，其思想与艺术对世界文学产生了深远影响。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：加尔各答\n- **时间**：1861年\n- **停留时间**：童年及青少年时期主要居所\n- **地点**：加尔各答（今印度西孟加拉邦加尔各答市）\n- **事件**：出生于一个主张改革的婆罗门家庭，家中浓厚的文艺与哲学氛围塑造了他的早期思想。\n- **意义**：其文化启蒙与人格形成之地，家族环境是其日后文学与社会活动的起点。\n\n### 📍 重要地点：圣地尼克坦\n- **时间**：1901年起，此后大部分时间居此\n- **停留时间**：断续居住约40年\n- **地点**：圣地尼克坦（今印度西孟加拉邦博尔普尔县）\n- **事件**：在此创办了一所露天学校（后发展为国际大学），实践其融合自然、艺术与文化的教育理念。\n- **意义**：其教育理想与大部分文学艺术创作的实践地与精神家园，是其后期生活和工作的中心。\n- **名篇名句**：《吉檀迦利》：“你是什么人，读者，百年后读着我的诗？”；《飞鸟集》：“世界以痛吻我，要我报之以歌。”\n\n### 📍 重要地点：伦敦\n- **时间**：1878年；1912年；1920年代等多次\n- **停留时间**：数次短期访问与游学\n- **地点**：伦敦（今英国伦敦）\n- **事件**：首次赴英学习法律（未完成）；1912年携带自译《吉檀迦利》手稿访英，得到叶芝等文坛巨匠激赏，为其赢得世界声誉奠定基础。\n- **意义**：其作品走向西方世界的桥梁，也是他接触与反思西方现代文明的重要窗口。\n\n### 📍 重要地点：柏林\n- **时间**：1921年；1926年等\n- **停留时间**：短期访问讲学\n- **地点**：柏林（今德国柏林）\n- **事件**：在德国多所大学发表演讲，引起巨大反响，其思想在战后欧洲寻找精神出路的氛围中受到欢迎。\n- **意义**：泰戈尔生命最后的岁月都消磨在他亲手开辟的这片土地上。1901年创办学校，1941年辞世，这里是他诗篇的最终读者，也是世界大学理想的实验场。他的骨灰长眠于亲手植下的树荫间，圣地尼克坦就是他留给世界的精神原乡\n\n### 📍 重要地点：上海、杭州、南京、济南、北京\n- **时间**：1924年4月至5月\n- **停留时间**：约五十天\n- **地点**：上海、杭州、南京、济南、北京（今中国上海市、浙江省杭州市、江苏省南京市、山东省济南市、北京市）\n- **事件**：应梁启超、蔡元培等人之邀访问中国，在多所大学及文化团体演讲，与徐志摩、梅兰芳等文化名流交流。\n- **意义**：近代中印文化交流史上的盛事，其人道主义思想与文学风格对当时中国文坛产生影响。\n- **名篇名句**：访问期间演讲：“你们伟大的文明，是时间与耐力的产物。”\n\n### 📍 重要地点：东京\n- **时间**：1916年；1924年；1929年\n- **停留时间**：数次短期访问\n- **地点**：东京（今日本东京都）\n- **事件**：多次访问日本并发表演讲，其诗歌与思想在日本知识界广受欢迎。\n- **意义**：泰戈尔生命最后的岁月都消磨在他亲手开辟的这片土地上。1901年创办学校，1941年辞世，这里是他诗篇的最终读者，也是世界大学理想的实验场。他的骨灰长眠于亲手植下的树荫间，圣地尼克坦就是他留给世界的精神原乡文学的重要一站。\n\n### 📍 重要地点：美国诸城\n- **时间**：1916-1917年；1920-1921年等\n- **停留时间**：数次访问，每次数周至数月\n- **地点**：旧金山、芝加哥、纽约、波士顿等（今美国加利福尼亚州旧金山市、伊利诺伊州芝加哥市、纽约州纽约市、马萨诸塞州波士顿市）\n- **事件**：在美国进行巡回演讲，主题涉及民族主义、教育、东西方文明等，其反战与精神主义观点引发讨论与争议。\n- **意义**：将其思想传播至北美，同时也对西方物质主义与军国主义进行了深刻反思。\n\n### 📍 重要地点：德黑兰\n- **时间**：1932年\n- **停留时间**：短期访问\n- **地点**：德黑兰（今伊朗德黑兰省德黑兰市）\n- **事件**：访问伊朗，受到礼遇，与当地文化界交流。\n- **意义**：泰戈尔生命最后的岁月都消磨在他亲手开辟的这片土地上。1901年创办学校，1941年辞世，这里是他诗篇的最终读者，也是世界大学理想的实验场。他的骨灰长眠于亲手植下的树荫间，圣地尼克坦就是他留给世界的精神原乡\n\n### 📍 重要地点：莫斯科\n- **时间**：1930年\n- **停留时间**：短期访问\n- **地点**：莫斯科（今俄罗斯莫斯科市）\n- **事件**：访问苏联，对其教育普及与社会实验表示赞赏，但也对其某些集权倾向有所保留。\n- **意义**：泰戈尔生命最后的岁月都消磨在他亲手开辟的这片土地上。1901年创办学校，1941年辞世，这里是他诗篇的最终读者，也是世界大学理想的实验场。他的骨灰长眠于亲手植下的树荫间，圣地尼克坦就是他留给世界的精神原乡\n\n### 📍 重要地点：锡兰（斯里兰卡）\n- **时间**：1928年；1934年\n- **停留时间**：短期访问\n- **地点**：科伦坡等（今斯里兰卡西部省科伦坡市）\n- **事件**：访问锡兰，受到热烈欢迎，进行演讲与文化交流。\n- **意义**：父亲1863年买下这片红土地时，泰戈尔年幼，随母来此便与娑罗双树、沙土小径结下终生之缘。他在此著述直至1941年辞世，遗骨遵遗嘱火化于此，遂成其精神遗产永久栖居之所\n\n### 🔴 去世地：加尔各答\n- **时间**：1941年8月7日\n- **停留时间**：晚年最后岁月\n- **地点**：加尔各答（今印度西孟加拉邦加尔各答市）\n- **事件**：在祖宅“和平之院”病逝。\n- **意义**：父亲1863年买下这片红土地时，泰戈尔年幼，随母来此便与娑罗双树、沙土小径结下终生之缘。他在此著述直至1941年辞世，遗骨遵遗嘱火化于此，遂成其精神遗产永久栖居之所\n- **名篇名句**：临终诗作《你创造的道路》：“我旅行的时间很长，旅途也是很长的。”\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1861 | 加尔各答 | 印度西孟加拉邦加尔各答市 | （年龄：0）出生于加尔各答 |\n| 1878 | 伦敦 | 英国伦敦 | （年龄：17）首次赴英国留学（伦敦） |\n| 1883 |  |  | （年龄：22）结婚 |\n| 1901 | 圣地尼克坦 | 印度西孟加拉邦博尔普尔县 | （年龄：40）在圣地尼克坦创办实验学校 |\n| 1912 |  |  | （年龄：51）第二次访英，自译《吉檀迦利》获盛赞 |\n| 1913 |  |  | （年龄：52）获诺贝尔文学奖 |\n| 1915 |  |  | （年龄：54）获英国爵士封号 |\n| 1916 |  |  | （年龄：55）首次访问日本与美国 |\n| 1919 |  |  | （年龄：58）为抗议阿姆利则惨案，放弃英国爵士封号 |\n| 1921 | 圣地尼克坦 | 印度西孟加拉邦博尔普尔县 | （年龄：60）圣地尼克坦学校发展为国际大学 |\n| 1924 |  |  | （年龄：63）访问中国 |\n| 1930 |  |  | （年龄：69）访问苏联 |\n| 1941 | 加尔各答 | 印度西孟加拉邦加尔各答市 | （年龄：80）在加尔各答逝世 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《金色花》**（散文诗）、**《告别》**（散文诗，常与《金色花》合为《散文诗两首》）、**《吉檀迦利》**（节选）、**《飞鸟集》**（节选诗句）。\n- 核心要点：\n    - **重点**：**《金色花》** 以儿童视角和奇特的想象，通过“变成一朵金色花”与母亲嬉戏的描写，表达了对**母爱**的依恋与歌颂，体现了人与神、自然与人的和谐。\n    - **重点**：作品充满浓郁的**抒情性**和**哲理性**，善于捕捉自然界的细微意象（如花、鸟、云、溪流）来寄托深邃的思想。\n    - **重点**：风格清新隽永，语言**质朴**而**优美**，具有**泛神论**的色彩，将神置于自然与日常生活中加以颂扬。\n    - 常见主题包括对**童真**、**自然**、**生命**、**爱**与**自由**的赞美。\n    - 艺术手法上，大量运用**象征**、**比喻**和**拟人**，营造出宁静、神秘而又充满生机的意境。\n    - 其诗歌体现了**印度传统文化**的深厚底蕴与对**人类普遍精神价值**的追求。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**1913年**，泰戈尔因诗集《吉檀迦利》获得**诺贝尔文学奖**，成为首位获此殊荣的亚洲人，标志着东方文学获得世界性认可。\n    - **重点**：他创作的歌曲《**人民的意志**》于1950年被定为**印度共和国国歌**。\n    - 1919年，因**阿姆利则惨案**，愤而放弃英国政府授予的**爵士**封号，展现其反殖民立场。\n    - 1924年访问中国，是近代**中印文化交流**的重要事件。\n    - 创办**圣地尼克坦国际大学**，倡导东西方文化融合的教育模式。\n- 核心要点：\n    - **重点**：泰戈尔是**印度文艺复兴**（又称“孟加拉文艺复兴”）的杰出代表，其活动与成就紧密关联于**印度民族意识觉醒**的时代背景。\n    - **重点**：他的思想与创作具有鲜明的**国际主义**和**人道主义**色彩，反对狭隘的民族主义与战争，致力于促进**人类精神团结**。\n    - **重点**：作为**殖民地知识分子**的典范，他既深刻批判西方殖民主义与物质主义，又积极吸收西方人文思想，致力于在传统与现代、东方与西方之间寻找平衡。\n    - 其文学与社会活动，使他成为**印度现代文化**的象征和**亚洲文化自信**的重要代表人物。\n    - 他的世界观融合了印度教**吠檀多哲学**、伊斯兰**苏菲主义**以及西方**浪漫主义**与**人文主义**思想。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| --- | --- | --- |\n| 印度加尔各答 | 22.5726 | 88.3639 |\n| 印度西孟加拉邦博尔普尔县圣地尼克坦 | 23.6815 | 87.6855 |\n| 英国伦敦 | 51.5074 | -0.1278 |\n| 德国柏林 | 52.5200 | 13.4050 |\n| 中国上海 | 31.2304 | 121.4737 |\n| 中国南京 | 32.0603 | 118.7969 |\n| 中国济南 | 36.6512 | 116.9972 |\n| 中国北京 | 39.9042 | 116.4074 |\n| 日本东京 | 35.6762 | 139.6503 |\n| 美国纽约 | 40.7128 | -74.0060 |\n| 美国旧金山 | 37.7749 | -122.4194 |\n| 美国芝加哥 | 41.8781 | -87.6298 |\n| 美国波士顿 | 42.3601 | -71.0589 |\n| 伊朗德黑兰 | 35.6892 | 51.3890 |\n| 俄罗斯莫斯科 | 55.7558 | 37.6173 |\n| 斯里兰卡科伦坡 | 6.9271 | 79.8612 |", "relatedGraph": {"center": {"id": "泰戈尔", "name": "泰戈尔", "file": "泰戈尔.html", "dynasty": "英属印度时期（19世纪末至20世纪上半叶）", "aliases": [], "birth_year": 1861, "death_year": 1941, "quote": "你是什么人，读者，百年后读着我的诗？", "review": "你是什么人，读者，百年后读着我的诗？", "foreign_name": "", "main_role_label": "诗人", "birthplace": "加尔各答", "birthplace_modern": "印度西孟加拉邦加尔各答市", "domain_tags": [], "has_sto
