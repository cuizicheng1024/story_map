  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

百官；利用**锦衣卫**实行特务统治。\n- **社会经济**：推行**里甲制**和**户籍制度**（黄册、鱼鳞图册），严格控制人口与土地；实施**移民屯田**政策。\n- **思想文化**：推崇**程朱理学**为官方哲学；实行**八股取士**，束缚知识分子思想。\n- **分封藩王**：为巩固边防和皇室，**分封诸子为王**，赋予军事权力，埋下**靖难之役**的隐患。\n- **历史评价**：认识其作为**开国皇帝**的双重性：**恢复生产、加强集权**的积极作用，与**君主专制强化、文化控制**带来的消极影响。\n\n---","examPoints": "### 初中阶段\n1.  **明朝建立三要素**：时间（**1368年**）、建立者（**朱元璋**）、都城（**应天府**）。\n2.  **强化皇权的核心措施**：中央**废丞相**，权分六部；地方**废行省**，设三司。\n3.  **特务机构**：明太祖设**锦衣卫**；明成祖设**东厂**（易混点）。\n4.  **科举考试**：**八股取士**的特点（内容、格式、影响）。\n5.  **经济恢复政策**：鼓励**垦荒**、兴修**水利**。\n6.  **重要人物关系**：朱元璋与**马皇后**、**太子朱标**、**皇太孙朱允炆**的关系。\n7.  **重大案件**：**胡惟庸案**（废丞相）、**蓝玉案**（打击功臣）的目的与影响。\n8.  **都城变迁**：明朝初建于南京，后**明成祖迁都北京**（“天子守国门”）。\n\n### 高中阶段\n1.  **元明之际的社会矛盾**：**民族矛盾**（元朝四等人制）与**阶级矛盾**（土地兼并、赋役沉重）的交织。\n2.  **朱元璋取胜的原因**：**战略得当**（“高筑墙、广积粮、缓称王”）、**善于用人**、**军队纪律严明**、**对手失误**等。\n3.  **明朝政治制度的特点**：**君主专制空前强化**的表现（废丞相、设厂卫、八股取士）。\n4.  **《大明律》与重典治吏**：了解其**重典治国**思想，特别是对**贪污**的严厉惩处。\n5.  **户籍与土地制度**：**黄册**（户籍）和**鱼鳞图册**（土地）的作用与目的。\n6.  **分封制的隐患**：**藩王势力**膨胀与中央集权的矛盾，直接导致**靖难之役**。\n7.  **历史概念辨析**：**“胡蓝之狱”** 的性质；**内阁**制度在明太祖时期的萌芽（殿阁大学士）。\n8.  **综合评价**：结合**加强中央集权**、**恢复社会经济**、**文化专制**等方面，对朱元璋进行**辩证评价**。","workTexts": {"御制皇陵碑": "殡无棺椁，被体恶裳，浮掩三尺，奠何殽浆！","谕中原檄": "驱逐胡虏，恢复中华，立纲陈纪，救济斯民。","大明律": "法律与监察：制定《大明律》，严刑峻法"},"workSummaries": {"大明律": {"title": "大明律","aliases": [],"authors": ["朱元璋"],"related_people": ["朱元璋"],"source_pages": ["朱元璋"],"era": "元末明初","genre": "法典","one_liner": "《大明律》是明太祖朱元璋在洪武年间主持制定的基本法典，贯彻重典治国思想，对贪赃等罪行处以严刑峻罚，奠定了有明一代的法律基础。","summary": "法律与监察：制定《大明律》，严刑峻法","quote": "","quotes": [],"quote_policy": "preferred"},"御制皇陵碑": {"title": "御制皇陵碑","aliases": [],"authors": [],"related_people": ["朱元璋"],"source_pages": ["朱元璋"],"era": "","genre": "","one_liner": "殡无棺椁，被体恶裳，浮掩三尺，奠何殽浆！","summary": "殡无棺椁，被体恶裳，浮掩三尺，奠何殽浆！","quote": "","quotes": [],"quote_policy": "summary_only"},"谕中原檄": {"title": "谕中原檄","aliases": [],"authors": [],"related_people": ["朱元璋"],"source_pages": ["朱元璋"],"era": "","genre": "","one_liner": "驱逐胡虏，恢复中华，立纲陈纪，救济斯民。","summary": "驱逐胡虏，恢复中华，立纲陈纪，救济斯民。","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 朱元璋\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：朱元璋（幼名朱重八，字国瑞）\n- **时代**：元末明初\n- **出生**：元文宗天历元年九月十八日（1328年10月21日），濠州钟离（今安徽凤阳）\n- **去世**：明太祖洪武三十一年闰五月初十（1398年6月24日），应天府（今江苏南京）\n- **享年**：70岁（虚岁71岁）\n- **主要身份**：明朝开国皇帝、军事统帅、政治家\n- **历史地位**：中国历史上杰出的君主之一，推翻蒙元统治，恢复汉族政权，建立明朝，奠定了明朝近三百年的基业。\n- **主要成就**：建立明朝；北伐蒙元，统一全国；加强中央集权，废除丞相制度；推行移民屯田、兴修水利等恢复经济的政策；制定《大明律》。\n\n### 生平概述\n朱元璋出身贫苦农家，少年时逢元末乱世，父母兄长相继死于瘟疫和饥荒，被迫入皇觉寺为僧，后外出流浪化缘。至正十二年（1352年），他投奔濠州红巾军郭子兴部，因作战勇敢、才能出众而崭露头角，并娶马氏为妻。他逐步扩充势力，攻占集庆（改名应天），采纳“高筑墙、广积粮、缓称王”的策略，先后击败陈友谅、张士诚等割据势力。1368年正月，他在应天称帝，国号大明，年号洪武。同年八月，北伐军攻占大都（今北京），结束元朝统治。随后，他继续统一战争，并大规模分封诸子为藩王以屏藩帝室。在位期间，他极力强化皇权，严惩贪腐，同时大兴党案，诛杀功臣，其统治对明初政治、社会产生了深远而复杂的影响。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：从淮河流域的贫苦乡村起步，足迹遍及长江中下游主要战场，最终定都南京，并遥控指挥全国。\n- ⏱️ **时间跨度**：1328年 - 1398年，共计71年。\n- 📍 **地理范围**：核心区域为今安徽、江苏、浙江、湖北、江西、河南、河北、山东、北京等地。\n- 🌟 **重要节点数量**：9个核心地点。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：濠州钟离\n- **公元纪年**：1328年\n- **停留时间**：约17年（至1344年）\n- **位置**：元濠州钟离东乡（今安徽凤阳）\n- **事迹**：出生于贫苦佃农家庭，原名朱重八。在此度过童年与少年早期，经历了父母兄长在瘟疫和饥荒中相继离世的惨剧。\n- **意义**：苦难的童年塑造了他坚韧、多疑、节俭的性格底色，也是他反元思想的最初萌芽之地。\n\n### 📍 重要地点：皇觉寺（於皇寺）\n- **公元纪年**：1344年 - 1348年（约）\n- **停留时间**：约4年（含短暂为僧与外出游方）\n- **位置**：元濠州钟离（今安徽凤阳）\n- **事迹**：因孤无所依，入寺为僧。不久因饥荒被迫外出化缘流浪，游历淮西、豫南等地，开阔了眼界，体察了民情。\n- **意义**：人生的重要转折点，既是生存之所，也为其提供了接触社会、了解天下大势的机会。\n\n### 📍 重要地点：濠州城\n- **公元纪年**：1352年 - 1354年\n- **停留时间**：约2年\n- **位置**：元濠州（今安徽凤阳县临淮关镇）\n- **事迹**：投奔郭子兴领导的红巾军，因作战勇敢、机智多谋，深受赏识，并娶马氏（后来的马皇后）。逐步建立自己的班底。\n- **意义**：军旅生涯的起点，从僧人转变为军人，并开始积累最初的军事和政治资本。\n\n### 📍 重要地点：滁州\n- **公元纪年**：1354年 - 1355年\n- **停留时间**：约1年\n- **位置**：元滁州（今安徽滁州）\n- **事迹**：率军攻占滁州，成为独当一面的将领。在此期间，李善长前来投奔，成为其重要谋士。\n- **意义**：此条史实有误——朱元璋一生中消灭最强对手陈友谅、奠定霸业的决定性战役，发生于1363年鄱阳湖之战，非皇觉寺。本寺真正承载的，是他孤贫剃度又绝处逢生、从僧袍走向龙袍的命运转折\n\n### 📍 重要地点：应天府（集庆路）\n- **公元纪年**：1356年 - 1398年（核心活动期）\n- **停留时间**：42年（作为根据地和首都）\n- **位置**：元集庆路，朱元璋改名应天府（今江苏南京）\n- **事迹**：1356年攻占集庆，改名应天，以此为中心扩张势力。1368年在此称帝，建立明朝。此后以此为都，指挥北伐、统一战争，并推行一系列政治、经济、文化改革。\n- **意义**：事业的根基与核心，明朝的京师所在，其大部分政治生涯和重大决策均发生于此。\n\n### 📍 重要地点：鄱阳湖\n- **公元纪年**：1363年\n- **停留时间**：战役持续约36天\n- **位置**：元江西鄱阳湖（今江西省北部，涉及上饶、九江等市）\n- **事迹**：与陈友谅展开中国历史上规模最大的水战之一。朱元璋采用火攻，以少胜多，击杀陈友谅，奠定统一江南的基础。\n- **意义**：此条史实有误——朱元璋一生中消灭最强对手陈友谅、奠定霸业的决定性战役，发生于1363年鄱阳湖之战，非皇觉寺。本寺真正承载的，是他孤贫剃度又绝处逢生、从僧袍走向龙袍的命运转折\n\n### 📍 重要地点：平江（苏州）\n- **公元纪年**：1366年 - 1367年\n- **停留时间**：围城约10个月\n- **位置**：元平江路（今江苏苏州）\n- **事迹**：率军围攻并最终消灭东吴政权张士诚。\n- **意义**：扫清了江南最后一个主要割据势力，为北伐中原、建立全国政权解除了后顾之忧。\n\n### 📍 重要地点：开封（汴梁）\n- **公元纪年**：1368年\n- **停留时间**：短暂巡幸\n- **位置**：元汴梁路（今河南开封）\n- **事迹**：称帝后亲临汴梁，部署北伐战略，并下诏以应天为南京，开封为北京。\n- **意义**：作为北伐的前进指挥中心和政治象征，体现了其“先取山东，撤其屏蔽；旋师河南，断其羽翼；拔潼关而守之，据其户槛”的战略规划。\n\n### 📍 重要地点：大都（北平）\n- **公元纪年**：1368年（攻占）\n- **停留时间**：未亲至，由徐达攻占\n- **位置**：元大都（今北京）\n- **事迹**：洪武元年（1368年）八月，征虏大将军徐达率军攻入大都，元顺帝北逃，元朝在中原的统治结束。\n- **意义**：标志着明朝取得了全国性政权的合法性，完成了“驱逐胡虏，恢复中华”的政治目标。\n\n### 🔴 去世地：应天府（南京）皇宫\n- **公元纪年**：1398年\n- **停留时间**：晚年居此\n- **位置**：明应天府（今江苏南京）\n- **经过**：洪武三十一年（1398年），朱元璋病逝于南京皇宫，葬于明孝陵。临终前传位皇太孙朱允炆。\n- **意义**：其政治生涯的终点，也是明初一系列重大政治事件（如分封藩王、诛杀功臣）后果的起点。\n- **名篇名句**：《御制皇陵碑》：“殡无棺椁，被体恶裳，浮掩三尺，奠何殽浆！”；《谕中原檄》：“驱逐胡虏，恢复中华，立纲陈纪，救济斯民。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1328年 | 濠州钟离 | 安徽凤阳 | （年龄：0岁）出生于濠州钟离（今安徽凤阳）。 |\n| 1344年 | 皇觉寺（於皇寺） | 安徽凤阳 | （年龄：16岁）父母兄长去世，入皇觉寺为僧，不久外出游方。 |\n| 1352年 |  |  | （年龄：24岁）投奔濠州红巾军郭子兴部，改名朱元璋。 |\n| 1355年 |  |  | （年龄：27岁）郭子兴死，朱元璋逐渐掌握其旧部。率军渡江。 |\n| 1356年 | 应天府（集庆路） | 江苏南京 | （年龄：28岁）攻占集庆，改名应天（今南京），作为根据地。 |\n| 1360年 | 应天府（集庆路） | 江苏南京 | （年龄：32岁）与陈友谅在应天交战，击退其进攻。 |\n| 1363年 | 鄱阳湖 |  | （年龄：35岁）鄱阳湖大战，击败并击杀陈友谅。 |\n| 1367年 | 平江（苏州） | 江苏苏州 | （年龄：39岁）攻破平江，俘虏张士诚。同年命徐达北伐。 |\n| 1368年 | 大都（北平） | 北京 | （年龄：40岁）正月，于应天称帝，国号大明，年号洪武。八月，明军攻占大都，元朝覆灭。 |\n| 1370年 |  |  | （年龄：42岁）分封诸子为王，开始大规模封藩。 |\n| 1376年 |  |  | （年龄：48岁）改行中书省为承宣布政使司，加强中央集权。 |\n| 1380年 |  |  | （年龄：52岁）以“胡惟庸案”废除丞相制度，权分六部，直接对皇帝负责。 |\n| 1382年 |  |  | （年龄：54岁）设立锦衣卫，加强特务统治。马皇后去世。 |\n| 1393年 |  |  | （年龄：65岁）“蓝玉案”发，大规模诛杀功臣宿将。 |\n| 1398年 | 应天府（南京）皇宫 | 江苏南京 | （年龄：71岁）病逝于南京，葬明孝陵。皇太孙朱允炆继位。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n朱元璋通过武力结束了元末的混乱局面，重建了统一的汉族中央集权王朝。他采取的一系列极端措施，如废除丞相、大杀功臣、设立特务机构、分封藩王等，在短期内极大地强化了皇权，消除了内部的政治威胁，但也为明朝中后期的宦官专权、党争以及藩王问题埋下了隐患。其休养生息的经济政策，使明初社会经济得以快速恢复。\n\n### 对后世的影响\n1.  **政治制度**：废除丞相，皇帝直接统领六部，使君主专制达到新的高度，这一制度被明清两代沿用。\n2.  **社会结构**：推行严格的户籍制度（如军户、匠户）和里甲制，试图将社会固化，影响了明代社会流动。\n3.  **思想控制**：推崇程朱理学，确立八股取士，禁锢了思想文化的发展。\n4.  **都城格局**：其分封诸子守边的策略，直接影响了明朝“天子守国门”的都城北迁（永乐迁都）格局。\n\n### 历史评价\n1.  **明太祖实录**：称其“崛起布衣，奄奠海宇，西汉以后所未有也”。\n2.  **清·赵翼**：“盖明祖一人，圣贤、豪杰、盗贼之性，实兼而有之者也。”\n3.  **现代史学界**：普遍认为他是一位杰出的军事家和政治家，其恢复中华、重建统一的历史功绩值得肯定；但其强化专制、屠戮功臣、严刑峻法等行为也体现了其性格中残暴、猜忌的一面，对明代政治文化产生了深远的负面影响。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **元末农民起义**：背景是**元朝统治腐朽**，民族矛盾与阶级矛盾尖锐。**红巾军起义**是主要反抗力量。\n- **明朝建立**：**1368年**，**朱元璋**（明太祖）称帝，定都**应天府**（今南京），国号大明。\n- **强化皇权**：在地方，**废除行中书省**，设**三司**（布政使司、按察使司、都指挥使司）分权。在中央，**废除丞相**和中书省，权分**六部**，直接对皇帝负责。\n- **特务统治**：设立**锦衣卫**，由皇帝直接指挥，监视官民。\n- **科举制度**：实行**八股取士**，考试内容固定为“四书五经”，格式僵化。\n- **经济政策**：鼓励**垦荒屯田**，兴修水利，减轻赋税，促进**农业**恢复发展。\n- **易混点**：区分**明太祖朱元璋**（强化皇权）与**明成祖朱棣**（迁都北京、设东厂）的主要举措。\n\n### 高中阶段\n- **时代背景**：**元末社会矛盾激化**，**红巾军起义**爆发，朱元璋在群雄中脱颖而出。\n- **统一过程**：先西后东，**鄱阳湖之战**灭陈友谅，**平江之战**灭张士诚，然后**北伐**攻占大都，逐步统一全国。\n- **制度建设**：**废除丞相**，**权分六部**，皇帝独揽大权；设立**殿阁大学士**作为侍从顾问（内阁雏形）；地方设**三司**，直属中央。\n- **法律与监察**：制定**《大明律》**，严刑峻法；设立**都察院**和**六科给事中**监察百官；利用**锦衣卫**实行特务统治。\n- **社会经济**：推行**里甲制**和**户籍制度**（黄册、鱼鳞图册），严格控制人口与土地；实施**移民屯田**政策。\n- **思想文化**：推崇**程朱理学**为官方哲学；实行**八股取士**，束缚知识分子思想。\n- **分封藩王**：为巩固边防和皇室，**分封诸子为王**，赋予军事权力，埋下**靖难之役**的隐患。\n- **历史评价**：认识其作为**开国皇帝**的双重性：**恢复生产、加强集权**的积极作用，与**君主专制强化、文化控制**带来的消极影响。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n1.  **明朝建立三要素**：时间（**1368年**）、建立者（**朱元璋**）、都城（**应天府**）。\n2.  **强化皇权的核心措施**：中央**废丞相**，权分六部；地方**废行省**，设三司。\n3.  **特务机构**：明太祖设**锦衣卫**；明成祖设**东厂**（易混点）。\n4.  **科举考试**：**八股取士**的特点（内容、格式、影响）。\n5.  **经济恢复政策**：鼓励**垦荒**、兴修**水利**。\n6.  **重要人物关系**：朱元璋与**马皇后**、**太子朱标**、**皇太孙朱允炆**的关系。\n7.  **重大案件**：**胡惟庸案**（废丞相）、**蓝玉案**（打击功臣）的目的与影响。\n8.  **都城变迁**：明朝初建于南京，后**明成祖迁都北京**（“天子守国门”）。\n\n### 高中阶段\n1.  **元明之际的社会矛盾**：**民族矛盾**（元朝四等人制）与**阶级矛盾**（土地兼并、赋役沉重）的交织。\n2.  **朱元璋取胜的原因**：**战略得当**（“高筑墙、广积粮、缓称王”）、**善于用人**、**军队纪律严明**、**对手失误**等。\n3.  **明朝政治制度的特点**：**君主专制空前强化**的表现（废丞相、设厂卫、八股取士）。\n4.  **《大明律》与重典治吏**：了解其**重典治国**思想，特别是对**贪污**的严厉惩处。\n5.  **户籍与土地制度**：**黄册**（户籍）和**鱼鳞图册**（土地）的作用与目的。\n6.  **分封制的隐患**：**藩王势力**膨胀与中央集权的矛盾，直接导致**靖难之役**。\n7.  **历史概念辨析**：**“胡蓝之狱”** 的性质；**内阁**制度在明太祖时期的萌芽（殿阁大学士）。\n8.  **综合评价**：结合**加强中央集权**、**恢复社会经济**、**文化专制**等方面，对朱元璋进行**辩证评价**。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 濠州钟离 | 安徽省滁州市凤阳县 | 32.8756 | 117.5644 |\n| 皇觉寺（於皇寺） | 安徽省滁州市凤阳县 | 32.8756 | 117.5644 |\n| 濠州城 | 安徽省滁州市凤阳县 | 32.8756 | 117.5644 |\n| 滁州 | 安徽省滁州市 | 32.3018 | 118.3165 |\n| 应天府（集庆路） | 江苏省南京市 | 32.0603 | 118.7969 |\n| 鄱阳湖 | 江西省上饶市鄱阳县 | 29.0056 | 116.6833 |\n| 平江（苏州） | 江苏省苏州市 | 31.2990 | 120.5853 |\n| 开封（汴梁） | 河南省开封市 | 34.7986 | 114.3070 |\n| 大都（北平） | 北京市 | 39.9042 | 116.4074 |\n| 应天府（南京）皇宫 | 江苏省南京市 | 32.0603 | 118.7969 |\n","relatedGraph": {"center": {"id": 211,"name": "朱元璋","file": "朱元璋.html","dynasty": "元末明初","birth_year": 1328,"death_year": 1398,"time_year": 1348,"quote": "高筑墙、广积粮、缓称王","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "politics","main_role_label": "明朝开国皇帝","birthplace": "濠州钟离","birthplace_raw": "濠州钟离今安徽凤阳","birthplace_modern": "安徽凤阳","birth_lat_wgs84": 32.8756,"birth_lng_wgs84": 117.5644,"birth_lat": 32.8756,"birth_lng": 117.5644,"birth_coord_system": "WGS84","has_story": 1,"native_place": "","native_place_raw": "","native_place_modern": "","search_keys": ["朱元璋"],"search_tokens": ["朱元璋","zhuyuanzhang","zyz"],"search_pinyin": ["zhuyuanzhang","zyz"],"is_foreign": 0,"created_at": "2026-07-01 07:17:24","updated_at": "2026-07-01 07:17:24","isCenter": true,"relationLabel": "中心人物"},"nodes": [{"id": 211,"name": "朱元璋","file": "朱元璋.html","dynasty": "元末明初","birth_year": 1328,"death_year": 1398,"time_year": 1348,"quote": "高筑墙、广积粮、缓称王","review": "","aliases": [],"foreign_name": "","domain_tags": [],"main_role_band": "politics","main_role_label": "明朝开国皇帝","birthplace": "濠州钟离","birthplace_raw": "濠州钟离今安徽凤阳","birthplace_modern": "安徽凤阳","birth_lat_w
