  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.chat-avatar {
  transition: transform 0.15s ease;
}
.chat-avatar:hover {
  transform: scale(1.15);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {
  color: var(--color-text-primary);
  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;
  color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary) 12%);
}
.narrative-inline-accent {
  font-weight: 700;
  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);
}
.narrative-inline-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-inline-place {

  color: #166534;
}
.narrative-inline-quote {
  color: color-mix(in srgb, var(--color-text-secondary) 82%, var(--color-primary) 18%);
  font-style: italic;
}
/* LLM-annotated highlight categories */
.nl-event {
  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;
}
.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);
  font-style: italic;
}
.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,
.narrative-description-line.is-lead .nl-time {

.narrative-watch-label {
  display: inline-flex;
  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary-soft) 88%, white 12%);
  color: color-mix(in srgb, var(--color-primary) 84%, #1d4ed8 16%);
  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));
  background: linear-gradient(135deg, rgba(26,115,232,0.12), rgba(255,255,255,0.96));
  color: var(--color-primary);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(26,115,232,0.12);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}
.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

<body class="p-4 md:p-8">
    
    <div id="boot-fallback" class="max-w-screen-2xl mx-auto mb-4 glass-panel theme-card p-4 rounded-xl theme-soft-section">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold theme-primary-text">页面加载中…</div>
          <div class="text-[11px] text-gray-600 mt-1">若长时间停留在此，请检查网络是否可访问 CDN 资源。</div>
          <div id="boot-diag" class="text-[11px] text-gray-600 mt-2 whitespace-pre-wrap"></div>
        </div>
        <div class="text-[11px] text-gray-500">提示</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        let firstErr = "";
        const diag = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = msg;
        };
        const append = (msg) => {
          const el = document.getElementById("boot-diag");
          if (!el) return;
          el.textContent = el.textContent ? (el.textContent + "\\n" + msg) : msg;
        };
        const head = async (url) => {
          try {
            const r = await fetch(url, { method: "GET", cache: "no-store" });
            return `${url} -> ${r.status}`;
          } catch (e) {
            return `${url} -> ERR`;
          }
        };
        window.addEventListener("error", (e) => {
          if (!firstErr) firstErr = `JS Error: ${String(e?.message || e)}`;
          diag(firstErr);
        });
        window.addEventListener("unhandledrejection", (e) => {
          if (!firstErr) firstErr = `Promise Rejection: ${String(e?.reason || e)}`;
          diag(firstErr);
        });
        setTimeout(async () => {
          const root = document.getElementById("root");
          const empty = !root || root.childElementCount === 0;
          if (!empty) return;
          const parts = [];
          const hasCreateRoot = !!(window.ReactDOM && typeof window.ReactDOM.createRoot === "function");
          const babelAuto = !!(window.Babel && typeof window.Babel.transformScriptTags === "function");
          const babelTags = document.querySelectorAll('script[type="text/babel"]').length;
          parts.push(`Globals: React=${!!window.React} ReactDOM=${!!window.ReactDOM} createRoot=${hasCreateRoot} Babel=${!!window.Babel} babelAuto=${babelAuto} babelTags=${babelTags} MapLibre=${!!window.maplibregl}`);
          parts.push(await head(new URL("./vendor/preact-compat.production.min.js", window.location.href).toString()));
          parts.push(await head(new URL("./vendor/babel.min.js", window.location.href).toString()));
          if (firstErr) diag(firstErr);
          append(parts.join("\\n"));
        }, 1800);

    <script>const data = {"person": {"name": "李白", "nameRaw": "李白", "foreignName": "", "foreignCountry": "", "foreignCountryZh": "", "title": "", "description": "李白，字太白，号青莲居士，唐代最杰出的浪漫主义诗人，被誉为\"诗仙\"。其诗豪放飘逸、想象瑰丽，代表作有《静夜思》《将进酒》《望庐山瀑布》《早发白帝城》《蜀道难》《行路难》《月下独酌》等，与杜甫齐名，合称\"李杜\"，对中国后世诗歌影响深远。李白约生于唐武后长安元年（701年），一说生于中亚碎叶城（当时属唐安西都护府，今吉尔吉斯斯坦境内），一说生于蜀中青莲乡（今四川绵阳江油）。少年时即显露才华，\"十五观奇书，作赋凌相如\"，兴趣广泛，剑术、辞赋、道经、纵横术皆有所涉猎。约25岁（一说约725年）离开蜀中，\"仗剑去国，辞亲远游\"，沿江东下金陵、扬州、会稽等地，寓居安陆\"酒隐安陆，蹉跎十年\"，与故相许圉师孙女结婚，育有子女数人。天宝元年（742年），李白经道士吴筠推荐，应诏入京，是其人生最高光的时刻——供奉翰林，奉唐玄宗之命作《清平调》《宫中行乐词》等应制诗，一时名动京师；然其性格傲岸，蔑视权贵，\"安能摧眉折腰事权贵，使我不得开心颜\"，被权贵排挤，不及两年即被\"赐金放还\"。此后再次漫游，足迹遍布梁宋、齐鲁、燕赵、越中，与杜甫、高适等诗人结下深厚友谊，迎来其诗歌创作最旺盛的时期，诸如《将进酒》《行路难》《蜀道难》《梦游天姥吟留别》等千古名篇多成于此时。天宝十四年（755年）安史之乱爆发，李白避地东南，后入永王李璘幕府；至德二载（757年）永王兵败，李白受牵连以\"附逆\"罪流放夜郎，行至巫山遇赦东归。晚年漂泊金陵、宣城、当涂一带，依族叔李阳冰、友人汪伦等。宝应元年（762年），李白病逝于当涂，享年六十一（一作六十二）。关于其死因，另有\"醉酒泛舟、跳入水中捉月溺死\"的传说，系后人附会，但也寄托了人们对这位\"谪仙人\"的浪漫想象。身后留有《李太白集》三十卷传世。", "descriptionHighlights": [{"phrase": "供奉翰林", "category": "event"}, {"phrase": "遭谗去朝", "category": "turning"}, {"phrase": "永王李璘幕府", "category": "event"}, {"phrase": "长流夜郎", "category": "turning"}], "quote": "诗仙", "shortReview": "诗仙", "dynasty": "唐代（盛唐）", "courtesyName": "", "artName": "", "aliases": [], "birthplace": "碎叶城 / 绵阳青莲乡（今碎叶城）", "nativePlace": "", "avatar": "李白-2d95a84bc9dd.jpg", "avatarSource": "real", "avatarSourceLabel": "Wikimedia Commons 传世画像", "birth": {"date": "约701年", "location": "碎叶城 / 绵阳青莲乡（今碎叶城）", "lat": 42.8333, "lng": 75.3, "coordSystem": "WGS84"}, "death": {"date": "762年", "location": "当涂", "lat": 31.464418, "lng": 118.640026, "coordSystem": "WGS84"}, "lifespan": "", "highlights": {"honor": "", "status": "", "identities": "诗人、翰林供奉（翰林待诏）、道教徒", "achievements": "开创唐代浪漫主义诗歌高峰，与杜甫并称\"李杜\"；留下大量脍炙人口的诗作，代表作《将进酒》《静夜思》《望庐山瀑布》《早发白帝城》《蜀道难》《行路难》《月下独酌》等；被誉为\"诗仙\"，其诗风对后世影响深远；曾奉诏入朝供奉翰林，名动一时", "works": ["静夜思", "将进酒", "望庐山瀑布", "早发白帝城", "蜀道难", "行路难", "月下独酌", "清平调", "宫中行乐词", "梦游天姥吟留别", "李太白集"], "reviews": []}}, "locations": [{"name": "碎叶城 / 绵阳青莲乡", "ancientName": "碎叶 ）", "duration": "", "significance": "诗仙生命的终点，临终前将诗稿托付族叔李阳冰，其诗歌遗产得以整理和流传。", "works": [], "quoteLines": ["《临终歌》：\"大鹏飞兮振八裔，中天摧兮力不济。\""]}], "coordinateSystem": "WGS84", "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 语文（课文/词作）\n- 课文/词作：**《静夜思》**、**《望庐山瀑布》**、**《早发白帝城》**、**《黄鹤楼送孟浩然之广陵》**、**《将进酒》**、**《行路难》**、**《蜀道难》**、《闻王昌龄左迁龙标遥有此寄》、《月下独酌》等\n- 核心要点：\n    - **重点**：**《静夜思》** 以\"**床前明月光，疑是地上霜**\"的简洁意象，传递游子思乡之情，是启蒙阶段必读篇章。\n    - **重点**：**《望庐山瀑布》** \"**飞流直下三千尺，疑是银河落九天**\"以夸张想象塑造庐山瀑布的奇伟气势，体现李白浪漫主义笔法。\n    - **重点**：**《早发白帝城》** \"**朝辞白帝彩云间，千里江陵一日还**\"以时空压缩手法表现归心之疾，是七言绝句精品。\n    - **重点**：**《黄鹤楼送孟浩然之广陵》** \"**故人西辞黄鹤楼，烟花三月下扬州**\"以送别场景寄托对友人的深情，景中含情。\n    - **重点**：**《将进酒》** 体现李白豪放自信的诗风，\"**君不见黄河之水天上来**\"以奔放气势开篇，蕴含\"**人生得意须尽欢**\"的及时行乐与深沉悲愤。\n    - **重点**：**《行路难》** \"**长风破浪会有时，直挂云帆济沧海**\"以瑰丽想象表达对理想的坚定信念，是李白积极浪漫主义的代表作。\n    - **重点**：**《蜀道难》** 以\"**噫吁嚱，危乎高哉**\"开篇，以丰富神话传说和夸张笔法描写蜀道之难，是李白浪漫主义诗歌的杰作。\n    - 善于运用**夸张**、**想象**和**神话典故**，语言奔放飘逸，风格豪迈瑰丽，开创了**浪漫主义诗歌**的高峰。\n    - 诗句中**\"举头望明月，低头思故乡\"**（《静夜思》）、**\"飞流直下三千尺，疑是银河落九天\"**（《望庐山瀑布》）、**\"桃花潭水深千尺，不及汪伦送我情\"**（《赠汪伦》）等名句传诵千古。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：唐代最伟大的**浪漫主义诗人**，被誉为\"**诗仙**\"，与**杜甫**合称\"**李杜**\"，并与杜甫、白居易、元稹共同代表了唐诗的巅峰。\n    - **重点**：字**太白**，号**青莲居士**，祖籍**陇西成纪**（今甘肃秦安），生于**碎叶城**（今吉尔吉斯斯坦境内，一说生于四川绵阳江油青莲乡），是**唐代**诗歌的代表人物。\n    - **重点**：约**25岁**离蜀漫游，曾先后到达**扬州**、**金陵**、**安陆**等地，**40岁左右**奉诏入京供奉翰林，是其人生中最为显赫的时期。\n    - 因性格傲岸、不事权贵，得罪权贵（**高力士**为其脱靴），不到两年（**744年**）被\"赐金放还\"，重新漫游。\n    - **安史之乱**中曾入**永王李璘**幕府，后永王兵败，李白受牵连流放**夜郎**（约**757年**），次年遇赦东归。\n    - 约**762年**卒于当涂（今安徽马鞍山），留下\"**捉月溺死**\"的传说（后人附会）。\n- 核心要点：\n    - **重点**：其诗在**题材**上涵盖**咏怀、咏史、咏物、游仙、边塞、赠答**等多种类型，在**体裁**上擅长**古体诗**与**绝句**。\n    - **重点**：其诗歌**想象奇特、气势磅礴、感情奔放、语言华美**，是**盛唐气象**的典型代表，引领**盛唐诗歌**达到顶峰。\n    - **重点**：对后世影响深远，其豪放飘逸的诗风直接影响了**宋代**以**苏轼**、**辛弃疾**为代表的**豪放派词**的创作。\n    - 诗歌中常用**道教**意象（如\"青天\"\"白云\"\"仙人\"），体现其道教信仰与求仙思想。\n    - 是**中华诗词文化**的核心符号之一，其诗句常出现在**中小学语文课本**、**历史教材**与**文化普及读本**中。", "examPoints": "### 考点\n### 语文（课文/词作）\n- 课文/词作：**《静夜思》**、**《望庐山瀑布》**、**《早发白帝城》**、**《黄鹤楼送孟浩然之广陵》**、**《将进酒》**、**《行路难》**、**《蜀道难》**、《闻王昌龄左迁龙标遥有此寄》、《月下独酌》等\n- 核心要点：\n    - **重点**：**《静夜思》** 以\"**床前明月光，疑是地上霜**\"的简洁意象，传递游子思乡之情，是启蒙阶段必读篇章。\n    - **重点**：**《望庐山瀑布》** \"**飞流直下三千尺，疑是银河落九天**\"以夸张想象塑造庐山瀑布的奇伟气势，体现李白浪漫主义笔法。\n    - **重点**：**《早发白帝城》** \"**朝辞白帝彩云间，千里江陵一日还**\"以时空压缩手法表现归心之疾，是七言绝句精品。\n    - **重点**：**《黄鹤楼送孟浩然之广陵》** \"**故人西辞黄鹤楼，烟花三月下扬州**\"以送别场景寄托对友人的深情，景中含情。\n    - **重点**：**《将进酒》** 体现李白豪放自信的诗风，\"**君不见黄河之水天上来**\"以奔放气势开篇，蕴含\"**人生得意须尽欢**\"的及时行乐与深沉悲愤。\n    - **重点**：**《行路难》** \"**长风破浪会有时，直挂云帆济沧海**\"以瑰丽想象表达对理想的坚定信念，是李白积极浪漫主义的代表作。\n    - **重点**：**《蜀道难》** 以\"**噫吁嚱，危乎高哉**\"开篇，以丰富神话传说和夸张笔法描写蜀道之难，是李白浪漫主义诗歌的杰作。\n    - 善于运用**夸张**、**想象**和**神话典故**，语言奔放飘逸，风格豪迈瑰丽，开创了**浪漫主义诗歌**的高峰。\n    - 诗句中**\"举头望明月，低头思故乡\"**（《静夜思》）、**\"飞流直下三千尺，疑是银河落九天\"**（《望庐山瀑布》）、**\"桃花潭水深千尺，不及汪伦送我情\"**（《赠汪伦》）等名句传诵千古。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：唐代最伟大的**浪漫主义诗人**，被誉为\"**诗仙**\"，与**杜甫**合称\"**李杜**\"，并与杜甫、白居易、元稹共同代表了唐诗的巅峰。\n    - **重点**：字**太白**，号**青莲居士**，祖籍**陇西成纪**（今甘肃秦安），生于**碎叶城**（今吉尔吉斯斯坦境内，一说生于四川绵阳江油青莲乡），是**唐代**诗歌的代表人物。\n    - **重点**：约**25岁**离蜀漫游，曾先后到达**扬州**、**金陵**、**安陆**等地，**40岁左右**奉诏入京供奉翰林，是其人生中最为显赫的时期。\n    - 因性格傲岸、不事权贵，得罪权贵（**高力士**为其脱靴），不到两年（**744年**）被\"赐金放还\"，重新漫游。\n    - **安史之乱**中曾入**永王李璘**幕府，后永王兵败，李白受牵连流放**夜郎**（约**757年**），次年遇赦东归。\n    - 约**762年**卒于当涂（今安徽马鞍山），留下\"**捉月溺死**\"的传说（后人附会）。\n- 核心要点：\n    - **重点**：其诗在**题材**上涵盖**咏怀、咏史、咏物、游仙、边塞、赠答**等多种类型，在**体裁**上擅长**古体诗**与**绝句**。\n    - **重点**：其诗歌**想象奇特、气势磅礴、感情奔放、语言华美**，是**盛唐气象**的典型代表，引领**盛唐诗歌**达到顶峰。\n    - **重点**：对后世影响深远，其豪放飘逸的诗风直接影响了**宋代**以**苏轼**、**辛弃疾**为代表的**豪放派词**的创作。\n    - 诗歌中常用**道教**意象（如\"青天\"\"白云\"\"仙人\"），体现其道教信仰与求仙思想。\n    - 是**中华诗词文化**的核心符号之一，其诗句常出现在**中小学语文课本**、**历史教材**与**文化普及读本**中。", "workTexts": {"渡荆门送别": "山随平野尽，江入大荒流。", "登金陵凤凰台": "总为浮云能蔽日，长安不见使人愁。", "黄鹤楼送孟浩然之广陵": "故人西辞黄鹤楼，烟花三月下扬州。", "山中问答": "问余何意栖碧山，笑而不答心自闲。", "清平调": "云想衣裳花想容，春风拂槛露华浓。", "将进酒": "天生我材必有用，千金散尽还复来。", "游泰山": "登高望蓬瀛，想象金银台。", "望庐山瀑布": "飞流直下三千尺，疑是银河落九天。", "早发白帝城": 哉！蜀道之难，难于上青天！", "蜀道之难，难于上青天，侧身西望长咨嗟。", "黄鹤之飞尚不得过，猿猱欲度愁攀援。"], "quote_policy": "preferred"}, "行路难": {"title": "行路难", "aliases": [], "authors": ["李白"], "related_people": ["李白"], "source_pages": ["李白"], "era": "唐代", "genre": "乐府/歌行", "one_liner": "李白以'行路难'古题抒写仕途坎坷与怀才不遇的激愤，以'长风破浪会有时'收束全篇，展现百折不挠的豪迈气概。", "summary": "李白，字太白，号青莲居士，唐代最杰出的浪漫主义诗人，被誉为\"诗仙\"", "quote": "长风破浪会有时，直挂云帆济沧海。", "quotes": ["长风破浪会有时，直挂云帆济沧海。", "金樽清酒斗十千，玉盘珍羞直万钱。"], "quote_policy": "preferred"}, "月下独酌": {"title": "月下独酌", "aliases": [], "authors": ["李白"], "related_people": ["李白"], "source_pages": ["李白"], "era": "唐代", "genre": "诗", "one_liner": "李白以月下独饮为背景，借邀月、对影抒写孤高情怀与世无知音的深沉寂寞，将孤独升化为天人共饮的浪漫境界。", "summary": "李白，字太白，号青莲居士，唐代最杰出的浪漫主义诗人，被誉为\"诗仙\"", "quote": "举杯邀明月，对影成三人。", "quotes": ["举杯邀明月，对影成三人。", "永结无情游，相期邈云汉。", "花间一壶酒，独酌无相亲。"], "quote_policy": "preferred"}, "黄鹤楼送孟浩然之广陵": {"one_liner": "李白于黄鹤楼送别友人孟浩然赴扬州而作的七言绝句，以烟花三月的江南春景和孤帆远影寄寓对故人的深厚情谊与依依惜别之情。", "genre": "诗（七言绝句）", "authors": ["李白"], "quotes": ["故人西辞黄鹤楼，烟花三月下扬州。", "孤帆远影碧空尽，唯见长江天际流。"], "era": "唐代", "quote_policy": "preferred", "title": "黄鹤楼送孟浩然之广陵"}}, "markdown": "# 李白\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：李白\n- **时代**：唐代（盛唐）\n- **出生**：约701年，碎叶城 / 绵阳青莲乡（今碎叶城）\n- **去世**：762年，当涂\n- **主要身份**：诗人、翰林供奉（翰林待诏）、道教徒\n- **主要成就**：开创唐代浪漫主义诗歌高峰，与杜甫并称\"李杜\"；留下大量脍炙人口的诗作，代表作《将进酒》《静夜思》《望庐山瀑布》《早发白帝城》《蜀道难》《行路难》《月下独酌》等；被誉为\"诗仙\"，其诗风对后世影响深远；曾奉诏入朝供奉翰林，名动一时\n\n### 生平概述\n李白，字太白，号青莲居士，唐代最杰出的浪漫主义诗人，被誉为\"诗仙\"。其诗豪放飘逸、想象瑰丽，代表作有《静夜思》《将进酒》《望庐山瀑布》《早发白帝城》《蜀道难》《行路难》《月下独酌》等，与杜甫齐名，合称\"李杜\"，对中国后世诗歌影响深远。\n\n李白约生于唐武后长安元年（701年），一说生于中亚碎叶城（当时属唐安西都护府，今吉尔吉斯斯坦境内），一说生于蜀中青莲乡（今四川绵阳江油）。少年时即显露才华，\"十五观奇书，作赋凌相如\"，兴趣广泛，剑术、辞赋、道经、纵横术皆有所涉猎。约25岁（一说约725年）离开蜀中，\"仗剑去国，辞亲远游\"，沿江东下金陵、扬州、会稽等地，寓居安陆\"酒隐安陆，蹉跎十年\"，与故相许圉师孙女结婚，育有子女数人。\n\n天宝元年（742年），李白经道士吴筠推荐，应诏入京，是其人生最高光的时刻——供奉翰林，奉唐玄宗之命作《清平调》《宫中行乐词》等应制诗，一时名动京师；然其性格傲岸，蔑视权贵，\"安能摧眉折腰事权贵，使我不得开心颜\"，被权贵排挤，不及两年即被\"赐金放还\"。此后再次漫游，足迹遍布梁宋、齐鲁、燕赵、越中，与杜甫、高适等诗人结下深厚友谊，迎来其诗歌创作最旺盛的时期，诸如《将进酒》《行路难》《蜀道难》《梦游天姥吟留别》等千古名篇多成于此时。\n\n天宝十四年（755年）安史之乱爆发，李白避地东南，后入永王李璘幕府；至德二载（757年）永王兵败，李白受牵连以\"附逆\"罪流放夜郎，行至巫山遇赦东归。晚年漂泊金陵、宣城、当涂一带，依族叔李阳冰、友人汪伦等。宝应元年（762年），李白病逝于当涂，享年六十一（一作六十二）。关于其死因，另有\"醉酒泛舟、跳入水中捉月溺死\"的传说，系后人附会，但也寄托了人们对这位\"谪仙人\"的浪漫想象。身后留有《李太白集》三十卷传世。\n\n## 二、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：碎叶城 / 绵阳青莲乡\n- **公元纪年**：约701年\n- **位置**：碎叶城 / 绵阳青莲乡（今碎叶城）\n- **事迹**：出生（一说生于中亚碎叶城，一说生于蜀中青莲乡）\n- **意义**：李白人生的起点，其多元的文化背景与西域色彩可能源于此地。\n\n### 📍 重要地点：蜀中出发\n- **公元纪年**：约725年前后\n- **位置**：蜀中出发\n- **事迹**：仗剑去国，辞亲远游，开始漫游生涯\n- **意义**：奠定了其文学基础和豪放性格的形成期，以\"大鹏\"自喻，展现非凡气概。\n- **名篇名句**：《渡荆门送别》：\"山随平野尽，江入大荒流。\"\n\n### 📍 重要地点：金陵\n- **公元纪年**：约725-726年\n- **位置**：金陵\n- **事迹**：沿江东下，游历金陵（今南京），登凤凰台，写下《登金陵凤凰台》等诗篇\n- **意义**：游览六朝古都，感受历史兴衰，抒发人生感慨，诗风更显深沉。\n- **名篇名句**：《登金陵凤凰台》：\"总为浮云能蔽日，长安不见使人愁。\"\n\n### 📍 重要地点：扬州\n- **公元纪年**：约726-727年\n- **位置**：扬州\n- **事迹**：漫游扬州，结交名士，散金三十万，写下《黄鹤楼送孟浩然之广陵》等诗\n- **意义**：青年李白意气风发的见证，广交天下友、挥金如土的豪爽性格在此充分展现。\n- **名篇名句**：《黄鹤楼送孟浩然之广陵》：\"故人西辞黄鹤楼，烟花三月下扬州。\"\n\n### 📍 重要地点：安陆\n- **公元纪年**：约727-737年\n- **位置**：安陆\n- **事迹**：酒隐安陆，蹉跎十年；娶故相许圉师孙女为妻，定居安陆白兆山\n- **意义**：人生中一段相对稳定的时期，但仕途追求屡屡受挫，多次干谒无果。\n- **名篇名句**：《山中问答》：\"问余何意栖碧山，笑而不答心自闲。\"\n\n### 📍 重要地点：长安\n- **公元纪年**：约742年（天宝元年）\n- **位置**：长安\n- **事迹**：应诏入京，受玄宗赏识，授翰林供奉\n- **意义**：人生政治生涯的顶点，供奉翰林、名动京师，\"仰天大笑出门去，我辈岂是蓬蒿人\"。\n- **名篇名句**：《清平调》：\"云想衣裳花想容，春风拂槛露华浓。\"\n\n### 📍 重要地点：长安\n- **公元纪年**：约744年（天宝三载）\n- **位置**：长安\n- **事迹**：被赐金放还，离开长安，再次漫游\n- **意义**：政治生涯的重大转折点，因傲岸不羁遭权贵谗毁，深刻体验了宫廷的荣光与黑暗。\n\n### 📍 重要地点：梁宋（洛阳、开封一带）\n- **公元纪年**：约744-745年\n- **位置**：梁宋（洛阳、开封一带）\n- **事迹**：东游梁宋，与杜甫、高适同游，结下深厚友谊，写下《将进酒》等名篇\n- **意义**：\"李杜\"相会的重要地点，文学史上的千古佳话；与杜甫、高适三人同游，是盛唐诗坛最著名的交游段落。\n- **名篇名句**：《将进酒》：\"天生我材必有用，千金散尽还复来。\"\n\n### 📍 重要地点：齐鲁\n- **公元纪年**：约745-746年\n- **位置**：齐鲁\n- **事迹**：漫游齐鲁，登泰山，写下《游泰山》六首\n- **意义**：寓居东鲁时间较长，与孔巢父等隐士交游，号\"竹溪六逸\"，体现了李白思想中儒道交织的另一面。\n- **名篇名句**：《游泰山》：\"登高望蓬瀛，想象金银台。\"\n\n### 📍 重要地点：南方\n- **公元纪年**：755年（天宝十四载）\n- **位置**：南方\n- **事迹**：安史之乱爆发，参与永王李璘幕府\n- **意义**：在乱世中寻求避难与出路，隐居庐山后入永王幕府，为后续卷入政治风波埋下伏笔。\n- **名篇名句**：《望庐山瀑布》：\"飞流直下三千尺，疑是银河落九天。\"\n\n### 📍 重要地点：夜郎 / 巫山\n- **公元纪年**：约757年\n- **位置**：夜郎 / 巫山（今夜郎）\n- **事迹**：永王兵败后获罪，被流放夜郎（一说中途赦还）\n- **意义**：人生最大的政治挫折与生命危机，诗歌中充满悲愤与希望交织的复杂情感。\n- **名篇名句**：《早发白帝城》：\"朝辞白帝彩云间，千里江陵一日还。\"\n\n### 📍 重要地点：宣城\n- **公元纪年**：约759-762年\n- **位置**：宣城\n- **事迹**：晚年寓居宣城、当涂一带，依族叔李阳冰，写下《秋浦歌》《独坐敬亭山》等诗\n- **意义**：李白晚年重要的精神栖息地，诗歌风格更趋清新自然与深沉内敛。\n- **名篇名句**：《独坐敬亭山》：\"相看两不厌，只有敬亭山。\"\n\n### 🔴 去世地：当涂\n- **公元纪年**：762年（宝应元年）\n- **位置**：当涂\n- **经过**：病逝（一传醉后泛舟溺于当涂）\n- **意义**：诗仙生命的终点，临终前将诗稿托付族叔李阳冰，其诗歌遗产得以整理和流传。\n- **名篇名句**：《临终歌》：\"大鹏飞兮振八裔，中天摧兮力不济。\"\n\n## 三、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 约701年 | 碎叶城 / 绵阳青莲乡 | 碎叶城 | 出生（一说生于中亚碎叶城，一说生于蜀中青莲乡） |\n| 约725年前后 | 蜀中出发 | 蜀中出发 | 仗剑去国，辞亲远游，开始漫游生涯 |\n| 约725-726年 | 金陵 | 金陵 | 沿江东下，游历金陵，登凤凰台 |\n| 约726-727年 | 扬州 | 扬州 | 漫游扬州，结交名士，散金三十万 |\n| 约727-737年 | 安陆 | 安陆 | 酒隐安陆，蹉跎十年；娶许氏为妻 |\n| 约742年（天宝元年） | 长安 | 长安 | 应诏入京，受玄宗赏识，授翰林供奉 |\n| 约744年（天宝三载） | 长安 | 长安 | 被赐金放还，离开长安，再次漫游 |\n| 约744-745年 | 梁宋（洛阳、开封一带） | 梁宋（洛阳、开封一带） | 与杜甫、高适同游，写下《将进酒》等 |\n| 约745-746年 | 齐鲁 | 齐鲁 | 漫游齐鲁，登泰山 |\n| 755年（天宝十四载） | 南方 | 南方 | 安史之乱爆发，参与永王李璘幕府 |\n| 约757年 | 夜郎 / 巫山 | 夜郎 | 永王兵败后获罪，被流放夜郎 |\n| 约759-762年 | 宣城 | 宣城 | 晚年寓居宣城，写下《独坐敬亭山》等 |\n| 762年（宝应元年） | 当涂 | 当涂 | 病逝（一传醉后泛舟溺于当涂） |\n\n## 四、补充说明\n\n- 出生地有\"碎叶城\"（中亚吉尔吉斯斯坦境内）与\"蜀中青莲乡\"两说，至今无定论\n- 卒年有762年与763年两说\n- 晚年是否真被流放至夜郎、抑或中途于巫山赦还，史载不一\n- 卒因有\"病逝\"与\"醉酒泛舟溺死捉月\"两种传说，后者系后人附会\n- 供奉翰林的具体职衔（翰林供奉 / 翰林待诏 / 翰林学士）历代记载略有出入\n\n## 地点坐标（自动地理编码）\n| 现称 | 现代搜索地名 | 纬度 | 经度 | 坐标系 |\n| --- | --- | --- | --- | --- |\n| 碎叶城 | 碎叶城 | 42.8333 | 75.3 | WGS84 |\n| 蜀中出发 | 蜀中出发 | 30.5728 | 104.0668 | WGS84 |\n| 金陵 | 南京 | 32.0603 | 118.7969 | WGS84 |\n| 扬州 | 扬州 | 32.3944 | 119.4126 | WGS84 |\n| 安陆 | 安陆 | 31.2556 | 113.6890 | WGS84 |\n| 长安 | 长安 | 34.261 | 108.94 | WGS84 |\n| 梁宋（洛阳、开封一带） | 洛阳 | 34.618 | 112.454 | WGS84 |\n| 齐鲁 | 泰山 | 36.255 | 117.10 | WGS84 |\n| 南方 | 南方 | 31.5 | 118.0 | WGS84 |\n| 夜郎 | 夜郎 | 26.5 | 106.7 | WGS84 |\n| 宣城 | 宣城 | 30.9407 | 118.7586 | WGS84 |\n| 当涂 | 当涂 | 31.464418 | 118.640026 | WGS84 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《静夜思》**、**《望庐山瀑布》**、**《早发白帝城》**、**《黄鹤楼送孟浩然之广陵》**、**《将进酒》**、**《行路难》**、**《蜀道难》**、《闻王昌龄左迁龙标遥有此寄》、《月下独酌》等\n- 核心要点：\n    - **重点**：**《静夜思》** 以\"**床前明月光，疑是地上霜**\"的简洁意象，传递游子思乡之情，是启蒙阶段必读篇章。\n    - **重点**：**《望庐山瀑布》** \"**飞流直下三千尺，疑是银河落九天**\"以夸张想象塑造庐山瀑布的奇伟气势，体现李白浪漫主义笔法。\n    - **重点**：**《早发白帝城》** \"**朝辞白帝彩云间，千里江陵一日还**\"以时空压缩手法表现归心之疾，是七言绝句精品。\n    - **重点**：**《黄鹤楼送孟浩然之广陵》** \"**故人西辞黄鹤楼，烟花三月下扬州**\"以送别场景寄托对友人的深情，景中含情。\n    - **重点**：**《将进酒》** 体现李白豪放自信的诗风，\"**君不见黄河之水天上来**\"以奔放气势开篇，蕴含\"**人生得意须尽欢**\"的及时行乐与深沉悲愤。\n    - **重点**：**《行路难》** \"**长风破浪会有时，直挂云帆济沧海**\"以瑰丽想象表达对理想的坚定信念，是李白积极浪漫主义的代表作。\n    - **重点**：**《蜀道难》** 以\"**噫吁嚱，危乎高哉**\"开篇，以丰富神话传说和夸张笔法描写蜀道之难，是李白浪漫主义诗歌的杰作。\n    - 善于运用**夸张**、**想象**和**神话典故**，语言奔放飘逸，风格豪迈瑰丽，开创了**浪漫主义诗歌**的高峰。\n    - 诗句中**\"举头望明月，低头思故乡\"**（《静夜思》）、**\"飞流直下三千尺，疑是银河落九天\"**（《望庐山瀑布》）、**\"桃花潭水深千尺，不及汪伦送我情\"**（《赠汪伦》）等名句传诵千古。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：唐代最伟大的**浪漫主义诗人**，被誉为\"**诗仙**\"，与**杜甫**合称\"**李杜**\"，并与杜甫、白居易、元稹共同代表了唐诗的巅峰。\n    - **重点**：字**太白**，号**青莲居士**，祖籍**陇西成纪**（今甘肃秦安），生于**碎叶城**（今吉尔吉斯斯坦境内，一说生于四川绵阳江油青莲乡），是**唐代**诗歌的代表人物。\n    - **重点**：约**25岁**离蜀漫游，曾先后到达**扬州**、**金陵**、**安陆**等地，**40岁左右**奉诏入京供奉翰林，是其人生中最为显赫的时期。\n    - 因性格傲岸、不事权贵，得罪权贵（**高力士**为其脱靴），不到两年（**744年**）被\"赐金放还\"，重新漫游。\n    - **安史之乱**中曾入**永王李璘**幕府，后永王兵败，李白受牵连流放**夜郎**（约**757年**），次年遇赦东归。\n    - 约**762年**卒于当涂（今安徽马鞍山），留下\"**捉月溺死**\"的传说（后人附会）。\n- 核心要点：\n    - **重点**：其诗在**题材**上涵盖**咏怀、咏史、咏物、游仙、边塞、赠答**等多种类型，在**体裁**上擅长**古体诗**与**绝句**。\n    - **重点**：其诗歌**想象奇特、气势磅礴、感情奔放、语言华美**，是**盛唐气象**的典型代表，引领**盛唐诗歌**达到顶峰。\n    - **重点**：对后世影响深远，其豪放飘逸的诗风直接影响了**宋代**以**苏轼**、**辛弃疾**为代表的**豪放派词**的创作。\n    - 诗歌中常用**道教**意象（如\"青天\"\"白云\"\"仙人\"），体现其道教信仰与求仙思想。\n    - 是**中华诗词文化**的核心符号之一，其诗句常出现在**中小学语文课本**、**历史教材**与**文化普及读本**中。\n", "relatedGraph": {"center": {"id": 230, "name": "李白", "file": "李白.html", "dynasty": "唐代", "birth_year": 701, "death_year": 762, "time_year": 732, "quote": "诗仙", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "literature", "main_role_label": "诗人", "birthplace": "碎叶城", "birthplace_raw": "碎叶城今吉尔吉斯斯坦托克马克附近", "birthplace_modern": "吉尔吉斯斯坦托克马克附近", "birth_lat_wgs84": 42.8333, "birth_lng_wgs84": 75.3, "birth_lat": 42.8333, "birth_lng":
