  contain: layout style paint;

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

e": "散文", "one_liner": "方志敏在狱中写就的散文名篇，通过叙述被俘时搜身未得一钱的经历，诠释了共产党人甘于清贫、洁白朴素、舍己为公的崇高品格与廉洁精神。", "summary": "清贫，洁白朴素的生活，正是我们革命者能够战胜许多困难的地方！", "quote": "我毫不稀罕那华丽的大厦，却宁愿居住在卑陋潮湿的茅棚；不稀罕美味的西餐大菜，宁愿吞嚼刺口的苞粟和菜根。", "quotes": ["我毫不稀罕那华丽的大厦，却宁愿居住在卑陋潮湿的茅棚；不稀罕美味的西餐大菜，宁愿吞嚼刺口的苞粟和菜根。", "经手的款项，总在数百万元；但为革命而筹集的金钱，是一点一滴的用之于革命事业。", "清贫，洁白朴素的生活，正是我们革命者能够战胜许多困难的地方！"], "quote_policy": "preferred"}, "狱中纪实": {"title": "狱中纪实", "aliases": [], "authors": ["方志敏"], "related_people": ["方志敏"], "source_pages": ["方志敏"], "era": "中国近现代（中华民国）", "genre": "回忆录", "one_liner": "方志敏在南昌狱中所写的回忆录，详细记述了怀玉山被俘的经过及狱中生活，彰显了共产党人坚贞不屈的革命气节。", "summary": "方志敏生于清末，青年时期投身五四新文化运动，接受马克思主义", "quote": "敌人只能砍下我们的头颅，决不能动摇我们的信仰！因为我们信仰的主义，乃是宇宙的真理！", "quotes": ["敌人只能砍下我们的头颅，决不能动摇我们的信仰！因为我们信仰的主义，乃是宇宙的真理！", "我能丢弃一切，惟革命事业，却耿耿于怀，不能丢却！"], "quote_policy": "preferred"}, "新江西": {"title": "新江西", "aliases": [], "authors": [], "related_people": ["方志敏"], "source_pages": ["方志敏"], "era": "", "genre": "", "one_liner": "江西改造社", "summary": "江西改造社", "quote": "", "quotes": [], "quote_policy": "summary_only"}, "向导": {"title": "向导", "aliases": [], "authors": [], "related_people": ["方志敏", "瞿秋白"], "source_pages": ["方志敏", "瞿秋白"], "era": "", "genre": "", "one_liner": "事件：加入中国社会主义青年团，结识赵醒侬等共产党人，参与《向导》等刊物的发行工作。", "summary": "事件：加入中国社会主义青年团，结识赵醒侬等共产党人，参与《向导》等刊物的发行工作。", "quote": "", "quotes": [], "quote_policy": "summary_only"}}, "markdown": "# 方志敏\n\n## 人物档案\n\n### 基本信息\n- **姓名**：方志敏\n- **时代**：中国近现代（中华民国）\n- **出生**：公元1899年，江西省弋阳县漆工镇湖塘村（今江西省上饶市弋阳县）\n- **去世**：公元1935年8月6日，江西省南昌市（今江西省南昌市）\n- **享年**：36岁\n- **主要身份**：无产阶级革命家、军事家、农民运动领袖\n- **历史地位**：中国共产党革命烈士，赣东北革命根据地和红十军的主要创建者，也是红十军团的重要领导人。\n- **主要成就**：创建赣东北革命根据地（后发展为闽浙赣革命根据地）；创建中国工农红军第十军，并在红十军团成立后担任重要领导职务；领导农民运动，开展土地革命；在狱中写下《可爱的中国》《清贫》《狱中纪实》等不朽著作。\n\n### 生平概述\n方志敏生于清末，青年时期投身五四新文化运动，接受马克思主义。1924年加入中国共产党后，他致力于在家乡江西弋阳、横峰地区组织农民运动，领导武装起义，成功创建了横跨闽、浙、赣、皖四省边界的革命根据地，并建立了苏维埃政权。他领导根据地军民进行经济文化建设，开展反“围剿”斗争。1934年，他奉命率红十军团北上抗日，途中遭国民党军重兵围困，于1935年1月在江西怀玉山被俘。在狱中，他坚贞不屈，写下数万字文稿，深刻阐述其爱国情怀与革命理想，最终英勇就义。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：主要活动于江西东北部、福建北部、浙江西部及安徽南部等赣闽浙皖边区，最终于江西南昌就义。\n- ⏱️ **时间跨度**：公元1899年 - 公元1935年，共36年。\n- 📍 **地理范围**：以江西省东北部为核心，辐射福建、浙江、安徽三省边界地区。\n- 🌟 **重要节点数量**：9个核心地点。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：湖塘村\n- **时间**：公元1899年\n- **停留时间**：童年及少年时期\n- **地点**：江西省弋阳县漆工镇湖塘村（今江西省上饶市弋阳县漆工镇湖塘村）\n- **事件**：出生于一个农民家庭，幼年读私塾。\n- **意义**：革命思想的萌芽地，早期接触底层社会，为其日后领导农民运动奠定基础。\n\n### 📍 重要地点：南昌\n- **时间**：公元1916年-1921年（求学期间），以及1924年（短期活动）\n- **停留时间**：求学约5年，1924年短期\n- **地点**：江西省南昌市（今江西省南昌市）\n- **事件**：进入江西省立甲种工业学校学习，后因参与学生运动被开除；五四运动后，组织“江西改造社”，创办《新江西》杂志，传播新思想。1924年在南昌加入中国共产党。\n- **意义**：接受新文化、新思想的关键时期，从爱国学生转向初步的社会主义信仰者，并在此正式加入中国共产党。\n\n### 📍 重要地点：九江\n- **时间**：公元1922年\n- **停留时间**：短暂\n- **地点**：江西省九江市（今江西省九江市）\n- **事件**：参与组织“马克思主义研究会”和“民权运动大同盟”，开展革命宣传。\n- **意义**：方志敏在南昌正式加入中国社会主义青年团并转为中国共产党党员，得以近距离聆听党中央的部署与指引。自此他告别书斋彷徨，毅然投身工农运动的洪流，南昌遂成为他十余年革命征途的真正起点与精神锚地\n\n### 📍 重要地点：上海\n- **时间**：公元1922年-1923年\n- **停留时间**：约1年\n- **地点**：上海市（今上海市）\n- **事件**：加入中国社会主义青年团，结识赵醒侬等共产党人，参与《向导》等刊物的发行工作。\n- **意义**：方志敏在南昌正式加入中国社会主义青年团并转为中国共产党党员，得以近距离聆听党中央的部署与指引。自此他告别书斋彷徨，毅然投身工农运动的洪流，南昌遂成为他十余年革命征途的真正起点与精神锚地\n\n### 📍 重要地点：弋阳、横峰\n- **时间**：公元1925年-1928年\n- **停留时间**：约3年\n- **地点**：江西省弋阳县、横峰县（今江西省上饶市弋阳县、横峰县）\n- **事件**：回乡开展农民运动，建立农民协会；1927年大革命失败后，领导弋横起义，创建工农革命军。\n- **意义**：创建革命武装和农村革命根据地的起点，实践“工农武装割据”思想。\n\n### 📍 重要地点：赣东北革命根据地（葛源）\n- **时间**：公元1929年-1934年\n- **停留时间**：约5年\n- **地点**：江西省横峰县葛源镇（今江西省上饶市横峰县葛源镇）\n- **事件**：领导建立赣东北省（后为闽浙赣省）苏维埃政府，担任主席；领导根据地进行土地革命、经济建设和反“围剿”斗争；被中华苏维埃共和国临时中央政府授予红旗勋章。\n- **意义**：革命事业的鼎盛时期，成功创建并巩固了一块重要的革命根据地，被誉为“方志敏式”的革命根据地。\n\n### 📍 重要地点：怀玉山\n- **时间**：公元1935年1月\n- **停留时间**：约20天\n- **地点**：江西省玉山县怀玉山区（今江西省上饶市玉山县怀玉山）\n- **事件**：率领红十军团北上抗日先遣队，在返回闽浙赣根据地途中，遭国民党军重兵围困于怀玉山区，因叛徒出卖被俘。\n- **意义**：革命生涯的重大转折点，从战场转入监狱，但其坚贞不屈的斗争进入新阶段。\n\n### 📍 重要地点：南昌（狱中）\n- **时间**：公元1935年1月-8月\n- **停留时间**：约7个月\n- **地点**：江西省南昌市国民党驻赣绥靖公署军法处看守所（今江西省南昌市）\n- **事件**：在狱中写下《可爱的中国》《清贫》《狱中纪实》等十余万字文稿；拒绝国民党高官厚禄的劝降，坚贞不屈。\n- **意义**：生命最后的光辉，以笔为枪，留下了宝贵的精神遗产，展现了共产党人的崇高气节。\n- **名篇名句**：《可爱的中国》：“朋友！中国是生育我们的母亲。你们觉得这位母亲可爱吗？”；《清贫》：“清贫，洁白朴素的生活，正是我们革命者能够战胜许多困难的地方！”\n\n### 🔴 去世地：南昌\n- **时间**：公元1935年8月6日\n- **停留时间**：就义当日\n- **地点**：江西省南昌市下沙窝（今江西省南昌市东湖区下沙窝）\n- **事件**：在南昌市下沙窝英勇就义。\n- **意义**：为中国人民的解放事业献出了宝贵生命，其精神成为激励后人的不朽丰碑。\n\n---\n\n## 生平时间线\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1899 | 湖塘村 | 江西省上饶市弋阳县漆工镇湖塘村 | （年龄：0）生于江西省弋阳县湖塘村。 |\n| 1916 |  |  | （年龄：17）入江西省立甲种工业学校学习。 |\n| 1922 | 九江 | 江西省九江市 | （年龄：23）在九江、上海等地活动；赴上海后加入中国社会主义青年团。 |\n| 1924 | 南昌 | 江西省南昌市 | （年龄：25）在南昌加入中国共产党。 |\n| 1925 |  |  | （年龄：26）回弋阳开展农民运动。 |\n| 1927 |  |  | （年龄：28）领导弋横起义，创建工农革命军。 |\n| 1928 | 赣东北革命根据地（葛源） | 江西省上饶市横峰县葛源镇 | （年龄：29）开始创建赣东北革命根据地。 |\n| 1930 |  |  | （年龄：31）任赣东北特区苏维埃政府主席。 |\n| 1931 |  |  | （年龄：32）当选中华苏维埃共和国中央执行委员；赣东北省苏维埃政府成立，任主席。 |\n| 1932 |  |  | （年龄：33）闽浙赣省苏维埃政府成立，任主席。 |\n| 1933 |  |  | （年龄：34）获中华苏维埃共和国“红旗勋章”；任红十军团军政委员会主席。 |\n| 1934 |  |  | （年龄：35）率红十军团北上抗日先遣队。 |\n| 1935年1月 | 怀玉山 | 江西省上饶市玉山县怀玉山 | （年龄：36）在怀玉山被俘。 |\n| 1935年8月6日 | 南昌 | 江西省南昌市东湖区下沙窝 | （年龄：36）在江西南昌英勇就义。 |\n\n---\n\n## 人教版教材知识点\n### 语文（课文/词作）\n- 课文/词作：**《可爱的中国》**、**《清贫》**（常作为革命传统教育篇目节选）\n- 核心要点：\n    - **重点**：**《可爱的中国》** 以炽热的爱国情怀，将祖国比喻为“母亲”，抒发了对祖国未来的坚定信念和为之牺牲的无畏精神。\n    - **重点**：**《清贫》** 通过叙述自己被俘时的“一桩趣事”，展现了共产党人矜持不苟、舍己为公的**廉洁**品格，诠释了“清贫”的深刻内涵。\n    - **革命浪漫主义**与**革命现实主义**相结合的文风，既有对未来的美好憧憬，也有对现实斗争的冷静记述。\n    - **象征**手法的运用，如用“母亲”象征祖国，增强了文章的感染力。\n    - **重点**：语言质朴而富有力量，情感真挚，是进行**爱国主义**和**革命气节**教育的典范文本。\n    - 作品中体现的**信仰**力量与**人格**魅力，超越了时代，具有永恒的价值。\n\n### 历史（史实/人物定位）\n- 关键史实：\n    - **重点**：**弋横起义**（1927年底至1928年初）是方志敏在赣东北地区领导的重要武装起义，为创建革命根据地奠定了基础。\n    - 创建**赣东北（闽浙赣）革命根据地**，是土地革命战争时期全国六大苏区之一，被毛泽东誉为“方志敏式”的根据地。\n    - **重点**：方志敏早年创建的是**中国工农红军第十军**；1934年红十军与红七军团合编为**红十军团**后，他担任重要领导职务，并率部北上抗日，体现了党的抗日主张。\n    - **怀玉山被俘**（1935年1月）是其个人命运和红十军团北上行动的重大挫折。\n    - 在狱中坚贞不屈，写下**《可爱的中国》**等著作，最终在南昌英勇就义。\n- 核心要点：\n    - **重点**：方志敏是**中国共产党**早期杰出的农民运动领袖和**无产阶级革命家**，其革命实践丰富了“工农武装割据”的思想。\n    - **重点**：他领导创建的**闽浙赣革命根据地**在政权、经济、文化等方面的建设成就，是中国共产党局部执政的重要探索。\n    - **重点**：其著作和事迹集中体现共产党人的**爱国主义**精神、**清正廉洁**的作风和**坚定信仰**，是重要的**红色精神**遗产。\n    - 他的牺牲，是**土地革命战争**时期国民党对苏区进行残酷“围剿”的一个历史缩影。\n    - 作为**抗日先遣队**的领导人之一，其北上行动在战略上策应了中央红军的长征，具有重要的历史意义。\n\n---\n\n## 地点坐标\n| 现称 | 纬度 | 经度 |\n| :--- | :--- | :--- |\n| 江西省上饶市弋阳县漆工镇湖塘村 | 28.40 | 117.42 |\n| 江西省南昌市 | 28.68 | 115.86 |\n| 江西省九江市 | 29.71 | 116.00 |\n| 上海市 | 31.23 | 121.47 |\n| 江西省上饶市横峰县 | 28.42 | 117.60 |\n| 江西省上饶市横峰县葛源镇 | 28.52 | 117.55 |\n| 江西省上饶市玉山县怀玉山 | 28.92 | 118.05 |\n| 江西省南昌市东湖区下沙窝 | 28.70 | 115.89 |\n", "relatedGraph": {"center": {"id": 193, "name": "方志敏", "file": "方志敏.html", "dynasty": "中国近现代（中华民国）", "birth_year": 1899, "death_year": 1935, "time_year": 1924, "quote": "马克思主义研究会", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "无产阶级革命家", "birthplace": "江西省弋阳县漆工镇湖塘村", "birthplace_raw": "江西省弋阳县漆工镇湖塘村今江西省上饶市弋阳县", "birthplace_modern": "江西省上饶市弋阳县", "birth_lat_wgs84": 28.4, "birth_lng_wgs84": 117.42, "birth_lat": 28.4, "birth_lng": 117.42, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["方志敏"], "search_tokens": ["方志敏", "fangzhimin", "fzm"], "search_pinyin": ["fangzhimin", "fzm"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 07:17:24", "isCenter": true, "relationLabel": "中心人物"}, "nodes": [{"id": 193, "name": "方志敏", "file": "方志敏.html", "dynasty": "中国近现代（中华民国）", "birth_year": 1899, "death_year": 1935, "time_year": 1924, "quote": "马克思主义研究会", "review": "", "aliases": [], "foreign_name": "", "domain_tags": [], "main_role_band": "politics", "main_role_label": "无产阶级革命家", "birthplace": "江西省弋阳县漆工镇湖塘村", "birthplace_raw": "江西省弋阳县漆工镇湖塘村今江西省上饶市弋阳县", "birthplace_modern": "江西省上饶市弋阳县", "birth_lat_wgs84": 28.4, "birth_lng_wgs84": 117.42, "birth_lat": 28.4, "birth_lng": 117.42, "birth_coord_system": "WGS84", "has_story": 1, "native_place": "", "native_place_raw": "", "native_place_modern": "", "search_keys": ["方志敏"], "search_tokens": ["方志敏", "fangzhimin", "fzm"], "search_pinyin": ["fangzhimin", "fzm"], "is_foreign": 0, "created_at": "2026-07-01 07:17:24", "updated_at": "2026-07-01 0
