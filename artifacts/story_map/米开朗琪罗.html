  /* P4: promote to its own compositing layer so transform/opacity
     transitions don't trigger paint on the parent canvas. */
  will-change: transform, opacity, box-shadow;

  box-shadow: 0 0 0 0 var(--pulse-soft, rgba(26, 115, 232, 0.18));
  /* P1: promote to own layer + isolate paint to keep 60fps under load. */
  will-change: transform, opacity;
  contain: layout style paint;

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */
@media (prefers-reduced-motion: reduce) {
  .map-pulse-marker,
  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

与美。\n- 其作品风格雄伟、有力，充满**英雄主义**色彩，与达·芬奇的科学理性、拉斐尔的优美恬静形成对比。\n- 西斯廷教堂天顶画以《**旧约·创纪纪**》为题材，包含《**创造亚当**》等著名场景。\n- 《最后的审判》是其绘画艺术的另一高峰，构图宏大，人物众多，体现了**宗教改革**时期复杂的宗教情绪。\n- 他晚年主要从事**建筑**设计，其设计的**圣彼得大教堂穹顶**成为罗马城市的象征。\n- 他不仅是艺术家，也是一位**诗人**，留有大量十四行诗，表达其艺术思想与人生苦闷。","workTexts": {"圣家族": "创作《圣家族》圆形画。","诗集": "“我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘摇。”","大卫": "意义：1501年重返故里，他接手冷落四十年的废弃大理石，三年后《大卫》从石中站起令全城倾倒。","最后的审判": "《最后的审判》创作约六年。","创世纪": "事迹：应教皇尤利乌斯二世之命，独立完成西斯廷教堂天顶画《创世纪》（1508-1512）","酒神巴克斯": "| 1496 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：21）首次前往罗马，创作《酒神巴克斯》。","哀悼基督": "| 1497-1500 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：22-25）在罗马创作《哀悼基督》，声名鹊起。","**大卫**": "关键事件：为佛罗伦萨创作雕像《大卫》，成为城市共和国的精神象征。","**创世纪**": "绘画西斯廷教堂天顶画（《创世纪》）。","**最后的审判**": "代表作品/思想：西斯廷教堂祭坛画《最后的审判》体现了其晚年对神权与人性的复杂思考"},"workSummaries": {"大卫": {"title": "大卫","aliases": [],"authors": ["米开朗琪罗"],"related_people": ["米开朗琪罗"],"source_pages": ["米开朗琪罗"],"era": "文艺复兴盛期（意大利）","genre": "雕塑","one_liner": "米开朗琪罗于1501-1504年用一整块大理石雕成的巨型男性裸体立像，高约5.17米，表现圣经英雄大卫迎战歌利亚前的瞬间，是文艺复兴盛期雕塑艺术的巅峰之作。","summary": "意义：1501年重返故里，他接手冷落四十年的废弃大理石，三年后《大卫》从石中站起令全城倾倒。","quote": "","quotes": [],"quote_policy": "summary_only"},"哀悼基督": {"title": "哀悼基督","aliases": [],"authors": ["米开朗琪罗"],"related_people": ["米开朗琪罗"],"source_pages": ["米开朗琪罗"],"era": "文艺复兴盛期（意大利）","genre": "雕塑","one_liner": "米开朗琪罗23岁时以整块大理石雕成的成名作，描绘圣母玛利亚怀抱基督遗体后的深沉哀痛，是文艺复兴盛期雕塑艺术的至高典范之一。","summary": "| 1497-1500 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：22-25）在罗马创作《哀悼基督》，声名鹊起。","quote": "","quotes": [],"quote_policy": "summary_only"},"摩西": {"title": "摩西","aliases": [],"authors": ["米开朗琪罗"],"related_people": ["米开朗琪罗"],"source_pages": ["米开朗琪罗"],"era": "文艺复兴盛期","genre": "雕塑","one_liner": "米开朗琪罗为教皇尤利乌斯二世陵墓创作的大理石雕像，刻画摩西得知以色列人崇拜金牛犊后怒目回头的瞬间，以磅礴气势与精湛人体表现力彰显领袖的愤怒与神性威严。","summary": "米开朗琪罗生于文艺复兴鼎盛时期的意大利，少年时即展露艺术天赋，受到美第奇家族赏识","quote": "","quotes": [],"quote_policy": "preferred"},"创世纪": {"title": "创世纪","aliases": [],"authors": ["米开朗琪罗"],"related_people": ["米开朗琪罗"],"source_pages": ["米开朗琪罗"],"era": "文艺复兴盛期（意大利）","genre": "壁画","one_liner": "西斯廷教堂天顶壁画，以《旧约·创世纪》为题材，描绘上帝创造天地万物及人类始祖的九幅核心场景，含《创 开朗琪罗"],"source_pages": ["达·芬奇","米开朗琪罗"],"era": "文艺复兴时期（15-16世纪）","genre": "油画","one_liner": "达·芬奇创作的肖像油画，描绘一位佛罗伦萨女性含蓄而神秘的微笑，采用渐隐法处理轮廓，是世界上最著名的绘画作品之一，现藏于巴黎卢浮宫。","summary": "那微笑，被称为‘神秘的微笑’。","quote": "设计了大量超越时代的机械草图，包括飞行器、军事器械和水利装置。","quotes": ["设计了大量超越时代的机械草图，包括飞行器、军事器械和水利装置。","在解剖学、流体力学、光学、地质学等领域有开创性研究；","事件：为安农齐塔教堂绘制《圣母子与圣安妮》草图；"],"quote_policy": "preferred"},"最后的晚餐": {"title": "最后的晚餐","aliases": [],"authors": ["达·芬奇"],"related_people": ["达·芬奇","米开朗琪罗"],"source_pages": ["达·芬奇","米开朗琪罗"],"era": "文艺复兴时期（15-16世纪）","genre": "壁画","one_liner": "达·芬奇为米兰感恩圣母修道院餐厅创作的壁画，描绘耶稣在最后的晚餐宣布门徒中将有一人出卖他的戏剧性瞬间，以精妙构图和人物心理刻画成为文艺复兴艺术巅峰。","summary": "你们中间有一个人要出卖我了。","quote": "达·芬奇出生于托斯卡纳的芬奇镇，是佛罗伦萨公证人与农家女的私生子。","quotes": ["达·芬奇出生于托斯卡纳的芬奇镇，是佛罗伦萨公证人与农家女的私生子。","设计了大量超越时代的机械草图，包括飞行器、军事器械和水利装置。","在解剖学、流体力学、光学、地质学等领域有开创性研究；"],"quote_policy": "preferred"},"雅典学院": {"title": "雅典学院","aliases": [],"authors": [],"related_people": ["米开朗琪罗"],"source_pages": ["米开朗琪罗"],"era": "文艺复兴盛期","genre": "壁画","one_liner": "米开朗琪罗生于文艺复兴鼎盛时期的意大利，少年时即展露艺术天赋，受到美第奇家族赏识","summary": "米开朗琪罗生于文艺复兴鼎盛时期的意大利，少年时即展露艺术天赋，受到美第奇家族赏识","quote": "","quotes": [],"quote_policy": "summary_only"}},"markdown": "# 米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼（Michelangelo di Lodovico Buonarroti Simoni）\n- **时代**：文艺复兴盛期（意大利）\n- **出生**：1475年3月6日，意大利卡普雷塞（今托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗）\n- **去世**：1564年2月18日，意大利罗马\n- **享年**：88岁\n- **主要身份**：雕塑家、画家、建筑师、诗人\n- **历史地位**：文艺复兴盛期的艺术巨匠，与达·芬奇、拉斐尔并称“文艺复兴后三杰”，其作品标志着西方艺术的高峰之一。\n- **主要成就**：创作雕塑《大卫》、《哀悼基督》、《摩西》；完成西斯廷教堂天顶画《创世纪》与祭坛画《最后的审判》；主持设计圣彼得大教堂穹顶及罗马卡比托利欧广场。\n\n### 生平概述\n米开朗琪罗生于文艺复兴鼎盛时期的意大利，少年时即展露艺术天赋，受到美第奇家族赏识。他一生主要服务于佛罗伦萨共和国和多位教皇，辗转于佛罗伦萨与罗马之间。其艺术创作以雄伟、力量与深刻的人文主义精神著称，将雕塑的立体感融入绘画，开创了独特的艺术风格。他性格孤傲坚韧，终身未婚，将全部生命奉献给艺术，直至88岁高龄仍在从事建筑设计。他的作品不仅代表了文艺复兴艺术的最高成就，也深刻影响了后世巴洛克艺术的发展。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于意大利中部，以佛罗伦萨和罗马为核心，足迹遍及博洛尼亚等地。\n- ⏱️ **时间跨度**：1475年 - 1564年，共计约88年。\n- 📍 **地理范围**：主要覆盖今意大利托斯卡纳大区、拉齐奥大区、艾米利亚-罗马涅大区。\n- 🌟 **重要节点数量**：7个核心地点（出生地卡普雷塞、佛罗伦萨、博洛尼亚、罗马、佛罗伦萨美第奇家族墓园、罗马晚年建筑时期，去世地罗马包含在最后一个罗马节点内）。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n### 🟢 出生地：卡普雷塞\n- **公元纪年**：1475年\n- **停留时间**：幼年（约2岁后迁离）\n- **位置**：卡普雷塞（今意大利托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗）\n- **事迹**：在此出生，父亲是当地行政长官。\n- **意义**：生命的起点，家族与托斯卡纳乡村的联系影响了他对石材的亲近感。\n\n### 📍 重要地点：佛罗伦萨\n- **公元纪年**：1477年 - 1489年；1490年 - 1494年；1501年 - 1505年；1516年 - 1534年（多次往返）\n- **停留时间**：童年、学艺及主要创作期，累计居住约三十年。\n- **位置**：佛罗伦萨共和国（今意大利托斯卡纳大区佛罗伦萨）\n- **事迹**：1488年进入多梅尼科·基尔兰达约画坊学画；后在“美第奇花园”学习雕塑，师从贝尔托尔多·迪·乔瓦尼；创作《阶梯上的圣母》、《半人马之战》浮雕；完成成名作《大卫》；创作《圣家族》圆形画。\n- **意义**：艺术摇篮与精神故乡，在此形成古典主义美学理念，奠定其艺术声誉。\n- **名篇名句**：《诗集》第151首：“我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘摇。”\n\n### 📍 重要地点：博洛尼亚\n- **公元纪年**：1494年 - 1495年\n- **停留时间**：约一年\n- **位置**：博洛尼亚（今意大利艾米利亚-罗马涅大区博洛尼亚）\n- **事迹**：因政治动荡逃离佛罗伦萨后暂居于此，为圣多明我教堂制作了《圣普罗库鲁斯》、《圣佩特罗尼乌斯》和《天使像》三件小型雕像。\n- **意义**：1501年重返故里，他接手冷落四十年的废弃大理石，三年后《大卫》从石中站起令全城倾倒。消息越过亚平宁山传入罗马，尤利乌斯二世立刻邀他赴梵蒂冈，一代巨匠的巅峰时代就此启幕\n\n### 📍 重要地点：罗马（第一次）\n- **公元纪年**：1496年 - 1501年\n- **停留时间**：约五年\n- **位置**：罗马（今意大利拉齐奥大区罗马）\n- **事迹**：创作《酒神巴克斯》；为圣彼得大教堂创作成名作《哀悼基督》（又称《圣殇》），一举成名。\n- **意义**：1501年重返故里，他接手冷落四十年的废弃大理石，三年后《大卫》从石中站起令全城倾倒。消息越过亚平宁山传入罗马，尤利乌斯二世立刻邀他赴梵蒂冈，一代巨匠的巅峰时代就此启幕\n- **名篇名句**：《诗集》第152首：“燃烧的火焰，吞噬着我，我却无法将它熄灭。”\n\n### 📍 重要地点：罗马（第二次，西斯廷时期）\n- **公元纪年**：1508年 - 1512年；1534年 - 1541年（再次）\n- **停留时间**：天顶画创作约四年；《最后的审判》创作约六年。\n- **位置**：罗马（梵蒂冈，西斯廷教堂）\n- **事迹**：应教皇尤利乌斯二世之命，独立完成西斯廷教堂天顶画《创世纪》（1508-1512）；多年后又为教皇保罗三世绘制祭坛画《最后的审判》（1534-1541）。\n- **意义**：创作了西方艺术史上最宏伟的绘画作品之一，展现了无与伦比的构图能力与人体表现力。\n- **名篇名句**：《诗集》第151首：“我的胡子翘向天，我的后脑勺贴在背上……颜料从天花板上滴落，把我的脸涂成五彩斑斓的地板。”\n\n### 📍 重要地点：佛罗伦萨（美第奇家族墓园）\n- **公元纪年**：1520年 - 1534年\n- **停留时间**：断断续续约十四年\n- **位置**：佛罗伦萨（今意大利托斯卡纳大区佛罗伦萨），圣洛伦佐教堂内新圣器室\n- **事迹**：为美第奇家族设计陵墓并创作《昼》、《夜》、《晨》、《暮》四座寓意雕像及《洛伦佐·德·美第奇》、《朱利亚诺·德·美第奇》坐像。\n- **意义**：建筑、雕塑与空间设计的完美结合，体现了其晚年对生死、时间的深沉思考。\n- **名篇名句**：《诗集》第285首（《夜》的答诗）：“睡眠是甜蜜的，成为顽石更是幸福，只要世上还有罪恶与耻辱，不见不闻，无知无觉，是我最大的快乐。不要惊醒我，啊，说话轻些吧！”\n\n### 📍 重要地点：罗马（晚年建筑时期）\n- **公元纪年**：1546年 - 1564年\n- **停留时间**：约十八年，直至去世。\n- **位置**：罗马\n- **事迹**：被任命为圣彼得大教堂首席建筑师，设计并督建其标志性穹顶；主持设计罗马卡比托利欧广场（市政广场）。\n- **意义**：从雕塑、绘画转向建筑，完成了从艺术家到建筑大师的升华，其穹顶设计成为后世典范。\n\n### 🔴 去世地：罗马\n- **公元纪年**：1564年2月18日\n- **停留时间**：晚年定居于此\n- **位置**：罗马（今意大利拉齐奥大区罗马）\n- **经过**：在持续工作直至去世前几天，因病在罗马的住所逝世。临终前，他要求死后将遗体运回佛罗伦萨。\n- **意义**：生命与艺术事业的终点，其葬礼在罗马举行，后遗体迁葬佛罗伦萨圣十字圣殿，实现了“魂归故里”。\n- **名篇名句**：《诗集》第282首：“我生命之程途已走完，如同小舟越过汹涌的海面，抵达了彼岸，众人共聚，计算得失与盈亏。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 1475 | 卡普雷塞 | 意大利托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗 | （年龄：0）出生于卡普雷塞。 |\n| 1488 |  |  | （年龄：13）进入多梅尼科·基尔兰达约画坊学画。 |\n| 1490 |  |  | （年龄：15）进入美第奇家族创办的雕塑学校，受洛伦佐·德·美第奇赏识。 |\n| 1494 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | （年龄：19）因政治动荡离开佛罗伦萨，前往博洛尼亚。 |\n| 1496 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：21）首次前往罗马，创作《酒神巴克斯》。 |\n| 1497-1500 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：22-25）在罗马创作《哀悼基督》，声名鹊起。 |\n| 1501-1504 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | （年龄：26-29）返回佛罗伦萨，创作巨像《大卫》。 |\n| 1505 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：30）应教皇尤利乌斯二世之召赴罗马，筹备教皇陵墓工程（后屡次中断）。 |\n| 1508-1512 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：33-37）在罗马创作西斯廷教堂天顶画《创世纪》。 |\n| 1516 | 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | （年龄：41）开始为佛罗伦萨圣洛伦佐教堂立面设计工作（后未完成）。 |\n| 1520-1534 |  |  | （年龄：45-59）为美第奇家族设计圣洛伦佐教堂新圣器室及陵墓雕塑，创作《昼》、《夜》、《晨》、《暮》等雕像。 |\n| 1534-1541 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：59-66）再赴罗马，创作西斯廷教堂祭坛画《最后的审判》。 |\n| 1546 |  |  | （年龄：71）接任圣彼得大教堂首席建筑师。 |\n| 1547-1564 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：72-88）主持设计圣彼得大教堂穹顶及罗马卡比托利欧广场。 |\n| 1564 | 罗马 | 意大利拉齐奥大区罗马 | （年龄：88）2月18日在罗马逝世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n米开朗琪罗是文艺复兴盛期艺术的集大成者与突破者。他的作品以其磅礴的气势、精准的人体解剖和深刻的情感表现，将文艺复兴对“人”的赞美推向极致，直接影响了同时代及稍后的样式主义艺术。作为教皇和权贵的首席艺术家，他的创作定义了16世纪意大利艺术的最高标准，并在建筑领域完成了圣彼得大教堂这一划时代的工程。\n\n### 对后世的影响\n- **艺术范式**：其充满力量感与戏剧性的风格，直接启发了巴洛克艺术大师贝尼尼等人。\n- **人体表现**：对肌肉、动态人体的极致研究，成为后世学院派素描与造型的必修范本。\n- **艺术家地位**：他以顽强的个人意志与艺术追求，塑造了后世“天才艺术家”的独立形象。\n- **建筑遗产**：圣彼得大教堂穹顶成为世界建筑史上的不朽丰碑，影响了后世众多国家的议会与宗教建筑穹顶设计。\n\n### 历史评价\n- **乔尔乔·瓦萨里（艺术史家）**：“米开朗琪罗是上帝派到人间来向我们展示艺术所能达到的最高境界的使者。”\n- **罗曼·罗兰（作家）**：“他是文艺复兴时期最伟大的雕塑家、画家和建筑师……他的痛苦与伟大，是英雄的痛苦与伟大。”\n- **现代艺术史观点**：他不仅是技艺超群的巨匠，更是一位用艺术进行哲学与神学思考的思想者，其作品充满了对人性、神性与命运的深刻探索。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**文艺复兴**时期（14-16世纪），核心思想为**人文主义**。\n- **关键事件**：为**佛罗伦萨**创作雕像《**大卫**》，成为城市共和国的精神象征。\n- **代表作品**：雕塑《**哀悼基督**》、《**大卫**》；绘画**西斯廷教堂天顶画**（《**创世纪**》）。\n- **常见易混点**：与**达·芬奇**（《蒙娜丽莎》、《最后的晚餐》）、**拉斐尔**（《雅典学院》）并称“**文艺复兴美术三杰**”；《大卫》是**雕塑**，不是绘画。\n- **补充说明**：有说法称他与达·芬奇曾在佛罗伦萨市政厅进行壁画竞赛（草图对决），但具体细节存疑。\n\n### 高中阶段\n- **时代背景**：意大利文艺复兴从**盛期**向**样式主义**过渡阶段，社会动荡与宗教改革影响艺术。\n- **关键贡献**：将雕塑的**体积感**与**力量感**融入绘画，形成独特的“**雕塑性绘画**”风格；晚年成为**建筑**大师。\n- **代表作品/思想**：西斯廷教堂祭坛画《**最后的审判**》体现了其晚年对神权与人性的复杂思考；建筑代表作为**圣彼得大教堂穹顶**。\n- **艺术风格**：作品强调**人体动态**、**肌肉表现**和**英雄气概**，充满**戏剧性**与**悲剧性**张力。\n- **对比点**：与达·芬奇的“**渐隐法**”和神秘感、拉斐尔的典雅和谐形成鲜明对比；其艺术更侧重**内在力量**与**意志**的表达。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 文艺复兴的发源地和中心是**意大利**。\n- “文艺复兴美术三杰”是**达·芬奇**、**米开朗琪罗**、**拉斐尔**。\n- 米开朗琪罗的代表作雕塑《**大卫**》现藏于**佛罗伦萨**学院美术馆。\n- 他创作了梵蒂冈**西斯廷教堂**的天顶画《**创世纪**》。\n- 《哀悼基督》是他早期成名作，展现了高超的**大理石雕刻**技艺。\n- 他与达·芬奇曾在佛罗伦萨市政厅进行“**壁画对决**”（存疑，草图竞赛确有其事）。\n\n### 高中阶段\n- 米开朗琪罗的艺术体现了**人文主义**精神，歌颂人的力量与美。\n- 其作品风格雄伟、有力，充满**英雄主义**色彩，与达·芬奇的科学理性、拉斐尔的优美恬静形成对比。\n- 西斯廷教堂天顶画以《**旧约·创纪纪**》为题材，包含《**创造亚当**》等著名场景。\n- 《最后的审判》是其绘画艺术的另一高峰，构图宏大，人物众多，体现了**宗教改革**时期复杂的宗教情绪。\n- 他晚年主要从事**建筑**设计，其设计的**圣彼得大教堂穹顶**成为罗马城市的象征。\n- 他不仅是艺术家，也是一位**诗人**，留有大量十四行诗，表达其艺术思想与人生苦闷。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 卡普雷塞 | 意大利托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗 | 43.3478 | 11.9839 |\n| 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | 43.7696 | 11.2558 |\n| 博洛尼亚 | 意大利艾米利亚-罗马涅大区博洛尼亚 | 44.4949 | 11.3426 |\n| 罗马 | 意大利拉齐奥大区罗马 | 41.9028 | 12.4964 |","relatedGraph": {"center": {"id": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼","name": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼","file": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼.html","dynasty": "文艺复兴盛期（意大利）","aliases": [],"birth_year": 1475,"death_year": 1564,"quote": "我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘摇。","review": "我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘摇。","foreign_name": "","main_role_label": "文艺复兴后三杰","birthplace": "意大利卡普雷塞（今托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗）","birthplace_modern": "","domain_tags": [],"has_story": true,"relationLabel": "中心人物","isCenter": true},"nodes": [{"id": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼","name": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼","file": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼.html","dynasty": "文艺复兴盛期（意大利）","aliases": [],"birth_year": 1475,"death_year": 1564,"quote": "我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘
