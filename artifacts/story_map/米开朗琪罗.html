h", "event": "在持续工作直至去世前几天，因病在罗马的住所逝世。临终前，他要求死后将遗体运回佛罗伦萨。", "time": "1564年2月18日", "duration": "晚年定居于此", "significance": "生命与艺术事业的终点，其葬礼在罗马举行，后遗体迁葬佛罗伦萨圣十字圣殿，实现了“魂归故里”。", "works": [], "quoteLines": ["《诗集》第282首：“我生命之程途已走完，如同小舟越过汹涌的海面，抵达了彼岸，众人共聚，计算得失与盈亏。”"]}], "mapStyle": {"pathColor": "#1e40af", "markers": {"normal": {"color": "#3498db"}, "birth": {"color": "#2ecc71"}, "death": {"color": "#e74c3c"}}}, "textbookPoints": "### 初中阶段\n- **时代背景**：**文艺复兴**时期（14-16世纪），核心思想为**人文主义**。\n- **关键事件**：为**佛罗伦萨**创作雕像《**大卫**》，成为城市共和国的精神象征。\n- **代表作品**：雕塑《**哀悼基督**》、《**大卫**》；绘画**西斯廷教堂天顶画**（《**创世纪**》）。\n- **常见易混点**：与**达·芬奇**（《蒙娜丽莎》、《最后的晚餐》）、**拉斐尔**（《雅典学院》）并称“**文艺复兴美术三杰**”；《大卫》是**雕塑**，不是绘画。\n- **补充说明**：有说法称他与达·芬奇曾在佛罗伦萨市政厅进行壁画竞赛（草图对决），但具体细节存疑。\n\n### 高中阶段\n- **时代背景**：意大利文艺复兴从**盛期**向**样式主义**过渡阶段，社会动荡与宗教改革影响艺术。\n- **关键贡献**：将雕塑的**体积感**与**力量感**融入绘画，形成独特的“**雕塑性绘画**”风格；晚年成为**建筑**大师。\n- **代表作品/思想**：西斯廷教堂祭坛画《**最后的审判**》体现了其晚年对神权与人性的复杂思考；建筑代表作为**圣彼得大教堂穹顶**。\n- **艺术风格**：作品强调**人体动态**、**肌肉表现**和**英雄气概**，充满**戏剧性**与**悲剧性**张力。\n- **对比点**：与达·芬奇的“**渐隐法**”和神秘感、拉斐尔的典雅和谐形成鲜明对比；其艺术更侧重**内在力量**与**意志**的表达。\n\n---", "examPoints": "### 初中阶段\n- 文艺复兴的发源地和中心是**意大利**。\n- “文艺复兴美术三杰”是**达·芬奇**、**米开朗琪罗**、**拉斐尔**。\n- 米开朗琪罗的代表作雕塑《**大卫**》现藏于**佛罗伦萨**学院美术馆。\n- 他创作了梵蒂冈**西斯廷教堂**的天顶画《**创世纪**》。\n- 《哀悼基督》是他早期成名作，展现了高超的**大理石雕刻**技艺。\n- 他与达·芬奇曾在佛罗伦萨市政厅进行“**壁画对决**”（存疑，草图竞赛确有其事）。\n\n### 高中阶段\n- 米开朗琪罗的艺术体现了**人文主义**精神，歌颂人的力量与美。\n- 其作品风格雄伟、有力，充满**英雄主义**色彩，与达·芬奇的科学理性、拉斐尔的优美恬静形成对比。\n- 西斯廷教堂天顶画以《**旧约·创纪纪**》为题材，包含《**创造亚当**》等著名场景。\n- 《最后的审判》是其绘画艺术的另一高峰，构图宏大，人物众多，体现了**宗教改革**时期复杂的宗教情绪。\n- 他晚年主要从事**建筑**设计，其设计的**圣彼得大教堂穹顶**成为罗马城市的象征。\n- 他不仅是艺术家，也是一位**诗人**，留有大量十四行诗，表达其艺术思想与人生苦闷。", "markdown": "# 米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼\n\n## 一、人物档案\n\n### 基本信息\n- **姓名**：米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼（Michelangelo di Lodovico Buonarroti Simoni）\n- **时代**：文艺复兴盛期（意大利）\n- **出生**：1475年3月6日，意大利卡普雷塞（今托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗）\n- **去世**：1564年2月18日，意大利罗马\n- **享年**：88岁\n- **主要身份**：雕塑家、画家、建筑师、诗人\n- **历史地位**：文艺复兴盛期的艺术巨匠，与达·芬奇、拉斐尔并称“文艺复兴后三杰”，其作品标志着西方艺术的高峰之一。\n- **主要成就**：创作雕塑《大卫》、《哀悼基督》、《摩西》；完成西斯廷教堂天顶画《创世纪》与祭坛画《最后的审判》；主持设计圣彼得大教堂穹顶及罗马卡比托利欧广场。\n\n### 生平概述\n米开朗琪罗生于文艺复兴鼎盛时期的意大利，少年时即展露艺术天赋，受到美第奇家族赏识。他一生主要服务于佛罗伦萨共和国和多位教皇，辗转于佛罗伦萨与罗马之间。其艺术创作以雄伟、力量与深刻的人文主义精神著称，将雕塑的立体感融入绘画，开创了独特的艺术风格。他性格孤傲坚韧，终身未婚，将全部生命奉献给艺术，直至88岁高龄仍在从事建筑设计。他的作品不仅代表了文艺复兴艺术的最高成就，也深刻影响了后世巴洛克艺术的发展。\n\n---\n\n## 二、人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于意大利中部，以佛罗伦萨和罗马为核心，足迹遍及博洛尼亚等地。\n- ⏱️ **时间跨度**：1475年 - 1564年，共计约88年。\n- 📍 **地理范围**：主要覆盖今意大利托斯卡纳大区、拉齐奥大区、艾米利亚-罗马涅大区。\n- 🌟 **重要节点数量**：7个核心地点（出生地卡普雷塞、佛罗伦萨、博洛尼亚、罗马、佛罗伦萨美第奇家族墓园、罗马晚年建筑时期，去世地罗马包含在最后一个罗马节点内）。\n\n---\n\n## 三、人生历程与重要地点（按时间顺序）\n\n### 🟢 出生地：卡普雷塞\n- **公元纪年**：1475年\n- **停留时间**：幼年（约2岁后迁离）\n- **位置**：卡普雷塞（今意大利托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗）\n- **事迹**：在此出生，父亲是当地行政长官。\n- **意义**：生命的起点，家族与托斯卡纳乡村的联系影响了他对石材的亲近感。\n\n### 📍 重要地点：佛罗伦萨\n- **公元纪年**：1477年 - 1489年；1490年 - 1494年；1501年 - 1505年；1516年 - 1534年（多次往返）\n- **停留时间**：童年、学艺及主要创作期，累计居住约三十年。\n- **位置**：佛罗伦萨共和国（今意大利托斯卡纳大区佛罗伦萨）\n- **事迹**：1488年进入多梅尼科·基尔兰达约画坊学画；后在“美第奇花园”学习雕塑，师从贝尔托尔多·迪·乔瓦尼；创作《阶梯上的圣母》、《半人马之战》浮雕；完成成名作《大卫》；创作《圣家族》圆形画。\n- **意义**：艺术摇篮与精神故乡，在此形成古典主义美学理念，奠定其艺术声誉。\n- **名篇名句**：《诗集》第151首：“我的生命，在这喧嚣的尘世，如一条小船，在风暴中飘摇。”\n\n### 📍 重要地点：博洛尼亚\n- **公元纪年**：1494年 - 1495年\n- **停留时间**：约一年\n- **位置**：博洛尼亚（今意大利艾米利亚-罗马涅大区博洛尼亚）\n- **事迹**：因政治动荡逃离佛罗伦萨后暂居于此，为圣多明我教堂制作了《圣普罗库鲁斯》、《圣佩特罗尼乌斯》和《天使像》三件小型雕像。\n- **意义**：流亡时期，接触了博洛尼亚的雕刻传统，技艺得到锤炼。\n\n### 📍 重要地点：罗马（第一次）\n- **公元纪年**：1496年 - 1501年\n- **停留时间**：约五年\n- **位置**：罗马（今意大利拉齐奥大区罗马）\n- **事迹**：创作《酒神巴克斯》；为圣彼得大教堂创作成名作《哀悼基督》（又称《圣殇》），一举成名。\n- **意义**：艺术生涯的重大突破期，在罗马艺术圈确立了顶尖地位。\n- **名篇名句**：《诗集》第152首：“燃烧的火焰，吞噬着我，我却无法将它熄灭。”\n\n### 📍 重要地点：罗马（第二次，西斯廷时期）\n- **公元纪年**：1508年 - 1512年；1534年 - 1541年（再次）\n- **停留时间**：天顶画创作约四年；《最后的审判》创作约六年。\n- **位置**：罗马（梵蒂冈，西斯廷教堂）\n- **事迹**：应教皇尤利乌斯二世之命，独立完成西斯廷教堂天顶画《创世纪》（1508-1512）；多年后又为教皇保罗三世绘制祭坛画《最后的审判》（1534-1541）。\n- **意义**：创作了西方艺术史上最宏伟的绘画作品之一，展现了无与伦比的构图能力与人体表现力。\n- **名篇名句**：《诗集》第151首：“我的胡子翘向天，我的后脑勺贴在背上……颜料从天花板上滴落，把我的脸涂成五彩斑斓的地板。”\n\n### 📍 重要地点：佛罗伦萨（美第奇家族墓园）\n- **公元纪年**：1520年 - 1534年\n- **停留时间**：断断续续约十四年\n- **位置**：佛罗伦萨（今意大利托斯卡纳大区佛罗伦萨），圣洛伦佐教堂内新圣器室\n- **事迹**：为美第奇家族设计陵墓并创作《昼》、《夜》、《晨》、《暮》四座寓意雕像及《洛伦佐·德·美第奇》、《朱利亚诺·德·美第奇》坐像。\n- **意义**：建筑、雕塑与空间设计的完美结合，体现了其晚年对生死、时间的深沉思考。\n- **名篇名句**：《诗集》第285首（《夜》的答诗）：“睡眠是甜蜜的，成为顽石更是幸福，只要世上还有罪恶与耻辱，不见不闻，无知无觉，是我最大的快乐。不要惊醒我，啊，说话轻些吧！”\n\n### 📍 重要地点：罗马（晚年建筑时期）\n- **公元纪年**：1546年 - 1564年\n- **停留时间**：约十八年，直至去世。\n- **位置**：罗马\n- **事迹**：被任命为圣彼得大教堂首席建筑师，设计并督建其标志性穹顶；主持设计罗马卡比托利欧广场（市政广场）。\n- **意义**：从雕塑、绘画转向建筑，完成了从艺术家到建筑大师的升华，其穹顶设计成为后世典范。\n\n### 🔴 去世地：罗马\n- **公元纪年**：1564年2月18日\n- **停留时间**：晚年定居于此\n- **位置**：罗马（今意大利拉齐奥大区罗马）\n- **经过**：在持续工作直至去世前几天，因病在罗马的住所逝世。临终前，他要求死后将遗体运回佛罗伦萨。\n- **意义**：生命与艺术事业的终点，其葬礼在罗马举行，后遗体迁葬佛罗伦萨圣十字圣殿，实现了“魂归故里”。\n- **名篇名句**：《诗集》第282首：“我生命之程途已走完，如同小舟越过汹涌的海面，抵达了彼岸，众人共聚，计算得失与盈亏。”\n\n---\n\n## 四、生平时间线\n\n| 年份 | 年龄 | 关键事件 |\n| --- | --- | --- |\n| 1475 | 0 | 出生于卡普雷塞。 |\n| 1488 | 13 | 进入多梅尼科·基尔兰达约画坊学画。 |\n| 1490 | 15 | 进入美第奇家族创办的雕塑学校，受洛伦佐·德·美第奇赏识。 |\n| 1494 | 19 | 因政治动荡离开佛罗伦萨，前往博洛尼亚。 |\n| 1496 | 21 | 首次前往罗马，创作《酒神巴克斯》。 |\n| 1497-1500 | 22-25 | 在罗马创作《哀悼基督》，声名鹊起。 |\n| 1501-1504 | 26-29 | 返回佛罗伦萨，创作巨像《大卫》。 |\n| 1505 | 30 | 应教皇尤利乌斯二世之召赴罗马，筹备教皇陵墓工程（后屡次中断）。 |\n| 1508-1512 | 33-37 | 在罗马创作西斯廷教堂天顶画《创世纪》。 |\n| 1516 | 41 | 开始为佛罗伦萨圣洛伦佐教堂立面设计工作（后未完成）。 |\n| 1520-1534 | 45-59 | 为美第奇家族设计圣洛伦佐教堂新圣器室及陵墓雕塑，创作《昼》、《夜》、《晨》、《暮》等雕像。 |\n| 1534-1541 | 59-66 | 再赴罗马，创作西斯廷教堂祭坛画《最后的审判》。 |\n| 1546 | 71 | 接任圣彼得大教堂首席建筑师。 |\n| 1547-1564 | 72-88 | 主持设计圣彼得大教堂穹顶及罗马卡比托利欧广场。 |\n| 1564 | 88 | 2月18日在罗马逝世。 |\n\n---\n\n## 五、历史影响\n\n### 对当时的影响\n米开朗琪罗是文艺复兴盛期艺术的集大成者与突破者。他的作品以其磅礴的气势、精准的人体解剖和深刻的情感表现，将文艺复兴对“人”的赞美推向极致，直接影响了同时代及稍后的样式主义艺术。作为教皇和权贵的首席艺术家，他的创作定义了16世纪意大利艺术的最高标准，并在建筑领域完成了圣彼得大教堂这一划时代的工程。\n\n### 对后世的影响\n- **艺术范式**：其充满力量感与戏剧性的风格，直接启发了巴洛克艺术大师贝尼尼等人。\n- **人体表现**：对肌肉、动态人体的极致研究，成为后世学院派素描与造型的必修范本。\n- **艺术家地位**：他以顽强的个人意志与艺术追求，塑造了后世“天才艺术家”的独立形象。\n- **建筑遗产**：圣彼得大教堂穹顶成为世界建筑史上的不朽丰碑，影响了后世众多国家的议会与宗教建筑穹顶设计。\n\n### 历史评价\n- **乔尔乔·瓦萨里（艺术史家）**：“米开朗琪罗是上帝派到人间来向我们展示艺术所能达到的最高境界的使者。”\n- **罗曼·罗兰（作家）**：“他是文艺复兴时期最伟大的雕塑家、画家和建筑师……他的痛苦与伟大，是英雄的痛苦与伟大。”\n- **现代艺术史观点**：他不仅是技艺超群的巨匠，更是一位用艺术进行哲学与神学思考的思想者，其作品充满了对人性、神性与命运的深刻探索。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**文艺复兴**时期（14-16世纪），核心思想为**人文主义**。\n- **关键事件**：为**佛罗伦萨**创作雕像《**大卫**》，成为城市共和国的精神象征。\n- **代表作品**：雕塑《**哀悼基督**》、《**大卫**》；绘画**西斯廷教堂天顶画**（《**创世纪**》）。\n- **常见易混点**：与**达·芬奇**（《蒙娜丽莎》、《最后的晚餐》）、**拉斐尔**（《雅典学院》）并称“**文艺复兴美术三杰**”；《大卫》是**雕塑**，不是绘画。\n- **补充说明**：有说法称他与达·芬奇曾在佛罗伦萨市政厅进行壁画竞赛（草图对决），但具体细节存疑。\n\n### 高中阶段\n- **时代背景**：意大利文艺复兴从**盛期**向**样式主义**过渡阶段，社会动荡与宗教改革影响艺术。\n- **关键贡献**：将雕塑的**体积感**与**力量感**融入绘画，形成独特的“**雕塑性绘画**”风格；晚年成为**建筑**大师。\n- **代表作品/思想**：西斯廷教堂祭坛画《**最后的审判**》体现了其晚年对神权与人性的复杂思考；建筑代表作为**圣彼得大教堂穹顶**。\n- **艺术风格**：作品强调**人体动态**、**肌肉表现**和**英雄气概**，充满**戏剧性**与**悲剧性**张力。\n- **对比点**：与达·芬奇的“**渐隐法**”和神秘感、拉斐尔的典雅和谐形成鲜明对比；其艺术更侧重**内在力量**与**意志**的表达。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段\n- 文艺复兴的发源地和中心是**意大利**。\n- “文艺复兴美术三杰”是**达·芬奇**、**米开朗琪罗**、**拉斐尔**。\n- 米开朗琪罗的代表作雕塑《**大卫**》现藏于**佛罗伦萨**学院美术馆。\n- 他创作了梵蒂冈**西斯廷教堂**的天顶画《**创世纪**》。\n- 《哀悼基督》是他早期成名作，展现了高超的**大理石雕刻**技艺。\n- 他与达·芬奇曾在佛罗伦萨市政厅进行“**壁画对决**”（存疑，草图竞赛确有其事）。\n\n### 高中阶段\n- 米开朗琪罗的艺术体现了**人文主义**精神，歌颂人的力量与美。\n- 其作品风格雄伟、有力，充满**英雄主义**色彩，与达·芬奇的科学理性、拉斐尔的优美恬静形成对比。\n- 西斯廷教堂天顶画以《**旧约·创纪纪**》为题材，包含《**创造亚当**》等著名场景。\n- 《最后的审判》是其绘画艺术的另一高峰，构图宏大，人物众多，体现了**宗教改革**时期复杂的宗教情绪。\n- 他晚年主要从事**建筑**设计，其设计的**圣彼得大教堂穹顶**成为罗马城市的象征。\n- 他不仅是艺术家，也是一位**诗人**，留有大量十四行诗，表达其艺术思想与人生苦闷。\n\n## 地点坐标\n\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 卡普雷塞 | 意大利托斯卡纳大区阿雷佐省卡普雷塞-米开朗琪罗 | 43.3478 | 11.9839 |\n| 佛罗伦萨 | 意大利托斯卡纳大区佛罗伦萨 | 43.7696 | 11.2558 |\n| 博洛尼亚 | 意大利艾米利亚-罗马涅大区博洛尼亚 | 44.4949 | 11.3426 |\n| 罗马 | 意大利拉齐奥大区罗马 | 41.9028 | 12.4964 |", "relatedGraph": {"center": {"id": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼", "name": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼", "file": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼.html", "dynasty": "文艺复兴盛期（意大利）", "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼", "name": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼", "file": "米开朗琪罗·迪·洛多维科·博纳罗蒂·西蒙尼.html", "dynasty": "文艺复兴盛期（意大利）", "relationLabel": "中心人物", "isCenter": true}, {"id": "达·芬奇", "name": "达·芬奇", "file": "达·芬奇.html", "dynasty": "文艺复兴时期（15-16世纪）", "relationLabel": "同时代人物", "sourceType": "fallback", "confidence": null, "isCenter": false}, {"id": "米开朗琪罗", "name": "米开朗琪罗", "file": "米开朗琪罗.html", "dynasty": "文   const BS = String.fromCharCode(92);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS}${BS}+n`, 'g');
  const lines = String(raw || '').split(splitRe);
  const chunks = [];
  let current = [];
  const flush = () => {
    if (!current.length) return;
    chunks.push(current);
    current = [];
  };
  for (const rawLine of lines) {
    const t = String(rawLine || '').trim();
    if (/^###\s+/.test(t)) {
      flush();
      current = [rawLine];
      continue;
    }
    if (!current.length && !t) continue;
    current.push(rawLine);
  }
  flush();

  const seen = new Set();
  const deduped = [];
  for (const chunk of chunks) {
    const meaningful = chunk.map((x) => String(x || '').trim()).filter(Boolean);
    if (!meaningful.length) continue;
    if (/^###\s*考点\s*$/.test(meaningful[0])) continue;
    const key = meaningful
      .map((x) => x.replace(/\*\*/g, '').replace(/\s+/g, ' ').trim())
      .join('\\n');
    if (seen.has(key)) continue;
    seen.add(key);
    deduped.push(chunk.join('\\n'));
  }
  return deduped.join('\\n\\n').trim();
};

    if (out.length >= (maxItems || 5)) return out.slice(0, maxItems || 5);

const calculateDistance = (lat1, lon1, lat2, lon2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
};
const extractYear = (text) => {
  if (!text) return null;
  const raw = String(text);
  const match = raw.match(/(\d{1,4})\s*年/);
  if (!match) return null;
  const y = parseInt(match[1], 10);
  if (!Number.isFinite(y)) return null;
  if (raw.includes('公元前') || raw.trim().startsWith('前')) return -y;
  return y;
};

const renderInline = (text) => {
  const raw = String(text || '');
  // 支持 Markdown 的 **加粗**。如果上游文本被截断导致 ** 不成对，兜底移除残留的 **，避免页面出现星号。
  const parts = raw.split(/(\*\*.*?\*\*)/g).filter(Boolean);
  return parts.map((p, idx) => {
    const m = p.match(/^\*\*(.+?)\*\*$/);
    if (m) {
      return <strong key={idx} className="font-extrabold text-gray-900">{m[1]}</strong>;
    }
    return <span key={idx}>{p.replaceAll('**', '')}</span>;
  });
};

const normalizeDisplayText = (text) => {
  return String(text || '')
    .replace(/\\r\\n/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/\\t/g, '  ')
    .trim();
};

const renderMdBlock = (text) => {
  const s = normalizeDisplayText(text);
  if (!s) return null;
  const LF = String.fromCharCode(10);
  const CR = String.fromCharCode(13);
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}`, 'g');
  const lines = s.split(splitRe);
  const out = [];
  let listBuf = [];
  const flushList = () => {
    if (!listBuf.length) return;
    const items = listBuf;
    listBuf = [];
    out.push(
      <ul key={`ul-${out.length}`} className="list-disc pl-5 space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm leading-relaxed">{renderInline(it)}</li>
        ))}
      </ul>
    );
  };
  for (let i = 0; i < lines.length; i++) {
    const t = String(lines[i] || '').trim();
    if (!t) {
      flushList();
      out.push(<div key={`sp-${i}`} className="h-2" />);
      continue;
    }
    const h1 = t.match(/^#{1,2}\s+(.*)$/);
    if (h1) {
      flushList();
      out.push(<div key={`h-${i}`} className="text-sm font-semibold">{renderInline(h1[1])}</div>);
      continue;
    }
    const li = t.match(/^(?:[-•]\s+)(.*)$/);
    if (li) {
      listBuf.push(li[1]);
      continue;
    }
    flushList();
    out.push(<div key={`p-${i}`} className="text-sm leading-relaxed">{renderInline(t)}</div>);
  }
  flushList();
  return <div className="space-y-1">{out}</div>;
};

const safeTruncateMdBold = (text, maxLen) => {
  const s = String(text || '');
  if (!maxLen || maxLen <= 0) return s;
  let out = '';
  let visible = 0;
  let inBold = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      out += '**';
      inBold = !inBold;
      i += 1;
      continue;
    }
    out += ch;
    visible += 1;
    if (visible >= maxLen) {
      out = out.trimEnd() + '…';
      break;
    }
  }
  if (inBold) out += '**';
  return out;
};

const renderTextbookPoints = (raw, options) => {
  // 兼容两种换行输入：
  // 1) 真实换行：LF / CRLF / CR
  // 2) 字面量换行：反斜杠 + n（可能出现 1 个或多个反斜杠）
  // 说明：这段 JS 位于 Python 三引号字符串里，为避免 Python 对转义序列做预解析，
  // 这里用 charCode 构造换行/反斜杠字符，再用正则 split 一次性切分。
  const LF = String.fromCharCode(10); // line feed
  const CR = String.fromCharCode(13); // carriage return
  const BS = String.fromCharCode(92); // backslash

  // 用 RegExp 构造器 split：匹配 CRLF / CR / LF / (一个或多个反斜杠 + n)
  const BS_RE = BS + BS;
  const splitRe = new RegExp(`${CR}${LF}|${CR}|${LF}|${BS_RE}+n`, 'g');

  const lines = String(raw || '').split(splitRe);
  const isStageHeading = (t) => /^(#{3,4}\s*)?(初中阶段|高中阶段)(考点)?\s*$/.test(String(t || '').trim());
  const expanded = Boolean(options && options.expanded);
  if (expanded) {
    return lines.map((line, idx) => {
      const rawLine = String(line || '');
      const leadingSpaces = rawLine.match(/^\s*/)[0].length;
      const t = rawLine.trim();
      if (!t) return <div key={idx} className="h-2" />;
      if (isStageHeading(t)) return null;
      if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

      const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
      const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

      if (t.startsWith('### ')) {
        const heading = t.replace(/^###\s*/, '');
        return (
          <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
            {renderInline(heading)}
          </h3>
        );
      }

      if (t.startsWith('#### ')) {
        const heading = t.replace(/^####\s*/, '');
        return (
          <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
            {renderInline(heading)}
          </h4>
        );
      }

      if (t.startsWith('- ')) {
        const body = t.slice(2).trim();
        const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
            <div>{renderInline(body)}</div>
          </div>
        );
      }

      const ordered = t.match(/^(\d+)\.\s+(.*)$/);
      if (ordered) {
        return (
          <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
            <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
            <div>{renderInline(ordered[2])}</div>
          </div>
        );
      }

      return (
        <p key={idx} className="text-sm leading-relaxed text-gray-700">
          {renderInline(t)}
        </p>
      );
    });
  }

  const kept = [];
  let sectionBulletCount = 0;
  let totalBulletCount = 0;
  const maxTotalBullets = 12;
  const maxBulletsPerSection = 4;
  const maxLineLen = 64;
  for (const line of lines) {
    const rawLine = String(line || '');
    const t = rawLine.trim();
    if (!t) {
      kept.push(rawLine);
      continue;
    }
    if (isStageHeading(t)) {
      continue;
    }
    if (/^-{3,}$/.test(t)) {
      kept.push('---');
      continue;
    }
    if (t.startsWith('### ') || t.startsWith('#### ')) {
      sectionBulletCount = 0;
      kept.push(rawLine);
      continue;
    }
    const isBullet = t.startsWith('- ') || /^\d+\.\s+/.test(t);
    if (isBullet) {
      totalBulletCount += 1;
      sectionBulletCount += 1;
      if (totalBulletCount > maxTotalBullets || sectionBulletCount > maxBulletsPerSection) {
        continue;
      }
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
      continue;
    }
    if (totalBulletCount < maxTotalBullets) {
      const normalized = safeTruncateMdBold(rawLine.replace(/\s+$/g, '').trim(), maxLineLen);
      kept.push(normalized);
    }
  }

  const prunedKept = kept.filter((line, idx) => {
    const t = String(line || '').trim();
    const isHeading = t.startsWith('### ') || t.startsWith('#### ');
    if (!isHeading) return true;
    for (let j = idx + 1; j < kept.length; j += 1) {
      const next = String(kept[j] || '').trim();
      if (!next || /^-{3,}$/.test(next)) continue;
      if (next.startsWith('### ') || next.startsWith('#### ')) return false;
      return true;
    }
    return false;
  });

  return prunedKept.map((line, idx) => {
    const rawLine = String(line || '');
    const leadingSpaces = rawLine.match(/^\s*/)[0].length;
    const t = rawLine.trim();
    if (!t) return <div key={idx} className="h-2" />;
    if (/^-{3,}$/.test(t)) return <hr key={idx} className="my-3 border-[#c8b496]/50" />;

    // Markdown 列表层级：0-1 空格为一级，2-3 空格为二级，4+ 空格为三级
    const level = leadingSpaces >= 4 ? 3 : (leadingSpaces >= 2 ? 2 : 1);
    const indentClass = level === 1 ? 'ml-0' : (level === 2 ? 'ml-4' : 'ml-8');

    if (t.startsWith('### ')) {
      const heading = t.replace(/^###\s*/, '');
      return (
        <h3 key={idx} className="mt-2 text-base font-bold text-[#7c2d12]">
          {renderInline(heading)}
        </h3>
      );
    }

    if (t.startsWith('#### ')) {
      const heading = t.replace(/^####\s*/, '');
      return (
        <h4 key={idx} className="mt-2 text-sm font-semibold text-gray-700">
          {renderInline(heading)}
        </h4>
      );
    }

    if (t.startsWith('- ')) {
      const body = t.slice(2).trim();
      const bullet = level === 1 ? '•' : (level === 2 ? '◦' : '▪');
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-[#c0392b]">{bullet}</span>
          <div>{renderInline(body)}</div>
        </div>
      );
    }

    const ordered = t.match(/^(\d+)\.\s+(.*)$/);
    if (ordered) {
      return (
        <div key={idx} className={`flex ${indentClass} gap-2 text-sm leading-relaxed text-gray-700`}>
          <span className="mt-[2px] text-gray-500">{ordered[1]}.</span>
          <div>{renderInline(ordered[2])}</div>
        </div>
      );
    }

    return (
      <p key={idx} className="text-sm leading-relaxed text-gray-700">
        {renderInline(t)}
      </p>
    );
  });
};

                        <img src={selectedLoc.poster.png} className="w-full rounded-lg border border-[#c8b496]/50" />
                      </a>
                    </div>
                  ) : null}
                  <div className="bg-[#fdf6e3] p-2 rounded border border-dashed border-[#c8b496]">
                    <p className="text-[#c0392b] text-[10px] uppercase font-bold">历史意义</p>
                    <div className="italic text-xs">{renderMdBlock(selectedLoc.significance) || renderInline(selectedLoc.significance)}</div>
                  </div>
                  {selectedLoc.quoteLines?.length ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>
                      <ul className="space-y-1">
                        {selectedLoc.quoteLines.map((q, idx) => (
                          <li key={idx} className="text-xs text-gray-700">{renderInline(q)}</li>
                        ))}
                      </ul>
                    </div>
                  ) : selectedLoc.works?.length ? (
                    <div>
                      <p className="text-gray-400 text-[10px] uppercase font-bold">名篇名句</p>
                      <ul className="list-disc pl-4 space-y-1">
                        {selectedLoc.works.map((w, idx) => (
                          <li key={idx} className="text-xs text-gray-700">《{w}》</li>
                        ))}
                      </ul>
                    </div>
                  ) : null}
                </div>
              </div>
            )}
          </div>
        </div>
        <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-white/70">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">相关人物知识图谱</h2>
              <p className="text-[11px] text-gray-500 mt-1">以当前人物为中心，优先展示师生、君臣、好友、宗亲等真实关联人物；仅在关系不足时才补充同时代人物。</p>
            </div>
            <div className="self-start text-[11px] px-2.5 py-1 rounded-full bg-amber-50 border border-[#c8b496]/50 text-[#7c2d12]">
              点击节点可跳转
            </div>
          </div>
          {relatedGraphLayout.length ? (
            <div className="space-y-4">
              <div className="related-graph-legend">
                <div className="related-graph-legend-item"><span className="related-graph-legend-dot"></span>中心人物在中间，相关人物按左右列展开</div>
                <div className="related-graph-legend-item"><span className="related-graph-legend-dot"></span>关系标签直接贴在人物卡片上，点击可跳转</div>
              </div>
              <div className="related-graph-stage border border-[#c8b496]/35">
                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                  {relatedGraphLayout.map((node, idx) => (
                    <g key={`edge-${idx}`}>
                      <line
                        x1="50"
                        y1="50"
                        x2={node.x}
                        y2={node.y}
                        stroke="rgba(124,45,18,0.18)"
                        strokeWidth="0.26"
                        strokeDasharray="0"
                      />
                    </g>
                  ))}
                </svg>
                <div className="related-graph-node" style={{ left: '50%', top: '50%' }}>
                  <div className="related-graph-link">
                    <div className="related-graph-card center">
                      <div className="related-graph-avatar">
                        <span className="text-2xl font-black tracking-wide">{String(relatedCenterNode.name || '').slice(0, 2)}</span>
                      </div>
                      <div className="related-graph-relation">中心人物</div>
                      <div className="related-graph-label center">{relatedCenterNode.name}</div>
                      <div className="related-graph-meta">{relatedCenterNode.dynasty || '当前人物'}</div>
                    </div>
                  </div>
                </div>
                {relatedGraphLayout.map((node, idx) => (
                  <div key={node.id || idx} className="related-graph-node" style={{ left: `${node.x}%`, top: `${node.y}%` }}>
                    <a href={getRelatedPersonHref(node)} className="related-graph-link">
                      <div className="related-graph-card">
                        <div className="related-graph-relation">{node.linkLabel || '相关人物'}</div>
                        <div className="related-graph-avatar">
                          <span className="text-lg font-black tracking-wide">{String(node.name || '').slice(0, 2)}</span>
                        </div>
                        <div className="related-graph-label">{node.name}</div>
                        <div className="related-graph-meta">{node.dynasty || '相关人物'}</div>
                      </div>
                    </a>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-500">暂未识别到可展示的相关人物关系。</div>
          )}
        </section>

        <section ref={chatSectionRef} className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-white/70">
          <div className="flex items-center justify-between gap-4 mb-3">
            <div>
              <h2 className="text-lg font-bold text-[#7c2d12]">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</h2>
              <p className="text-[11px] text-gray-500 mt-1">进入足迹内容后，以第一人称与人物对话（依据史实）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setChatOpen(v => !v)}
                className="text-[11px] px-3 py-1 rounded bg-[#c0392b] text-white hover:bg-[#a93226]"
              >
                {chatOpen ? '收起' : '开始对话'}
              </button>
            </div>
          </div>
          {chatOpen ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div ref={chatListRef} className="h-[340px] overflow-y-auto custom-scrollbar bg-white/70 border border-[#c8b496]/40 rounded-xl p-3 space-y-3">
                  {chatMessages.map((m, idx) => {
                    const isUser = m.role === 'user';
                    const bubbleClass = isUser
                      ? 'bg-[#c0392b] text-white ml-auto'
                      : 'bg-white text-gray-800 mr-auto';
                    const wrapClass = isUser ? 'justify-end' : 'justify-start';
                    const rawText = normalizeDisplayText(m.content);
                    return (
                      <div key={idx} className={`flex ${wrapClass}`}>
                        <div className={`max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 whitespace-pre-wrap break-words [overflow-wrap:anywhere] ${bubbleClass}`}>
                          {renderMdBlock(rawText) || renderInline(rawText)}
                        </div>
                      </div>
                    );
                  })}
                  {chatLoading ? (
                    <div className="flex justify-start">
                      <div className="max-w-[82%] rounded-2xl px-3 py-2 text-sm leading-relaxed shadow-sm border border-[#c8b496]/30 bg-white text-gray-700">
                        正在回应…
                      </div>
                    </div>
                  ) : null}
                </div>
                {chatError ? (
                  <div className="mt-2 text-[11px] text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">
                    {chatError}
                  </div>
                ) : null}
                <div className="mt-3 flex gap-2">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat(chatDraft);
                      }
                    }}
                    placeholder="输入一句话，按 Enter 发送"
                    className="flex-1 px-3 py-2 rounded-xl border border-[#c8b496]/50 bg-white/80 text-sm outline-none focus:ring-2 focus:ring-[#c0392b]/30"
                    disabled={chatLoading}
                  />
                  <button
                    onClick={() => sendChat(chatDraft)}
                    className="px-4 py-2 rounded-xl bg-[#c0392b] text-white text-sm disabled:opacity-50"
                    disabled={chatLoading || !String(chatDraft || '').trim()}
                  >
                    发送
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <div className="bg-[#fdf6e3] border border-dashed border-[#c8b496] rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-[#c0392b] mb-2">对话逻辑</p>
                  <ul className="text-[11px] text-gray-700 space-y-1 leading-relaxed">
                    <li>- 先直接回答问题，再用足迹材料作简短旁证。</li>
                    <li>- 问原理就讲原理，问作品就讲作品；不要反复背行程。</li>
                    <li>- 不确定信息用“存疑/史料未载”。</li>
                  </ul>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">建议开场</p>
                  <div className="flex flex-wrap gap-2">
                    {[
                      '你为何离开故乡？',
                      '你最艰难的一段行程是哪一次？',
                      '你如何看待当时的时代局势？',
                      '请从第一件足迹事件讲起。'
                    ].map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(q)}
                        className="text-[11px] px-2 py-1 rounded-full bg-gray-50 border border-gray-200 hover:bg-white"
                        disabled={chatLoading}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="bg-white/70 border border-[#c8b496]/40 rounded-xl p-3">
                  <p className="text-[10px] uppercase font-bold text-gray-500 mb-2">对照提示</p>
                  <div className="text-[11px] text-gray-700 leading-relaxed space-y-1">
                    <div>你也可以指着地图问：“此地发生了什么？当时我多少岁？为何如此？”</div>
                    <div>点击左侧事件后，再问“当时的心境/取舍/后果”。</div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="text-sm text-gray-600 leading-relaxed">
              若当前是静态演示版，仅支持浏览已生成内容；人物对话需要外部 FastAPI 后端。若你在本地开发，请通过服务方式打开页面后再进行对话。
            </div>
          )}
        </section>

        {mergedTeachingPoints ? (
          <section className="glass-panel p-6 rounded-xl shadow-sm border border-[#c8b496]/40 bg-amber-50/40">
            <div className="flex items-center justify-between gap-4 mb-3">
              <h2 className="text-lg font-bold text-[#7c2d12]">知识点</h2>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowTeachingFull(v => !v)}
                  className="text-[11px] px-2 py-1 rounded bg-white/70 border border-[#c8b496]/50 text-[#7c2d12] hover:bg-white"
                >
                  {showTeachingFull ? '收起' : '展开'}
                </button>
              </div>
            </div>
            <div className="space-y-1">
              {renderTextbookPoints(mergedTeachingPointsNormalized, { expanded: showTeachingFull })}
            </div>
          </section>
        ) : null}

      </div>
      <button
        onClick={() => {
          setChatOpen(true);
          setTimeout(() => {
            if (chatSectionRef.current && typeof chatSectionRef.current.scrollIntoView === 'function') {
              chatSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 30);
        }}
        className="fixed bottom-6 right-6 z-[1200] flex items-center gap-2 px-4 py-2 rounded-full bg-[#c0392b] text-white shadow-lg border border-white/20 hover:bg-[#a93226]"
      >
        <span className="inline-flex h-2 w-2 rounded-full bg-emerald-300"></span>
        <span className="text-sm font-semibold">{data.person?.name ? `跟${data.person.name}对话` : '与历史对话'}</span>
        {!chatOpen ? (
          <span className="text-[10px] px-1.5 py-0.5 rounded bg-white/15 border border-white/20">NEW</span>
        ) : null}
      </button>
      <footer className="text-center text-gray-400 text-[10px] py-8 border-t border-gray-200">
        <p>
          built by cuicheng(
          <a className="underline hover:text-gray-600" href="mailto:cuichengzi@foxmail.com">cuichengzi@foxmail.com</a>
          )
        </p>
      </footer>
    </div>
  );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
// exports disabled
    </script>
    <script>
      (() => {
        const tryTransform = () => {
          try {
            const root = document.getElementById("root");
            const empty = !root || root.childElementCount === 0;
            if (!empty) return;
            if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
              window.Babel.transformScriptTags();
            }
          } catch (_) {}
        };
        setTimeout(tryTransform, 0);
        setTimeout(tryTransform, 1500);
      })();
    </script>
</body>
</html>
