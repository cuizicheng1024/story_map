  background: linear-gradient(180deg, rgba(218, 220, 224, 0.24), rgba(197, 164, 118, 0.26), rgba(218, 220, 224, 0.24));
  border-radius: 999px;
  user-select: none;
  touch-action: none;
}
.journey-pane-resizer::before {
  content: "";
  position: absolute;
  inset: 50%;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(157, 124, 78, 0.52);
  box-shadow: 0 6px 18px rgba(84, 63, 37, 0.18);
}
.journey-pane-resizer.is-vertical {
  width: 10px;
  height: 100%;
  cursor: col-resize;
}
.journey-pane-resizer.is-vertical::before {
  width: 4px;
  height: 72px;
}
.journey-pane-resizer.is-horizontal {
  width: 100%;
  height: 10px;
  cursor: row-resize;
}
.journey-pane-resizer.is-horizontal::before {
  width: 84px;
  height: 4px;
}
.journey-chat-section {
  position: relative;
  z-index: 8;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  overflow: hidden;
}
.journey-chat-list,
.journey-chat-section .theme-soft-section,
.journey-chat-section .theme-panel-muted {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.98);
}
.journey-shell.is-exporting {
  overflow: visible;
}
.journey-shell.is-exporting .journey-shell-content {
  display: flex;
  flex-direction: column;
  height: auto;
  overflow: visible;
}
.journey-shell.is-exporting .journey-main-row {
  overflow: visible;
  flex: 0 0 auto;
}
.journey-shell.is-exporting .journey-chat-section,
.journey-shell.is-exporting .journey-timeline-column,
.journey-shell.is-exporting .journey-map-column {
  overflow: visible;
}
.map-3d-control-button {
  min-width: 36px;
  min-height: 32px;
}
.map-floating-controls {
  pointer-events: none;
}
.map-floating-controls > * {
  pointer-events: auto;
}
.map-control-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
}
.map-control-cluster {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.map-control-cluster.is-inline {
  flex-direction: row;
  gap: 8px;
  align-items: center;
}
.map-control-button {
  min-height: 52px;
  min-width: 52px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(218, 220, 224, 0.92);
}
.map-control-button.is-square {
  padding-left: 0;
  padding-right: 0;
}
.map-control-button.is-wide {
  min-width: 84px;
  padding-left: 14px;
  padding-right: 14px;
}
.map-zoom-stack {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}
.map-zoom-stack .map-control-button {
  border-radius: 0;
  min-width: 56px;
}
.map-zoom-stack .map-control-button:first-child {
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
}
.map-zoom-stack .map-control-button:last-child {
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
}
.map-zoom-stack .map-control-button + .map-control-button {
  border-top: none;
}
.map-layer-switch {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
}
.map-layer-trigger {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-bottom-button {
  min-height: 46px;
  min-width: 68px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.98), rgba(245, 236, 219, 0.99));
  border: 1px solid rgba(171, 140, 94, 0.34);
  box-shadow: 0 10px 22px rgba(84, 63, 37, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.82);
  color: #6b4724;
}
.map-compact-action-button {
  width: 52px;
  min-width: 52px;
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}
.map-layer-trigger:hover,
.map-bottom-button:hover {
  background: linear-gradient(180deg, rgba(255, 253, 249, 1), rgba(248, 239, 224, 1));
  border-color: rgba(157, 124, 78, 0.44);
  box-shadow: 0 14px 28px rgba(84, 63, 37, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.map-layer-trigger:active,
.map-bottom-button:active {
  box-shadow: 0 6px 14px rgba(84, 63, 37, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.map-bottom-button.is-accent-export {
  background: linear-gradient(180deg, rgba(244, 247, 255, 0.98), rgba(232, 237, 255, 0.98));
  border-color: rgba(109, 120, 255, 0.28);
  color: #4153b3;
}
.map-bottom-button.is-accent-export:hover {
  background: linear-gradient(180deg, rgba(249, 251, 255, 1), rgba(238, 242, 255, 1));
  border-color: rgba(89, 102, 230, 0.36);
  box-shadow: 0 14px 28px rgba(65, 83, 179, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
@media (min-width: 1024px) {
  .journey-main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
}
.map-layer-trigger-icon {
  width: 30px;
  height: 30px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(59, 88, 150, 0.96), rgba(44, 66, 119, 0.98));
  color: #f8fafc;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 6px 12px rgba(34, 50, 93, 0.24);
}
.map-layer-tray {
  position: absolute;
  right: calc(100% + 10px);
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(218, 220, 224, 0.82);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(0.98);
  transition: opacity 180ms ease, transform 180ms ease;
}
.map-layer-tray.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.map-layer-card {
  position: relative;
  width: 118px;
  height: 82px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.map-layer-card:hover {
  transform: translateY(-1px);
}
.map-layer-card.is-active {
  border-color: rgba(37, 99, 235, 0.82);
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
}
.map-layer-card-preview {
  position: absolute;
  inset: 0;
}
.map-layer-card-preview.is-vector {
  background:
    linear-gradient(0deg, rgba(74, 222, 128, 0.35), rgba(74, 222, 128, 0.35)) 0 72% / 100% 28% no-repeat,
    linear-gradient(90deg, rgba(255, 255, 255, 0.94) 0 22%, rgba(245, 245, 245, 0.94) 22% 24%, transparent 24% 100%),
    linear-gradient(180deg, transparent 0 36%, rgba(251, 191, 36, 0.75) 36% 43%, transparent 43% 100%),
    linear-gradient(90deg, transparent 0 48%, rgba(37, 99, 235, 0.52) 48% 52%, transparent 52% 100%),
    linear-gradient(180deg, #eef2f7 0%, #e5e7eb 100%);
}
.map-layer-card-preview.is-imagery {
  background:
    radial-gradient(circle at 58% 34%, rgba(245, 245, 245, 0.95) 0 18%, rgba(190, 242, 100, 0.78) 19% 28%, rgba(21, 128, 61, 0.88) 29% 37%, transparent 38%),
    radial-gradient(circle at 46% 58%, rgba(163, 230, 53, 0.74) 0 10%, rgba(21, 128, 61, 0.88) 11% 18%, transparent 19%),
    radial-gradient(circle at 38% 44%, rgba(96, 165, 250, 0.34) 0 12%, transparent 13%),
    linear-gradient(180deg, #0f172a 0%, #1d4ed8 18%, #38bdf8 44%, #0f766e 76%, #14532d 100%);
}
.map-layer-card-preview.is-terrain {
  background:
    linear-gradient(180deg, #cfe7ff 0 40%, #eff6ff 40% 48%, #8b5a3c 48% 100%),
    radial-gradient(circle at 24% 76%, rgba(74, 222, 128, 0.82) 0 13%, transparent 14%),
    radial-gradient(circle at 52% 70%, rgba(34, 197, 94, 0.8) 0 14%, transparent 15%),
    radial-gradient(circle at 76% 64%, rgba(132, 204, 22, 0.76) 0 11%, transparent 12%),
    linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,0.82) 42% 45%, transparent 45% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(120, 113, 108, 0.92) 54% 100%);
}
.map-layer-card-preview.is-terrain3d {
  background:
    linear-gradient(180deg, #93c5fd 0 42%, #e0f2fe 42% 48%, #64748b 48% 100%),
    linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,0.9) 18% 20%, transparent 20% 80%, rgba(255,255,255,0.9) 80% 82%, transparent 82% 100%),
    linear-gradient(180deg, transparent 0 54%, rgba(71, 85, 105, 0.96) 54% 100%);
}
.map-layer-card-preview.is-terrain3d::before,
.map-layer-card-preview.is-terrain3d::after {
  content: "";
  position: absolute;
  bottom: 26px;
  background: rgba(241, 245, 249, 0.96);
  border: 1px solid rgba(148, 163, 184, 0.78);
  box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
}
.map-layer-card-preview.is-terrain3d::before {
  left: 14px;
  width: 34px;
  height: 30px;
}
.map-layer-card-preview.is-terrain3d::after {
  left: 54px;
  width: 20px;
  height: 44px;
}
.map-layer-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.06) 0%, rgba(15, 23, 42, 0.2) 100%);
}
.map-layer-card-chip {
  position: absolute;
  left: 8px;
  top: 8px;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: #334155;
  background: rgba(255, 255, 255, 0.9);
}
.map-layer-card-title {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(37, 99, 235, 0.9);
}
.terrain-compass {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(218, 220, 224, 0.92);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
}
.terrain-compass-ring {
  position: absolute;
  inset: 12px;
  border-radius: 999px;
  border: 1px solid rgba(180, 185, 195, 0.45);
  background:
    linear-gradient(90deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(180, 185, 195, 0.32) 49%, rgba(180, 185, 195, 0.32) 51%, transparent 51%),
    rgba(248, 250, 252, 0.92);
}
.terrain-compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.1));
}
.terrain-compass-button {
  position: absolute;
  border: none;
  background: transparent;
  color: rgba(109, 113, 122, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 160ms ease, color 160ms ease, opacity 160ms ease;
}
.terrain-compass-button:hover {
  color: #1a73e8;
  transform: scale(1.06);
}
.terrain-compass-button:active {
  transform: scale(0.98);
}
.terrain-compass-button.is-left,
.terrain-compass-button.is-right {
  top: 50%;
  width: 18px;
  height: 30px;
  transform: translateY(-50%);
}
.terrain-compass-button.is-left {
  left: 7px;
}
.terrain-compass-button.is-right {
  right: 7px;
}
.terrain-compass-button.is-up,
.terrain-compass-button.is-down {
  left: 50%;
  width: 28px;
  height: 14px;
  transform: translateX(-50%);
}
.terrain-compass-button.is-up {
  top: 5px;
}
.terrain-compass-button.is-down {
  bottom: 5px;
}
.terrain-compass-button.is-center {
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
}
.terrain-compass-button.is-center:hover {
  background: rgba(26, 115, 232, 0.06);
}
.terrain-compass-icon {
  display: block;
  line-height: 1;
}
.terrain-compass-button.is-left .terrain-compass-icon,
.terrain-compass-button.is-right .terrain-compass-icon {
  font-size: 22px;
}
.terrain-compass-button.is-up .terrain-compass-icon,
.terrain-compass-button.is-down .terrain-compass-icon {
  font-size: 13px;
  font-weight: 700;
}
.terrain-compass-button.is-center .terrain-compass-icon {
  font-size: 10px;
  font-weight: 700;
  color: rgba(109, 113, 122, 0.88);
}
.map-canvas {
  position: absolute;
  inset: 0;
}
#map-maplibre.map-canvas,
#map-amap.map-canvas,
#map-cesium.map-canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
.map-canvas.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.map-lazy-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 320px at 18% 12%, rgba(59, 130, 246, 0.12), transparent 60%),
    linear-gradient(180deg, rgba(248, 250, 252, 0.86), rgba(241, 245, 249, 0.92));
  backdrop-filter: blur(2px);
}
.map-lazy-card {
  width: min(520px, 100%);
  border-radius: 24px;
  border: 1px solid rgba(171, 140, 94, 0.18);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
  padding: 20px 22px;
}
/* UX3: skeleton shimmer for the title placeholder while tiles are
   fetching. Painted into its own layer so the animation does not
   retrigger paint on parent cards. */
.map-lazy-title.is-skeleton {
  position: relative;
  color: transparent;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.08) 0%, rgba(15, 23, 42, 0.16) 50%, rgba(15, 23, 42, 0.08) 100%);
  background-size: 200% 100%;
  border-radius: 6px;
  will-change: background-position;
  contain: layout style paint;
  animation: map-lazy-shimmer 1.4s linear infinite;
}
@keyframes map-lazy-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .map-lazy-title.is-skeleton { animation: none; }
}
.map-lazy-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(124, 45, 18, 0.84);
}
.map-lazy-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
}
.map-lazy-copy {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--color-text-secondary);
}
.map-lazy-skeleton {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.map-lazy-skeleton > span {
  display: block;
  height: 72px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(226, 232, 240, 0.78), rgba(241, 245, 249, 0.96));
  border: 1px solid rgba(203, 213, 225, 0.78);
}
.map-lazy-actions {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.map-lazy-trigger {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #9d7c4e, #c18d4d);
  box-shadow: 0 10px 22px rgba(157, 124, 78, 0.24);
}
.map-lazy-trigger:disabled {
  opacity: 0.72;
  cursor: wait;
}
.map-lazy-hint {
  font-size: 12px;
  color: rgba(100, 116, 139, 0.92);
}
.map-fallback-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.map-fallback-overlay.is-active {
  opacity: 1;
}
.map-fallback-overlay-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#map-cesium,
#map-cesium .cesium-viewer,
#map-cesium .cesium-widget,
#map-cesium canvas {
  width: 100%;
  height: 100%;
}
#map-cesium .cesium-widget-credits,
#map-cesium .cesium-viewer-bottom {
  display: none !important;
}
.glass-panel {
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(218, 220, 224, 0.76);
  box-shadow: var(--shadow-md);
}
.desc-clamp {
  display: -webkit-box;
  line-clamp: 3;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.narrative-description {
  color: var(--color-text-secondary);
  font-size: 15px;
  line-height: 1.95;
  letter-spacing: 0.012em;
}
.narrative-description-line {
  display: block;
  margin-bottom: 0.48rem;
}
.narrative-description-line:last-child {
  margin-bottom: 0;
}
.narrative-description-line.is-lead {
  color: var(--color-text-primary);
}
.narrative-description-line.is-body {
  color: color-mix(in srgb, var(--color-text-secondary) 92%, #64748b 8%);
}
.narrative-sentence {
  display: inline;
}
.narrative-sentence.is-turning {

  font-weight: 600;
}
.narrative-inline-strong {
  font-weight: 800;
  color: var(--color-text-primary);
}
.narrative-inline-em {
  font-style: italic;

}
.narrative-inline-accent {

  color: color-mix(in srgb, var(--color-primary) 82%, #1d4ed8 18%);

.narrative-inline-time {

  color: #b45309;

.narrative-inline-place {

.narrative-inline-quote {

  font-weight: 700;
  color: color-mix(in srgb, #c0392b 82%, var(--color-primary) 18%);
}
.nl-turning {
  font-weight: 700;
  color: #b45309;
  border-bottom: 1.5px dashed #e67e22;

.nl-work {
  font-weight: 600;
  color: color-mix(in srgb, #1d4ed8 78%, var(--color-text-secondary) 22%);

.nl-place {
  font-weight: 600;
  color: #166534;
}
.nl-time {
  font-weight: 700;
  color: #b45309;
}
.narrative-description-line.is-lead .nl-event,
.narrative-description-line.is-lead .nl-turning,
.narrative-description-line.is-lead .nl-work,
.narrative-description-line.is-lead .nl-place,

  align-items: center;
  margin-right: 0.42rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;

  font-size: 0.78em;
  font-weight: 800;
  letter-spacing: 0.04em;
  vertical-align: baseline;
}
.narrative-watch-link {
  display: inline-flex;
  align-items: center;
  margin-right: 0.08rem;
  padding: 0.08rem 0.56rem;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--color-primary) 24%, rgba(255,255,255,0.9));

.narrative-watch-link:hover,
.narrative-watch-link:focus-visible {

.narrative-game-label {

  /* P1: promote to own layer + isolate paint to keep 60fps under load. */

/* UX1: honour user motion preference so we don't trigger vestibular
   disorders or distract users who have explicitly opted out. */

  .story-marker,
  .map-point-core,
  .selected-point-pin,
  .map-lazy-title.is-skeleton {
    animation: none !important;
    transition: none !important;
  }
}
/* UX6: a soft "draw on" effect for the active segment by varying
   line-blur on hover/select; combined with the will-change from P4 it
   stays GPU-accelerated. */
.map-canvas.is-selecting .maplibregl-canvas { cursor: pointer; }
.map-canvas.is-panning  .maplibregl-canvas { cursor: grabbing; }
/* UX7: hover preview tint to signal that a marker is interactive
   without committing to selection. */
.story-marker:hover .story-marker-badge {
  filter: brightness(1.05) saturate(1.15);
}
/* UX8: hide markers that fall outside the viewport so we save paint.
   (The library already does this via opacity=0; we add a low-power
   hint to keep the layout box but skip rasterisation.) */
.maplibregl-marker[data-out-of-view="true"] {
  visibility: hidden;
  pointer-events: none;
}
/* O3: per-segment direction arrow. The arrow sits at the segment
   midpoint and is rotated by JS to align with the segment's bearing.
   Use its own layer so transforms don't repaint the line layer.
   Visually disabled: arrows are no longer rendered on the trajectory
   line — the route markers alone convey direction. */
.map-segment-arrow {
  display: none !important;
  width: 14px;
  height: 14px;
  pointer-events: none;
  will-change: transform;
  contain: layout style paint;
}
.map-segment-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.18));
}
@media (prefers-reduced-motion: reduce) {
  .map-segment-arrow { display: none; }
}

ed_people": ["阿倍仲麻吕", "大祚荣", "高适", "郭子仪", "李世民", "李渊", "骆宾王", "上官婉儿", "松赞干布", "唐高宗", "武则天", "阎立本", "颜真卿", "虞世南"], "source_pages": ["阿倍仲麻吕", "大祚荣", "高适", "郭子仪", "李世民", "李渊", "骆宾王", "上官婉儿", "松赞干布", "唐高宗", "武则天", "阎立本", "颜真卿", "虞世南"], "era": "唐代（初唐）", "genre": "书信/论说文", "one_liner": "高适早年家境贫寒，游历于梁、宋（今河南开封、商丘）地区，过着“混迹渔樵”的生活，直至近五十岁才因人推荐中有道科，授封丘县尉", "summary": "高适早年家境贫寒，游历于梁、宋（今河南开封、商丘）地区，过着“混迹渔樵”的生活，直至近五十岁才因人推荐中有道科，授封丘县尉", "quote": "1. 《旧唐书》评价：“（婉儿）自通天以来，内掌诏命，掞丽可观……然其评品人才，文章取舍，颇为当时所称。", "quotes": ["1. 《旧唐书》评价：“（婉儿）自通天以来，内掌诏命，掞丽可观……然其评品人才，文章取舍，颇为当时所称。", "（婉儿）自通天以来，内掌诏命，掞丽可观……然其评品人才，文章取舍，颇为当时所称。", "教材可能引用《旧唐书》等史料，引导学生辩证看待其政治才能与历史功过。"], "quote_policy": "preferred"}}, "markdown": "# 武则天\n\n## 人物档案\n\n### 基本信息\n- **姓名**：武曌（zhào），又名武则天、武媚娘（一说名武照）。注：‘武照’为避讳或传说之名，学界多以‘武曌’为正式名。\n- **时代**：唐朝（唐太宗、高宗时期）、武周\n- **出生**：武德七年（公元624年），四川省广元市（利州；一说陕西省西安市）\n- **去世**：神龙元年十一月壬寅（公元705年12月16日），洛阳上阳宫仙居殿（今河南省洛阳市）\n- **享年**：约82岁（虚岁，一说81岁）\n- **主要身份**：皇帝、政治家、改革家、皇后、皇太后\n- **历史地位**：中国历史上唯一正统的女皇帝，其统治上承“贞观之治”，下启“开元盛世”，对唐朝的发展起到了承前启后的关键作用。\n- **主要成就**：建立武周王朝；改革科举制度，创立殿试（一说始于唐高宗时期）、武举；任用酷吏打击门阀，巩固中央集权；推行轻徭薄赋政策，重视农业生产；巩固并拓展了唐朝的疆域。\n\n### 生平概述\n武则天出身于官宦之家，十四岁入宫为唐太宗才人。太宗去世后，她入感业寺为尼。永徽年间，她被高宗李治召回宫中，迅速晋封为皇后。因高宗体弱，她逐渐参与朝政，与高宗并称“二圣”。高宗去世后，她作为皇太后临朝称制，并于天授元年（690年）改唐为周，自立为帝。在位期间，她打击关陇门阀，大力提拔科举出身的官员，社会经济得以持续发展。神龙元年（705年），宰相张柬之等发动“神龙政变”，逼迫其退位。同年冬，武则天于洛阳上阳宫崩逝，遗诏去帝号，称“则天大圣皇后”，与高宗合葬乾陵。\n\n---\n\n## 人生足迹地图说明\n- 🗺️ **行程概览**：一生主要活动于以两京（长安、洛阳）为核心的帝国政治中心，并曾巡幸嵩山、并州等地。\n- ⏱️ **时间跨度**：公元624年—705年，享年约82岁（虚岁，一说81岁）。\n- 📍 **地理范围**：大致覆盖今陕西（西安）、河南（洛阳、登封）、四川（广元）、山西（太原）等地。\n- 🌟 **重要节点数量**：核心地点约10个。\n\n---\n\n## 人生历程与重要地点（按时间顺序）\n### 🟢 出生地：存疑\n- **公元纪年**：约公元624年\n- **停留时间**：童年时期（约0-4岁）\n- **位置**：出生地存疑，主要有“利州（今四川省广元市）”与“长安（今陕西省西安市）”两种说法，待考。\n- **事迹**：其父武士彟时任利州都督（此为利州说依据之一），武则天可能在此地出生并度过幼年（存疑）。\n- **意义**：十四岁奉旨入宫前的那片山水，是她最后的自由。父亲的商贾胆识、母亲的严苛教养、耳闻中太宗英武的传说——种种早年际遇悄然沉淀，铸就了敢于在男权棋局中翻天覆地的果敢与刚毅\n\n### 📍 重要地点：长安（唐都城）\n- **公元纪年**：约637年—649年；651年—657年；660年—683年（多次居留）\n- **停留时间**：累计数十年，是其政治生涯的核心舞台。\n- **位置**：长安（今陕西省西安市）\n- **事迹**：1. **贞观十一年（637年）**：入宫为唐太宗才人，赐号“武媚”。2. **永徽年间**：从感业寺再度入宫，拜为昭仪，后立为皇后。3. **显庆以后**：因高宗风疾，开始协助处理政务，与高宗并称“二圣”。4. **光宅元年（684年）**：以皇太后身份临朝称制。\n- **意义**：唐朝政治中心，武则天从后宫走向权力巅峰的起点，也是她实施一系列政治改革、最终建立武周政权的决策中心。\n- **名篇名句**：《如意娘》：“看朱成碧思纷纷，憔悴支离为忆君。不信比来长下泪，开箱验取石榴裙。”\n\n### 📍 重要地点：感业寺\n- **公元纪年**：649年—651年\n- **停留时间**：约2年\n- **位置**：长安感业寺（遗址位于今陕西省西安市，具体位置存疑）\n- **事迹**：唐太宗去世后，作为无子嗣的妃嫔被送入感业寺削发为尼。\n- **意义**：人生低谷期，但在此地与唐高宗李治重逢，为其重返宫廷埋下伏笔。\n\n### 📍 重要地点：洛阳（东都/神都）\n- **公元纪年**：657年以后频繁往来；684年—705年常驻。\n- **停留时间**：后期主要执政与生活地，长达约20年。\n- **位置**：洛阳，武周时期改称“神都”（今河南省洛阳市）\n- **事迹**：1. **光宅元年（684年）**：临朝称制后，改东都为神都，进行大规模修建。2. **天授元年（690年）**：在洛阳则天楼登基称帝，改唐为周。3. **执政期间**：以洛阳为武周首都，处理全国政务。4. **神龙元年（705年）**：病重，宰相张柬之等在洛阳发动“神龙政变”，迫其退位。\n- **意义**：神龙政变后被迫禅位，李显复辟大唐——女皇龙袍褪下，武周时代就此翻篇。一代女主的政治传奇在此落幕，无字碑至今仍向历史发问：那座沉寂的旧都，曾见证过怎样的改天换日与无声退场？\n- **名篇名句**：《腊日宣诏幸上苑》：“明朝游上苑，火急报春知。花须连夜发，莫待晓风吹。”\n\n### 📍 重要地点：嵩山\n- **公元纪年**：万岁登封元年（696年）\n- **停留时间**：封禅活动期间\n- **位置**：嵩山（今河南省登封市）\n- **事迹**：举行封禅嵩山大典，加封“天册金轮大圣皇帝”尊号。\n- **意义**：通过封禅典礼，向天地宣告武周政权的合法性与权威，是其政治生涯的巅峰仪式之一。\n\n### 📍 重要地点：并州（故里）\n- **公元纪年**：显庆五年（660年）等\n- **停留时间**：巡幸期间\n- **位置**：并州文水（今山西省吕梁市文水县）\n- **事迹**：以皇后身份随高宗巡幸并州，在故里接见亲族百姓，并宴请当地官员民众。\n- **意义**：衣锦还乡，彰显个人与家族荣耀，同时安抚并州这一“龙兴之地”。\n\n### 📍 重要地点：乾陵\n- **公元纪年**：文明元年（684年）葬高宗；神龙二年（706年）武则天祔葬。\n- **停留时间**：身后永恒之地\n- **位置**：乾陵（今陕西省咸阳市乾县）\n- **事迹**：唐高宗李治与武则天的合葬墓。武则天去世后，遵其遗诏，去帝号，以“则天大圣皇后”身份葬入乾陵。\n- **意义**：最终归宿，其无字碑引发后世无尽评说，是其复杂历史评价的永恒象征。\n\n### 🔴 去世地：洛阳上阳宫\n- **公元纪年**：神龙元年十一月（705年12月）\n- **停留时间**：退位后至去世（约10个月）\n- **位置**：上阳宫仙居殿（遗址位于今河南省洛阳市，具体位置存疑）\n- **经过**：神龙政变后被迫退位，徙居上阳宫。唐中宗率百官为其上尊号“则天大圣皇帝”。同年十一月，武则天在上阳宫仙居殿病逝，遗诏称“则天大圣皇后”。\n- **意义**：生命终点与政治生涯的落幕之地，标志着武周时代的正式终结。\n- **名篇名句**：晚年所作《曳鼎歌》（创作时间存疑）：“羲农首出，轩昊膺期。唐虞继踵，汤禹乘时。天下光宅，海内雍熙。上玄降鉴，方建隆基。”\n\n---\n\n## 生平时间线\n\n| 年份 | 古称 | 现称 | 事件 |\n| --- | --- | --- | --- |\n| 武德七年（624年） | 出生地存疑 | 四川省广元市 | （年龄：0岁）出生（出生地存疑）。 |\n| 贞观十一年（637年） |  |  | （年龄：14岁）入宫为唐太宗才人。 |\n| 贞观二十三年（649年） | 感业寺 | 长安感业寺 | （年龄：26岁）太宗驾崩，入感业寺为尼。 |\n| 永徽二年（651年） |  |  | （年龄：28岁）奉诏再度入宫，拜为昭仪。 |\n| 永徽六年（655年） |  |  | （年龄：32岁）被立为皇后。 |\n| 显庆五年（660年） |  |  | （年龄：37岁）高宗风疾加重，开始参决政事，时称“二圣”。 |\n| 弘道元年（683年） |  |  | （年龄：60岁）高宗驾崩，中宗李显即位，武则天临朝称制。 |\n| 光宅元年（684年） | 洛阳（东都/神都） | 河南省洛阳市 | （年龄：61岁）废中宗，立睿宗李旦，改东都为神都。 |\n| 天授元年（690年） |  |  | （年龄：67岁）废睿宗，登基称帝，改唐为周，史称“武周”。 |\n| 万岁登封元年（696年） | 嵩山 | 河南省登封市 | （年龄：73岁）封禅嵩山。 |\n| 神龙元年（705年） | 出生地存疑 | 四川省广元市 | （年龄：82岁（存疑，一说81岁））神龙政变，被迫退位，徙居上阳宫。同年冬，崩逝。 |\n\n---\n\n## 历史影响\n\n### 对当时的影响\n武则天以皇后、太后、皇帝的身份执掌最高权力近半个世纪。她通过残酷的政治斗争，沉重打击了以长孙无忌、褚遂良为首的关陇贵族集团，为新兴庶族地主阶级的上升扫清了障碍。她进一步完善了科举制度，扩大了统治基础，使得大量寒门才俊得以进入权力中枢。在其治下，社会经济得以持续发展，人口增长，边疆基本保持稳定，为后来的“开元盛世”奠定了坚实的基础。\n\n### 对后世的影响\n1.  **政治典范**：作为中国历史上唯一的女皇帝，她的存在本身即是对传统“男尊女卑”观念的巨大冲击，为后世女性参政提供了想象空间。\n2.  **制度遗产**：她所确立的殿试、武举等制度被后世王朝长期沿用，深刻影响了中国古代的选官制度。\n3.  **文化符号**：其无字碑成为千古之谜，象征着功过是非留待后人评说的历史观，成为重要的文化意象。\n4.  **边疆治理**：她执政时期对突厥、吐蕃、契丹等政权的军事与外交策略，对唐朝中后期的边疆格局产生了深远影响。\n\n### 历史评价\n短评：千秋功过，后人评说。\n\n1.  **《旧唐书》评价**：“治乱，时也，存亡，势也。使桀、纣在上，虽十尧不能治；使尧、舜在上，虽十桀不能乱……武后夺嫡之谋也，振喉绝襁褓之儿，菹醢碎椒涂之骨，其不道也甚矣，亦奸人妒妇之恒态也。然犹泛延谠议，时礼正人，遵遗庙谟，高宗之覆辙，遵遗令以终制，颇识大体。及革命，虽宗室诛夷殆尽，而能用狄仁杰、娄师德、姚崇、宋璟，卒承其业，岂非聪明不惑者乎？”\n2.  **宋代司马光评价**：“虽滥以禄位收天下人心，然不称职者，寻亦黜之，或加刑诛。挟刑赏之柄以驾御天下，政由己出，明察善断，故当时英贤亦竞为之用。”\n3.  **现代史家评价**：郭沫若称其“政启开元，治宏贞观”。她是中国封建时代杰出的女政治家，其统治具有承上启下的关键作用，但其任用酷吏、放手招官等举措也带来了严重的负面影响。\n\n---\n\n## 人教版教材知识点\n\n### 初中阶段\n- **时代背景**：**唐朝**前期，经历**贞观之治**后，社会经济繁荣。\n- **关键事件**：**武则天**是中国历史上唯一的**女皇帝**。她原是唐高宗的皇后，后来称帝，改国号为**周**。\n- **统治措施**：她大力发展**科举制**，创立**殿试**和**武举**；重视农业生产。\n- **历史地位**：她的统治为后来的“**开元盛世**”奠定了基础，史称她的统治有“**贞观遗风**”。\n- **代表作品/思想**：无具体作品要求，但需知其**无字碑**引发后世讨论。\n- **常见易混点/对比点**：与**唐太宗**（贞观之治）、**唐玄宗**（开元盛世）的统治时期顺序与特点对比。\n\n### 高中阶段\n- **时代背景**：唐朝**关陇集团**势力强大，社会阶层趋于固化。\n- **关键事件**：通过残酷政治斗争，打击**长孙无忌**等关陇贵族；临朝称制与**改唐为周**。\n- **政治改革**：进一步完善科举，**创立殿试**（一说始于唐高宗时期），由皇帝亲自面试贡士；扩大**南选**；鼓励官员举荐人才。\n- **经济政策**：重视农业，编成《**兆人本业记**》颁行天下，作为地方官员劝农参考。\n- **军事与边疆**：收复**安西四镇**，设置**北庭都护府**，巩固了西北边防。\n- **统治特点**：**“政由己出”**，明察善断；任用酷吏（如**来俊臣**）打击政敌，但也重用贤臣（如**狄仁杰**、**姚崇**）。\n- **历史评价**：承前启后，有“**政启开元，治宏贞观**”之誉；其统治也存在**任用酷吏**、**放手招官**（导致官僚机构膨胀）等弊端。\n- **代表作品/思想**：了解其诗歌《**如意娘**》、《**腊日宣诏幸上苑**》体现的个人性格与权威。\n- **常见易混点/对比点**：与汉初**吕后**专权的异同；其“革命”（改朝换代）与传统**儒家伦理**的冲突。\n\n---\n\n## 初高中阶段考点\n\n### 初中阶段考点\n1.  **身份与称号**：中国历史上唯一的**女皇帝**。\n2.  **国号**：改唐为**周**（史称“武周”）。\n3.  **核心贡献**：大力发展科举制，创立**殿试**和**武举**。\n4.  **统治评价**：其统治为“**开元盛世**”奠定基础，有“**贞观遗风**”。\n5.  **重要遗迹**：与高宗合葬**乾陵**，立有著名的**无字碑**。\n6.  **易混点**：注意区分**唐太宗**（李世民）、**武则天**、**唐玄宗**（李隆基）的先后顺序和主要作为。\n\n### 高中阶段考点\n1.  **政治背景**：其上台与打击**关陇军事贵族集团**，扩大**庶族地主**政治参与有关。\n2.  **制度创新**：科举制方面，**殿试**由其创立（一说始于唐高宗时期），**武举**则为其明确设立。\n3.  **统治手段**：双重性——**任用酷吏**打击政敌以巩固权力 vs. **知人善任**，选拔了狄仁杰、姚崇、宋璟等名臣。\n4.  **经济措施**：重视农业，编撰农书《**兆人本业记**》。\n5.  **边疆经略**：军事上**收复安西四镇**，设立**北庭都护府**，巩固了对西域的统治。\n6.  **历史评价**：理解“**政启开元，治宏贞观**”的内涵；认识其统治的积极面（承上启下、促进社会流动）与消极面（酷吏政治、后期朝政腐败）。\n7.  **文化象征**：**无字碑**是其复杂历史评价的集中体现。\n8.  **对比分析**：与**吕后**专权的异同（是否称帝、制度性贡献等）；其称帝对**儒家纲常伦理**的冲击。\n\n---\n\n## 地点坐标\n| 现称 | 现代搜索地名 | 纬度 | 经度 |\n| --- | --- | --- | --- |\n| 四川省广元市 | 四川省广元市 | 32.435500 | 105.843600 |\n| 陕西省西安市 | 陕西省西安市 | 34.261000 | 108.942300 |\n| 河南省洛阳市 | 河南省洛阳市 | 34.619700 | 112.447700 |\n| 河南省登封市 | 河南省登封市 | 34.455200 | 113.044400 |\n| 山西省太原市 | 山西省太原市 | 37.870000 | 112.543700 |\n| 陕西省咸阳市乾县 | 陕西省咸阳市乾县 | 34.530800 | 108.239900 |\n", "relatedGraph": {"center": {"id": "武则天", "name": "武则天", "file": "武则天.html", "dynasty": "唐朝（唐太宗、高宗时期）、武周", "aliases": [], "birth_year": 624, "death_year": 705, "quote": "则天大圣皇后", "review": "千秋功过，后人评说。", "foreign_name": "", "main_role_label": "皇帝", "birthplace": "四川省广元市利州", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, "nodes": [{"id": "武则天", "name": "武则天", "file": "武则天.html", "dynasty": "唐朝（唐太宗、高宗时期）、武周", "aliases": [], "birth_year": 624, "death_year": 705, "quote": "则天大圣皇后", "review": "千秋功过，后人评说。", "foreign_name": "", "main_role_label": "皇帝", "birthplace": "四川省广元市利州", "birthplace_modern": "", "domain_tags": [], "has_story": true, "relationLabel": "中心人物", "isCenter": true}, {"id": "骆宾王", "name": "骆宾王", "file": "骆宾王.html", "dynasty": "唐代", "aliases": [], "birth_year": 619, "death_year": 684, "quote": "无人信高洁，谁为表予心？", "review"
