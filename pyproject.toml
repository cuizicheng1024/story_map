[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storymap"
version = "0.1.0"
description = "StoryMap build and serving utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pypinyin>=0.53.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".cache",
  ".git",
  ".trae",
  ".venv",
  ".venv311",
  "artifacts",
  "batch_runs",
  "data",
  "storymap/examples/story",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
